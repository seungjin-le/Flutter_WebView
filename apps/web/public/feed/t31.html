<title>가을 구황작물 테스트</title>
<style>
:root{--desk:#3a8f8a;--bg:#3a8f8a;--paper:#fff;--ink:#141414;--on:#000;--chrome:#d4d0c8;--bar:#1f3fa0;--em:#c00000;--act:#ffd400;--c:#f2d489;--title-font:system-ui,sans-serif;--body-font:ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink)}
button{font-family:var(--title-font);font-weight:400;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;font-family:var(--body-font);font-weight:500}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
h1,h2,p{margin:0;word-break:keep-all}
.scr{position:absolute;inset:0;overflow:hidden;padding:calc(10px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(10px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px))}
.cv{background:var(--paper);border:2px solid var(--ink);box-shadow:inset 2px 2px #888}
.bar{background:var(--bar);color:#fff;padding:5px 8px;font-size:clamp(12px,2.2vh,16px);line-height:1.3}
.ttl{font-family:var(--title-font);font-weight:400;font-size:clamp(30px,5.8vh,40px);letter-spacing:-.02em;line-height:1.13}
.ttl em{font-style:normal;color:var(--em)}
.btn{min-height:64px;padding:7px 14px;background:var(--chrome);color:var(--ink);border:2px solid var(--ink);border-radius:0;font-size:clamp(18px,3vh,22px);box-shadow:inset -3px -3px #888,inset 3px 3px #fff}
.btn:active{box-shadow:inset 3px 3px #888;background:#bdb9b2}
.btn:focus-visible,.opt:focus-visible{outline:3px dashed var(--em);outline-offset:2px}
.pal{display:flex;gap:3px;align-items:center}
.pal i{display:block;width:clamp(13px,3.6vw,23px);aspect-ratio:1;border:2px solid var(--ink);background:#fff}
.pal i.filled{background:var(--c)}
.dd{position:absolute;pointer-events:none;shape-rendering:crispEdges;color:var(--ink)}
#start{display:flex;flex-direction:column;gap:clamp(7px,1.5vh,13px);padding-top:calc(60px + var(--lb-safe-top,0px))}
.start-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.start-label{font-size:12px;background:#fff;padding:3px 5px;border:1px solid}
.start-title{background:#fff;border:1px dashed;padding:7px 9px;position:relative}
.hook{font-size:clamp(14px,2.5vh,17px);line-height:1.5}
.start-art{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 22px}
.start-art .art{height:100%;width:100%;min-height:0;max-height:340px}
.start-art .dd{right:3px;top:18%;width:47px;height:65px}
.art{display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.art img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}
.initial{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--c);border:3px solid var(--ink);font-family:var(--title-font);font-size:clamp(40px,14vh,100px)}
.start-art .initial{max-width:220px;max-height:220px;aspect-ratio:1;border-radius:45% 39% 43% 34%}
.start-bottom{display:flex;flex-direction:column;gap:8px}
.start-bottom .btn{width:100%;background:#ffd400}
.small-caption{font-size:12px;text-align:center;line-height:1.3}
#play{display:flex;flex-direction:column;gap:clamp(7px,1.7vh,14px)}
#hud{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:24px}
#sc{font-size:clamp(16px,2.7vh,20px);background:#fff;padding:3px 6px;border:1px solid;white-space:normal;font-variant-numeric:tabular-nums}
#hud .pal{flex:1;justify-content:flex-end}
.chat-label{font-size:clamp(12px,2.2vh,16px);display:flex;align-items:center;gap:7px}
.chat-label:before{content:"";width:12px;height:12px;background:#f2c230;border:2px solid;flex-shrink:0}
.question-wrap{position:relative;flex:1;min-height:55px;display:flex;align-items:center}
.box{position:relative;width:100%;background:#fff;border:2px solid;padding:clamp(10px,2.5vh,19px) 13px}
.box:before{content:"";position:absolute;left:14px;bottom:-9px;width:12px;height:12px;background:#fff;border-right:2px solid;border-bottom:2px solid;transform:skewY(30deg)}
#question{font-size:clamp(19px,3.8vh,24px);line-height:1.5;font-weight:500}
#options{display:flex;flex-direction:column;gap:clamp(5px,1.1vh,9px)}
.opt{position:relative;display:flex;align-items:center;gap:10px;text-align:left;min-height:clamp(48px,9.6vh,70px);width:100%;padding:8px 11px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-family:var(--body-font);font-size:clamp(17px,3.05vh,20px);line-height:1.35;overflow:hidden}
.opt i{font-style:normal;font-size:16px;display:flex;align-items:center;justify-content:center;flex:0 0 28px;height:28px;border:2px solid;background:var(--option-color,#ffd400)}
.opt span{position:relative}
.opt.on{background:var(--c)}
.opt.on i{background:#fff}
.opt:active{background:var(--c)}
.opt.enter{animation:arrive .16s ease-out both}
@keyframes arrive{from{opacity:.4;translate:0 4px}to{opacity:1;translate:0 0}}
#cursor{position:absolute;width:35px;height:45px;right:5px;bottom:1px;pointer-events:none}
#notice{font-size:12px;min-height:16px;text-align:right;line-height:1.3}
#judge{display:flex;flex-direction:column;justify-content:center;gap:18px}
.judge-card{padding:20px 14px;display:flex;flex-direction:column;gap:16px}
.prog{display:flex;gap:3px;padding:4px;background:#fff;border:2px solid;height:31px}
.prog i{flex:1;background:var(--chrome)}
.prog i.full{background:var(--bar)}
#over{padding:0;background:var(--desk)}
#rp{height:100%;width:100%;overflow:hidden}
#rp section{height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,12px);color:var(--ink)}
.page-header{flex-shrink:0}
.result-art{flex:1;min-height:35px;margin:4px 8px;padding:3px;background:#fff;outline:2px dashed var(--ink);outline-offset:3px}
.result-art .art{width:100%;height:100%}
.result-art .initial{border:0}
#final{font-size:clamp(29px,5.8vh,40px);text-align:center}
.result-title{padding:7px 5px;background:#fff;border:2px solid;flex-shrink:0}
.share-line{text-align:center;font-size:clamp(14px,2.6vh,17px);line-height:1.4;background:#fff;padding:5px;flex-shrink:0}
#why{font-size:clamp(12px,2.2vh,16px);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--c);border:2px solid;padding:7px;font-size:clamp(16px,2.7vh,18px);line-height:1.25}
.detail-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,3vh,24px);padding:clamp(10px,2.7vh,20px) 13px;background:#fff;border:2px solid}
#description{font-size:clamp(16px,2.9vh,20px);line-height:1.75;word-break:keep-all}
#description p+p{margin-top:12px}
.lb-rec{font-size:clamp(14px,2.5vh,17px);border-top:2px dashed;padding-top:10px;line-height:1.5}
.detail-label{font-family:var(--title-font);font-size:clamp(22px,4vh,29px);line-height:1.2}
.match-grid{display:flex;gap:10px;flex:1;min-height:0}
.match{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid}
.match .bar{font-size:clamp(12px,2.1vh,15px);padding:6px;text-align:center}
.match .art{flex:1;min-height:25px;padding:6px}
.match-name{padding:6px 3px;font-size:clamp(15px,2.7vh,20px);font-family:var(--title-font);text-align:center;line-height:1.3;border-top:1px solid}
.match-caption{font-size:clamp(14px,2.6vh,17px);line-height:1.45;background:#fff;border:2px solid;padding:9px}
.result-buttons{display:flex;gap:10px;flex-shrink:0}
.result-buttons .btn{flex:1;min-width:0;padding:7px 4px}
#sub{font-size:12px}
.signal{animation:signal .16s steps(1) 4}
@keyframes signal{50%{background:#fff;color:#000}}
@media(max-height:460px){
#start{padding-top:calc(10px + var(--lb-safe-top,0px));gap:5px}
.start-head{display:none}
.ttl{font-size:27px}
.hook{font-size:13px;line-height:1.25}
.start-title{padding:4px 7px}
.start-art{padding:4px 15px}
.start-bottom{gap:3px}
.small-caption{display:none}
.btn{min-height:64px;font-size:18px}
#play{gap:5px;padding-top:calc(5px + var(--lb-safe-top,0px));padding-bottom:calc(5px + var(--lb-safe-bottom,0px))}
#hud{min-height:20px}
#sc{font-size:14px;padding:1px 5px}
.chat-label,#notice{display:none}
.question-wrap{min-height:36px}
.box{padding:5px 9px}
#question{font-size:18px;line-height:1.25}
#options{gap:3px}
.opt{min-height:48px;padding:5px 8px;font-size:16px}
.opt i{width:24px;height:24px;flex-basis:24px}
#rp section{gap:5px}
.bar{padding:3px 6px}
#why{font-size:12px}
#final{font-size:27px}
.result-title{padding:3px}
.share-line{padding:3px;font-size:13px}
.detail-body{padding:8px;gap:8px}
.chip{font-size:16px;padding:4px}
#description{font-size:16px;line-height:1.4}
#description p+p{margin-top:5px}
.lb-rec{font-size:13px;padding-top:5px}
.detail-label{font-size:22px}
.match-caption{font-size:13px;padding:5px}
.match-name{font-size:15px;padding:3px}
.match .bar{font-size:12px}
}

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="start" class="scr">
  <div class="start-head">
    <span class="start-label">가을 동네 소식</span>
    <div class="pal" aria-hidden="true"><i style="background:#3fa7a0"></i><i style="background:#f2c230"></i><i style="background:#a8456b"></i><i style="background:#c9a45c"></i></div>
  </div>
  <h1 class="ttl start-title">가을 <em>구황작물</em><br>테스트</h1>
  <p class="hook">너, 가을 감자가 맛있단다<br>내 성격도 캐 보면 나옴 ㅋㅋ</p>
  <div class="start-art">
    <div id="coverArt" class="art"></div>
    <svg class="dd" viewBox="0 0 48 65" aria-hidden="true"><path d="M5 4 8 45 19 35 30 56 38 51 26 31 43 28Z" fill="#fff" stroke="currentColor" stroke-width="3"/><path d="m2 59 7-5m30-45 6-5" fill="none" stroke="currentColor" stroke-width="3"/></svg>
  </div>
  <div class="start-bottom">
    <button id="go" class="btn" type="button">테스트 시작</button>
    <p class="small-caption">동네 일상으로 캐 보는 내 성격</p>
  </div>
</div>

<div id="play" class="scr" hidden>
  <div id="hud">
    <b id="sc">1/10</b>
    <div id="progress" class="pal" aria-hidden="true"></div>
  </div>
  <div id="place" class="chat-label">친구 단톡방</div>
  <div class="question-wrap"><div class="box"><h2 id="question"></h2></div></div>
  <div id="options"></div>
  <p id="notice">동네 알림 · 끌리는 답 하나 고르면 됨</p>
</div>

<div id="judge" class="scr" hidden>
  <div class="cv judge-card">
    <div class="bar">동네 알림</div>
    <h2 class="ttl">통 채우는 중…</h2>
    <p class="hook">구황작물 성격 캐내는 중임</p>
    <div id="loading" class="prog" aria-hidden="true"></div>
  </div>
</div>

<div id="over" class="scr" hidden>
  <div id="rp">
    <section>
      <div class="page-header bar"><p id="why">내 성격 구황작물이 나왔어!</p></div>
      <div class="result-art"><div id="resultArt" class="art"></div></div>
      <div class="result-title"><h2 id="final" class="ttl"></h2></div>
      <p id="shareLine" class="share-line"></p>
    </section>
    <section>
      <div class="bar">단톡에 올라온 내 사용 설명</div>
      <h2 class="detail-label">이 작물, 이런 성격임</h2>
      <div id="chips" class="chips"></div>
      <div class="detail-body">
        <div id="description"></div>
        <p id="record" class="lb-rec"></p>
      </div>
    </section>
    <section>
      <div class="bar">오늘의 구황작물 짝꿍</div>
      <div class="match-grid">
        <div class="match">
          <div class="bar">잘 맞는 유형</div>
          <div id="goodArt" class="art"></div>
          <p id="goodName" class="match-name"></p>
        </div>
        <div class="match">
          <div class="bar">안 맞는 유형</div>
          <div id="badArt" class="art"></div>
          <p id="badName" class="match-name"></p>
        </div>
      </div>
      <p id="matchCaption" class="match-caption"></p>
      <p id="sub" hidden></p>
      <div class="result-buttons">
        <button id="again" class="btn" type="button">다시 하기</button>
        <button id="rank" class="btn" type="button">결과 공유</button>
      </div>
    </section>
  </div>
</div>
</div>

function artInto(el,n){
 el.replaceChildren();
 const data=types[n],url=lb.assets.url(ART[n]);
 el.style.setProperty('--c',data.c);
 const fallback=()=>{
   el.replaceChildren();
   const box=document.createElement('div');
   box.className='initial';box.textContent=data.name[0];
   box.setAttribute('role','img');box.setAttribute('aria-label',data.name);
   el.appendChild(box);
 };
 if(!url){fallback();return;}
 const img=document.createElement('img');
 img.alt=data.name;img.draggable=false;
 img.addEventListener('error',fallback,{once:true});
 img.src=url;el.appendChild(img);
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);
 ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;
 render();
}

 }
}

function selectAnswer(i,x,y){
 if(state!=='play'||locked||paused)return;
 locked=true;chosen=i;wait=.38;
 const answer=questions[index].a[i][1];
 answers.push(answer.map(a=>a.slice()));
 answer.forEach(([n,v])=>points[n]+=v);
 const button=$('options').children[i];
 button.classList.remove('enter');button.classList.add('on');
 button.setAttribute('aria-pressed','true');

 svg.appendChild(path);button.appendChild(svg);

function resolve(){
 const max=Math.max(...points);
 let candidates=tieOrder.filter(n=>points[n]===max);
 for(let i=answers.length-1;i>=0&&candidates.length>1;i--){
   const weights=new Map(answers[i]);
   const strongest=Math.max(...candidates.map(n=>weights.get(n)||0));
   candidates=candidates.filter(n=>(weights.get(n)||0)===strongest);
 }
 return candidates[0];
}

 $('judge').querySelector('.bar').classList.remove('signal');
 void $('judge').offsetWidth;
 $('judge').querySelector('.bar').classList.add('signal');
}
function result(){
 state='over';overAt=clock;
 const r=types[outcome];
 document.documentElement.style.setProperty('--c',r.c);
 $('final').textContent=r.name;
 $('shareLine').textContent=r.line;
 artInto($('resultArt'),outcome);
 $('chips').replaceChildren();
 r.chips.forEach(text=>{
   const chip=document.createElement('span');chip.className='chip';chip.textContent=text;
   $('chips').appendChild(chip);
 });
 $('description').replaceChildren();
 r.desc.forEach(text=>{
   const p=document.createElement('p');p.textContent=text;$('description').appendChild(p);
 });
 $('record').textContent='동네에서 맡는 역할 · '+r.role;
 $('goodName').textContent=types[r.good].name;
 $('badName').textContent=types[r.bad].name;
 artInto($('goodArt'),r.good);artInto($('badArt'),r.bad);
 $('matchCaption').textContent=r.match;
 $('judge').hidden=true;$('over').hidden=false;
 lb.pages(document.getElementById("rp"), { result: r.name });
 lb.fx.confetti();
}
function update(dt){
 t+=dt;
 if(locked){
   wait-=dt;
   if(wait<=0){
     if(index===questions.length-1){
       die(W/2,H/2,'내 성격 구황작물이 나왔어!',true);
     }else{
       index++;locked=false;chosen=-1;showQuestion();
     }
   }
 }
}
function drawLeaf(x,y,size,angle,color){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);
 ctx.fillStyle=color;ctx.strokeStyle='#1b2927';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(-size,0);ctx.lineTo(-size*.3,-size*.7);
 ctx.lineTo(size*.2,-size);ctx.lineTo(size*.75,-size*.4);
 ctx.lineTo(size,.2*size);ctx.lineTo(size*.1,size*.6);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(-size*.5,size*.6);ctx.lineTo(size*.4,-size*.4);ctx.stroke();ctx.restore();
}
function drawBackground(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle=PAL[0];ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#2b7b75';ctx.lineWidth=3;
 const ground=H*.86;
 ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground+5);ctx.stroke();
 ctx.fillStyle='#61b5ac';
 ctx.beginPath();ctx.moveTo(0,H*.32);ctx.lineTo(30,H*.29);ctx.lineTo(36,ground);ctx.lineTo(0,ground);ctx.fill();
 ctx.beginPath();ctx.moveTo(W-35,ground);ctx.lineTo(W-29,H*.4);ctx.lineTo(W,H*.36);ctx.lineTo(W,ground);ctx.fill();
 ctx.strokeStyle='#276d69';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(W-13,ground);ctx.lineTo(W-17,H*.22);ctx.lineTo(W-44,H*.22-3);ctx.lineTo(W-47,H*.28);ctx.stroke();
 ctx.fillStyle='#e2c56e';ctx.fillRect(W-51,H*.27,14,10);
 ctx.strokeRect(W-51,H*.27,14,10);
 ctx.fillStyle='#f5e6c8';ctx.strokeStyle='#276d69';
 ctx.fillRect(2,H*.46,24,15);ctx.strokeRect(2,H*.46,24,15);
 ctx.beginPath();ctx.moveTo(7,H*.46);ctx.lineTo(8,H*.43);ctx.moveTo(19,H*.46);ctx.lineTo(18,H*.43);ctx.stroke();
 if(!leaves.length){
   drawLeaf(W*.04,H*.8,7,.3,'#c9a45c');
   drawLeaf(W*.95,H*.58,6,-.3,'#f2c230');
 }else{
   leaves.forEach((leaf,i)=>{
     const elapsed=reduce?0:clock;
     const yy=(leaf.y*H+elapsed*leaf.v)%(H+20)-10;
     const xx=leaf.x*W+Math.sin(elapsed*.6+leaf.p)*8;
     drawLeaf(xx,yy,leaf.s,leaf.p+Math.sin(elapsed*.5)*.3,i%2?'#c9a45c':'#f2c230');
   });
 }
}
function render(){
 if(!W||!H)return;
 drawBackground();
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(paused)return;
 clock+=dt;
 if(state==='play'){
   acc+=dt;
   while(acc>=STEP&&state==='play'){update(STEP);acc-=STEP;}
 }else if(state==='dying'){
   endT-=dt;
   const fill=Math.min(10,Math.floor((.68-Math.max(0,endT))/.068));
   [...$('loading').children].forEach((el,i)=>el.classList.toggle('full',i<fill));
   if(endT<=0)result();
 }
 render();
}
for(let i=0;i<10;i++){
 $('progress').appendChild(document.createElement('i'));
 $('loading').appendChild(document.createElement('i'));
}
artInto($('coverArt'),0);
lb.assets.font('font/dohyeon').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/galmuri11').then(v=>document.documentElement.style.setProperty('--body-font',v));
if(window.matchMedia)reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{
 if(state==='over'&&clock-overAt>.5)start();
});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 lb.share('내 구황작물은 '+types[outcome].name+'임. '+types[outcome].line+'. 너는 무슨 작물?');
});
lb.onPause(p=>{paused=p;last=0;});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
