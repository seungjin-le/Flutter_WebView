<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>야식 참기 제일 힘든 혈액형</title>
<style>
  /* 기본 색(원본 «TV 퀴즈쇼 랭킹») — 실행 팔레트가 오면 그 값으로 바뀌어요 */
  :where(:root){--bg:#1A102F;--card:#2A1B4E;--ink:#FFFFFF;--sub:#B4AAC8;--line:#4A3578;--accent:#FF3B30;--accent-ink:#FFFFFF;--soft:#3A2368;--soft2:#120A22;--heart:#FF9F0A;--gold:#FFD60A}
  :root{
    /* 팔레트에서 파생: 금색 글자는 바탕이 밝아도 읽히도록 글자색과 섞어요 */
    --hl: color-mix(in srgb, var(--gold) 62%, var(--ink));
    --tint: color-mix(in srgb, var(--gold) 14%, transparent);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
  html, body { overflow-x: hidden; }
  body {
    background-color: var(--soft2);
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app-container {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 40%, var(--card) 0%, var(--bg) 75%);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
  }

  .spotlight-container {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden; z-index: 0; opacity: 0.5;
  }
  .spotlight {
    position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; max-height: 1600px;
    background: conic-gradient(from 0deg at 50% 50%, var(--tint) 0deg, transparent 30deg, transparent 150deg, var(--tint) 180deg, transparent 210deg, transparent 330deg, var(--tint) 360deg);
    animation: rotateSpotlight 15s linear infinite;
  }
  @keyframes rotateSpotlight { to { transform: rotate(360deg); } }

  .screen {
    display: none; flex-direction: column; padding: 24px 20px 32px;
    position: relative; z-index: 1; min-height: 100vh; width: 100%;
  }
  .screen.active { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* 시작 화면 */
  #screen-start { justify-content: space-between; text-align: center; gap: 18px; }
  .onair {
    display: inline-block; font-size: 12px; font-weight: 900; letter-spacing: 2px;
    color: var(--accent-ink); background: var(--accent); padding: 3px 10px; border-radius: 6px;
    animation: blink 1.6s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0.55; } }
  .header-title {
    font-size: 24px; font-weight: 900; color: var(--hl); line-height: 1.3;
    text-shadow: 0 0 10px color-mix(in srgb, var(--gold) 45%, transparent); margin-top: 12px;
  }
  .header-sub { font-size: 13px; color: var(--sub); margin-top: 8px; line-height: 1.45; }
  .header-intro { font-size: 14px; color: var(--ink); margin-top: 10px; font-weight: 700; line-height: 1.45; }

  .preview-stage {
    background: color-mix(in srgb, var(--soft2) 55%, transparent);
    border: 2px solid color-mix(in srgb, var(--gold) 45%, transparent);
    border-radius: 20px; padding: 14px 10px 16px;
  }
  .preview-label { font-size: 12px; font-weight: 900; color: var(--hl); margin-bottom: 10px; letter-spacing: 1px; }
  .preview-row { display: flex; justify-content: space-around; align-items: flex-start; gap: 6px; }
  .preview-item { flex: 1; min-width: 0; text-align: center; }
  .preview-item img {
    width: 64px; height: 64px; object-fit: cover; border-radius: 12px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }
  .preview-item.first img { width: 76px; height: 76px; border: 3px solid var(--gold); }
  .preview-item span { display: block; font-size: 12px; margin-top: 6px; color: var(--hl); font-weight: bold; line-height: 1.3; }

  .buzzer-btn {
    background: var(--accent);  /* 단색 — 글자(--accent-ink)와 대비가 늘 맞게 */
    border: 6px solid var(--gold); border-radius: 50%;
    width: 130px; height: 130px; margin: 0 auto 16px auto; padding: 8px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 0 color-mix(in srgb, var(--accent) 40%, black), 0 15px 25px color-mix(in srgb, var(--accent) 50%, transparent);
    transition: transform 0.1s, box-shadow 0.1s;
    position: relative; z-index: 2;
  }
  .buzzer-btn:active {
    transform: translateY(8px);
    box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 40%, black), 0 5px 10px color-mix(in srgb, var(--accent) 50%, transparent);
  }
  .buzzer-text { color: var(--accent-ink); font-size: 20px; font-weight: 900; line-height: 1.2; }
  .start-hint { font-size: 12px; color: var(--sub); }

  /* 질문 화면 */
  #screen-question { align-items: center; text-align: center; padding-top: 28px; }
  .quiz-box {
    background: color-mix(in srgb, var(--ink) 5%, transparent); border: 2px solid var(--gold);
    border-radius: 16px; padding: 18px 16px; margin-bottom: 20px; width: 100%;
    box-shadow: inset 0 0 15px color-mix(in srgb, var(--gold) 22%, transparent);
    position: relative;
  }
  .quiz-tag {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 900;
    padding: 3px 12px; border-radius: 10px; white-space: nowrap;
  }
  .quiz-intro { font-size: 14px; font-weight: bold; line-height: 1.45; color: var(--ink); margin-bottom: 10px; }
  .quiz-intro:empty { display: none; }
  .quiz-q { font-size: 18px; font-weight: 900; color: var(--hl); line-height: 1.35; }
  .quiz-count { font-size: 12px; color: var(--sub); margin-top: 8px; }

  .options-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; }
  .option-card {
    background: linear-gradient(135deg, var(--card) 0%, var(--soft) 100%);
    border: 2px solid var(--line); border-radius: 12px;
    padding: 22px 10px; cursor: pointer; text-align: center;
    transition: transform 0.15s, border-color 0.15s; box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    position: relative; min-width: 0;
    display: flex; align-items: center; justify-content: center; min-height: 72px;
    color: var(--hl); font: inherit;
  }
  .option-card:hover, .option-card:focus-visible { border-color: var(--gold); transform: translateY(-2px); outline: none; }
  .option-card.picked { border-color: var(--gold); background: var(--accent); color: var(--accent-ink); animation: pickFlash 0.25s steps(2) 3; }
  @keyframes pickFlash { 50% { filter: brightness(1.35); } }
  .opt-no {
    position: absolute; top: 5px; left: 7px; font-size: 12px; font-weight: 900;
    color: var(--sub); pointer-events: none; line-height: 1;
  }
  .option-card.picked .opt-no { color: var(--accent-ink); }
  .opt-text { font-size: 18px; font-weight: 900; pointer-events: none; line-height: 1.25; }
  /* 4개 이하: 원본처럼 큰 보기판 */
  .options-grid.few { gap: 14px; }
  .options-grid.few .option-card { min-height: 110px; padding: 26px 10px; }
  .options-grid.few .opt-text { font-size: 22px; }
  .options-grid.few .opt-no { font-size: 14px; top: 8px; left: 10px; }
  /* 선택지가 많을 때: 칸을 줄이고 3열로 */
  .options-grid.mid { gap: 10px; }
  .options-grid.mid .option-card { padding: 16px 8px 12px; min-height: 58px; }
  .options-grid.mid .opt-text { font-size: 16px; }
  .options-grid.many { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .options-grid.many .option-card { padding: 16px 4px 8px; min-height: 52px; border-radius: 10px; }
  .options-grid.many .opt-text { font-size: 14px; }
  .options-grid.many .opt-no { top: 4px; left: 5px; }

  /* 정답 공개 연출 */
  #screen-loading { justify-content: center; align-items: center; text-align: center; }
  .flip-board { font-size: 28px; font-weight: 900; color: var(--hl); text-shadow: 0 0 20px color-mix(in srgb, var(--gold) 70%, transparent); line-height: 1.35; }
  .flip-top { font-size: 18px; color: var(--ink); margin-bottom: 10px; letter-spacing: 2px; }

  /* 결과 화면 */
  #screen-result { justify-content: flex-start; padding-bottom: 40px; }
  .result-header { text-align: center; margin-bottom: 20px; }
  .my-rank-badge {
    display: inline-block; background: var(--accent); color: var(--accent-ink);
    padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 10px; line-height: 1.35;
  }
  .result-card {
    background: color-mix(in srgb, var(--soft2) 70%, transparent); border: 2px solid var(--gold);
    border-radius: 16px; padding: 20px; text-align: center; position: relative;
    box-shadow: 0 0 20px color-mix(in srgb, var(--gold) 30%, transparent);
  }
  .rank-big { font-size: 40px; font-weight: 900; color: var(--hl); line-height: 1; margin-bottom: 10px; text-shadow: 0 0 14px color-mix(in srgb, var(--gold) 45%, transparent); }
  .rank-big small { font-size: 18px; margin-left: 2px; }
  .result-card img {
    width: 120px; height: 120px; object-fit: cover; border-radius: 16px;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.45)); margin-bottom: 10px;
  }
  .result-name { font-size: 22px; font-weight: 900; color: var(--hl); line-height: 1.3; }
  .result-tagline { font-size: 14px; color: var(--heart); margin: 6px 0 12px 0; font-weight: bold; line-height: 1.4; }
  .result-desc { font-size: 14px; line-height: 1.6; color: var(--ink); text-align: left; background: color-mix(in srgb, var(--ink) 6%, transparent); padding: 12px; border-radius: 8px; margin-bottom: 12px; }
  .traits-list { text-align: left; margin-bottom: 4px; }
  .trait-item { font-size: 13px; color: var(--ink); margin-bottom: 5px; line-height: 1.45; padding-left: 20px; position: relative; }
  .trait-item::before { content: "✔"; position: absolute; left: 0; color: var(--gold); font-weight: 900; }
  .result-quote {
    margin-top: 12px; font-size: 14px; font-weight: 700; color: var(--hl); line-height: 1.5;
    border-left: 3px solid var(--gold); padding: 6px 10px; text-align: left; background: var(--tint); border-radius: 0 8px 8px 0;
  }
  .result-tip { margin-top: 10px; font-size: 13px; color: var(--sub); line-height: 1.5; text-align: left; }

  .ranking-section { background: color-mix(in srgb, var(--ink) 4%, transparent); border: 1px solid var(--line); border-radius: 16px; padding: 15px 12px; margin-bottom: 20px; }
  .ranking-title { font-size: 15px; font-weight: bold; color: var(--hl); margin-bottom: 12px; text-align: center; line-height: 1.35; }
  .rank-row {
    display: flex; align-items: center; background: color-mix(in srgb, var(--soft2) 55%, transparent);
    border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--line); gap: 10px;
  }
  .rank-row.highlight { border: 2px solid var(--gold); background: var(--tint); }
  .rank-num { font-size: 14px; font-weight: 900; min-width: 36px; color: var(--sub); flex-shrink: 0; }
  .rank-row.top .rank-num, .rank-row.highlight .rank-num { color: var(--hl); }
  .rank-img { width: 38px; height: 38px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .rank-info { flex: 1; text-align: left; min-width: 0; }
  .rank-info-name { font-size: 14px; font-weight: bold; color: var(--ink); line-height: 1.3; }
  .rank-info-tag { font-size: 12px; color: var(--sub); line-height: 1.35; margin-top: 1px; }
  .rank-me { font-size: 12px; font-weight: 900; color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 2px 6px; flex-shrink: 0; }
  /* 많을 때 촘촘하게 */
  .ranking-list.many { max-height: 62vh; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; position: relative; }
  .ranking-list.many .rank-row { padding: 6px 8px; margin-bottom: 6px; }
  .ranking-list.many .rank-img { width: 32px; height: 32px; }

  .btn-group { display: flex; gap: 10px; position: relative; z-index: 2; }
  .action-btn {
    flex: 1; padding: 14px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; line-height: 1.3;
  }
  .btn-retry { background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); border: 1px solid var(--line); }
  .btn-share { background: var(--accent); color: var(--accent-ink); border: 2px solid var(--gold); }
  .hidden { display: none !important; }
</style>
<style id="feedy-palette">:root:root{--bg:#fbf3ec;--card:#ffffff;--ink:#221a15;--sub:#5f5550;--line:#efe4da;--accent:#ff8a3d;--accent-ink:#221a15;--soft:#ffe3cf;--soft2:#fff4ea;--heart:#f0473c;--gold:#f5a524}</style></head>
<body>

<div class="app-container">
  <div class="spotlight-container"><div class="spotlight"></div></div>

  <!-- 시작 화면 -->
  <div id="screen-start" class="screen active">
    <div>
      <span class="onair">실시간 야식 레이더</span>
      <h1 class="header-title">야식 참기 제일 힘든 혈액형</h1>
      <p class="header-sub">밤 11시에 울리는 배꼽시계, 누가 먼저 무너질까?</p>
      <p class="header-intro" id="txt-intro-start"></p>
    </div>
    <div class="preview-stage" id="preview-stage">
      <div class="preview-label">내 혈액형 순위는?</div>
      <div class="preview-row" id="preview-row"></div>
    </div>
    <div>
      <button class="buzzer-btn" data-start>
        <span class="buzzer-text">결과 확인하기</span>
      </button>
      <p class="start-hint">터치해서 내 순위 알아봐요</p>
    </div>
  </div>

  <!-- 질문 화면 -->
  <div id="screen-question" class="screen">
    <div class="quiz-box">
      <span class="quiz-tag">야식 본능 테스트</span>
      <p class="quiz-intro" id="txt-intro"></p>
      <p class="quiz-q" id="txt-q"></p>
      <p class="quiz-count">내 혈액형을 골라 보세요</p>
    </div>
    <div class="options-grid" id="options-grid"></div>
  </div>

  <!-- 정답 공개 연출 -->
  <div id="screen-loading" class="screen">
    <div class="flip-board">
      <div class="flip-top">배달 앱 장바구니 분석 중</div>
      <div>야식 참기 난이도 측정해요</div>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="screen-result" class="screen" data-result-id="">
    <div class="result-header">
      <div class="my-rank-badge" id="res-badge"></div>
      <div class="result-card">
        <div class="rank-big" id="res-rank"></div>
        <img id="res-img" src="" alt="">
        <div class="result-name" id="res-name"></div>
        <div class="result-tagline" id="res-tagline"></div>
        <div class="result-desc" id="res-desc"></div>
        <div class="traits-list" id="res-traits"></div>
        <div class="result-quote hidden" id="res-quote"></div>
        <div class="result-tip hidden" id="res-tip"></div>
      </div>
    </div>

    <div class="ranking-section">
      <div class="ranking-title">야식 참기 힘든 순위</div>
      <div class="ranking-list" id="full-ranking-list"></div>
    </div>

    <div class="btn-group">
      <button class="action-btn btn-retry" id="btn-retry">다시 해보기</button>
      <button class="action-btn btn-share" id="btn-share" data-share>친구에게 공유하기</button>
    </div>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const data = window.DATA;
  if (!data) return;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const imgTag = (src, cls, alt) => src ? `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}">` : '';

  const intro = data.intro_line || '';
  document.getElementById("txt-intro-start").innerText = intro;
  document.getElementById("txt-intro").innerText = intro;

  const qData = (data.questions && data.questions[0]) || { q: '', options: [] };
  const opts = qData.options || [];
  document.getElementById("txt-q").innerText = qData.q || '';

  const sortedResults = [...(data.results || [])].sort((a, b) => (a.rank || 0) - (b.rank || 0));
  const many = sortedResults.length > 16;

  // 시작 화면: TOP 3 미리보기
  const top3 = sortedResults.slice(0, 3);
  if (!top3.length) document.getElementById("preview-stage").classList.add('hidden');
  document.getElementById("preview-row").innerHTML = top3.map((r, i) => `
    <div class="preview-item ${i === 0 ? 'first' : ''}">
      ${imgTag(r.img, '', r.name)}
      <span>${esc(r.rank)}위 ${esc(r.name)}</span>
    </div>`).join('');

  // 선택지(유형 고르기): 개수에 따라 크기·열 수 조절
  const grid = document.getElementById("options-grid");
  if (opts.length > 16) grid.classList.add('many');
  else if (opts.length > 6) grid.classList.add('mid');
  else if (opts.length <= 4) grid.classList.add('few');
  grid.innerHTML = opts.map((opt, idx) => `
    <button type="button" class="option-card" data-opt="${idx}">
      <span class="opt-no">${idx + 1}</span>
      <span class="opt-text">${esc(opt.text)}</span>
    </button>`).join('');

  const screens = document.querySelectorAll('.screen');
  function showScreen(id) {
    screens.forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  document.querySelector('[data-start]').addEventListener('click', () => showScreen('screen-question'));

  let current = null, busy = false;
  grid.addEventListener('click', (e) => {
    const card = e.target.closest('[data-opt]');
    if (!card || busy) return;
    busy = true;
    card.classList.add('picked');
    window.LB.answer(0, parseInt(card.getAttribute('data-opt'), 10));
    setTimeout(() => {
      showScreen('screen-loading');
      // 결과는 결과 화면을 그리는 바로 그 순간 정해요(앱·검사 봇이 LB.result 직후 결과 화면을 봐요)
      setTimeout(() => { current = window.LB.result(); renderResult(current); showScreen('screen-result'); busy = false; }, 800);
    }, 350);
  });

  function setText(id, text) {
    const el = document.getElementById(id);
    el.innerText = text || '';
    el.classList.toggle('hidden', !text);
  }

  function renderResult(res) {
    if (!res) return;
    document.getElementById('screen-result').setAttribute('data-result-id', res.id);

    document.getElementById('res-badge').innerText = `내 결과 카드: ${res.name}`;
    document.getElementById('res-rank').innerHTML = `${esc(res.rank)}<small>위</small>`;
    const img = document.getElementById('res-img');
    img.src = res.img || ''; img.alt = res.name || '';
    img.classList.toggle('hidden', !res.img);
    setText('res-name', res.name);
    setText('res-tagline', res.tagline);
    setText('res-desc', res.desc);
    document.getElementById('res-traits').innerHTML = (res.traits || []).filter(Boolean).map(t => `<div class="trait-item">${esc(t)}</div>`).join('');
    setText('res-quote', res.quote ? `“${res.quote}”` : '');
    setText('res-tip', res.tip ? `💡 ${res.tip}` : '');

    const list = document.getElementById('full-ranking-list');
    list.classList.toggle('many', many);
    list.innerHTML = sortedResults.map(r => `
      <div class="rank-row ${r.id === res.id ? 'highlight' : ''} ${r.rank <= 3 ? 'top' : ''}">
        <div class="rank-num">${esc(r.rank)}위</div>
        ${imgTag(r.img, 'rank-img', r.name)}
        <div class="rank-info">
          <div class="rank-info-name">${esc(r.name)}</div>
          ${r.tagline ? `<div class="rank-info-tag">${esc(r.tagline)}</div>` : ''}
        </div>
        ${r.id === res.id ? `<span class="rank-me">나의 야식 본능</span>` : ''}
      </div>`).join('');
    // 많을 때는 목록 상자 안에서 내 줄이 보이도록 스크롤
    if (many) requestAnimationFrame(() => {
      const me = list.querySelector('.highlight');
      if (me) list.scrollTop = Math.max(0, me.offsetTop - list.clientHeight / 2 + me.offsetHeight / 2);
    });
  }

  document.getElementById('btn-retry').addEventListener('click', () => {
    window.LB.reset();
    current = null;
    grid.querySelectorAll('.picked').forEach(el => el.classList.remove('picked'));
    document.getElementById('screen-result').setAttribute('data-result-id', '');
    showScreen('screen-start');
  });

  document.getElementById('btn-share').addEventListener('click', () => {
    const res = current || window.LB.result();
    if (res) window.LB.share(res.id);
  });
});
</script>
</body>
</html>
