<title>친구들 사이 내 역할</title>
<style>
:root{
--bg:#eef1f6;--fl:#d6dcea;--hi:#ffffffcc;--card:#ffffff;
--paper:#ffffff;--ink:#25334d;--act:#2f5fd0;--on:#ffffff;
--pin:#ffda75;--c:#ff6b5a;--sh:#25334d26;
--title-font:ui-rounded,sans-serif;--body-font:ui-rounded,sans-serif
}
:root[data-result="0"]{--c:#ff6b5a}
:root[data-result="1"]{--c:#2f5fd0}
:root[data-result="2"]{--c:#7a8b99}
:root[data-result="3"]{--c:#3a9d5d}
:root[data-result="4"]{--c:#ffb400}
:root[data-result="5"]{--c:#b46ad8}
:root[data-result="6"]{--c:#e08a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;color:var(--ink)}
body{background:var(--bg);font-family:var(--body-font)}
button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;color:var(--ink)}
button:focus-visible{outline:3px solid var(--act);outline-offset:3px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 0,var(--hi),transparent 65%),linear-gradient(var(--bg) 52%,var(--fl))}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scr{position:absolute;inset:0;overflow:hidden;padding:calc(12px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(12px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px))}
h1,h2,p{margin:0;word-break:keep-all}
h1,#final,button.title{font-family:var(--title-font);font-weight:400;letter-spacing:-.035em}
.card,.opt{background:linear-gradient(var(--hi),transparent 32%) var(--card);box-shadow:inset 0 2px 0 var(--hi),0 3px 0 var(--sh),0 13px 25px -14px var(--sh);border-radius:24px}
.lbl{background:var(--ink);color:var(--card);border-radius:17px;padding:9px 15px;box-shadow:0 4px 0 var(--sh)}
.chip,.pin{background:linear-gradient(var(--hi),transparent 45%) var(--pin);box-shadow:0 0 0 2px var(--sh),inset 0 2px 0 var(--hi);border-radius:99px}
.chip{padding:4px 9px;font-size:clamp(12px,1.9vh,14px);line-height:1.2}
.primary,.secondary{min-height:64px;padding:10px 16px;border-radius:24px;font-family:var(--title-font);font-size:clamp(16px,2.5vh,19px);letter-spacing:-.04em}
.primary{color:var(--on);background:linear-gradient(var(--hi),transparent 22%) var(--act);box-shadow:0 6px 0 var(--ink),inset 0 2px 0 var(--hi)}
.secondary{background:linear-gradient(var(--hi),transparent 30%) var(--card);box-shadow:0 5px 0 var(--sh)}
.primary:active,.secondary:active{box-shadow:inset 0 3px 0 var(--sh)}
#start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:calc(60px + var(--lb-safe-top,0px))}
.start-tag{font-size:12px;letter-spacing:.04em}
#start h1{font-size:clamp(28px,4.6vh,36px);line-height:1.3}
.start-copy{font-size:clamp(15px,2.4vh,18px);line-height:1.45;max-width:320px}
.start-copy span{display:block}
#go{width:85%;flex-shrink:0;border-radius:99px}
.figure-zone{position:relative;min-height:0;width:100%;flex:1;display:flex;align-items:center;justify-content:center}
.figure-slot{position:relative;z-index:1;min-height:0;height:100%;width:100%;display:flex;align-items:center;justify-content:center}
.figure-slot img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}
.figure-slot .fallback{height:85%;max-height:230px;aspect-ratio:1;min-height:35px;border-radius:35%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,var(--hi),transparent 55%),var(--c);box-shadow:inset 0 5px 0 var(--hi),0 10px 0 var(--sh);color:var(--ink);font-size:clamp(28px,12vh,80px);font-family:var(--title-font)}
.figure-slot:has(img) .fallback{display:none}
.ped{position:absolute;bottom:2%;left:13%;right:13%;height:11%;min-height:12px;border-radius:50%;background:radial-gradient(ellipse at 40% 20%,var(--card),var(--fl));box-shadow:0 -23px 48px -12px var(--c),0 8px 13px var(--sh)}
#start .figure-slot{padding-bottom:10px}
#hud{position:absolute;top:calc(14px + var(--lb-safe-top,0px));left:calc(24px + var(--lb-safe-left,0px));right:calc(24px + var(--lb-safe-right,0px));display:flex;justify-content:space-between;align-items:center;gap:14px;pointer-events:none;z-index:3}
#sc{font-size:18px;font-variant-numeric:tabular-nums;font-weight:500;min-width:42px}
#capsules{display:flex;justify-content:flex-end;gap:5px;flex:1}
#capsules i{display:block;width:12px;height:25px;border-radius:8px;background:var(--fl);box-shadow:inset 0 2px 2px var(--sh),0 2px 0 var(--hi)}
#capsules i.past{background:var(--act)}
#capsules i.now{background:var(--pin);box-shadow:inset 0 2px 0 var(--hi),0 0 0 2px var(--act)}
#play{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,20px);padding-top:calc(58px + var(--lb-safe-top,0px))}
.question-card{width:100%;padding:clamp(16px,3vh,25px) 18px;text-align:center;position:relative}
.strap{position:absolute;top:-12px;left:calc(50% - 16px);width:32px;height:15px;border-radius:6px;background:var(--fl);box-shadow:inset 0 2px 0 var(--hi)}
.room{font-size:12px;display:inline-block;margin-bottom:10px;padding:4px 11px;border-radius:7px;background:var(--bg)}
#question{font-size:clamp(20px,3.3vh,23px);font-weight:500;line-height:1.4}
#choices{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(9px,1.8vh,14px);padding:8px 0}
.opt{width:91%;min-height:64px;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;font-size:clamp(17px,2.65vh,18px);line-height:1.35;transition:box-shadow .12s,background-color .12s}
.pin{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;font-size:15px}
.opt:active,.opt.on{box-shadow:inset 0 0 0 3px var(--act),0 4px 0 var(--sh)}
.opt.on .pin{animation:badge .25s ease-out}
.opt:disabled{cursor:default;opacity:1}
@keyframes badge{50%{transform:translateY(-8px) rotate(-9deg)}}
@keyframes appear{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
#choices.arrive .opt{animation:appear .2s ease-out both}
#choices.arrive .opt:nth-child(2){animation-delay:.025s}
#choices.arrive .opt:nth-child(3){animation-delay:.05s}
#choices.arrive .opt:nth-child(4){animation-delay:.075s}
.tray{width:68%;height:12px;flex-shrink:0;background:var(--fl);border-radius:99px;box-shadow:inset 0 3px 3px var(--sh),0 2px 0 var(--hi)}
#opening{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none}
#opening p{padding:22px 28px;border-radius:22px;background:var(--ink);color:var(--card);font-size:22px;box-shadow:0 8px 0 var(--sh)}
#over{display:flex}
#rp{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0;width:100%;height:100%;text-align:center}
#why{font-size:12px;line-height:1.25;flex-shrink:0}
#resultFigure{width:100%;flex:1;min-height:42px}
#resultFigure .figure-slot{padding-bottom:8px}
#final{display:block;font-size:clamp(29px,5.4vh,40px);line-height:1.15;max-width:100%;padding:7px 15px;flex-shrink:0}
#shareline{font-size:clamp(13px,2.1vh,16px);line-height:1.25;flex-shrink:0}
#traits{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;flex-shrink:0}
#description{width:100%;padding:9px 12px;font-size:clamp(13px,2.1vh,16px);line-height:1.4;flex-shrink:0}
#matchups{display:flex;gap:9px;width:100%;flex-shrink:0}
.match{display:flex;align-items:center;gap:5px;flex:1;min-width:0;padding:4px 7px;text-align:left;border-radius:16px}
.match-art{width:40px;height:43px;flex-shrink:0}
.match-art .figure-slot .fallback{width:32px;height:32px;min-height:0;font-size:18px;border-radius:12px}
.match .words{min-width:0;font-size:clamp(12px,1.85vh,14px);line-height:1.3}
.match small{display:block;font-size:12px;opacity:.8}
#actions{display:flex;gap:10px;width:100%;flex-shrink:0;margin-top:2px}
#actions button{flex:1;min-width:0}
.lb-rec{font-size:12px;line-height:1;flex-shrink:0}
.pop{animation:badge .24s ease-out}
@media(max-height:600px){
#start{padding-top:calc(24px + var(--lb-safe-top,0px));gap:7px}
#matchups{display:none}
#play{gap:12px}
.question-card{padding:17px 14px}
.room{margin-bottom:6px}
#choices{gap:10px}
.opt{min-height:58px}
#rp{gap:5px}
}
@media(max-height:460px){
#start{padding-top:calc(12px + var(--lb-safe-top,0px));gap:5px}
#start h1{font-size:26px}
#start .start-tag{display:none}
#start .figure-zone{min-height:30px}
.start-copy{font-size:13px}
.start-copy span{display:inline}
#traits{display:none}
#final{font-size:27px;padding:5px 12px}
#description{font-size:12px;padding:6px 10px;line-height:1.3}
#why,.lb-rec{display:none}
#shareline{font-size:12px}
#rp{gap:4px}
#play{padding-top:calc(48px + var(--lb-safe-top,0px));gap:8px}
#hud{top:calc(10px + var(--lb-safe-top,0px))}
#capsules i{height:19px}
.question-card{padding:12px 12px}
.room,.strap,.tray{display:none}
#question{font-size:18px;line-height:1.25}
#choices{gap:8px;padding:2px 0}
.opt{min-height:48px;padding:7px 12px;font-size:16px}
.pin{width:27px;height:27px}
}
@media(max-height:340px){
#play{gap:5px;padding-top:calc(40px + var(--lb-safe-top,0px))}
.question-card{padding:8px 12px}
#question{font-size:16px}
#choices{gap:5px}
.opt{min-height:42px;padding:5px 11px;font-size:14px}
.pin{height:25px;width:25px;font-size:13px}
#final{font-size:23px;padding:3px 10px}
#description{font-size:12px;padding:4px 7px}
#rp{gap:3px}
#shareline{font-size:12px}
#resultFigure{min-height:28px}
#start h1{font-size:23px}
.start-copy{font-size:12px}
.lbl{padding:5px 12px}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important}
}

{name:'느긋한 쉼표',line:'같이 있으면 급한 마음도 잠깐 쉬는 중',desc:['작은 변수에 휩쓸리지 않고 편하게 어울림.','점심 줄이 길어지면 빈자리를 잡고 친구를 기다림.'],chips:['여유 있게 기다림','쉬는 시간 챙김','재촉하지 않음'],good:5,bad:3}

]},
{room:'회의실 · 하루 마무리',q:'함께한 날을 마치며 가장 뿌듯한 건?',a:[
['친구들이 한참 웃었던 일',[[0,3],[4,1]]],
['막힌 일을 같이 끝낸 일',[[3,3],[1,1]]],
['친구의 작은 변화를 알아챈 일',[[2,3],[5,1]]],
['다 같이 편하게 쉬었던 일',[[6,3],[4,1]]]
]}
];
let W=0,H=0,state='start',paused=false,last=0,acc=0,clock=0;
let index=0,totals=[],tie=[],answers=[],transition=0,endT=0,selected=-1;
let resultIndex=0,reported=false,overAt=0,hs='',sprites=[],palette={};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const caps=[];
for(let i=0;i<questions.length;i++){
 const el=document.createElement('i');$('capsules').appendChild(el);caps.push(el);
}
lb.assets.font('font/orbit').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--body-font',v));
const urls=results.map((_,i)=>lb.assets.url('gen/r'+(i+1)));
function picture(target,n,outer=false){
 const slot=outer?document.createElement('div'):target;
 if(outer){slot.className='figure-slot';target.replaceChildren(slot);}
 else target.replaceChildren();
 const fallback=document.createElement('span');
 fallback.className='fallback';fallback.textContent=results[n].name[0];
 fallback.setAttribute('role','img');fallback.setAttribute('aria-label',results[n].name);
 if(!urls[n]){slot.appendChild(fallback);return;}
 const img=document.createElement('img');
 img.alt=results[n].name;img.draggable=false;
 img.addEventListener('error',()=>{img.remove();slot.appendChild(fallback);},{once:true});
 img.src=urls[n];slot.appendChild(img);
}
picture($('startFigure'),0);
const buttons=[];
for(let i=0;i<4;i++){
 const b=document.createElement('button');b.type='button';b.className='opt';
 const pin=document.createElement('span');pin.className='pin';pin.textContent=['가','나','다','라'][i];pin.setAttribute('aria-hidden','true');
 const text=document.createElement('span');b.append(pin,text);
 b.addEventListener('pointerdown',()=>{if(state==='play'&&transition===0)b.classList.add('pressed');});
 b.addEventListener('pointerup',()=>b.classList.remove('pressed'));
 b.addEventListener('pointercancel',()=>b.classList.remove('pressed'));
 b.addEventListener('click',()=>choose(i));
 $('choices').appendChild(b);buttons.push({el:b,text});
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function hud(){
 const value=(index+1)+'/'+questions.length;
 if(value===hs)return;
 hs=value;$('sc').textContent=value;
 caps.forEach((c,i)=>c.className=i<index?'past':i===index?'now':'');
}
function showQuestion(){
 selected=-1;hud();
 const item=questions[index];$('room').textContent=item.room;$('question').textContent=item.q;
 buttons.forEach((b,i)=>{b.text.textContent=item.a[i][0];b.el.disabled=false;b.el.classList.remove('on');});
 $('choices').classList.remove('arrive');void $('choices').offsetWidth;$('choices').classList.add('arrive');
}
function reset(){
 index=0;totals=Array(7).fill(0);tie=Array(7).fill(0);answers=[];
 transition=0;endT=0;selected=-1;reported=false;acc=0;hs='';
 document.documentElement.removeAttribute('data-result');
 $('opening').hidden=true;
 showQuestion();
}
function start(){
 lb.audio.unlock();lb.audio.sfx('sfx/rpg-audio/metal-click');
 reset();state='play';
 $('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
}
function choose(n){
 if(state!=='play'||transition>0||selected>=0)return;
 selected=n;answers.push(n);
 questions[index].a[n][1].forEach(([r,v])=>{totals[r]+=v;tie[r]+=v*(index+1);});
 buttons.forEach((b,i)=>{b.el.disabled=true;b.el.classList.toggle('on',i===n);});
 lb.audio.sfx('sfx/rpg-audio/metal-click');lb.haptic('light');
 transition=.24;
}
function pickResult(){
 const max=Math.max(...totals);
 let choices=totals.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
 if(choices.length===1)return choices[0];
 const last=Math.max(...choices.map(i=>tie[i]));
 choices=choices.filter(i=>tie[i]===last);
 let signature=0;
 answers.forEach((v,i)=>{signature=(signature*5+(v+1)*(i+3))%65521;});
 return choices[signature%choices.length];
}
function die(x,y,why,win){
 if(state!=='play')return;
 resultIndex=pickResult();state='dying';endT=.65;
 $('play').hidden=true;$('hud').hidden=true;$('opening').hidden=false;
}
function result(){
 state='over';overAt=clock;
 const r=results[resultIndex];
 document.documentElement.setAttribute('data-result',''+resultIndex);
 $('final').textContent=r.name;
 $('shareline').textContent=r.line;
 $('description').textContent=r.desc.join(' ');
 $('traits').replaceChildren();
 r.chips.forEach(text=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=text;$('traits').appendChild(chip);});
 picture($('resultArt'),resultIndex);
 picture($('goodArt'),r.good,true);picture($('badArt'),r.bad,true);
 $('goodName').textContent=results[r.good].name;$('badName').textContent=results[r.bad].name;
 $('opening').hidden=true;$('over').hidden=false;
 if(!reported){reported=true;lb.done(r.name);}
 lb.audio.sfx('sfx/interface-sounds/confirmation-003');
 lb.haptic('success');
 const safe=lb.safe;
 lb.fx.sparkle(Math.max(safe.left+24,Math.min(W-safe.right-24,W*.5)),Math.max(safe.top+30,H*.25));
 lb.fx.confetti();
}
function update(dt){
 if(state==='play'&&transition>0){
  transition=Math.max(0,transition-dt);
  if(transition===0){
   if(index===questions.length-1)die(W/2,H/2,'너의 자리는 바로 여기!',true);
   else{index++;showQuestion();}
  }
 }else if(state==='dying'){
  endT-=dt;if(endT<=0)result();
 }
}
function rounded(c,x,y,w,h,r){
 c.beginPath();c.roundRect(x,y,w,h,r);c.fill();
}
function bakeProps(){
 sprites=[];
 const s=getComputedStyle(document.documentElement);
 palette={bg:s.getPropertyValue('--bg').trim(),fl:s.getPropertyValue('--fl').trim(),ink:s.getPropertyValue('--ink').trim(),act:s.getPropertyValue('--act').trim(),paper:s.getPropertyValue('--paper').trim(),pin:s.getPropertyValue('--pin').trim(),sh:s.getPropertyValue('--sh').trim()};
 for(let n=0;n<3;n++){
  const out=document.createElement('canvas');out.width=240;out.height=240;
  const c=out.getContext('2d');c.scale(2,2);
  const g=c.createLinearGradient(15,10,110,115);
  g.addColorStop(0,palette.paper);g.addColorStop(.55,palette.fl);g.addColorStop(1,palette.bg);
  c.fillStyle=palette.sh;c.beginPath();c.ellipse(61,107,42,8,0,0,Math.PI*2);c.fill();
  if(n===0){
   c.fillStyle=palette.fl;rounded(c,48,4,24,29,8);
   c.fillStyle=g;rounded(c,20,25,80,76,22);
   c.fillStyle=palette.act;rounded(c,30,37,23,32,9);
   c.fillStyle=palette.paper;c.beginPath();c.arc(41.5,47,6,0,Math.PI*2);c.fill();rounded(c,34,55,15,9,5);
   c.fillStyle=palette.fl;rounded(c,62,40,25,7,4);rounded(c,62,53,21,7,4);rounded(c,31,80,55,6,3);
  }else if(n===1){
   c.fillStyle=g;rounded(c,9,29,102,66,22);
   c.fillStyle=palette.sh;rounded(c,18,39,42,46,13);rounded(c,67,39,34,18,8);rounded(c,67,64,34,21,9);
   c.fillStyle=palette.paper;rounded(c,20,40,38,42,12);rounded(c,69,40,30,14,7);
   c.fillStyle=palette.pin;rounded(c,72,67,24,14,7);
  }else{
   c.fillStyle=g;rounded(c,8,22,104,77,20);
   c.fillStyle=palette.ink;rounded(c,17,30,86,55,15);
   c.fillStyle=palette.fl;rounded(c,27,43,45,4,2);rounded(c,27,54,62,4,2);rounded(c,27,65,33,4,2);
   c.fillStyle=palette.paper;rounded(c,76,86,15,5,2);
  }
  c.fillStyle=palette.paper;c.globalAlpha=.65;c.beginPath();c.ellipse(30,33,9,3,-.5,0,Math.PI*2);c.fill();
  sprites.push(out);
 }
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 if(!W||!H)return;
 const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
 bakeProps();render();
}
function render(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 const motion=reduced?0:Math.sin(clock*.65)*4;
 ctx.save();ctx.globalAlpha=.23;
 const size=Math.min(100,W*.23);
 const positions=[[W*.015,H*.17+motion],[W-size*.8,H*.72-motion],[W*.015,H*.82+motion]];
 sprites.forEach((sprite,i)=>ctx.drawImage(sprite,positions[i][0],positions[i][1],size,size));
 ctx.restore();
 ctx.save();ctx.fillStyle=palette.paper;ctx.globalAlpha=.6;
 for(let i=0;i<4;i++){
  const x=W*(.13+.24*i),y=H*(.12+.22*(i%3))+(reduced?0:Math.sin(clock*.5+i)*5);
  ctx.beginPath();ctx.ellipse(x,y,3,8,.5,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(paused)return;
 clock+=dt;acc+=dt;
 while(acc>=STEP){update(STEP);acc-=STEP;}
 render();
}
lb.onPause(p=>{paused=p;last=0;buttons.forEach(b=>b.el.classList.remove('pressed'));});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.3)start();});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 const r=results[resultIndex];
 lb.share('친구들 사이 나의 역할은 '+r.name+'임. '+r.line+'. 다들 무슨 역할 나옴?');
});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
