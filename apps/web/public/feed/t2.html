<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="hud" hidden><span>왕립 모험가 길드</span><b id="sc">1 / 10</b><span id="info">보석 의뢰</span></div>
<div id="start" class="scr">
<p class="banner">왕립 모험가 길드</p>
<h1>나만의 쥬얼스톤</h1>
<canvas id="hc" aria-label="루비 하트와 에메랄드 열쇠, 페리도트 등불"></canvas>
<p class="hook">치링치링 치리링!<br>우리 사이에 빛나는 보석을 찾아봐요.</p>
<p class="intro">동료와 함께 열 번의 의뢰를 풀어요.<br>마법의 보석상자에 담을 스톤이 기다려요.</p>
<button id="go" class="mainbtn" type="button">모험 시작</button>
</div>
<div id="play" hidden>
<div id="trail" aria-label="열 장의 모험 진행"></div>
<div id="quest">
<p class="chapter" id="chapter"></p>
<canvas id="vignette" aria-label="두 모험가가 함께하는 왕국 의뢰"></canvas>
<div id="speech"><p id="speaker"></p><h2 id="question"></h2></div>
<div id="choices"></div>
<div id="chosen" aria-hidden="true"></div>
</div>
</div>
<div id="status" hidden><p>보석빛으로 인연을 새겨요…</p></div>
<div id="over" class="scr" hidden>
<p id="why"></p>
<canvas id="portrait" aria-label="나의 쥬얼스톤"></canvas>
<b id="final"></b>
<p id="tagline"></p>
<div id="traits"></div>
<p id="description"></p>
<div id="matches"><p class="match">함께 빛나는 동료예요<b id="goodmatch"></b></p><p class="match">보폭을 맞춰 볼 사이예요<b id="badmatch"></b></p></div>
<p class="lb-rec">열 장의 의뢰에 담긴 나의 인연이에요.</p>
<p id="sub"></p>
<div class="actions"><button id="again" class="mainbtn" type="button">다시 모험</button><button id="rank" class="mainbtn" type="button">증서 공유</button></div>
</div>
</div>
<script>

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const data=[
['새벽루비','#d7263d','정열의 루비 하트','둘의 용기를 깨우는 불꽃이에요.','솔직한 애정|빠른 결심|뜨거운 응원','망설이는 동료에게 마음을 먼저 건네는 사람이에요. 함께라면 해낼 수 있다는 믿음을 전해요.','가끔은 동료의 속도도 살펴봐요.',1,10],
['고요사파이어','#1f4fbf','깊은 사파이어 물방울','마음을 가라앉히는 깊은 물결이에요.','차분한 경청|깊은 신뢰|세심한 조율','동료가 편히 기대어 쉴 자리를 만드는 사람이에요. 말 뒤에 숨은 마음도 조용히 헤아려요.','원하는 것도 조금씩 말해 봐요.',0,4],
['숲지기에메랄드','#1e9e5a','에메랄드 열쇠','둘의 내일을 여는 든든한 열쇠예요.','꾸준한 약속|생활의 지혜|든든한 동행','작은 약속을 지켜 관계의 뿌리를 키우는 사람이에요. 둘의 여정을 오래 이어 갈 기반을 다져요.','예상 밖의 길도 함께 걸어 봐요.',3,11],
['별빛다이아','#dff4ff','다이아 왕관','서로의 가능성을 비추는 왕관이에요.','선명한 기준|따뜻한 존중|함께 성장','동료의 장점을 알아보고 빛날 자리를 내주는 사람이에요. 서로 존중할 약속으로 인연을 단단히 해요.','완벽하지 않은 하루도 안아 줘요.',2,6],
['장난오팔','#f2a7d8','오팔 구슬','굳은 분위기를 풀어 주는 무지개예요.','유쾌한 재치|가벼운 발상|깜짝 설렘','동료의 긴장을 기분 좋은 웃음으로 풀어 주는 사람이에요. 익숙한 하루에도 색다른 즐거움을 발견해요.','진지한 마음에는 잠시 귀 기울여요.',5,1],
['햇살시트린','#f5b700','시트린 해바라기 브로치','작은 기쁨을 크게 피우는 햇살이에요.','환한 격려|다정한 표현|기쁨 발견','동료의 작은 성취에도 진심으로 기뻐하는 사람이에요. 함께하는 시간에 밝은 온기를 더해요.','지친 마음을 억지로 밝히진 말아요.',4,8],
['달그림자문스톤','#c9d3e8','문스톤 초승달','말 없는 틈도 편안하게 감싸요.','섬세한 감각|편안한 침묵|조용한 배려','동료가 혼자 숨을 고를 여유를 지켜 주는 사람이에요. 말없이 곁에 있는 것으로도 깊은 위로를 건네요.','기다림만큼 내 마음도 전해 봐요.',7,3],
['꿈결자수정','#8a4fd1','자수정 원석 무리','둘만의 이야기를 엮는 상상가예요.','풍부한 상상|마음의 공감|새로운 해석','동료의 꿈을 진지하게 듣고 함께 그림을 그리는 사람이에요. 낯선 일에서도 둘만의 의미를 찾아내요.','작은 실천 하나를 함께 정해 봐요.',6,9],
['서리아쿠아','#6fd6e0','아쿠아마린 눈송이','엉킨 마음을 풀어 주는 맑은 눈이에요.','공정한 판단|차분한 정리|또렷한 대화','서운함이 엉킬 때 사실과 마음을 나누어 보는 사람이에요. 둘 다 납득할 균형점을 차분히 찾아요.','해결에 앞서 마음부터 안아 줘요.',9,5],
['용기가넷','#8e1b2e','가넷 방패','소중한 인연 앞에 서는 방패예요.','의리 있는 마음|단단한 책임|대담한 보호','어려운 순간에도 동료의 곁을 지키는 사람이에요. 말보다 행동으로 믿을 수 있는 편이 되어 줘요.','짐을 나누어 드는 용기도 가져 봐요.',8,7],
['번개토파즈','#ff8c1a','토파즈 번개 지팡이','멈춘 여정에 길을 내는 번개예요.','빠른 추진|분명한 제안|새로운 자극','둘이 망설일 때 구체적인 한 걸음을 제안하는 사람이에요. 답답한 상황을 움직이는 힘이 있어요.','결정 전에 동료의 뜻도 물어봐요.',11,0],
['그림자오닉스','#2b2b33','오닉스 반지','서로의 경계를 지키는 약속이에요.','분명한 경계|깊은 충성|신중한 관찰','동료의 비밀과 각자의 공간을 소중히 지키는 사람이에요. 쉽게 흔들리지 않는 믿음을 천천히 쌓아요.','믿는 마음을 표현으로도 보여 줘요.',10,2],
['바다진주','#f3ece2','진주 조개','상처 난 마음을 품는 포근한 조개예요.','다정한 수용|부드러운 위로|마음의 쉼터','동료가 약한 모습도 편히 꺼내도록 품어 주는 사람이에요. 판단보다 이해를 건네며 관계를 돌봐요.','내가 지친 날에는 기대어도 괜찮아요.',13,14],
['봄꽃로즈쿼츠','#f7b6c2','로즈쿼츠 손거울','동료의 아름다움을 돌려주는 거울이에요.','세심한 칭찬|다정한 눈길|진심의 표현','동료가 놓친 자신의 장점을 찾아 전하는 사람이에요. 작은 변화를 알아채는 관심으로 인연을 꽃피워요.','상대의 반응과 내 가치를 나눠 봐요.',12,15],
['화산호박','#c8741e','호박 모래시계','둘의 시간을 익히는 느긋한 불씨예요.','긴 호흡|기억의 힘|묵직한 인내','서두르지 않고 함께 쌓은 시간을 믿는 사람이에요. 어려운 때에도 지나온 온기를 기억해요.','필요한 말은 오늘 건네도 좋아요.',15,12],
['수호페리도트','#9bd13b','페리도트 등불','매일의 무사함을 비추는 등불이에요.','세심한 준비|현실의 배려|꾸준한 돌봄','동료의 하루가 무사하도록 필요한 것을 챙기는 사람이에요. 눈에 잘 띄지 않는 배려로 곁을 밝혀요.','돌봄을 받을 자리도 남겨 둬요.',14,13]
];
const questions=[
['길드 접수원','동료가 첫 의뢰 앞에서 망설여요.','출발의 약속',[
['곁에서 용기를 북돋워요',0,3,5,2],['걱정부터 차분히 들어요',1,3,6,2],['준비물을 함께 살펴요',2,3,3,1],['상상의 모험담을 나눠요',7,3,4,2]]],
['성문 경비병','동료와 성문에 갇혔어요. 밤이 다가와요.','성문의 두 사람',[
['통행 기록을 살펴봐요',8,3,14,1],['동료 앞에서 경비와 맞서요',9,3,11,2],['샛문을 찾아 움직여요',10,3,15,2],['쉬며 서로의 마음을 돌봐요',12,3,13,2]]],
['숲길 안내인','동료와 갈림길에 서요. 어디로 갈까요?','갈림길의 약속',[
['끌리는 길에 마음을 실어요',0,2,8,1],['동료가 편한 길을 물어요',1,3,9,1],['이정표를 따져 길을 골라요',2,2,10,3],['둘만의 기준을 정해요',3,3,11,2]]],
['별탑의 사서','동료가 마법책의 수수께끼를 건네요.','별탑의 수수께끼',[
['엉뚱한 해석을 붙여 봐요',4,3,12,1],['발견한 단서를 칭찬해요',5,3,13,2],['오래된 기록을 찬찬히 봐요',6,2,14,3],['둘의 가설을 그림으로 엮어요',7,3,15,1]]],
['왕실 전령','동료와 의뢰 보상 하나를 나눠야 해요.','보상의 무게',[
['동료의 활약에 보답해요',0,3,9,2],['각자의 바람부터 들어요',1,3,8,2],['다음 여정을 위해 모아 둬요',2,3,11,1],['납득할 기준을 제안해요',3,3,10,1]]],
['달빛 여관 주인','동료가 실수로 의뢰 지도를 잃었어요.','여관의 작은 파문',[
['유쾌한 말로 긴장을 풀어요',4,3,13,1],['따뜻한 차를 건네요',5,2,12,3],['찾을 시간을 넉넉히 줘요',6,3,15,1],['기억을 모아 지도를 그려요',7,3,14,2]]],
['다리의 파수꾼','무너진 다리 앞에서 동료와 다퉜어요.','서로 다른 보폭',[
['소중한 마음부터 밝혀요',0,3,10,1],['서로의 말을 차례로 들어요',1,3,11,2],['가능한 길을 표로 나눠 봐요',2,2,8,3],['둘 다 지킬 약속을 정해요',3,3,9,2]]],
['별축제의 악사','동료와 축제 의뢰를 마치고 쉬어요.','작은 축제',[
['즉석 보물찾기를 해 봐요',4,3,14,1],['동료를 위한 꽃을 골라요',5,2,15,3],['조용한 강가에 나란히 앉아요',6,3,12,2],['둘의 별자리를 지어 봐요',7,3,13,1]]],
['달의 정원사','동료가 남몰래 품은 꿈을 털어놔요.','정원의 속삭임',[
['벅찬 마음으로 응원해요',0,3,12,2],['어떤 꿈인지 깊이 물어요',1,3,13,2],['오래 곁에서 힘을 보태요',2,3,14,2]]],
['보석상자 지기','동료와 마지막 보석을 상자에 넣어요.','보석상자의 인연',[
['웃으며 다음 여행을 그려요',4,3,8,1],['빛나는 순간을 함께 간직해요',5,2,9,3]]]
];
const chapters=['첫째 장','둘째 장','셋째 장','넷째 장','다섯째 장','여섯째 장','일곱째 장','여덟째 장','아홉째 장','열째 장'];
const gemkeys=['gen/r1','gen/r2','gen/r3','gen/r4','gen/r5','gen/r6','gen/r7','gen/r8','gen/r9','gen/r10','gen/r11','gen/r12','gen/r13','gen/r14','gen/r15','gen/r16'];
lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/gowunbatang').then(v=>document.documentElement.style.setProperty('--body-font',v));
for(let i=0;i<10;i++){const d=document.createElement('i');d.className='step';$('trail').appendChild(d);}
function fitCanvas(el,c){
const w=el.clientWidth,h=el.clientHeight,d=Math.min(devicePixelRatio||1,2);
if(!w||!h)return [0,0];
if(el.width!==Math.round(w*d)||el.height!==Math.round(h*d)){el.width=Math.round(w*d);el.height=Math.round(h*d);}
c.setTransform(d,0,0,d,0,0);return [w,h];
}
function resize(){
W=cv.clientWidth;H=cv.clientHeight;const d=Math.min(devicePixelRatio||1,2);
cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
if(W&&H){bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#285642');bg.addColorStop(1,'#0c2b22');}
render();
}
function bump(el){if(reduced)return;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function hud(){
const a=(stage+1)+' / 10',b='보석 의뢰';
if(a!==hs){$('sc').textContent=a;hs=a;}
if(hi!==b){$('info').textContent=b;hi=b;}
}
function reset(){
t=0;score=0;acc=0;stage=0;locked=false;wait=0;endT=0;points=Array(16).fill(0);answers=[];selected=-1;resultId=0;hs=hi='';
$('chosen').replaceChildren();$('sub').textContent='';$('status').hidden=true;
}
function start(){
reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
lb.audio.unlock();lb.audio.sfx('sfx/ui-audio/switch1');lb.audio.music('music/oga-chiptunes/level-1',{loop:true,volume:.24});
showQuestion();
}
function showQuestion(){
const q=questions[stage];$('chapter').textContent=chapters[stage]+' · '+q[2];$('speaker').textContent=q[0]+'의 의뢰예요';$('question').textContent=q[1];
$('choices').replaceChildren();
q[3].forEach((a,i)=>{
const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=a[0];b.style.animationDelay=(i*.035)+'s';
b.addEventListener('pointerdown',e=>{if(e.isPrimary!==false)choose(i,b);});
b.addEventListener('click',()=>choose(i,b));
$('choices').appendChild(b);
});
[...$('trail').children].forEach((d,i)=>{d.className='step'+(i<stage?' done':i===stage?' current':'');d.setAttribute('aria-label',(i+1)+'번째 의뢰');});
hud();
}
function choose(i,el){
if(state!=='play'||locked)return;
locked=true;selected=i;const a=questions[stage][3][i];
points[a[1]]+=a[2];points[a[3]]+=a[4];answers.push(i);
el.classList.add('selected');bump(el);[...$('choices').children].forEach(b=>b.disabled=true);
const rect=el.getBoundingClientRect();
lb.audio.sfx('sfx/interface-sounds/minimize-001');lb.haptic('light');lb.fx.sparkle(rect.left+rect.width*.5,rect.top+rect.height*.5);
lb.fx.ripple(rect.left+rect.width*.5,rect.top+rect.height*.5,{colors:['#dfbd65','#7fe3c9']});
const g=document.createElement('i');g.className='routegem';$('chosen').appendChild(g);
wait=.42;
}
function pickResult(){
let maximum=Math.max(...points),ties=[];
for(let i=0;i<16;i++)if(points[i]===maximum)ties.push(i);
for(let n=answers.length-1;n>=0&&ties.length>1;n--){
const a=questions[n][3][answers[n]],priority=i=>i===a[1]?a[2]:i===a[3]?a[4]:0;
const m=Math.max(...ties.map(priority));ties=ties.filter(i=>priority(i)===m);
}
let hash=17;answers.forEach((a,i)=>hash=(hash*31+(a+1)*(i+3))%65521);
return ties[hash%ties.length];
}
function die(x,y,why,win){
if(state!=='play')return;
state='dying';endT=.32;$('status').hidden=false;
resultId=pickResult();$('why').textContent='왕립';
$('why').textContent='왕립 모험가 증명서 · 제'+(resultId+1)+'호';
lb.audio.stopMusic();lb.audio.sfx('sfx/interface-sounds/confirmation-001');lb.audio.sfx('magic');lb.haptic('success');
lb.fx.burst(x,y,{colors:[data[resultId][1],'#dfbd65','#f8fff5']});
}
function result(){
state='over';overAt=clock;const d=data[resultId];
$('play').hidden=true;$('hud').hidden=true;$('status').hidden=true;$('over').hidden=false;
document.documentElement.style.setProperty('--c',d[1]);
$('final').textContent=d[0];$('tagline').textContent=d[3];
$('traits').replaceChildren();
d[4].split('|').forEach(s=>{const e=document.createElement('span');e.className='trait';e.textContent=s;$('traits').appendChild(e);});
$('description').replaceChildren(document.createTextNode(d[5]));
const growth=document.createElement('span');growth.id='growth';growth.textContent=' '+d[6];$('description').appendChild(growth);
$('goodmatch').textContent=data[d[7]][0];$('badmatch').textContent=data[d[8]][0];
$('portrait').setAttribute('aria-label',d[0]+' · '+d[2]);
lb.done(d[0]);
}
function update(dt){
t+=dt;
if(locked){wait-=dt;if(wait<=0){if(stage===9){die(W*.5,H*.36,'너와 꼭 맞는 쥬얼스톤이 증명서에 새겨졌어요!',true);}else{stage++;locked=false;selected=-1;showQuestion();}}}
}
function poly(c,pts,fill,stroke='#142d25',lw=2){
c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke();}
}
function star(c,x,y,r,col){
poly(c,[[x,y-r],[x+r*.25,y-r*.25],[x+r,y],[x+r*.25,y+r*.25],[x,y+r],[x-r*.25,y+r*.25],[x-r,y],[x-r*.25,y-r*.25]],col,null);
}
function drawHero(c,x,y,h){
c.save();c.translate(x,y);c.rotate(-.06);
c.fillStyle='#0b251b50';c.fillRect(-h*.3+4,-h*.8+5,h*.6,h*.8);
c.fillStyle='#f3f6dc';c.strokeStyle='#192f24';c.lineWidth=2;c.fillRect(-h*.3,-h*.8,h*.6,h*.8);c.strokeRect(-h*.3,-h*.8,h*.6,h*.8);
c.strokeStyle='#b79a47';c.strokeRect(-h*.25,-h*.75,h*.5,h*.7);
poly(c,[[0,-h*.65],[h*.16,-h*.51],[h*.12,-h*.3],[0,-h*.2],[-h*.12,-h*.3],[-h*.16,-h*.51]],'#5db9a4');
poly(c,[[0,-h*.65],[0,-h*.2],[-h*.12,-h*.3],[-h*.16,-h*.51]],'#2f7b6b',null);
c.strokeStyle='#fff4b9';c.beginPath();c.moveTo(-h*.09,-h*.5);c.lineTo(h*.07,-h*.57);c.stroke();c.restore();
}
function adventurer(c,x,y,s,other){
c.save();c.translate(x,y);c.scale(s,s);
c.fillStyle='#0a231c40';c.beginPath();c.ellipse(0,0,19,5,0,0,Math.PI*2);c.fill();
poly(c,[[-12,-34],[-21,-5],[18,-5],[11,-34]],other?'#6e9996':'#ad604e');
c.fillStyle=other?'#e9be6c':'#4e6049';c.fillRect(-11,-24,22,19);
c.fillStyle='#243f36';c.fillRect(-10,-7,7,9);c.fillRect(4,-7,7,9);
c.fillStyle='#ebbe98';c.strokeStyle='#193429';c.lineWidth=2;c.beginPath();c.arc(0,-43,12,0,Math.PI*2);c.fill();c.stroke();
poly(c,[[-13,-43],[-12,-53],[-3,-59],[11,-53],[13,-42],[5,-47],[-3,-45],[-7,-40]],other?'#d9b976':'#304b3c');
c.fillStyle='#193429';c.fillRect(-4,-43,2,3);c.fillRect(5,-43,2,3);
c.strokeStyle='#724d3c';c.beginPath();c.moveTo(0,-36);c.lineTo(4,-36);c.stroke();
poly(c,[[-12,-32],[0,-26],[12,-32],[10,-23],[0,-19],[-10,-23]],other?'#80c2b0':'#e8c777');
c.restore();
}
function drawScene(){
const [w,h]=fitCanvas($('vignette'),vc);if(!w||!h)return;
vc.clearRect(0,0,w,h);vc.fillStyle='#88b4a4';vc.fillRect(0,0,w,h);
vc.fillStyle='#c5d5b4';vc.beginPath();vc.arc(w*.77,h*.25,Math.max(7,h*.12),0,Math.PI*2);vc.fill();
poly(vc,[[0,h*.53],[w*.2,h*.25],[w*.45,h*.6],[w*.73,h*.3],[w,h*.54],[w,h],[0,h]],'#608576',null);
const cy=h*.72;
vc.fillStyle='#406b52';vc.fillRect(0,cy,w,h-cy);
poly(vc,[[w*.43,h],[w*.57,h],[w*.65,cy],[w*.51,cy]],'#a3ae86',null);
if(stage===1||stage===3){
vc.fillStyle='#879e8b';vc.strokeStyle='#29483a';vc.lineWidth=2;
vc.fillRect(w*.68,h*.2,w*.2,h*.57);vc.strokeRect(w*.68,h*.2,w*.2,h*.57);
poly(vc,[[w*.65,h*.22],[w*.78,h*.03],[w*.91,h*.22]],'#48665a');
vc.fillStyle='#f2d88c';vc.fillRect(w*.75,h*.31,w*.045,h*.12);
}else{
for(let i=0;i<3;i++){let x=w*(.1+i*.36);poly(vc,[[x,h*.12],[x-18,h*.68],[x+19,h*.68]],i===1?'#497a57':'#315d45');vc.fillStyle='#39523d';vc.fillRect(x-3,h*.6,6,h*.16);}
}
const s=Math.min(1.15,h/96);
adventurer(vc,w*.38,cy+17*s,s,false);adventurer(vc,w*.57,cy+17*s,s,true);
if(stage===9){
const x=w*.77,y=cy+7;vc.fillStyle='#5f3d29';vc.fillRect(x-19,y-17,38,27);vc.strokeStyle='#efcc70';vc.lineWidth=3;vc.strokeRect(x-19,y-17,38,27);vc.fillStyle='#e7d58d';vc.fillRect(x-4,y-10,8,12);star(vc,x,y-27,8,'#fff4a8');
}else drawHero(vc,w*.8,cy+17*s,35*s);
for(let i=0;i<5;i++){let x=w*(.13+i*.17),y=h*(.2+.1*Math.sin(clock*.8+i*3));star(vc,x,y,2.3,'#e6f2c0');}
}
function render(){
if(!W||!H)return;
ctx.clearRect(0,0,W,H);ctx.fillStyle=bg||'#12372a';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#112f27';
for(let i=0;i<5;i++){
let x=W*(i/4),h=H*(.18+.05*Math.sin(i*7));
ctx.fillRect(x-20,H*.36-h,40,h);
poly(ctx,[[x-28,H*.36-h],[x,H*.36-h-25],[x+28,H*.36-h]],'#163b2e',null);
}
ctx.strokeStyle='#77936122';ctx.lineWidth=1;
for(let x=0;x<W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
for(let i=0;i<24;i++){
const tt=reduced?0:clock;
let x=((i*79.7+Math.sin(tt*.25+i)*10)%W+W)%W,y=((i*43.4-tt*(2+i%3))%H+H)%H;
ctx.globalAlpha=.15+.3*(.5+.5*Math.sin(tt+i));star(ctx,x,y,1.5+i%3,'#ead58f');
}
ctx.globalAlpha=1;
if(state==='start'){
const [w,h]=fitCanvas($('hc'),hc);if(w&&h){
hc.clearRect(0,0,w,h);const s=Math.min(w*.38,h*.72),cy=h*.48;
hc.fillStyle='#081f1940';hc.beginPath();hc.ellipse(w*.5,cy+s*.4,s*.97,s*.14,0,0,Math.PI*2);hc.fill();
const bob=reduced?0:Math.sin(clock*1.2)*4;
lb.assets.draw(hc,'gen/r3',w*.21,cy+10,s*.85,s*.85);
lb.assets.draw(hc,'gen/r16',w*.79,cy+10,s*.85,s*.85);
lb.assets.draw(hc,'gen/r1',w*.5,cy+bob,s*1.12,s*1.12);
for(let i=0;i<5;i++)star(hc,w*(.1+i*.2),cy+s*(i%2?.44:-.44),3+i%2,'#f0d582');
}}
if(state==='play'||state==='dying')drawScene();
if(state==='over'){
const [w,h]=fitCanvas($('portrait'),pc);if(w&&h){
pc.clearRect(0,0,w,h);
const s=Math.min(w*.8,h*.94),x=w*.5,y=h*.5;
pc.strokeStyle='#c2a65e';pc.lineWidth=1;
pc.beginPath();pc.ellipse(x,y,s*.49,s*.45,0,0,Math.PI*2);pc.stroke();
for(let i=0;i<4;i++){const a=i*Math.PI*.5+Math.PI*.25;star(pc,x+Math.cos(a)*s*.5,y+Math.sin(a)*s*.43,4,'#c1a053');}
lb.assets.draw(pc,gemkeys[resultId],x,y,s,s);
}}
}
function frame(now){
requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.1):0;last=now;
if(paused)return;if(!W){resize();return;}clock+=dt;
if(state==='play'){acc+=dt;while(acc>=STEP&&state==='play'){update(STEP);acc-=STEP;}}
else if(state==='dying'){endT-=dt;if(endT<=0)result();}
render();
}
lb.onPause(p=>{paused=p;last=0;});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.5)start();});
$('rank').addEventListener('click',()=>{if(state==='over'){const d=data[resultId];lb.share('나만의 쥬얼스톤은 '+d[0]+'! '+d[3]+' 함께 빛나는 동료는 '+data[d[7]][0]+'예요.');}});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
