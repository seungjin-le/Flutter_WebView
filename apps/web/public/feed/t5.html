<title>하찮은 동물 테스트</title>
<style>
:root{--paper:#fff;--ink:#222;--soft:#7a7a7a;--c:#8b6b4a;--act:#f2f2f0}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
body,button{font-family:var(--title-font,ui-rounded,sans-serif);font-weight:400}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(18px + var(--lb-safe-top,0px)) calc(20px + var(--lb-safe-right,0px)) calc(18px + var(--lb-safe-bottom,0px)) calc(20px + var(--lb-safe-left,0px));gap:10px}
h1,h2,p{margin:0;word-break:keep-all}
h1{font-size:clamp(34px,7vh,48px);line-height:1.05;letter-spacing:-.03em;font-weight:400}
h1 span{display:inline-block}
h1 span:nth-child(2n){rotate:1.8deg}
h1 span:nth-child(3n){rotate:-1.8deg}
button{appearance:none;color:var(--ink);font-size:clamp(20px,3.7vh,24px);min-height:64px;min-width:140px;padding:8px 24px;cursor:pointer;touch-action:manipulation;background:#fff;border:2px solid var(--ink);border-radius:255px 18px 225px 16px/16px 225px 18px 255px}
button:active{background:#f2f2f0}
button:focus-visible{outline:2px dashed #7a7a7a;outline-offset:4px}
#start{justify-content:center;gap:14px}
#start .tag{font-size:18px;color:var(--soft)}
#start .subtitle{font-size:clamp(21px,4vh,27px)}
#start .hook{font-size:clamp(18px,3.1vh,21px);line-height:1.3;max-width:290px}
#start #hc{flex:1;min-height:50px;max-height:260px}
#hc{display:block;width:100%;max-width:360px;min-height:0;object-fit:contain}
#go{flex-shrink:0}
#hud{position:absolute;left:calc(22px + var(--lb-safe-left,0px));right:calc(22px + var(--lb-safe-right,0px));top:calc(16px + var(--lb-safe-top,0px));pointer-events:none;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}
#sc{font-size:21px;font-weight:400;font-variant-numeric:tabular-nums;white-space:pre}
#info{display:flex;gap:5px;align-items:center}
.dot{display:block;width:13px;height:14px;border:1.6px solid #222;border-radius:45% 55% 47% 53%;rotate:-7deg}
.dot:nth-child(2n){rotate:11deg}
.dot.done{background:repeating-linear-gradient(-50deg,transparent 0 3px,#666 3px 4px)}
.dot.current{background:#222;outline:1px solid #222;outline-offset:3px}
#quiz{padding-top:calc(66px + var(--lb-safe-top,0px));justify-content:center;gap:12px}
.scene-label{font-size:18px;color:#777;flex-shrink:0}
#question{font-size:clamp(24px,4.5vh,29px);line-height:1.26;font-weight:400;min-height:2.5em;display:flex;align-items:center;justify-content:center;max-width:420px}
#tinyArt{height:76px;min-height:38px;display:flex;align-items:center;justify-content:center;gap:8px}
#mini{width:88px;height:76px}
#aside{font-size:24px;rotate:-9deg;color:#666}
#choices{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
.opt{min-width:0;min-height:64px;width:100%;padding:9px 15px;display:flex;align-items:center;gap:12px;text-align:left;font-size:clamp(20px,3.6vh,23px);line-height:1.2}
.opt .letter{font-size:17px;color:#777;flex-shrink:0}
.opt.on{background:repeating-linear-gradient(-45deg,#fff 0 6px,#e1e1df 6px 7px)}
.opt.on .letter{color:#222}
.opt[disabled]{cursor:default;color:#666}
.opt.on[disabled]{color:#222}
#transition{font-size:21px;min-height:26px;color:#777}
#over{justify-content:center;gap:8px}
#why{font-size:clamp(17px,3vh,20px);color:#777}
#final{font-weight:400;font-size:clamp(29px,5.8vh,42px);line-height:1.08;word-break:keep-all}
#final:after{content:"";display:block;width:65%;height:3px;margin:4px auto 0;border-bottom:2px solid #222;rotate:-2deg}
#over #hc{flex:1;min-height:48px;max-height:230px}
#shareline{font-size:clamp(19px,3.6vh,24px);line-height:1.15}
#description{font-size:clamp(18px,3vh,21px);line-height:1.24;max-width:410px}
#description p+p{margin-top:3px}
#traits{font-size:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#traits span{border-bottom:1px dashed #999;padding-bottom:2px}
#matches{font-size:18px;line-height:1.28}
#matches p{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
#matches em{font-style:normal;color:#777}

<canvas id="cv" aria-hidden="true"></canvas>
<div id="hud" hidden><b id="sc">관찰 1 / 9</b><div id="info" aria-label="질문 진행"></div></div>
<div id="start" class="scr">

<h1><span>하</span><span>찮</span><span>은</span> <span>동</span><span>물</span><br><span>테</span><span>스</span><span>트</span></h1>

</div>
<div id="over" class="scr" hidden>
<p id="why">너는 사실 이런 하찮은 동물이었다고 해요.</p>

function rough(c,points,seed=1,closed=false){
 c.beginPath();
 points.forEach((p,i)=>{
 const j=Math.sin(seed*8.13+i*19.43)*.75,k=Math.cos(seed*2.31+i*11.27)*.65;
 if(i)c.lineTo(p[0]+j,p[1]+k);else c.moveTo(p[0]+j,p[1]+k);
 });
 if(closed)c.closePath();
 c.stroke();
}
function ellipseRough(c,x,y,rx,ry,seed){
 const points=[];
 for(let n=0;n<=32;n++){
 const a=n/32*Math.PI*2;
 points.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry]);
 }
 rough(c,points,seed,true);
}
function makePaper(){
 texture=document.createElement('canvas');texture.width=180;texture.height=180;
 const p=texture.getContext('2d');p.fillStyle='#fff';p.fillRect(0,0,180,180);
 p.strokeStyle='#f3f3f1';p.lineWidth=.65;
 for(let i=0;i<75;i++){
 const x=(Math.sin(i*21.17)*.5+.5)*180,y=(Math.cos(i*16.81)*.5+.5)*180;
 p.beginPath();p.moveTo(x,y);p.lineTo(x+2+(i%4),y+.7);p.stroke();
 }
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 if(!W||!H)return;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
 makePaper();resizeArt=true;
}
function fitArt(){
 const r=hc.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 if(r.width<1||r.height<1)return;
 artW=r.width;artH=r.height;
 hc.width=Math.round(artW*d);hc.height=Math.round(artH*d);
 art.setTransform(d,0,0,d,0,0);resizeArt=false;
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function hud(){
 const text='관찰 '+(stage+1)+' / 9';
 if(text!==hs){
 hs=text;$('sc').textContent=text;
 [...$('info').children].forEach((el,i)=>el.className='dot'+(i<stage?' done':i===stage?' current':''));
 }
}
function reset(){
 t=0;acc=0;stage=0;scores=Array(16).fill(0);answers=[];
 locked=false;wait=0;endT=0;down=false;hs='';flashChoice=-1;
 $('sub').hidden=true;$('sub').textContent='';
 $('rank').textContent='결과 공유';
 hud();
}
function start(){
 lb.audio.unlock();lb.audio.sfx(CLICK);
 reset();state='play';
 $('start').hidden=true;$('over').hidden=true;$('judging').hidden=true;
 $('quiz').hidden=false;$('hud').hidden=false;
 showQuestion();
}
function showQuestion(){
 const item=questions[stage];
 $('scene').textContent=item.scene;
 $('question').textContent=item.q;
 $('aside').textContent=item.aside;
 $('transition').textContent='';
 $('choices').replaceChildren();
 item.options.forEach((option,i)=>{
 const b=document.createElement('button');b.type='button';b.className='opt';
 const letter=document.createElement('span');letter.className='letter';letter.textContent=['가','나','다','라'][i];
 const text=document.createElement('span');text.textContent=option[0];
 b.append(letter,text);
 b.addEventListener('pointerdown',e=>{
 if(e.button!==0||state!=='play'||locked)return;
 choose(i,b,e.clientX,e.clientY);
 });
 b.addEventListener('click',e=>{
 if(e.detail!==0)return;
 const r=b.getBoundingClientRect();choose(i,b,r.x+r.width/2,r.y+r.height/2);
 });
 $('choices').append(b);
 });
 $('choices').classList.remove('enter');void $('choices').offsetWidth;$('choices').classList.add('enter');
 drawMini(item.animal);hud();
}
function drawMini(index){
 mini.setTransform(2,0,0,2,0,0);mini.clearRect(0,0,88,76);
 lb.assets.draw(mini,'gen/r'+(index+1),44,38,82,73);
}
function choose(index,button,x,y){
 if(state!=='play'||locked)return;
 locked=true;down=true;wait=.24;flashChoice=index;
 const o=questions[stage].options[index];
 scores[o[1]]+=3;scores[o[2]]+=(stage%2===0?2:1);
 answers.push(index);
 button.classList.add('on');
 [...$('choices').children].forEach(b=>b.disabled=true);
 $('transition').textContent=['그렇군요. 적어둘게요.','이런 쪽이군요.','조용히 관찰했어요.'][stage%3];
 lb.audio.sfx(CLICK);lb.haptic('light');
 lb.fx.ripple(x,y,{colors:[PAL[2],PAL[3]]});
 bump(button);
}
function pickResult(){
 const high=Math.max(...scores),candidates=[];
 scores.forEach((v,i)=>{if(v===high)candidates.push(i);});
 let fingerprint=17;
 answers.forEach((v,i)=>{fingerprint=(fingerprint*31+(v+1)*(i+3))%104729;});
 let latest=-1,shortlist=[];
 for(const candidate of candidates){
 let lastSupport=-1;
 answers.forEach((a,j)=>{
 const o=questions[j].options[a];
 if(o[1]===candidate||o[2]===candidate)lastSupport=j;
 });
 if(lastSupport>latest){latest=lastSupport;shortlist=[candidate];}
 else if(lastSupport===latest)shortlist.push(candidate);
 }
 return shortlist[fingerprint%shortlist.length];
}
function die(x,y,why,win){
 if(state!=='play')return;
 state='dying';endT=.8;locked=true;resultIndex=pickResult();
 $('quiz').hidden=true;$('hud').hidden=true;$('judging').hidden=false;
 $('why').textContent=why;
}

}

 const paint=picture.getContext('2d');
 lb.assets.draw(paint,'gen/r'+(index+1),160,160,300,300);
 return picture.toDataURL('image/png');
}

 });
 $('traits').replaceChildren();
 r.traits.forEach(text=>{const s=document.createElement('span');s.textContent=text;$('traits').append(s);});
 $('matches').replaceChildren();
 [[r.yes,'잘 맞아요'],[r.no,'잘 안 맞아요']].forEach(([index,label])=>{
 const p=document.createElement('p'),a=document.createElement('em'),b=document.createElement('span');
 const image=document.createElement('img');
 image.src=makeResultImage(index);image.alt=names[index]+' 낙서 그림';
 a.textContent=label;b.textContent=names[index];p.append(a,image,b);$('matches').append(p);
 });
 document.documentElement.style.setProperty('--c',colors[resultIndex]);
 resizeArt=true;fitArt();
 lb.done(names[resultIndex]);
 lb.audio.sfx(SPARKLE);lb.haptic('success');
 lb.fx.sparkle(W/2,H*.4);lb.fx.confetti();
 bump($('final'));
}
function update(dt){
 t+=dt;
 if(locked){
 wait-=dt;
 if(wait<=0){
 if(stage===questions.length-1){
 die(W/2,H/2,'너는 사실 이런 하찮은 동물이었다고 해요.',true);
 }else{
 stage++;locked=false;down=false;flashChoice=-1;showQuestion();
 }
 }
 }
}
function drawPaper(){
 ctx.clearRect(0,0,W,H);
 if(texture){
 const pattern=ctx.createPattern(texture,'repeat');
 ctx.fillStyle=pattern;ctx.fillRect(0,0,W,H);
 }
 ctx.strokeStyle='#e4e4e1';ctx.lineWidth=1;
 const drift=prefersStill?0:Math.sin(clock*.55)*1.8;
 const stars=[[W*.08,H*.19,5],[W*.9,H*.74,7],[W*.84,H*.12,4]];
 for(let i=0;i<stars.length;i++){
 const [x,y,r]=stars[i],points=[];
 for(let n=0;n<11;n++){
 const a=n/10*Math.PI*2-Math.PI/2,k=n%2?r*.4:r;
 points.push([x+Math.cos(a)*k,y+Math.sin(a)*k+drift]);
 }
 rough(ctx,points,22+i,true);
 }
 ctx.strokeStyle='#eeeeeb';
 rough(ctx,[[W*.08,H*.84],[W*.16,H*.835],[W*.21,H*.845],[W*.27,H*.84]],4);
 rough(ctx,[[W*.74,H*.27],[W*.81,H*.265],[W*.89,H*.275]],15);
}
function drawArt(){
 if(resizeArt)fitArt();
 if(!artW||!artH)return;
 art.clearRect(0,0,artW,artH);
 if(state==='start'){
 const side=Math.min(artH*.87,artW*.36),middle=Math.min(artH*.95,artW*.43);
 const bob=prefersStill?0:Math.sin(clock*1.2)*2;
 lb.assets.draw(art,'gen/r1',artW*.2,artH*.56+bob,side,side);
 lb.assets.draw(art,'gen/r2',artW*.5,artH*.48-bob,middle,middle);
 lb.assets.draw(art,'gen/r3',artW*.8,artH*.56+bob,side,side);
 art.strokeStyle='#777';art.lineWidth=1.2;
 rough(art,[[artW*.12,artH*.86],[artW*.2,artH*.88],[artW*.28,artH*.865]],19);
 }else if(state==='over'){
 const size=Math.min(artW*.9,artH*.98);
 const dy=prefersStill?0:Math.sin(clock*.85)*1.2;
 lb.assets.draw(art,'gen/r'+(resultIndex+1),artW/2,artH/2+dy,size,size);
 const age=clock-overAt;
 if(age<1.2){
 art.globalAlpha=Math.max(0,1-age/1.2)*.45;
 art.strokeStyle='#222';art.lineWidth=1.4;
 const radius=Math.min(artW*.42,artH*.44),points=[];
 const progress=Math.min(1,age/.65);
 for(let i=0;i<=Math.floor(progress*48);i++){
 const a=i/48*Math.PI*2;
 points.push([artW/2+Math.cos(a)*radius*1.12,artH/2+Math.sin(a)*radius]);
 }
 if(points.length>1)rough(art,points,9);
 art.globalAlpha=1;
 }
 }
}
function drawJudging(){
 scribble.setTransform(2,0,0,2,0,0);scribble.clearRect(0,0,140,140);
 scribble.strokeStyle='#222';scribble.lineWidth=1.8;scribble.lineCap='round';
 const progress=Math.min(1,(.8-endT)/.8),points=[];
 for(let i=0;i<=Math.floor(progress*100);i++){
 const a=i/100*Math.PI*6,r=9+i*.44;
 points.push([70+Math.cos(a)*r,70+Math.sin(a)*r*.75]);
 }
 if(points.length>1)rough(scribble,points,4);
}
function render(){
 if(!W||!H)return;
 drawPaper();
 if(state==='start'||state==='over')drawArt();
 else if(state==='dying')drawJudging();
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(paused)return;
 clock+=dt;
 if(state==='play'){
 acc+=dt;
 while(acc>=STEP&&state==='play'){update(STEP);acc-=STEP;}
 }else if(state==='dying'){
 endT-=dt;if(endT<=0)result();
 }
 render();
}
for(let i=0;i<9;i++){const d=document.createElement('span');d.className='dot';$('info').append(d);}
$('go').addEventListener('click',start);
[['toTraits',1],['toCard',0],['toMatches',2],['backTraits',1]].forEach(([id,page])=>{
 $(id).addEventListener('click',()=>{
 if(state!=='over')return;
 showResultPage(page);
 });
});
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.7)start();});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 lb.share('저는 '+names[resultIndex]+'예요. '+results[resultIndex].line+' 나는 어떤 하찮은 동물일까?');
});
const up=()=>{down=false;};
addEventListener('pointerup',up);
addEventListener('pointercancel',up);
lb.onPause(p=>{paused=p;last=0;up();});
addEventListener('resize',resize);
if(window.ResizeObserver){
 new ResizeObserver(resize).observe($('app'));
 new ResizeObserver(()=>{resizeArt=true;}).observe(hc);
}
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
