<title>내가 NPC라면?</title>
<style>
:root{--bg:#1e2a3a;--dot:#2f4858;--scr:#2f4858;--ink:#fff3d5;--sh:#111923;--act:#f2d24a;--on:#1e2a3a;--c:#3b6fd8;--title-font:monospace;--body-font:monospace}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg);font-family:var(--body-font,monospace)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
[hidden]{display:none!important}
button{font:400 clamp(17px,3.1vh,22px) var(--title-font,monospace);border:0;border-radius:0;cursor:pointer;touch-action:manipulation;color:var(--ink)}
button:focus-visible{outline:3px solid var(--act);outline-offset:6px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(7px,1.5vh,12px);padding:calc(18px + var(--lb-safe-top,0px)) calc(20px + var(--lb-safe-right,0px)) calc(18px + var(--lb-safe-bottom,0px)) calc(20px + var(--lb-safe-left,0px));overflow:hidden}
h1,h2,p{margin:0;word-break:keep-all}
h1,#final{font-family:var(--title-font,monospace);font-weight:400;letter-spacing:-.03em}
h1{font-size:clamp(25px,4.8vh,33px);line-height:1.4;text-shadow:3px 3px var(--sh)}
#start{padding-top:calc(55px + var(--lb-safe-top,0px))}
#start p{font-size:clamp(14px,2.7vh,18px);line-height:1.65;max-width:29em}
#start .eyebrow{font-size:clamp(12px,2.1vh,15px);color:var(--act);letter-spacing:.08em}
#hc{display:block;flex:1;min-height:32px;width:100%;max-width:360px;object-fit:contain;image-rendering:pixelated;background:var(--ink);border:6px solid var(--scr);outline:2px solid var(--act)}
#go,#again,#rank{min-height:64px;flex-shrink:0;background:var(--act);color:var(--on);box-shadow:0 -3px var(--ink),0 3px var(--ink),-3px 0 var(--ink),3px 0 var(--ink),5px 7px var(--sh);padding:10px 14px}
#go{width:min(100%,270px);margin:5px 0 3px}
#go:active,#again:active,#rank:active{background:var(--ink);box-shadow:0 -3px var(--act),0 3px var(--act),-3px 0 var(--act),3px 0 var(--act),2px 4px var(--sh)}
#hud{position:absolute;z-index:2;top:var(--lb-safe-top,0px);left:var(--lb-safe-left,0px);right:var(--lb-safe-right,0px);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
#sc{font-size:18px;background:var(--bg);padding:4px 9px;font-weight:400;font-variant-numeric:tabular-nums}
#info{display:flex;gap:5px}
#info i{display:block;width:clamp(10px,2.8vw,16px);height:10px;border:2px solid var(--ink);background:var(--bg)}
#info i.past{background:var(--act);border-color:var(--act)}
#info i.now{background:var(--ink)}
#play{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(72px + var(--lb-safe-top,0px)) calc(20px + var(--lb-safe-right,0px)) calc(22px + var(--lb-safe-bottom,0px)) calc(20px + var(--lb-safe-left,0px));gap:15px;overflow:hidden}
.win{background:var(--bg);box-shadow:0 -3px var(--ink),0 3px var(--ink),-3px 0 var(--ink),3px 0 var(--ink),5px 7px var(--sh)}
#quest{padding:15px;min-height:126px;position:relative}
#quest::before{content:"";position:absolute;right:12px;top:-8px;width:16px;height:12px;background:var(--act);box-shadow:4px 4px var(--sh)}
#qtag{font-size:14px;color:var(--act);margin-bottom:12px}
#question{font-size:clamp(18px,3.5vh,24px);line-height:1.65;font-weight:400;min-height:3.3em;white-space:pre-wrap}
#space{flex:1;min-height:18px;pointer-events:none}
#opts{display:flex;flex-direction:column;gap:12px}
.opt{position:relative;width:100%;min-height:56px;text-align:left;padding:10px 12px 10px 28px;background:var(--bg);line-height:1.4;font-size:clamp(16px,2.8vh,18px);font-family:var(--body-font,monospace);box-shadow:0 -2px var(--ink),0 2px var(--ink),-2px 0 var(--ink),2px 0 var(--ink),4px 6px var(--sh)}
.opt::before{content:"";position:absolute;left:10px;top:calc(50% - 4px);width:6px;height:8px;background:var(--act)}
.opt.on,.opt:active{background:var(--act);color:var(--on)}
.opt.on::before{background:var(--on);clip-path:polygon(0 0,100% 50%,0 100%)}
.opt:disabled{cursor:default}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:calc(20px + var(--lb-safe-top,0px)) calc(25px + var(--lb-safe-right,0px)) calc(20px + var(--lb-safe-bottom,0px)) calc(25px + var(--lb-safe-left,0px));background:var(--bg);font-size:18px}
#seal{width:64px;height:64px;background:var(--act);box-shadow:8px 0 var(--scr),-8px 0 var(--scr),0 8px var(--scr),0 -8px var(--scr);clip-path:polygon(20% 0,80% 0,80% 15%,100% 15%,100% 85%,80% 85%,80% 100%,20% 100%,20% 85%,0 85%,0 15%,20% 15%);position:relative}
#seal::after{content:"";position:absolute;left:24px;top:13px;width:16px;height:36px;background:var(--on);box-shadow:-7px 8px var(--on),7px 8px var(--on)}
#loadbar{height:16px;width:70%;background:var(--scr);border:3px solid var(--ink)}
#loadfill{height:100%;width:0;background:var(--act)}
