<title>나랑 닮은 반려친구</title>
<style>
:root{
 --bg:#fbe4ea;--wv:#d5d9f7;--fe:#fffaf8;--ink:#2f3350;
 --st:#9a9de2;--act:#6c60d1;--kb:#dfe2ff;--c:#ffdfe3;
 --title-font:ui-rounded,system-ui,sans-serif;
 --body-font:ui-rounded,system-ui,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{color:var(--ink);background:var(--bg);font-family:var(--body-font)}
button{font-family:var(--title-font);font-weight:400;cursor:pointer;border:0;color:inherit;touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.17;background:repeating-linear-gradient(0deg,var(--wv) 0 1px,transparent 1px 5px),repeating-linear-gradient(90deg,var(--wv) 0 1px,transparent 1px 5px)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scr{position:absolute;inset:0;padding:calc(12px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(12px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px));overflow:hidden}
h1,h2,p{margin:0;word-break:keep-all}
.ttl{font-family:var(--title-font);font-weight:400;letter-spacing:-.025em;-webkit-text-stroke:7px var(--fe);paint-order:stroke fill;text-shadow:0 3px var(--st);line-height:1.18}
.card,.opt,.chip,.main-btn,.patch{
 background:var(--fe);outline:2px dashed var(--st);outline-offset:-6px;
 border-radius:25px;box-shadow:0 5px 10px -6px var(--ink)
}
.chip{padding:7px 13px;font-size:clamp(18px,2.65vh,20px);line-height:1.12}
.main-btn{min-height:64px;padding:10px 18px;font-size:clamp(18px,2.9vh,22px);border-radius:25px}
#go,#rank{background:var(--act);color:var(--fe)}
.main-btn:active{box-shadow:inset 0 3px 7px -4px var(--ink)}
#start{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,16px);padding-top:calc(60px + var(--lb-safe-top,0px));text-align:center}
#start h1{font-size:clamp(30px,5.1vh,38px);max-width:330px}
#start .intro{max-width:340px;line-height:1.25}
.intro-art{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.hoop{border:9px solid var(--st);border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px var(--fe),0 7px 15px -10px var(--ink);position:relative;overflow:hidden}
.hoop:after{content:"";position:absolute;inset:7px;border:2px dashed var(--fe);border-radius:50%;pointer-events:none}
.start-hoop{height:100%;max-height:310px;aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center}
.art-img{display:block;width:100%;height:auto;object-fit:contain;max-height:100%;position:relative;z-index:1}
.fallback{width:100%;height:100%;min-height:0;display:grid;place-items:center;background:var(--c);font-family:var(--title-font);font-size:clamp(48px,12vh,96px);color:var(--ink)}
#go{width:min(100%,280px);flex-shrink:0}
#hud{position:absolute;right:calc(6px + var(--lb-safe-right,0px));top:calc(14px + var(--lb-safe-top,0px));bottom:calc(14px + var(--lb-safe-bottom,0px));width:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none}
.sb{position:relative;display:block;width:17px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--kb);border:2px solid var(--st);box-shadow:1px 2px 2px -1px var(--ink)}

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="start" class="scr">
 <h1 class="ttl">나랑 닮은<br>반려친구</h1>
 <p class="intro chip">오늘 동네에서<br>나랑 꼭 닮은 친구를 만날지도</p>
 <div class="intro-art"><div id="start-art" class="hoop start-hoop"></div></div>
 <button id="go" class="main-btn" type="button">테스트 시작</button>
</div>
<div id="play" class="scr" hidden>
 <div class="question-top">
  <div class="order-tag"><i class="tag-hole" aria-hidden="true"></i><b id="sc">1/9</b></div>
  <span id="place">동네 카페</span>
 </div>
 <div id="question-card" class="card"><h2 id="question"></h2></div>
 <div id="choices"></div>
</div>
<div id="hud" hidden aria-label="진행 단추"></div>
<div id="judging" hidden>
 <div class="judge-inner">
  <div class="cotton" aria-hidden="true"></div>
  <p>솜 채우는 중…</p>
  <div class="ribbon" aria-hidden="true"></div>
 </div>
</div>
<div id="over" class="scr" hidden>
 <div id="rp">
  <p class="result-label">동네에서 만난 내 닮은꼴</p>
  <div class="result-art"><div id="result-art" class="hoop result-hoop"></div></div>
  <b id="final" class="ttl"></b>
  <p id="shareline" class="chip"></p>
  <div id="traits"></div>
  <p id="description" class="card"></p>
  <div id="matches">
   <div class="patch"><div id="good-art" class="mini-art"></div><div class="match-copy"><span>잘 맞는 친구</span><b id="good-name"></b></div></div>
   <div class="patch"><div id="bad-art" class="mini-art"></div><div class="match-copy"><span>안 맞는 친구</span><b id="bad-name"></b></div></div>
  </div>
  <p class="lb-rec" id="record"></p>
  <div class="actions">
   <button id="again" class="main-btn" type="button">다시 하기</button>
   <button id="rank" class="main-btn" type="button">결과 공유</button>
  </div>
  <p id="why" hidden></p>
 </div>
</div>
</div>
<script>
lb.ready(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const PAL=['#F3E6EE','#E2C7D8','#8B5E3C','#7FCFB8','#3B4A7A'];
const CLICK='sfx/ui-pack/ui-click-b';
const SPARK='sfx/interface-sounds/minimize-005';
const MUSIC='music/oga-chiptunes/level-2';
const ROOT=document.documentElement;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

lb.assets.font('font/squareround-eb').then(v=>ROOT.style.setProperty('--title-font',v));
lb.assets.font('font/gaegu').then(v=>ROOT.style.setProperty('--body-font',v));

const types=[
 {name:'느긋한 라떼곰',color:'#8B5E3C',good:1,bad:2,
 line:'한 모금 천천히, 내 하루도 천천히',
 desc:['서두르지 않고 쉬어 갈 때를 잘 알아챔.','친구가 바빠 보여도 재촉하지 않고 옆자리 컵을 챙김.'],
 chips:['창가에 앉음','차를 식혀 마심','답장은 찬찬히']},
 {name:'다정한 솜토끼',color:'#F2B5C4',good:0,bad:3,
 line:'작은 표정도 그냥 지나치지 못함',
 desc:['친구의 짧아진 답장을 보고 기분을 먼저 살핌.','카페에선 말없이 친구 쪽으로 마지막 쿠키를 밀어 둠.'],
 chips:['안부 먼저 물음','간식 나눠 먹음','표정을 살핌']},
 {name:'바쁜 다람이',color:'#E07B39',good:4,bad:0,
 line:'생각난 일은 발부터 움직이는 중',
 desc:['하고 싶은 게 생기면 바로 움직이는 다람이와 닮음.','약속이 잡히면 갈 곳을 찾아 단톡방에 위치를 올림.'],
 chips:['일단 나가 봄','약속 먼저 잡음','길을 찾아 둠']},
 {name:'시크한 밤고양이',color:'#3B4A7A',good:5,bad:1,
 line:'조용해도 좋아하는 건 분명함',
 desc:['남들 분위기보다 내가 편한 쪽을 또렷하게 고름.','산책하다 마음에 든 골목에선 혼자 잠깐 발을 멈춤.'],
 chips:['혼자도 잘 놂','취향을 지킴','조용한 길 고름']},
 {name:'수다쟁이 오리',color:'#F4D03F',good:2,bad:5,
 line:'별일 없는 날도 얘깃거리는 있음',
 desc:['사소한 일도 썰이 되는 오리와 닮음.','단톡방이 조용해지면 오늘 카페에서 본 일을 풀어냄.'],
 chips:['재밌는 일 전함','답장을 곧장 함','사진을 보내 둠']},
 {name:'꼼꼼한 펭펭',color:'#5D7B8A',good:3,bad:4,
 line:'작은 메모 하나로 모두가 편해짐',
 desc:['놓치기 쉬운 걸 챙겨 두는 펭펭과 닮음.','카페 약속 전엔 영업시간과 빈자리를 확인해 둠.'],
 chips:['시간을 확인함','메모를 남겨 둠','준비물을 챙김']},
 {name:'엉뚱한 민트여우',color:'#7FCFB8',good:4,bad:5,
 line:'익숙한 동네에도 딴 길이 보임',
 desc:['늘 가던 길에서도 색다른 재미를 찾아냄.','컵받침에 그려진 무늬를 보고 친구 얼굴을 그려 줌.'],
 chips:['딴 길로 가 봄','낙서를 남김','새 조합을 고름']}
];

const questions=[
 {place:'동네 카페',q:'카페에 일찍 도착함. 친구가 올 때까지 뭘 할까?',
 a:[
 ['창가 자리면 ㄹㅇ 충분함',[[0,3],[3,1]]],
 ['친구 몫 컵받침도 챙김',[[1,3],[5,1]]],
 ['주문 번호와 시간을 확인함',[[5,3],[2,1]]],
 ['컵받침 무늬로 낙서함',[[6,3],[4,1]]]
 ]},
 {place:'친구들 단톡방',q:'단톡방이 조용하다... 귀여운 강아지 사진을 봤다면?',
 a:[
 ['사진이랑 긴 감상까지 보냄',[[4,3],[6,1]]],
 ['강아지 좋아하는 친구를 부름',[[1,2],[4,1]]],
 ['혼자 보고 살짝 웃음',[[3,3],[0,1]]],
 ['근처 강아지 카페를 찾아봄',[[2,3],[5,1]]]
 ]},
 {place:'주말 약속',q:'친구가 오늘은 집에 있고 싶대. 비어 버린 오후엔?',
 a:[
 ['나도 차 한 잔 마시며 쉼',[[0,3],[1,1]]],
 ['찜해 둔 가게로 바로 감',[[2,3],[6,1]]],
 ['취존하고 혼자 영화 봄',[[3,3],[1,1]]],
 ['안 가 본 버스를 타 봄',[[6,3],[2,1]]]
 ]},
 {place:'골목 화분',q:'단골 카페 사장님이 화분 자리를 고민함. 내 반응은?',
 a:[
 ['잎에 햇빛이 드는지 살핌',[[1,3],[5,1]]],
 ['빛 드는 시간을 적어 봄',[[5,3],[3,1]]],
 ['친구가 둔 자리 얘길 꺼냄',[[4,3],[1,1]]],
 ['컵받침 위에 작게 놓자고 함',[[6,3],[0,1]]]
 ]},
 {place:'저녁 산책길',q:'산책길에 낯선 빵집이 생김. 고소한 냄새가 난다.',
 a:[
 ['발길 닿은 김에 들어감',[[2,3],[4,1]]],
 ['벤치에서 냄새만 즐김',[[0,3],[3,1]]],
 ['독특한 빵 조합을 골라 봄',[[6,3],[2,1]]],
 ['내일 여는 시간을 확인함',[[5,3],[0,1]]]
 ]},
 {place:'카페 모임',q:'친구가 음료 이름을 엉뚱하게 읽어서 다 같이 웃음.',
 a:[
 ['집에 가서도 생각날 듯ㅋㅋ',[[4,3],[6,1]]],
 ['주문한 음료는 맞는지 봄',[[5,3],[2,1]]],
 ['친구도 웃는지 먼저 봄',[[1,3],[0,1]]],
 ['조용히 웃고 내 잔을 챙김',[[3,3],[5,1]]]
 ]},
 {place:'집에서 쉬는 날',q:'아무 약속 없는 휴일. 지금 제일 끌리는 건?',
 a:[
 ['담요 덮고 느리게 차 마심',[[0,3],[1,1]]],
 ['밀린 일을 적고 하나씩 함',[[2,2],[5,2]]],
 ['좋아하는 음악만 골라 들음',[[3,3],[6,1]]],
 ['친구에게 오늘 뭐 하냐고 물음',[[4,3],[1,1]]]
 ]},
 {place:'동네 작은 모임',q:'동네 모임에서 빈 탁자를 꾸미자고 함. 나는?',
 a:[
 ['컵받침을 이어 무늬를 만듦',[[6,3],[3,1]]],
 ['다 같이 낼 아이디어를 물음',[[4,3],[1,1]]],
 ['재료 구하러 얼른 다녀옴',[[2,3],[5,1]]],
 ['앉을 사람 자리를 챙겨 둠',[[1,3],[0,1]]]
 ]},
 {place:'문 닫기 전 카페',q:'카페에서 하루를 마무리함. 가방에 챙기고 싶은 건?',
 a:[
 ['아직 온기가 남은 차 한 잔',[[0,3],[1,1]]],
 ['혼자 적은 짧은 감상',[[3,3],[6,1]]],
 ['내일 할 일을 적은 수첩',[[5,3],[2,1]]],
 ['친구에게 보낼 오늘의 사진',[[4,3],[6,1]]]
 ]}
];

let W=0,H=0,last=0,clock=0,paused=false,state='start';
let index=0,totals=Array(7).fill(0),answers=[],locked=false,wait=0,endT=0;
let resultIndex=0,reported=false,overAt=0,hs='',colors={},puffs=[];
const marks=[];
for(let i=0;i<questions.length;i++){
 const el=document.createElement('i');
 el.className='sb';el.setAttribute('aria-hidden','true');
 $('hud').appendChild(el);marks.push(el);
}

function pale(hex){
 const n=parseInt(hex.slice(1),16);
 const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 return 'rgb('+Math.round(r*.22+255*.78)+','+Math.round(g*.22+255*.78)+','+Math.round(b*.22+255*.78)+')';
}
function art(host,id){
 host.replaceChildren();
 const d=types[id],url=lb.assets.url('gen/r'+(id+1));
 host.style.setProperty('--c',pale(d.color));
 if(url){
  const image=document.createElement('img');
  image.className='art-img';image.alt=d.name;image.src=url;
  image.addEventListener('error',()=>fallback(host,d),{once:true});
  host.appendChild(image);
 }else fallback(host,d);
}
function fallback(host,d){
 host.replaceChildren();
 const el=document.createElement('div');
 el.className='fallback';el.textContent=d.name.charAt(0);
 el.setAttribute('aria-label',d.name);
 host.appendChild(el);
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);
 ctx.setTransform(d,0,0,d,0,0);
 const css=getComputedStyle(ROOT);
 colors.ink=css.getPropertyValue('--ink').trim();
 colors.fe=css.getPropertyValue('--fe').trim();
 colors.st=css.getPropertyValue('--st').trim();
 colors.act=css.getPropertyValue('--act').trim();
}
function hud(){
 const text=(index+1)+'/'+questions.length;
 if(text!==hs){$('sc').textContent=text;hs=text;}
 marks.forEach((el,i)=>el.classList.toggle('on',i<answers.length));
}
function showQuestion(){
 const data=questions[index];
 $('question').textContent=data.q;
 $('place').textContent=data.place;
 $('choices').replaceChildren();
 data.a.forEach((a,i)=>{
  const button=document.createElement('button');
  button.type='button';button.className='opt';
  const badge=document.createElement('span');
  badge.className='k';badge.textContent=['가','나','다','라'][i];
  badge.setAttribute('aria-hidden','true');
  const text=document.createElement('span');
  text.className='opt-text';text.textContent=a[0];
  button.append(badge,text);
  button.addEventListener('pointerdown',e=>{
   if(e.isPrimary!==false)choose(i,button);
  });
  button.addEventListener('click',()=>choose(i,button));
  $('choices').appendChild(button);
 });
 locked=false;hud();
}
function reset(){
 index=0;totals=Array(7).fill(0);answers=[];locked=false;
 wait=0;endT=0;reported=false;hs='';puffs=[];
 resultIndex=0;
 $('why').textContent='';
 $('judging').hidden=true;
 ROOT.style.setProperty('--c',pale(types[0].color));
 showQuestion();
}
function start(){
 lb.audio.unlock();
 reset();state='play';
 $('start').hidden=true;$('over').hidden=true;
 $('play').hidden=false;$('hud').hidden=false;
 lb.audio.music(MUSIC,{loop:true,volume:.22});
}
function cottonBurst(x,y){
 for(let i=0;i<9;i++){
  const angle=i*Math.PI*2/9;
  puffs.push({x,y,vx:Math.cos(angle)*(34+Math.random()*36),vy:Math.sin(angle)*48-30,age:0,r:3+Math.random()*4});
 }
 if(puffs.length>90)puffs.splice(0,puffs.length-90);
}
function choose(choice,button){
 if(state!=='play'||locked)return;
 locked=true;
 const values=questions[index].a[choice][1];
 values.forEach(v=>totals[v[0]]+=v[1]);
 answers.push({choice,values});
 const buttons=[...$('choices').children];
 buttons.forEach(b=>{
  b.disabled=true;
  b.classList.toggle('on',b===button);
  b.classList.toggle('dim',b!==button);
 });
 const rect=button.getBoundingClientRect();
 cottonBurst(rect.left+rect.width*.5,rect.top+rect.height*.5);
 lb.audio.sfx(CLICK);
 lb.haptic('light');
 wait=.24;hud();
}
function pickResult(){
 const max=Math.max(...totals);
 const tied=totals.map((v,i)=>v===max?i:-1).filter(v=>v>=0);
 for(let i=answers.length-1;i>=0;i--){
  for(const v of answers[i].values){
   if(tied.includes(v[0]))return v[0];
  }
 }
 return tied[0];
}
function die(x,y,why,win){
 if(state!=='play')return;
 state='dying';endT=.72;resultIndex=pickResult();
 $('why').textContent=why;
 $('play').hidden=true;$('hud').hidden=true;
 $('judging').hidden=false;
 lb.audio.stopMusic();
 lb.audio.sfx(SPARK);
 lb.haptic('success');
 cottonBurst(x,y);
}
function result(){
 if(reported)return;
 state='over';overAt=clock;reported=true;
 const d=types[resultIndex];
 ROOT.style.setProperty('--c',pale(d.color));
 $('final').textContent=d.name;
 $('shareline').textContent=d.line;
 $('description').textContent=d.desc.join(' ');
 $('traits').replaceChildren();
 d.chips.forEach(t=>{
  const el=document.createElement('span');
  el.className='chip';el.textContent=t;$('traits').appendChild(el);
 });
 $('good-name').textContent=types[d.good].name;
 $('bad-name').textContent=types[d.bad].name;
 $('record').textContent='내가 자주 한 선택 · '+d.chips[0];
 art($('result-art'),resultIndex);
 art($('good-art'),d.good);art($('bad-art'),d.bad);
 $('judging').hidden=true;$('over').hidden=false;
 lb.done(d.name);
 lb.fx.confetti();
}
function update(dt){
 for(let i=puffs.length-1;i>=0;i--){
  const p=puffs[i];p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=95*dt;
  if(p.age>.65)puffs.splice(i,1);
 }
 if(state==='play'&&locked){
  wait-=dt;
  if(wait<=0){
   if(index===questions.length-1)die(W/2,H*.43,'나를 닮은 친구를 찾음',true);
   else{index++;showQuestion();}
  }
 }else if(state==='dying'){
  endT-=dt;
  const progress=Math.min(1,Math.max(0,1-endT/.72));
  $('judging').style.setProperty('--r',(12+progress*83)+'%');
  $('judging').style.setProperty('--p',reduced?'1':String(1+Math.sin(progress*Math.PI*4)*.065));
  if(endT<=0)result();
 }
}
function buttonDeco(x,y,r){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle=colors.st;ctx.globalAlpha=.30;
 ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle=colors.fe;ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(0,0,r*.73,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle=colors.ink;
 for(let i=0;i<4;i++){
  ctx.beginPath();ctx.arc((i%2?1:-1)*r*.24,(i<2?-1:1)*r*.24,1.5,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function heartDeco(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.globalAlpha=.22;ctx.fillStyle=colors.st;ctx.strokeStyle=colors.fe;ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(0,7);
 ctx.bezierCurveTo(-19,-5,-12,-18,0,-10);
 ctx.bezierCurveTo(12,-18,19,-5,0,7);ctx.fill();
 ctx.setLineDash([2,3]);ctx.stroke();ctx.restore();
}
function render(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 const sway=reduced?0:Math.sin(clock*.65)*3;
 buttonDeco(18,H*.27+sway,13);
 buttonDeco(W-16,H*.81-sway,11);
 heartDeco(W-22,H*.14+sway,.9);
 if(puffs.length){
  for(const p of puffs){
   ctx.save();ctx.globalAlpha=Math.max(0,1-p.age/.65);
   ctx.fillStyle=colors.fe;
   ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.25,p.r,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle=colors.st;ctx.globalAlpha*=.35;
   ctx.beginPath();ctx.arc(p.x+2,p.y+2,Math.max(0,p.r*.45),0,Math.PI*2);ctx.fill();
   ctx.restore();
  }
 }
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.05):0;
 last=now;if(paused)return;
 clock+=dt;update(dt);render();
}
lb.onPause(p=>{paused=p;last=0;});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{
 if(state==='over'&&clock-overAt>.35)start();
});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 const d=types[resultIndex];
 lb.share('내 반려친구는 '+d.name+'. '+d.line+'. 다들 어떤 친구 나옴?');
});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
art($('start-art'),0);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
