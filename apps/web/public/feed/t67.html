{q:"오늘 하루 고생한 나를 위한 편의점 힐링템은?", options:[{t:"꾸덕하고 달달한 디저트", s:[[3,2],[6,2],[7,2]], b:"A"},{t:"매콤하고 자극적인 야식", s:[[1,2],[4,2]], b:"B"},{t:"시원하고 상큼한 음료", s:[[2,2],[0,2]], b:"C"},{t:"전통의 맛 살린 묵직한 간식", s:[[5,2],[0,1]], b:"D"}]}
];

let scores=[0,0,0,0,0,0,0,0];

lb.assets.font("font/jua").then(v=>{document.documentElement.style.setProperty('--title-font',v);});
lb.assets.font("font/gowundodum").then(v=>{document.documentElement.style.setProperty('--body-font',v);});

function resize(){
  W=cv.clientWidth; H=cv.clientHeight;
  const d=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(W*d); cv.height=Math.round(H*d);
  ctx.setTransform(d,0,0,d,0,0);
  U=Math.max(1,Math.min(W,H)/10);
  if(W&&state==='start')render();
}

function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function hud(){
  $('sc').textContent=`${qi+1}/8`;
}
function reset(){
  qi=0; shk=0; down=false; hs='';
  scores=[0,0,0,0,0,0,0,0];
  hud();
}

function start(){
  reset();
  state='ask';
  $('start').hidden=$('over').hidden=true;
  $('hud').hidden=false;
  lb.audio.unlock();
  lb.audio.sfx('click');
  showQuestion();
}

function showQuestion(){
  hud();
  const qObj=questions[qi];
  let html=`<div class="card"><span class="num">${qi+1}/8</span><div class="qtext">${qObj.q}</div></div><div class="options">`;
  qObj.options.forEach((opt, idx)=>{
    html+=`<button class="o" data-idx="${idx}"><span class="bdg">${String.fromCharCode(65+idx)}</span><span>${opt.t}</span></button>`;
  });
  html+=`</div>`;
  $('start').innerHTML=html;
  $('start').hidden=false;
  
  document.querySelectorAll('.o').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      bump(btn);
      lb.audio.sfx('click');
      const idx=parseInt(btn.getAttribute('data-idx'));
      const mapping=qObj.options[idx].s;
      mapping.forEach(m=>{
        scores[m[0]]+=m[1];
      });
      qi++;
      if(qi<questions.length){
        showQuestion();
      } else {
        result();
      }
    });
  });
}

function result(){
  state='over';
  $('hud').hidden=true;
  $('start').hidden=true;
  
  let maxIdx=0;
  let maxScore=-1;
  scores.forEach((s, i)=>{
    if(s>maxScore){
      maxScore=s;
      maxIdx=i;
    }
  });
  
  const res=resultsData[maxIdx];
  document.documentElement.style.setProperty('--c', res.color);
  
  let html=`<section>
    <div class="rib">나와 꼭 닮은 신상 간식</div>
    <img data-lb-art="${res.img}" alt="${res.name}" class="result-img">
    <h2 class="nm" id="final">${res.name}</h2>
    <p style="font-size:14px;color:var(--ink)">헐 내 분신 같은 간식 이거 나옴! 너는 뭐 나옴?</p>
  </section>
  <section>
    <div class="chips">
      <div class="chip">#${res.chips[0]}</div>
      <div class="chip">#${res.chips[1]}</div>
      <div class="chip">#${res.chips[2]}</div>
    </div>
    <div class="desc-box">${res.desc}</div>
  </section>
  <section>
    <div class="match-box">
      <div class="match-card"><span>잘 맞는 짝꿍</span><b>${res.match}</b></div>
      <div class="match-card"><span>안 맞는 짝꿍</span><b>${res.mismatch}</b></div>
    </div>
    <div class="result-btns">
      <button id="again" class="btn-sub" type="button">다시 하기</button>
      <button id="rank" class="btn-sub" type="button">공유</button>
    </div>
  </section>`;
  
  $('rp').innerHTML=html;
  $('over').hidden=false;
  
  lb.pages(document.getElementById("rp"), { result: res.name });
  lb.audio.sfx('win');

  $('again').addEventListener('click',()=>{
    if(clock-overAt>.7) start();
  });
  $('rank').addEventListener('click',()=>lb.share());
  overAt=clock;
}

function render(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f4af91';
  ctx.beginPath();
  ctx.arc(W*0.8, H*0.2, U*2.5, 0, Math.PI*2);
  ctx.arc(W*0.2, H*0.8, U*3, 0, Math.PI*2);
  ctx.fill();
}

function frame(now){
  requestAnimationFrame(frame);
  const dt=last?Math.min((now-last)/1000,.1):0;
  last=now;
  if(!W){resize();if(!W)return;}
  if(paused)return;
  clock+=dt;
  render();
}

const up=()=>{down=false;};
lb.onPause(p=>{paused=p;last=0;up();});
$('go').addEventListener('click',start);
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();
if(W&&H)render();
requestAnimationFrame(frame);
});
</script></body></html>
