<head>


<title>나의 주말 충전법</title>
<style>
:root{--bg:#DDEFE6;--dot:#BFDCCD;--card:#FFF6E5;--paper:#FFF6E5;--ink:#493C34;--tt:#495D47;--act:#E58A3A;--kb:#E8D8B5;--c:#8C6A5A;--sh:#72675135;--title-font:ui-rounded,system-ui,sans-serif;--body-font:ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font)}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(16px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(16px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));gap:12px}
h1,h2,p{margin:0;word-break:keep-all}
h1,h2,button,#final{font-family:var(--title-font);font-weight:700}
button{border:0;color:var(--ink);cursor:pointer;touch-action:manipulation;font-size:18px;min-height:64px}
.ttl{color:var(--tt);letter-spacing:-.035em;text-shadow:0 2px var(--card),0 4px var(--sh)}
.card,.opt,.chip,.mainbtn{background:var(--card);border-radius:24px 29px 23px 27px;box-shadow:inset 0 2px 1px var(--paper),inset 0 -5px 3px var(--sh),0 7px 12px -6px var(--sh)}
.mainbtn{padding:12px 24px;background:var(--act);min-width:160px;flex-shrink:0}
.mainbtn:active{box-shadow:inset 0 4px 8px var(--sh)}
#start{justify-content:center}
#start h1{font-size:clamp(28px,5.3vh,38px);max-width:310px}
#start p{font-size:clamp(15px,2.6vh,18px);line-height:1.5;max-width:310px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--tt)}
#portraitSlot{width:100%;min-height:0;flex:1;display:flex;align-items:center;justify-content:center;max-height:290px;position:relative}
#portraitSlot:after{content:"";position:absolute;width:65%;height:24px;bottom:4%;border-radius:50%;background:var(--dot);box-shadow:inset 0 -5px 4px var(--sh);z-index:-1}
#hc{display:block;width:100%;height:100%;max-width:310px;max-height:290px;object-fit:contain}
#hud{position:absolute;top:calc(13px + var(--lb-safe-top,0px));left:calc(18px + var(--lb-safe-left,0px));right:calc(18px + var(--lb-safe-right,0px));display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#sc{font-size:18px;font-variant-numeric:tabular-nums;background:var(--card);border-radius:13px 15px 12px;padding:7px 12px;box-shadow:inset 0 -3px var(--sh)}
#beads{display:flex;gap:5px}
.bead{width:13px;height:14px;border-radius:47% 53% 44% 56%;background:var(--dot);box-shadow:inset 0 -3px var(--sh)}
.bead.done{background:var(--act)}
.bead.now{background:var(--kb);outline:2px solid var(--tt);outline-offset:2px}
#play{position:absolute;inset:0;padding:calc(62px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(14px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));display:flex;flex-direction:column;gap:12px}
#townSpace{flex:1;min-height:35px;position:relative}
#day{position:absolute;bottom:0;left:0;background:var(--card);border-radius:12px 17px 13px;padding:7px 11px;font-size:13px;box-shadow:inset 0 -3px var(--sh)}
#questionCard{position:relative;padding:16px 17px 18px;flex-shrink:0}

lb.ready(()=>{

const types=[
{name:'이불속 고슴도치',color:'#8C6A5A',good:2,bad:1,line:'포근한 이불에서 잔량을 채워요.',traits:'알람을 미뤄요 · 담요를 덮어요 · 낮잠을 챙겨요',desc:'쉴 때는 약속을 줄이고 몸부터 편하게 해요. 좋아하는 담요를 꺼내 무릎까지 덮어요.'},
{name:'축제 수달',color:'#E58A3A',good:3,bad:0,line:'좋아하는 사람을 만나면 힘이 나요.',traits:'친구를 불러요 · 사진을 남겨요 · 같이 웃어요',desc:'즐거운 일을 혼자만 알고 있기 아까워해요. 맛있는 간식을 사서 친구들 가운데 놓아요.'},
{name:'독서 거북',color:'#5E9E6E',good:0,bad:6,line:'책 한 권과 조용한 시간이면 돼요.',traits:'책을 펼쳐요 · 문장을 적어요 · 차를 우려요',desc:'궁금한 이야기를 따라가며 복잡한 생각을 정리해요. 마음에 드는 문장 옆에 작은 표시를 남겨요.'},
{name:'산책 강아지',color:'#E8C14A',good:1,bad:4,line:'동네 한 바퀴에 기분이 풀려요.',traits:'걸어서 가요 · 하늘을 봐요 · 골목을 돌아요',desc:'가벼운 움직임으로 답답한 기분을 털어내요. 익숙한 골목을 걸으며 새로 핀 꽃을 살펴봐요.'},
{name:'요리 곰',color:'#B5523B',good:5,bad:3,line:'맛있는 한 접시로 주말을 채워요.',traits:'재료를 골라요 · 앞치마를 매요 · 한입 나눠요',desc:'손으로 무언가 만들 때 생각이 차분해져요. 냉장고 속 재료를 꺼내 따뜻한 한 끼를 차려요.'},

{name:'모험 다람쥐',color:'#6A7FC9',good:1,bad:2,line:'낯선 길을 만나면 눈이 반짝여요.',traits:'지도를 펴요 · 새 길로 가요 · 표를 모아요',desc:'익숙한 하루에 새로 해 볼 일을 찾아요. 지도에서 낯선 동네를 골라 가방에 물병을 넣어요.'}
];
const questions=[
{day:'토요일 아침',who:'달력을 넘기던 이웃이 물어요.',q:'늦잠을 자도 되는 아침, 뭘 하고 싶어요?',a:[
['이불을 덮고 조금 더 누워요',[[0,3],[2,1]]],
['친구에게 아침 약속을 물어요',[[1,3],[3,1]]],
['창가 화분에 물을 줘요',[[5,3],[4,1]]],
['가 보고 싶던 동네로 가요',[[6,3],[3,2]]]]},
{day:'토요일 오전',who:'빵집 곰이 따끈한 봉투를 내밀어요.',q:'빵과 함께 보낼 시간은 어떻게 골라요?',a:[
['집에서 책을 읽으며 먹어요',[[2,3],[0,1]]],
['친구와 나눠 먹으며 얘기해요',[[1,3],[4,1]]],
['공원을 걸으며 벤치를 찾아요',[[3,3],[5,2]]]]},
{day:'토요일 점심',who:'이웃들이 마을 게시판 앞에 모였어요.',q:'빈 오후에 어떤 일이 끌려요?',a:[
['냉장고 재료로 요리를 해요',[[4,3],[5,1]]],
['버스를 타고 낯선 곳에 가요',[[6,3],[1,1]]],
['잔잔한 음악을 틀고 쉬어요',[[0,3],[2,1]]],
['화분을 옮기고 잎을 닦아요',[[5,3],[0,1]]]]},
{day:'토요일 오후',who:'수달이 마을 잔치에 같이 가자고 해요.',q:'잔치에 초대받으면 어떻게 보내요?',a:[
['친구들과 끝까지 구경해요',[[1,3],[6,1]]],
['산책하다 잠깐 들러 봐요',[[3,3],[1,1]]],
['간식을 만들어 들고 가요',[[4,3],[5,1]]]]},
{day:'토요일 저녁',who:'창밖으로 조용히 비가 내려요.',q:'갑자기 비가 오면 뭘 하며 쉬어요?',a:[
['이불 속에서 빗방울을 봐요',[[0,3],[5,1]]],
['밀린 책을 펼치고 차를 마셔요',[[2,3],[0,1]]],
['따뜻한 국을 끓여 먹어요',[[4,3],[2,1]]],
['내일 갈 곳을 지도에서 찾아요',[[6,3],[3,1]]]]},
{day:'일요일 아침',who:'토끼가 마을 정원 문을 열어요.',q:'햇볕 좋은 아침, 어디에 앉고 싶어요?',a:[
['꽃에 둘러싸인 작은 의자요',[[5,3],[0,1]]],
['책이 쌓여 있는 창가 자리요',[[2,3],[5,1]]],
['친구들이 모인 야외 식탁이요',[[1,3],[4,1]]],
['산책길 끝의 나무 벤치요',[[3,3],[6,1]]]]},
{day:'일요일 낮',who:'다람쥐가 빈 가방을 흔들며 물어요.',q:'주말 가방에 뭘 챙기고 싶어요?',a:[
['읽던 책과 작은 메모장이요',[[2,3],[0,1]]],
['지도와 간단한 여행 간식이요',[[6,3],[3,1]]],
['꽃 모종과 작은 물뿌리개요',[[5,3],[4,1]]],
['돗자리와 함께 먹을 도시락이요',[[4,3],[1,1]]]]},
{day:'일요일 오후',who:'강아지가 집 앞에서 손을 흔들어요.',q:'잠깐 여유가 생기면 뭘 하고 싶어요?',a:[
['운동화를 신고 동네를 걸어요',[[3,3],[6,1]]],
['집에서 푹신한 쿠션을 안아요',[[0,3],[2,1]]],
['친구를 만나 주말 얘기를 해요',[[1,3],[3,1]]]]},
{day:'일요일 밤',who:'마을 달력의 주말 칸을 접어요.',q:'오늘 가장 뿌듯했던 일은 무엇이에요?',a:[
['충분히 쉬고 책도 읽었어요',[[0,2],[2,3]]],
['사람들과 웃고 동네를 걸었어요',[[1,2],[3,3]]],
['한 끼를 만들고 화분을 돌봤어요',[[4,3],[5,2]]],
['낯선 길에서 새 가게를 찾았어요',[[6,3],[1,1]]]]}
];
let W=0,H=0,state='start',paused=false,last=0,clock=0,t=0,endT=0,overAt=0,index=0,answerDelay=0,locked=false,resultIndex=0,battery=0;
let scores=[],recent=[],answers=[],hs='',artDirty=true,back=null,decor=[],pieces=[];
const blobs=new Map(),beads=[];
lb.assets.font('font/squareround-eb').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--body-font',v));
for(let i=0;i<9;i++){const el=document.createElement('span');el.className='bead';$('beads').appendChild(el);beads.push(el);}
function blob(color){
 if(blobs.has(color))return blobs.get(color);
 const c=document.createElement('canvas');c.width=144;c.height=144;const g=c.getContext('2d');
 g.beginPath();
 const pts=[];
 for(let i=0;i<52;i++){const a=i/52*Math.PI*2,r=57*(1+.018*Math.sin(i*2.7)+.012*Math.cos(i*1.3));pts.push([72+Math.cos(a)*r,70+Math.sin(a)*r]);}
 g.moveTo((pts[51][0]+pts[0][0])/2,(pts[51][1]+pts[0][1])/2);
 for(let i=0;i<52;i++){const p=pts[i],n=pts[(i+1)%52];g.quadraticCurveTo(p[0],p[1],(p[0]+n[0])/2,(p[1]+n[1])/2);}
 g.closePath();g.save();g.shadowColor='rgba(61,52,39,.18)';g.shadowBlur=8;g.shadowOffsetY=5;g.fillStyle=color;g.fill();g.restore();g.save();g.clip();
 const shade=g.createLinearGradient(20,10,117,130);shade.addColorStop(0,'rgba(255,248,225,.23)');shade.addColorStop(.45,'rgba(255,248,225,0)');shade.addColorStop(1,'rgba(66,48,35,.24)');g.fillStyle=shade;g.fillRect(0,0,144,144);
 g.lineWidth=.8;
 for(let j=0;j<5;j++){g.beginPath();g.ellipse(48,49,13+j*3,8+j*2,-.55,.2,3.2);g.strokeStyle='rgba(60,45,32,.085)';g.stroke();g.beginPath();g.ellipse(48,48,13+j*3,8+j*2,-.55,.2,3.2);g.strokeStyle='rgba(255,245,220,.15)';g.stroke();}
 for(let i=0;i<125;i++){const x=14+(Math.sin(i*78.23)*.5+.5)*116,y=12+(Math.sin(i*31.6+2)*.5+.5)*116;g.fillStyle=i%2?'rgba(255,242,215,.12)':'rgba(61,46,34,.07)';g.fillRect(x,y,.8,1);}
 g.restore();blobs.set(color,c);return c;
}
function lump(g,color,x,y,w,h,angle=0){g.save();g.translate(x,y);g.rotate(angle);g.drawImage(blob(color),-w*.62,-h*.62,w*1.24,h*1.24);g.restore();}
function tree(g,x,y,s){
 lump(g,'#9BBC8E',x,y-s*.55,s*.65,s*.8);
 lump(g,'#B58A69',x,y+s*.13,s*.15,s*.7,.04);
 lump(g,'#A8C998',x-s*.18,y-s*.35,s*.58,s*.64,-.15);
 lump(g,'#BDD3A5',x+s*.2,y-s*.48,s*.63,s*.7,.1);
}
function house(g,x,y,s,color){
 lump(g,'#E8D9B8',x,y,s,s*.8);
 lump(g,color,x,y-s*.42,s*1.15,s*.43,-.03);
 lump(g,'#B58A69',x+s*.15,y+s*.18,s*.2,s*.38);
 lump(g,'#AEC8C1',x-s*.23,y-s*.02,s*.24,s*.22);
 lump(g,'#DDD2B2',x-s*.23,y-s*.02,s*.035,s*.25);
}
function bake(){
 back=document.createElement('canvas');back.width=Math.max(1,Math.ceil(W));back.height=Math.max(1,Math.ceil(H));
 const g=back.getContext('2d');g.fillStyle=PAL[0];g.fillRect(0,0,W,H);
 for(let j=0;j<Math.ceil(H/72);j++)for(let i=0;i<Math.ceil(W/78);i++){
  g.strokeStyle='rgba(93,125,102,.07)';g.lineWidth=2;g.beginPath();g.ellipse(i*78+24,j*72+22,21,6,-.12,0,Math.PI);g.stroke();
 }
 const ty=Math.max(100,Math.min(H*.30,215));
 lump(g,'#C9DFBE',W*.48,ty+72,W*1.5,145);
 lump(g,'#D3DFC1',W*.85,ty+40,W*.8,120);
 lump(g,'#B6D6CC',W*.56,ty+111,W*.7,34,-.08);
 tree(g,W*.08,ty-3,64);tree(g,W*.91,ty+7,74);
 house(g,W*.24,ty+13,71,'#D79A73');house(g,W*.77,ty-9,62,'#B1B789');
 lump(g,'#D8BA93',W*.54,ty+99,100,17,-.02);
 for(let j=0;j<6;j++)lump(g,'#C4A47E',W*.54-36+j*14,ty+99,6,22,-.03);
 lump(g,'#C3A07C',W*.54,ty+84,109,8,-.01);
 lump(g,'#E7EBD8',W*.12,ty-93,66,23);
 lump(g,'#E7EBD8',W*.83,ty-102,74,24);
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;
 const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
 bake();artDirty=true;render();
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function hud(){
 const s=(index+1)+'/9';if(s!==hs){$('sc').textContent=s;hs=s;}
 beads.forEach((b,i)=>{const cl='bead'+(i<index?' done':i===index?' now':'');if(b.className!==cl)b.className=cl;});
}
function showQuestion(){
 const q=questions[index];$('day').textContent=q.day;$('speaker').textContent=q.who;$('question').textContent=q.q;
 $('options').replaceChildren();
 q.a.forEach((a,j)=>{
 const b=document.createElement('button');b.type='button';b.className='opt';
 const k=document.createElement('span');k.className='k';k.textContent=['가','나','다','라'][j];k.setAttribute('aria-hidden','true');
 const tx=document.createElement('span');tx.textContent=a[0];b.append(k,tx);
 b.addEventListener('pointerdown',()=>{if(state==='play'&&!locked)b.classList.add('on');});
 b.addEventListener('pointercancel',()=>b.classList.remove('on'));
 b.addEventListener('click',()=>choose(j,b));
 $('options').appendChild(b);
 });hud();bump($('questionCard'));
}
function reset(){
 t=0;index=0;answerDelay=0;locked=false;scores=Array(7).fill(0);recent=Array(7).fill(-1);answers=[];battery=0;pieces=[];endT=0;hs='';resultIndex=0;artDirty=true;
}
function start(){
 reset();state='play';$('start').hidden=true;$('over').hidden=true;$('making').hidden=true;$('play').hidden=false;$('hud').hidden=false;
 lb.audio.unlock();lb.audio.music('music/oga-chiptunes/title-screen',{loop:true,volume:.25});
 lb.audio.sfx('sfx/oga512/sounds-button11');showQuestion();
}
function choose(j,b){
 if(state!=='play'||locked)return;locked=true;
 const a=questions[index].a[j];answers.push(j);
 a[1].forEach(([kind,n])=>{scores[kind]+=n;recent[kind]=index*4+n;});
 Array.from($('options').children).forEach(el=>el.disabled=true);b.classList.add('on');
 lb.audio.sfx('sfx/oga512/sounds-button11');lb.haptic('light');
 const r=b.getBoundingClientRect();lb.fx.ripple(r.left+28,r.top+r.height/2,{colors:[PAL[2],PAL[1]]});
 answerDelay=.2;
}
function pickResult(){
 const top=Math.max(...scores);let pool=[];
 scores.forEach((v,i)=>{if(v===top)pool.push(i);});
 const lastPick=Math.max(...pool.map(i=>recent[i]));pool=pool.filter(i=>recent[i]===lastPick);
 let signature=0;answers.forEach((v,i)=>signature=(signature*7+(v+1)*(i+3))%65521);
 return pool[signature%pool.length];
}
function die(x,y,why,win){
 if(state!=='play')return;resultIndex=pickResult();state='dying';endT=.65;locked=true;
 $('why').textContent=why;$('play').hidden=true;$('hud').hidden=true;$('making').hidden=false;
 lb.audio.stopMusic();lb.audio.sfx('sfx/oga512/sound-bling');lb.haptic('success');lb.fx.sparkle(x,y);
 for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2;pieces.push({x,y,vx:Math.cos(a)*(35+Math.random()*110),vy:-35-Math.random()*120,life:.85,size:5+Math.random()*5,color:i%2?PAL[2]:PAL[3]});}
}
function result(){
 if(state!=='dying')return;state='over';overAt=clock;const r=types[resultIndex];
 $('making').hidden=true;$('over').hidden=false;
 $('resultArt').appendChild($('hc'));document.documentElement.style.setProperty('--c',r.color);
 $('final').textContent=r.name;$('shareLine').textContent=r.line;$('traits').textContent=r.traits;$('description').textContent=r.desc;
 $('matchGood').textContent=types[r.good].name;$('matchBad').textContent=types[r.bad].name;
 $('record').textContent='주말 달력을 끝까지 채웠어요';
 lb.done(r.name);lb.audio.sfx('sfx/digital-audio/zap-three-tone-up');artDirty=true;drawPortrait();
}
function update(dt){
 t+=dt;
 battery+=(answers.length/9-battery)*(1-Math.exp(-dt*10));
 if(answerDelay>0){answerDelay-=dt;if(answerDelay<=0){if(index===8){die(W/2,H*.35,'당신의 주말 충전 동물이 나왔어요',true);}else{index++;locked=false;showQuestion();}}}
}
function drawBattery(){
 if(state!=='play'&&state!=='dying')return;
 const safe=lb.safe;
 const w=Math.min(W*.20,90),h=w*.58;
 const x=W*.5,y=Math.max((safe.top||0)+87,Math.min(H*.20,143));
 lump(ctx,'#A4B6A0',x,y,w,h);
 lump(ctx,'#A4B6A0',x+w*.54,y,w*.13,h*.4);
 lump(ctx,'#E9E5CA',x,y,w*.82,h*.65);
 const n=Math.min(9,answers.length);
 for(let i=0;i<9;i++){
  const cw=w*.068,cx=x-w*.33+i*w*.082;
  lump(ctx,i<n?'#E58A3A':'#D1D5B5',cx,y,cw,h*.43);
 }
 const bob=Math.sin(clock*2)*1.5;
 lump(ctx,'#C9D8B4',x-w*.3,y-h*.63+bob,9,5,-.4);
}
function drawPortrait(){
 hc.clearRect(0,0,640,520);
 if(state==='over'){
 const r=types[resultIndex];
 lb.assets.draw(hc,'gen/r'+(resultIndex+1),320,245,410,410);
 lb.assets.draw(hc,'gen/r'+(r.good+1),91,352,150,150);
 lb.assets.draw(hc,'gen/r'+(r.bad+1),549,352,150,150);
 }else{
 lb.assets.draw(hc,'gen/r1',320,263,430,430);
 }
 artDirty=false;
}
function render(){
 if(!W||!H||!back)return;
 ctx.clearRect(0,0,W,H);ctx.drawImage(back,0,0);
 if(state==='start'){
 const a=Math.sin(clock*.7)*4;
 lump(ctx,'#E7EBD8',W*.5+a,H*.12,69,22,.02);
 }
 drawBattery();
 for(const p of pieces)lump(ctx,p.color,p.x,p.y,p.size,p.size*.8,clock*2);
 if(artDirty)drawPortrait();
}
function frame(now){
 requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(paused)return;
 clock+=dt;
 if(state==='play')update(dt);
 else if(state==='dying'){
 battery+=(1-battery)*(1-Math.exp(-dt*10));
 endT-=dt;if(endT<=0)result();
 }
 for(let i=pieces.length-1;i>=0;i--){const p=pieces[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;if(p.life<=0||p.y>H+20)pieces.splice(i,1);}
 render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt<.7)return;start();});
$('rank').addEventListener('click',()=>{const r=types[resultIndex];lb.share('나의 주말 충전법은 '+r.name+'예요. '+r.line);});
lb.onPause(p=>{paused=p;last=0;});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
