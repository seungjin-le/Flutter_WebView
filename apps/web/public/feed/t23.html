<head>


<title>나는 무슨 카페 메뉴</title>
<style>
:root{--bg:#f6d9c4;--dot:#edc6ad;--paper:#fff1df;--ink:#492e24;--act:#bc6652;--soft:#edb7a0;--c:#c89f7a;--shade:#88543832;--title-font:ui-rounded,system-ui,sans-serif;--body-font:ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font)}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at center,var(--dot) 0 4px,transparent 5px) 13px 22px/79px 91px,var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
h1,h2,p{margin:0;word-break:keep-all}
button{font-family:var(--title-font);color:var(--ink);border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #7a4a32;outline-offset:3px}
.screen{position:absolute;inset:0;overflow:hidden;padding:calc(12px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(14px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px));display:flex;flex-direction:column;align-items:center;gap:clamp(7px,1.6vh,14px)}
.ttl{font-family:var(--title-font);font-weight:normal;letter-spacing:-.035em;color:#754634;text-shadow:0 2px #ffefdc,0 5px #a8704b30;line-height:1.15}
.card,.opt,.chip,.action{background:var(--paper);border-radius:25px 29px 24px 31px;box-shadow:inset 0 2px #fff8,inset 0 -4px var(--shade),0 8px 14px -9px #74492e65}
.label{font-size:clamp(12px,2vh,14px);letter-spacing:.04em}
.action{min-height:64px;padding:10px 24px;font-size:clamp(17px,2.8vh,20px);background:var(--act);color:#fff4e6}
.action:active{background:#a65847}
#go{flex:none;min-width:180px}
#start{padding-top:calc(60px + var(--lb-safe-top,0px));text-align:center}
#start h1{font-size:clamp(30px,5.5vh,42px)}
#start .hook{font-size:clamp(15px,2.5vh,18px);line-height:1.4;max-width:290px}
.start-art{width:100%;max-width:390px;flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.plate{position:absolute;bottom:10%;left:5%;right:5%;height:24%;border-radius:48% 52% 46% 54%;background:#d9a67f;box-shadow:inset 0 -8px #8e5c3930,0 14px 20px -14px #70472a66}
.start-art .portrait{position:relative;width:37%;height:80%;display:flex;align-items:center;justify-content:center;min-width:0}
.start-art .portrait:nth-of-type(2){transform:rotate(-9deg) translate(8%,7%);z-index:1}
.start-art .portrait:nth-of-type(3){transform:translateY(-7%);z-index:2}
.start-art .portrait:nth-of-type(4){transform:rotate(9deg) translate(-8%,8%);z-index:1}
.portrait img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}
.initial{width:100%;height:100%;max-height:180px;min-height:32px;display:grid;place-items:center;font:normal clamp(28px,9vh,58px) var(--title-font);color:#fff1de;background:var(--c);border-radius:45% 49% 42% 47%;box-shadow:inset 0 -7px #573a3225}
.small-note{font-size:12px;color:#775442}
#play{gap:clamp(7px,1.6vh,14px)}
.cafe-top{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:30px}
.number{padding:6px 13px;background:#ecd0ac;border-radius:12px 15px 11px 13px;box-shadow:inset 0 -3px #98683a26;font-size:14px;transform:rotate(-2deg)}
.cafe-name{font-size:13px;color:#79523f}
.display{flex:1;min-height:46px;width:100%;position:relative;display:flex;align-items:center;justify-content:center;max-height:170px}
.display .plate{bottom:5%;height:22%;left:16%;right:16%}
.display .portrait{position:relative;z-index:1;width:38%;height:100%;max-width:150px;display:flex;align-items:center;justify-content:center;transition:transform .25s}
.display.lit .portrait{transform:translateY(-5px) rotate(-4deg)}
.counter-line{position:absolute;bottom:0;left:3%;right:3%;height:13px;border-radius:8px;background:#a97550;box-shadow:inset 0 -5px #85563930}
#question{width:100%;padding:clamp(10px,2vh,16px) 17px;min-height:72px;display:flex;align-items:center;font-size:clamp(19px,3.2vh,23px);line-height:1.35}
#answers{width:100%;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,11px)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 13px;text-align:left;font:normal clamp(16px,2.8vh,19px) var(--body-font);line-height:1.3;transition:background .12s,transform .12s}
.opt:active,.opt.on{transform:scale(1,.94);background:#efd0b8}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="start" class="screen">
<p class="label">골목 끝 말랑 카페</p>
<h1 class="ttl">나는 무슨<br>카페 메뉴</h1>
<p class="hook">오늘 주문대에 오른 메뉴가<br>나와 똑 닮았대요.</p>
<div class="start-art" aria-label="점토 카페의 대표 메뉴">
<div class="plate" aria-hidden="true"></div>
<div class="portrait" id="startA"></div>
<div class="portrait" id="startB"></div>
<div class="portrait" id="startC"></div>
</div>
<button id="go" class="action" type="button">테스트 시작</button>
<p class="small-note">가볍게 즐겨요</p>
</div>
<div id="play" class="screen" hidden>
<div class="cafe-top"><span class="number" id="order">주문 번호 01</span><span class="cafe-name">말랑 카페에 왔어요</span></div>
<div id="display" class="display">
<div class="plate" aria-hidden="true"></div>
<div class="portrait" id="displayPic"></div>
<div class="counter-line" aria-hidden="true"></div>
</div>
<h2 id="question" class="card"></h2>
<div id="answers"></div>
<div id="hud" hidden><b id="sc">질문 1/9</b><div id="beads" aria-label="진행 표시"></div></div>
</div>
<div id="mixing" hidden><div class="dough" aria-hidden="true"></div><p>조물조물 빚고 있어요</p></div>
<div id="over" class="screen" hidden>
<p id="why">나를 닮은 메뉴가 나왔어요</p>
<div class="result-art"><div class="plate" aria-hidden="true"></div><div class="portrait" id="resultPic"></div></div>
<b id="final" class="ttl"></b>
<p id="shareline" class="chip"></p>
<div id="traits"></div>
<div id="description" class="card"></div>
<div class="matches">
<div class="match"><div class="portrait" id="goodPic"></div><div><p class="match-label">잘 맞는 친구예요</p><p class="match-name" id="goodName"></p></div></div>
<div class="match"><div class="portrait" id="otherPic"></div><div><p class="match-label">속도가 다른 친구예요</p><p class="match-name" id="otherName"></p></div></div>
</div>
<p class="lb-rec" id="record"></p>
<div class="result-actions"><button id="again" class="action" type="button">다시 빚기</button><button id="rank" class="action" type="button">결과 공유</button></div>
</div>
</div>
<script>
lb.ready(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const PAL=['#f6d9c4','#e8b49a','#7a4a32','#7fa65a','#c0504d'];
const menus=[
{n:'진한 에스프레소',c:'#4a2c1d',g:5,b:2,line:'짧게 말해도 취향은 또렷해요.',traits:['또렷한 기준','알찬 한마디','깊은 집중'],desc:['작은 잔에 맛이 꽉 찬 에스프레소처럼 요점을 짚어요.','남이 골라 주지 않아도 내 취향을 잘 알아요.','가끔은 결론보다 친구의 뒷말도 기다려 봐요.']},
{n:'몽글 카푸치노',c:'#c89f7a',g:14,b:4,line:'곁에 있으면 마음이 풀려요.',traits:['편안한 대화','포근한 배려','느긋한 호흡'],desc:['봉긋한 거품처럼 대화의 모난 곳을 부드럽게 감싸요.','친구가 말을 고르는 동안 재촉하지 않고 기다려요.','배려하느라 미룬 내 부탁도 꺼내 봐요.']},
{n:'딸기라떼',c:'#f28fa8',g:7,b:0,line:'좋아하는 건 숨기지 않아요.',traits:['솔직한 반응','작은 축하','다정한 표현'],desc:['분홍빛 딸기라떼를 보면 웃음이 나듯 반응이 밝아요.','좋은 일이 생긴 친구에게 축하를 아끼지 않아요.','남의 반응을 기다리기 전에 내 기분도 살펴봐요.']},
{n:'말차라떼',c:'#7fa65a',g:6,b:8,line:'내 속도로 차분하게 깊어져요.',traits:['차분한 관찰','취향의 깊이','고요한 시간'],desc:['천천히 풀리는 말차처럼 충분히 살핀 뒤 말을 건네요.','한 가지 취향을 오래 알아가는 시간을 좋아해요.','궁금한 사람에게는 먼저 한마디 해 봐요.']},
{n:'아이스 아메리카노',c:'#3b2a20',g:9,b:1,line:'깔끔한 선택으로 여유를 남겨요.',traits:['간결한 선택','현실 감각','시원한 거리'],desc:['얼음 든 커피처럼 생각을 깔끔하게 정리해요.','복잡한 약속도 할 수 있는 일부터 나누면 편해져요.','해결책 앞에 공감 한마디도 더해 봐요.']},
{n:'크루아상',c:'#e0a64b',g:0,b:11,line:'겹겹이 쌓은 취향이 있어요.',traits:['세심한 완성','꾸준한 손길','은근한 자신감'],desc:['겹겹의 빵결처럼 작은 수고를 차곡차곡 쌓아요.','마무리 하나까지 챙겨서 믿고 맡길 수 있어요.','충분히 잘했을 때는 손을 놓고 쉬어도 괜찮아요.']},
{n:'치즈케이크',c:'#f4d77a',g:3,b:13,line:'조용히 챙겨 주는 든든함이에요.',traits:['꾸준한 다정함','믿음직한 약속','담백한 표현'],desc:['단단한 바닥 위 치즈케이크처럼 곁을 든든히 지켜요.','말보다 약속을 지키고 필요한 것을 챙겨 줘요.','도와줄 여유가 없는 날에는 편하게 말해 봐요.']},
{n:'마카롱',c:'#b9a3e3',g:2,b:10,line:'작은 차이에서 즐거움을 찾아요.',traits:['섬세한 취향','작은 발견','조심스런 다정함'],desc:['작은 마카롱의 색과 맛처럼 미묘한 차이를 잘 알아봐요.','친구가 바꾼 소품도 그냥 지나치지 않아요.','마음에 든 것이 있다면 눈치 보지 말고 골라 봐요.']},
{n:'레몬에이드',c:'#f6e04a',g:15,b:3,line:'망설일 때 산뜻하게 움직여요.',traits:['가벼운 실행','빠른 전환','산뜻한 제안'],desc:['톡 쏘는 레몬에이드처럼 멈춘 대화에 새 제안을 건네요.','계획이 틀어져도 근처의 즐길 거리를 찾아요.','함께 가는 친구의 속도도 한 번 확인해 봐요.']},
{n:'초코머핀',c:'#5b3a29',g:4,b:12,line:'무심한 듯 챙기는 속이 달아요.',traits:['은근한 배려','솔직한 취향','편안한 의리'],desc:['진한 초코칩을 품은 머핀처럼 속에 다정함이 숨어 있어요.','긴 위로 대신 간식 하나를 조용히 건네요.','챙겨 주고 싶은 마음을 가끔은 말로도 전해 봐요.']},
{n:'와플',c:'#d8a24a',g:13,b:7,line:'함께 나누면 더 즐거워져요.',traits:['함께하는 재미','넉넉한 나눔','유쾌한 제안'],desc:['칸칸이 토핑을 나누는 와플처럼 함께 즐길 궁리를 해요.','어색한 자리에서도 누구나 낄 만한 이야기를 찾아요.','모두를 챙기기 전에 내 몫도 남겨 둬요.']},
{n:'블루베리 스무디',c:'#5a5fb0',g:12,b:5,line:'익숙한 조합에도 새 맛을 더해요.',traits:['자유로운 발상','뜻밖의 취향','유연한 선택'],desc:['여러 맛이 섞인 스무디처럼 다른 생각을 자연스럽게 이어요.','남들이 지나친 조합에서 재미를 찾는 편이에요.','생각이 많아지면 하나만 골라 완성해 봐요.']},
{n:'아포가토',c:'#f3ecd8',g:11,b:9,line:'서로 다른 매력을 같이 품어요.',traits:['반전 매력','새로운 조합','깊은 몰입'],desc:['차가운 아이스크림과 진한 커피처럼 두 취향을 품고 있어요.','평소에는 차분해도 좋아하는 얘기에는 푹 빠져요.','내가 원하는 시간을 주변에도 알려 줘요.']},
{n:'핫초코',c:'#7a4a32',g:10,b:6,line:'지친 친구가 쉬어 가는 한 잔이에요.',traits:['살뜰한 위로','편안한 온기','다정한 기억'],desc:['따끈한 머그처럼 친구가 긴장을 풀 자리를 내줘요.','전에 들은 고민을 기억했다가 조용히 안부를 물어요.','다른 사람만큼 내 피곤함도 챙겨 줘요.']},
{n:'시나몬롤',c:'#b5713c',g:1,b:15,line:'익숙한 하루를 더 다정하게 해요.',traits:['소소한 습관','오래가는 애정','정성스런 돌봄'],desc:['돌돌 말린 빵처럼 익숙한 일을 정성스럽게 반복해요.','자주 가는 곳과 오래된 친구에게 애정이 깊어요.','가끔은 늘 고르던 것 옆의 새 맛도 만나 봐요.']},
{n:'자몽 티',c:'#ff7a5c',g:8,b:14,line:'솔직한 말 뒤에 다정함이 남아요.',traits:['산뜻한 솔직함','또렷한 표현','기분 좋은 용기'],desc:['쌉싸름한 자몽과 따뜻한 차처럼 솔직함과 배려가 함께해요.','필요한 말은 하되 상대가 받을 말투도 고민해요.','꼭 답을 내지 않고 들어 주기만 해도 괜찮아요.']}
];
const questions=[
{q:'사장님이 오늘의 추천을 물어요. 어떻게 골라요?',a:[
['끌리는 맛을 바로 골라요',0,8],
['친구가 좋아할 맛도 살펴요',1,13],
['색과 곁들임을 꼼꼼히 봐요',7,5],
['낯선 재료의 조합을 골라요',11,12]]},
{q:'단골이 옆자리에 앉았어요. 어떤 얘기를 해요?',a:[
['요즘 반한 것을 신나게 말해요',2,15],
['편한 안부부터 천천히 나눠요',14,6],
['잘 몰랐던 취향을 물어봐요',3,7],
['웃긴 일을 꺼내 같이 웃어요',10,9]]},
{q:'친구가 약속보다 늦는대요. 기다리는 동안은요?',a:[
['할 일을 짧게 정리해요',4,0],
['따뜻한 잔을 미리 챙겨요',13,1],
['진열된 빵의 결을 구경해요',5,14],
['새로운 맛 조합을 상상해요',12,11]]},
{q:'창가 자리가 하나 났어요. 누구와 앉고 싶어요?',a:[
['차분히 얘기를 들어 주는 친구요',6,3],
['함께 사진을 고르는 친구요',7,2],
['근처 산책을 제안하는 친구요',8,15],
['말없이 있어도 편한 친구요',9,10]]},
{q:'바리스타가 새 간식을 건네요. 먼저 뭘 살펴요?',a:[
['한입 먹고 맛의 중심을 찾아요',0,4],
['친구와 나눌 크기인지 봐요',1,13],
['빵결과 마무리를 살펴봐요',5,6],
['향이 어우러지는지 느껴 봐요',3,14]]},
{q:'옆 테이블에서 웃음이 터져요. 나는요?',a:[
['눈이 마주치면 같이 웃어요',2,10],
['무슨 일인지 조심스레 살펴요',7,9],
['재미있는 얘기라면 끼고 싶어요',8,15],
['내 생각에 빠져 있다가 웃어요',11,12]]},
{q:'친구가 고민을 꺼냈어요. 어떤 반응이 나와요?',a:[
['당장 할 수 있는 일을 짚어요',4,0],
['끝까지 듣고 곁에 있어 줘요',13,1],
['전에 들은 얘기도 기억해 줘요',14,6],
['다른 쪽에서 볼 길을 찾아요',12,11]]},
{q:'카페에 둘 작은 물건을 고른다면요?',a:[
['마감이 고운 나무 쟁반이요',5,3],
['색이 예쁜 작은 컵받침이요',7,2],
['함께 꺼내 쓸 놀이 카드요',10,9],
['눈길을 끄는 과일 화분이요',15,8]]},
{q:'집에 갈 시간이 됐어요. 어떤 말을 남겨요?',a:[
['오늘 좋았던 맛을 꼭 말해요',0,5],
['다들 잘 들어갔는지 물어요',6,13],
['또 만나자는 약속을 잡아요',14,1],
['새 조합이 나오면 알려 달래요',11,12]]}
];
let W=0,H=0,state='start',paused=false,last=0,clock=0,t=0,index=0,scores=[],history=[],locked=false,wait=0,pending=-1,resultIndex=0,overAt=0,reported=false,background=null;
const options=[],beads=[],motion=matchMedia('(prefers-reduced-motion: reduce)').matches;
lb.assets.font('font/squareround-eb').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--body-font',v));
function picture(el,i){
el.replaceChildren();el.style.setProperty('--c',menus[i].c);
const src=lb.assets.url('gen/r'+(i+1));
if(src){
const img=document.createElement('img');img.alt=menus[i].n;img.src=src;
img.addEventListener('error',()=>fallback(el,i),{once:true});el.appendChild(img);
}else fallback(el,i);
}
function fallback(el,i){
el.replaceChildren();const p=document.createElement('span');p.className='initial';p.textContent=menus[i].n[0];p.setAttribute('aria-label',menus[i].n);el.appendChild(p);
}
function bake(){
background=document.createElement('canvas');background.width=Math.max(1,Math.round(W));background.height=Math.max(1,Math.round(H));
const c=background.getContext('2d');
function lump(x,y,rx,ry,color,phase){
c.save();c.translate(x,y);
c.beginPath();
const points=[];
for(let n=0;n<52;n++){const a=n/52*Math.PI*2,r=1+.025*Math.sin(a*7+phase)+.012*Math.cos(a*11);points.push([Math.cos(a)*rx*r,Math.sin(a)*ry*r]);}
c.moveTo((points[51][0]+points[0][0])/2,(points[51][1]+points[0][1])/2);
for(let n=0;n<52;n++){const p=points[n],q=points[(n+1)%52];c.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}
c.closePath();c.fillStyle=color;c.fill();
c.save();c.clip();c.fillStyle='#73452f10';c.beginPath();c.ellipse(rx*.4,ry*.65,rx,ry*.55,0,0,Math.PI*2);c.fill();
c.lineWidth=1;c.strokeStyle='#785b3b20';
for(let j=0;j<4;j++){c.beginPath();c.ellipse(-rx*.16,-ry*.1,rx*(.20+j*.055),ry*(.2+j*.07),-.3,.3,2.7);c.stroke();}
c.strokeStyle='#fff1df55';c.beginPath();c.ellipse(-rx*.16,-ry*.13,rx*.26,ry*.28,-.3,.3,2.7);c.stroke();c.restore();c.restore();
}
lump(-6,H*.27,25,49,'#e4b393',1);
lump(W+4,H*.72,21,43,'#d9b19a',3);
lump(W*.91,42,11,16,'#a9b783',2);
lump(W*.94,27,8,13,'#90a36b',4);
for(let j=0;j<12;j++)lump(16+(j*83)%(Math.max(1,W-32)),45+(j*113)%Math.max(1,H-60),1.4,1,'#976c4920',j);
}
function resize(){
W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;
const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);bake();render();
}
for(let k=0;k<4;k++){
const b=document.createElement('button');b.type='button';b.className='opt';
const badge=document.createElement('span');badge.className='k';badge.setAttribute('aria-hidden','true');badge.textContent=['가','나','다','라'][k];
const txt=document.createElement('span');b.append(badge,txt);b.addEventListener('pointerdown',()=>choose(k));
b.addEventListener('click',e=>{if(e.detail===0)choose(k);});
$('answers').appendChild(b);options.push({b,txt});
}
for(let k=0;k<9;k++){const bead=document.createElement('i');bead.className='bead';$('beads').appendChild(bead);beads.push(bead);}
function hud(){
$('sc').textContent='질문 '+(index+1)+'/9';
$('order').textContent='주문 번호 '+String(index+1).padStart(2,'0');
beads.forEach((b,k)=>b.className='bead'+(k<index?' done':k===index?' current':''));
}
function showQuestion(){
const data=questions[index];$('question').textContent=data.q;
options.forEach((o,k)=>{o.txt.textContent=data.a[k][0];o.b.disabled=false;o.b.classList.remove('on');});
$('display').classList.remove('lit');hud();
}
function reset(){
t=0;index=0;scores=Array(16).fill(0);history=[];locked=false;wait=0;pending=-1;resultIndex=0;reported=false;
$('mixing').hidden=true;picture($('displayPic'),1);showQuestion();
}
function start(){
lb.audio.unlock();lb.audio.sfx('sfx/oga512/sounds-button11');
reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
}
function choose(k){
if(state!=='play'||paused||locked)return;
locked=true;pending=k;wait=.28;
const a=questions[index].a[k];scores[a[1]]+=3;scores[a[2]]+=(index%2?2:1);history.push(a);
options.forEach((o,j)=>{o.b.disabled=true;o.b.classList.toggle('on',j===k);});
picture($('displayPic'),a[1]);$('display').classList.add('lit');
lb.audio.sfx('sfx/oga512/sounds-button11');lb.haptic('light');
}
function pickResult(){
let candidates=[];const max=Math.max(...scores);
scores.forEach((v,i)=>{if(v===max)candidates.push(i);});
for(let j=history.length-1;j>=0&&candidates.length>1;j--){
const a=history[j],weight=i=>i===a[1]?3:i===a[2]?(j%2?2:1):0;
const top=Math.max(...candidates.map(weight));candidates=candidates.filter(i=>weight(i)===top);
}
return candidates[0];
}
function die(x,y,why,win){
if(state!=='play')return;
state='dying';wait=.68;$('why').textContent=why;
$('mixing').hidden=false;$('play').hidden=true;$('hud').hidden=true;resultIndex=pickResult();
}
function result(){
state='over';overAt=clock;const r=menus[resultIndex];
$('mixing').hidden=true;$('over').hidden=false;$('over').style.setProperty('--c',r.c);
$('final').textContent=r.n;$('shareline').textContent=r.line;
picture($('resultPic'),resultIndex);picture($('goodPic'),r.g);picture($('otherPic'),r.b);
$('goodName').textContent=menus[r.g].n;$('otherName').textContent=menus[r.b].n;
$('traits').replaceChildren();r.traits.forEach(v=>{const span=document.createElement('span');span.className='chip';span.textContent=v;$('traits').appendChild(span);});
$('description').replaceChildren();r.desc.forEach(v=>{const p=document.createElement('p');p.textContent=v;$('description').appendChild(p);});
$('record').textContent='오늘의 카페에서 나를 찾았어요';
if(!reported){reported=true;lb.done(r.n);}
lb.audio.sfx('sfx/interface-sounds/minimize-006');lb.audio.sfx('sfx/oga512/sounds-fanfare2');lb.haptic('success');
const safe=lb.safe;lb.fx.sparkle(Math.max(safe.left+25,Math.min(W-safe.right-25,W*.5)),Math.max(safe.top+25,Math.min(H-safe.bottom-25,H*.3)));
}
function update(dt){
t+=dt;
if(state==='play'&&locked){
wait-=dt;
if(wait<=0){
if(index===8){die(W*.5,H*.5,'나를 닮은 메뉴가 나왔어요',true);return;}
index++;pending=-1;locked=false;showQuestion();
}
}else if(state==='dying'){wait-=dt;if(wait<=0)result();}
}
function render(){
if(!W||!H)return;
ctx.clearRect(0,0,W,H);if(background)ctx.drawImage(background,0,0,W,H);
if(!motion&&state==='start'){
const y=Math.sin(clock*.8)*2;
ctx.fillStyle='#8c684716';ctx.beginPath();ctx.ellipse(W*.1,H*.52+y,5,2,-.4,0,Math.PI*2);ctx.fill();
}
}
function frame(now){
requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.1):0;last=now;
if(paused)return;clock+=dt;
if(state==='play'||state==='dying')update(dt);render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.7)start();});
$('rank').addEventListener('click',()=>{const r=menus[resultIndex];lb.share('나는 '+r.n+'예요. '+r.line+' 나는 무슨 카페 메뉴인지 알아봐요.');});
lb.onPause(p=>{paused=p;last=0;});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
picture($('startA'),5);picture($('startB'),2);picture($('startC'),1);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
