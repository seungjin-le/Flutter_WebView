<head>


<title>운명의 파트너</title>
<style>
:root{
 --sky:#e9c9c2;--bg:#fbf3f0;--ink:#573d45;--acc:#874a57;
 --pk:#efb9c5;--gl:#ffffffdc;--sh:#ad7c8430;--c:#9fc8e8;
 --title-font:ui-rounded,sans-serif;--body-font:serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden}
body{color:var(--ink);background:var(--bg);font-family:var(--body-font)}
button{font-family:var(--title-font);color:var(--ink);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(var(--sky),var(--bg) 76%)}
#app::after{content:"";position:absolute;bottom:-7%;left:-15%;width:130%;height:24%;border-radius:50%;background:var(--gl);pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.44}
.screen{position:absolute;inset:0;z-index:2;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,15px);padding:calc(15px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(16px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));text-align:center}
h1,h2,p{margin:0;font-weight:400;word-break:keep-all}
button{border:0;font-weight:400}
.ttl{font-family:var(--title-font);font-weight:400;letter-spacing:-.02em;color:var(--acc);-webkit-text-stroke:6px var(--gl);paint-order:stroke fill;line-height:1.13}
.glass,.box,.opt{background:var(--gl);border:2px solid var(--gl);border-radius:21px;box-shadow:0 6px 18px var(--sh)}
.btn{min-height:64px;padding:8px 26px;border-radius:40px;background:var(--acc);color:var(--bg);font-size:clamp(20px,3vh,24px);flex-shrink:0;box-shadow:0 5px 15px var(--sh)}
.btn:active{background:var(--ink)}
.btn.soft{background:var(--gl);color:var(--acc);border:2px solid var(--pk)}
.tag{display:inline-block;padding:4px 13px;border-radius:20px;background:var(--acc);color:var(--bg);font-size:12px;line-height:1.4}
.small{font-size:clamp(12px,1.8vh,14px)}
#start{padding-top:calc(60px + var(--lb-safe-top,0px));gap:clamp(7px,1.4vh,13px)}
#start h1{font-size:clamp(30px,5.7vh,38px)}
.eyebrow{font-size:12px;letter-spacing:.06em}
.intro{font-size:clamp(15px,2.5vh,17px);line-height:1.5}
.start-art{position:relative;flex:1;min-height:0;width:100%;isolation:isolate;max-width:400px}
.halo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(var(--gl) 25%,transparent 70%);z-index:-1}
.portrait{display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.portrait img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;min-height:0}
.start-art .portrait{position:absolute;top:4%;bottom:5%;width:65%;padding:6px;background:var(--gl);border:1px solid var(--gl);border-radius:15px;box-shadow:0 7px 20px var(--sh)}
.start-art .portrait:first-of-type{left:0;transform:rotate(-9deg);z-index:1}
.start-art .portrait:last-of-type{right:0;transform:rotate(9deg);top:0;bottom:10%}
.fallback{height:100%;min-height:48px;width:100%;border-radius:20px;background:var(--c);display:grid;place-items:center;font-family:var(--title-font);font-size:clamp(40px,12vh,92px);color:var(--ink)}
#start .hook{font-size:clamp(14px,2.3vh,16px);line-height:1.45}
#go{width:min(85%,280px)}
#hud{position:absolute;z-index:4;top:calc(18px + var(--lb-safe-top,0px));right:calc(10px + var(--lb-safe-right,0px));bottom:calc(18px + var(--lb-safe-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;width:30px}
#sc{font-size:12px;font-weight:400;font-variant-numeric:tabular-nums;writing-mode:vertical-rl;letter-spacing:2px;color:var(--acc)}
#hearts{display:flex;flex-direction:column;gap:13px;align-items:center}
.heart{position:relative;width:8px;height:8px;background:var(--gl);transform:rotate(-45deg);opacity:.85}
.heart::before,.heart::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:inherit}
.heart::before{top:-4px;left:0}.heart::after{left:4px;top:0}
.heart.filled{background:var(--acc)}
.heart.current{background:var(--pk)}
#play{padding-right:calc(45px + var(--lb-safe-right,0px));padding-top:calc(18px + var(--lb-safe-top,0px));justify-content:center;gap:clamp(10px,2.3vh,22px)}
.question-top{width:100%;flex:0 1 34%;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(10px,2.3vh,20px)}
.props{height:clamp(34px,8vh,60px);width:150px;position:relative;flex-shrink:1}
.chalk{position:absolute;left:4px;top:2px;width:77px;height:43px;border:4px solid var(--gl);border-radius:4px;background:var(--ink);transform:rotate(-5deg);opacity:.68}
.chalk::before,.chalk::after{content:"";position:absolute;height:2px;background:var(--gl);left:10px;right:13px;top:12px;opacity:.65}
.chalk::after{top:23px;right:27px}
.notebook{position:absolute;right:25px;top:11px;width:43px;height:46px;border-radius:3px;background:repeating-linear-gradient(transparent 0 8px,var(--pk) 8px 9px),var(--gl);border-left:4px solid var(--pk);transform:rotate(11deg)}
.tray{position:absolute;right:0;bottom:0;width:65px;height:29px;border:2px solid var(--gl);border-radius:8px;background:var(--c)}
.tray::before{content:"";position:absolute;inset:4px 24px 4px 4px;border:1px solid var(--gl);border-radius:5px}
.tray::after{content:"";position:absolute;right:5px;top:4px;bottom:4px;width:13px;border:1px solid var(--gl);border-radius:4px}
.box{position:relative;padding:clamp(19px,3vh,27px) 15px 20px;width:100%}
.box .tag{position:absolute;left:14px;top:-14px}
#question{font-size:clamp(19px,3.1vh,22px);line-height:1.55}
.box::after{content:"";position:absolute;bottom:10px;right:13px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--acc);animation:breath 2.4s infinite}
#options{width:100%;display:flex;flex-direction:column;gap:clamp(8px,1.7vh,13px);flex-shrink:0}
.opt{width:100%;min-height:clamp(50px,8.2vh,65px);padding:9px 12px;font-size:clamp(17px,2.7vh,18px);line-height:1.45;text-align:center;font-family:var(--body-font);transition:box-shadow .12s,background .12s}
.opt:active,.opt.on{background:var(--bg);box-shadow:0 0 0 3px var(--pk)}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
#back{min-width:100px;min-height:48px;background:transparent;color:var(--acc);font-size:17px;padding:8px 16px}
#back:disabled{visibility:hidden}
#reading{justify-content:center}
.read-board{padding:26px;border-radius:15px;background:var(--ink);color:var(--bg);border:6px solid var(--gl);box-shadow:0 8px 25px var(--sh);font-family:var(--title-font);font-size:clamp(26px,5vh,34px);transform:rotate(-2deg)}
#over{padding:0;display:block}
#rp{width:100%;height:100%;overflow:hidden}
#rp section{width:100%;height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,16px);text-align:center}
.page-kicker{font-size:12px;letter-spacing:.06em;flex-shrink:0}
.result-art{width:100%;flex:1;min-height:0;position:relative;display:flex;justify-content:center;align-items:center}
.result-art .portrait{width:100%;height:100%;padding:7px;border:2px solid var(--gl);border-radius:24px;background:var(--gl);box-shadow:0 6px 24px var(--sh)}
.result-art .portrait img{height:100%}
#final{font-size:clamp(32px,5.6vh,40px);font-weight:400;flex-shrink:0}
.result-quote{padding:11px 15px;width:100%;font-size:clamp(15px,2.5vh,17px);line-height:1.5;flex-shrink:0}
.result-label{align-self:flex-start;color:var(--acc);font-size:12px;padding-left:8px}

}
function reset(){
 qIndex=0;answers=[];selected=-1;lock=0;acc=0;hs='';pending='next';
 $('over').hidden=true;$('reading').hidden=true;
 $('rank').textContent='결과 공유';
}
function start(){
 reset();state='play';
 $('start').hidden=true;$('play').hidden=false;$('hud').hidden=false;
 lb.audio.unlock();
 lb.audio.sfx('sfx/oga512/sounds-button1');
 lb.audio.music('music/oga-chiptunes/level-3',{loop:true,volume:.24});
 showQuestion();
}
function showQuestion(){
 const item=questions[qIndex];
 $('question').textContent=item.q;
 $('place').textContent=item.place;
 $('back').disabled=qIndex===0;
 $('options').replaceChildren();
 item.a.forEach((answer,index)=>{
  const button=document.createElement('button');
  button.type='button';button.className='opt enter';button.textContent=answer[0];
  button.addEventListener('pointerdown',e=>{
   if(e.isPrimary===false||e.button>0||state!=='play')return;
   choose(index,e.clientX,e.clientY);
  });
  $('options').appendChild(button);
 });
 hud();
}
function choose(index,x,y){
 if(state!=='play')return;
 answers[qIndex]=index;selected=index;state='choosing';lock=.3;
 $('options').querySelectorAll('button').forEach((el,k)=>{el.disabled=true;el.classList.toggle('on',k===index);});
 $('back').disabled=true;
 lb.audio.sfx('sfx/casino-audio/cards-pack-take-out-2');
 lb.haptic('light');
 lb.fx.burst(x,y,{colors:[colors.pk,colors.gl,colors.sky]});
}
function back(){
 if(state!=='play'||qIndex===0)return;
 qIndex--;answers.length=qIndex;selected=-1;hs='';
 lb.audio.sfx('sfx/oga512/sounds-button1');
 showQuestion();
}
function calculate(){
 const totals=Array(12).fill(0);
 let hash=17;
 answers.forEach((choice,n)=>{
  const weights=questions[n].a[choice][1];
  weights.forEach(pair=>totals[pair[0]]+=pair[1]);
  hash=(Math.imul(hash,31)+(n+1)*(choice+3))>>>0;
 });
 const max=Math.max(...totals),ties=[];
 totals.forEach((value,n)=>{if(value===max)ties.push(n);});
 return ties[hash%ties.length];
}
function die(){
 if(state!=='choosing')return;
 resultIndex=calculate();
 state='dying';lock=.78;
 $('play').hidden=true;$('hud').hidden=true;$('reading').hidden=false;
 lb.audio.stopMusic();
 lb.audio.sfx('sfx/interface-sounds/maximize-008');
 lb.haptic('success');
 const s=lb.safe;
 lb.fx.sparkle((W+s.left-s.right)/2,(H+s.top-s.bottom)/2);
}
function result(){
 const r=data[resultIndex];
 state='over';overAt=clock;
 document.documentElement.style.setProperty('--c',r.color);
 $('final').textContent=r.name;
 $('shareLine').textContent=r.line;
 $('why').textContent='나를 빛나게 하는 운명의 파트너를 찾았어';
 $('description').replaceChildren();
 r.desc.forEach(text=>{
  const p=document.createElement('p');p.textContent=text;$('description').appendChild(p);
 });
 $('chips').replaceChildren();
 r.chips.forEach(text=>{
  const chip=document.createElement('span');chip.className='chip';chip.textContent=text;
  $('chips').appendChild(chip);
 });
 putPortrait($('resultPic'),resultIndex);
 putPortrait($('goodPic'),r.good);
 putPortrait($('badPic'),r.bad);
 $('goodName').textContent=data[r.good].name;
 $('badName').textContent=data[r.bad].name;
 $('goodNote').textContent=r.gn;
 $('badNote').textContent=r.bn;
 $('reading').hidden=true;$('over').hidden=false;
 lb.audio.sfx('sfx/digital-audio/high-up');
 lb.fx.confetti();
 lb.pages(document.getElementById("rp"), { result: r.name });
}
function update(dt){
 if(state==='choosing'){
  lock-=dt;
  if(lock<=0){
   if(qIndex===questions.length-1){die();return;}
   qIndex++;selected=-1;state='play';showQuestion();
  }
 }else if(state==='dying'){
  lock-=dt;if(lock<=0)result();
 }
}
function blossom(x,y,r,angle){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);
 ctx.fillStyle=colors.pk;
 for(let i=0;i<5;i++){
  ctx.rotate(Math.PI*2/5);
  ctx.beginPath();ctx.ellipse(0,-r*.62,r*.4,r*.65,0,0,Math.PI*2);ctx.fill();
 }
 ctx.fillStyle=colors.bg;
 ctx.beginPath();ctx.arc(0,0,Math.max(0,r*.2),0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function render(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 ctx.drawImage(backdrop,0,0,W,H);
 const ct=reduced?0:clock;
 for(let n=0;n<15;n++){
  const xx=((n*83.71+Math.sin(ct*.17+n)*26)%(W+50))-20;
  const yy=((n*69.13+ct*(7+n%3))%(H+60))-30;
  ctx.globalAlpha=.24+(n%3)*.12;
  blossom(xx,yy,4+n%4,ct*.12+n);
 }
 ctx.globalAlpha=1;
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(paused)return;
 clock+=dt;
 acc+=dt;
 while(acc>=STEP){update(STEP);acc-=STEP;}
 render();
}
for(let n=0;n<9;n++){
 const heart=document.createElement('i');heart.className='heart';
 $('hearts').appendChild(heart);
}
putPortrait($('startPicA'),0);
putPortrait($('startPicB'),1);
$('go').addEventListener('click',start);
$('back').addEventListener('pointerdown',e=>{
 if(e.isPrimary!==false&&e.button<=0)back();
});
$('again').addEventListener('click',()=>{
 if(state==='over'&&clock-overAt>.65)start();
});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 const r=data[resultIndex];
 lb.share('내 운명의 파트너 유형은 '+r.name+'. '+r.line+'. 다들 어떤 유형임?');
});
lb.onPause(p=>{paused=p;last=0;});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
