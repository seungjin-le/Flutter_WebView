<html lang="ko">
<head>


<title>나만의 핑 테스트</title>
<style>
:root{--bg:#cfe3ee;--paper:#fdfaf2;--ink:#283634;--act:#f5e9b8;--c:#6f9fb8;--blob:#365d70;--acc:#f3b6c2;--accd:#4a5860}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font,var(--title-font, sans-serif))}
button{font-family:var(--title-font,sans-serif);color:var(--ink);cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr,#play{position:absolute;inset:0;overflow:hidden;padding:calc(9px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(10px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px));display:flex;flex-direction:column;gap:10px}
.room{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px;border-bottom:3px solid var(--ink);padding-bottom:7px;font-size:clamp(15px,2.7vh,19px);font-weight:700}
.room:before{content:"";width:24px;height:21px;border:3px solid var(--ink);border-radius:9px 8px 9px 2px;background:var(--paper);transform:rotate(-7deg)}
.room span{flex:1}
.room small{font-size:12px;font-weight:500}
h1,h2,p{margin:0;word-break:keep-all}
h1,#final{font-family:var(--title-font,sans-serif);letter-spacing:-.025em;font-weight:800}
h1{font-size:clamp(26px,5.5vh,38px);line-height:1.05;text-align:center}
h1 em{font-style:normal;background:var(--act);border:3px solid var(--ink);border-radius:10px 15px 9px 13px;padding:0 5px}
.subline{text-align:center;font-size:clamp(15px,2.8vh,19px);color:var(--accd);line-height:1.15}
.blob{background:var(--blob);color:var(--paper);border:3px solid var(--ink);border-radius:20px 17px 22px 6px;padding:11px 14px;box-shadow:2px 3px 0 var(--ink)}
#start{align-items:stretch}
#start .room{margin-bottom:6px}
#start .tag{text-align:center;align-self:center;font-size:clamp(18px,3vh,21px);padding:7px 18px;transform:rotate(-2deg)}
.hero-space{position:relative;flex:1;min-height:35px;display:flex;justify-content:center;align-items:stretch;overflow:hidden}
#hc{display:block;height:100%;width:100%;min-height:0;touch-action:none}
#start .note{font-size:clamp(13px,2.4vh,16px);text-align:center;line-height:1.2}
.btn{border:3px solid var(--ink);border-radius:17px 14px 19px 8px;min-height:64px;padding:8px 13px;font-size:clamp(18px,3.1vh,22px);background:var(--act);box-shadow:3px 4px 0 var(--ink);font-weight:700}
.btn:active{box-shadow:1px 1px 0 var(--ink);background:var(--acc)}
#go{flex:none;width:100%}
#hud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
#dots{display:flex;gap:6px;align-items:center}
.dot{width:14px;height:14px;border:2px solid var(--ink);border-radius:47% 54% 45% 52%;background:var(--paper);transform:rotate(-8deg)}
.dot.filled{background:var(--c)}
.dot.current{background:var(--act);outline:2px solid var(--ink);outline-offset:2px}
#sc{font-size:20px;font-variant-numeric:tabular-nums}
#questionArea{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:4px 3px}
.sender{font-size:14px;margin-left:4px;color:var(--accd)}
#question{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:21px 18px 18px 5px;padding:20px 18px;box-shadow:3px 4px 0 var(--ink);font-size:clamp(20px,3.8vh,25px);line-height:1.3;font-weight:700}
#question:before{content:"";position:absolute;width:12px;height:13px;left:-8px;bottom:6px;background:var(--paper);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:skewY(-30deg)}
#replyLabel{font-size:14px;text-align:right;color:var(--accd)}
#options{flex:none;display:flex;flex-direction:column;gap:12px;width:94%;align-self:flex-end;padding:0 4px 4px 0}
.opt{position:relative;text-align:left;display:flex;align-items:center;gap:12px;min-height:64px;border:3px solid var(--ink);border-radius:17px 15px 5px 18px;background:var(--act);box-shadow:3px 4px 0 var(--ink);font-size:clamp(18px,3vh,21px);line-height:1.15;padding:9px 12px}
.opt:after{content:"";position:absolute;right:-7px;bottom:5px;width:9px;height:12px;background:inherit;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:skewY(28deg)}
.opt .letter{flex:none;width:27px;height:27px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:49% 45% 54% 48%;font-size:16px;background:var(--paper)}
.opt.on{background:var(--acc);animation:reply .32s ease}
.opt:active{box-shadow:1px 1px 0 var(--ink)}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
@keyframes reply{40%{transform:translateY(-5px) rotate(-1deg)}70%{transform:translateY(1px)}}
#notice{flex:none;min-height:20px;font-size:14px;text-align:center;color:var(--accd)}
#over{gap:6px}
#rp{height:100%;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
#rp .room{min-height:30px;font-size:15px}
#profile{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;border:3px solid var(--ink);border-radius:23px 18px 21px 8px;background:var(--paper);padding:8px 12px;box-shadow:3px 4px 0 var(--ink);overflow:hidden;text-align:center}
#portrait{flex:1;min-height:32px;position:relative;overflow:hidden}
#why{flex:none;text-align:center;font-size:12px;color:var(--accd)}
#final{font-size:clamp(30px,5.8vh,40px);line-height:1.02}
#shareLine{font-size:clamp(14px,2.6vh,17px);line-height:1.1}
#chips{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.chip{font-size:clamp(12px,2.2vh,15px);padding:3px 7px;background:var(--blob);color:var(--paper);border-radius:11px 8px 12px 7px;transform:rotate(-2deg)}
.chip:nth-child(2){transform:rotate(2deg)}
#description{font-size:clamp(13px,2.6vh,17px);line-height:1.18;text-align:left}
.lb-rec{font-size:12px;text-align:center;color:var(--accd)}
#matches{display:flex;gap:8px;flex:none}
.match{flex:1;text-align:center;border:2px solid var(--ink);border-radius:13px 10px 12px 6px;padding:4px 5px;background:var(--paper);font-size:clamp(12px,2.4vh,15px);line-height:1.1}
.match b{display:block;font-size:clamp(15px,2.8vh,18px)}
#actions{display:flex;gap:10px;flex:none;padding:0 4px 4px 0}
#actions .btn{flex:1;min-width:0;font-size:clamp(17px,3vh,21px);padding:7px}
#again{background:var(--paper)}
#sub{font-size:12px;min-height:0;text-align:center}
@media(max-height:560px){
.scr,#play{gap:6px;padding-top:calc(6px + var(--lb-safe-top,0px));padding-bottom:calc(7px + var(--lb-safe-bottom,0px))}
.room{min-height:29px;padding-bottom:4px}
#start .room{margin-bottom:0}
#questionArea{gap:5px}
#question{padding:12px 14px}
#options{gap:8px}
#notice{min-height:16px}
#profile{gap:4px;padding:5px 9px}
#description{font-size:14px}
#matches{gap:6px}
#rp{gap:4px}
}
@media(max-height:440px){
#matches{display:none}
#chips{display:none}
#start .tag,#start .note{display:none}
#start .room{min-height:25px}
#start h1{font-size:27px}
#start .subline{font-size:14px}
#profile{border-width:2px}

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<section id="start" class="scr">
<div class="room"><span>우리 동네 핑 모임</span><small>새 알림</small></div>
<h1>나만의 <em>핑</em> 테스트</h1>
<p class="subline">나는 어떤 핑일까?</p>
<div class="hero-space" id="startPortrait"><canvas id="hc" aria-label="동물 핑 캐릭터"></canvas></div>
<p class="blob tag">긍정핑? 믿음핑? 귀찮핑?</p>
<p class="note">오늘 하루 고르는 걸로 알아보자<br>내 답장에 닮은 동물 핑이 숨어 있음!</p>
<button id="go" class="btn" type="button">테스트 시작</button>
</section>
<section id="play" hidden>
<div class="room"><span>우리 동네 핑 모임</span><small>답장 기다리는 중</small></div>
<div id="hud"><div id="dots" aria-hidden="true"></div><b id="sc">1/9</b></div>
<div id="questionArea"><p class="sender">동네 친구가 보냄</p><h2 id="question"></h2></div>
<p id="replyLabel">내 답장 고르기</p>
<div id="options"></div>
<p id="notice" role="status">오늘 내 마음이 가는 답장으로!</p>
</section>
<section id="over" class="scr" hidden>
<div id="rp">
<div class="room"><span>우리 동네 핑 모임</span><small>프로필 도착</small></div>
<div id="profile">
<p id="why"></p>
<div id="portrait"></div>
<b id="final"></b>
<p id="shareLine"></p>
<div id="chips"></div>
<p id="description"></p>
<p id="record" class="lb-rec"></p>
</div>
<div id="matches">
<p class="match">잘 맞는 핑<b id="goodMatch"></b></p>
<p class="match">안 맞는 핑<b id="badMatch"></b></p>
</div>
<div id="actions"><button id="again" class="btn" type="button">다시 하기</button><button id="rank" class="btn" type="button">결과 공유</button></div>
<p id="sub"></p>
</div>
</section>

<script>
lb.ready(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),hc=$('hc'),hctx=hc.getContext('2d');
const PAL=['--bg','--paper','--ink','--act','--c','--acc','--blob'],STEP=1/120;
const sounds={tap:'sfx/interface-sounds/click-001',sparkle:'sfx/interface-sounds/maximize-007',win:'sfx/oga512/sounds-fanfare2',whoosh:'sfx/oga512/wpn-sword3'};
const types=[
['긍정핑','잘될 구석부터 찾는 흰 곰임','실수해도 웃을 구석을 먼저 찾음. 비 오는 날엔 창가 자리를 골라 친구를 부름.',['좋은 점 찾음','웃으며 답장함','친구를 부름'],1,15],
['신남핑','재밌는 일엔 귀부터 쫑긋함','재밌어 보이면 일단 가까이 가는 토끼임. 동네 행사가 뜨면 친구에게 같이 가자고 보냄.',['행사부터 봄','사진을 찍음','친구를 모음'],0,7],
['귀찮핑','편하게 지낼 길을 아는 고양이임','쓸데없이 기운 빼는 일을 잘 걸러냄. 약속이 비면 좋아하는 자리에 누워 간식을 꺼냄.',['동선을 줄임','빈 날을 지킴','편한 옷 고름'],7,10],
['믿음핑','말한 건 챙겨 두는 강아지임','친구가 마음 놓고 맡길 수 있는 강아지임. 약속 전날엔 시간과 장소를 한 번 더 확인함.',['약속을 지킴','연락을 챙김','맡은 일 끝냄'],4,9],
['다정핑','작은 기분도 챙기는 양임','친구 표정이 달라지면 먼저 알아챔. 카페에서 주문할 때 친구가 좋아하는 차도 기억해 냄.',['표정을 살핌','취향을 기억함','차를 건넴'],3,12],
['꼼꼼핑','빠진 게 없는지 보는 부엉이임','할 일을 적어 두면 마음이 편해짐. 모임을 잡을 때 영업시간과 예약 여부를 챙김.',['목록을 적음','시간을 확인함','가방을 점검함'],12,1],
['수다핑','답장에 이야기가 붙는 앵무새임','친구 말에서 재밌는 이야깃거리를 잘 찾음. 카페에서 본 작은 일도 단톡방에 풀어놓음.',['근황을 물음','답장을 길게 함','이야길 보탬'],1,11],
['느긋핑','서두르지 않는 나무늘보임','급한 분위기에도 차분하게 주변을 봄. 약속이 늦춰지면 창밖을 보며 음료를 천천히 마심.',['천천히 마심','기다림을 즐김','산책을 길게 함'],2,1],
['용감핑','낯선 곳도 가 보는 사자임','망설이는 친구들 앞에서 한 발 먼저 나섬. 동네에서 길을 잃으면 가게에 들어가 길을 물음.',['먼저 말을 검','낯선 길을 감','손부터 들어봄'],10,11],
['엉뚱핑','생각이 옆길로 튀는 문어임','평범한 얘기에도 색다른 생각을 붙임. 친구 사진에 어울리는 별명을 지어 단톡방에 보냄.',['별명을 지음','낙서를 보탬','조합을 바꿔봄'],14,3],
['열정핑','마음먹으면 발이 바쁜 여우임','하고 싶은 일이 생기면 금방 움직임. 동네 행사에 가기로 하면 챙길 물건부터 모음.',['곧바로 움직임','끝까지 해봄','목표를 적음'],8,2],
['조용핑','혼자 있는 시간도 좋은 펭귄임','말이 적어도 친구 이야기는 놓치지 않음. 카페 구석에서 음악을 들으며 답장을 천천히 씀.',['끝까지 들음','구석에 앉음','음악을 고름'],5,6],
['똑똑핑','궁금하면 찾아보는 너구리임','복잡한 얘기를 차근차근 풀어냄. 친구들이 갈 곳을 못 고르면 거리와 비용을 비교해 보냄.',['이유를 물음','정보를 비교함','요점을 적음'],5,4],
['먹보핑','먹을 얘기에 볼이 부푸는 햄스터임','맛있는 걸 찾으면 함께 먹을 친구가 떠오름. 동네 빵집을 지나면 갓 나온 빵부터 살펴봄.',['간식을 챙김','맛집을 저장함','한 입을 나눔'],0,15],
['깜짝핑','작은 발견에도 눈이 커지는 개구리임','새로운 소식에 반응이 바로 나옴. 산책길에 낯선 꽃을 보면 멈춰 서서 사진을 찍음.',['발견을 알림','사진을 남김','표정이 먼저임'],9,5],
['새침핑','취향이 분명한 플라밍고임','좋아하는 색과 분위기를 또렷하게 고름. 카페에 가면 마음에 드는 잔과 자리를 골라 앉음.',['취향을 지킴','자리를 고름','마음껏 고름'],11,13]
];
const Q=[
['친구가 카페에서 음료를 쏟으면?',[
['괜찮다며 휴지부터 건넴',[[0,3],[4,2]]],
['분위기 풀 얘기를 꺼냄',[[1,2],[6,3]]],
['자리만 옮겨 편하게 앉음',[[2,3],[7,2]]]]],
['단톡방에서 동네 모임을 잡는다면?',[
['시간과 장소를 확인함',[[3,3],[5,2]]],
['내가 모아 보겠다고 함',[[8,3],[10,1]]],
['갈 곳을 비교해서 올림',[[11,1],[12,3]]]]],
['카페에 낯선 디저트가 나왔다면?',[
['맛이 궁금해서 주문함',[[13,3],[1,2]]],
['특이한 모양부터 살펴봄',[[9,2],[14,3]]],
['늘 먹던 걸 편하게 고름',[[15,3],[2,2]]]]],
['친구가 약속에 늦는다고 하면?',[
['무슨 일 있겠지 하고 기다림',[[0,2],[3,3]]],
['괜찮은지 물으며 수다 떪',[[4,3],[6,2]]],
['혼자 창밖 보며 쉬고 있음',[[7,3],[11,2]]]]],
['동네 축제에 빈 무대가 보이면?',[
['친구와 해볼 걸 궁리함',[[8,1],[10,3]]],
['참가 조건부터 읽어봄',[[5,3],[12,2]]],
['뜻밖의 공연을 상상함',[[9,3],[14,2]]]]],
['카페에서 딱 마음에 드는 때는?',[
['맛있는 한 입을 나눌 때',[[13,2],[0,3]]],
['내 취향의 구석에 앉을 때',[[15,2],[11,3]]],
['친구랑 얘기가 쏟아질 때',[[1,3],[6,2]]]]],
['산책하려는데 비가 내리면?',[
['집에서 느긋하게 쉬기로 함',[[2,2],[7,3]]],
['친구 우산부터 챙겨 봄',[[3,2],[4,3]]],
['비 그칠 때와 길을 찾아봄',[[5,1],[12,3]]]]],
['동네 가게에서 작은 행사를 열면?',[
['참여할 수 있는 걸 물어봄',[[8,2],[10,3]]],
['낯선 물건 구경에 빠짐',[[9,3],[14,2]]],
['취향에 맞는 간식을 고름',[[13,3],[15,2]]]]],
['오늘 일정을 다 마친 저녁이라면?',[
['친구에게 즐거웠다고 보냄',[[0,1],[8,1]]],
['편한 자리에 앉아 쉬고 있음',[[7,1],[11,1]]],
['오늘 발견한 걸 적어 둠',[[9,1],[12,1]]]]]
];
let W=0,H=0,state='start',paused=false,last=0,acc=0,clock=0,t=0,lock=0,q=0,chosen=-1,answer=[],points=[],recent=[],resultIndex=0,overAt=0,hs='',colors=[],texture=null,hW=0,hH=0,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
lb.assets.font('font/gaegu').then(v=>document.documentElement.style.setProperty('--title-font',v));
for(let i=0;i<Q.length;i++){const d=document.createElement('span');d.className='dot';$('dots').appendChild(d);}
function readColors(){const s=getComputedStyle(document.documentElement);colors=PAL.map(k=>s.getPropertyValue(k).trim());}
function resize(){
W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;
const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);readColors();
texture=document.createElement('canvas');texture.width=Math.ceil(W);texture.height=Math.ceil(H);
const c=texture.getContext('2d');c.strokeStyle=colors[4];c.lineCap='round';c.globalAlpha=.12;c.lineWidth=2;
for(let y=8;y<H;y+=18){for(let x=-35;x<W;x+=58){c.beginPath();c.moveTo(x,y);c.lineTo(x+29,y-10);c.stroke();}}
hW=0;render();
}
function fitHero(){
const r=hc.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
if(r.width<=0||r.height<=0)return false;
if(r.width!==hW||r.height!==hH){hW=r.width;hH=r.height;hc.width=Math.round(hW*d);hc.height=Math.round(hH*d);hctx.setTransform(d,0,0,d,0,0);}
return true;
}
function hud(){
const v=(q+1)+'/'+Q.length;
if(v!==hs){$('sc').textContent=v;hs=v;[...$('dots').children].forEach((d,i)=>{d.className='dot'+(i<q?' filled':i===q?' current':'');});}
}
function reset(){
t=0;acc=0;lock=0;q=0;chosen=-1;answer=[];points=Array(16).fill(0);recent=Array(16).fill(-1);resultIndex=0;hs='';$('sub').textContent='';$('notice').textContent='오늘 내 마음이 가는 답장으로!';
}
function showQuestion(){
hud();$('question').textContent=Q[q][0];$('options').replaceChildren();
Q[q][1].forEach((a,i)=>{
const b=document.createElement('button');b.type='button';b.className='opt';
const l=document.createElement('span');l.className='letter';l.textContent=['가','나','다'][i];
const text=document.createElement('span');text.textContent=a[0];b.append(l,text);
b.addEventListener('pointerdown',e=>{if(e.button!==0)return;select(i,b);});
b.addEventListener('click',()=>select(i,b));
$('options').appendChild(b);
});
}
function start(){
reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;
lb.audio.unlock();showQuestion();
}
function select(i,button){
if(state!=='play'||lock>0||chosen>=0)return;
chosen=i;lock=.4;answer.push(i);
const weights=Q[q][1][i][1];
weights.forEach(([id,n])=>{points[id]+=n;recent[id]=q*10+n;});
button.classList.add('on');[...$('options').children].forEach(b=>b.disabled=true);
$('notice').textContent=q===Q.length-1?'마커로 칠하는 중…':'내 답장 보냈음!';
lb.audio.sfx(sounds.tap);lb.haptic('light');
}
function resolve(){
let ids=points.map((_,i)=>i);
const salt=answer.reduce((s,a,i)=>(s*5+a+i)%997,0);
ids.sort((a,b)=>points[b]-points[a]||recent[b]-recent[a]||((b+salt)%16)-((a+salt)%16));
resultIndex=ids[0];
}
function die(x,y,why,win){
if(state!=='play')return;
resolve();state='dying';lock=.35;$('notice').textContent='마커로 칠하는 중…';
}
function result(){
if(state!=='dying')return;
state='over';overAt=clock;
const r=types[resultIndex];$('play').hidden=true;$('over').hidden=false;
$('why').textContent='내 답장에 숨어 있던 핑은';
$('final').textContent=r[0];$('shareLine').textContent=r[1];$('description').textContent=r[2];
$('chips').replaceChildren();r[3].forEach(txt=>{const s=document.createElement('span');s.className='chip';s.textContent=txt;$('chips').appendChild(s);});
$('goodMatch').textContent=types[r[4]][0];$('badMatch').textContent=types[r[5]][0];
const total=points.reduce((s,n)=>s+n,0);
$('record').textContent='내 답장 속 '+r[0]+' 몫 '+Math.round(points[resultIndex]/Math.max(1,total)*100)+'%';
$('portrait').appendChild(hc);hc.setAttribute('aria-label',r[0]+' 동물 캐릭터');hW=0;
lb.done(r[0]);lb.audio.sfx(sounds.sparkle);lb.audio.sfx(sounds.win);lb.haptic('success');
const s=lb.safe;
lb.fx.burst(Math.max(s.left+20,Math.min(W-s.right-20,W/2)),Math.max(s.top+25,Math.min(H-s.bottom-25,H*.3)),{colors:[colors[3],colors[4],colors[5]]});
lb.fx.confetti();
}
function update(dt){
t+=dt;if(lock>0){lock=Math.max(0,lock-dt);if(lock===0){
if(state==='dying'){result();return;}
if(state==='play'&&chosen>=0){
if(q===Q.length-1){die(W/2,H/2,'내 핑이 도착함',true);return;}
q++;chosen=-1;$('notice').textContent='오늘 내 마음이 가는 답장으로!';showQuestion();
}
}}
}
function doodle(c,x,y,size,kind){
c.save();c.translate(x,y);c.strokeStyle=colors[2];c.lineWidth=2.5;c.lineJoin='round';c.lineCap='round';c.globalAlpha=.19;
c.beginPath();
if(kind===0){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?size*.43:size;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();}
else{c.moveTo(-size,0);c.bezierCurveTo(-size*.5,-size,size*.3,size,size,0);c.bezierCurveTo(size*.6,size*.7,-size*.1,-size*.5,-size,0);}
c.stroke();c.restore();
}
function drawHero(c,x,y,h,id){
const sway=reduce?0:Math.sin(clock*1.4)*.018;
c.save();c.translate(x,y);c.rotate(sway);
lb.assets.draw(c,'gen/r'+(id+1),0,0,h,h);
c.restore();
}
function render(){
if(!W||!H)return;
ctx.clearRect(0,0,W,H);if(texture)ctx.drawImage(texture,0,0,W,H);
const drift=reduce?0:Math.sin(clock*.5)*3;
doodle(ctx,W*.92,H*.24+drift,13,0);doodle(ctx,W*.07,H*.64-drift,12,1);
if((state==='start'||state==='over')&&fitHero()){
hctx.clearRect(0,0,hW,hH);
if(state==='start'){
const size=Math.min(hH*.95,hW*.63);
drawHero(hctx,hW*.5,hH*.5,size,0);
const side=Math.min(size*.5,hW*.27);
if(hW>250&&hH>130){drawHero(hctx,hW*.12,hH*.67,side,1);drawHero(hctx,hW*.88,hH*.67,side,2);}
}else{
drawHero(hctx,hW/2,hH/2,Math.max(1,Math.min(hW,hH)*.99),resultIndex);
}
}
}
function frame(now){
requestAnimationFrame(frame);
const dt=last?Math.min((now-last)/1000,.1):0;last=now;
if(paused)return;clock+=dt;
if(state==='play'||state==='dying'){acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP;}}
render();
}
lb.onPause(p=>{paused=p;last=0;});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.7)start();});
$('rank').addEventListener('click',()=>{if(state==='over')lb.share('내 핑은 '+types[resultIndex][0]+'! '+types[resultIndex][1]+'. 너는 어떤 핑임?');});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
