<html lang="ko">
<head>


<title>연애 웹툰 주인공</title>
<style>
:root{--bg:#eaf2ff;--paper:#fff;--ink:#1a1a2e;--acc:#2e5aa8;--lt:#dbe8ff;--c:#ff7a1a;--title-font:system-ui,sans-serif;--body-font:system-ui,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font)}
button{font-family:var(--title-font);cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(#2e5aa824 1px,transparent 1.4px) 0 0/9px 9px,var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;padding:calc(16px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(18px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;overflow:hidden}
h1,h2,p{margin:0;word-break:keep-all}
h1,h2,#final,.sfx{font-family:var(--title-font);font-weight:400;letter-spacing:-.03em}
h1{font-size:clamp(28px,5vh,36px);line-height:1.15}
h1 em{font-style:normal;color:var(--acc)}
.kicker{font-size:13px;letter-spacing:.05em;color:#fff;background:var(--ink);padding:5px 12px}
.btn{min-height:64px;min-width:154px;padding:10px 22px;font-size:19px;border:3px solid var(--ink);background:var(--acc);color:#fff;box-shadow:4px 4px 0 var(--ink)}
.btn:active{background:#18458a;box-shadow:2px 2px 0 var(--ink)}
button:focus-visible{outline:3px solid #ff4d6d;outline-offset:4px}
#start{padding-top:calc(60px + var(--lb-safe-top,0px))}
#start p{font-size:clamp(16px,2.7vh,19px);line-height:1.4;padding:12px 20px;background:#fff;border:3px solid var(--ink);border-radius:45% 45% 40% 40%}
#artSlot{flex:1;min-height:70px;width:100%;max-height:330px;position:relative;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:linear-gradient(145deg,#fff 58%,#ffd23f 58%,#ffd23f 63%,#dbe8ff 63%);overflow:hidden}
#artSlot:before{content:"";position:absolute;inset:0;background:radial-gradient(#2e5aa828 1px,transparent 1.5px) 0 0/8px 8px}
#hc{position:relative;display:block;width:100%;height:100%;min-height:0}
.sfx{position:absolute;right:10px;top:10px;transform:rotate(-9deg);font-size:26px;color:var(--acc);-webkit-text-stroke:5px white;paint-order:stroke fill}
#hud{position:absolute;left:calc(18px + var(--lb-safe-left,0px));right:calc(18px + var(--lb-safe-right,0px));top:calc(14px + var(--lb-safe-top,0px));display:flex;gap:12px;align-items:center;z-index:2}
#sc{font-family:var(--title-font);font-size:19px;min-width:62px;background:var(--ink);color:white;padding:8px 10px;font-weight:400;font-variant-numeric:tabular-nums}
#progress{display:flex;gap:5px;flex:1}
#progress i{height:13px;flex:1;border:2px solid var(--ink);background:white}
#progress i.past{background:var(--ink)}
#progress i.now{background:#ffd23f}
#play{justify-content:flex-start;align-items:stretch;padding-top:calc(76px + var(--lb-safe-top,0px));gap:12px}
#scene{flex:1;min-height:80px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:14px;position:relative}
#notice{font-size:14px;background:var(--ink);color:white;padding:7px 12px;max-width:100%;text-align:left;box-shadow:3px 3px 0 #2e5aa83a}
#question{position:relative;align-self:stretch;font-size:clamp(20px,3.3vh,24px);line-height:1.45;text-align:left;padding:22px 20px;border:3px solid var(--ink);background:white;box-shadow:5px 5px 0 var(--ink);border-radius:24px 24px 24px 4px;word-break:keep-all}
#caption{align-self:flex-end;font-size:14px;padding:5px 9px;background:#ffd23f;border:2px solid var(--ink)}
#options{display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.opt{position:relative;display:flex;align-items:center;text-align:left;gap:12px;min-height:56px;padding:8px 12px;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);color:var(--ink);font:400 clamp(17px,2.8vh,19px) var(--body-font);line-height:1.2;animation:arrive .22s ease-out both}
.opt b{display:flex;align-items:center;justify-content:center;min-width:28px;height:28px;background:var(--ink);color:#fff;font-size:16px;font-weight:400}
.opt.on,.opt:active{background:var(--lt);box-shadow:1px 1px 0 var(--ink)}
.opt.on{z-index:1;animation:chosen .3s ease-out both}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
#transition{position:absolute;left:calc(20px + var(--lb-safe-left,0px));right:calc(20px + var(--lb-safe-right,0px));top:43%;padding:16px 10px;background:#ffd23f;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font-size:18px;z-index:5;text-align:center}
#over{gap:9px;background:#eaf2ffed}
#resultArt{position:relative;flex:1;width:100%;min-height:85px;max-height:235px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:repeating-conic-gradient(from 0deg,#2e5aa81c 0 3deg,transparent 3deg 13deg),#fff;overflow:hidden}
#why{font-size:14px;background:var(--ink);color:#fff;padding:5px 11px}
#final{font-size:clamp(27px,4.8vh,36px);line-height:1.16;color:var(--ink);text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:7px;text-underline-offset:3px}
#tagline{font-size:clamp(15px,2.6vh,18px);line-height:1.3}
#chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#chips span{font-size:14px;background:#ffd23f;border:2px solid var(--ink);padding:4px 7px}
#description{font-size:clamp(14px,2.5vh,16px);line-height:1.45;padding:9px 12px;background:white;border:2px solid var(--ink);text-align:left;width:100%}
#matches{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match{background:white;border:2px solid var(--ink);padding:7px 3px;font-size:13px;line-height:1.35}
.match b{display:block;font-weight:400;font-size:14px;color:#234b8d}
.match.bad b{color:#a32c46}
.lb-rec{font-size:13px;color:#365078}
#actions{display:flex;gap:10px;width:100%}
#actions .btn{flex:1;min-width:0;padding:7px 5px;font-size:17px}
#rank{background:white;color:var(--ink)}
#sub{font-size:12px}
.pop{animation:pop .2s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes chosen{45%{transform:translateY(-7px) rotate(-1deg)}100%{transform:translateY(-3px)}}
@keyframes pop{50%{filter:brightness(1.25)}}
@media(max-height:570px){
.scr{gap:7px;padding-top:calc(10px + var(--lb-safe-top,0px));padding-bottom:calc(10px + var(--lb-safe-bottom,0px))}
#start{padding-top:calc(24px + var(--lb-safe-top,0px))}
#play{padding-top:calc(60px + var(--lb-safe-top,0px));gap:8px}
#scene{gap:8px}#question{padding:13px 15px;font-size:20px}
#options{gap:7px}.opt{min-height:48px;padding:6px 10px;font-size:17px}
#notice,#caption{font-size:12px;padding:4px 7px}
#over{gap:6px}#resultArt{max-height:140px;min-height:60px}
#final{font-size:27px}#description{font-size:14px;padding:6px 9px}
.btn,#actions .btn{min-height:64px}
#chips span{font-size:12px;padding:3px 5px}
.match{font-size:12px;padding:4px 2px}.match b{font-size:12px}
}
@media(max-height:400px){
#start{padding-top:calc(6px + var(--lb-safe-top,0px));gap:6px}
#start h1{font-size:26px}#start p{font-size:14px;padding:5px 10px}
#artSlot{min-height:35px}#start .kicker{display:none}
#play{padding-top:calc(48px + var(--lb-safe-top,0px));display:grid;grid-template-columns:1fr 1.15fr;gap:12px}
#scene{min-height:0;gap:7px}#question{font-size:17px;padding:11px}
#options{justify-content:center;gap:6px}.opt{font-size:14px;min-height:45px;padding:4px 6px;gap:6px}.opt b{min-width:21px;height:23px;font-size:13px}
#hud{top:calc(5px + var(--lb-safe-top,0px))}#sc{padding:5px 8px;font-size:16px}
#caption{display:none}
#over{display:grid;grid-template-columns:.8fr 1.2fr;grid-template-rows:auto auto auto auto auto auto;gap:5px 10px;align-content:center}
#resultArt{grid-column:1;grid-row:1/5;height:100%;max-height:none;min-height:85px}
#why{grid-column:2;font-size:11px;padding:3px}
#final{grid-column:2;font-size:21px}#tagline{grid-column:2;font-size:12px}
#chips{grid-column:2;gap:3px}#chips span{font-size:11px;padding:2px 3px}
#description{grid-column:1/3;font-size:12px;line-height:1.25;padding:5px 7px}
#matches{grid-column:1/3;gap:6px}.match{padding:3px;font-size:11px}.match b{display:inline;font-size:11px;margin-right:5px}
#actions{grid-column:1/3}#actions .btn{min-height:64px;font-size:15px}
.lb-rec,#sub{display:none}
}

<div id="app">

<p id="description"></p>

<div class="match bad"><b>안 맞아요</b><span id="badMatch"></span></div>
</div>

</div>
</div>

<script>
lb.ready(()=>{

const PAL=['#eaf2ff','#2e5aa8','#1a1a2e','#ffd23f','#ff4d6d'];

const types=[
{name:'직진 불도저 호랑이',color:'#ff7a1a',good:2,bad:1,line:'좋아하는 마음은 바로 전해요.',desc:'마음이 정해지면 표현을 미루지 않아요. 보고 싶은 날에는 먼저 만나자고 연락해요.',chips:['먼저 연락해요','고백은 바로 해요','약속을 잡아요']},
{name:'밀당 장인 고양이',color:'#2b2b3a',good:3,bad:0,line:'다음 대사가 궁금해지는 주인공이에요.',desc:'작은 반응을 읽고 대화의 박자를 맞춰요. 기억에 남은 농담을 다음 대화에 슬쩍 꺼내요.',chips:['표정을 살펴요','농담을 기억해요','답장을 골라요']},
{name:'몰래 챙김 고슴도치',color:'#a0673a',good:0,bad:5,line:'티 안 나게 챙긴 마음이 들켜요.',desc:'상대가 흘려 한 말을 잘 기억해요. 비 소식이 있으면 가방에 여분 우산을 넣어요.',chips:['취향을 외워요','우산을 챙겨요','간식을 건네요']},

];

['몇 시까지 편하게 있을까요?',[[4,3],[5,1]]]]},

['안 가본 골목으로 가봐요',[[5,3],[0,1]]]]},
{n:'단톡방에 알림이 떴어요',q:'친구가 둘이 잘 어울린다고 해요. 어떻게 답할까요?',c:'단톡방에 웃음이 번져요',a:[

['그 얘기는 둘이 해볼게요',[[1,3],[5,1]]],

{n:'답장이 조금 늦어졌어요',q:'바쁜 하루였다는 연락이 왔어요. 어떻게 답할까요?',c:'휴대폰에 새 말풍선이 떠요',a:[

{n:'헤어지기 전 연락이 왔어요',q:'오늘 어땠냐는 연락에 어떤 말을 남길까요?',c:'밤 골목 끝에서 휴대폰이 울려요',a:[

];
let W=0,H=0,state='start',paused=false,last=0,clock=0,t=0,index=0,locked=false,wait=0,totals=[],recent=[],answers=[],selected=0,overAt=0,hs='',reduced=false;
const dots=[];
for(let i=0;i<qs.length;i++){const el=document.createElement('i');$('progress').appendChild(el);dots.push(el);}
lb.assets.font('font/dohyeon').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--body-font',v));
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function hud(){
 const value=(index+1)+'/'+qs.length;
 if(value!==hs){$('sc').textContent=value;hs=value;}
 dots.forEach((e,i)=>{e.className=i<index?'past':i===index?'now':'';});
}
function reset(){
 t=0;index=0;locked=false;wait=0;totals=Array(7).fill(0);recent=Array(7).fill(-1);answers=[];selected=0;hs='';
 $('transition').hidden=true;$('sub').textContent='';
}
function start(){
 reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
 lb.audio.unlock();lb.audio.sfx(SFX.tap);showQuestion();
}
function showQuestion(){
 const item=qs[index];$('notice').textContent=item.n;$('question').textContent=item.q;$('caption').textContent=item.c;
 $('options').replaceChildren();
 item.a.forEach((choice,i)=>{
  const b=document.createElement('button');b.type='button';b.className='opt';b.style.animationDelay=(i*.035)+'s';
  const badge=document.createElement('b');badge.textContent=['가','나','다','라'][i];badge.setAttribute('aria-hidden','true');
  const text=document.createElement('span');text.textContent=choice[0];b.append(badge,text);
  b.addEventListener('click',()=>choose(i,b));$('options').appendChild(b);
 });
 hud();
}
function choose(i,el){
 if(state!=='play'||locked||paused)return;
 locked=true;answers.push(i);
 qs[index].a[i][1].forEach(([type,points])=>{totals[type]+=points;recent[type]=index*10+points;});
 el.classList.add('on');el.style.animationDelay='0s';
 Array.from($('options').children).forEach(e=>e.disabled=true);
 lb.audio.sfx(SFX.tap);lb.audio.sfx(SFX.slide);lb.haptic('light');
 const r=el.getBoundingClientRect();
 lb.fx.popText(Math.min(W-40,r.right-35),Math.max(30,r.top-5),'찰칵',{color:PAL[1],size:18});
 wait=index===qs.length-1?.8:.32;
 if(index===qs.length-1)$('transition').hidden=false;
}
function chooseResult(){
 const max=Math.max(...totals);
 let candidates=totals.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
 const latest=Math.max(...candidates.map(i=>recent[i]));
 candidates=candidates.filter(i=>recent[i]===latest);
 let signature=0;answers.forEach((a,i)=>signature=(signature*7+(a+1)*(i+1))%104729);
 return candidates[signature%candidates.length];
}
function die(x,y,why){
 if(state!=='play')return;
 selected=chooseResult();state='dying';wait=.12;
 $('transition').hidden=false;$('transition').textContent='주인공 전광판이 켜져요…';
 $('why').textContent=why;
 lb.audio.sfx(SFX.win);lb.haptic('success');lb.fx.flash('#ffd23f');
}
function result(){
 state='over';overAt=clock;
 const r=types[selected];
 $('play').hidden=true;$('hud').hidden=true;$('transition').hidden=true;$('over').hidden=false;
 document.documentElement.style.setProperty('--c',r.color);
 $('resultArt').appendChild(hc);
 $('final').textContent=r.name;$('tagline').textContent=r.line;$('description').textContent=r.desc;
 $('goodMatch').textContent=types[r.good].name;$('badMatch').textContent=types[r.bad].name;
 $('record').textContent='이번 시즌의 선택이 모두 모였어요';
 $('chips').replaceChildren();
 r.chips.forEach(v=>{const e=document.createElement('span');e.textContent=v;$('chips').appendChild(e);});
 lb.done(r.name);lb.fx.confetti();bump($('final'));
}
function update(dt){
 t+=dt;
 if(!locked)return;
 wait-=dt;
 if(wait>0)return;
 if(index===qs.length-1)return die(W/2,H/2,'이번 시즌의 주인공을 공개해요');
 index++;locked=false;showQuestion();
}
function drawBackground(){
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=state==='play'?.11:.17;ctx.strokeStyle=PAL[1];ctx.lineWidth=3;
 const x=W*.09,y=H*.16,ww=W*.82,hh=H*.47;
 ctx.fillStyle='#fff';ctx.fillRect(x,y,ww,hh);ctx.strokeRect(x,y,ww,hh);
 ctx.beginPath();ctx.moveTo(W*.5,y);ctx.lineTo(W*.5,y+hh);ctx.moveTo(x,y+hh*.55);ctx.lineTo(x+ww,y+hh*.55);ctx.stroke();
 ctx.fillStyle=PAL[1];ctx.fillRect(W*.06,y+hh+7,W*.88,9);
 ctx.strokeStyle=PAL[2];ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(W*.86,H*.88);ctx.lineTo(W*.86,H*.37);ctx.quadraticCurveTo(W*.86,H*.31,W*.75,H*.32);ctx.stroke();
 ctx.fillStyle=PAL[3];ctx.beginPath();ctx.ellipse(W*.75,H*.34,W*.055,H*.023,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
 ctx.save();ctx.fillStyle='#ff4d6d';ctx.globalAlpha=.22;
 for(let i=0;i<14;i++){
  const speed=reduced?0:clock;
  const px=(i*71+Math.sin(speed*.35+i)*20+W*2)%Math.max(1,W);
  const py=(i*61+speed*(9+i%4))%Math.max(1,H);
  ctx.save();ctx.translate(px,py);ctx.rotate(i+speed*.3);ctx.beginPath();ctx.moveTo(0,-5);ctx.bezierCurveTo(7,-4,7,3,0,7);ctx.bezierCurveTo(-6,3,-5,-2,0,-5);ctx.fill();ctx.restore();
 }
 ctx.restore();
}
function drawArt(){
 if(state!=='start'&&state!=='over')return;
 const bw=hc.clientWidth,bh=hc.clientHeight;if(!bw||!bh)return;
 const d=Math.min(devicePixelRatio||1,2),pw=Math.round(bw*d),ph=Math.round(bh*d);
 if(hc.width!==pw||hc.height!==ph){hc.width=pw;hc.height=ph;}
 art.setTransform(d,0,0,d,0,0);art.clearRect(0,0,bw,bh);
 if(state==='start'){
  const size=Math.min(bw*.69,bh*1.05);
  const sway=reduced?0:Math.sin(clock*1.2)*2;
  lb.assets.draw(art,'gen/r1',bw*.33,bh*.54+sway,size,size);
  lb.assets.draw(art,'gen/r7',bw*.69,bh*.55-sway,size*.91,size*.91);
 }else{
  const size=Math.min(bw*.94,bh*1.04);
  lb.assets.draw(art,'gen/r'+(selected+1),bw/2,bh/2,size,size);
 }
}
function render(){if(!W||!H)return;drawBackground();drawArt();}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.05):0;last=now;
 if(paused)return;
 clock+=dt;
 if(state==='play')update(dt);
 else if(state==='dying'){wait-=dt;if(wait<=0)result();}
 render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt<.7)return;$('transition').textContent='다음 컷을 그리고 있어요…';start();});
$('rank').addEventListener('click',()=>lb.share('제 연애 웹툰 주인공은 '+types[selected].name+'이에요. '+types[selected].line));
lb.onPause(p=>{paused=p;last=0;});
if(window.matchMedia)reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
