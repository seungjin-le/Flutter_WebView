<title>나와 어울리는 게임 속 연애 상대</title>
<style>
:root{
 --bg:#14213d;--paper:#f2f4f8;--ink:#15243e;--acc:#3fbf9f;
 --act:#3fbf9f;--bt:#14213d;--lt:#cfefe9;--tone:#ffffff16;
 --c:#2b4a8c;--title-font:system-ui,sans-serif;--body-font:ui-rounded,system-ui,sans-serif
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--paper)}
button{font-family:var(--title-font);font-weight:400;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;font-family:var(--body-font)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr{
 position:absolute;inset:0;display:flex;flex-direction:column;
 padding:calc(12px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px))
 calc(12px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px));
 gap:9px;min-height:0;overflow:hidden
}
h1,h2,p{margin:0;word-break:keep-all}
h1,h2,.title,.btn{font-family:var(--title-font);font-weight:400;letter-spacing:-.025em}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;letter-spacing:.02em;flex:none}
.online{display:flex;align-items:center;gap:6px}
.online:before{content:"";width:7px;height:7px;background:var(--acc);box-shadow:0 0 0 3px var(--tone)}
.system-label{border:1px solid var(--tone);padding:4px 7px;color:var(--paper);font-size:12px}
#start{padding-top:calc(60px + var(--lb-safe-top,0px));text-align:center}
#start h1{font-size:clamp(30px,5.4vh,36px);line-height:1.15;flex:none}
h1 em{color:var(--acc);font-style:normal}
#hook{font-size:clamp(15px,2.6vh,18px);line-height:1.4;color:var(--paper)}
#hc{display:block;width:100%;height:100%;min-height:0;flex:1;touch-action:none}
.art-slot{position:relative;flex:1;min-height:0;display:flex;overflow:hidden;background:var(--tone);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.art-slot:before{content:"";position:absolute;inset:0;pointer-events:none}
.art-label{position:absolute;top:9px;left:9px;z-index:1;background:var(--ink);color:var(--paper);font-size:12px;padding:4px 7px;pointer-events:none}
.art-status{position:absolute;bottom:8px;right:8px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:4px 8px;font-size:12px;pointer-events:none}
.btn{
 min-height:64px;flex:none;border:3px solid var(--ink);background:var(--acc);color:var(--bt);
 box-shadow:4px 4px 0 var(--ink);padding:8px 14px;font-size:clamp(17px,2.8vh,20px);
 touch-action:manipulation
}
.btn:active{box-shadow:1px 1px 0 var(--ink);background:var(--lt)}
.btn.secondary{background:var(--paper);color:var(--ink)}
#start .footnote{text-align:center;font-size:12px;color:var(--paper);opacity:.8}
#hud{display:flex;flex-direction:column;gap:8px;flex:none}
.progress-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
#sc{font-family:var(--title-font);font-size:18px;font-weight:400;font-variant-numeric:tabular-nums}
.progress{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.progress i{height:11px;background:var(--tone);border:1px solid var(--paper)}
.progress i.done{background:var(--acc);border-color:var(--acc)}
.progress i.current{background:var(--paper)}
#play .lobby-head{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--paper);background:var(--bg);font-size:12px;padding:9px 10px;flex:none}
.lobby-name{display:flex;align-items:center;gap:8px}
.party-mark{width:19px;height:17px;display:inline-block;position:relative;border:2px solid var(--acc)}
.party-mark:before,.party-mark:after{content:"";position:absolute;width:4px;height:4px;background:var(--acc);top:3px}
.party-mark:before{left:2px}.party-mark:after{right:2px}
#question-window{position:relative;flex:1;min-height:80px;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.window-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;flex:none}
.window-tools{display:flex;gap:4px}.window-tools i{height:5px;width:5px;border:1px solid var(--paper)}
#question-center{flex:1;display:flex;flex-direction:column;justify-content:center;padding:13px;gap:10px;min-height:0}
#qtag{font-size:12px;color:var(--ink)}
#question{font-size:clamp(20px,3.5vh,24px);font-weight:400;line-height:1.35}
#chat{font-size:clamp(12px,2.2vh,14px);opacity:.75;line-height:1.35}
#choices{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;flex:none}
.opt{
 display:flex;align-items:center;gap:10px;text-align:left;min-height:56px;width:100%;
 padding:7px 10px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);
 box-shadow:4px 4px 0 var(--ink);font-family:var(--body-font);font-weight:400;
 font-size:clamp(17px,2.8vh,19px);line-height:1.2;touch-action:manipulation;
 animation:arrive .17s ease-out both
}
.opt .badge{flex:none;width:30px;height:32px;background:var(--ink);color:var(--paper);display:grid;place-items:center;position:relative}
.badge svg{width:23px;height:23px;fill:none;stroke:var(--paper);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.opt .letter{font-size:12px;opacity:.65;flex:none;margin-left:auto}
.opt.on,.opt:active{background:var(--lt);box-shadow:1px 1px 0 var(--ink)}
.opt:disabled{cursor:default}
#judge{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:12px;background:var(--bg);z-index:4}
#judge .count{width:64px;height:64px;border:3px solid var(--acc);display:grid;place-items:center;color:var(--acc);font-family:var(--title-font);font-size:32px}
#judge p{font-size:18px}
#over{gap:6px}
#rp{display:flex;flex:1;min-height:0;flex-direction:column;gap:6px}
#why{font-size:12px;flex:none;color:var(--paper)}
#result-slot{flex:1;min-height:50px;background:var(--paper);border-color:var(--ink)}
#result-slot:after{content:"";position:absolute;inset:0;border-top:6px solid var(--c);pointer-events:none}
#result-slot .art-label{background:var(--c)}
#final{display:block;font-size:clamp(28px,5.3vh,38px);line-height:1.06;color:var(--paper);font-family:var(--title-font);font-weight:400;letter-spacing:-.04em;flex:none}
#shareline{background:var(--paper);border:2px solid var(--ink);color:var(--ink);padding:6px 9px;font-size:clamp(13px,2.3vh,16px);line-height:1.2;flex:none}
#chips{display:flex;gap:5px;flex:none}
#chips span{flex:1;text-align:center;font-size:clamp(12px,2.15vh,14px);border:1px solid var(--paper);padding:4px 2px;line-height:1.15}
#description{border-left:3px solid var(--acc);padding:2px 0 2px 8px;font-size:clamp(13px,2.35vh,16px);line-height:1.35;flex:none}
#compat{display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:none}
.match{display:flex;align-items:center;gap:6px;min-width:0;background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:3px 5px}
.match canvas{width:36px;height:39px;flex:none}
.match p{font-size:clamp(12px,2.05vh,14px);line-height:1.25}
.match small{display:block;font-size:12px;opacity:.75}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none}
.lb-rec{font-size:12px;opacity:.8;flex:none}
#sub{font-size:12px;flex:none}
.pop{animation:pop .16s ease-out}
@keyframes pop{50%{opacity:.65}}
@keyframes arrive{from{opacity:0;translate:0 5px}to{opacity:1;translate:0 0}}

<div id="app">
 <canvas id="cv" aria-hidden="true"></canvas>
 <section id="start" class="scr">
  <div class="topline"><span class="online">연애 파티 모집 중</span><span class="system-label">접속 완료</span></div>
  <h1>나와 어울리는<br><em>연애 상대</em></h1>
  <p id="hook">파티 모집 중! 당신과 가장 잘 맞는 상대 성향 확인 퀘스트임</p>
  <div id="start-slot" class="art-slot">
   <span class="art-label">파티원 프로필</span>
   <canvas id="hc" aria-label="탱커와 힐러, 딜러 캐릭터"></canvas>
   <span class="art-status">탱커 · 힐러 · 딜러 대기 중</span>
  </div>
  <p class="footnote">게임 취향으로 뽑는 연애 클래스 · 재미로 보는 성향임</p>
  <button id="go" class="btn" type="button">테스트 시작</button>
 </section>
 <section id="play" class="scr" hidden>
  <div id="hud">
   <div class="progress-head"><span class="online">파티원 성향 확인 중</span><b id="sc">1/9</b></div>
   <div class="progress" id="progress" aria-label="선택 진행"></div>
  </div>
  <div class="lobby-head"><span class="lobby-name"><i class="party-mark" aria-hidden="true"></i>연애 파티 모집</span><span>응답 대기 중</span></div>
  <div id="question-window">
   <div class="window-bar"><span>파티장 질문 도착</span><span class="window-tools" aria-hidden="true"><i></i><i></i><i></i></span></div>
   <div id="question-center">
    <p id="qtag"></p>
    <h2 id="question"></h2>
    <p id="chat"></p>
   </div>
  </div>
  <div id="choices"></div>
 </section>
 <div id="judge" hidden><span class="count">완료</span><p>연애 캐릭터 접속 중…</p></div>
 <section id="over" class="scr" hidden>
  <div id="rp">
   <div class="topline"><span class="online">연애 파티 매칭 완료</span><span class="system-label">상대 추천 결과</span></div>
   <p id="why"></p>
   <div id="result-slot" class="art-slot"><span class="art-label">나와 잘 맞는 상대 포토카드</span></div>
   <b id="final"></b>
   <p id="shareline"></p>
   <p id="chips"></p>
   <p id="description"></p>
   <div id="compat">
    <div class="match"><canvas id="matchgood" aria-hidden="true"></canvas><p><small>잘 맞는 파티원</small><span id="goodname"></span></p></div>
    <div class="match"><canvas id="matchbad" aria-hidden="true"></canvas><p><small>조율 필요한 파티원</small><span id="badname"></span></p></div>

function reset(){

function select(j,button){

 questions[index].a[j][1].forEach(pair=>points[pair[0]]+=pair[1]);

function pickResult(){
 const max=Math.max(...points),tied=[];
 points.forEach((n,j)=>{if(n===max)tied.push(j)});
 if(tied.length===1)return tied[0];
 for(let k=answers.length-1;k>=0;k--){
  const weights=questions[k].a[answers[k]][1];
  let highest=0,next=[];
  tied.forEach(r=>{
   const found=weights.find(pair=>pair[0]===r),value=found?found[1]:0;
   if(value>highest){highest=value;next=[r]}
   else if(value===highest)next.push(r);
  });
  if(highest>0&&next.length===1)return next[0];
 }
 let seed=0;answers.forEach((v,j)=>seed=(seed*11+(v+1)*(j+3))%65521);

}

function drawBackground(){

function drawPortrait(){

 }else{
  art.save();

  const cx=a/2,cy=b*.54,rx=a*.36,ry=b*.38;
  art.beginPath();art.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);art.stroke();
  art.beginPath();art.ellipse(cx,cy,rx*.82,ry*.82,0,0,Math.PI*2);art.stroke();
  for(let j=0;j<8;j++){
   const angle=j*Math.PI/4;
   const x=cx+Math.cos(angle)*rx,y=cy+Math.sin(angle)*ry;
   const tx=-Math.sin(angle),ty=Math.cos(angle);
   art.beginPath();
   art.moveTo(x-tx*5,y-ty*5);art.lineTo(x+Math.cos(angle)*8,y+Math.sin(angle)*8);
   art.lineTo(x+tx*5,y+ty*5);art.stroke();
  }
  art.restore();
  const r=results[resultIndex];
  drawAsset(art,r.key,a/2,b*.52,Math.min(a*.95,b*.95),b*.99);
  drawMini($('matchgood'),results[r.good].key);
  drawMini($('matchbad'),results[r.bad].key);
 }
}

}
