<head>


<title>내 발작버튼 테스트</title>
<style>
:root{--bg:#1e1e2a;--panel:#3a3a4e;--red:#ff3b30;--yellow:#ffd54f;--blue:#4fc3f7;--title-font:system-ui,sans-serif;--body-font:system-ui,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--yellow)}
#app{position:fixed;inset:0;overflow:hidden;font-family:var(--body-font);font-weight:700}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
[hidden]{display:none!important}
button{font-family:var(--title-font);font-weight:900;cursor:pointer;touch-action:manipulation;border:0;letter-spacing:-.02em}
button:active{box-shadow:2px 2px 0 var(--bg);filter:brightness(.92)}
h1,h2,p{margin:0;word-break:keep-all}
h1,#final{font-family:var(--title-font);font-weight:900;letter-spacing:-.035em}
.scr{position:absolute;inset:0;display:flex;align-items:center;flex-direction:column;text-align:center;overflow:hidden;padding:calc(14px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(14px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));gap:10px}
#start{justify-content:flex-end}
#hc{width:min(78%,300px);height:auto;max-height:34%;object-fit:contain;min-height:0;flex:1}
#start h1{font-size:clamp(28px,5.5vh,38px);line-height:1.12;color:var(--yellow);text-shadow:4px 4px 0 var(--panel)}
.tag{font-size:12px;letter-spacing:.12em;background:var(--blue);color:var(--bg);padding:5px 12px}
#start .hook{font-size:clamp(15px,2.6vh,18px);line-height:1.4;max-width:330px}
.switch{font-weight:900;letter-spacing:.03em;font-size:15px}
.aside{font-size:clamp(12px,2.1vh,15px);color:var(--blue)}
.mainbtn{min-height:64px;width:min(100%,310px);font-size:21px;color:var(--bg);background:var(--red);box-shadow:6px 6px 0 var(--panel);flex-shrink:0;padding:8px 18px}
#go{margin-top:7px;margin-bottom:7px;background:var(--yellow)}
#hud{position:absolute;top:calc(10px + var(--lb-safe-top,0px));left:calc(16px + var(--lb-safe-left,0px));right:calc(16px + var(--lb-safe-right,0px));display:flex;align-items:center;justify-content:space-between;pointer-events:none;gap:12px;font-size:14px}
#sc{font-size:19px;color:var(--yellow);text-shadow:3px 3px 0 var(--panel);white-space:nowrap}
#info{font-size:12px;color:var(--blue)}
#play{position:absolute;top:30%;bottom:var(--lb-safe-bottom,0px);left:var(--lb-safe-left,0px);right:var(--lb-safe-right,0px);padding:0 18px 16px;display:flex;flex-direction:column;gap:10px}
#steps{display:flex;gap:7px;justify-content:center;padding:2px 0 6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--panel)}
.dot.done{background:var(--red)}
.dot.now{background:var(--yellow);box-shadow:0 0 0 3px var(--panel)}
