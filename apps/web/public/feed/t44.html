<head>


<title>나를 디저트로</title>
<style>
:root{--bg:#2b1d3a;--dot:#4a3260;--scr:#4a3260;--ink:#fff3d6;--sh:#171020;--act:#ffd166;--on:#2b1d3a;--c:#7bdff2;--title-font:monospace;--body-font:monospace}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden;font-family:var(--body-font),monospace;font-size:18px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;padding:calc(16px + var(--lb-safe-top,0px)) calc(20px + var(--lb-safe-right,0px)) calc(16px + var(--lb-safe-bottom,0px)) calc(20px + var(--lb-safe-left,0px));display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;overflow:hidden}
h1,p{margin:0;word-break:keep-all}
h1{font:normal clamp(26px,5vh,33px) var(--title-font),monospace;text-shadow:3px 3px var(--sh)}
button{border:0;border-radius:0;min-height:64px;padding:8px 14px;font:normal 20px var(--title-font),monospace;background:var(--scr);color:var(--ink);cursor:pointer;touch-action:manipulation;box-shadow:0 -3px var(--ink),0 3px var(--ink),-3px 0 var(--ink),3px 0 var(--ink),5px 7px var(--sh)}
button:active{background:var(--act);color:var(--on);box-shadow:0 -3px var(--act),0 3px var(--act),-3px 0 var(--act),3px 0 var(--act),3px 4px var(--sh)}
#go{background:var(--act);color:var(--on);width:90%;flex:none}
#start{justify-content:center}
#start p{max-width:350px;line-height:1.65;font-size:18px}
#hc{width:min(180px,35vh);height:min(180px,35vh);image-rendering:pixelated;flex-shrink:1;min-height:45px}
#play{align-items:stretch;gap:18px}
#progress{display:flex;align-items:center;gap:12px;min-height:32px;flex:none}
#count{font-variant-numeric:tabular-nums;color:var(--act)}
#cells{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
#cells i{display:block;height:16px;background:var(--bg);border:2px solid var(--ink)}
#cells i.past{background:var(--act);border-color:var(--act)}
#cells i.now{border-color:var(--act);box-shadow:0 3px var(--act)}
#spacer{flex:1;min-height:12px;max-height:160px;position:relative}
#spacer:after{content:"";position:absolute;left:15%;right:15%;bottom:10%;height:6px;background:var(--dot);box-shadow:0 -18px var(--dot)}
.win{background:var(--bg);box-shadow:0 -4px var(--ink),0 4px var(--ink),-4px 0 var(--ink),4px 0 var(--ink),7px 10px var(--sh)}
#dialog{padding:20px 18px;min-height:112px;text-align:left;flex:none}
#q{font-size:clamp(18px,3.6vh,24px);line-height:1.65;min-height:3.3em}
#opts{display:flex;flex-direction:column;gap:15px;padding-bottom:7px}
.opt{position:relative;text-align:left;padding-left:43px;width:100%;font-size:18px;min-height:68px;line-height:1.5;animation:appear .16s steps(2)}
.opt:before{content:"";position:absolute;left:14px;top:50%;margin-top:-6px;width:6px;height:12px;background:var(--act);box-shadow:4px 3px var(--act);animation:blink .8s steps(1) infinite}
.opt.on{background:var(--act);color:var(--on)}
.opt.on:before{background:var(--on);box-shadow:4px 3px var(--on)}
#hud{position:absolute;bottom:calc(4px + var(--lb-safe-bottom,0px));left:calc(20px + var(--lb-safe-left,0px));right:calc(20px + var(--lb-safe-right,0px));display:flex;justify-content:space-between;font-size:12px;pointer-events:none;color:var(--act)}
#play{padding-bottom:calc(30px + var(--lb-safe-bottom,0px))}
#over{gap:0}
#rp{height:100%;width:100%;display:flex;flex-direction:column;gap:10px;align-items:stretch;min-height:0}
#why{font-size:clamp(12px,2.2vh,16px);color:var(--act);flex:none}
.art{position:relative;flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;background:var(--ink);border:4px solid var(--scr);overflow:hidden}
.art img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;min-height:0}
.fallback{display:none;align-items:center;justify-content:center;width:70%;height:75%;background:var(--c);color:var(--on);font:normal 33px var(--title-font),monospace}
img[data-lb-art-missing]{display:none}
img[data-lb-art-missing]+.fallback{display:flex}
#final{font:normal clamp(23px,4.6vh,33px) var(--title-font),monospace;line-height:1.25;color:var(--ink);text-shadow:2px 2px var(--sh);border-bottom:3px solid var(--c);padding-bottom:4px}
#shareline{font-size:clamp(14px,2.6vh,18px)}
#chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{padding:4px 6px;border:2px solid var(--c);font-size:14px;background:var(--bg)}
#desc{font-size:clamp(14px,2.5vh,18px);line-height:1.5;text-align:left;padding:8px 10px}
#matches{display:flex;gap:10px}
.match{flex:1;min-width:0;display:flex;align-items:center;gap:5px;text-align:left;background:var(--scr);padding:5px}
.match img{width:38px;height:38px;object-fit:contain;image-rendering:pixelated;background:var(--ink)}
.match p{font-size:12px;line-height:1.5}
.match strong{font-weight:normal;color:var(--act);display:block}
#actions{display:flex;gap:14px;flex:none;padding:3px}
#actions button{flex:1;min-width:0;font-size:18px}
#rank{background:var(--act);color:var(--on)}
.lb-rec{font-size:12px;color:var(--act)}
#sub{font-size:12px}
#baking{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg);padding:25px;text-align:center}
#bakebar{display:flex;gap:8px}
#bakebar i{width:20px;height:20px;background:var(--scr)}
#bakebar i.lit{background:var(--act)}
@keyframes blink{50%{visibility:hidden}}
@keyframes appear{from{transform:scale(.97)}to{transform:scale(1)}}

<script>
lb.ready(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),hc=$('hc').getContext('2d');
const PAL=['#2b1d3a','#4a3260','#ffd166','#7bdff2','#ef476f'];
const Q=[
['가게에 일찍 왔어요. 기다리는 동안 뭐 해요?',0,['옆 손님에게 말을 걸어요','혼자 진열장을 둘러봐요'],['E','I']],
['신상 케이크를 설명해 달래요. 무엇부터 말해요?',1,['재료와 식감을 알려 줘요','떠오르는 이야기를 들려줘요'],['S','N']],
['친구가 쿠키를 태웠어요. 먼저 무슨 말을 해요?',2,['온도부터 살펴보자고 해요','많이 속상했겠다고 해요'],['T','F']],
['내일 가게 일을 도와요. 오늘 뭘 해 둘까요?',3,['할 일을 순서대로 적어요','내일 상황을 보고 정해요'],['J','P']],
['손님이 몰렸다가 빠졌어요. 쉬는 시간엔요?',0,['동료와 수다를 나눠요','조용히 차를 마셔요'],['E','I']],
['빈 접시에 디저트를 꾸며요. 어떤 걸 골라요?',1,['익숙한 조합을 정갈히 놓아요','새로운 모양을 상상해요'],['S','N']],
['선물 포장을 함께 골라요. 더 중요한 건요?',2,['튼튼하고 들기 편한지 봐요','받는 친구 취향을 떠올려요'],['T','F']],

let W=0,H=0,P=2,state='start',paused=false,last=0,clock=0,index=0,lock=0,pending=false,endT=0,overAt=0,axis=[0,0,0,0],lastSide=['I','S','T','J'],answers=[],chosen=null,typed=0,flash=0,particles=[],sprite;
const cursor=['100000','110000','111000','111100','111110','111100','111000','110000','100000'];
function bakeSprite(){
sprite=document.createElement('canvas');sprite.width=6;sprite.height=9;
const c=sprite.getContext('2d');c.fillStyle=PAL[2];cursor.forEach((s,y)=>[...s].forEach((v,x)=>{if(v==='1')c.fillRect(x,y,1,1)}));
}
function resize(){W=cv.clientWidth;H=cv.clientHeight;const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);P=Math.max(2,Math.round(Math.max(1,Math.min(W,H)/10)/6));bakeSprite();ctx.imageSmoothingEnabled=false;hc.imageSmoothingEnabled=false}
function drawHero(c,x,y,h){const p=Math.max(1,Math.round(h/9));c.drawImage(sprite,Math.round(x/p)*p,Math.round(y/p)*p,6*p,9*p)}
function background(){
ctx.fillStyle=PAL[0];ctx.fillRect(0,0,W,H);ctx.fillStyle=PAL[1];
for(let y=0;y<H;y+=P*8)for(let x=0;x<W;x+=P*8)ctx.fillRect(x,y,P,P);
const unit=P,x=Math.round(W*.75/unit)*unit,y=Math.round(H*.24/unit)*unit;
ctx.fillStyle=PAL[1];ctx.fillRect(x-8*unit,y-9*unit,16*unit,18*unit);
ctx.fillStyle=PAL[2];ctx.fillRect(x-7*unit,y-8*unit,6*unit,6*unit);ctx.fillRect(x+unit,y-8*unit,6*unit,6*unit);
ctx.fillStyle=PAL[4];ctx.fillRect(x-7*unit,y-2*unit,6*unit,5*unit);ctx.fillRect(x+unit,y-2*unit,6*unit,5*unit);
ctx.fillStyle=PAL[1];ctx.fillRect(3*unit,H*.7,10*unit,12*unit);
ctx.fillStyle=PAL[0];ctx.fillRect(4*unit,H*.7+4*unit,8*unit,6*unit);
ctx.fillStyle=PAL[2];ctx.fillRect(5*unit,H*.7+unit,unit,unit);ctx.fillRect(10*unit,H*.7+unit,unit,unit);
if(state==='start'){hc.clearRect(0,0,160,160);hc.fillStyle=PAL[1];hc.fillRect(20,42,120,82);hc.fillStyle=PAL[2];hc.fillRect(27,49,106,6);hc.fillStyle=PAL[0];hc.fillRect(30,62,100,52);hc.fillStyle=PAL[4];hc.fillRect(41,76,26,23);hc.fillStyle=PAL[3];hc.fillRect(93,76,26,23);hc.fillStyle=PAL[2];hc.fillRect(37,99,34,7);hc.fillRect(89,99,34,7);drawHero(hc,72,18+(Math.floor(clock*2)%2)*3,27)}
for(const p of particles){ctx.fillStyle=p.color;ctx.fillRect(Math.round(p.x/P)*P,Math.round(p.y/P)*P,P,P)}
if(flash>0){ctx.fillStyle=PAL[2];const safe=lb.safe;ctx.fillRect(safe.left+8,safe.top+8,P*3,P*3);ctx.fillRect(W-safe.right-P*4,H-safe.bottom-P*4,P*3,P*3)}
}
function hud(){$('count').textContent=(index+1)+'/10';$('sc').textContent=(index+1)+'/10';[...$('cells').children].forEach((e,i)=>e.className=i<index?'past':i===index?'now':'')}
function showQuestion(){
typed=0;pending=false;$('q').textContent='';$('opts').replaceChildren();
Q[index][2].forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=text;b.addEventListener('pointerdown',()=>answer(n,b));$('opts').appendChild(b)});
hud();
}
function reset(){index=0;lock=0;pending=false;endT=0;axis=[0,0,0,0];lastSide=['I','S','T','J'];answers=[];chosen=null;particles=[];flash=0;typed=0;showQuestion()}
function start(){reset();state='play';$('start').hidden=true;$('over').hidden=true;$('baking').hidden=true;$('play').hidden=false;$('hud').hidden=false;lb.audio.unlock();lb.audio.sfx('sfx/oga512/menu-move2');lb.audio.music('music/oga-chiptunes/level-1',{loop:true,volume:.25})}
function answer(n,button){
if(state!=='play'||lock>0||pending)return;
const q=Q[index],side=q[3][n];axis[q[1]]+=n===0?1:-1;lastSide[q[1]]=side;answers.push(side);pending=true;lock=.3;typed=1;$('q').textContent=q[0];button.classList.add('on');flash=.16;
lb.audio.sfx('sfx/oga512/menu-move2');lb.haptic('light');
}
function die(x,y,why,win){
if(state!=='play')return;
state='dying';endT=.7;$('play').hidden=true;$('hud').hidden=true;$('baking').hidden=false;$('why').textContent=why;
lb.audio.stopMusic();
}
function setArt(id,r){const img=$(id);img.removeAttribute('data-lb-art-missing');img.setAttribute('data-lb-art','gen/r'+(R.indexOf(r)+1));img.alt=r[1]}
function result(){
const pairs=['EI','SN','TF','JP'];const type=axis.map((v,i)=>v===0?lastSide[i]:pairs[i][v>0?0:1]).join('');
chosen=R.find(r=>r[0]===type);state='over';overAt=clock;$('baking').hidden=true;$('over').hidden=false;
$('final').textContent=chosen[0]+' · '+chosen[1];$('shareline').textContent=chosen[5];$('desc').textContent=chosen[6];$('initial').textContent=chosen[1][0];$('rp').style.setProperty('--c',chosen[2]);setArt('art',chosen);
$('chips').replaceChildren();chosen[7].forEach(s=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=s;$('chips').appendChild(chip)});
const a=R.find(r=>r[0]===chosen[3]),b=R.find(r=>r[0]===chosen[4]);setArt('goodart',a);setArt('badart',b);$('goodname').textContent=a[0]+' · '+a[1];$('badname').textContent=b[0]+' · '+b[1];
$('record').textContent='내가 고른 취향을 모두 구웠어요.';
lb.done(chosen[0]+' · '+chosen[1]);lb.audio.sfx('sfx/interface-sounds/confirmation-003');lb.haptic('success');lb.fx.confetti();
for(let i=0;i<48;i++){const angle=Math.random()*Math.PI*2,speed=40+Math.random()*160;particles.push({x:W/2,y:H*.27,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-70,life:1.2+Math.random(),color:PAL[2+i%3]})}
}
function update(dt){
lock=Math.max(0,lock-dt);flash=Math.max(0,flash-dt);
if(state==='play'){
if(!pending&&typed<.4){typed+=dt;$('q').textContent=Q[index][0].slice(0,Math.ceil(Q[index][0].length*Math.min(1,typed/.4)))}
if(pending&&lock<=0){if(index===Q.length-1)die(W/2,H/2,'디저트가 다 구워졌어요!',true);else{index++;showQuestion()}}
}else if(state==='dying'){endT-=dt;[...$('bakebar').children].forEach((e,i)=>e.classList.toggle('lit',i<Math.floor((.7-endT)/.7*10)));if(endT<=0)result()}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;if(p.life<=0||p.y>H+10)particles.splice(i,1)}
}
function frame(now){requestAnimationFrame(frame);const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(paused||!W)return;clock+=dt;update(dt);background()}
for(let i=0;i<10;i++){$('cells').appendChild(document.createElement('i'));$('bakebar').appendChild(document.createElement('i'))}
$('dialog').addEventListener('pointerdown',()=>{if(state==='play'){typed=1;$('q').textContent=Q[index][0]}});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.7)start()});
$('rank').addEventListener('click',()=>{if(chosen)lb.share('나를 디저트로 — '+chosen[0]+' · '+chosen[1]+'\n'+chosen[5])});
lb.onPause(p=>{paused=p;last=0});
lb.assets.font('font/galmuri11').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/galmuri9').then(v=>document.documentElement.style.setProperty('--body-font',v));
addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);lb.assets.preload();
});
