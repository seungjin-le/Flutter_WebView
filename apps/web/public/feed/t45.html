<title>우주선 성격 유형 배치</title>
<style>
:root{
--bg:#1F2A5C;--fl:#3B4C9B;--hi:#ffffffcc;--card:#F2F4FF;
--paper:#F2F4FF;--ink:#1F2A5C;--act:#2EC4D6;--on:#1F2A5C;
--pin:#d3f5f7;--c:#2E3A87;--sh:#111a3d45;
--title-font:system-ui,sans-serif;--body-font:ui-rounded,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body-font)}
button{font-family:var(--title-font);font-weight:400;cursor:pointer;touch-action:manipulation}
h1,h2,p{margin:0;word-break:keep-all}
button,img{max-width:100%}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 5%,var(--fl),transparent 68%),var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:absolute;inset:0;overflow:hidden}
.inset{padding:calc(14px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(16px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px))}
#start{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:calc(60px + var(--lb-safe-top,0px));text-align:center}
.terminal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;color:var(--card);font-size:12px;letter-spacing:.08em}
.signal{display:flex;gap:4px;align-items:center}
.signal i{display:block;width:5px;height:10px;border-radius:5px;background:var(--act)}
.signal i:nth-child(2){height:15px}.signal i:nth-child(3){height:20px}
.lbl{background:var(--ink);color:var(--card);border-radius:18px;padding:12px 15px;box-shadow:inset 0 1px var(--hi),0 5px 15px var(--sh)}
#start .lbl{width:100%}
h1{font-family:var(--title-font);font-size:clamp(28px,4.8vh,36px);font-weight:400;line-height:1.25;letter-spacing:-.03em}
.hook{color:var(--card);font-size:clamp(15px,2.4vh,18px);line-height:1.45}
.small{font-size:12px;color:var(--card);opacity:.85}
.artbox{position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate;min-height:0}
.artbox img{display:block;width:100%;height:100%;object-fit:contain;position:relative;z-index:2}
.artbox img[data-lb-art-missing]{display:none}
.fallback{display:none;position:absolute;inset:15% 18%;z-index:2;border-radius:38%;background:radial-gradient(at 30% 20%,var(--hi),transparent 60%),var(--c);box-shadow:inset 0 4px var(--hi),0 18px 32px var(--sh);color:var(--card);align-items:center;justify-content:center;font:400 clamp(40px,12vh,100px) var(--title-font)}
.artbox img[data-lb-art-missing]+.fallback,.artbox img:not([src])+.fallback{display:flex}
.ped{position:absolute;left:13%;right:13%;bottom:4%;height:13%;border-radius:50%;background:radial-gradient(at 40% 20%,var(--hi),var(--fl));box-shadow:0 -24px 50px -15px var(--c),0 10px 16px var(--sh);z-index:0}
#start .artbox{flex:1;width:100%;max-width:360px}
#start .artbox:before,.result-art:before{content:"";position:absolute;width:70%;height:60%;border-radius:50%;background:var(--card);opacity:.08}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:6px 12px;background:var(--pin);color:var(--ink);border-radius:99px;box-shadow:inset 0 2px var(--hi),0 2px var(--sh);font-size:14px}
.primary,.secondary{min-height:60px;border:0;border-radius:99px;padding:12px 20px;font-size:18px;line-height:1.25;background:linear-gradient(var(--hi),transparent 40%),var(--act);color:var(--on);box-shadow:0 6px 0 var(--fl),0 12px 24px var(--sh)}
.primary:active,.secondary:active{box-shadow:inset 0 3px 7px var(--sh),0 3px 0 var(--fl)}
#go{width:100%;flex:none;max-width:340px}
#play{display:flex;flex-direction:column;gap:14px}
#hud{display:flex;flex-direction:column;gap:12px;flex:none;color:var(--card)}
.hudline{display:flex;justify-content:space-between;align-items:center;gap:10px}
#sc{font-size:17px;font-variant-numeric:tabular-nums;font-weight:400}
#info{font-size:12px}
#slots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.slot{height:28px;border-radius:12px;background:var(--fl);box-shadow:inset 0 2px 4px var(--sh);position:relative;transition:background .2s}
.slot:after{content:"";position:absolute;top:5px;left:25%;right:25%;height:4px;border-radius:8px;background:var(--hi);opacity:.25}
.slot.filled{background:var(--act)}
.slot.current{box-shadow:inset 0 0 0 2px var(--card),0 0 10px var(--sh)}
#bodypanel{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px}
.crew-id{display:flex;align-items:center;gap:12px;color:var(--card);font-size:13px}
.id-icon{width:44px;height:52px;border-radius:12px;background:linear-gradient(var(--hi),transparent),var(--pin);position:relative;box-shadow:0 4px 0 var(--fl)}
.id-icon:before{content:"";position:absolute;width:13px;height:13px;left:15px;top:10px;border-radius:50%;background:var(--fl)}
.id-icon:after{content:"";position:absolute;width:25px;height:13px;left:9px;bottom:11px;border-radius:12px 12px 6px 6px;background:var(--fl)}
.crew-id p{line-height:1.6}
.card{background:linear-gradient(var(--hi),transparent 36%),var(--card);border-radius:25px;box-shadow:inset 0 2px var(--hi),0 8px 22px var(--sh);padding:20px}
#questioncard{position:relative;flex:none}
#questioncard:after{content:"";position:absolute;bottom:-9px;left:28px;width:25px;height:24px;border-radius:0 0 18px 6px;background:var(--card)}
.q-label{font-size:12px;opacity:.75;margin-bottom:10px}
#question{font-size:clamp(20px,3.2vh,24px);font-weight:400;line-height:1.45}
#options{display:flex;flex-direction:column;gap:13px;flex:none}
.opt{width:100%;min-height:64px;display:flex;align-items:center;text-align:left;gap:12px;padding:12px 18px;border:0;border-radius:99px;color:var(--ink);background:linear-gradient(var(--hi),transparent 45%),var(--card);box-shadow:0 6px 0 var(--fl),0 12px 18px var(--sh);font-family:var(--body-font);font-size:clamp(17px,2.7vh,18px);line-height:1.35}
.pin{display:flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;background:var(--pin);box-shadow:inset 0 2px var(--hi),0 2px var(--sh);font-size:15px}
.opt:active,.opt.on{background:linear-gradient(var(--hi),transparent 50%),var(--pin);box-shadow:inset 0 0 0 3px var(--act),0 3px 0 var(--fl)}
.opt:disabled{cursor:default;opacity:1}
.opt.on .pin{animation:pinpop .25s}
@keyframes pinpop{50%{transform:scale(1.18)}}
#footnote{color:var(--card);opacity:.8;text-align:center;font-size:12px;flex:none}
#scan{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;color:var(--card)}
.patch{width:100px;height:100px;border-radius:35%;background:linear-gradient(var(--hi),transparent),var(--act);box-shadow:inset 0 0 0 7px var(--pin),0 12px 25px var(--sh);position:relative}
.patch:after{content:"";position:absolute;width:36px;height:36px;left:32px;top:32px;border-radius:50%;background:var(--card);box-shadow:0 0 0 9px var(--fl)}
#scan p{font-size:22px}
#over{background:radial-gradient(at 50% 0,var(--fl),transparent 65%),var(--bg)}
#rp{position:absolute;inset:0}
#rp section{margin:14px 16px 24px;min-width:0}
#rp section:first-child{margin-top:18px}
.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--card);font-size:12px}
.result-art{height:46vh;min-height:235px;max-height:440px;width:100%;margin:10px auto 14px}
#final{display:block;text-align:center;font:400 clamp(32px,5.8vh,42px)/1.3 var(--title-font);word-break:keep-all;padding:15px 10px;border-radius:18px;background:var(--ink);color:var(--card);box-shadow:inset 0 2px var(--hi)}
#shareline{text-align:center;color:var(--card);font-size:17px;line-height:1.5;margin-top:14px}
#why{text-align:center;font-size:12px;color:var(--card);margin-top:12px;opacity:.85}
#traits{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:17px}
#description{font-size:17px;line-height:1.8}
.section-label{font-size:13px;color:var(--card);margin-bottom:12px}
.lb-rec{font-size:14px;line-height:1.5;color:var(--card);text-align:center;margin-top:16px}
.tendency{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.tendency span{font-size:12px;border-radius:8px;padding:6px 8px;background:var(--fl);color:var(--card)}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pair{min-width:0;padding:12px;text-align:center;border-radius:22px}
.pair .artbox{height:145px}
.pair .fallback{font-size:40px}
.pair p{font-size:12px;margin-bottom:5px}
.pair b{font-weight:400;font-size:16px;line-height:1.5;display:block}
#result-actions{display:flex;flex-direction:column;gap:15px}
#result-actions button{width:100%}
.secondary{background:linear-gradient(var(--hi),transparent 40%),var(--card);color:var(--ink)}
#sub{color:var(--card);font-size:12px;text-align:center;line-height:1.7;margin-top:4px}
@media(max-height:540px){
#start{padding-top:calc(14px + var(--lb-safe-top,0px));gap:7px}
#start .terminal-head{display:none}
h1{font-size:28px}#start .lbl{padding:8px}
#play{gap:8px}#hud{gap:6px}.slot{height:18px}
#bodypanel{gap:10px}.crew-id{display:none}.card{padding:15px}
#question{font-size:20px}.q-label{margin-bottom:5px}
#options{gap:10px}.opt{min-height:50px;padding:8px 13px}
#footnote{display:none}.primary,.secondary{min-height:52px}
}
@media(max-height:340px){
#start{gap:5px}.hook{font-size:13px}#start .small{display:none}
#start h1{font-size:24px}#start .lbl{padding:6px}
#play{gap:6px}.hudline #info{display:none}.slot{height:12px}
#bodypanel{gap:6px}.q-label{display:none}#question{font-size:18px;line-height:1.3}
#questioncard{padding:12px}#options{gap:9px}.opt{min-height:48px;font-size:16px}.pin{width:27px;height:27px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="start" class="screen inset">
  <div class="terminal-head"><span>승무원 배치 단말기</span><span class="signal" aria-hidden="true"><i></i><i></i><i></i></span></div>
  <div class="lbl"><h1>우주선 성격 유형 배치</h1></div>
  <p class="hook">출항 10분 전, 내 승무원 자리를 배정함</p>
  <div class="artbox" style="--c:#2E3A87">
    <div class="ped" aria-hidden="true"></div>
    <img data-lb-art="gen/r1" alt="별지도 부엉이">
    <div class="fallback" aria-hidden="true">별</div>
  </div>
  <p class="small">Mbti유형 · 가볍게 보는 승무원 성향</p>
  <button id="go" class="primary" type="button">배치 시작</button>
</div>
<div id="play" class="screen inset" hidden>
  <div id="hud" hidden>
    <div class="hudline"><span id="info">승무원 응답 수신 중</span><b id="sc">1/10</b></div>
    <div id="slots" aria-label="승무원 카드 진행"></div>
  </div>
  <div id="bodypanel">
    <div class="crew-id"><div class="id-icon" aria-hidden="true"></div><p>신입 승무원<br>아직 비어 있는 임무 패치</p></div>
    <div id="questioncard" class="card">
      <p class="q-label">함교에서 교신 도착</p>
      <h2 id="question"></h2>
    </div>
    <div id="options"></div>
  </div>
  <p id="footnote">더 끌리는 쪽으로 응답하면 됨</p>
</div>
<div id="scan" class="screen inset" hidden>
  <div class="patch" aria-hidden="true"></div>
  <p>맞는 자리 찾았음!</p>
  <span>승무원 패치 붙이는 중</span>
</div>
<div id="over" class="screen" hidden>
  <div id="rp">
    <section>
      <div class="result-head"><span>승무원 배치 단말기</span><span class="chip">배정 완료</span></div>
      <div class="artbox result-art">
        <div class="ped" aria-hidden="true"></div>
        <img id="result-art" data-lb-art="gen/r1" alt="별지도 부엉이">
        <div id="result-fallback" class="fallback" aria-hidden="true">별</div>
      </div>
      <h2 id="final"></h2>
      <p id="shareline"></p>
      <p id="why">배정 완료! 내 자리로 이동함</p>
    </section>
    <section>
      <p class="section-label">내 임무 패치</p>
      <div id="traits"></div>
      <div class="card"><p id="description"></p></div>
      <div id="tendencies" class="tendency"></div>
      <p id="record" class="lb-rec"></p>
    </section>
    <section>
      <p class="section-label">함께 탑승한 승무원</p>
      <div class="pairs">
        <div class="card pair">
          <p>호흡 척척 맞음</p>
          <div class="artbox">
            <img id="good-art" data-lb-art="gen/r2" alt="궤도 문어">
            <div id="good-fallback" class="fallback" aria-hidden="true">궤</div>
          </div>
          <b id="good-name"></b>
        </div>
        <div class="card pair">
          <p>교신 한 번 더 필요함</p>
          <div class="artbox">
            <img id="bad-art" data-lb-art="gen/r5" alt="신호 돌고래">
            <div id="bad-fallback" class="fallback" aria-hidden="true">신</div>
          </div>
          <b id="bad-name"></b>
        </div>
      </div>
    </section>
    <section id="result-actions">
      <button id="again" type="button" class="secondary">다시 배치</button>
      <button id="rank" type="button" class="primary">결과 공유</button>
      <p id="sub">실제 성격 진단은 아님<br>우주선에서 고른 답으로 보는 성향임</p>
    </section>
  </div>
</div>
</div>
<script>

lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--body-font',v));
const RESULTS=[
{name:'별지도 부엉이',color:'#2E3A87',good:1,bad:4,share:'헐 난 별지도 부엉이래! 길 찾는 건 맡겨둠',traits:['기록부터 펼침','혼자 정리함','다음 길도 봄'],desc:['조용히 듣다가 놓친 단서를 딱 집어냄.','흩어진 정보를 엮어서 먼 항로까지 살피는 승무원임.','교신이 끝나면 별지도에 새 길을 그려 넣음.']},
{name:'궤도 문어',color:'#8E5BD9',good:0,bad:5,share:'난 궤도 문어래! 떠오른 생각이 벌써 한가득임',traits:['생각을 엮음','딴 길도 살핌','여럿을 챙김'],desc:['하나를 보다가도 다른 가능성이 줄줄 떠오름.','복잡한 일도 여러 방향으로 나눠 살피는 게 빠름.','낯선 행성을 만나면 새 항로를 나란히 그려봄.']},
{name:'함장 사자',color:'#F28C28',good:3,bad:6,share:'난 함장 사자임! 다 같이 갈 항로부터 정함',traits:['역할부터 나눔','결정을 맡음','약속을 지킴'],desc:['다들 머뭇거릴 때 할 일을 또렷하게 나눔.','맡은 일은 끝까지 챙겨서 동료들이 마음을 놓음.','출항 전에는 승무원 자리를 직접 확인함.']},
{name:'달빛 해파리',color:'#F2A0C8',good:2,bad:7,share:'난 달빛 해파리래~ 동료 표정부터 보게 됨',traits:['표정을 살핌','말을 기다림','조용히 챙김'],desc:['작은 표정 변화도 그냥 지나치지 않음.','동료가 편히 말할 때까지 곁을 지키는 승무원임.','야간 근무자 옆에 달빛 등을 켜둠.']},
{name:'신호 돌고래',color:'#2EC4D6',good:5,bad:0,share:'난 신호 돌고래임! 반가우면 바로 교신함',traits:['먼저 말 검','소식을 전함','같이 웃음'],desc:['낯선 승무원에게도 자연스럽게 말을 건넴.','흩어진 소식을 연결해서 함교 분위기를 살림.','쉬는 시간에는 동료들을 불러 새 소식을 전함.']},
{name:'정비 거북',color:'#4C9A5B',good:4,bad:1,share:'난 정비 거북래! 확인한 장비만 믿고 출항함',traits:['장비를 확인함','차례대로 고침','도구를 챙김'],desc:['작은 이상도 확인하고 넘어가서 든든함.','익숙한 절차를 차근차근 지켜 일을 마무리함.','출항 전에는 느슨한 나사부터 조여둠.']},
{name:'로켓 치타',color:'#F2C230',good:7,bad:2,share:'난 로켓 치타래! 궁금한 곳은 몸이 먼저 감',traits:['바로 움직임','현장을 살핌','변화에 맞춤'],desc:['새로운 일이 생기면 현장부터 확인함.','상황이 바뀌어도 손발을 맞춰 빠르게 움직임.','착륙 신호가 오면 탐사 장비를 들고 나섬.']},
{name:'식량 너구리',color:'#C8553D',good:6,bad:3,share:'난 식량 너구리임! 간식 취향까지 기억함',traits:['취향을 기억함','한 몫 더 챙김','함께 나눠 먹음'],desc:['동료가 좋아하는 것을 자연스럽게 기억함.','필요한 물건을 미리 챙겨서 생활을 편하게 만듦.','긴 근무가 끝나면 동료 몫 간식을 꺼내놓음.']}
];
const QUESTIONS=[
{axis:0,q:'새 승무원이 옆자리에 앉았음. 어떻게 함?',a:[
['어느 행성 출신인지 먼저 물음',0,[[4,3],[2,1]]],
['눈인사하고 내 장비부터 살핌',1,[[0,3],[3,1]]]]},
{axis:1,q:'창밖에 낯선 행성이 보임. 뭐가 궁금함?',a:[
['표면이랑 기온을 확인하고 싶음',0,[[5,3],[6,1]]],
['누가 살고 있을지 상상해 봄',1,[[1,3],[0,1]]]]},
{axis:2,q:'동료가 실수해서 풀이 죽었음. 어떻게 함?',a:[
['어디서 꼬였는지 같이 짚어봄',0,[[5,3],[2,1]]],
['많이 놀랐는지 먼저 물어봄',1,[[3,3],[7,1]]]]},
{axis:3,q:'내일 탐사 일정이 비었음. 어떻게 함?',a:[
['갈 곳이랑 챙길 물건을 정함',0,[[2,3],[0,1]]],
['착륙해서 끌리는 곳으로 감',1,[[6,3],[1,1]]]]},
{axis:0,q:'근무 끝! 휴게실이 북적임. 어디로 감?',a:[
['간식 들고 동료들 옆에 앉음',0,[[7,3],[4,1]]],
['조용한 창가에서 혼자 쉬어감',1,[[3,3],[0,1]]]]},
{axis:1,q:'통신기에 낯선 신호가 잡힘. 어떻게 봄?',a:[
['기록된 주파수부터 대조해 봄',0,[[5,3],[7,1]]],
['숨은 뜻이 있을지 연결해 봄',1,[[1,3],[0,1]]]]},
{axis:2,q:'항로를 두고 동료 의견이 갈림. 뭘 살핌?',a:[
['연료랑 걸리는 시간을 비교함',0,[[2,3],[6,1]]],
['각자 왜 원하는지 들어봄',1,[[3,3],[4,1]]]]},
{axis:3,q:'탐사 중 옆길이 눈에 들어옴. 어떻게 함?',a:[
['정해둔 구역을 다 본 뒤 살핌',0,[[5,3],[7,1]]],
['지금 살짝 들러서 확인해 봄',1,[[6,3],[1,1]]]]},
{axis:0,q:'신기한 별을 발견함! 누구와 보고 싶음?',a:[
['교신으로 동료들을 불러 모음',0,[[4,3],[2,1]]],
['혼자 충분히 보고 나중에 전함',1,[[0,3],[3,1]]]]},
{axis:1,q:'항해 일지 마지막 칸에 뭘 남기고 싶음?',a:[
['먹은 것과 들른 곳을 적어둠',0,[[7,3],[6,1]]],
['별을 보며 떠오른 생각을 적음',1,[[1,3],[4,1]]]]}
];
let W=0,H=0,state='start',paused=false,last=0,clock=0,index=0,lock=0,endT=0;
let scores=[],axes=[],axisLast=[],recent=[],chosen=-1,answerCount=0,hs='',hi='',dots=[],winner=0,overAt=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const capsules=[];
for(let i=0;i<QUESTIONS.length;i++){
 const el=document.createElement('span');el.className='slot';$('slots').appendChild(el);capsules.push(el);
}
const optionButtons=[];
for(let i=0;i<2;i++){
 const b=document.createElement('button');b.type='button';b.className='opt';
 const pin=document.createElement('span');pin.className='pin';pin.textContent=i===0?'가':'나';pin.setAttribute('aria-hidden','true');
 const text=document.createElement('span');b.append(pin,text);
 b.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  choose(i);
 });
 b.addEventListener('click',e=>{if(e.detail===0)choose(i)});
 $('options').appendChild(b);optionButtons.push(b);
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
 dots=Array.from({length:38},(_,i)=>({x:((i*137.7)%997)/997,y:((i*271.3)%991)/991,r:i%4===0?1.6:.8}));
 render();
}
function hud(){
 const a=(index+1)+'/'+QUESTIONS.length,b=answerCount?'승무원 카드 채우는 중':'승무원 응답 수신 중';
 if(a!==hs){$('sc').textContent=a;hs=a}
 if(b!==hi){$('info').textContent=b;hi=b}
 capsules.forEach((el,i)=>{el.classList.toggle('filled',i<answerCount);el.classList.toggle('current',i===index)});
}
function showQuestion(){
 const q=QUESTIONS[index];$('question').textContent=q.q;
 optionButtons.forEach((b,i)=>{b.lastChild.textContent=q.a[i][0];b.disabled=false;b.classList.remove('on')});
 chosen=-1;hud();
}
function reset(){
 index=0;lock=0;endT=0;scores=Array(8).fill(0);recent=Array(8).fill(-1);
 axes=Array.from({length:4},()=>[0,0]);axisLast=Array(4).fill(0);
 answerCount=0;chosen=-1;winner=0;hs=hi='';showQuestion();
}
function start(){
 reset();state='play';
 $('start').hidden=true;$('over').hidden=true;$('scan').hidden=true;
 $('play').hidden=false;$('hud').hidden=false;
 lb.audio.unlock();lb.audio.sfx(SFX.tap);
}
function choose(n){
 if(state!=='play'||lock>0||chosen!==-1)return;
 chosen=n;const q=QUESTIONS[index],a=q.a[n];
 axes[q.axis][a[1]]++;axisLast[q.axis]=a[1];
 a[2].forEach(([r,p],i)=>{scores[r]+=p;recent[r]=answerCount*3+(2-i)});
 answerCount++;lock=.4;
 optionButtons.forEach((b,i)=>{b.disabled=true;b.classList.toggle('on',i===n)});
 lb.audio.sfx(SFX.tap);lb.haptic('light');hud();
}
function selectResult(){
 let pick=0;
 for(let i=1;i<8;i++){
  if(scores[i]>scores[pick]||(scores[i]===scores[pick]&&recent[i]>recent[pick]))pick=i;
 }
 return pick;
}
function die(){
 if(state!=='play')return;
 winner=selectResult();state='dying';endT=.65;
 $('play').hidden=true;$('hud').hidden=true;$('scan').hidden=false;
 lb.audio.sfx(SFX.win);lb.audio.sfx(SFX.spark);lb.haptic('success');
 lb.fx.sparkle(W/2,H/2);lb.fx.confetti();
}
function setArt(prefix,i){
 const r=RESULTS[i],im=$(prefix+'-art'),fall=$(prefix+'-fallback');
 im.setAttribute('data-lb-art','gen/r'+(i+1));im.alt=r.name;
 im.removeAttribute('data-lb-art-missing');
 fall.textContent=r.name[0];
 im.parentElement.style.setProperty('--c',r.color);
}
function result(){
 state='over';overAt=clock;const r=RESULTS[winner];
 document.documentElement.style.setProperty('--c',r.color);
 setArt('result',winner);setArt('good',r.good);setArt('bad',r.bad);
 $('final').textContent=r.name;$('shareline').textContent=r.share;
 $('description').replaceChildren();
 r.desc.forEach((text,i)=>{if(i)$('description').appendChild(document.createElement('br'));$('description').appendChild(document.createTextNode(text))});
 $('traits').replaceChildren();
 r.traits.forEach(text=>{const el=document.createElement('span');el.className='chip';el.textContent=text;$('traits').appendChild(el)});
 $('good-name').textContent=RESULTS[r.good].name;$('bad-name').textContent=RESULTS[r.bad].name;
 const labels=[['함께 말하며 충전함','혼자 쉬며 충전함'],['눈앞의 단서를 봄','가능성을 이어봄'],['이유부터 살핌','기분부터 살핌'],['순서를 정해둠','흐름에 맞춰 감']];
 $('tendencies').replaceChildren();
 axes.forEach((pair,i)=>{
  const side=pair[0]===pair[1]?axisLast[i]:(pair[0]>pair[1]?0:1);
  const tag=document.createElement('span');tag.textContent=labels[i][side];$('tendencies').appendChild(tag);
 });
 $('record').textContent='내 승무원 카드에 '+r.traits[0]+' 패치가 찍힘';
 $('scan').hidden=true;$('over').hidden=false;
 lb.scroll(document.getElementById("rp"), { result: r.name });
}
function update(dt){
 if(state==='play'&&lock>0){
  lock=Math.max(0,lock-dt);
  if(lock===0){
   if(index===QUESTIONS.length-1){die();return}
   index++;showQuestion();
  }
 }else if(state==='dying'){
  endT-=dt;if(endT<=0)result();
 }
}
function render(){
 if(!W||!H)return;ctx.clearRect(0,0,W,H);
 const styles=getComputedStyle(document.documentElement);
 ctx.fillStyle=styles.getPropertyValue('--card');
 for(const p of dots){
  const drift=reduce?0:clock*2.5;
  const x=(p.x*W-drift%W+W)%W,y=p.y*H;
  ctx.globalAlpha=.16+.13*(reduce?1:Math.sin(clock*.7+p.x*15));
  ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.05):0;last=now;
 if(paused)return;
 clock+=dt;update(dt);render();
}
lb.onPause(p=>{paused=p;last=0});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.4)start()});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 const r=RESULTS[winner];lb.share('내 우주선 자리: '+r.name+'! '+r.share);
});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
