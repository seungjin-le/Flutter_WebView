<html lang="ko">
<head>


<title>나의 진화력 테스트</title>
<style>
:root{
--bg:#f4a261;--paper:#f4a261;--ink:#264653;--act:#e76f51;
--fr:#6d4c41;--hd:#264653;--s1:#2a9d8f;--k2:#6d4c41;
--k3:#264653;--k4:#2a9d8f;--c:#2a9d8f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font, sans-serif)}
button{font:inherit;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg);isolation:isolate}
#app::after{content:"";position:absolute;inset:0;border:7px solid var(--fr);pointer-events:none;z-index:20}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:stretch;
padding:calc(15px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(17px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));
overflow:hidden;gap:9px}
h1,h2,p{margin:0;word-break:keep-all}
.ttl,button,#final,.num{font-family:var(--title-font,sans-serif);font-weight:900;letter-spacing:-.025em}
.ttl{color:var(--hd);text-shadow:3px 3px var(--bg)}
.rib{align-self:center;background:var(--ink);color:var(--bg);padding:6px 24px;text-align:center;font-size:clamp(12px,2.1vh,15px);clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.label{font-size:12px;letter-spacing:.06em}
#start{padding-top:calc(60px + var(--lb-safe-top,0px));text-align:center}
#start h1{font-size:clamp(29px,5.3vh,36px);line-height:1.13;flex-shrink:0}
#start h1 span{color:var(--fr)}
#start .hook{font-size:clamp(14px,2.6vh,18px);line-height:1.3}
.art{position:relative;min-height:0;flex:1;display:flex;align-items:center;justify-content:center;isolation:isolate}
.art::before{content:"";position:absolute;height:86%;max-width:100%;aspect-ratio:1;border-radius:50%;background:var(--s1);z-index:-1}
.art::after{content:"";position:absolute;right:10%;top:10%;width:24px;height:24px;background:var(--act);clip-path:polygon(50% 0,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0 50%,37% 37%)}
.asset{display:block;width:100%;height:100%;min-height:0;object-fit:contain}
.note{align-self:center;max-width:100%;font-size:clamp(12px,2.3vh,16px);background:var(--act);padding:7px 12px;transform:rotate(-2deg);box-shadow:4px 4px var(--fr)}
.startline{font-size:clamp(13px,2.5vh,17px)}
.mainbtn{min-height:64px;border:3px solid var(--ink);background:var(--act);color:var(--ink);padding:10px 13px;font-size:clamp(16px,2.6vh,20px);box-shadow:5px 5px var(--ink);flex-shrink:0}
#go{border-radius:28px;width:100%;margin-bottom:5px}
.mainbtn:active{box-shadow:2px 2px var(--ink);background:var(--s1)}
#hud{display:flex;align-items:center;gap:12px;min-height:32px;flex-shrink:0}
#sc{background:var(--ink);color:var(--bg);padding:5px 11px;border-radius:18px;font-size:17px;font-variant-numeric:tabular-nums}
#route{display:flex;flex:1;align-items:center;justify-content:space-between;gap:4px}
.dot{width:13px;height:13px;border:3px solid var(--ink);border-radius:50%;background:var(--bg)}
.dot.past{background:var(--ink)}
.dot.now{background:var(--act);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
#questTag{align-self:flex-start;background:var(--s1);color:var(--ink);font-size:12px;padding:4px 10px;box-shadow:3px 3px var(--ink)}
#questionArt{flex:1;min-height:20px;position:relative;display:flex;justify-content:center}
#hc{height:100%;width:100%;display:block}
.card{position:relative;flex-shrink:0;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:16px 14px 14px 58px;box-shadow:5px 5px var(--fr)}
.num{position:absolute;left:12px;top:15px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--act);font-size:20px}
#question{font-size:clamp(19px,3.25vh,24px);line-height:1.35}
#answers{display:grid;grid-template-columns:1fr;gap:10px;flex-shrink:0;padding-bottom:5px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px;border:3px solid var(--ink);border-radius:25px;min-height:52px;background:var(--bg);color:var(--ink);font-family:var(--body-font,sans-serif);font-size:clamp(16px,2.8vh,18px);line-height:1.2;box-shadow:4px 4px var(--fr)}

c.save();c.translate(39,15);c.rotate(.3+(gesture>0?.65+selected*.15:0));capsule(c,-7,-5,20,43,PAL[4]);capsule(c,-4,-5,14,38,PAL[0]);c.restore();
shape(c,'circle',0,-14,43,0,PAL[4]);shape(c,'circle',0,-13,39,0,PAL[0]);
shape(c,'half',0,-32,39,0,PAL[2]);
shape(c,'circle',-36,-12,9,0,PAL[0]);shape(c,'circle',36,-12,9,0,PAL[0]);
shape(c,'circle',-13,-12,9,0,PAL[4]);shape(c,'circle',14,-12,9,0,PAL[4]);
shape(c,'circle',-15,-15,3,0,PAL[0]);shape(c,'circle',12,-15,3,0,PAL[0]);
shape(c,'half',0,5,12,180,PAL[4]);
capsule(c,-23,-53,47,10,PAL[0]);
for(const x of [-23,23]){shape(c,'circle',x,-56,7,0,PAL[0]);shape(c,'circle',x,-48,7,0,PAL[0]);}
shape(c,'circle',-26,2,5,0,PAL[1]);shape(c,'circle',27,2,5,0,PAL[1]);
capsule(c,-22,23,9,16,PAL[4]);capsule(c,1,32,9,12,PAL[4]);capsule(c,21,21,9,15,PAL[4]);
c.restore();
}
function drawBackground(){
ctx.clearRect(0,0,W,H);ctx.fillStyle=PAL[0];ctx.fillRect(0,0,W,H);
shape(ctx,'circle',W+W*.12,H*.13,W*.55,0,PAL[1]);
shape(ctx,'circle',-W*.28,H*.76,W*.57,0,PAL[3]);
shape(ctx,'triangle',W*.86,H*.82,W*.20,0,PAL[2]);
shape(ctx,'triangle',W*.86,H*.65,W*.055,180,PAL[1]);
const drift=reduced?0:Math.sin(clock*.24)*7;
ctx.save();ctx.translate(drift,0);
ctx.fillStyle=PAL[4];
for(let i=0;i<4;i++){const x=W*.66+i*W*.065,y=H*.24;ctx.fillRect(x,y-i%2*14,W*.045,13+i%2*14);}
capsule(ctx,W*.63,H*.27,W*.33,7,PAL[4]);ctx.restore();
ctx.save();ctx.translate(W*.13+(reduced?0:Math.sin(clock*.18)*8),H*.91);ctx.scale(.52,.52);
capsule(ctx,-34,-23,67,43,PAL[2]);shape(ctx,'circle',26,-15,22,0,PAL[2]);
capsule(ctx,34,-12,12,40,PAL[2]);capsule(ctx,-27,10,12,26,PAL[2]);capsule(ctx,12,10,12,26,PAL[2]);
ctx.restore();
}
function fitCanvas(el){
const w=el.clientWidth,h=el.clientHeight,d=Math.min(devicePixelRatio||1,2);
if(!w||!h)return null;
const pw=Math.round(w*d),ph=Math.round(h*d);
if(el.width!==pw||el.height!==ph){el.width=pw;el.height=ph;}
const c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);return {c,w,h};
}
function drawAsset(surface){
const f=fitCanvas(surface.el);if(!f)return;
f.c.clearRect(0,0,f.w,f.h);
const s=Math.min(f.w,f.h)*.98;
lb.assets.draw(f.c,'gen/r'+(surface.idx+1),f.w/2,f.h/2,s,s);
}
function resize(){
W=cv.clientWidth;H=cv.clientHeight;
const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
assetDirty=true;
}
function hud(){
$('sc').textContent=(qi+1)+'/'+questions.length;
$('num').textContent=qi+1;
dots.forEach((d,i)=>d.className='dot'+(i<qi?' past':i===qi?' now':''));
}
function showQuestion(){
const q=questions[qi];hud();$('question').textContent=q.q;
for(let i=0;i<4;i++){opts[i].text.textContent=q.a[i];opts[i].button.disabled=false;opts[i].button.classList.remove('chosen');}
locked=false;selected=-1;
}
function reset(){
qi=0;scores=Array(12).fill(0);ability=[0,0,0,0];answers=[];answerHash=0;
locked=false;transition=0;endT=0;reported=false;gesture=0;pose=0;selected=-1;acc=0;
}
function start(){
reset();state='play';$('start').hidden=true;$('over').hidden=true;$('judging').hidden=true;$('test').hidden=false;
lb.audio.unlock();lb.audio.sfx(SFX.tap);showQuestion();assetDirty=true;
}
function choose(i){
if(state!=='play'||locked||paused)return;
locked=true;selected=i;gesture=.45;transition=.3;
const primary=(qi*4+i)%12,secondary=secondaries[qi][i];
const primaryPoints=[3,2,3,2][(qi+i)%4],secondaryPoints=[1,2,1][(qi+i)%3];
scores[primary]+=primaryPoints;scores[secondary]+=secondaryPoints;
for(let k=0;k<4;k++)ability[k]+=types[primary].v[k]*primaryPoints+types[secondary].v[k]*secondaryPoints;
answers.push(i);answerHash=(answerHash*37+(qi+3)*(i+1)*17)%100003;
opts.forEach((o,j)=>{o.button.disabled=true;if(j===i)o.button.classList.add('chosen');});
lb.audio.sfx(SFX.pop);lb.haptic('light');
}
function findResult(){
const max=Math.max(...scores),ties=[];
scores.forEach((v,i)=>{if(v===max)ties.push(i);});
return ties[answerHash%ties.length];
}
function die(x,y,reason,win){
if(state!=='play')return;
state='dying';endT=.65;locked=true;resultIndex=findResult();
$('test').hidden=true;$('judging').hidden=false;
$('why').textContent=reason;
}
function result(){
if(reported)return;
reported=true;state='over';overAt=clock;
const r=types[resultIndex];
document.documentElement.style.setProperty('--c',colors[resultIndex]);
$('final').textContent=names[resultIndex];$('shareline').textContent=r.line;
$('description').textContent=r.desc.join('\n');
$('chips').replaceChildren();
r.chips.forEach(text=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=text;$('chips').appendChild(chip);});
$('stats').replaceChildren();
const total=ability.reduce((a,b)=>a+b,0)||1;
const statNames=['돌파력','발상력','교감력','탐색력'],values=[];
for(let k=0;k<4;k++){
const v=Math.max(20,Math.min(99,Math.round(ability[k]/total*240+10)));
values.push(v);
const row=document.createElement('div');row.className='stat';
const label=document.createElement('span');label.textContent=statNames[k];
const meter=document.createElement('span');meter.className='meter';
for(let n=0;n<5;n++){const p=document.createElement('i');if(n<Math.round(v/20))p.className='on';meter.appendChild(p);}
const val=document.createElement('b');val.textContent=v;
row.append(label,meter,val);$('stats').appendChild(row);
}
const top=values.indexOf(Math.max(...values));
$('record').textContent='최고 능력치 · '+statNames[top]+' '+values[top];
$('friendName').textContent=names[friends[resultIndex]];$('rivalName').textContent=names[rivals[resultIndex]];
assetSurfaces[1].idx=resultIndex;assetSurfaces[2].idx=friends[resultIndex];assetSurfaces[3].idx=rivals[resultIndex];
$('resultPic').setAttribute('aria-label',names[resultIndex]+' 결과 그림');
$('judging').hidden=true;$('over').hidden=false;assetDirty=true;
lb.done(names[resultIndex]);
lb.audio.sfx(SFX.win);lb.haptic('success');
lb.fx.flash(PAL[0]);lb.fx.confetti();
}
function update(dt){
if(gesture>0)gesture=Math.max(0,gesture-dt);
if(state==='play'&&locked){
transition-=dt;
if(transition<=0){
qi++;
if(qi>=questions.length){qi=questions.length-1;die(W/2,H/2,'부족 직업 배정 완료',true);}
else showQuestion();
}
}else if(state==='dying'){
endT-=dt;if(endT<=0)result();
}
}
function render(){
if(!W||!H)return;
drawBackground();
if(state==='play'){
const f=fitCanvas(hc);if(f)drawHero(heroCtx,f.w,f.h);
}
if(state==='start')drawAsset(assetSurfaces[0]);
if(state==='over'){
for(let i=1;i<assetSurfaces.length;i++)drawAsset(assetSurfaces[i]);
}
assetDirty=false;
}
function frame(now){
requestAnimationFrame(frame);
const dt=last?Math.min((now-last)/1000,.1):0;last=now;
if(paused)return;
clock+=dt;acc+=dt;
while(acc>=STEP){update(STEP);acc-=STEP;}
render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.65)start();});
$('rank').addEventListener('click',()=>{
if(state!=='over')return;
lb.share('나의 진화력 테스트\n내 직업은 '+names[resultIndex]+'임\n'+types[resultIndex].line+'\n우가 우가… 넌 무슨 직업임?');
});
lb.onPause(p=>{paused=p;last=0;});
addEventListener('resize',resize);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
