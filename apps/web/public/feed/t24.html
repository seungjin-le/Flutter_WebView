<style>
:root{--bg:#B9E8FF;--paper:#fff8fb;--ink:#343044;--shade:#79bfd7;--act:#a72e53;--c:#F2A33A;--pink:#FFE3F1;--green:#8BD14A}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font,monospace)}
button{font-family:var(--title-font,monospace);font-weight:400;cursor:pointer;border:0;border-radius:0;color:var(--ink);touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;overflow:hidden;padding:calc(18px + var(--lb-safe-top,0px)) calc(20px + var(--lb-safe-right,0px)) calc(18px + var(--lb-safe-bottom,0px)) calc(20px + var(--lb-safe-left,0px));display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
h1,h2,p{margin:0;word-break:keep-all}
h1,h2,#final{font-family:var(--title-font,monospace);font-weight:400;letter-spacing:-.03em}
.win,.opt,.chip,.mainbtn{background:var(--paper);box-shadow:0 -3px var(--ink),0 3px var(--ink),-3px 0 var(--ink),3px 0 var(--ink),5px 7px var(--shade)}
#start{padding-top:calc(60px + var(--lb-safe-top,0px));gap:12px}
.tag{font-size:clamp(12px,2.3vh,16px);background:var(--pink);padding:5px 10px;box-shadow:3px 3px var(--ink)}
.ttl{font-size:clamp(27px,5.8vh,36px);text-shadow:3px 3px var(--paper)}
#start .intro{font-size:clamp(14px,2.6vh,18px);line-height:1.6}
#hc{display:block;width:100%;min-height:24px;flex:1;max-height:270px;image-rendering:pixelated}
.mainbtn{min-width:170px;min-height:64px;padding:10px 16px;font-size:clamp(18px,3vh,22px)}
#go{background:var(--act);color:var(--paper);flex-shrink:0}
#go:before{content:"▶ ";font-size:16px}
.mainbtn:active{background:var(--pink)}
#go:active{background:var(--ink)}
#hud{position:absolute;z-index:2;top:calc(14px + var(--lb-safe-top,0px));right:calc(13px + var(--lb-safe-right,0px));bottom:calc(18px + var(--lb-safe-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;width:15px}
#sc{position:fixed;left:calc(20px + var(--lb-safe-left,0px));top:calc(15px + var(--lb-safe-top,0px));font-size:16px;font-weight:400;background:var(--paper);padding:5px 9px;box-shadow:3px 3px var(--ink);font-variant-numeric:tabular-nums}
#steps{display:flex;flex-direction:column;gap:5px;margin-top:47px}
#steps i{width:12px;height:19px;border:2px solid var(--ink);background:var(--paper)}
#steps i.past{background:var(--green)}
#steps i.now{background:var(--act)}
#play{padding-right:calc(43px + var(--lb-safe-right,0px));padding-top:calc(58px + var(--lb-safe-top,0px));gap:13px}
#qtop{min-height:36px;flex:1;width:100%;position:relative;display:flex;align-items:center;justify-content:center}
#cursor{position:absolute;width:56px;height:56px;image-rendering:pixelated;z-index:5;pointer-events:none}
.place{font-size:clamp(12px,2.3vh,16px);padding:5px 12px;background:var(--pink);box-shadow:3px 3px var(--shade);align-self:flex-start}
#bubble{position:relative;width:100%;padding:16px 14px;min-height:83px;display:flex;align-items:center;text-align:left;flex-shrink:0}
#bubble:after{content:"";position:absolute;width:12px;height:9px;left:20px;bottom:-12px;background:var(--paper);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink)}
#question{font-size:clamp(18px,3.5vh,24px);line-height:1.5;min-height:2.9em}
#answers{display:grid;gap:12px;width:100%;padding:5px 0}
.opt{position:relative;width:100%;text-align:left;min-height:56px;padding:10px 12px 10px 31px;font-size:clamp(16px,2.7vh,18px);line-height:1.4}
.opt:before{content:"";position:absolute;left:12px;top:calc(50% - 4px);width:8px;height:8px;background:var(--shade)}
.opt.on,.opt:active{background:var(--act);color:var(--paper);box-shadow:0 -3px var(--ink),0 3px var(--ink),-3px 0 var(--ink),3px 0 var(--ink),5px 7px var(--pink)}
.opt.on:before{content:"▶";background:none;width:auto;height:auto;top:calc(50% - 10px);left:9px;color:var(--paper)}
.opt.spark{outline:3px solid var(--green);outline-offset:5px}
#qfoot{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;flex-shrink:0}
#back{font-size:14px;background:var(--paper);min-height:42px;padding:7px 12px;border:2px solid var(--ink)}
#hint{font-size:12px;text-align:right}
#judging{justify-content:center}
#judging h2{font-size:24px}
.load{width:84%;height:25px;padding:4px;background:var(--paper);border:3px solid var(--ink)}
#loadfill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--green) 0 12px,var(--paper) 12px 15px)}
#over{gap:9px;padding-top:calc(15px + var(--lb-safe-top,0px));padding-bottom:calc(13px + var(--lb-safe-bottom,0px))}
#why{font-size:clamp(12px,2.1vh,15px);padding:4px 10px;background:var(--pink)}
#resultArt{width:100%;flex:1;min-height:38px;max-height:225px;background:#fff;image-rendering:pixelated;box-shadow:3px 3px var(--shade)}
#final{display:block;font-size:clamp(27px,5.6vh,39px);line-height:1.18;text-shadow:3px 3px var(--c)}
#shareline{font-size:clamp(12px,2.15vh,16px);line-height:1.35}
#traits{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:2px 0}
.chip{font-size:clamp(11px,1.95vh,14px);padding:4px 7px;background:var(--pink)}
#description{font-size:clamp(12px,2.2vh,16px);line-height:1.5;padding:9px 11px;text-align:left;width:100%}
#matches{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;min-height:55px}
.match{display:flex;align-items:center;gap:5px;background:var(--paper);border-bottom:3px solid var(--c);padding:4px;text-align:left}
.match canvas{width:48px;height:48px;flex-shrink:0;image-rendering:pixelated}
.match p{font-size:clamp(10px,1.8vh,12px);line-height:1.5}
.match b{font-size:clamp(12px,2.1vh,15px);font-weight:400;display:block}
.lb-rec{font-size:12px}
#sub{font-size:12px}
#actions{display:flex;gap:12px;width:100%;flex-shrink:0}
#actions button{flex:1;min-width:0;min-height:64px;padding:7px 5px;font-size:clamp(16px,2.7vh,20px)}
#rank{background:var(--act);color:var(--paper)}
.bob{animation:bob .8s steps(1) infinite}
@keyframes bob{50%{translate:0 -4px}}
.pop{animation:pop .18s steps(2)}
@keyframes pop{50%{color:var(--act)}}
@media(max-height:570px){
.scr{gap:9px}#start{padding-top:calc(24px + var(--lb-safe-top,0px))}
#play{gap:10px;padding-top:calc(52px + var(--lb-safe-top,0px))}
#qtop{min-height:18px}#bubble{min-height:65px;padding:10px 12px}
#answers{gap:10px}.opt{min-height:48px;padding-top:8px;padding-bottom:8px}
#question{font-size:18px;line-height:1.3;min-height:2.5em}
#over{gap:7px}#description{font-size:12px;padding:6px 8px;line-height:1.35}
#matches{min-height:40px}.match canvas{width:34px;height:34px}
#actions button{min-height:56px}.lb-rec{font-size:11px}
}
@media(max-height:410px){
.scr{padding-top:calc(9px + var(--lb-safe-top,0px));padding-bottom:calc(9px + var(--lb-safe-bottom,0px));gap:6px}
#start{padding-top:calc(10px + var(--lb-safe-top,0px));gap:6px}

#hc{max-height:80px}#go{min-height:64px;font-size:18px}
#play{padding-top:calc(43px + var(--lb-safe-top,0px));gap:7px}

#qfoot{min-height:30px}#back{min-height:30px;font-size:12px}#hint{font-size:10px}
#over{gap:5px;padding-top:calc(7px + var(--lb-safe-top,0px));padding-bottom:calc(8px + var(--lb-safe-bottom,0px))}
#why{font-size:10px;padding:2px 6px}#final{font-size:23px}#shareline{font-size:10px}
#traits{gap:7px;padding:0}.chip{font-size:10px;padding:2px 4px}
#description{font-size:10px;line-height:1.25;padding:4px 6px}
#matches{min-height:29px;gap:6px}.match{padding:2px}.match canvas{width:27px;height:27px}.match p{font-size:9px}.match b{font-size:10px}
#resultArt{min-height:24px;max-height:70px}
#actions button{min-height:43px;font-size:14px}
.lb-rec{font-size:9px;line-height:1}#sub{display:none}
}
@media(prefers-reduced-motion:reduce){.bob,.pop{animation:none}}

<body>
<div id="app">
<canvas id="cv"></canvas>
<div id="hud" hidden><b id="sc">질문 1/9</b><div id="steps" aria-label="질문 진행"></div></div>
<div id="start" class="scr">
<p class="tag">햄토리 테스트</p>
<h1 class="ttl">같이 쥐놀 ㄱ?</h1>
<canvas id="hc" class="bob" aria-label="해바라기햄찌 대표 그림"></canvas>
<p class="intro">쥑쥑이들 데리고 공원 가서<br>나와 닮은 친구를 찾아봐요.</p>
<p class="intro">지금 바로 나와 잘 어울리는<br>햄토리들을 만나 봐!</p>
<button id="go" class="mainbtn" type="button">테스트 시작</button>
</div>
<div id="play" class="scr" hidden>
<div id="qtop"><p id="place" class="place"></p></div>
<div id="bubble" class="win"><h2 id="question"></h2></div>
<div id="answers"></div>
<div id="qfoot"><button id="back" type="button">이전 질문</button><p id="hint">마음이 가는 답을 골라요.</p></div>
</div>
<canvas id="cursor" hidden aria-hidden="true"></canvas>
<div id="judging" class="scr" hidden>
<p class="tag">공원 친구 알림이에요</p>
<h2>닮은 친구를 찾고 있어요.</h2>
<div class="load"><div id="loadfill"></div></div>
</div>
<div id="over" class="scr" hidden>
<p id="why">나와 닮은 공원 친구를 만났어요!</p>
<canvas id="resultArt" aria-label="나를 닮은 동물 그림"></canvas>
<b id="final"></b>
<p id="shareline"></p>
<div id="traits"></div>
<p id="description" class="win"></p>
<div id="matches">
<div class="match"><canvas id="goodArt"></canvas><p>잘 맞는 친구예요<b id="goodName"></b></p></div>
<div class="match"><canvas id="badArt"></canvas><p>속도가 다른 친구예요<b id="badName"></b></p></div>
</div>
<p class="lb-rec" id="record"></p>
<p id="sub"></p>
<div id="actions"><button id="again" class="mainbtn" type="button">다시 하기</button><button id="rank" class="mainbtn" type="button">결과 공유</button></div>
</div>
</div>
<script>
lb.ready(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),STEP=1/120;
const PAL=['#FFE3F1','#B9E8FF','#F2A33A','#8BD14A','#E83A5A','#343044','#fff8fb','#79bfd7','#4E9A4A','#C46A2B','#6E3B1F','#F7D23E','#DCE3F0','#8A8FA3','#E8642C','#a72e53'];
const KEYS=['gen/r1','gen/r2','gen/r3','gen/r4','gen/r5','gen/r6','gen/r7','gen/r8','gen/r9','gen/r10','gen/r11','gen/r12','gen/r13','gen/r14','gen/r15','gen/r16'];
const CLICK='sfx/interface-sounds/switch-001',WIN='sfx/digital-audio/zap-three-tone-up';
const DATA=[
['해바라기햄찌','#F2A33A',1,9,['간식 나눔','친구 챙김','소소한 행복'],'간식을 챙길 때 친구 몫도 꼭 남겨요. 함께 먹고 웃을 때 가장 편안해져요. 가끔은 내 몫부터 골라도 괜찮아요.','맛있는 건 친구와 나누고 싶어요.'],
['도토리다람이','#C46A2B',0,10,['알뜰 준비','빠른 손발','호기심'],'가방에 필요한 물건을 야무지게 챙겨요. 흥미로운 걸 보면 곧장 살펴보러 가요. 쉬는 시간도 일정에 넣어봐요.','궁금한 것도 챙길 것도 많아요.'],
['낮잠토끼','#E8E8F0',13,11,['포근한 쉼','조용한 배려','느린 호흡'],'그늘 아래 나란히 쉬는 시간을 좋아해요. 친구가 지치면 먼저 앉을 자리를 내줘요. 하고 싶은 일도 살짝 말해봐요.','옆에서 편히 쉴 수 있는 친구예요.'],
['수영오리','#F7D23E',8,7,['물가 취향','가벼운 웃음','함께 놀기'],'분수만 봐도 발걸음이 가벼워져요. 어색한 자리에서도 함께 놀 거리를 찾아요. 친구가 쉴 틈도 기다려줘요.','함께라면 작은 물놀이도 즐거워요.'],
['뒹굴판다','#2B2B2B',15,5,['편한 자리','느긋한 식사','든든한 동행'],'돗자리 한쪽에 편하게 자리를 잡아요. 서두르지 않고 곁을 지켜주는 친구예요. 궁금한 길에는 한 발 나서봐요.','돗자리에서 먹고 쉬면 충분해요.'],

 if(paused)return;clock+=dt;
 if(W&&H){acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}render()}
}
$('bubble').addEventListener('pointerdown',()=>{
 if(state!=='play'||locked)return;typeT=.5;typed=QUESTIONS[q][1].length;$('question').textContent=QUESTIONS[q][1];
});
$('back').addEventListener('pointerdown',()=>{
 if(state!=='play'||q===0)return;
 lb.audio.sfx(CLICK);lb.haptic('light');q--;answers.length=q+1;showQuestion();
});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.65)start()});
$('rank').addEventListener('click',()=>lb.share('같이 쥐놀 ㄱ? 나를 닮은 공원 친구는 '+DATA[outcome][0]+'예요. '+DATA[outcome][7]));
lb.onPause(p=>{paused=p;last=0});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
lb.assets.font('font/galmuri11').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/galmuri9').then(v=>document.documentElement.style.setProperty('--body-font',v));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
