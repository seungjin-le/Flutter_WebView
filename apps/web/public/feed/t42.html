<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>

<section id="start" class="screen">
 <div class="certificate">
  <div class="guild"><i class="crest" aria-hidden="true"></i><span>왕국 모험가 길드</span></div>
  <div class="sign"><h1>판타지 직업 테스트</h1></div>
  <div class="start-art">
   <div class="portrait">
    <img data-lb-art="gen/r11" alt="아직 밝혀지지 않은 모험가 직업">
    <div class="fallback" aria-hidden="true">?</div>
    <span class="mystery" aria-hidden="true">?</span>
    <span class="glint" aria-hidden="true">✦</span>
   </div>
  </div>
  <p>눈뜨니 낯선 왕국에 접속함.<br>길드에서 내 클래스 확인 퀘스트 뜸.</p>
  <button id="go" class="primary" type="button">모험 시작</button>
  <p class="footnote">성향으로 읽는 직업 빌드 · 재미로 확인함</p>
 </div>
</section>

<section id="quest" class="screen" hidden>
 <div id="qpaper" class="certificate">
  <div class="guild"><i class="crest" aria-hidden="true"></i><span>모험가 증명서 · 직업 감정 중</span></div>
  <div class="question-card">
   <div class="license-art"><canvas id="pc" width="180" height="190" aria-hidden="true"></canvas></div>
   <p id="chapter">길드 입장 퀘스트</p>
   <h2 id="qtext"></h2>
  </div>
  <p class="signature-label">행동 기록 · 아래 서명란에 선택함</p>
  <div id="options">
   <button class="opt" type="button"><span class="seal" aria-hidden="true">가</span><span class="answer"></span></button>
   <button class="opt" type="button"><span class="seal" aria-hidden="true">나</span><span class="answer"></span></button>
  </div>
 </div>
</section>

<div id="hud" hidden>
 <b id="sc">1/10</b>
 <div id="route" aria-hidden="true"></div>
</div>

<div id="judge" hidden>
 <div><div class="judge-seal">직업 각인</div><p>모험 기록 대조 중…<br>증명서 봉인 해제됨</p></div>
</div>

<section id="over" class="screen" hidden>
 <div id="rp" class="certificate">
  <p id="why"></p>
  <div class="hero-art">
   <img id="result-art" data-lb-art="gen/r1" alt="철벽 수호기사">
   <div id="result-fallback" class="fallback" aria-hidden="true">철</div>
   <span class="glint" aria-hidden="true">✦</span>
  </div>
  <h2 id="final"><span id="type"></span><span id="job"></span></h2>
  <p id="shareline"></p>
  <div id="chips"></div>
  <p id="description"><span id="desc1"></span><span id="desc2"></span></p>
  <p id="record" class="lb-rec"></p>
  <div id="matches">
   <div class="match">
    <div class="match-art"><img id="good-art" data-lb-art="gen/r14" alt=""><div id="good-fallback" class="fallback" aria-hidden="true"></div></div>
    <p>잘 맞는 파티<b id="good-name"></b></p>
   </div>
   <div class="match">
    <div class="match-art"><img id="bad-art" data-lb-art="gen/r11" alt=""><div id="bad-fallback" class="fallback" aria-hidden="true"></div></div>
    <p>안 맞는 파티<b id="bad-name"></b></p>
   </div>
  </div>
  <div class="actions">
   <button id="again" class="primary" type="button">다시 감정</button>
   <button id="rank" class="primary" type="button">직업 공유</button>
  </div>
 </div>
</section>
</div>

const QUESTIONS=[
 {axis:0,chapter:'길드 입장 퀘스트',q:'길드 환영회 이벤트 발생, 어디에 자리 잡음?',a:[['E',2,'동료들 사이에서 원정 얘기함'],['I',2,'조용한 자리에서 한 명과 얘기함']]},
 {axis:1,chapter:'성문 앞 탐색 퀘스트',q:'성문에서 수수께끼 지도 획득, 뭘 먼저 봄?',a:[['S',2,'표시된 길과 지형부터 확인함'],['N',2,'문양에 숨은 뜻부터 추리함']]},
 {axis:2,chapter:'파티 조율 퀘스트',q:'동료 둘이 보상 배분으로 충돌함, 판단 기준은?',a:[['T',2,'기여 기록을 기준으로 나눔'],['F',2,'각자 사정을 듣고 조율함']]},
 {axis:3,chapter:'원정 준비 퀘스트',q:'왕국 원정 의뢰 수락, 출발 전 뭘 챙김?',a:[['J',2,'경로와 야영 일정을 확정함'],['P',2,'필수 장비 챙기고 현장에서 정함']]},
 {axis:0,chapter:'마법 숲 휴식 퀘스트',q:'긴 전투 뒤 휴식 버프 획득, 어떻게 충전함?',a:[['E',1,'파티원과 전투 얘기를 나눔'],['I',1,'혼자 숲길을 걸으며 정리함']]},
 {axis:1,chapter:'고대 주문 연구 퀘스트',q:'고대 주문 습득 기회 발생, 뭘 더 파고듦?',a:[['S',1,'검증된 시전 순서부터 익힘'],['N',1,'주문을 바꿀 새 조합을 상상함']]},
 {axis:2,chapter:'견습 기사 성장 퀘스트',q:'견습 기사가 작전에 실패함, 어떤 피드백 줌?',a:[['T',3,'실패 원인과 수정점을 짚어줌'],['F',3,'속상한 마음부터 듣고 짚어줌']]},
 {axis:3,chapter:'축제 전날 돌발 퀘스트',q:'내일 출정인데 숨은 의뢰 뜸, 어떻게 함?',a:[['J',3,'기존 일정 안에 넣을지 따져봄'],['P',3,'끌리는 의뢰라면 경로를 바꿈']]},
 {axis:0,chapter:'새 동료 영입 퀘스트',q:'모르는 모험가들과 같은 파티가 됨, 첫 행동은?',a:[['E',2,'먼저 말을 걸어 역할을 맞춤'],['I',2,'대화를 살핀 뒤 내 역할을 말함']]},
 {axis:1,chapter:'왕국의 미래 퀘스트',q:'왕이 새 길드 구상을 물음, 어떤 제안 올림?',a:[['S',2,'지금 부족한 장비와 시설을 보완함'],['N',2,'아직 없는 의뢰 체계를 제안함']]}
];
const axes=[['E','I'],['S','N'],['T','F'],['J','P']];
const optionButtons=Array.from(document.querySelectorAll('.opt'));
let W=0,H=0,state='start',paused=false,last=0,clock=0,idx=0;
let votes={},lastPick=['I','S','T','J'],answers=[],locked=false,wait=0,endT=0,overAt=0;
let currentResult=RESULTS[0],reported=false,hs='',progress=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

lb.assets.font('font/hahmlet').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/gowunbatang').then(v=>document.documentElement.style.setProperty('--body-font',v));

for(let i=0;i<QUESTIONS.length;i++){
 const point=document.createElement('i');$('route').appendChild(point);
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);
 ctx.setTransform(d,0,0,d,0,0);
 render();
}
function hud(){
 const text=(idx+1)+'/'+QUESTIONS.length;
 if(text!==hs){$('sc').textContent=text;hs=text;}
 Array.from($('route').children).forEach((el,i)=>{
  el.className=i<idx?'done':i===idx?'current':'';
 });
}
function drawHero(c,x,y,h){
 const s=h/150;
 c.save();c.translate(x,y);c.scale(s,s);
 c.lineWidth=2.5;c.lineJoin='round';c.strokeStyle=PAL[0];
 c.fillStyle='#a88e62';c.beginPath();c.ellipse(0,0,43,8,0,0,Math.PI*2);c.fill();
 c.fillStyle=PAL[4];
 c.beginPath();c.moveTo(-18,-87);c.lineTo(-44,-9);c.quadraticCurveTo(0,8,44,-9);c.lineTo(18,-87);c.closePath();c.fill();c.stroke();
 c.fillStyle='#71608b';c.beginPath();c.moveTo(-14,-83);c.lineTo(-28,-15);c.lineTo(0,-4);c.lineTo(16,-82);c.fill();
 c.fillStyle=PAL[3];c.fillRect(-19,-67,38,49);c.strokeRect(-19,-67,38,49);
 c.fillStyle='#b98a32';c.fillRect(5,-65,12,46);
 c.fillStyle='#e2cfa4';c.fillRect(-12,-61,23,25);
 c.fillStyle=PAL[0];c.fillRect(-21,-27,42,7);
 c.fillStyle=PAL[3];c.fillRect(-5,-29,10,11);c.strokeRect(-5,-29,10,11);
 c.fillStyle='#eed6aa';c.beginPath();c.ellipse(0,-103,24,28,0,0,Math.PI*2);c.fill();c.stroke();
 c.fillStyle='#81522e';c.beginPath();c.moveTo(-25,-103);c.lineTo(-24,-122);c.quadraticCurveTo(0,-146,25,-120);c.lineTo(22,-100);c.lineTo(11,-120);c.lineTo(-4,-110);c.lineTo(-13,-117);c.closePath();c.fill();c.stroke();
 c.fillStyle=PAL[0];c.fillRect(-12,-103,4,5);c.fillRect(9,-103,4,5);
 c.beginPath();c.moveTo(-5,-91);c.quadraticCurveTo(0,-87,6,-92);c.stroke();
 c.fillStyle=PAL[2];c.beginPath();c.moveTo(-26,-80);c.lineTo(0,-68);c.lineTo(27,-81);c.lineTo(13,-63);c.lineTo(0,-59);c.lineTo(-15,-65);c.closePath();c.fill();c.stroke();
 c.fillStyle='#eed6aa';c.beginPath();c.ellipse(-29,-42,8,15,-.25,0,Math.PI*2);c.fill();c.stroke();
 c.beginPath();c.ellipse(28,-42,8,15,.25,0,Math.PI*2);c.fill();c.stroke();
 c.fillStyle=PAL[0];c.fillRect(-19,-16,13,18);c.fillRect(7,-16,13,18);
 c.fillStyle='#fff7df';c.fillRect(-14,-60,3,15);c.fillRect(-17,-114,7,3);
 c.restore();
}
function drawLicense(){
 pen.clearRect(0,0,180,190);
 pen.fillStyle=PAL[0];pen.fillRect(30,10,120,165);
 pen.fillStyle='#f1dfb9';pen.fillRect(34,14,112,157);
 pen.strokeStyle=PAL[3];pen.lineWidth=2;pen.strokeRect(39,19,102,147);
 pen.fillStyle=PAL[4];pen.fillRect(46,28,88,115);
 pen.save();pen.globalAlpha=.2;drawHero(pen,90,140,101);pen.restore();
 pen.save();
 pen.beginPath();pen.rect(46,143-115*progress,88,115*progress);pen.clip();
 drawHero(pen,90,140,101);
 pen.restore();
 pen.strokeStyle=PAL[3];pen.lineWidth=2;pen.strokeRect(46,28,88,115);
 pen.fillStyle='#9d762b';pen.fillRect(49,151,49,2);pen.fillRect(49,157,62,2);
 pen.fillStyle=PAL[2];pen.beginPath();pen.arc(128,159,13,0,Math.PI*2);pen.fill();
 pen.strokeStyle=PAL[3];pen.lineWidth=1;pen.beginPath();pen.arc(128,159,9,0,Math.PI*2);pen.stroke();
 pen.beginPath();pen.moveTo(128,153);pen.lineTo(132,159);pen.lineTo(128,165);pen.lineTo(124,159);pen.closePath();pen.stroke();
}
function reset(){
 idx=0;votes={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
 lastPick=['I','S','T','J'];answers=[];locked=false;wait=0;endT=0;
 reported=false;hs='';progress=0;
 $('judge').hidden=true;
 showQuestion();
}
function start(){
 lb.audio.unlock();lb.audio.sfx(AUDIO.click);
 reset();state='play';
 $('start').hidden=true;$('over').hidden=true;
 $('quest').hidden=false;$('hud').hidden=false;
 lb.audio.music('music/oga-chiptunes/level-2',{loop:true,volume:.28});
}
function showQuestion(){
 const q=QUESTIONS[idx];
 $('chapter').textContent=q.chapter;$('qtext').textContent=q.q;
 optionButtons.forEach((button,i)=>{
  button.querySelector('.answer').textContent=q.a[i][2];
  button.disabled=false;button.classList.remove('on');
 });
 locked=false;hud();drawLicense();
}
function tapFeedback(button){
 lb.audio.sfx(AUDIO.tap);lb.haptic('light');
 const box=button.getBoundingClientRect();
 lb.fx.ripple(box.left+26,box.top+box.height/2,{colors:[PAL[3],PAL[1]]});
 $('qpaper').classList.remove('turn');void $('qpaper').offsetWidth;$('qpaper').classList.add('turn');
}
function choose(choice){
 if(state!=='play'||locked||paused)return;
 locked=true;
 const q=QUESTIONS[idx],a=q.a[choice];
 votes[a[0]]+=a[1];lastPick[q.axis]=a[0];answers.push(choice);
 optionButtons.forEach(b=>b.disabled=true);
 optionButtons[choice].classList.add('on');
 tapFeedback(optionButtons[choice]);
 progress=answers.length/QUESTIONS.length;drawLicense();
 wait=.23;
}
function calculate(){
 const code=axes.map((pair,i)=>{
  const a=votes[pair[0]],b=votes[pair[1]];
  return a===b?lastPick[i]:a>b?pair[0]:pair[1];
 }).join('');
 currentResult=RESULTS.find(r=>r[0]===code);
}
function die(x,y,why,win){
 if(state!=='play')return;
 calculate();state='dying';endT=.65;
 $('why').textContent=why;$('judge').hidden=false;
 lb.audio.stopMusic();lb.audio.sfx('magic');lb.audio.sfx(AUDIO.success);
 lb.haptic('success');
 lb.fx.sparkle(x,y);lb.fx.flash('#e3b23c33');
}
function setArt(imgId,fallbackId,result){
 const number=RESULTS.indexOf(result)+1,img=$(imgId);
 img.setAttribute('data-lb-art','gen/r'+number);
 img.removeAttribute('data-lb-art-missing');
 img.alt=result[0]+' · '+result[1];
 $(fallbackId).textContent=result[1].slice(0,1);
}
function fillMatch(prefix,code){
 const r=RESULTS.find(item=>item[0]===code);
 setArt(prefix+'-art',prefix+'-fallback',r);
 $(prefix+'-name').textContent=r[0]+' · '+r[1];
}
function result(){
 if(state!=='dying')return;
 state='over';overAt=clock;
 const r=currentResult;
 $('rp').style.setProperty('--c',RARITY[r[2]]);
 $('type').textContent=r[0]+' · ';
 $('job').textContent=r[1];
 $('shareline').textContent='내 클래스 '+r[1]+' 뜸, 다들 뭐 나옴?';
 $('desc1').textContent=r[5];$('desc2').textContent=r[6];
 $('chips').replaceChildren();
 r[7].forEach(text=>{const chip=document.createElement('span');chip.textContent=text;$('chips').appendChild(chip);});
 $('record').textContent='길드 등록 완료 · '+r[8];
 setArt('result-art','result-fallback',r);
 fillMatch('good',r[3]);fillMatch('bad',r[4]);
 $('quest').hidden=true;$('hud').hidden=true;$('judge').hidden=true;$('over').hidden=false;
 if(!reported){reported=true;lb.done(r[0]+' · '+r[1]);}
 lb.fx.confetti();
}
function update(dt){
 if(state==='play'&&locked){
  wait-=dt;
  if(wait<=0){
   if(idx===QUESTIONS.length-1)die(W/2,H/2,'그대의 직업이 길드에 등록되었다',true);
   else{idx++;showQuestion();}
  }
 }else if(state==='dying'){
  endT-=dt;if(endT<=0)result();
 }
}
function render(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 const safe=lb.safe;
 ctx.strokeStyle='#e3b23c33';ctx.lineWidth=1;
 const m=7;
 ctx.beginPath();
 ctx.moveTo(m,Math.min(H-8,38+safe.top));ctx.lineTo(m,Math.max(12,H-38-safe.bottom));
 ctx.moveTo(W-m,Math.min(H-8,38+safe.top));ctx.lineTo(W-m,Math.max(12,H-38-safe.bottom));ctx.stroke();
 for(let i=0;i<7;i++){
  const x=i%2?W-8:8;
  const y=H*(.12+i*.12);
  const alpha=reduce?.32:.25+.2*Math.sin(clock*.9+i*1.7);
  ctx.globalAlpha=Math.max(0,alpha);ctx.fillStyle=PAL[3];
  ctx.beginPath();ctx.moveTo(x,y-4);ctx.lineTo(x+2,y);ctx.lineTo(x,y+4);ctx.lineTo(x-2,y);ctx.closePath();ctx.fill();
 }
 ctx.globalAlpha=1;
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.08):0;last=now;
 if(paused)return;
 clock+=dt;update(dt);render();
}
optionButtons.forEach((button,i)=>button.addEventListener('click',()=>choose(i)));
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.7)start();});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 lb.share('내 직업 '+currentResult[0]+' · '+currentResult[1]+' 뜸. 다들 무슨 직업 나옴?');
});
lb.onPause(value=>{paused=value;last=0;});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();drawLicense();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
