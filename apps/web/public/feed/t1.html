<head>


<title>텔레파시 짝꿍 고사</title>
<style>
:root{--bg:#315d50;--paper:#fffdf3;--ink:#25385c;--act:#263e70;--red:#c53832;--hl:#f4df63;--c:#2f6fd6}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--body-font,system-ui,sans-serif);color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#ffffff0b 1px,transparent 1px) 0 0/17px 17px,linear-gradient(90deg,#ffffff0b 1px,transparent 1px) 0 0/17px 17px,var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr,#play{position:absolute;inset:0;padding:calc(10px + var(--lb-safe-top,0px)) calc(14px + var(--lb-safe-right,0px)) calc(10px + var(--lb-safe-bottom,0px)) calc(14px + var(--lb-safe-left,0px));display:flex;min-height:0;overflow:hidden}
.sheet{width:100%;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:9px;padding:16px;background:var(--paper);border:2px solid var(--ink);border-radius:5px;box-shadow:4px 5px 0 #192d3155;background-image:repeating-linear-gradient(4deg,transparent 0 5px,#25385c03 5px 6px)}
h1,h2,p{margin:0;word-break:keep-all}
h1,h2,button,#final{font-family:var(--title-font,system-ui,sans-serif);font-weight:900}
h1{font-size:clamp(25px,5vh,34px);letter-spacing:-.04em;line-height:1.13}
p{font-size:clamp(14px,2.5vh,16px);line-height:1.35}
small,.label{font-size:12px;font-weight:700;letter-spacing:.06em}
.headline{border-bottom:4px double var(--ink);padding-bottom:7px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;font-weight:800}
.document{font-size:clamp(18px,3.5vh,24px);letter-spacing:.35em;text-align:center;border-bottom:4px double var(--ink);padding-bottom:7px}
.hl{background:linear-gradient(transparent 54%,var(--hl) 54% 94%,transparent 94%);padding:0 3px}
.art{position:relative;flex:1;min-height:40px;overflow:hidden;border:2px solid var(--ink);border-radius:3px;background:repeating-linear-gradient(transparent 0 23px,#bfe3f255 23px 24px),#fffdf7}
.art:before{content:"";position:absolute;left:18px;top:0;bottom:0;border-left:1px solid #c5383240}
.art canvas{width:100%;height:100%;display:block}
.tape{position:absolute;top:0;right:18px;background:#f4df6399;width:52px;height:13px;transform:rotate(6deg)}
#start .intro-title{font-size:12px;color:var(--red);font-weight:800}
#start .intro{background:#f4df6360;padding:5px 8px;border-left:4px solid var(--hl)}
.meta{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink)}
.meta span{padding:5px 7px;font-size:13px}
.meta span:nth-child(odd){border-right:1px solid}
.meta span:nth-child(-n+2){border-bottom:1px solid}
.rules{border-top:2px dashed #25385c66;padding-top:7px}
.rules p{font-size:12px;line-height:1.4}
button{border:2px solid var(--ink);color:var(--ink);border-radius:5px;cursor:pointer;min-height:64px;font-size:clamp(16px,2.8vh,19px);padding:7px 12px;touch-action:manipulation;background:var(--paper);box-shadow:2px 3px 0 var(--ink);flex-shrink:0}
button:active{box-shadow:none;background:#f4df6360}
#go{background:var(--act);color:white;box-shadow:0 3px 0 #15243c;width:100%}
#go:active{background:#39558b}
#play .sheet{gap:8px}
#q{font-size:clamp(18px,3.4vh,23px);line-height:1.3;font-weight:850;min-height:2.5em}
.q-art{position:relative;flex:1;min-height:35px;border:2px solid #25385c88;background:#bfe3f21c;border-radius:3px}
.q-art:before{content:"함께 있는 장면이에요";position:absolute;top:-9px;left:11px;background:var(--paper);padding:0 6px;font-size:12px}
#qc{display:block;width:100%;height:100%}
#answers{display:grid;grid-template-columns:1fr;gap:7px}
.choice{position:relative;display:flex;align-items:center;text-align:left;gap:9px;min-height:48px;padding:6px 12px;font-size:clamp(16px,2.8vh,18px);font-weight:700;box-shadow:2px 2px 0 #25385c55;border-width:1.5px}
.choice .num{display:flex;align-items:center;justify-content:center;flex:0 0 24px;height:25px;border:1px solid;border-radius:50%;font-size:14px}
.choice.selected{background:#f4df634a;color:var(--ink)}
.choice.selected:after{content:"";position:absolute;inset:1px 6px;border:3px solid var(--red);border-radius:46% 53% 44% 51%;transform:rotate(-2deg);pointer-events:none;animation:circle .18s ease-out}
@keyframes circle{from{opacity:.1;transform:scale(.85) rotate(-5deg)}to{opacity:1;transform:scale(1) rotate(-2deg)}}
#hud{display:flex;gap:7px;align-items:center;justify-content:space-between;border-top:3px double var(--ink);padding-top:8px}
#sc{font-size:13px;flex-shrink:0}
#omr{display:flex;gap:4px;align-items:center}
#omr i{display:block;width:11px;height:17px;border:1px solid var(--red);border-radius:45%;position:relative}
#omr .filled{background:var(--ink);border-color:var(--ink)}
#omr .now{background:var(--hl);outline:2px solid #f4df6366}
#back{min-width:64px;min-height:64px;padding:3px;font-size:13px;box-shadow:none;border-style:dashed}
#back:disabled{opacity:.3}
#info{font-size:12px;color:var(--red);font-weight:800;text-align:center;min-height:14px}
#over .sheet{position:relative;gap:7px;animation:unfold .45s ease-out}
@keyframes unfold{from{opacity:.2;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
#why{font-size:12px;font-weight:800}
#resultArt{border-color:var(--c);min-height:44px}

<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="start" class="scr">
<div class="sheet">
<p class="intro-title">크레이지 소울메이트 텔레파시 테스트</p>
<div class="document">수험표</div>
<h1>텔레파시 짝꿍 고사</h1>
<div class="art"><canvas id="hc" aria-label="각기 다른 세 학생이 함께 있는 크레용 그림"></canvas><i class="tape" aria-hidden="true"></i></div>
<div class="meta"><span>수험번호 · 마음반이에요</span><span>성명 · 나예요</span><span>문항 · 열 문제예요</span><span>준비물 · 상상력이에요</span></div>
<p class="intro">1교시 텔레파시 고사 시작! 짝꿍과 마음이 통할까?</p>
<div class="rules"><p>하나. 정답보다 내 마음을 골라요.<br>둘. 짝꿍과 함께인 순간을 떠올려요.<br>셋. 실제 마음을 읽는 검사는 아니에요.</p></div>
<button id="go" type="button">시험 시작</button>
</div>
</div>

<div id="answers"></div>
<div id="info" aria-live="polite">마음이 향하는 답을 골라요.</div>
<div id="hud" hidden>
<b id="sc"></b><div id="omr" aria-label="열 문제 답안 현황"></div>
<button id="back" type="button">앞 문항</button>
</div>
</div>
</div>
<div id="over" class="scr" hidden>
<div class="sheet">
<div class="headline"><p id="why">짝꿍 고사 채점을 마쳤어요.</p><span>마음반 성적표예요</span></div>
<div class="result-heading"><span id="typeLabel" class="label"></span><span id="grade"></span></div>

<h2 id="final"></h2>
<p id="shareline"></p>
<div id="traits"></div>
<p id="description"></p>
<p id="growth"></p>

function fitCanvas(el){
 const r=el.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 if(!r.width||!r.height)return null;
 const w=Math.round(r.width*d),h=Math.round(r.height*d);
 if(el.width!==w||el.height!==h){el.width=w;el.height=h;}
 const c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);
 return {c,w:r.width,h:r.height};
}

function line(c,x1,y1,x2,y2,color,width=3){

 c.globalAlpha=.25;c.beginPath();c.moveTo(x1+1,y1-1);c.lineTo(x2-1,y2+1);c.stroke();c.globalAlpha=1;
}
function roughRect(c,x,y,w,h,color){

 c.save();c.globalAlpha=.18;
 for(let a=3;a<w;a+=7)line(c,x+a,y+2,x+a-5,y+h+2,'#ffffff',2);
 c.restore();
}
function ellipse(c,x,y,rx,ry,color,stroke=INK){
 c.beginPath();c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);
 c.fillStyle=color;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=2.4;c.stroke();}
}

 else{ellipse(c,-10,-103,2,3,INK,null);ellipse(c,10,-103,2,3,INK,null);}

function drawBackground(c,w,h,scene){

  }
 }else{

  line(c,w*.12,h*.24,w*.32,h*.24,'#f8f5dc',2);

  roughRect(c,w*.68,h*.1,w*.25,h*.39,'#bfe3f2');

  line(c,w*.69,h*.3,w*.92,h*.3,INK,2);

  for(let i=0;i<3;i++)line(c,w*.53,h*(.2+i*.05),w*.6,h*(.2+i*.05),'#d6a699',1);
  if(scene==='rain')for(let i=0;i<5;i++)line(c,w*(.7+i*.045),h*.14,w*(.69+i*.045),h*.24,'#6193bc',1);
 }
 const hh=Math.min(h*.74,w*.37);
 drawHero(c,w*.38,h*.95,hh,0,face>0?1:0);
 drawHero(c,w*.63,h*.95,hh*.96,1,face>0?1:0);

    ellipse(c,w*(x+.09),h*.75,w*.023,h*.025,'#e7a15d');
   }
  }
 }
 c.save();c.globalAlpha=.15;
 for(let i=0;i<100;i++){

  line(c,x,y,x+2,y+1,'#fffdf3',1);
 }c.restore();
}
function drawAsset(c,key,x,y,w,h){
 lb.assets.draw(c,key,x,y,w,h);
}
function render(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=.2;
 for(let i=0;i<12;i++){
  const x=(i*73+27)%W,y=(i*93+30)%H+Math.sin(clock*.6+i)*3;
  line(ctx,x-4,y,x+4,y, '#fff4d6',2);line(ctx,x,y-4,x,y+4,'#fff4d6',2);
 }ctx.restore();
 if(state==='start'){
  const p=fitCanvas($('hc'));if(p){
   p.c.clearRect(0,0,p.w,p.h);
   const a=Math.min(p.h*.93,p.w*.5);
   drawAsset(p.c,'gen/r4',p.w*.22,p.h*.53,p.w*.44,a);
   drawAsset(p.c,'gen/r1',p.w*.51,p.h*.5,p.w*.48,a);
   drawAsset(p.c,'gen/r2',p.w*.8,p.h*.54,p.w*.45,a);
  }
 }else if(state==='play'||state==='dying'){
  const p=fitCanvas($('qc'));if(p)drawBackground(p.c,p.w,p.h,QUESTIONS[index][1]);
 }else if(state==='over'){

   p.c.clearRect(0,0,p.w,p.h);
   const float=window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:Math.sin(clock*1.2)*1.5;
   drawAsset(p.c,'gen/r'+(resultIndex+1),p.w*.5,p.h*.5+float,p.w*.92,p.h*.96);

 }
}

 points=Array(16).fill(0);
 answers.forEach((v,n)=>{
  if(v===undefined)return;
  const a=QUESTIONS[n][2][v];
  points[a[1]]+=3;points[a[2]]+=2;
 });
}

  const n=document.createElement('span');n.className='num';n.textContent=String(k+1);
  const s=document.createElement('span');s.textContent=a[0];b.append(n,s);
  b.addEventListener('click',()=>choose(k,b));$('answers').appendChild(b);
 });
 $('omr').replaceChildren();
 for(let n=0;n<10;n++){
  const i=document.createElement('i');
  i.className=n===index?'now':answers[n]!==undefined?'filled':'';
  $('omr').appendChild(i);
 }
 hs=hi='';hud();
}
function choose(k,button){
 if(state!=='play'||lock>0||paused)return;
 answers[index]=k;recalculate();lock=.36;face=.8;
 button.classList.add('selected');
 for(const el of $('answers').children)el.setAttribute('aria-disabled','true');
 lb.audio.sfx(SFX.tap);lb.haptic('light');hud();
}
function reset(){
 index=0;answers=[];points=Array(16).fill(0);lock=0;ending=0;face=0;
 resultIndex=0;resultValue=0;reported=false;showStamp=false;hs=hi='';
 $('over').hidden=true;showQuestion();
}
function start(){
 reset();state='play';$('start').hidden=true;$('play').hidden=false;$('hud').hidden=false;
 lb.audio.unlock();hud();render();
}
function die(x,y,why,win){
 if(state!=='play')return;
 state='dying';ending=.52;$('why').textContent=why;
 lb.audio.sfx(SFX.win);lb.haptic('success');
}
function result(){
 recalculate();
 const max=Math.max(...points),ties=[];
 for(let n=0;n<16;n++)if(points[n]===max)ties.push(n);
 let signature=19;
 answers.forEach((v,n)=>{signature=(signature*31+(v+1)*(n+3))%104729;});
 resultIndex=ties[signature%ties.length];
 const r=TYPES[resultIndex];
 resultValue=Math.min(99,78+Math.round(max/50*21));
 $('over').style.setProperty('--c',r[1]);
 $('final').textContent=r[0];
 $('typeLabel').textContent=(resultIndex+1)+'유형이에요';
 $('grade').textContent=resultValue+'점 · 통했어요';
 $('shareline').textContent=r[4];
 $('traits').replaceChildren();
 r[5].split('|').forEach(v=>{const e=document.createElement('span');e.textContent=v;$('traits').appendChild(e);});
 $('description').textContent=r[6];$('growth').textContent=r[7];
 $('match').textContent=TYPES[r[2]][0];$('clash').textContent=TYPES[r[3]][0];
 $('record').textContent='소울메이트 지수 '+resultValue+' · 재미로 보는 성향이에요';
 state='over';overAt=clock;$('play').hidden=true;$('hud').hidden=true;$('over').hidden=false;
 if(!reported){reported=true;lb.done(r[0]);}
 lb.fx.confetti();render();
}
function update(dt){
 face=Math.max(0,face-dt);
 if(state==='play'&&lock>0){
  lock=Math.max(0,lock-dt);
  if(lock===0){
   if(index===9){die(W/2,H/2,'열 문제의 마음을 모았어요.',true);}
   else{index++;showQuestion();}
  }
 }
 if(state==='dying'){
  ending-=dt;
  if(ending<=0)result();
 }
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.08):0;last=now;
 if(paused)return;
 clock+=dt;
 update(dt);render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.7)start();});
$('rank').addEventListener('click',()=>{
 const r=TYPES[resultIndex];
 lb.share('텔레파시 짝꿍 고사\n나는 '+r[0]+' 유형이에요!\n소울메이트 지수 '+resultValue+' · 재미로 보는 성향이에요.\n'+r[4]);
});
$('back').addEventListener('click',()=>{
 if(state!=='play'||index===0||lock>0)return;
 index--;answers.length=index;recalculate();face=0;showQuestion();
});
lb.onPause(p=>{paused=p;last=0;});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
