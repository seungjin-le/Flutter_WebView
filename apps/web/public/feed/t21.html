<head>


<title>아침형 저녁형 테스트</title>
<style>
:root{--bg:#bfe3f7;--paper:#fff;--ink:#403351;--act:#f5c84a;--c:#d7f1e8;--title-font:ui-rounded,system-ui,sans-serif;--body-font:ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden;font-family:var(--body-font)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;flex-direction:column;text-align:center;padding:calc(18px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(18px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));gap:12px}
h1,h2,p{margin:0;word-break:keep-all}
h1,h2,button,#final{font-family:var(--title-font);font-weight:400}
.ttl{color:#fff;text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),0 5px #e9b6cf;letter-spacing:-.02em}
h1{font-size:clamp(30px,5.2vh,36px);line-height:1.24}
.cloud{background:var(--paper);border:3px solid var(--ink);border-radius:27px;box-shadow:0 4px 0 var(--ink)}
button{color:var(--ink);font-size:18px;border:3px solid var(--ink);border-radius:25px;background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;min-height:64px;touch-action:manipulation;padding:9px 20px}
button:active{background:#fff0c8;box-shadow:0 1px 0 var(--ink)}
#go{width:min(100%,260px);background:var(--act);flex-shrink:0}
#start{padding-top:calc(60px + var(--lb-safe-top,0px));justify-content:center}
#start .intro{font-size:clamp(15px,2.6vh,18px);line-height:1.45;max-width:310px}
.kicker{font-size:13px;letter-spacing:.08em}
#hc{width:min(100%,240px);height:100%;max-height:300px;min-height:30px;flex:1;object-fit:contain}
#start .badge{font-size:13px;padding:7px 14px;border-radius:18px;background:#fff8e8}
#hud{position:absolute;top:var(--lb-safe-top,0px);left:var(--lb-safe-left,0px);right:var(--lb-safe-right,0px);z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:10px;pointer-events:none}
#sc{background:#fff;border:2px solid var(--ink);border-radius:13px;padding:7px 11px;font-size:16px;white-space:nowrap}
#info{font-size:13px}
#question{padding-top:calc(68px + var(--lb-safe-top,0px));gap:12px}
.calendar{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;width:100%;max-width:390px;flex-shrink:0}
.day{height:24px;background:#fff;border:2px solid var(--ink);border-radius:5px;position:relative;display:grid;place-items:center}
.day:before{content:"";position:absolute;top:-3px;left:23%;right:23%;height:4px;background:var(--ink);border-radius:2px}
.day svg{width:14px;height:14px;fill:#e7eef4;stroke:#8a8299;stroke-width:1.6}
.day.done{background:#fff3c9}
.day.done svg{fill:#f5c84a;stroke:#6d543b}
.day.current{box-shadow:0 3px 0 #f29a4a}
#scene{width:100%;max-width:410px;flex:1;min-height:45px;max-height:245px}
#talk{position:relative;width:100%;max-width:410px;padding:15px 17px;flex-shrink:0}
#talk:before{content:"";position:absolute;left:27px;top:-10px;width:15px;height:15px;background:#fff;border-top:3px solid var(--ink);border-left:3px solid var(--ink);transform:rotate(45deg)}
#place{display:block;color:#675575;font-size:13px;margin-bottom:6px}
#qtext{font-size:clamp(20px,3.5vh,24px);line-height:1.35;font-weight:500}
#choices{display:flex;flex-direction:column;width:100%;max-width:410px;gap:11px;flex-shrink:0}
.opt{width:100%;display:flex;gap:12px;align-items:center;text-align:left;font-family:var(--body-font);font-size:clamp(16px,2.8vh,18px);line-height:1.3;min-height:64px;padding:10px 14px}
.opt i{font-style:normal;display:grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:#e7f3fa;font-size:16px}
.opt.selected{background:#fff0bd;border-color:#77533d}
.opt.selected i{background:#f5c84a}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
#notice{height:20px;flex-shrink:0;font-size:13px;color:#594965}
#over{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(40px,1fr) auto auto auto auto auto auto;align-content:center;gap:9px 12px}
#over>*{grid-column:1/-1;min-width:0}
#over #hc{justify-self:center;width:100%;height:100%;max-height:260px;max-width:280px;min-height:35px}
#why{font-size:14px}
#final{font-size:clamp(29px,5.5vh,39px);line-height:1.15;word-break:keep-all}
#tagline{font-size:clamp(14px,2.6vh,17px);line-height:1.3}
#description{font-size:clamp(13px,2.35vh,16px);line-height:1.4;max-width:410px;justify-self:center;background:#ffffffd9;padding:10px 14px;border-radius:20px}
#traits{font-size:13px;line-height:1.5}
#friends{font-size:13px;line-height:1.5;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#friends span{padding:5px 11px;background:#fff;border:2px solid var(--ink);border-radius:17px}
.lb-rec{font-size:12px}
#again,#rank{grid-column:auto;font-size:17px;width:100%;min-height:64px;padding:8px 5px}
#again{background:var(--act)}
#rank{background:#fff}
.pop{animation:pop .18s ease-out}
@keyframes pop{50%{transform:scale(1.05)}}
@media(max-height:560px){
.scr{gap:8px;padding-bottom:calc(10px + var(--lb-safe-bottom,0px))}
#start{padding-top:calc(22px + var(--lb-safe-top,0px))}
#question{gap:8px;padding-top:calc(58px + var(--lb-safe-top,0px))}
#hud{padding-top:7px;padding-bottom:7px}
#talk{padding:10px 13px}
#place{margin-bottom:3px}
#choices{gap:9px}
.opt{min-height:54px;padding:7px 12px}
#notice{height:16px;font-size:12px}
#over{gap:6px 10px}
#description{padding:6px 10px;font-size:13px}
#friends{gap:5px;font-size:12px}
#friends span{padding:3px 7px}
#why{font-size:12px}
}
@media(max-height:380px){
#start{padding-top:calc(12px + var(--lb-safe-top,0px));gap:7px}
#start h1{font-size:27px}
#start .intro{font-size:13px;line-height:1.25}
#start .badge{display:none}
#question{gap:6px;padding-top:calc(46px + var(--lb-safe-top,0px))}
#scene{min-height:8px;max-height:25px}
.calendar{gap:4px}
.day{height:15px}
.day svg{width:10px;height:10px}
#talk{padding:7px 10px}
#place{display:none}
#qtext{font-size:18px;line-height:1.2}
#choices{gap:7px}
.opt{min-height:49px;font-size:16px;padding:5px 10px}
#notice{display:none}
#over{gap:4px 8px;padding-top:calc(7px + var(--lb-safe-top,0px));padding-bottom:calc(7px + var(--lb-safe-bottom,0px));grid-template-rows:auto minmax(18px,1fr) auto auto auto auto auto auto}
#final{font-size:27px}
#description{font-size:12px;line-height:1.2;padding:4px 8px}
#tagline,#traits,#friends{font-size:12px;line-height:1.2}
#friends span{border-width:1px;padding:2px 6px}
#why,.lb-rec{font-size:12px}
#again,#rank{min-height:64px}
}

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="hud" hidden><b id="sc">하루 1/10</b><span id="info">구름 마을 산책</span></div>
<div id="start" class="scr">
<p class="kicker">구름 마을에서 만나는 나</p>
<h1 class="ttl">아침형 저녁형<br>테스트</h1>
<canvas id="hc" width="480" height="480" aria-label="동물 후드 꼬마들이 반겨요"></canvas>
<p class="intro">해가 뜰 때, 달이 뜰 때.<br>나는 언제 가장 나다울까?</p>
<span class="badge">열 가지 일상에서 골라봐</span>
<button id="go" type="button">하루 시작</button>
</div>
<div id="question" class="scr" hidden>
<div id="calendar" class="calendar" aria-label="열 장면의 진행 상황"></div>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="talk" class="cloud"><span id="place"></span><h2 id="qtext"></h2></div>
<div id="choices"></div>
<p id="notice" aria-live="polite">내 일상에 가까운 쪽을 골라봐요</p>
</div>
<div id="over" class="scr" hidden>
<p id="why"></p>
<b id="final" class="ttl"></b>
<p id="tagline"></p>
<p id="description"></p>
<p id="traits"></p>
<div id="friends"></div>
<p class="lb-rec" id="record"></p>
<button id="again" type="button">다시 산책</button>
<button id="rank" type="button">결과 공유</button>
</div>
</div>
<script>
lb.ready(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),hc=$('hc'),heroCtx=hc.getContext('2d'),scene=$('scene'),sx=scene.getContext('2d');
const PAL=['#bfe3f7','#fbe9c6','#f29a4a','#f5c84a','#3a4a8a'],INK='#403351',STEP=1/120;
const DATA=[
{name:'새벽 종달새',color:'#f5c84a',tint:'#fff0b8',line:'햇살보다 한발 먼저 하루를 시작해',desc:'조용한 아침이면 집중이 잘돼. 차근차근 준비하니 하루가 한결 여유로워짐. 가끔은 늦잠도 괜찮아.',traits:['산뜻한 기상','미리 준비','아침 집중'],good:1,bad:4},
{name:'햇살 다람쥐',color:'#f29a4a',tint:'#ffe1bd',line:'밝은 낮에 부지런히 행복을 모아',desc:'햇살을 받으면 몸도 마음도 활발해져. 일상을 든든히 꾸리고 작은 즐거움도 잘 챙기는 편. 바빠도 쉬는 건 잊지 마.',traits:['든든한 일상','낮의 활력','알찬 준비'],good:0,bad:5},
{name:'낮잠 고양이',color:'#a7b0c0',tint:'#e7eaf2',line:'포근하게 쉬어야 내 빛도 살아나',desc:'몸이 보내는 신호를 잘 알아차려. 편하게 쉬면서 기운을 되찾는 데도 능숙함. 쉬는 시간은 좀 느슨하게 정해봐.',traits:['포근한 쉼','몸의 신호','느긋한 충전'],good:3,bad:0},
{name:'노을 여우',color:'#e0603a',tint:'#ffdfcf',line:'해가 기울면 내 마음도 반짝여',desc:'천천히 기운이 올라 오후에 힘을 발휘해. 여유롭게 하루의 재미를 찾는 편이야. 잠들기 전엔 속도를 조금 낮춰봐.',traits:['오후의 몰입','여유로운 시선','은근한 활력'],good:2,bad:1},

let W=0,H=0,state='start',paused=false,last=0,acc=0,clock=0,t=0,qi=0,totals=[],evidence=[],answers=[],lock=0,pending=false,endT=0,resultIndex=0,overAt=0,hs='',hi='',paintW=0,paintH=0;
const reduced=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
lb.assets.font('font/cafe24ssurround').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--body-font',v));
for(let i=0;i<10;i++){
 const el=document.createElement('span');
 el.className='day';
 el.setAttribute('aria-hidden','true');
 el.innerHTML='<svg viewBox="0 0 24 24"><path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>';

function bump(el){if(reduced)return;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function fitCanvas(c,cx,w,h){
 const d=Math.min(devicePixelRatio||1,2);
 const pw=Math.max(1,Math.round(w*d)),ph=Math.max(1,Math.round(h*d));
 if(c.width!==pw||c.height!==ph){c.width=pw;c.height=ph}
 cx.setTransform(d,0,0,d,0,0);
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 fitCanvas(cv,ctx,W,H);
 paintW=paintH=0;
 if(W&&H)render();
}
function hud(){
 const a='하루 '+(qi+1)+'/10',b=qi<5?'햇살 따라가기':'별빛 따라가기';
 if(a!==hs){$('sc').textContent=a;hs=a}
 if(b!==hi){$('info').textContent=b;hi=b}
}
function reset(){
 t=0;qi=0;totals=Array(7).fill(0);evidence=Array(7).fill(0);answers=[];lock=0;pending=false;endT=0;acc=0;hs=hi='';
 $('start').insertBefore(hc,$('start').querySelector('.intro'));
 $('notice').textContent='내 일상에 가까운 쪽을 골라봐요';
 document.documentElement.style.setProperty('--c','#d7f1e8');
 hud();
}
function start(){
 reset();state='play';
 $('start').hidden=true;$('over').hidden=true;$('question').hidden=false;$('hud').hidden=false;
 lb.audio.unlock();lb.audio.sfx('sfx/ui-audio/mouseclick1');
 showQuestion();
}
function showQuestion(){
 const q=QS[qi];
 $('place').textContent=q.place;$('qtext').textContent=q.q;
 $('choices').replaceChildren();
 q.a.forEach((a,j)=>{
  const btn=document.createElement('button');btn.type='button';btn.className='opt';
  const circle=document.createElement('i');circle.textContent=j===0?'가':'나';
  circle.setAttribute('aria-hidden','true');
  const text=document.createElement('span');text.textContent=a[0];
  btn.append(circle,text);
  btn.addEventListener('click',()=>choose(j,btn));
  $('choices').appendChild(btn);
 });
 Array.from($('calendar').children).forEach((el,j)=>{el.className='day'+(j<qi?' done':j===qi?' current':'')});
 $('notice').textContent='내 일상에 가까운 쪽을 골라봐요';
 hud();bump($('talk'));
}
function choose(j,btn){
 if(state!=='play'||lock>0||pending)return;
 answers.push(j);
 for(const [i,points] of QS[qi].a[j][1]){totals[i]+=points;evidence[i]+=(qi+1)*points}
 btn.classList.add('selected');
 for(const b of $('choices').children)b.disabled=true;
 const r=btn.getBoundingClientRect(),x=r.left+r.width*.5,y=r.top+r.height*.5;
 lb.audio.sfx('sfx/ui-audio/mouseclick1');
 lb.fx.burst(x,y,{colors:['#fff','#fbe9c6','#bfe3f7']});lb.haptic('light');bump(btn);
 $('notice').textContent=qi===9?'별가루가 내 리듬을 모으는 중':'구름 달력에 하루를 담았어';
 lock=.26;pending=true;
}
function pickResult(){
 const peak=Math.max(...totals);
 let candidates=totals.map((n,i)=>n===peak?i:-1).filter(i=>i>=0);
 const tie=Math.max(...candidates.map(i=>evidence[i]));
 candidates=candidates.filter(i=>evidence[i]===tie);
 let fingerprint=0;
 answers.forEach((n,i)=>{fingerprint=(fingerprint*3+(n+1)*(i+1))%65521});
 return candidates[fingerprint%candidates.length];
}
function die(x,y,why,win){
 if(state!=='play')return;
 resultIndex=pickResult();state='dying';endT=.55;
 $('why').textContent=why;
 $('notice').textContent='나와 닮은 후드 꼬마가 찾아와';
 lb.audio.sfx('sfx/interface-sounds/minimize-005');
 lb.fx.sparkle(x,y);lb.haptic('success');
}
function result(){
 state='over';overAt=clock;
 const d=DATA[resultIndex];
 $('hud').hidden=true;$('question').hidden=true;$('over').hidden=false;
 $('over').insertBefore(hc,$('final'));
 document.documentElement.style.setProperty('--c',d.tint);
 $('final').textContent=d.name;$('tagline').textContent=d.line;
 $('description').textContent=d.desc;
 $('traits').textContent=d.traits.join('  ·  ');
 $('friends').replaceChildren();
 for(const [label,id] of [['잘 맞는 친구',d.good],['다른 박자 친구',d.bad]]){
  const el=document.createElement('span');el.textContent=label+' · '+DATA[id].name;$('friends').appendChild(el);
 }
 $('record').textContent='질문 열 개에 모두 답했어요';
 lb.done(d.name);
 lb.fx.confetti();
 bump($('final'));
}
function update(dt){
 t+=dt;
 if(lock>0)lock=Math.max(0,lock-dt);
 if(pending&&lock<=0){
  pending=false;
  if(qi===9){die(W/2,H*.37,'내 생활 리듬을 찾았어!',true);return}
  qi++;showQuestion();
 }
}
function path(c,pts,fill){
 c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill();c.stroke();
}
function ellipse(c,x,y,rx,ry,fill,line=true){
 c.beginPath();c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);c.fillStyle=fill;c.fill();if(line)c.stroke();
}
function round(c,x,y,w,h,r,fill,line=true){
 c.beginPath();c.roundRect(x,y,Math.max(0,w),Math.max(0,h),r);c.fillStyle=fill;c.fill();if(line)c.stroke();
}
function star(c,x,y,r,fill){
 c.beginPath();
 for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.48:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
 c.closePath();c.fillStyle=fill;c.fill();
}
function cloud(c,x,y,s,color='#fff',outline=false){
 c.save();c.translate(x,y);c.scale(s,s);
 c.beginPath();c.moveTo(-48,12);c.bezierCurveTo(-69,10,-65,-17,-43,-16);c.bezierCurveTo(-48,-42,-13,-45,-6,-23);c.bezierCurveTo(10,-49,46,-34,43,-13);c.bezierCurveTo(69,-15,73,13,47,16);c.closePath();
 c.fillStyle=color;c.fill();if(outline)c.stroke();c.restore();
}
function drawHero(c,x,y,h,happy=false){
 c.save();c.translate(x,y);c.scale(h/140,h/140);
 c.lineWidth=3.5;c.strokeStyle=INK;c.lineJoin='round';c.lineCap='round';
 ellipse(c,0,1,43,8,'#8594b0',false);c.globalAlpha=1;
 ellipse(c,-19,-7,14,9,'#f5d59c');ellipse(c,19,-7,14,9,'#f5d59c');

 c.save();c.translate(32,-49);c.rotate(.25+Math.sin(clock*2)*.05);ellipse(c,5,0,11,22,'#5cc8a8');ellipse(c,7,17,8,8,'#ffe2c9');c.restore();
 ellipse(c,4,-31,21,23,'#45ab91',false);
 c.save();c.translate(-23,-111);c.rotate(-.14);ellipse(c,0,-13,12,31,'#5cc8a8');ellipse(c,0,-17,5,19,'#f5c9d5',false);c.restore();
 c.save();c.translate(23,-112);c.rotate(.3);ellipse(c,0,-9,12,28,'#5cc8a8');ellipse(c,0,-10,5,17,'#f5c9d5',false);ellipse(c,5,-28,13,10,'#74d4b8');c.restore();
 ellipse(c,0,-88,46,41,'#5cc8a8');
 ellipse(c,0,-81,36,29,'#ffe2c9');

 if(happy){
  for(const ex of [-14,14]){c.beginPath();c.arc(ex,-82,8,Math.PI,Math.PI*2);c.stroke()}
 }else{
  for(const ex of [-14,14]){
   ellipse(c,ex,-82,8,11,INK,false);
   ellipse(c,ex-2,-86,3.1,4,'#fff',false);
   ellipse(c,ex+3,-79,1.6,2,'#fff',false);
  }
 }
 c.beginPath();c.moveTo(-5,-67);c.quadraticCurveTo(0,-61,5,-67);c.stroke();
 c.beginPath();c.moveTo(-6,-49);c.lineTo(-8,-35);c.moveTo(6,-49);c.lineTo(8,-35);c.stroke();
 round(c,-13,-27,26,13,6,'#b0e8d4');
 c.restore();
}
function house(c,x,y,s){
 c.save();c.translate(x,y);c.scale(s,s);c.strokeStyle='#817c9e';c.lineWidth=2.6;
 round(c,-24,-33,48,39,9,'#fff5df');
 path(c,[[-30,-30],[0,-54],[30,-30]],'#c6d3ee');
 cloud(c,0,-40,.5,'#fff',false);
 round(c,7,-15,10,21,5,'#d9e8ed');
 round(c,-17,-19,14,13,4,'#f5d88a');
 c.restore();
}
function skyBody(c,x,y,r,night){
 c.save();c.lineWidth=2.5;c.strokeStyle=INK;
 if(night){
  ellipse(c,x,y,r,r,'#fbe9c6');
  ellipse(c,x+r*.42,y-r*.27,r*.8,r*.8,'#d6e5f6',false);
  star(c,x+r*1.35,y-r*.7,r*.2,'#fff');
 }else{
  c.strokeStyle='#e6ad64';
  for(let k=0;k<8;k++){const a=k*Math.PI/4;c.beginPath();c.moveTo(x+Math.cos(a)*r*1.25,y+Math.sin(a)*r*1.25);c.lineTo(x+Math.cos(a)*r*1.48,y+Math.sin(a)*r*1.48);c.stroke()}
  c.strokeStyle=INK;ellipse(c,x,y,r,r,'#f5c84a');
  ellipse(c,x-r*.25,y-r*.02,1.4,2,INK,false);ellipse(c,x+r*.25,y-r*.02,1.4,2,INK,false);
 }
 c.restore();
}
function drawBackground(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle=state==='play'&&qi>6?'#d6e5f6':PAL[0];ctx.fillRect(0,0,W,H);
 const phase=reduced?0:Math.sin(clock*.22)*8;
 for(let i=0;i<4;i++){
  const xx=W*(i*.32-.04)+phase*(i%2?1:-1),yy=H*(.16+i*.19);
  cloud(ctx,xx,yy,.8+i*.13,'#eaf5fc');
 }
 for(let i=0;i<15;i++){
  const x=((i*73+31)%487)/487*W,y=((i*117+39)%541)/541*H;
  ctx.fillStyle='#fff';ctx.globalAlpha=.45+(reduced?0:Math.sin(clock+i)*.2);
  ctx.beginPath();ctx.arc(x,y,1.8,0,Math.PI*2);ctx.fill();
 }

 for(let x=-20;x<W+90;x+=84)cloud(ctx,x,H+8,.9,'#fff');
 if(state==='start'){
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W*.8,0);ctx.lineTo(0,H*.8);ctx.stroke();

  skyBody(ctx,W*.88,H*.77,14,true);
 }
}
function drawScene(){
 if($('question').hidden)return;
 const w=scene.clientWidth,h=scene.clientHeight;
 if(!w||!h)return;
 fitCanvas(scene,sx,w,h);sx.clearRect(0,0,w,h);
 if(h<35)return;
 sx.lineJoin='round';sx.strokeStyle=INK;sx.lineWidth=2.5;
 const base=h*.83,night=qi>=6;
 skyBody(sx,w*.79,h*.25,Math.min(24,h*.16),night);
 if(night)for(let i=0;i<6;i++)star(sx,w*(.15+i*.13),h*(.1+(i%3)*.12),3,'#fff');
 house(sx,w*.67,base-9,Math.min(1,h/150));
 house(sx,w*.87,base+4,Math.min(.65,h/200));
 cloud(sx,w*.64,base+12,w/260,'#fff',true);
 cloud(sx,w*.22,base+13,w/370,'#fff',true);
 const heroH=Math.min(h*.86,170);
 drawHero(sx,w*.23,base+7+(reduced?0:Math.sin(clock*2)*2),heroH,pending);
 if(qi===2||qi===9){
  sx.save();sx.translate(w*.48,base-20);sx.rotate(-.08);sx.lineWidth=2;
  round(sx,-20,-27,40,44,7,'#fff');
  round(sx,-20,-27,40,12,5,'#f29a4a');
  for(let k=0;k<6;k++)round(sx,-12+(k%3)*9,-8+Math.floor(k/3)*11,5,5,1,'#f5c84a',false);
  sx.restore();
 }else if(qi===4||qi===8){
  round(sx,w*.43,base-49,46,34,12,'#fff');
  sx.fillStyle='#5cc8a8';for(let k=0;k<3;k++){sx.beginPath();sx.arc(w*.43+13+k*10,base-32,2.6,0,Math.PI*2);sx.fill()}
 }else{
  sx.save();sx.translate(w*.47,base-11);sx.lineWidth=2;
  ellipse(sx,0,0,18,18,'#fff');
  sx.beginPath();sx.moveTo(0,-10);sx.lineTo(0,0);sx.lineTo(9,4);sx.stroke();
  sx.restore();
 }
}
function drawCard(){
 const w=hc.clientWidth,h=hc.clientHeight;
 if(!w||!h)return;
 fitCanvas(hc,heroCtx,w,h);heroCtx.clearRect(0,0,w,h);
 if(state==='over'){
  const d=DATA[resultIndex],size=Math.min(w,h)*.96;
  heroCtx.fillStyle=d.tint;
  heroCtx.beginPath();heroCtx.ellipse(w/2,h/2,size*.46,size*.46,0,0,Math.PI*2);heroCtx.fill();
  lb.assets.draw(heroCtx,'gen/r'+(resultIndex+1),w/2,h/2,size,size);
 }else if(state==='start'){
  const size=Math.min(w*.59,h*.88);
  lb.assets.draw(heroCtx,'gen/r1',w*.29,h*.51,size,size);
  lb.assets.draw(heroCtx,'gen/r5',w*.72,h*.51,size,size);
  if(h>85)drawHero(heroCtx,w*.5,h*.96,Math.min(h*.43,84));
 }
}
function render(){
 if(!W||!H)return;
 drawBackground();drawScene();drawCard();
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(paused)return;
 clock+=dt;
 if(state==='play'){
  acc+=dt;
  while(acc>=STEP&&state==='play'){update(STEP);acc-=STEP}
 }else if(state==='dying'){
  endT-=dt;if(endT<=0)result();
 }
 render();
}
lb.onPause(p=>{paused=p;last=0});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.45)start()});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 const d=DATA[resultIndex];
 lb.share('내 생활 리듬은 '+d.name+'예요! '+d.line+' · 아침형 저녁형 테스트');
});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
