function resizeResult(){
const d=Math.min(devicePixelRatio||1,2),w=rc.clientWidth,h=rc.clientHeight;
if(w&&h){rc.width=Math.round(w*d);rc.height=Math.round(h*d);rctx.setTransform(d,0,0,d,0,0);rctx.imageSmoothingEnabled=false;}
}
function drawHero(c,x,y,h,key){
if(!(h>0))return;
lb.assets.draw(c,key||'gen/r1',x,y-h/2,h,h);
}
function show(id){
['start','play','loading','over'].forEach(v=>$(v).hidden=v!==id);
}
function hud(){
$('sc').textContent='사건 '+(index+1)+'/9';
steps.forEach((e,i)=>e.className=i<index?'past':i===index?'now':'');
}
function setQuestion(){
const q=questions[index];hud();reveal=0;selected=-1;
$('location').textContent=q.place;$('qtext').textContent='';
opts.forEach((b,i)=>{b.querySelector('span').textContent=q.a[i][0];b.classList.remove('on','selected');b.disabled=false;});
}
function reset(){
index=0;totals=Array(7).fill(0);history=[];lock=0;selected=-1;reveal=0;ending=0;acc=0;resultIndex=0;
$('sub').textContent='';setQuestion();
}
function start(){
reset();state='play';show('play');
lb.audio.unlock();lb.audio.sfx(CLICK);lb.audio.music(MUSIC,{loop:true,volume:.35});
}
function choose(i){
if(state!=='play'||lock>0||i<0||i>2)return;
reveal=1;$('qtext').textContent=questions[index].q;selected=i;
const weights=questions[index].a[i][1];
weights.forEach(([r,n])=>totals[r]+=n);
history.push(weights);
opts.forEach((b,k)=>{b.classList.toggle('on',k===i);b.classList.toggle('selected',k===i);b.disabled=true;});
lock=.3;
lb.audio.sfx(CLICK);lb.haptic('light');
}
function winner(){
const m=Math.max(...totals);let tied=totals.map((v,i)=>v===m?i:-1).filter(i=>i>=0);
for(let k=history.length-1;k>=0&&tied.length>1;k--){
const row=history[k],v=i=>(row.find(p=>p[0]===i)||[i,0])[1],top=Math.max(...tied.map(v));
if(top)tied=tied.filter(i=>v(i)===top);
}
return tied[0];
}
function die(){
if(state!=='play')return;
state='dying';ending=.65;resultIndex=winner();show('loading');
lb.audio.stopMusic();lb.audio.sfx(LEVEL);lb.haptic('success');
lb.fx.burst(W*.5,H*.4,{colors:[PAL[3],PAL[4]]});
}
function result(){
state='over';overAt=clock;
const r=results[resultIndex];
$('final').textContent=r.name;$('shareline').textContent=r.line;$('desc').textContent=r.desc;
$('match').textContent=results[r.match].name;$('clash').textContent=results[r.clash].name;
$('traits').replaceChildren();
r.traits.forEach(v=>{const span=document.createElement('span');span.className='chip';span.textContent=v;$('traits').appendChild(span);});
document.documentElement.style.setProperty('--c',r.color);
show('over');resizeResult();
lb.done(r.name);
}
function update(dt){
if(state==='play'){
if(lock>0){
lock=Math.max(0,lock-dt);
if(lock===0){if(index===8)die();else{index++;setQuestion();}}
}else if(reveal<.5){
reveal=Math.min(.5,reveal+dt);
const text=questions[index].q;
const count=Math.ceil(text.length*reveal/.5);
if($('qtext').textContent!==text.slice(0,count))$('qtext').textContent=text.slice(0,count);
}
}else if(state==='dying'){
ending=Math.max(0,ending-dt);
$('loadfill').style.width=Math.round((1-ending/.65)*100)+'%';
if(!ending)result();
}
}
function sprite(key,x,y,scale){
const s=sprites[key];if(!s)return;
const p=Math.max(2,Math.round(scale));
ctx.drawImage(s,Math.round(x/P)*P,Math.round(y/P)*P,s.width*p,s.height*p);
}
function cloud(x,y){
ctx.fillStyle='#eef4cf';
const p=P;
ctx.fillRect(Math.round(x/p)*p,y,16*p,3*p);
ctx.fillRect(Math.round(x/p)*p+3*p,y-2*p,9*p,2*p);
ctx.fillRect(Math.round(x/p)*p+6*p,y-3*p,4*p,p);
}
function drawBackground(){
ctx.fillStyle='#c5d68e';ctx.fillRect(0,0,W,H);
const skyH=state==='play'?H*.31:H*.36;
ctx.fillStyle='#adc172';ctx.fillRect(0,0,W,skyH);
const drift=reduced?0:clock*3;
cloud(((W*.1+drift)%(W+120))-80,Math.round(skyH*.35/P)*P);
cloud(((W*.68+drift*.65)%(W+120))-50,Math.round(skyH*.57/P)*P);
ctx.fillStyle=ground;ctx.fillRect(0,skyH,W,H-skyH);
ctx.fillStyle='#eef4cf';ctx.fillRect(W*.38,skyH+30,W*.24,H-skyH-30);
const s=Math.max(2,Math.min(4,Math.floor(W/100))),base=skyH+P*5;
sprite('house',W*.03,base-15*s,s);
sprite('gate',W*.7,base-12*s,s);
sprite('well',W*.69,base+30,s);
if(state==='play'){
const y=Math.min(H*.40,base+45);
sprite('person',W*.44,y,Math.max(2,s));
}
ctx.fillStyle='#7d9a45';
for(let i=0;i<8;i++){
const x=Math.round((i*W/8+6)/P)*P,y=Math.round((skyH+H*.17+(i%3)*12)/P)*P;
ctx.fillRect(x,y,3*P,P);ctx.fillRect(x+P,y-P,P,P);
}
ctx.fillStyle='#1f3320';ctx.fillRect(0,H-4,W,4);
}
function drawCursor(c,visible){
c.clearRect(0,0,16,16);if(!visible)return;
c.fillStyle='#ffffff';
c.fillRect(2,1,4,14);c.fillRect(6,3,4,10);c.fillRect(10,5,4,6);c.fillRect(14,7,2,2);
}
function render(){
if(!W||!H)return;
ctx.clearRect(0,0,W,H);drawBackground();
const bob=reduced?0:Math.floor(clock*2)%2*4;
if(state==='start'){
hc.clearRect(0,0,320,320);
hc.fillStyle='#7d9a45';hc.fillRect(72,280,176,12);
drawHero(hc,160,284-bob,260,'gen/r1');
}
const blink=reduced||Math.floor(clock*2)%2===0;
if(blink!==cursorOn||selected>=0){cursorOn=blink;cursors.forEach(c=>drawCursor(c.getContext('2d'),blink));}
if(state==='over'){
const w=rc.clientWidth,h=rc.clientHeight;
if(!w||!h)return;
rctx.clearRect(0,0,w,h);
const size=Math.max(20,Math.min(w*.8,h-6));
rctx.fillStyle='#c5d68e';rctx.fillRect(Math.round(w/2-size*.34),Math.round(h-8),Math.round(size*.68),5);
drawHero(rctx,w/2,h-5-bob*.5,size,results[resultIndex].key);
}
}
function frame(now){
requestAnimationFrame(frame);
const dt=last?Math.min(.1,(now-last)/1000):0;last=now;
if(paused)return;
clock+=dt;acc+=dt;
while(acc>=STEP){update(STEP);acc-=STEP;}
render();
}
opts.forEach((b,i)=>b.addEventListener('pointerdown',()=>choose(i)));
$('question').addEventListener('pointerdown',()=>{if(state==='play'){reveal=.5;$('qtext').textContent=questions[index].q;}});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.5)start();});
$('rank').addEventListener('click',()=>{if(state==='over')lb.share('나는 '+results[resultIndex].name+'이에요! '+results[resultIndex].line);});
lb.onPause(p=>{paused=p;last=0;});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(()=>{resizeResult();}).observe($('over'));
resize();cursors.forEach(c=>drawCursor(c.getContext('2d'),true));
requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
