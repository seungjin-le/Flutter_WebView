<title>연애 꽃말 테스트</title>
<style>
:root{--bg:#eef5ff;--paper:#fff;--ink:#2b2b3a;--acc:#d7263d;--lt:#ffe3eb;--tone:#2b2b3a18;--c:#d7263d;--title-font:system-ui,sans-serif;--body-font:system-ui,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font)}
button{font-family:var(--title-font);cursor:pointer;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(var(--tone) 1px,transparent 1.5px) 0 0/10px 10px,var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;padding:calc(14px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(14px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));overflow:hidden}
h1,h2,p{margin:0;word-break:keep-all}
h1,h2,.ttl{font-family:var(--title-font);font-weight:400;letter-spacing:-.035em}
button{border:3px solid var(--ink);border-radius:5px;font-size:18px;min-height:64px;touch-action:manipulation}
.btn{background:var(--acc);color:white;box-shadow:4px 4px 0 var(--ink);padding:8px 18px}
.btn:active{box-shadow:1px 1px 0 var(--ink);background:#b81c31}
.cut{background:white;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.bub{background:white;border:3px solid var(--ink);border-radius:24px;padding:12px 16px;position:relative}
.bub:after{content:"";position:absolute;bottom:-8px;left:26px;width:12px;height:12px;background:white;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
#start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:max(60px,calc(16px + var(--lb-safe-top,0px)))}
#start h1{font-size:clamp(28px,5.2vh,36px);line-height:1.15;position:relative}
#start h1:after{content:"";position:absolute;left:12%;right:12%;bottom:-6px;height:7px;background:#ff7aa861;z-index:-1}
#start .memory{font-size:clamp(14px,2.5vh,18px);line-height:1.45}
#start .hook{font-size:clamp(16px,2.8vh,20px);line-height:1.35;max-width:360px}
#hc{display:block;flex:1;min-height:35px;width:100%;max-width:380px;object-fit:contain}
#go{width:min(100%,300px);flex-shrink:0}
#hud{position:absolute;top:calc(12px + var(--lb-safe-top,0px));left:calc(18px + var(--lb-safe-left,0px));right:calc(18px + var(--lb-safe-right,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
#sc{font-size:18px;background:var(--ink);color:white;padding:7px 12px;white-space:normal;font-weight:400}
#info{font-size:16px}
#quiz{display:flex;flex-direction:column;gap:clamp(10px,2vh,17px);padding-top:calc(68px + var(--lb-safe-top,0px))}
#progress{display:flex;gap:5px;flex-shrink:0}
#progress i{height:10px;flex:1;border:2px solid var(--ink);background:white}
#progress i.past{background:var(--ink)}
#progress i.current{background:#ff7aa8}
#sceneLabel{font-size:16px;margin-top:4px;align-self:flex-start;background:#cfe3ff;border:2px solid var(--ink);padding:5px 10px;transform:rotate(-1deg)}
#question{font-size:clamp(20px,3.5vh,24px);line-height:1.45;flex:1;min-height:0;display:flex;align-items:center}
#question:before{content:"";position:absolute;right:13px;top:9px;width:5px;height:5px;border-radius:50%;background:#ff7aa8;box-shadow:9px 0 #ff7aa8,18px 0 #ff7aa8}

 c.fillStyle='#ffd9ca';c.beginPath();c.moveTo(-12,-76);c.quadraticCurveTo(-12,-87,-7,-85);c.lineTo(-7,-51);c.lineTo(-7,-30);c.lineTo(-25,-43);c.quadraticCurveTo(-32,-49,-32,-44);c.lineTo(-13,-23);c.lineTo(-9,-5);c.lineTo(23,0);c.lineTo(30,-13);c.lineTo(30,-29);c.quadraticCurveTo(26,-35,23,-30);c.lineTo(20,-21);c.lineTo(15,-40);c.quadraticCurveTo(10,-48,6,-40);c.lineTo(7,-23);c.lineTo(-2,-43);c.lineTo(-6,-43);c.lineTo(-12,-76);c.fill();
 c.fillStyle='#fff4ef';c.beginPath();c.roundRect(-12,-82,8,13,3);c.fill();
 c.fillStyle=PAL[1];c.beginPath();c.moveTo(-21,1);c.lineTo(29,1);c.lineTo(32,20);c.lineTo(-23,20);c.closePath();c.fill();c.stroke();
 c.fillStyle='#94b9e8';c.fillRect(-19,11,47,6);
 c.restore();
}
function drawCoaster(c,x,y,w,h){
 c.save();c.translate(x,y);
 c.fillStyle='#2b2b3a';c.beginPath();c.ellipse(4,5,w/2,h/2,0,0,Math.PI*2);c.fill();
 c.fillStyle='white';c.strokeStyle=PAL[2];c.lineWidth=3;c.beginPath();c.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);c.fill();c.stroke();
 c.strokeStyle='#cfe3ff';c.lineWidth=2;c.beginPath();c.ellipse(0,0,Math.max(0,w/2-9),Math.max(0,h/2-7),0,0,Math.PI*2);c.stroke();
 c.restore();
}
function drawBackground(){
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.strokeStyle='#b6cce680';ctx.lineWidth=2;
 const shift=reduced?0:Math.sin(clock*.35)*5;
 ctx.translate(shift,0);
 ctx.beginPath();ctx.moveTo(-10,H*.18);ctx.lineTo(W*.19,H*.18);ctx.lineTo(W*.19,H*.34);ctx.lineTo(-10,H*.34);ctx.stroke();
 ctx.beginPath();ctx.moveTo(W*.83,H*.51);ctx.lineTo(W+10,H*.51);ctx.moveTo(W*.83,H*.51);ctx.lineTo(W*.83,H*.71);ctx.stroke();
 ctx.fillStyle='#fff1ad80';ctx.save();ctx.translate(W*.91,H*.22);ctx.rotate(.13);ctx.fillRect(-18,-22,36,44);ctx.restore();
 ctx.restore();
}
function drawStartArt(){
 const c=hc;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,640,480);
 c.save();c.translate(320,238);
 c.fillStyle='#cfe3ff';c.strokeStyle=PAL[2];c.lineWidth=4;
 c.beginPath();c.roundRect(-252,-181,504,330,18);c.fill();c.stroke();
 c.fillStyle='#fff';c.beginPath();c.moveTo(-249,82);c.lineTo(249,-128);c.lineTo(249,145);c.lineTo(-249,145);c.closePath();c.fill();
 c.restore();
 drawCoaster(c,320,380,370,90);
 const sway=reduced?0:Math.sin(clock*1.1)*4;
 lb.assets.draw(c,'gen/r1',205,218+sway,220,270);
 lb.assets.draw(c,'gen/r2',420,215-sway,220,270);
 lb.assets.draw(c,'gen/r3',320,235,245,300);
 drawHero(c,493,428,119);
 c.strokeStyle=PAL[2];c.lineWidth=4;
 for(let k=0;k<3;k++){c.beginPath();c.moveTo(488+k*16,288-k*9);c.lineTo(491+k*19,272-k*14);c.stroke();}
}
function drawResultArt(){
 if(!artBox)return;
 const b=artBox,pad=5,w=Math.min(b.w-12,b.h*1.16),h=Math.max(0,b.h-9);
 if(w<=0||h<=0)return;
 const x=b.x+b.w/2,y=b.y+b.h/2;
 ctx.save();
 ctx.fillStyle='white';ctx.strokeStyle=PAL[2];ctx.lineWidth=3;
 ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,14);ctx.fill();ctx.stroke();
 ctx.save();ctx.beginPath();ctx.roundRect(x-w/2+pad,y-h/2+pad,Math.max(0,w-pad*2),Math.max(0,h-pad*2),10);ctx.clip();
 ctx.strokeStyle='#cfe3ff';ctx.lineWidth=1.5;
 for(let i=0;i<24;i++){const a=i*Math.PI/12;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*h*.19,y+Math.sin(a)*h*.19);ctx.lineTo(x+Math.cos(a)*w,y+Math.sin(a)*h);ctx.stroke();}
 const scale=reduced?1:Math.min(1,.8+(clock-overAt)*.7);
 lb.assets.draw(ctx,'gen/r'+(resultIndex+1),x,y,Math.max(1,(w-10)*scale),Math.max(1,(h-7)*scale));
 ctx.restore();ctx.restore();
}
function drawEffects(dt){
 for(let i=petals.length-1;i>=0;i--){
  const p=petals[i];
  if(!reduced){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*1.8;}
  p.life-=dt;
  if(p.life<=0||p.y>H+20){petals.splice(i,1);continue;}
  ctx.save();ctx.globalAlpha=Math.min(1,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.strokeStyle=PAL[2];ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.48,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
 }
}
function render(){if(!W||!H)return;drawBackground();if(state==='start')drawStartArt();if(state==='over')drawResultArt();}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(!W){resize();if(!W)return;}if(paused)return;
 clock+=dt;
 if(state==='play'){acc+=dt;while(acc>=STEP&&state==='play'){update(STEP);acc-=STEP;}}
 else if(state==='dying'&&(endT-=dt)<=0)result();
 render();drawEffects(dt);
}
const up=()=>{down=false;};
lb.onPause(p=>{paused=p;last=0;up();});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.7)start();});
$('rank').addEventListener('click',()=>lb.share(names[resultIndex]+' · '+words[resultIndex]+'\n'+shares[resultIndex]+'\n연애 꽃말 테스트'));
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(()=>{resize();measureArt();}).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
