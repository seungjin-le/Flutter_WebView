<html lang="ko">
<head>


<title>작고 소중한 나</title>
<style>
:root{--bg:#dcefc2;--paper:#fffdf7;--ink:#343842;--pk:#f497ad;--act:#f497ad;--c:#F2B880;--title-font:ui-rounded,system-ui,sans-serif;--body-font:ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden;font-family:var(--body-font);background:radial-gradient(circle,#fff9 2px,transparent 3px) 12px 8px/88px 96px,radial-gradient(circle,#efb6c2 2px,transparent 3px) 55px 57px/118px 136px,var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:calc(20px + var(--lb-safe-top,0px)) calc(20px + var(--lb-safe-right,0px)) calc(16px + var(--lb-safe-bottom,0px)) calc(20px + var(--lb-safe-left,0px));overflow:hidden}
h1,h2,p{margin:0;word-break:keep-all}
h1,#final,button,.label{font-family:var(--title-font)}
h1{font-size:clamp(30px,5.7vh,39px);font-weight:300;letter-spacing:.04em;line-height:1.25;-webkit-text-stroke:7px #fff;paint-order:stroke fill}
h1 em{font-style:normal;color:#b94969}
p{font-size:clamp(17px,3.5vh,23px);line-height:1.28}
button{color:var(--ink);font-size:18px;border:2px solid var(--ink);cursor:pointer;min-height:64px;padding:10px 19px;touch-action:manipulation}
button:active{background:#ffe5ec}
#go,#again,#rank{background:var(--pk);border-radius:34px;min-width:160px;flex-shrink:0}
#go{width:min(100%,270px);margin-top:5px}
#again,#rank{min-width:0}
#start{justify-content:flex-end;padding-bottom:calc(28px + var(--lb-safe-bottom,0px))}
#start h1{order:0}
#start>p{order:1;max-width:330px}
#hc{order:2;display:block;width:min(100%,320px);height:clamp(90px,36vh,270px);flex:0 1 270px;min-height:45px;object-fit:contain}
#go{order:3}
#hud{position:absolute;top:calc(16px + var(--lb-safe-top,0px));right:calc(12px + var(--lb-safe-right,0px));bottom:calc(20px + var(--lb-safe-bottom,0px));width:29px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:3}
#sc{font:15px var(--title-font);white-space:normal}
#steps{display:flex;flex:1;min-height:0;flex-direction:column;justify-content:center;gap:clamp(4px,1.5vh,12px)}
#steps svg{width:23px;height:25px;fill:#c0d4b1;stroke:#61765c;stroke-width:1.1;transition:fill .18s,transform .18s}
#steps svg.filled{fill:var(--pk);stroke:#8d4c61;transform:rotate(-9deg)}
#info{writing-mode:vertical-rl;font-size:16px;letter-spacing:3px}
#play{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2.6vh,20px);padding:calc(55px + var(--lb-safe-top,0px)) calc(51px + var(--lb-safe-right,0px)) calc(20px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));overflow:hidden}
.label{font-size:13px;letter-spacing:.1em;color:#526848;text-align:left}
.card{position:relative;background:var(--paper);border:2.2px solid var(--ink);border-radius:26px 20px 24px 18px;padding:19px 17px 21px;transform:rotate(-.7deg)}
.qmark{display:inline-flex;align-items:center;justify-content:center;background:#ffd9e2;border-radius:45% 55% 48% 52%;min-width:45px;height:32px;font:14px var(--title-font);margin-bottom:8px}
#question{font-size:clamp(21px,4.4vh,28px);font-weight:500;line-height:1.22;min-height:2.44em}
#choices{display:flex;flex-direction:column;gap:7px}
.opt{position:relative;display:flex;align-items:center;text-align:left;gap:10px;width:100%;min-height:64px;padding:9px 13px;background:#fffdf9;border-radius:20px 17px 22px 19px;font:clamp(17px,3.5vh,23px) var(--body-font);line-height:1.16}
.opt i{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:30px;height:30px;font:15px var(--title-font);font-style:normal;border-radius:50%;border:1.6px solid var(--ink);background:var(--dot)}
.opt.selected{background:#ffdee8;border-color:#9c4f69}
.opt.selected:after{content:"";position:absolute;right:12px;width:26px;height:30px;background:currentColor;opacity:.2;clip-path:polygon(38% 55%,20% 39%,4% 48%,10% 68%,28% 77%,26% 92%,40% 100%,64% 97%,80% 82%,74% 64%,64% 50%,72% 24%,54% 16%,45% 43%,39% 12%,21% 15%,23% 39%)}
.opt:disabled{color:var(--ink);opacity:1}
#wait{font-size:clamp(21px,4vh,28px);font-family:var(--title-font)}
#over{gap:7px}
#why{font-size:clamp(16px,3vh,21px)}
#over #hc{order:0;flex:1 1 200px;height:auto;max-height:43%;min-height:38px;width:min(100%,300px)}
#final{font-size:clamp(27px,5.6vh,38px);line-height:1.13;font-weight:400;letter-spacing:-.02em;font-family:var(--title-font);-webkit-text-stroke:6px #fff;paint-order:stroke fill}
#tagline{font-size:clamp(17px,3.1vh,21px);color:#75516a}
#description{font-size:clamp(16px,2.9vh,20px);max-width:400px;line-height:1.19}
#traits{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
#traits span{font-size:15px;line-height:1.1;border-radius:11px;background:#ffffffa6;padding:5px 9px}
#match{display:flex;gap:10px;justify-content:center;width:100%;font-size:clamp(14px,2.6vh,18px);line-height:1.25}
#match span{background:#ffffff8c;padding:6px 9px;border-radius:12px;flex:1}
.lb-rec{font-size:14px;color:#55664a}
#actions{display:flex;gap:9px;width:100%;max-width:370px;flex-shrink:0}
#actions button{flex:1;font-size:17px;padding:8px}
#rank{background:#fff5db}
.pop{animation:pop .2s ease-out}
@keyframes pop{50%{transform:scale(1.06)}}
@media(max-height:570px){
.scr{gap:6px;padding-top:calc(12px + var(--lb-safe-top,0px));padding-bottom:calc(12px + var(--lb-safe-bottom,0px))}
#start{padding-bottom:calc(16px + var(--lb-safe-bottom,0px))}
#play{padding-top:calc(20px + var(--lb-safe-top,0px));gap:9px}
.card{padding:12px 14px}
.qmark{height:24px;margin-bottom:4px}
#question{font-size:23px}
.opt{min-height:57px;padding:6px 11px;font-size:20px}
#description{font-size:16px}
#traits span{font-size:13px;padding:4px 6px}
#match{font-size:14px}
#over #hc{max-height:35%}
#actions button{min-height:64px}
}
@media(max-height:440px){
#play{padding-top:calc(10px + var(--lb-safe-top,0px));padding-bottom:calc(10px + var(--lb-safe-bottom,0px));gap:6px}
#play>.label{display:none}
.card{padding:9px 12px}
#question{font-size:20px;min-height:0}
.qmark{float:left;margin:0 9px 0 0;font-size:12px;min-width:30px;height:25px}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{min-height:64px;font-size:17px;gap:6px;padding:6px}
.opt i{width:24px;height:24px;font-size:12px}
#start{gap:5px}
#start h1{font-size:29px}
#start p{font-size:17px}
#start #hc{flex:1 1 70px;height:70px;max-height:100px}
#over{gap:4px}
#match,#traits{display:none}
#description{font-size:15px}
#final{font-size:27px}
#why,#tagline{font-size:16px}
.lb-rec{font-size:12px}
#over #hc{min-height:24px;max-height:28%}
}

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="hud" hidden><b id="sc">0/9</b><div id="steps"></div><span id="info">마을 산책</span></div>
<div id="start" class="scr">
<h1>작고 <em>소중한</em> 나</h1>
<p>풀잎 마을에 온 걸 환영해요!<br>나는 어떤 작은 친구일까요?</p>
<canvas id="hc" width="640" height="480" aria-label="작은 동물 친구들"></canvas>
<button id="go" type="button">테스트 시작</button>
</div>
<div id="play" hidden>
<p class="label">풀잎 마을 · 나의 산책 수첩</p>
<div class="card"><span class="qmark" id="qnum">질문 1</span><h2 id="question"></h2></div>
<div id="choices"></div>
</div>
<div id="thinking" class="scr" hidden><p id="wait">꼬물꼬물 찾고 있어요…</p></div>
<div id="over" class="scr" hidden>
<p id="why">나를 닮은 작은 친구를 찾았어요!</p>
<b id="final"></b>
<p id="tagline"></p>
<div id="traits"></div>
<p id="description"></p>
<div id="match"></div>
<p class="lb-rec" id="record"></p>
<div id="actions"><button id="again" type="button">다시 하기</button><button id="rank" type="button">결과 공유</button></div>
</div>
</div>
<script>
lb.ready(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),hc=$('hc'),art=hc.getContext('2d'),STEP=1/120,GAME=0,PAL=['#CDEBC0','#9ED2A6','#E07A2E','#FFD23F','#6B4E3D'];
const animal=[
{name:'울보 햄찌',key:'gen/r1',color:'#F2B880',tag:'마음이 말랑해서 다정함도 가득해요.',desc:'작은 친절에도 마음이 포근해지는 친구예요. 풍부한 감정으로 다른 마음을 섬세하게 알아봐요. 가끔은 내 마음도 다정하게 안아 줘요.',traits:['말랑한 감성','작은 행복','깊은 공감'],yes:3,no:1},
{name:'엉뚱 수달',key:'gen/r2',color:'#8A5A3B',tag:'평범한 하루도 나와 함께면 재미있어요.',desc:'익숙한 풍경에서 새로운 재미를 찾아내요. 엉뚱한 상상으로 친구들의 웃음을 꺼내 줘요. 신나는 순간에도 친구의 속도를 살펴봐요.',traits:['엉뚱한 상상','유쾌한 여유','놀이 발견'],yes:6,no:0},
{name:'새침 고양이',key:'gen/r3',color:'#9AA5B1',tag:'내 취향으로 고른 하루가 소중해요.',desc:'좋아하는 것을 또렷하게 아는 친구예요. 조용히 곁을 내어 주는 특별한 다정함이 있어요. 반가운 마음은 가끔 말로도 전해 봐요.',traits:['또렷한 취향','은근한 애정','나만의 속도'],yes:4,no:5},
{name:'다정한 아기양',key:'gen/r4',color:'#F4F1EA',tag:'함께 있으면 마음이 포근해져요.',desc:'친구가 편히 기댈 수 있는 따뜻한 품이 있어요. 작은 배려로 마을의 하루를 부드럽게 이어요. 내게 필요한 쉼도 소중히 챙겨 줘요.',traits:['포근한 배려','든든한 곁','평화 사랑'],yes:0,no:6},
{name:'조용한 고슴도치',key:'gen/r5',color:'#6B4E3D',tag:'천천히 가까워져도 진심은 깊어요.',desc:'작은 풍경과 마음의 변화를 차분히 살펴봐요. 익숙해질수록 오래가는 믿음을 건네요. 편한 친구에게는 작은 마음부터 꺼내 봐요.',traits:['차분한 관찰','깊은 믿음','고요한 충전'],yes:2,no:5},
{name:'수다 병아리',key:'gen/r6',color:'#FFD23F',tag:'반가운 마음은 재잘재잘 전하고 싶어요.',desc:'즐거운 이야기를 나누며 친구와 가까워져요. 반가운 인사 하나로 어색한 공기도 따뜻하게 해요. 친구의 이야기를 기다리는 틈도 즐겨 봐요.',traits:['반가운 인사','이야기 부자','밝은 호기심'],yes:1,no:4},
{name:'반짝 다람쥐',key:'gen/r7',color:'#E07A2E',tag:'궁금한 세상으로 폴짝 나아가요.',desc:'반짝이는 아이디어를 실제로 옮기는 힘이 있어요. 설레는 일을 만나면 주변에도 활기를 나눠 줘요. 가끔은 멈춰서 이미 이룬 것도 바라봐요.',traits:['반짝 추진력','보물 수집','새로운 발견'],yes:1,no:3}
];
const questions=[
{q:'이삿짐을 풀자 이웃이 문을 두드려요. 어떻게 맞이할까요?',a:[
['반가워서 조잘조잘 인사해요',[[5,3],[6,1]]],
['작은 간식을 나누어 줘요',[[3,3],[0,1]]],
['문틈으로 살짝 눈을 맞춰요',[[4,3],[2,1]]],
['상자 모자를 쓰고 맞이해요',[[1,3],[6,1]]]]},
{q:'개울가 소풍 자리를 고르고 있어요. 어디에 앉을까요?',a:[
['꽃이 잘 보이는 포근한 자리요',[[0,3],[3,1]]],
['혼자 쉬기 좋은 나무 아래요',[[4,3],[2,2]]],
['물수제비를 던질 수 있는 곳이요',[[1,3],[6,1]]],
['친구들 가운데 빈자리요',[[5,3],[3,1]]]]},
{q:'바구니에서 낯선 씨앗을 발견했어요. 무엇을 할까요?',a:[

['어떤 꽃일지 이야기를 지어요',[[1,3],[5,1]]],
['예쁜 봉투에 소중하게 담아요',[[2,3],[0,1]]],
['이웃과 반씩 나눠 심어요',[[3,3],[5,1]]]]},
{q:'친구가 아끼던 찻잔을 깨뜨렸어요. 곁에서 어떻게 할까요?',a:[
['속상한 마음에 눈물이 핑 돌아요',[[0,3],[3,1]]],
['말없이 곁에 앉아 기다려요',[[4,3],[2,1]]],
['조각으로 꽃 화분을 꾸며 봐요',[[1,3],[6,2]]],
['친구 이야기를 찬찬히 들어요',[[3,3],[5,1]]]]},
{q:'햇살 좋은 오후가 통째로 비었어요. 무엇을 하고 싶나요?',a:[
['구름 모양을 보며 뒹굴어요',[[1,3],[0,1]]],
['새 산책길의 끝까지 가 봐요',[[6,3],[5,1]]],
['좋아하는 쿠션에서 책을 봐요',[[2,3],[4,2]]],
['친구를 불러 차를 마셔요',[[3,2],[5,3]]]]},
{q:'마을 장터에 작은 가게를 열어요. 무엇을 내놓을까요?',a:[

['모양이 독특한 돌 수집품이에요',[[1,3],[4,1]]],
['취향대로 고른 리본들이에요',[[2,3],[6,1]]],
['발견한 보물과 그 이야기예요',[[6,2],[5,3]]]]},
{q:'풀숲에서 아주 작은 울음이 들려요. 어떤 반응이 먼저일까요?',a:[
['덩달아 마음이 찡해져요',[[0,3],[3,1]]],
['조심조심 가까이 살펴봐요',[[4,3],[2,1]]],
['괜찮냐고 다정히 말을 걸어요',[[5,3],[3,2]]],
['필요할 만한 물건을 챙겨 가요',[[6,3],[1,1]]]]},
{q:'버섯집 벽에 내 그림을 걸어요. 어떤 그림을 고를까요?',a:[
['친구와 꼭 붙어 있는 그림이요',[[0,2],[3,3]]],
['말도 안 되게 웃긴 상상화예요',[[1,3],[5,1]]],
['내 마음에 쏙 드는 작은 그림이요',[[2,3],[4,2]]],
['가 보고 싶은 먼 숲의 지도예요',[[6,3],[4,1]]]]},
{q:'하루를 마치며 산책 수첩을 펴요. 무엇을 남길까요?',a:[
['고마웠던 순간을 꼭 적어요',[[0,3],[3,2]]],
['내일 해 볼 일을 그려요',[[6,3],[1,2]]],
['조용히 발견한 풍경을 적어요',[[4,3],[2,2]]],
['친구와 나눈 이야기를 적어요',[[5,3],[1,1]]]]}
];
let W=0,H=0,state='start',paused=false,last=0,clock=0,acc=0,t=0,score=0,qi=0,answers=[],points=Array(7).fill(0),tie=Array(7).fill(0),pending=-1,lock=0,endT=0,resultIndex=0,overAt=0,stampCount=0,hs='',pictureMode='start';
const paw='<ellipse cx="12" cy="17" rx="6.5" ry="5"/><ellipse cx="4" cy="9" rx="2.5" ry="3.4" transform="rotate(-25 4 9)"/><ellipse cx="10" cy="5" rx="2.5" ry="3.4"/><ellipse cx="17" cy="5.6" rx="2.5" ry="3.4"/><ellipse cx="22" cy="11" rx="2.4" ry="3.2" transform="rotate(28 22 11)"/>';
$('steps').innerHTML=questions.map(()=>'<svg aria-hidden="true" viewBox="0 0 26 25">'+paw+'</svg>').join('');
const stepEls=[...$('steps').children];
function resize(){
W=cv.clientWidth;H=cv.clientHeight;
const d=Math.min(devicePixelRatio||1,2);
cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function hud(){
const text=Math.min(qi+1,9)+'/9';
if(text!==hs){$('sc').textContent=hs=text;}
stepEls.forEach((el,i)=>el.classList.toggle('filled',i<stampCount));
}
function showQuestion(){
const question=questions[qi];
$('qnum').textContent='질문 '+(qi+1);
$('question').textContent=question.q;
$('choices').replaceChildren();
const letters=['가','나','다','라'],colors=['#fbd4df','#c5e4f3','#fff0ad','#cee6bf'];
question.a.forEach((answer,i)=>{
const button=document.createElement('button');
button.type='button';button.className='opt';button.style.setProperty('--dot',colors[i]);
const icon=document.createElement('i');icon.textContent=letters[i];icon.setAttribute('aria-hidden','true');
const text=document.createElement('span');text.textContent=answer[0];
button.append(icon,text);button.addEventListener('pointerdown',e=>choose(i,e.clientX,e.clientY));
button.addEventListener('click',()=>{if(pending<0&&state==='play'){const r=button.getBoundingClientRect();choose(i,r.x+r.width/2,r.y+r.height/2);}});
$('choices').append(button);
});
pending=-1;lock=0;hud();
}
function reset(){
t=0;score=0;qi=0;answers=[];points=Array(7).fill(0);tie=Array(7).fill(0);stampCount=0;pending=-1;lock=0;endT=0;acc=0;hs='';pictureMode='start';
$('start').append(hc);showQuestion();
}
function start(){
lb.audio.unlock();lb.audio.sfx('sfx/ui-audio/click2');
reset();state='play';$('start').hidden=true;$('over').hidden=true;$('thinking').hidden=true;$('play').hidden=false;$('hud').hidden=false;
}
function choose(index,x,y){
if(state!=='play'||pending>=0||paused)return;
pending=index;lock=.18;
const answer=questions[qi].a[index];
answers.push(index);
answer[1].forEach(([type,amount])=>{points[type]+=amount;tie[type]=(qi+1)*11+index;});
stampCount++;
const buttons=[...$('choices').children];
buttons.forEach((button,i)=>{button.disabled=true;button.classList.toggle('selected',i===index);});
lb.audio.sfx('sfx/ui-audio/click2');
lb.haptic('light');
lb.fx.ripple(x,y,{colors:['#f497ad','#fff4bc']});
bump(stepEls[stampCount-1]);hud();
}
function die(x,y,why,win){
if(state!=='play')return;
const best=Math.max(...points),candidates=points.map((n,i)=>n===best?i:-1).filter(i=>i>=0);
candidates.sort((a,b)=>tie[b]-tie[a]);
resultIndex=candidates[0];
state='dying';endT=.75;
$('play').hidden=true;$('hud').hidden=true;$('thinking').hidden=false;
}
function result(){
if(state!=='dying')return;
state='over';overAt=clock;pictureMode='result';
const r=animal[resultIndex];
$('thinking').hidden=true;$('over').hidden=false;
$('over').style.setProperty('--c',r.color);
$('why').after(hc);
$('final').textContent=r.name;
$('tagline').textContent=r.tag;
$('description').textContent=r.desc;
$('traits').replaceChildren();
r.traits.forEach(trait=>{const el=document.createElement('span');el.textContent=trait;$('traits').append(el);});
$('match').replaceChildren();
const yes=document.createElement('span'),no=document.createElement('span');
yes.textContent='잘 맞는 친구예요 · '+animal[r.yes].name;
no.textContent='살짝 어색한 친구예요 · '+animal[r.no].name;
$('match').append(yes,no);
$('record').textContent='아홉 걸음에 내 마음을 담았어요';
lb.done(r.name);
lb.audio.sfx('sfx/interface-sounds/minimize-003');
lb.audio.sfx('sfx/interface-sounds/confirmation-001');
lb.haptic('success');
lb.fx.confetti();
}
function update(dt){
t+=dt;
if(pending>=0){
lock-=dt;
if(lock<=0){
qi++;
if(qi>=questions.length){die(W/2,H/2,'나를 닮은 작은 친구를 찾았어요!',true);}
else showQuestion();
}
}
}
function drawPaw(c,x,y,size,color,angle){
c.save();c.translate(x,y);c.rotate(angle);c.scale(size/26,size/26);c.fillStyle=color;
for(const p of [[12,17,6.5,5],[4,9,2.5,3.4],[10,5,2.5,3.4],[17,5.6,2.5,3.4],[22,11,2.4,3.2]]){
c.beginPath();c.ellipse(p[0],p[1],p[2],p[3],0,0,Math.PI*2);c.fill();
}
c.restore();
}
function clover(x,y,s){
ctx.save();ctx.translate(x,y);ctx.strokeStyle='#66865b';ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(3,8,1,15);ctx.stroke();
ctx.fillStyle='#b1d39a';
for(let i=0;i<3;i++){const a=i*Math.PI*2/3-Math.PI/2;ctx.beginPath();ctx.ellipse(Math.cos(a)*s*.4,Math.sin(a)*s*.4,s*.45,s*.34,a,0,Math.PI*2);ctx.fill();}
ctx.restore();
}
function drawHouse(x,y,s){
ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineWidth=1.8;ctx.lineJoin='round';ctx.strokeStyle='#586254';ctx.fillStyle='#fff1cc';
ctx.beginPath();ctx.moveTo(-24,0);ctx.lineTo(-24,-36);ctx.quadraticCurveTo(0,-49,24,-36);ctx.lineTo(24,0);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle='#e5a2a9';ctx.beginPath();ctx.moveTo(-34,-34);ctx.quadraticCurveTo(-25,-76,0,-76);ctx.quadraticCurveTo(27,-76,34,-34);ctx.quadraticCurveTo(0,-25,-34,-34);ctx.fill();ctx.stroke();
ctx.fillStyle='#fff8df';for(const p of [[-15,-49,6],[6,-62,5],[18,-45,5]]){ctx.beginPath();ctx.arc(p[0],p[1],p[2],0,Math.PI*2);ctx.fill();}
ctx.fillStyle='#bfdedb';ctx.beginPath();ctx.arc(0,-20,8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(0,-12);ctx.moveTo(-8,-20);ctx.lineTo(8,-20);ctx.stroke();ctx.restore();
}
function drawHero(c,x,y,size,index){
lb.assets.draw(c,animal[index].key,x,y,size,size);
}
function renderArt(){
art.clearRect(0,0,640,480);
if(pictureMode==='result'){
art.fillStyle=animal[resultIndex].color+'55';
art.beginPath();art.ellipse(320,250,182,163,0,0,Math.PI*2);art.fill();
drawHero(art,320,240,445,resultIndex);
}else{
drawHero(art,158,275+Math.sin(clock*1.3)*4,285,0);
drawHero(art,478,270+Math.sin(clock*1.2+2)*4,280,3);
drawHero(art,326,242+Math.sin(clock*1.4+1)*4,335,2);
}
}
function render(){
if(!W||!H)return;
ctx.clearRect(0,0,W,H);
ctx.fillStyle='#bddda5';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H-24);ctx.quadraticCurveTo(W*.25,H-65,W*.52,H-30);ctx.quadraticCurveTo(W*.8,H-4,W,H-38);ctx.lineTo(W,H);ctx.fill();
if(state==='start'){
drawHouse(W*.15,H*.35,.7);
drawHouse(W*.85,H*.43,.5);
ctx.strokeStyle='#91b381';ctx.lineWidth=3;
for(let i=0;i<5;i++){const x=W*.64+i*14;ctx.beginPath();ctx.moveTo(x,H*.27+15);ctx.lineTo(x,H*.27-5);ctx.stroke();}
ctx.beginPath();ctx.moveTo(W*.64,H*.27+3);ctx.lineTo(W*.64+56,H*.27+3);ctx.stroke();
}
clover(12,H*.66,9);clover(W-14,H*.31,8);clover(W*.8,H-10,10);clover(W*.12,H-5,8);
drawPaw(ctx,W-31,H*.72,19,'#819c6d55',.35);
if(state==='dying'){
for(let i=0;i<12;i++){
const a=clock*(.5+i*.02)+i*2.4,x=W/2+Math.cos(a)*(30+i*5),y=H/2+Math.sin(a*1.2)*60;
ctx.fillStyle=['#edb0bf','#fff0b1','#f4d9cb'][i%3];ctx.beginPath();ctx.ellipse(x,y,5,9,a,0,Math.PI*2);ctx.fill();
}
}
if(state==='start'||state==='over')renderArt();
}
function frame(now){
requestAnimationFrame(frame);
const dt=last?Math.min((now-last)/1000,.1):0;last=now;
if(paused)return;
clock+=dt;
if(state==='play'){
acc+=dt;while(acc>=STEP&&state==='play'){update(STEP);acc-=STEP;}
}else if(state==='dying'){endT-=dt;if(endT<=0)result();}
render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.7)start();});
$('rank').addEventListener('click',()=>{const r=animal[resultIndex];lb.share('작고 소중한 나 · 나는 '+r.name+'예요! '+r.tag);});
lb.onPause(p=>{paused=p;last=0;});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
lb.assets.font('font/jua').then(f=>document.documentElement.style.setProperty('--title-font',f));
lb.assets.font('font/dongle').then(f=>document.documentElement.style.setProperty('--body-font',f));
resize();render();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
