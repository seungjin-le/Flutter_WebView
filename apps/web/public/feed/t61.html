important;padding-left:8px!important;padding-right:8px!important}}@keyframes lv-over-in{0%{scale:.92}60%{scale:1.04}100%{scale:1}}@media (prefers-reduced-motion: reduce){html body #lv-scr-over .lv-card{animation:none!important}}@container lv-stage (max-height: 479px){html body #lv-scr-over .lv-card{padding-top:18px!important}}html body #lv-scr-start .lv-stage,html body #lv-scr-over .lv-stage{padding:inherit!important;justify-content:inherit!important;align-items:inherit!important;gap:inherit!important;flex-wrap:inherit!important;overflow:hidden!important}html body #lv-scr-over .lv-sub{white-space:pre-line!important}html body #lv-scr-over .lv-sub:not([hidden]){-webkit-line-clamp:4!important}@container lv-stage (max-height: 479px){html body #lv-scr-over .lv-sub:not([hidden]){-webkit-line-clamp:3!important}html body #lv-scr-over .lv-why:not([hidden]){-webkit-line-clamp:2!important}}html body #hud > #sc{color:var(--lv-hud-ink)!important;background-color:var(--lv-hud-bg)!important;background-image:none!important;border-radius:var(--lv-btn-radius)!important;text-shadow:none!important;box-shadow:0 0 0 5px var(--lv-hud-bg)!important;font-family:var(--lv-font)!important;font-variant-numeric:tabular-nums!important}html body #hud > #info{color:var(--lv-hud-ink)!important;background-color:var(--lv-hud-bg)!important;background-image:none!important;border-radius:var(--lv-btn-radius)!important;text-shadow:none!important;box-shadow:0 0 0 5px var(--lv-hud-bg)!important;font-family:var(--lv-font)!important}html body #hud > #sc:empty,html body #hud > #info:empty{background-color:transparent!important;background-image:none!important;box-shadow:none!important}</style></head>
<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="start" class="scr">
<div class="rib">알람 없는 토요일</div>
<h1 id="ttl" class="ttl">주말 아침 성격</h1>
<p id="intro" class="intro">눈뜰 때부터 브런치까지, 내 성격 다 나옴!</p>
<div class="start-art">
<div class="art" id="startArt"><img alt=""><div class="fallback" aria-hidden="true"></div></div>
<div class="art side-art" id="sideArt"><img alt=""><div class="fallback" aria-hidden="true"></div></div>
</div>
<p id="bub" class="bub"></p>
<button id="go" class="go" type="button" data-start>내 아침 알아보기</button>
</div>
<div id="over" class="scr" hidden>
<div id="rp" data-result-id="">
<section>
<div class="rib">주말 아침 진짜 얼굴</div>
<div class="art result-art" id="resultArt"><img alt=""><div class="fallback" aria-hidden="true"></div></div>
<p id="why">내 결과 나왔음!</p>
<h2 id="final" class="nm"></h2>
<p id="shareline"></p>
</section>
<section>
<h2 class="section-title">이런 행동 자주 함</h2>
<div id="chips" class="chips"></div>
<p id="description" class="card description"></p>
<p id="record" class="lb-rec"></p>
</section>
<section>
<h2 class="section-title">같이 아침 보내면</h2>
<div class="matches">
<div class="match">
<span class="match-label">잘 맞음</span>
<div class="art" id="goodArt"><img alt=""><div class="fallback" aria-hidden="true"></div></div>
<h3 id="goodName" class="match-name"></h3>
</div>
<div class="match">
<span class="match-label">다른 결과도 궁금함?</span>
<div class="art" id="badArt"><img alt=""><div class="fallback" aria-hidden="true"></div></div>
<h3 id="badName" class="match-name"></h3>
</div>
</div>
<p class="disclaimer">결과가 달라도 같이 먹으면 됨~</p>
</section>
<section>
<button id="again" class="go" type="button">다시 해보기</button>
<button id="share" class="go" type="button" data-share>내 결과 나옴! 너는 뭐 나옴?</button>
<p class="disclaimer">재미로 보는 테스트임. 심리 진단은 아님</p>
</section>
</div>
</div>
<div id="play" class="play" hidden>
<div class="play-top">
<span id="num" class="num">1</span>
<div class="agenda"><p id="day"></p><span>지금 질문</span></div>
</div>
<div class="card question-card">
<div class="corner" aria-hidden="true"></div>
<h2 id="question"></h2>
<p id="aside">주말 아침의 나랑 가까운 걸 고르면 됨</p>
</div>
<div id="options" aria-label="나는 이렇게 함"></div>
</div>
<div id="hud" hidden>
<div id="progress" aria-hidden="true"></div>
<span id="sc">1/1</span>
<button id="back" type="button">이전</button>
</div>
<div id="judging" hidden>
<div class="id-prop" aria-hidden="true"><i></i></div>
<h2>주말 아침 취향 모으는 중</h2>
<p>어떤 모습인지 곧 나옴!</p>
</div>
</div>
<script>
(function(){
var D=window.DATA||{},Q=Array.isArray(D.questions)?D.questions:[],R=Array.isArray(D.results)?D.results:[];
var $=function(id){return document.getElementById(id)};
var NAMECOL=['--heart','--sub','--accent','--ink'];
var BADGE=['가','나','다','라','마','바','사','아'];
var state='start',index=0,answers=[],busy=false,result=null,clock=0,last=0,W=0,H=0,cv=$('cv'),ctx=cv.getContext('2d'),colors=[];
var motion=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function txt(v){return typeof v==='string'?v:(v==null?'':String(v))}
function setArt(id,r){
  var box=$(id),img=box.querySelector('img'),fb=box.querySelector('.fallback'),src=r&&txt(r.img);
  fb.textContent=r?txt(r.name).charAt(0):'';img.alt=r?txt(r.name):'';
  if(src){img.src=src;box.classList.remove('noimg');img.onerror=function(){box.classList.add('noimg')}}
  else{img.removeAttribute('src');box.classList.add('noimg')}
}
// 제목 — 끝 낱말을 새 줄에 강조(원래 «나는 어떤 / 직장인» 모양)
(function(){
  var t=txt(D.title).trim(),h=$('ttl');if(!t)return;var w=t.split(/\s+/);h.textContent='';
  if(w.length>1){h.appendChild(document.createTextNode(w.slice(0,-1).join(' ')));h.appendChild(document.createElement('br'));}
  var em=document.createElement('em');em.textContent=w[w.length-1];h.appendChild(em);
})();
if(!txt(D.subtitle))$('intro').textContent=txt(D.intro_line);
$('bub').textContent=txt(D.intro_line)||txt(D.subtitle);if(!$('bub').textContent)$('bub').hidden=true;
setArt('startArt',(txt(D.cover)?{img:D.cover,name:txt(D.title)}:R[1]||R[0]));if(R.length>1)setArt('sideArt',R[0]);else $('sideArt').hidden=true;
var stars=[];
Q.forEach(function(){var s=document.createElement('i');s.className='star';$('progress').appendChild(s);stars.push(s)});
function hud(){
  $('sc').textContent=(index+1)+'/'+Q.length;
  stars.forEach(function(s,i){s.className='star'+(i<index?' filled':i===index?' current':'')});
  $('back').disabled=index===0||busy;
}
function showQuestion(){
  var q=Q[index]||{};
  $('num').textContent=index+1;$('day').textContent=txt(q.head)||txt(D.topic)||txt(D.title);
  $('question').textContent=txt(q.q);
  var box=$('options');box.textContent='';
  (q.options||[]).forEach(function(o,i){
    var b=document.createElement('button');b.type='button';b.className='o';b.setAttribute('data-opt',String(i));
    var bd=document.createElement('span');bd.className='bdg';bd.setAttribute('aria-hidden','true');bd.textContent=BADGE[i]||String(i+1);
    var t=document.createElement('span');t.textContent=txt(o&&o.text);
    b.appendChild(bd);b.appendChild(t);
    b.addEventListener('click',function(){choose(i,b)});
    box.appendChild(b);
  });
  hud();
}
function start(){
  answers=[];index=0;busy=false;if(window.LB)LB.reset();
  state='play';$('start').hidden=true;$('over').hidden=true;$('judging').hidden=true;
  $('play').hidden=false;$('hud').hidden=false;showQuestion();
}
function choose(i,b){
  if(state!=='play'||busy)return;busy=true;
  b.classList.add('chosen');b.setAttribute('aria-pressed','true');
  answers[index]=i;LB.answer(index,i);hud();
  setTimeout(function(){
    busy=false;
    if(index>=Q.length-1){judge();return}
    index++;showQuestion();
  },220);
}
function judge(){
  state='judging';$('play').hidden=true;$('hud').hidden=true;$('judging').hidden=false;
  setTimeout(show,650);
}
function show(){
  result=LB.result()||R[0];if(!result)return;
  state='over';
  var ri=Math.max(0,R.indexOf(result));
  document.documentElement.style.setProperty('--c','var('+NAMECOL[ri%NAMECOL.length]+')');
  $('rp').setAttribute('data-result-id',txt(result.id));
  $('final').textContent=txt(result.name);$('shareline').textContent=txt(result.quote)||txt(result.tagline);
  $('description').textContent=txt(result.desc);if(txt(result.tip)){var tp=document.createElement('span');tp.style.display='block';tp.style.marginTop='8px';tp.setAttribute('data-tip','');tp.textContent=txt(result.tip);$('description').appendChild(tp)}
  $('record').textContent=txt(result.tagline)?txt(D.title)+' · '+txt(result.name):'';
  var chips=$('chips');chips.textContent='';
  (Array.isArray(result.traits)?result.traits:[]).slice(0,3).forEach(function(t){var c=document.createElement('span');c.className='chip';c.textContent=txt(t);chips.appendChild(c)});
  setArt('resultArt',result);
  var good=(window.LB&&LB.byId(result.match))||R[(ri+1)%R.length];
  var other=null;for(var k=1;k<R.length;k++){var c=R[(ri+Math.ceil(R.length/2)+k-1)%R.length];if(c!==result&&c!==good){other=c;break}}
  var bad=result.mismatch!=null&&window.LB&&LB.byId?LB.byId(result.mismatch):null;if(bad===result||bad===good)bad=null;other=bad||other;
  setArt('goodArt',good);$('goodName').textContent=good?txt(good.name):'';
  setArt('badArt',other||good);$('badName').textContent=(other||good)?txt((other||good).name):'';
  $('judging').hidden=true;$('over').hidden=false;$('rp').scrollTop=0;
  $('over').classList.remove('open');void $('over').offsetWidth;$('over').classList.add('open');
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',function(){if(state==='over')start()});
$('share').addEventListener('click',function(){if(state==='over'&&result)LB.share(result.id)});
$('back').addEventListener('click',function(){
  if(state!=='play'||index===0||busy)return;index--;answers.length=index;showQuestion();
});
// 바탕 소품(사원증·서류) — 색은 변수에서
function resize(){
  W=cv.clientWidth;H=cv.clientHeight;var d=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
  var css=getComputedStyle(document.documentElement);
  colors=['--ink','--bg','--heart','--line','--accent'].map(function(v){return css.getPropertyValue(v).trim()});
}
function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill()}
function draw(){
  if(!W||!H)return;ctx.clearRect(0,0,W,H);if(state==='over')return;
  var bob=motion?Math.sin(clock*.7)*4:0;
  ctx.save();ctx.globalAlpha=.55;ctx.translate(W-34,H*.36+bob);ctx.rotate(.12);
  rr(-22,-29,44,58,10,colors[3]);rr(-18,-25,36,50,8,colors[1]);rr(-8,-34,16,12,4,colors[4]);rr(-10,-12,20,17,5,colors[3]);rr(-11,12,22,4,2,colors[3]);
  ctx.restore();
  ctx.save();ctx.globalAlpha=.5;ctx.translate(12,H*.73-bob);ctx.rotate(-.18);
  rr(-17,-22,34,44,6,colors[3]);rr(-13,-18,26,36,4,colors[1]);for(var i=0;i<3;i++)rr(-8,-10+i*9,16,3,1,colors[3]);
  ctx.restore();
}
function frame(now){requestAnimationFrame(frame);var dt=last?Math.min(.05,(now-last)/1000):0;last=now;clock+=dt;draw()}
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
