--bg:#e8f6f0;--card:#fbfffd;--ink:#303e2c;--sub:#a24b4a;--line:#cde6dc;
--accent:#f08a3c;--accent-ink:#303e2c;--soft:#cdf0e6;--soft2:#b8d1a3;--heart:#b34185;--gold:#4e6c3d;
}
:root{--title-font:"Jua",ui-rounded,system-ui,sans-serif;--body-font:"Gowun Dodum",ui-rounded,system-ui,sans-serif;--c:var(--heart)}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font)}
button{font-family:var(--title-font);color:var(--ink);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(var(--soft2) 1px,transparent 1.5px) 14px 14px/36px 36px,var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#room{position:absolute;top:var(--lb-safe-top,0px);left:0;right:0;height:54px;display:flex;align-items:center;gap:10px;padding:6px 18px;background:var(--card);border-bottom:1px solid var(--line);z-index:2}
#room>div{min-width:0}
.roomMark{position:relative;width:32px;height:29px;border:2px solid var(--line);border-radius:12px;background:var(--soft);flex:none}
.roomMark:before{content:"";position:absolute;width:8px;height:8px;left:4px;bottom:-4px;background:var(--soft);border-bottom:2px solid var(--line);transform:skewY(-30deg)}
.roomMark:after{content:"";position:absolute;inset:10px 6px;border-top:3px dotted var(--heart)}
.roomName{font-family:var(--title-font);font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomSub{font-size:12px;line-height:1.4;color:var(--heart);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomNote{margin-left:auto;flex:none;font-size:12px;background:var(--soft);color:var(--ink);padding:5px 9px;border-radius:10px}
.scr{position:absolute;top:calc(54px + var(--lb-safe-top,0px));bottom:var(--lb-safe-bottom,0px);left:0;right:0;padding:14px 18px;overflow:hidden;text-align:center}
h1,h2,p{margin:0;word-break:keep-all;overflow-wrap:anywhere}
#start{display:flex;flex-direction:column;align-items:center;gap:10px}
.rib{font-size:12px;color:var(--heart);background:var(--soft);border-radius:8px;padding:5px 16px}
#start .rib{margin-top:clamp(2px,2vh,16px)}
h1{font-family:var(--title-font);font-size:clamp(28px,4.8vh,36px);font-weight:400;line-height:1.15;letter-spacing:-.03em}
h1 em{font-style:normal;color:var(--heart)}
.hook{max-width:320px;font-size:clamp(13px,2.2vh,16px);line-height:1.5}
.hc{position:relative;display:flex;justify-content:center;align-items:center;flex:1;min-height:0;width:100%;max-width:380px;isolation:isolate}
.hc:before{content:"";position:absolute;left:50%;top:50%;width:min(80%,270px);height:84%;transform:translate(-50%,-50%);border-radius:48%;background:radial-gradient(var(--line) 1px,transparent 1.6px) 0 0/15px 15px,var(--soft);opacity:.72;z-index:-1}
.hc img{display:block;min-height:0;max-height:100%;height:100%;width:100%;object-fit:contain}
.artFallback{display:none;align-items:center;justify-content:center;width:min(70%,220px);height:min(90%,220px);aspect-ratio:1;border-radius:42%;background:var(--soft);color:var(--c);font-family:var(--title-font);font-size:clamp(48px,12vh,96px);border:3px solid var(--line)}
.hc.noimg img{display:none}
.hc.noimg .artFallback{display:flex}
.bub{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px 18px 18px 5px;box-shadow:0 3px 0 var(--line);padding:12px 16px;font-size:clamp(13px,2.1vh,16px);line-height:1.4}
#start .bub{align-self:flex-start;max-width:94%;text-align:left}
.go{width:min(100%,340px);min-height:64px;flex:none;border:0;border-radius:24px 24px 7px 24px;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 var(--line);font-size:21px;padding:8px 20px}
.go:active{filter:brightness(.94);box-shadow:0 2px 0 var(--line)}
#go{margin:2px 0 5px}
#hud{position:absolute;top:calc(64px + var(--lb-safe-top,0px));left:18px;right:18px;display:flex;align-items:center;gap:12px;z-index:1;pointer-events:none}
#sc{display:flex;align-items:center;justify-content:center;min-width:57px;min-height:35px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-family:var(--title-font);font-size:18px;font-weight:400;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line)}
#stars{display:flex;gap:5px;align-items:center;flex:1;justify-content:flex-end;min-width:0;overflow:hidden}
.star{width:clamp(12px,3.8vw,19px);height:19px;flex:none;background:var(--line);clip-path:polygon(50% 0,62% 34%,98% 36%,70% 59%,80% 96%,50% 75%,20% 96%,30% 59%,2% 36%,38% 34%);transition:background .2s}
.star.done{background:var(--accent)}
.star.current{background:var(--heart)}
#ask{top:calc(110px + var(--lb-safe-top,0px));display:flex;flex-direction:column;gap:12px;text-align:left;padding-top:2px;padding-bottom:14px}
.sender{font-size:12px;margin-left:8px;color:var(--heart)}
#question{font-family:var(--body-font);font-size:clamp(19px,3.2vh,23px);line-height:1.45;font-weight:600;padding:17px 18px;background:var(--card);border:1.5px solid var(--line);border-radius:6px 22px 22px 22px;box-shadow:0 3px 0 var(--line);max-width:96%;min-height:88px;display:flex;align-items:center;flex:none}
#chatHint{font-size:12px;line-height:1.3;margin:0 6px;color:var(--heart)}
#options{display:grid;grid-template-columns:1fr;gap:11px;margin-top:auto;padding:4px 0;min-height:0}
.o{--b:var(--heart);width:100%;min-height:64px;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 13px;border:1.5px solid var(--line);border-radius:20px 6px 20px 20px;background:var(--card);box-shadow:0 4px 0 var(--line);font-family:var(--body-font);font-size:clamp(16px,2.6vh,18px);line-height:1.35;transition:background .12s,box-shadow .12s}
.o>span:last-child{min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.o:nth-child(4n+2){--b:var(--sub)}
.o:nth-child(4n+3){--b:var(--accent)}
.o:nth-child(4n+4){--b:var(--ink)}
.bdg{display:flex;align-items:center;justify-content:center;flex:none;align-self:center;width:29px;height:29px;border-radius:10px;background:var(--b);color:var(--card);font-family:var(--title-font);font-size:15px}
.o:active,.o.selected{background:var(--soft);box-shadow:0 1px 0 var(--line)}
.o.selected{border-color:var(--b)}
#ask.entering #question{animation:arrive .24s ease-out both}
#ask.entering .o{animation:reply .22s ease-out both}
#ask.entering .o:nth-child(2){animation-delay:.035s}
#ask.entering .o:nth-child(3){animation-delay:.07s}
#ask.entering .o:nth-child(4){animation-delay:.105s}
.pop{animation:choose .2s ease-out}
@keyframes arrive{from{transform:translateY(7px)}to{transform:translateY(0)}}
@keyframes reply{from{transform:scale(.97)}to{transform:scale(1)}}
@keyframes choose{50%{filter:brightness(1.035)}}
#notice{position:absolute;top:calc(63px + var(--lb-safe-top,0px));left:18px;right:18px;z-index:4;padding:12px 16px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:14px;text-align:center;animation:arrive .25s ease-out}
#over{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(120px,1fr) auto auto auto auto auto 64px;align-items:center;gap:7px 10px;padding-top:10px;padding-bottom:12px;overflow-y:auto;overflow-x:hidden}
#over>*{min-width:0}
#why,#final,#shareline,#traits,#sub,#compat,#over .hc{grid-column:1/-1}
#why{justify-self:center;font-size:12px;padding:4px 13px;background:var(--soft);border-radius:10px;color:var(--ink)}
#over .hc{width:100%;height:100%;max-width:none;justify-self:center}
#over .hc:before{width:min(65%,250px);height:95%}
#final{font-family:var(--title-font);font-size:clamp(29px,5.4vh,38px);font-weight:400;letter-spacing:-.02em;color:var(--c);line-height:1.1;-webkit-text-stroke:5px var(--card);paint-order:stroke fill}
#shareline{font-size:clamp(12px,2.1vh,15px);line-height:1.35}
#traits{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.chip{padding:4px 9px;border-radius:12px;background:var(--soft);color:var(--ink);font-size:12px;line-height:1.2}
.chip:nth-child(2){background:var(--card);color:var(--heart);border:1px solid var(--line)}
.chip:nth-child(3){background:var(--card);color:var(--sub);border:1px solid var(--line)}
#sub{padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:6px 17px 17px 17px;text-align:left;font-size:clamp(12px,2.05vh,15px);line-height:1.45}
#compat{display:flex;justify-content:center;gap:8px;line-height:1.25;font-size:12px}
.match{display:flex;align-items:center;gap:5px;flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;padding:4px 7px}
.match img{width:34px;height:34px;object-fit:contain;flex:none}
.match img.noimg{display:none}
.match>span{min-width:0}
.match small{display:block;font-size:12px;color:var(--heart);margin-bottom:2px}
.match b{font-size:12px;font-weight:600;display:block;word-break:keep-all;overflow-wrap:anywhere}
#again,#share{width:100%;min-width:0;min-height:64px;height:64px;padding:6px;font-size:18px;border-radius:19px 19px 6px 19px}
#again{background:var(--card);border:1.5px solid var(--line);box-shadow:0 4px 0 var(--line)}
#share{background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 4px 0 var(--line)}
#again:active,#share:active{filter:brightness(.94);box-shadow:0 1px 0 var(--line)}
@media(min-height:680px){#start{padding-top:26px}#over{gap:9px 10px}#ask{gap:17px}#question{min-height:110px}.o{min-height:70px}}
@media(max-height:580px){
#room{height:45px}.scr{top:calc(45px + var(--lb-safe-top,0px));padding:9px 16px}
#hud{top:calc(51px + var(--lb-safe-top,0px))}
#ask{top:calc(94px + var(--lb-safe-top,0px));gap:8px}
#question{min-height:65px;padding:11px 14px;font-size:19px}
#options{gap:8px}.o{min-height:64px;padding:8px 11px;font-size:16px}
#start{gap:7px}#start .rib{margin-top:0}
#compat{display:none}#final{font-size:30px}#sub{font-size:12px;padding:7px 10px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<header id="room">
<span class="roomMark" aria-hidden="true"></span>
<div><div class="roomName">동아리방</div><div class="roomSub">사물 성향 테스트</div></div>
<span class="roomNote">오늘의 동방 탐구</span>
</header>
<div id="hud" hidden>
<b id="sc">1/1</b>
<div id="stars" aria-hidden="true"></div>
</div>
<section id="start" class="scr">
<p class="rib">NEW</p>
<h1 id="ttl">동아리방 물건 테스트</h1>
<p id="hook" class="hook">동방 문 열고 들어가면 나는 어떤 사물일까?</p>
<div class="hc" id="hc"><img id="mainArt" alt=""><span class="artFallback" aria-hidden="true"></span></div>
<p id="bub" class="bub"></p>
<button id="go" class="go" type="button" data-start>입장하기</button>
</section>
<section id="ask" class="scr" hidden aria-labelledby="question">
<p class="sender">동방지기</p>
<h2 id="question"></h2>
<p id="chatHint">골라봐!</p>
<div id="options"></div>
</section>
<p id="notice" role="status" hidden>사물 분석 중...</p>
<section id="over" class="scr" hidden aria-labelledby="final" data-result-id="">
<p id="why">내 동방 사물</p>
<b id="final"></b>
<p id="shareline"></p>
<p id="traits"></p>
<p id="sub"></p>
<p id="compat">
<span class="match"><img id="goodArt" alt=""><span><small>찰떡궁합</small><b id="goodName"></b></span></span>
<span class="match"><img id="badArt" alt=""><span><small>상극조합</small><b id="badName"></b></span></span>
</p>
<button id="again" type="button">다시 하기</button>
<button id="share" type="button" data-share>결과 공유</button>
</section>
</div>
<script>
(function(){
var D=window.DATA||{},Q=Array.isArray(D.questions)?D.questions:[],R=Array.isArray(D.results)?D.results:[];
var $=function(id){return document.getElementById(id)};
var NAMECOL=['--heart','--sub','--ink'],BADGE=['A','B','C','D','E','F','G','H'];
var state='start',qi=0,busy=false,result=null,cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0,clock=0,last=0,bgLayer=null;
var reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function txt(v){return typeof v==='string'?v:(v==null?'':String(v))}
function setHc(r){
  var box=$('hc'),img=$('mainArt');box.querySelector('.artFallback').textContent=r?txt(r.name).charAt(0):'';
  img.alt=r?txt(r.name):'';
  if(r&&txt(r.img)){img.src=r.img;box.classList.remove('noimg');img.onerror=function(){box.classList.add('noimg')}}else{img.removeAttribute('src');box.classList.add('noimg')}
}
function setMini(img,r){img.alt=r?txt(r.name):'';if(r&&txt(r.img)){img.src=r.img;img.classList.remove('noimg')}else{img.removeAttribute('src');img.classList.add('noimg')}}
// 제목 — 끝 낱말 강조(원래 «연애할 때 내 모습» 모양)
(function(){
  var t=txt(D.title).trim(),h=$('ttl');if(!t)return;var w=t.split(/\s+/);h.textContent='';
  if(w.length>1)h.appendChild(document.createTextNode(w.slice(0,-1).join(' ')+' '));
  var em=document.createElement('em');em.textContent=w[w.length-1];h.appendChild(em);
})();
if(!txt(D.subtitle))$('hook').textContent=txt(D.intro_line);
$('bub').textContent=txt(D.intro_line)||txt(D.subtitle);if(!$('bub').textContent)$('bub').hidden=true;
setHc((txt(D.cover)?{img:D.cover,name:txt(D.title)}:R[0]));
var stars=Q.map(function(){var s=document.createElement('span');s.className='star';$('stars').appendChild(s);return s});
function hud(){
  $('sc').textContent=(qi+1)+'/'+Q.length;
  stars.forEach(function(s,i){s.className='star'+(i<qi?' done':i===qi?' current':'')});
}
function showQuestion(){
  var q=Q[qi]||{};$('question').textContent=txt(q.q);var sd=document.querySelector('#ask .sender');if(sd){if(sd.dataset.d==null)sd.dataset.d=sd.textContent;sd.textContent=txt(q.head)||sd.dataset.d}
  var box=$('options');box.textContent='';
  (q.options||[]).forEach(function(o,i){
    var b=document.createElement('button');b.type='button';b.className='o';b.setAttribute('data-opt',String(i));
    var bd=document.createElement('span');bd.className='bdg';bd.setAttribute('aria-hidden','true');bd.textContent=BADGE[i]||String(i+1);
    var t=document.createElement('span');t.textContent=txt(o&&o.text);
    b.appendChild(bd);b.appendChild(t);b.addEventListener('click',function(){choose(i,b)});box.appendChild(b);
  });
  $('ask').classList.remove('entering');void $('ask').offsetWidth;$('ask').classList.add('entering');
  hud();
}
function start(){
  qi=0;busy=false;result=null;if(window.LB)LB.reset();
  state='ask';$('start').hidden=true;$('over').hidden=true;$('notice').hidden=true;
  $('hc').classList.remove('in-over');$('start').insertBefore($('hc'),$('bub'));setHc((txt(D.cover)?{img:D.cover,name:txt(D.title)}:R[0]));
  $('ask').hidden=false;$('hud').hidden=false;showQuestion();
}
function choose(i,b){
  if(state!=='ask'||busy)return;busy=true;
  b.classList.add('selected');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
  LB.answer(qi,i);
  setTimeout(function(){
    busy=false;
    if(qi>=Q.length-1){
      state='notice';$('ask').hidden=true;$('hud').hidden=true;$('notice').hidden=false;
      setTimeout(show,700);return;
    }
    qi++;showQuestion();
  },240);
}
function show(){
  result=LB.result()||R[0];if(!result)return;state='over';
  var ri=Math.max(0,R.indexOf(result));
  document.documentElement.style.setProperty('--c','var('+NAMECOL[ri%NAMECOL.length]+')');
  $('over').setAttribute('data-result-id',txt(result.id));
  $('final').textContent=txt(result.name);$('shareline').textContent=txt(result.quote)||txt(result.tagline);
  $('sub').textContent=txt(result.desc);if(txt(result.tip)){var tp=document.createElement('span');tp.style.display='block';tp.style.marginTop='8px';tp.setAttribute('data-tip','');tp.textContent=txt(result.tip);$('sub').appendChild(tp)}
  var tr=$('traits');tr.textContent='';
  (Array.isArray(result.traits)?result.traits:[]).slice(0,3).forEach(function(t){var c=document.createElement('span');c.className='chip';c.textContent=txt(t);tr.appendChild(c)});
  setHc(result);$('over').insertBefore($('hc'),$('final'));
  var good=LB.byId(result.match)||R[(ri+1)%R.length],other=null;
  for(var k=1;k<R.length;k++){var c=R[(ri+Math.ceil(R.length/2)+k-1)%R.length];if(c!==result&&c!==good){other=c;break}}
  var bad=result.mismatch!=null&&window.LB&&LB.byId?LB.byId(result.mismatch):null;if(bad===result||bad===good)bad=null;other=bad||other||good;
  $('goodName').textContent=good?txt(good.name):'';$('badName').textContent=other?txt(other.name):'';
  setMini($('goodArt'),good);setMini($('badArt'),other);
  $('notice').hidden=true;$('over').hidden=false;$('over').scrollTop=0;
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',function(){if(state==='over')start()});
$('share').addEventListener('click',function(){if(state==='over'&&result)LB.share(result.id)});
// 바탕 소품(찻잔·화분·하트) — 색은 변수에서
function col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function makeBackground(){
  bgLayer=document.createElement('canvas');var d=Math.min(window.devicePixelRatio||1,2);
  bgLayer.width=Math.max(1,Math.round(W*d));bgLayer.height=Math.max(1,Math.round(H*d));
  var b=bgLayer.getContext('2d');b.scale(d,d);
  var edge=col('--line'),paper=col('--card'),ribbon=col('--soft'),ink=col('--heart');
  b.lineWidth=1.5;b.strokeStyle=edge;b.fillStyle=paper;
  function rr(x,y,w,h,r){b.beginPath();if(b.roundRect)b.roundRect(x,y,w,h,r);else b.rect(x,y,w,h)}
  function cup(x,y,s){b.save();b.translate(x,y);b.scale(s,s);b.rotate(-.12);
    b.beginPath();b.ellipse(0,20,27,7,0,0,Math.PI*2);b.fillStyle=ribbon;b.fill();
    b.beginPath();b.ellipse(21,-1,9,12,0,0,Math.PI*2);b.stroke();
    rr(-19,-19,38,38,12);b.fillStyle=paper;b.fill();b.stroke();
    b.beginPath();b.ellipse(0,-15,18,5,0,0,Math.PI*2);b.fillStyle=ribbon;b.fill();b.stroke();
    b.beginPath();b.ellipse(0,-15,10,2,0,0,Math.PI*2);b.stroke();b.restore()}
  function plant(x,y,s){b.save();b.translate(x,y);b.scale(s,s);
    b.fillStyle=ribbon;rr(-15,0,30,27,8);b.fill();b.stroke();
    b.beginPath();b.moveTo(0,0);b.lineTo(0,-25);b.stroke();
    b.fillStyle=paper;b.beginPath();b.ellipse(-8,-19,7,13,-.6,0,Math.PI*2);b.fill();b.stroke();
    b.beginPath();b.ellipse(9,-27,7,13,.6,0,Math.PI*2);b.fill();b.stroke();b.restore()}
  b.globalAlpha=.32;cup(W-21,H*.42,.9);plant(13,H*.68,.8);
  b.globalAlpha=.2;b.strokeStyle=ink;b.beginPath();b.moveTo(W-12,H*.72);b.lineTo(W-12,H*.9);b.stroke();
  b.fillStyle=paper;rr(W-24,H*.7,24,20,9);b.fill();b.stroke();
}
function heart(x,y,size,alpha){
  ctx.save();ctx.translate(x,y);ctx.scale(size,size);ctx.globalAlpha=alpha;
  ctx.fillStyle=col('--soft');ctx.strokeStyle=col('--line');ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,5);ctx.bezierCurveTo(-16,-4,-10,-15,0,-7);ctx.bezierCurveTo(10,-15,16,-4,0,5);ctx.fill();ctx.stroke();ctx.restore();
}
function resize(){
  W=cv.clientWidth;H=cv.clientHeight;var d=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(W*d));cv.height=Math.max(1,Math.round(H*d));ctx.setTransform(d,0,0,d,0,0);
  if(W&&H)makeBackground();
}
function render(){
  if(!W||!H)return;ctx.clearRect(0,0,W,H);if(bgLayer)ctx.drawImage(bgLayer,0,0,W,H);
  var t=reduced?0:clock;heart(W*.07,H*.29+Math.sin(t*.65)*4,1,.45);heart(W*.92,H*.56+Math.sin(t*.5+2)*4,.7,.35);
}
function frame(now){requestAnimationFrame(frame);var dt=last?Math.min((now-last)/1000,.1):0;last=now;clock+=dt;render()}
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
