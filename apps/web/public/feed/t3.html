<head>


<title>나의 아이돌 취향</title>
<style>
:root{--bg:#141428;--paper:#fbfbf5;--ink:#202033;--act:#ffd23f;--c:#c81d3a}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--paper);font-family:var(--body-font,system-ui,sans-serif)}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
[hidden]{display:none!important}
.scr,#play{position:absolute;inset:0;overflow:hidden;padding:calc(12px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(12px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px))}
.scr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
h1,h2,p{margin:0;word-break:keep-all}
h1,h2,button,#final{font-family:var(--title-font,system-ui,sans-serif);font-weight:900;letter-spacing:-.03em}
h1{font-size:clamp(30px,5.4vh,36px);line-height:1.12}
p{font-size:clamp(14px,2.45vh,16px);line-height:1.45}
button{min-height:64px;border:3px solid var(--ink);border-radius:8px;cursor:pointer;font-size:18px;color:var(--ink);background:var(--act);box-shadow:0 5px 0 var(--ink);padding:10px 18px;touch-action:manipulation}
button:active{box-shadow:0 2px 0 var(--ink);background:#fff1a3}
#go{width:min(100%,280px);flex-shrink:0}
#start{justify-content:center}
#start h1{color:#fff}
#start>p{max-width:360px}
#start .tagline{font-size:clamp(12px,2vh,14px);color:#d5d4e0}
#start .tape{font-family:monospace;font-weight:800;background:var(--act);color:var(--ink);padding:5px 15px;transform:rotate(-2deg);font-size:12px}
#start .badge{font-family:monospace;font-size:12px;letter-spacing:.08em;color:var(--act)}
#hc{display:block;width:100%;flex:1;min-height:45px;max-height:310px;object-fit:contain}
#start #hc{max-height:290px}
#play{display:flex;flex-direction:column;gap:12px}
#hud{display:flex;align-items:center;gap:12px;flex-shrink:0;order:3;padding:8px 0 0}
#sc{font-size:16px;white-space:normal}
#info{font-size:12px;color:#d4d2e1}
.bulbs{display:flex;gap:6px;flex:1}
.bulbs i{height:10px;flex:1;border:1px solid #78747b;background:#302f40;border-radius:3px}
.bulbs i.on{background:var(--act);border-color:var(--act)}
.scene{flex:1;min-height:30px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.scene p{font-size:12px;letter-spacing:.12em;background:#232234e8;padding:6px 12px;border:1px solid #686477;border-radius:3px;color:#f4dc85}
.question{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 #ffd23f;border-radius:3px 15px 15px 15px;padding:14px 14px 15px;position:relative}
#speaker{display:block;font-size:12px;color:#655929;margin-bottom:7px;font-weight:800}
#question{font-size:clamp(20px,3.5vh,24px);font-weight:800;line-height:1.32;word-break:keep-all}
#choices{display:grid;grid-template-columns:1fr;gap:9px;flex-shrink:0}
.choice{display:flex;gap:10px;text-align:left;align-items:center;background:var(--paper);border-left:8px solid var(--act);font-size:clamp(17px,2.6vh,18px);line-height:1.25;min-height:64px;padding:8px 12px;box-shadow:3px 4px 0 #38364b}
.choice .letter{font-family:monospace;font-size:12px;color:#746000;flex-shrink:0}
.choice.chosen{background:#fff0a5;border-color:var(--act);box-shadow:0 0 0 2px #fff7cd}
.choice:disabled{color:var(--ink);opacity:1;cursor:default}
#judging{position:absolute;inset:0;background:#141428dd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:5}
#judging p{font-size:26px;font-weight:800}
#judging span{display:inline-flex;align-items:center;justify-content:center;width:62px;height:74px;border:4px solid var(--ink);background:var(--act);color:var(--ink);font-size:28px;margin:0 5px;animation:lift .5s ease both}
#judging span:nth-child(2){animation-delay:.08s}
#judging span:nth-child(3){animation-delay:.16s}
@keyframes lift{from{transform:translateY(25px);opacity:0}to{transform:translateY(0);opacity:1}}
#over{gap:8px;justify-content:center}
#over #hc{border-bottom:4px solid var(--c);max-height:310px}
#why{font-size:12px;letter-spacing:.08em;color:var(--act)}
#final{font-size:clamp(28px,5.3vh,38px);line-height:1.1;color:#fff}
#shareline{font-size:clamp(14px,2.5vh,17px);color:#ffe78d}
#description{max-width:430px;font-size:clamp(13px,2.2vh,15px);line-height:1.45}
#traits{font-size:12px;color:#d7d6e6}
#match{font-size:12px;color:#e8e6ed;line-height:1.55}
.lb-rec{font-size:12px;color:#bdbacb}
#sub{font-size:12px;color:#aaa8bd}
#actions{display:flex;gap:10px;width:100%;justify-content:center;flex-shrink:0}
#actions button{min-width:0;flex:1;max-width:210px;font-size:clamp(16px,2.8vh,18px);padding:8px}
#rank{background:var(--paper)}
.pop{animation:pop .18s ease}
@keyframes pop{50%{transform:scale(1.04)}}
@media(max-height:540px){
.scr,#play{gap:7px;padding-top:calc(8px + var(--lb-safe-top,0px));padding-bottom:calc(8px + var(--lb-safe-bottom,0px))}
#choices{grid-template-columns:1fr 1fr;gap:8px}
.choice{font-size:15px;min-height:64px;padding:8px 6px;gap:6px}
.question{padding:9px 12px}
#question{font-size:20px}
#speaker{margin-bottom:4px}
#start .tagline{display:none}
#description .growth{display:none}
#match{display:none}
#over{gap:5px}
#over #hc{min-height:35px}
#final{font-size:28px}
#description{font-size:12px;line-height:1.3}
}
@media(max-height:390px){
#traits,#sub,.lb-rec,#start .badge,#start .tape{display:none}
#start h1{font-size:27px}
#start>p{font-size:12px}
#start #hc{min-height:30px}
#question{font-size:17px}
#speaker,.scene{display:none}
#play{justify-content:center}
#hud{padding:0}
#info{display:none}
.choice{font-size:14px;line-height:1.15}
#over #hc{min-height:25px}
#description{font-size:11px}
#shareline{font-size:12px}
#final{font-size:25px}
#actions button{min-height:64px}
}
#rp{width:100%;flex:1;min-height:0;max-height:600px;display:flex;flex-direction:column}
#rp>section{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;padding:8px 4px}
#resultArt{display:block;min-height:50px;width:auto;max-width:100%;height:48%;object-fit:contain;border-bottom:4px solid var(--c)}
#rp #traits{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:14px}
#traits span{padding:8px 10px;background:#302b42;border:1px solid var(--c);border-radius:18px}
#rp #description{display:block;font-size:16px;line-height:1.65}
#rp #description .growth{display:inline}
#rp #match{display:grid;width:100%;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.match-card{min-width:0;padding:8px;background:#242137;border:1px solid #514860;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.match-card img{width:100%;height:clamp(55px,20vh,150px);object-fit:contain}
.match-card b{font-size:16px;word-break:keep-all}
#rp .lb-rec,#rp #sub{display:block}
#pageNav{display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0;width:100%}
#pageNav button{min-width:64px;min-height:64px;padding:8px 14px;font-size:16px;background:var(--paper)}
#pageNav button:disabled{opacity:.35;cursor:default}
#pageCount{min-width:55px;font-size:16px}
@media(max-height:390px){
#rp>section{gap:7px;padding:4px}
#rp #description{font-size:14px;line-height:1.45}
#rp #traits{gap:5px;font-size:12px}
#traits span{padding:5px 7px}
#rp #match{font-size:12px}
.match-card{padding:5px;gap:3px}
.match-card img{height:55px}
.match-card b{font-size:14px}
#rp .lb-rec,#rp #sub{font-size:11px}
#pageNav{gap:8px}
}

<div id="app">
<canvas id="cv"></canvas>
<div id="start" class="scr">
<p class="tape">제3회 공개 오디션</p>
<p class="badge">참가번호 027</p>
<h1>나의 아이돌 취향</h1>
<p>오늘의 무대, 당신의 시선은 누구에게 꽂힐까?</p>

<p class="tagline">최애는 바뀌는데 취향은 안 바뀌는 사람<br>카리스마 센터부터 햄찌상까지<br>나의 아이돌 취향은 무엇일까?</p>
<button id="go" type="button">오디션 시작</button>
</div>
<div id="play" hidden>
<div class="scene"><p id="sceneLabel">생방송 무대의 객석이에요</p></div>
<div class="question"><span id="speaker"></span><p id="question"></p></div>
<div id="choices"></div>
<div id="hud" hidden><b id="sc">1/10</b><div class="bulbs" aria-label="열 개의 질문 진행 상황"></div><span id="info"></span></div>
</div>

function resize(){
 W=cv.clientWidth;H=cv.clientHeight;const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
 stageWash=ctx.createRadialGradient(W*.5,H*.12,0,W*.5,H*.2,Math.max(W,H)*.75);
 stageWash.addColorStop(0,'#56513b');stageWash.addColorStop(.42,'#262333');stageWash.addColorStop(1,PAL[0]);
 render();
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function hud(){
 const a=(qIndex+1)+'/10',b='라운드 '+(qIndex+1);
 if(a!==hs){$('sc').textContent=hs=a;[...$('hud').querySelectorAll('i')].forEach((el,i)=>el.classList.toggle('on',i<=qIndex))}
 if(b!==hi)$('info').textContent=hi=b;
}
function showQuestion(){
 const item=questions[qIndex];$('speaker').textContent=item.who;$('sceneLabel').textContent=item.scene;$('question').textContent=item.q;
 choiceButtons.forEach((b,i)=>{b.lastChild.textContent=item.a[i];b.classList.remove('chosen');b.disabled=false});
 hud();
}
function reset(){
 t=0;acc=0;endT=0;qIndex=0;lock=0;chosen=-1;answerLog=[];scores=Array(16).fill(0);tie=Array(16).fill(0);reported=false;hs=hi='';
 resultIndex=0;$('judging').hidden=true;$('final').textContent='';showQuestion();
}
function start(){
 reset();state='play';$('start').hidden=$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
 $('start').insertBefore(poster,$('start').querySelector('.tagline'));
 lb.audio.unlock();lb.audio.sfx(CLICK);lb.audio.music(MUSIC,{loop:true,volume:.28});
}
function answer(i){
 if(state!=='play'||lock>0)return;
 chosen=i;answerLog.push(i);const pair=questions[qIndex].p[i],points=weights[qIndex][i];
 pair.forEach((r,j)=>{scores[r]+=points[j];tie[r]+=(qIndex+1)*(j===0?1:.37)});
 choiceButtons.forEach((b,n)=>{b.disabled=true;b.classList.toggle('chosen',n===i)});
 lb.audio.sfx(CLICK);lb.haptic('light');
 const box=choiceButtons[i].getBoundingClientRect();
 lb.fx.sparkle(box.x+box.width*.85,box.y+box.height*.5);
 lock=.18;
}
function chooseResult(){
 let peak=-1,winner=0;
 for(let i=0;i<16;i++){
  const value=scores[i]+tie[i]/1000;
  if(value>peak){peak=value;winner=i}
 }
 resultIndex=winner;
}
function die(x,y,why,win){
 if(state!=='play')return;
 state='dying';endT=.72;chooseResult();$('why').textContent=why;$('judging').hidden=false;
 lb.audio.stopMusic();lb.audio.sfx(WIN);lb.haptic('success');lb.fx.confetti();
}
let resultPage=0;
function pages(container,index=0){
 const sheets=Array.from(container.children);
 resultPage=Math.max(0,Math.min(sheets.length-1,index));
 sheets.forEach((sheet,i)=>{sheet.hidden=i!==resultPage;if(i===resultPage)sheet.scrollTop=0});
 $('prevPage').disabled=resultPage===0;
 $('nextPage').disabled=resultPage===sheets.length-1;
 $('pageCount').textContent=(resultPage+1)+' / '+sheets.length;
}
function portraitImage(img,index){
 const card=document.createElement('canvas');card.width=240;card.height=300;
 const paint=card.getContext('2d');
 paint.fillStyle='#f8f7f0';paint.fillRect(0,0,240,300);
 paint.fillStyle=results[index][1];paint.fillRect(0,0,240,10);
 drawHero(paint,120,300,284,index);
 img.src=card.toDataURL();img.alt=results[index][0]+' 인물이에요';
}
function result(){
 state='over';overAt=clock;$('judging').hidden=true;$('play').hidden=true;$('hud').hidden=true;
 const r=results[resultIndex];document.documentElement.style.setProperty('--c',r[1]);
 $('final').textContent=r[0];$('shareline').textContent=r[4];
 $('description').replaceChildren(document.createTextNode(r[5]+' '));
 const growth=document.createElement('span');growth.className='growth';growth.textContent=r[6];$('description').appendChild(growth);
 $('traits').replaceChildren();
 r[7].forEach(text=>{const chip=document.createElement('span');chip.textContent='#'+text;$('traits').appendChild(chip)});
 $('goodName').textContent=r[2];$('otherName').textContent=r[3];
 portraitImage($('resultArt'),resultIndex);
 portraitImage($('goodArt'),results.findIndex(item=>item[0]===r[2]));
 portraitImage($('otherArt'),results.findIndex(item=>item[0]===r[3]));
 $('record').textContent='열 번의 선택에서 찾은 '+r[8]+'이에요.';
 $('over').hidden=false;pages(document.getElementById('rp'));bump($('final'));
 if(!reported){reported=true;lb.done(r[0])}
}
function update(dt){
 t+=dt;
 if(lock>0){
  lock-=dt;
  if(lock<=0){
   if(qIndex===9){die(W/2,H/2,'나의 데뷔 포토카드예요',true)}
   else{qIndex++;chosen=-1;showQuestion()}
  }
 }
}
function line(c,points,color,width){
 c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.strokeStyle=color;c.lineWidth=width;c.stroke();
}
function drawLightstick(c,x,y,s,angle,color){
 c.save();c.translate(x,y);c.rotate(angle);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
 c.fillStyle='#f4f2ed';c.strokeStyle='#26243d';c.lineWidth=3;
 c.beginPath();c.roundRect(-5,0,10,33,3);c.fill();c.stroke();
 c.beginPath();c.moveTo(0,4);c.bezierCurveTo(-28,-11,-15,-30,0,-18);c.bezierCurveTo(15,-30,28,-11,0,4);
 c.fillStyle=color;c.fill();c.stroke();
 line(c,[[-8,-15],[-5,-19]],'#fff6ee',3);
 c.fillStyle='#aaa1bc';c.fillRect(-3,20,6,3);
 c.restore();
}
function drawStage(){
 ctx.fillStyle=stageWash||PAL[0];ctx.fillRect(0,0,W,H);
 const sway=reduced?0:Math.sin(clock*.35)*W*.025;
 ctx.save();ctx.globalAlpha=.10;ctx.fillStyle='#fff4bd';ctx.beginPath();
 ctx.moveTo(W*.5+sway,-20);ctx.lineTo(W*.13,H*.65);ctx.quadraticCurveTo(W*.5,H*.76,W*.87,H*.65);ctx.closePath();ctx.fill();ctx.restore();
 const top=H*.12,bottom=H*.49;
 ctx.fillStyle='#222031';ctx.fillRect(W*.1,top,W*.8,bottom-top);
 ctx.strokeStyle='#50485b';ctx.lineWidth=3;ctx.strokeRect(W*.1,top,W*.8,bottom-top);
 ctx.save();ctx.globalAlpha=.22;
 for(let i=0;i<9;i++){
  const x=W*(.14+i*.09);line(ctx,[[x,top+5],[x,bottom-5]],i%2?'#e6d37b':'#737081',2);
 }
 for(let i=0;i<5;i++)line(ctx,[[W*.11,top+(bottom-top)*i/5],[W*.89,top+(bottom-top)*i/5]],'#797282',1);
 ctx.restore();
 ctx.fillStyle='#272735';ctx.beginPath();ctx.moveTo(0,H*.72);ctx.lineTo(W*.15,H*.5);ctx.lineTo(W*.85,H*.5);ctx.lineTo(W,H*.72);ctx.closePath();ctx.fill();
 line(ctx,[[0,H*.73],[W,H*.73]],'#444051',3);
 line(ctx,[[W*.48,H*.66],[W*.53,H*.69]],'#bda436',4);
 line(ctx,[[W*.53,H*.66],[W*.48,H*.69]],'#bda436',4);
 ctx.save();ctx.globalAlpha=.45;
 line(ctx,[[W*.92,H*.14],[W*.84,H*.32],[W*.69,H*.38]],'#6c6678',7);
 ctx.fillStyle='#8a8393';ctx.fillRect(W*.64,H*.365,W*.065,12);
 ctx.fillStyle='#baa76d';ctx.beginPath();ctx.moveTo(W*.78,H*.46);ctx.lineTo(W*.84,H*.46);ctx.lineTo(W*.83,H*.5);ctx.lineTo(W*.79,H*.5);ctx.closePath();ctx.fill();ctx.fillRect(W*.805,H*.5,3,H*.025);ctx.fillRect(W*.785,H*.525,W*.05,4);
 ctx.restore();
 for(let i=0;i<12;i++){
  const x=(i+.5)*W/12,y=H*.91+Math.sin(i*2)*H*.025;
  ctx.fillStyle='#1c1c2c';ctx.beginPath();ctx.ellipse(x,y+17,20,27,0,0,Math.PI*2);ctx.fill();
  drawLightstick(ctx,x+6,y-6,.55,reduced?-.2:Math.sin(clock*1.3+i)*.24,i%3===0?'#dbc954':'#ae6e93');
 }
 if(state==='play')drawLightstick(ctx,W*.88,H*.51,Math.max(.7,Math.min(W,H)/360),reduced?-.12:Math.sin(clock)*.09-.12,PAL[2]);
}
function drawHero(c,x,y,h,index){
 lb.assets.draw(c,'gen/r'+(index+1),x,y-h*.5,h*.76,h);
}
function drawPoster(){
 hc.setTransform(1,0,0,1,0,0);hc.clearRect(0,0,640,500);
 if(state==='over'){
  hc.fillStyle='#f8f7f0';hc.strokeStyle='#242236';hc.lineWidth=8;
  hc.beginPath();hc.roundRect(142,10,356,480,20);hc.fill();hc.stroke();
  hc.fillStyle=results[resultIndex][1];hc.fillRect(150,18,340,16);
  hc.save();hc.beginPath();hc.roundRect(154,36,332,444,12);hc.clip();drawHero(hc,320,490,450,resultIndex);hc.restore();
  hc.strokeStyle='#fff';hc.lineWidth=4;hc.beginPath();hc.moveTo(162,70);hc.lineTo(162,40);hc.lineTo(195,40);hc.stroke();
 }else{
  const breath=reduced?0:Math.sin(clock*1.4)*4;
  hc.save();hc.translate(177,265);hc.rotate(-.08);hc.fillStyle='#f9f7ef';hc.strokeStyle='#29263b';hc.lineWidth=7;
  hc.beginPath();hc.roundRect(-116,-220,232,395,12);hc.fill();hc.stroke();drawHero(hc,0,166,375,0);hc.restore();
  hc.save();hc.translate(468,275);hc.rotate(.08);hc.fillStyle='#f9f7ef';hc.strokeStyle='#29263b';hc.lineWidth=7;
  hc.beginPath();hc.roundRect(-116,-220,232,395,12);hc.fill();hc.stroke();drawHero(hc,0,166,375,2);hc.restore();
  hc.fillStyle='#fff8d9';hc.strokeStyle='#29263b';hc.lineWidth=8;
  hc.beginPath();hc.roundRect(198,40+breath,244,425,15);hc.fill();hc.stroke();drawHero(hc,320,463+breath,408,1);
  hc.fillStyle=PAL[3];hc.fillRect(216,46+breath,208,12);
 }
}
function render(){
 if(!W||!H)return;
 ctx.lineCap='round';ctx.lineJoin='round';drawStage();drawPoster();
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(paused)return;
 if(!W||!H){resize();return}
 clock+=dt;
 if(state==='play'){
  acc+=dt;while(acc>=STEP&&state==='play'){update(STEP);acc-=STEP}
 }else if(state==='dying'){
  endT-=dt;if(endT<=0)result();
 }
 render();
}
lb.onPause(p=>{paused=p;last=0;choiceButtons.forEach(b=>{if(lock<=0)b.classList.remove('chosen')})});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.7)start()});
$('rank').addEventListener('click',()=>lb.share('나의 아이돌 취향은 '+results[resultIndex][0]+'! '+results[resultIndex][4]));
function turnResultPage(delta){
 if(state!=='over')return;
 pages($('rp'),resultPage+delta);
 lb.audio.sfx(CLICK);lb.haptic('light');
 const box=$('pageCount').getBoundingClientRect();
 lb.fx.sparkle(box.x+box.width*.5,box.y+box.height*.5);
}
$('prevPage').addEventListener('click',()=>turnResultPage(-1));
$('nextPage').addEventListener('click',()=>turnResultPage(1));
lb.assets.font('font/blackhansans').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/dohyeon').then(v=>document.documentElement.style.setProperty('--body-font',v));
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
