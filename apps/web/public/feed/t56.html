<style>.lbi{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

:root{--bg:#fff4ec;--card:#ffffff;--ink:#3a2a20;--sub:#796e67;--line:#ebe0d8;--ac:#ff7a45;--aci:#9d5233;--soft:#ffdfd2;--soft2:#fff2ec;
--ft:"TR Title","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--fb:"TR Body","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg)}body{color:var(--ink);font:400 15px/1.5 var(--fb);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}img{display:block}
.tr{--lb-safe-top:0px;max-width:480px;margin:0 auto;min-height:100vh}.scr{padding-bottom:28px}.scr[hidden]{display:none}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:52px;padding:0 6px}.bar h1{font:700 17px/1 var(--fb);text-align:center;letter-spacing:-.01em}
.ic-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}.ic-btn[hidden]{visibility:hidden;display:grid}.ic{width:24px;height:24px}.bar-r{display:grid;justify-items:end}
#s-pick[data-tr-fit]:not([hidden]){display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding-bottom:0}#s-pick[data-tr-fit]>*{flex:none}#s-pick[data-tr-fit]>.tr-fill{flex:1 1 0;min-height:0}
[data-tr-feed] #s-pick[data-tr-fit]>.bar{display:none}[data-tr-feed]{--tr-pick-top:max(clamp(24px,4.5vh,40px),calc(var(--lb-cover-top,0px) + 12px))}[data-tr-feed] #s-pick[data-tr-fit]:not([hidden]){padding-top:var(--tr-pick-top);transition:padding-top .2s}
html,body{background:color-mix(in srgb,var(--bg) 80%,var(--ink) 6%)}
.paper{position:relative;margin:8px 14px 0;background:#fffdf9;padding:20px 18px 22px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.paper::before,.paper::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 6px 0,#fffdf9 5.5px,transparent 6px) 0 0/12px 10px repeat-x}
.paper::before{top:-10px;transform:scaleY(-1)}.paper::after{bottom:-10px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.shop{text-align:center}.t1,.t2,.shop-t{font-family:var(--ft);font-weight:900;letter-spacing:-.02em;line-height:1.12;text-wrap:balance}.t2{color:var(--ac)}
.shop-sub{font-size:12.5px;color:var(--sub);margin-top:6px}
.dash{border-top:1.5px dashed var(--line);margin:12px 0}
.kv{display:flex;align-items:baseline;gap:6px;font-size:14.5px;line-height:1.8}.kv span{display:inline-flex;align-items:center;gap:5px;color:var(--sub);flex:none}.kv i{flex:1;min-width:12px;border-bottom:1.5px dotted var(--line);transform:translateY(-4px)}.kv b{font-weight:800;text-align:right;min-width:0}
.kv.item span{color:var(--ink);font-weight:700}.kv .ic{width:18px;height:18px;color:var(--aci)}
.sec-h{display:flex;align-items:center;gap:5px;font:800 14px/1.3 var(--fb);color:var(--aci);margin-bottom:8px}.sec-h .ic{width:18px;height:18px}
.pk{height:52px;border-radius:8px;border-style:dashed}
.head{position:relative;display:grid;grid-template-columns:44% 1fr;align-items:end;gap:10px;margin-top:10px}
.head-art{height:min(170px,44vw);display:flex;align-items:flex-end;justify-content:center}.head-art .hero{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:50% 100%}.head-art .ph{width:80%;aspect-ratio:1;border-radius:50%;background:var(--soft)}
.head-txt{min-width:0;padding-bottom:4px}.code{font-family:var(--ft);font-weight:900;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.nick{font-weight:800;font-size:16px;margin-top:8px}.quote{font-size:13.5px;color:var(--sub);margin-top:6px}
.stamp{width:78px;height:78px;margin:0 2px 10px auto;border-radius:50%;border:3px solid color-mix(in srgb,var(--aci) 78%,transparent);color:var(--aci);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-14deg);font-size:11.5px;font-weight:800}
.stamp b{font-family:var(--ft);font-size:24px;line-height:1;font-weight:900}
.txt{font-size:14.5px;line-height:1.6}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:15px}.total b{font-family:var(--ft);font-size:22px;color:var(--aci);font-weight:900}
.barcode{height:40px;margin:12px auto 6px;width:86%;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px)}
.pad{padding:18px 14px 0}
.txt-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;margin-top:6px;font-size:16px;font-weight:600}.txt-btn .ic{width:20px;height:20px}
.out-btn{display:block;width:100%;height:52px;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);font-weight:700;font-size:16.5px}
.mine-wrap{text-align:center;min-height:4px;margin-top:8px}.mine{display:inline-block;font-size:13.5px;font-weight:700;color:var(--aci);background:var(--soft);border-radius:999px;padding:4px 12px}
.list{display:flex;flex-direction:column}
.rk{display:grid;grid-template-columns:26px 32px minmax(40px,max-content) 1fr;align-items:center;gap:7px;min-height:44px;padding:2px 0;border-bottom:1px dashed var(--line);text-align:left;font-size:14px}
.rk-n{font-weight:800;color:var(--sub)}.rk.lead .rk-n{color:var(--aci)}
.rk-art{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:var(--soft2)}.rk .ph{display:block;width:32px;height:32px;border-radius:50%;background:var(--soft)}
.rk-c{font-weight:800;white-space:nowrap}.rk-nick{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rk.me{background:var(--soft);border-radius:8px;border-bottom-color:transparent}.rk.me .rk-c{color:var(--aci)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px}
.pk{position:relative;height:56px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;transition:background .15s,border-color .15s}
.pk[aria-pressed=true]{background:var(--soft);border-color:var(--ac);overflow:visible}.pk:disabled{opacity:.35}
.ck{display:none;position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;place-items:center}.ck .ic{width:14px;height:14px;stroke-width:3}.pk[aria-pressed=true] .ck{display:grid}
.cta{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;height:58px;margin-top:20px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:18px;letter-spacing:-.01em}.cta .ic{width:20px;height:20px;stroke-width:2.4}.cta:disabled{opacity:.3;cursor:default}
.foot{text-align:center;color:var(--sub);font-size:13px;margin-top:14px;opacity:.85}
.toast{position:fixed;left:50%;bottom:calc(var(--lb-safe-bottom,0px) + 24px);transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;z-index:9}
.toast[hidden]{display:none}[data-lb-art-missing]{visibility:hidden}
.pad .cta{margin-top:0}
#s-pick .paper{display:flex;flex-direction:column;margin-bottom:10px}#s-pick .pick-box{flex:1 1 0;display:flex;flex-direction:column;justify-content:center}#s-pick .gap{flex:0 1 52px;min-height:0;display:flex;align-items:flex-end;overflow:hidden}#s-pick .gap .barcode{flex:none;margin-bottom:0;height:min(40px,100%)}#s-pick .dash{margin:clamp(6px,1.5vh,12px) 0}
#s-pick .pk{height:clamp(44px,8vh,64px)}#s-pick .pad{padding-top:clamp(8px,1.6vh,14px);padding-bottom:max(10px,var(--lb-safe-bottom,0px))}#s-pick .pad .cta{height:clamp(46px,7.4vh,56px)}
