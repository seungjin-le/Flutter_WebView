<head>


<title>에겐남 테토남 테스트</title>
<style>
:root{--sky:#b9ddfc;--bg:#f5faff;--paper:#ffffffdf;--ink:#263857;--act:#3d59a8;--acc:#3d59a8;--pk:#ee8eb0;--sh:#5a7fc02b;--c:#5a8fd6}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky)}
body{color:var(--ink);font-family:var(--body-font,serif)}
button{font-family:var(--title-font,sans-serif);cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(var(--sky),var(--bg) 78%)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:calc(18px + var(--lb-safe-top,0px)) calc(20px + var(--lb-safe-right,0px)) calc(16px + var(--lb-safe-bottom,0px)) calc(20px + var(--lb-safe-left,0px));overflow:hidden}
h1,p{margin:0;word-break:keep-all}
h1,#final{font-family:var(--title-font,sans-serif);font-weight:400;letter-spacing:-.02em;color:var(--acc);-webkit-text-stroke:6px #fff;paint-order:stroke fill}
h1{font-size:clamp(29px,5.1vh,36px);line-height:1.15}
#start{padding-top:calc(56px + var(--lb-safe-top,0px));gap:8px}
#start .eyebrow{font-size:13px;letter-spacing:.12em;color:#415b82}
#start .hook{font-size:clamp(14px,2.4vh,17px);line-height:1.65}
#start .lead{font-size:clamp(15px,2.6vh,18px);color:var(--act)}
#start .note{font-size:12px;line-height:1.5;color:#52647e}
#hc{display:block;flex:1 1 0;width:100%;min-height:35px;max-height:340px;object-fit:contain}
.btn{border:2px solid #ffffffbb;min-height:64px;flex-shrink:0;padding:0 24px;border-radius:40px;background:var(--act);color:white;font-size:22px;box-shadow:0 6px 16px var(--sh)}
#go{width:85%;max-width:330px}
.btn:active{background:#30488c;box-shadow:0 2px 6px var(--sh)}
#hud{position:absolute;top:calc(18px + var(--lb-safe-top,0px));left:calc(22px + var(--lb-safe-left,0px));right:calc(22px + var(--lb-safe-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:3;pointer-events:none}
#sc{font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
#hearts{display:flex;align-items:center;gap:9px}
.heart{position:relative;width:10px;height:10px;background:#ffffffb8;transform:rotate(-45deg);border-radius:2px}
.heart:before,.heart:after{content:"";position:absolute;width:10px;height:10px;background:inherit;border-radius:50%}
.heart:before{top:-5px;left:0}.heart:after{left:5px;top:0}
.heart.past{background:#668bc7}.heart.now{background:#ec8eaf}
#play{padding-top:calc(70px + var(--lb-safe-top,0px));justify-content:center;gap:clamp(14px,3.6vh,26px)}
#place{font-size:14px;letter-spacing:.06em;color:#435d83}
.box{position:relative;width:100%;padding:28px 20px 26px;background:var(--paper);border:2px solid #fff;border-radius:24px;box-shadow:0 7px 24px var(--sh)}
.tag{position:absolute;left:18px;top:-14px;padding:4px 14px;border-radius:20px;background:var(--acc);color:white;font-size:13px}
#question{font-size:clamp(19px,3.2vh,23px);font-weight:400;line-height:1.65}
.box:after{content:"";position:absolute;right:20px;bottom:13px;border:5px solid transparent;border-top-color:#7c9ac5;animation:blink 2s infinite}
#choices{width:85%;display:flex;flex-direction:column;gap:12px}
.opt{width:100%;min-height:60px;padding:12px 10px;display:grid;place-items:center;border:2px solid white;border-radius:20px;background:var(--paper);color:var(--ink);box-shadow:0 5px 18px var(--sh);font-family:var(--body-font,serif);font-size:clamp(16px,2.6vh,18px);line-height:1.4;animation:enter .24s both}
.opt:active,.opt.on{background:#fff1f7;box-shadow:0 0 0 3px var(--pk);transform:scale(.98)}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
#notice{font-size:14px;min-height:23px;color:#455f87}
#over{gap:7px}
#why{font-size:12px;color:#4c6389;flex-shrink:0}
#final{font-size:clamp(30px,5.1vh,40px);line-height:1.15;flex-shrink:0}
#shareline{font-size:clamp(13px,2.2vh,16px);line-height:1.4;flex-shrink:0}
#chips{display:flex;justify-content:center;gap:6px;flex-shrink:0}
#chips span{font-size:12px;padding:5px 9px;border:1px solid white;border-radius:20px;background:#ffffffb5;color:#324b73}
#description{font-size:clamp(13px,2.2vh,16px);line-height:1.55;background:#ffffffa8;border:1px solid white;border-radius:17px;padding:10px 13px;width:100%;flex-shrink:0}
#meters{font-size:clamp(15px,2.5vh,18px);color:#334f87;font-variant-numeric:tabular-nums;flex-shrink:0}
#match{font-size:12px;line-height:1.65;flex-shrink:0;color:#3e5676}
#match span{display:block}
#resultActions{display:flex;width:100%;gap:10px;flex-shrink:0}
#resultActions button{flex:1;min-width:0;padding:0 10px;font-size:21px}
#again{background:#fff;color:var(--act);border-color:#c2d4f0}
.lb-rec{font-size:12px;color:#536887;flex-shrink:0}
.spk{position:absolute;width:10px;height:10px;background:#fff;clip-path:polygon(50% 0,60% 38%,100% 50%,60% 62%,50% 100%,40% 62%,0 50%,40% 38%);opacity:.7;animation:blink 4s infinite;pointer-events:none}
.s1{left:7%;top:24%}.s2{right:8%;top:33%;animation-delay:1s}.s3{left:14%;bottom:18%;animation-delay:2s}
@keyframes blink{50%{opacity:.25}}
@keyframes enter{from{opacity:0;translate:0 7px}to{opacity:1;translate:0 0}}
@media(max-height:590px){
.screen{gap:5px;padding-top:calc(10px + var(--lb-safe-top,0px));padding-bottom:calc(10px + var(--lb-safe-bottom,0px))}
#start{padding-top:calc(20px + var(--lb-safe-top,0px))}
#over{gap:4px}#description{padding:7px 10px;font-size:13px}#match{display:none}
#chips span{padding:3px 7px}
#play{gap:15px;padding-top:calc(60px + var(--lb-safe-top,0px))}
#choices{gap:8px}.opt{min-height:52px;padding:8px}.box{padding:21px 14px}
}
@media(max-height:430px){
#start .hook,#start .note,#chips,#description,#match,.lb-rec{display:none}
#start{gap:4px;padding-top:calc(7px + var(--lb-safe-top,0px))}
h1{font-size:28px}#final{font-size:30px}
.btn{min-height:64px;font-size:20px}
#over{gap:3px}#shareline{font-size:12px}#meters{font-size:14px}
#play{gap:7px;padding-top:calc(48px + var(--lb-safe-top,0px))}
#place{display:none}#question{font-size:17px;line-height:1.3}
.box{padding:14px 10px}#choices{gap:5px;width:94%;flex-direction:row;flex-wrap:wrap}
.opt{width:calc(50% - 3px);min-height:50px;font-size:14px}
#notice{font-size:12px;min-height:16px}
}

let W=0,H=0,state='start',paused=false,last=0,clock=0,index=0,values=[],answers=[],lock=0,chosen=-1,hash=0,resultIndex=0,egen=50,teto=50,overAt=0,hw=0,hh=0,oldProgress='';
const hearts=[];
for(let i=0;i<questions.length;i++){const el=document.createElement('i');el.className='heart';$('hearts').appendChild(el);hearts.push(el)}
lb.assets.font('font/yeonsung').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/gowunbatang').then(v=>document.documentElement.style.setProperty('--body-font',v));

function resize(){
W=cv.clientWidth;H=cv.clientHeight;
const d=Math.min(devicePixelRatio||1,2);
cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
resizeHero();render();
}
function resizeHero(){
const r=hero.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
if(r.width<1||r.height<1)return;
if(hw===r.width&&hh===r.height)return;
hw=r.width;hh=r.height;hero.width=Math.round(hw*d);hero.height=Math.round(hh*d);hc.setTransform(d,0,0,d,0,0);
}
function hud(){
const s=(index+1)+'/'+questions.length;
if(s!==oldProgress){$('sc').textContent=s;oldProgress=s;
hearts.forEach((el,i)=>el.className='heart'+(i<index?' past':i===index?' now':''))}
}
function reset(){
index=0;values=data.map(()=>0);answers=[];lock=0;chosen=-1;hash=17;egen=50;teto=50;oldProgress='';
$('notice').textContent='';document.documentElement.style.setProperty('--c','#5a8fd6');
}
function showQuestion(){
chosen=-1;$('place').textContent=questions[index].place;$('speaker').textContent=questions[index].tag;
$('question').textContent=questions[index].q;$('notice').textContent='';
$('choices').replaceChildren();
questions[index].a.forEach((answer,i)=>{
const button=document.createElement('button');button.type='button';button.className='opt';button.textContent=answer[0];
button.style.animationDelay=(i*.035)+'s';
button.addEventListener('pointerdown',e=>{if(e.isPrimary!==false)choose(i)});
button.addEventListener('click',()=>choose(i));
$('choices').appendChild(button);
});
hud();
}
function start(){
reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
lb.audio.unlock();lb.audio.sfx('sfx/boardgame-pack/card-slide3');showQuestion();
}
function choose(i){
if(state!=='play'||lock>0||chosen!==-1||paused)return;
chosen=i;answers.push(i);hash=(hash*31+(index+1)*13+i*17)>>>0;
questions[index].a[i][1].forEach(([r,p])=>values[r]+=p);
Array.from($('choices').children).forEach((button,j)=>{button.disabled=true;if(j===i)button.classList.add('on')});
lb.audio.sfx('sfx/ui-audio/click1');lb.haptic('light');
lock=index===questions.length-1?.65:.23;
$('notice').textContent=index===questions.length-1?'마음을 읽고 있어요…':'마음에 담았어요.';
}
function die(){
if(state!=='play')return;
state='ending';$('play').hidden=true;$('hud').hidden=true;
const max=Math.max(...values),ties=[];
values.forEach((v,i)=>{if(v===max)ties.push(i)});
resultIndex=ties[hash%ties.length];
let total=0,weighted=0;values.forEach((v,i)=>{total+=v;weighted+=v*data[i].teto});
teto=Math.round(weighted/Math.max(1,total));egen=100-teto;
result();
}
function result(){
state='over';overAt=clock;
const r=data[resultIndex];document.documentElement.style.setProperty('--c',r.color);
$('why').textContent='에겐력과 테토력이 나왔어요';
$('final').textContent=r.name;$('shareline').textContent=r.line;$('description').textContent=r.desc;
$('meters').textContent='에겐력 '+egen+'%  ·  테토력 '+teto+'%';
$('chips').replaceChildren();
r.chips.forEach(text=>{const chip=document.createElement('span');chip.textContent=text;$('chips').appendChild(chip)});
$('match').replaceChildren();
const a=document.createElement('span'),b=document.createElement('span');
a.textContent='잘 맞아요 · '+data[r.good].name;b.textContent='엇갈려요 · '+data[r.bad].name;$('match').append(a,b);
$('record').textContent='오늘의 선택에는 '+(egen>=teto?'에겐력':'테토력')+'이 더 담겼어요.';
$('over').insertBefore(hero,$('final'));hero.setAttribute('aria-label',r.name+' 캐릭터');
$('over').hidden=false;hw=0;hh=0;resizeHero();
lb.done(r.name);
lb.audio.sfx('sfx/interface-sounds/minimize-002');lb.audio.sfx('sfx/digital-audio/high-up');
lb.haptic('success');
const safe=lb.safe;lb.fx.sparkle(W/2,Math.max(safe.top+30,H*.25));lb.fx.confetti();
}
function update(dt){
if(state==='play'&&lock>0){
lock=Math.max(0,lock-dt);
if(lock===0){if(index===questions.length-1)die();else{index++;showQuestion()}}
}
}
function cloud(x,y,s){
ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#ffffffb0';ctx.beginPath();
ctx.ellipse(0,5,50,16,0,0,Math.PI*2);ctx.ellipse(-21,-3,22,21,0,0,Math.PI*2);ctx.ellipse(8,-12,29,27,0,0,Math.PI*2);ctx.ellipse(33,0,20,18,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
function background(){
ctx.clearRect(0,0,W,H);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,flow=reduced?0:Math.sin(clock*.1)*10;

ctx.strokeStyle='#708fb129';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,H*.22);ctx.quadraticCurveTo(W*.45,H*.29,W,H*.2);ctx.stroke();

for(let i=0;i<5;i++){const x=i*W/4-20,y=H*.76+(i%2)*12;ctx.fillRect(x,y,W/4-10,H-y);ctx.fillStyle='#ffffff45';ctx.fillRect(x+12,y+18,20,30);ctx.fillStyle='#b9cfdf29'}
ctx.strokeStyle='#8aaacc22';ctx.lineWidth=2;ctx.strokeRect(W*.06,H*.49,W*.16,H*.18);
ctx.beginPath();ctx.moveTo(W*.14,H*.49);ctx.lineTo(W*.14,H*.67);ctx.moveTo(W*.06,H*.58);ctx.lineTo(W*.22,H*.58);ctx.stroke();
}
function drawHero(){
if(!hw||!hh)return;
hc.clearRect(0,0,hw,hh);
hc.save();hc.fillStyle='#ffffff55';hc.beginPath();hc.ellipse(hw/2,hh*.55,Math.min(hw*.45,hh*.55),Math.max(1,hh*.43),0,0,Math.PI*2);hc.fill();hc.restore();

}else if(state==='over'){
const h=hh*.98,w=Math.min(hw*.95,h*.85);

}
}
function render(){
if(!W||!H)return;background();
if(state==='start'||state==='over'){resizeHero();drawHero()}
}
function frame(now){
requestAnimationFrame(frame);
const dt=last?Math.min((now-last)/1000,.05):0;last=now;
if(paused)return;clock+=dt;update(dt);render();
}
lb.onPause(p=>{paused=p;last=0});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.7)start()});

if(state!=='over')return;
const r=data[resultIndex];
lb.share('에겐남 테토남 테스트\n저는 '+r.name+'이에요.\n에겐력 '+egen+'% · 테토력 '+teto+'%\n'+r.line);
});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
