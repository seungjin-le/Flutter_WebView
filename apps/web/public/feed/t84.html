<title>숲속 이끼요정 캡슐 뽑기</title>
<style>
  /* 기본 색(원본 «비밀의 이끼 캡슐 머신») — 실행 팔레트가 오면 그 값으로 바뀌어요 */
  :where(:root){--bg:#EAF5E9;--card:#FFFFFF;--ink:#203A27;--sub:#566B5B;--line:#C6DDBB;--accent:#4E9F3D;--accent-ink:#FFFFFF;--soft:#D8E9A8;--soft2:#FFF3CD;--heart:#E74C3C;--gold:#FFB72B}
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: color-mix(in srgb, var(--accent) 35%, black);
    color: var(--ink);
    font-family: 'Jua', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  #app {
    width: 100%;
    max-width: 400px;
    height: 100vh;
    height: 100dvh;
    max-height: 850px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 8px solid var(--accent);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  /* 머신 헤더 */
  .machine-header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 12px 14px;
    text-align: center;
    border-bottom: 4px dashed var(--soft);
    z-index: 10;
    flex-shrink: 0;
  }
  .machine-header h1 { font-size: 1.3rem; font-weight: 900; line-height: 1.25; margin-bottom: 4px; text-shadow: 2px 2px rgba(0,0,0,0.28); }
  .machine-header p { font-size: 0.85rem; opacity: 0.92; line-height: 1.35; }

  /* 화면 공통 */
  .stage { flex: 1; position: relative; min-height: 0; }
  .screen {
    position: absolute;
    inset: 0;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    overflow-x: hidden;
    transition: transform 0.4s ease, opacity 0.4s ease;
    background: radial-gradient(circle, var(--bg) 0%, var(--soft) 100%);
  }
  .screen.hidden {
    transform: translateY(20px);
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }

  /* 코인 & 레버 연출 */
  .coin-slot {
    width: 60px; height: 12px; background: color-mix(in srgb, var(--accent) 35%, black); border-radius: 6px;
    margin: 6px auto; position: relative; overflow: hidden; flex-shrink: 0;
  }
  .coin {
    width: 16px; height: 16px; background: var(--gold); border-radius: 50%;
    position: absolute; top: -20px; left: 22px;
    box-shadow: 0 0 5px var(--gold);
    animation: dropCoin 1.5s infinite;
  }
  @keyframes dropCoin {
    0% { top: -20px; opacity: 0; }
    50% { top: 0; opacity: 1; }
    100% { top: 30px; opacity: 0; }
  }

  /* 시작 화면 */
  #screen-start { justify-content: space-between; gap: 14px; }
  .start-desc { text-align: center; font-size: 1rem; line-height: 1.45; margin: 8px 0; color: var(--ink); font-weight: bold; }
  .capsule-preview-dome {
    width: 210px; height: 210px; border: 6px solid var(--accent); border-radius: 50%;
    background: color-mix(in srgb, var(--card) 45%, transparent); display: flex; flex-wrap: wrap;
    justify-content: center; align-items: center; align-content: center; position: relative; overflow: hidden;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.12); flex-shrink: 0;
  }
  .capsule-preview-dome::after {
    content: ''; position: absolute; top: 18px; left: 34px; width: 46px; height: 22px;
    border-radius: 50%; background: rgba(255,255,255,0.45); transform: rotate(-30deg); pointer-events: none;
  }
  .dome-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
  .mini-capsule {
    width: 45px; height: 60px; background: linear-gradient(135deg, var(--gold) 50%, var(--accent) 50%);
    border-radius: 30px; margin: 6px; border: 2px solid var(--ink); position: relative;
    animation: floatCap 3s ease-in-out infinite alternate;
  }
  .mini-capsule.alt { background: linear-gradient(135deg, var(--heart) 50%, var(--soft2) 50%); }
  @keyframes floatCap {
    0% { transform: translateY(0) rotate(-5deg); }
    100% { transform: translateY(-8px) rotate(5deg); }
  }

  .btn {
    background: var(--gold); color: color-mix(in srgb, var(--gold) 18%, black); border: none; padding: 15px 24px;
    font-family: inherit; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 70%, black); transition: all 0.1s; width: 100%; max-width: 280px;
    text-align: center; line-height: 1.3; flex-shrink: 0;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

  /* 퀴즈 화면 */
  .q-top { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; margin-bottom: 14px; }
  .q-progress { font-size: 0.8rem; background: var(--accent); color: var(--accent-ink); padding: 4px 12px; border-radius: 10px; }
  .q-caps { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .q-caps i { width: 10px; height: 14px; border-radius: 6px; border: 1.5px solid var(--accent); background: var(--card); }
  .q-caps i.on { background: linear-gradient(135deg, var(--gold) 50%, var(--accent) 50%); }
  .q-head { font-size: 0.8rem; color: var(--accent); font-weight: bold; text-align: center; }
  .q-title { font-size: 1.1rem; font-weight: bold; text-align: center; line-height: 1.45; color: var(--ink); }
  .options-list { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-bottom: 4px; }
  .option-btn {
    background: var(--card); border: 2px solid var(--accent); padding: 13px 15px; border-radius: 15px;
    text-align: left; font-family: inherit; font-size: 0.95rem; line-height: 1.4; cursor: pointer; transition: 0.2s; color: var(--ink);
    box-shadow: 0 4px 0 var(--soft); word-break: keep-all;
  }
  .option-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--soft); }
  .shake .option-btn { animation: rattle 0.3s; }
  @keyframes rattle { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-3px); } 70% { transform: translateX(3px); } }

  /* 레버 연출 화면 */
  .lever-screen { text-align: center; justify-content: center; gap: 16px; }
  .lever-screen h3 { font-size: 1.15rem; line-height: 1.35; color: var(--ink); }
  .lever-desc { font-size: 0.9rem; color: var(--ink); }
  .lever-sound { font-size: 0.85rem; color: var(--sub); }
  .lever-box {
    width: 100px; height: 160px; background: var(--accent); border-radius: 10px;
    margin: 0 auto; position: relative; display: flex; justify-content: center;
    border: 4px solid var(--ink); flex-shrink: 0;
  }
  .lever-handle {
    width: 20px; height: 120px; background: var(--gold); border-radius: 10px;
    position: absolute; top: 10px; transform-origin: bottom center;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer; border: 2px solid var(--ink);
  }
  .lever-handle::after {
    content: ''; position: absolute; top: -20px; left: -15px;
    width: 50px; height: 50px; background: var(--heart); border-radius: 50%;
    border: 2px solid var(--ink);
  }
  .lever-handle.pulled { transform: rotate(90deg); }
  .drop-capsule {
    width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--ink);
    background: linear-gradient(180deg, var(--gold) 50%, var(--accent) 50%);
    opacity: 0; transform: translateY(-30px);
  }
  .drop-capsule.go { animation: rollOut 0.7s ease-out forwards; }
  @keyframes rollOut { 0% { opacity: 0; transform: translateY(-30px) rotate(0); } 60% { opacity: 1; transform: translateY(6px) rotate(200deg); } 100% { opacity: 1; transform: translateY(0) rotate(360deg); } }

  /* 결과 화면 */
  #screen-result { justify-content: flex-start; }
  .cap-open { position: relative; width: 120px; height: 44px; margin: 0 auto -6px; flex-shrink: 0; }
  .cap-half { position: absolute; left: 10px; width: 100px; height: 50px; border: 3px solid var(--ink); }
  .cap-half.top { top: 4px; height: 40px; border-radius: 50px 50px 0 0; background: var(--gold); animation: popTop 0.7s ease-out forwards; }
  .cap-half.bot { top: 30px; border-radius: 0 0 50px 50px; height: 30px; background: var(--accent); opacity: 0; }
  @keyframes popTop { 0% { transform: translateY(30px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translate(-40px, 0) rotate(-28deg); opacity: 1; } }
  .result-card {
    background: var(--card); border: 4px solid var(--accent); border-radius: 20px;
    padding: 16px; width: 100%; text-align: center; color: var(--ink);
    box-shadow: 0 6px 0 var(--soft); animation: rise 0.6s ease-out both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.95); } to { opacity: 1; transform: none; } }
  .result-label { font-size: 0.8rem; color: var(--accent); font-weight: bold; margin-bottom: 8px; }
  .result-img { display: block; width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); margin: 0 auto 10px; background: var(--bg); }
  .result-name { font-size: 1.25rem; font-weight: 900; color: var(--ink); margin-bottom: 4px; line-height: 1.3; }
  .result-tagline { font-size: 0.9rem; color: var(--accent); font-weight: bold; margin-bottom: 10px; line-height: 1.35; }
  .result-quote { font-size: 0.9rem; color: var(--ink); background: var(--soft2); border-radius: 12px; padding: 8px 12px; margin-bottom: 10px; line-height: 1.4; }
  .result-desc { font-size: 0.9rem; line-height: 1.5; color: var(--ink); margin-bottom: 12px; text-align: left; background: var(--bg); padding: 10px 12px; border-radius: 10px; }

<body>

<div id="app">
  <div class="machine-header">
    <h1 id="m-title">숲속 이끼요정 캡슐 뽑기</h1>
    <p id="m-subtitle">오늘 내 영혼에 깃들 이끼 요정을 만나봐요</p>
  </div>

  <div class="stage">
    <!-- 시작 화면 -->
    <div id="screen-start" class="screen">
      <div>
        <div class="coin-slot"><div class="coin"></div></div>
        <p class="start-desc" id="m-intro"></p>
      </div>
      <div class="capsule-preview-dome" id="dome">
        <div class="mini-capsule"></div>
        <div class="mini-capsule alt" style="animation-delay: 1s;"></div>
        <div class="mini-capsule" style="animation-delay: 2s;"></div>
      </div>
      <button class="btn" data-start>요정 캡슐 뽑기 시작하기</button>
    </div>

    <!-- 퀴즈 화면 -->
    <div id="screen-quiz" class="screen hidden">
      <div class="q-top">
        <div class="q-progress" id="q-progress"></div>
        <div class="q-caps" id="q-caps"></div>
        <div class="q-head hide" id="q-head"></div>
        <div class="q-title" id="q-text"></div>
      </div>
      <div class="options-list" id="q-options"></div>
    </div>

    <!-- 레버 연출 화면 -->
    <div id="screen-lever" class="screen hidden lever-screen">
      <h3>캡슐 레버 돌리기</h3>
      <p class="lever-desc">레버를 당겨 오늘의 요정을 만나보세요</p>
      <div class="lever-box">
        <div class="lever-handle" id="lever"></div>
      </div>
      <div class="drop-capsule" id="drop-capsule"></div>
      <p class="lever-sound">달그락 톡!</p>
    </div>

    <!-- 결과 화면 -->
    <div id="screen-result" class="screen hidden">
      <div class="cap-open" aria-hidden="true"><div class="cap-half top"></div></div>
      <div id="result-content"></div>
    </div>
  </div>
</div>

<script>
  (function () {
    let D = null, currentQ = 0, busy = false, leverTimer = null;
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      const el = $(id);
      el.classList.remove('hidden');
      el.scrollTop = 0;
    }

    function renderQuestion() {
      const totalQ = D.questions.length;
      if (currentQ >= totalQ) { pullLever(); return; }
      const qData = D.questions[currentQ];
      $('q-progress').textContent = `${currentQ + 1} / ${totalQ}`;
      $('q-caps').innerHTML = D.questions.map((_, i) => `<i class="${i <= currentQ ? 'on' : ''}"></i>`).join('');
      const head = $('q-head');
      head.textContent = qData.head || '';
      head.classList.toggle('hide', !qData.head);
      $('q-text').textContent = qData.q;

      const optContainer = $('q-options');
      optContainer.innerHTML = '';
      (qData.options || []).forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.setAttribute('data-opt', idx);
        btn.textContent = opt.text;
        btn.addEventListener('click', () => {
          if (busy) return;
          busy = true;
          window.LB.answer(currentQ, idx);
          currentQ++;
          const scr = $('screen-quiz');
          scr.classList.add('shake');
          setTimeout(() => { scr.classList.remove('shake'); busy = false; renderQuestion(); }, 220);
        });
        optContainer.appendChild(btn);
      });
      $('screen-quiz').scrollTop = 0;
    }

    // 마지막 문항 뒤: 결과를 먼저 정해 두고, 레버가 저절로 돌아가며 캡슐이 굴러 나와요(눌러도 바로 진행)
    function pullLever() {
      showScreen('screen-lever');
      const lever = $('lever'), cap = $('drop-capsule');
      lever.classList.remove('pulled'); cap.classList.remove('go');
      let done = false;
      const go = () => {
        if (done) return; done = true;
        lever.classList.add('pulled');
        setTimeout(() => cap.classList.add('go'), 300);
        // 결과는 결과 화면을 그리는 바로 그 순간 정해요(앱·검사 봇이 LB.result 직후 결과 화면을 봐요)
        setTimeout(() => renderResultScreen(window.LB.result()), 950);
      };
      lever.onclick = go;
      clearTimeout(leverTimer);
      leverTimer = setTimeout(go, 500);
    }

    function matchRow(label, r, cls) {
      if (!r) return '';
      return `<div class="match-box ${cls}">
          <img src="${esc(r.img || '')}" alt="${esc(r.name)}">
          <div><span class="m-label">${label}</span><b>${esc(r.name)}</b></div>
        </div>`;
    }

    function renderResultScreen(res) {
      showScreen('screen-result');
      const matchRes = res.match ? window.LB.byId(res.match) : null;
      const misRes = res.mismatch ? window.LB.byId(res.mismatch) : null;
      const box = $('result-content');
      box.innerHTML = `
        <div class="result-card" data-result-id="${esc(res.id)}">
          <div class="result-label">나의 숲속 이끼 요정</div>
          <img src="${esc(res.img || '')}" class="result-img" alt="${esc(res.name)}">
          <div class="result-name">${esc(res.name)}</div>
          <div class="result-tagline">${esc(res.tagline || '')}</div>
          ${res.quote ? `<div class="result-quote">“${esc(res.quote)}”</div>` : ''}
          <div class="traits-box">
            ${(res.traits || []).map(t => `<span class="trait-tag">#${esc(t)}</span>`).join('')}
          </div>
          <div class="result-desc">${esc(res.desc || '')}</div>
          ${matchRow('✨ 찰떡궁합 요정', matchRes, '')}
          ${matchRow('티격태격 요정', misRes, 'mismatch')}
          ${res.tip ? `<div class="result-tip">💡 ${esc(res.tip)}</div>` : ''}
          <div class="result-actions">
            <button class="btn share" data-share>결과 공유하기</button>
            <button class="btn" data-retry>다시 뽑아보기</button>
          </div>
        </div>
      `;
      box.querySelector('[data-share]').addEventListener('click', () => window.LB.share(res.id));
      box.querySelector('[data-retry]').addEventListener('click', () => {
        window.LB.reset();
        currentQ = 0;
        box.innerHTML = '';
        showScreen('screen-start');
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      D = window.DATA;
      if (!D) return;
      if (D.title) $('m-title').textContent = D.title;
      if (D.subtitle) $('m-subtitle').textContent = D.subtitle;
      $('m-intro').textContent = D.intro_line || '';
      if (D.cover) {
        const img = document.createElement('img');
        img.className = 'dome-cover'; img.alt = ''; img.src = D.cover;
        $('dome').prepend(img);
      }

      document.querySelector('[data-start]').addEventListener('click', () => {
        window.LB.reset();
        currentQ = 0;
        showScreen('screen-quiz');
        renderQuestion();
      });
    });
  })();
</script>
<script>(function () {
  var W = window, L = W.LB;
  if (!L || typeof L.result !== "function") return;
  function mark() {
    var l = W.lb; if (!l || typeof l.scroll !== "function" || !document.body) return;
    var all = document.body.querySelectorAll("*");
    for (var i = 0; i < all.length && i < 2000; i++) {
      var el = all[i]; if (el.__lbScroll || (el.closest && el.closest(".lv-scr"))) continue;
      var cs = W.getComputedStyle(el);
      if (!(cs.overflowY === "auto" || cs.overflowY === "scroll") || el.scrollHeight <= el.clientHeight + 2 || cs.visibility === "hidden") continue;
      var r = el.getBoundingClientRect(), vw = W.innerWidth || 0, vh = W.innerHeight || 0;
      if (r.width > 0 && r.height > 0 && r.right > 1 && r.left < vw - 1 && r.bottom > 1 && r.top < vh - 1) try { l.scroll(el); } catch (e) {}
    }
  }
  var f = L.result;
  L.result = function () { var r = f.apply(this, arguments); [0, 300, 1000, 2500].forEach(function (t) { setTimeout(mark, t); }); return r; };
})();</script></body>
