<head>


<title>나의 청춘 한 장면</title>
<style>
:root{--sky:#a9d8f2;--bg:#edf8ff;--paper:#ffffffdf;--ink:#344d69;--act:#436f9e;--acc:#436f9e;--pk:#82bccc;--sh:#729abb30;--c:#8fc8f0;--title-font:ui-rounded,sans-serif;--body-font:serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body,button{font-family:var(--body-font)}
button{cursor:pointer;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(var(--sky),var(--bg) 78%);isolation:isolate}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;overflow:hidden;padding:calc(14px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(14px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px))}
h1,h2,p{margin:0;word-break:keep-all}
button{border:0;min-height:64px;font-size:20px;touch-action:manipulation}
button:active{background:#dceffd}
button:disabled{cursor:default}
.btn{min-width:140px;border-radius:36px;background:var(--act);color:#fff;padding:0 24px;font-family:var(--title-font);box-shadow:0 5px 17px var(--sh)}
.btn:active{background:#345d88;box-shadow:0 2px 6px var(--sh)}
.ttl{font-family:var(--title-font);font-weight:400;font-size:clamp(32px,5.2vh,40px);line-height:1.12;letter-spacing:-.02em;color:var(--act);-webkit-text-stroke:7px white;paint-order:stroke fill}
.glass,.box,.opt{border:2px solid #fff;border-radius:22px;background:var(--paper);box-shadow:0 6px 18px var(--sh)}
.tag{display:inline-block;background:var(--act);color:white;border-radius:20px;padding:3px 14px;font-size:18px}
.eyebrow{font-size:18px;letter-spacing:.06em}
#start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:calc(60px + var(--lb-safe-top,0px))}
#start .intro{font-size:18px;line-height:1.6;max-width:340px}
#start .intro small{display:block;font-size:18px;opacity:.85}
.art-space{position:relative;min-height:70px;flex:1;width:100%;display:flex;justify-content:center;align-items:center}
.halo{position:absolute;inset:2% 3%;border-radius:50%;background:radial-gradient(ellipse,#fff 12%,#ffffffa0 38%,#ffffff00 71%);pointer-events:none}
#hc{position:relative;display:block;width:100%;height:100%;max-width:360px;min-height:0}
#start .ribbon{background:#ffffffa8;padding:6px 18px;border-radius:20px;font-size:18px}
#go{flex-shrink:0}
#hud{position:absolute;top:var(--lb-safe-top,0px);left:var(--lb-safe-left,0px);right:var(--lb-safe-right,0px);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
#sc,#info{font-size:18px;font-weight:400}
#sc{font-variant-numeric:tabular-nums}
#quiz{display:flex;flex-direction:column;gap:18px;padding-top:calc(65px + var(--lb-safe-top,0px));justify-content:center}
#schedule{display:flex;justify-content:center;gap:7px;flex-shrink:0}
.period{width:27px;height:31px;border:1px solid #ffffffd9;background:#ffffff90;border-radius:6px;display:grid;place-items:center;position:relative}
.period.current{outline:2px solid #6f9fbc;outline-offset:3px}
.heart{display:block;position:relative;width:10px;height:10px;background:#d0dfeb;transform:rotate(-45deg)}
.heart:before,.heart:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:inherit}
.heart:before{top:-5px;left:0}.heart:after{left:5px;top:0}
.period.done .heart{background:#729cbb}
.scene-note{text-align:center;font-size:18px;min-height:24px}
.box{position:relative;padding:25px 20px 23px;margin-top:6px}
.box>.tag{position:absolute;top:-16px;left:17px}
#question{font-size:clamp(20px,3.4vh,24px);font-weight:400;line-height:1.65;min-height:2.6em;text-align:center}
.box:after{content:"";position:absolute;bottom:10px;right:17px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid #91b2c9;animation:blink 2.4s infinite}
#choices{display:flex;flex-direction:column;gap:12px;width:100%;align-self:center}
.opt{width:100%;min-height:64px;padding:12px 14px;font-size:18px;line-height:1.45;transition:transform .19s,box-shadow .19s,background .19s}
.opt.enter{animation:appear .25s both}
.opt:nth-child(2){animation-delay:.035s}.opt:nth-child(3){animation-delay:.07s}
.opt.selected{background:#fff;box-shadow:0 0 0 3px var(--pk),0 10px 20px #789ab833;transform:translateY(-5px)}
.opt.dim{opacity:.6}
#back{align-self:center;min-height:64px;min-width:150px;padding:0 16px;background:transparent;font-family:var(--title-font);font-size:20px;color:#3c6285}
#back:disabled{opacity:.3}
#reading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#e9f5ffbd;z-index:5}
.chalk{width:85%;padding:24px 12px;text-align:center;background:#648c8e;color:white;border:6px solid #b5ced8;border-radius:10px;font-size:24px;font-family:var(--title-font);box-shadow:0 12px 30px #436f9e30}
#over{display:flex;flex-direction:column;gap:9px;text-align:center}
#why{font-size:18px;line-height:1.4;flex-shrink:0}
#resultArt{position:relative;flex:1;min-height:95px;display:flex;align-items:center;justify-content:center;background:#ffffff9e;border:3px solid white;border-radius:25px;overflow:hidden;box-shadow:0 6px 18px var(--sh)}
#rc{position:relative;width:100%;height:100%;max-width:450px;min-height:0;display:block}
#resultArt:after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:5px;background:var(--c);border-radius:8px}
.result-copy{flex-shrink:0;display:flex;flex-direction:column;gap:8px}
#final{display:block;font-weight:400}
#shareline{font-size:18px;line-height:1.4}
#traits{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.chip{font-size:18px;background:#ffffffba;border:1px solid white;padding:3px 10px;border-radius:20px}
#description{font-size:18px;line-height:1.5;padding:10px 13px;background:repeating-linear-gradient(transparent 0 26px,#cfe2ee80 26px 27px),#ffffffbd;border:1px solid white;border-radius:15px;text-align:left}
.matches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match{padding:7px 4px;border:1px solid white;border-radius:14px;background:#ffffffb8;font-size:18px;line-height:1.4}
.match span{display:block;color:#476d91}
.match strong{font-weight:400}
.lb-rec{font-size:18px}
.actions{display:flex;gap:10px;justify-content:center;flex-shrink:0}

<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>

let W=0,H=0,state='start',paused=false,last=0,acc=0,clock=0,t=0,endT=0,overAt=0,down=false,hs='',hi='',qIndex=0,answers=[],lock=0,pending=-1,resultIndex=0,petals=[],reported=false,shareLock=0;

function setupCanvas(canvas,c){
 const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);

 if(canvas.width!==rw||canvas.height!==rh){canvas.width=rw;canvas.height=rh;}

}

 for(let i=0;i<3;i++){

 resultIndex=0;petals=[];reported=false;shareLock=0;down=false;hs=hi='';
 $('reading').hidden=true;$('over').hidden=true;
 choiceButtons.forEach(b=>{b.disabled=false;});showQuestion();

function select(i){

 lb.audio.sfx(TAP);lb.haptic('light');
}
function determine(){
 const totals=Array(7).fill(0);
 answers.forEach((a,i)=>QS[i].a[a][1].forEach(([n,v])=>totals[n]+=v));
 const max=Math.max(...totals);
 let tied=totals.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
 for(let i=answers.length-1;i>=0&&tied.length>1;i--){
  const weights=Array(7).fill(0);
  QS[i].a[answers[i]][1].forEach(([n,v])=>weights[n]=v);
  const high=Math.max(...tied.map(n=>weights[n]));
  tied=tied.filter(n=>weights[n]===high);
 }
 if(tied.length>1){
  const hash=answers.reduce((h,a,i)=>(h*7+(a+1)*(i+3))%997,17);
  return tied[hash%tied.length];

function die(x,y,why){

function update(dt){
 t+=dt;shareLock=Math.max(0,shareLock-dt);
 if(lock>0){
  lock=Math.max(0,lock-dt);

   if(pending>=0){
    pending=-1;

    qIndex++;showQuestion();
   }else if(pending===-2){pending=-1;choiceButtons.forEach(b=>b.disabled=false);$('back').disabled=qIndex===0;}
  }
 }
}
function cloud(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='#ffffffa8';ctx.beginPath();ctx.ellipse(0,5,64,18,0,0,Math.PI*2);ctx.fill();

 ctx.restore();
}
function drawBackground(){
 ctx.clearRect(0,0,W,H);
 const drift=reduce?0:Math.sin(clock*.06)*13;
 cloud(W*.14+drift,H*.14,.9);cloud(W*.83+drift*.6,H*.22,1.2);
 cloud(W*.49-drift,H*.76,1.4);

  const y=H*.85+i*H*.032;
  ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(W*.3,y+3,W*.7,y-3,W,y);ctx.stroke();
 }

 const base=H*.85;
 ctx.beginPath();ctx.moveTo(0,base);ctx.lineTo(W,base);ctx.moveTo(0,base+16);ctx.lineTo(W,base+16);ctx.stroke();
 for(let x=14;x<W;x+=Math.max(36,W/7)){ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x,H);ctx.stroke();}
 ctx.strokeStyle='#778ca42e';ctx.lineWidth=1.4;
 ctx.beginPath();ctx.moveTo(W*.06,H*.02);ctx.quadraticCurveTo(W*.5,H*.075,W*.98,H*.01);ctx.stroke();

  const x=W*(.035+(i*.137)%1),y=H*(.13+(i*.161)% .76);

  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);

 }
}
function drawHero(c,canvas,key){
 const [ww,hh]=setupCanvas(canvas,c);

 const size=Math.max(1,Math.min(ww,hh)*.98);
 lb.assets.draw(c,key,ww/2,hh/2,size,size);
}
function drawFlowers(){
 if(!petals.length)return;
 ctx.save();
 for(const p of petals){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.globalAlpha=Math.min(1,Math.max(0,(H+25-p.y)/70));
  ctx.fillStyle=p.color;ctx.beginPath();ctx.moveTo(0,-p.r);
  ctx.bezierCurveTo(p.r*1.3,-p.r,p.r,p.r,0,p.r*1.5);
  ctx.bezierCurveTo(-p.r,p.r,-p.r*1.3,-p.r,0,-p.r);ctx.fill();ctx.restore();

 ctx.restore();
}
function render(){

function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(!W){resize();if(!W)return;}

  shareLock=Math.max(0,shareLock-dt);
  for(let i=petals.length-1;i>=0;i--){
   const p=petals[i];p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(clock+p.r)*9)*dt;p.angle+=p.spin*dt;
   if(p.y>H+30)petals.splice(i,1);
  }

}
