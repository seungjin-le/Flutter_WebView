<title>나의 전생 추구미는?</title>
<style>
:root{--paper:#fbfaf7;--ink:#222;--soft:#666;--c:#D9A21B;--title-font:sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
body,button{font-family:var(--title-font,sans-serif);font-weight:400}
#app{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.screen{position:absolute;inset:0;overflow:hidden;padding:calc(15px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(15px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
h1,h2,p{margin:0;word-break:keep-all}
h1{font-size:clamp(32px,6.5vh,46px);line-height:1.05;font-weight:400;letter-spacing:-.035em}
h1 span{display:inline-block;rotate:-1.5deg}
h1 span:nth-child(even){rotate:1.7deg}
h2{font-weight:400}
p{font-size:clamp(18px,3vh,21px);line-height:1.32}
.small{font-size:clamp(15px,2.6vh,18px);color:var(--soft)}
button{color:var(--ink);font-size:22px;cursor:pointer;touch-action:manipulation;min-height:64px;border:2px solid var(--ink);background:#fff;padding:9px 18px;border-radius:90px 13px 80px 12px/12px 80px 13px 90px}
button:active{background:#eee}
button:disabled{cursor:default;color:var(--ink)}
#go{width:100%;max-width:320px;flex-shrink:0;font-size:25px}
#start{justify-content:center}
#start .lead{max-width:350px}
.art{position:relative;flex:1;min-height:50px;width:100%;max-width:390px}
.art canvas{width:100%;height:100%;display:block}
.bub{position:absolute;top:2%;left:4%;padding:4px 12px;border:1.6px solid var(--ink);border-radius:47% 53% 44% 56%;font-size:18px;background:var(--paper);rotate:-7deg}
.sfx{position:absolute;bottom:8%;right:6%;font-size:23px;rotate:-12deg}
#hud{position:absolute;z-index:2;top:calc(12px + var(--lb-safe-top,0px));left:calc(18px + var(--lb-safe-left,0px));right:calc(18px + var(--lb-safe-right,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
#sc{font-size:20px;font-weight:400;white-space:pre}
#stations{display:flex;gap:6px;flex:1;justify-content:flex-end}
.station{height:12px;width:12px;flex:0 1 12px;border:1.5px solid var(--ink);border-radius:44% 56% 47% 53%;background:var(--paper)}
.station.past{background:repeating-linear-gradient(-55deg,transparent 0 2px,#333 2px 3px)}
.station.now{outline:1px solid var(--ink);outline-offset:3px}
#play{padding-top:calc(55px + var(--lb-safe-top,0px));gap:10px;justify-content:center}
#place{font-size:17px;color:var(--soft)}
#question{font-size:clamp(23px,4.4vh,29px);line-height:1.2;max-width:440px}
.qart{height:clamp(62px,15vh,104px);flex:1;max-height:140px;min-height:52px;width:100%;position:relative}
#qc{height:100%;width:100%;display:block}
#qsfx{right:20%;bottom:8%;font-size:20px}
#choices{display:grid;grid-template-columns:1fr;gap:9px;width:100%;max-width:450px}
.opt{position:relative;width:100%;text-align:left;font-size:clamp(19px,3.2vh,22px);line-height:1.12;padding:9px 14px;display:flex;align-items:center;gap:12px}
.opt:nth-child(even){border-radius:13px 80px 12px 90px/80px 12px 90px 13px}
.opt .letter{font-size:17px;border-bottom:1px solid;flex-shrink:0}
.opt.on{background:repeating-linear-gradient(-45deg,transparent 0 6px,#2223 6px 7px),#fff}

function fitLayer(id){
const z=layers[id],r=z.canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
if(r.width<1||r.height<1)return z;
if(z.w!==r.width||z.h!==r.height||z.d!==d){
z.w=r.width;z.h=r.height;z.d=d;z.canvas.width=Math.round(z.w*d);z.canvas.height=Math.round(z.h*d);z.c.setTransform(d,0,0,d,0,0);
}
return z;
}

render();
}
function sketch(c,pts,close){
c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(close)c.closePath();c.stroke();
}
function drawTower(c,x,y,s){
c.save();c.translate(x,y);c.scale(s,s);c.strokeStyle='#222';c.lineWidth=1.5;
sketch(c,[[-22,0],[23,-1],[19,-7],[14,-12],[10,-66],[15,-72],[-16,-71],[-10,-65],[-15,-13],[-22,0]]);
sketch(c,[[-16,-72],[-19,-78],[19,-79],[17,-72]]);
for(let j=0;j<6;j++){let yy=-12-j*9;sketch(c,[[-14+j*.7,yy],[13-j*.6,yy-1]]);}
sketch(c,[[-4,-40],[-4,-49],[5,-49],[5,-40],[-4,-40]]);
c.restore();
}
function drawBackground(){
if(!W||!H)return;
ctx.clearRect(0,0,W,H);ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.globalAlpha=.13;
for(let i=0;i<35;i++){
const x=(i*71.33+21)%W,y=(i*83.71+15)%H;
sketch(ctx,[[x,y],[x+1.4,y+.4]]);
}
const drift=reduced?0:Math.sin(clock*.18)*4;
ctx.save();ctx.translate(drift,0);
sketch(ctx,[[W*.7,45],[W*.73,38],[W*.75,41],[W*.77,33],[W*.79,40],[W*.83,42]]);
ctx.restore();
drawTower(ctx,26,H-14,.7);
sketch(ctx,[[W-95,H-17],[W-95,H-36],[W-65,H-36],[W-65,H-17]]);
sketch(ctx,[[W-106,H-36],[W-84,H-48],[W-55,H-35],[W-106,H-36]]);
sketch(ctx,[[W-113,H-12],[W-49,H-13]]);
ctx.globalAlpha=1;
}
function drawAnimal(id,index,ratio=1){
const z=fitLayer(id);if(!z.w||!z.h)return;
const c=z.c;c.clearRect(0,0,z.w,z.h);
const size=Math.min(z.w,z.h)*ratio;
lb.assets.draw(c,'gen/r'+(index+1),z.w/2,z.h/2,size,size);
}
function drawHero(){
const z=fitLayer('hc');if(!z.w||!z.h)return;
z.c.clearRect(0,0,z.w,z.h);
const s=Math.min(z.w*.46,z.h*.91);
const bounce=reduced?0:Math.sin(clock*1.1)*2;
lb.assets.draw(z.c,'gen/r1',z.w*.23,z.h*.54+bounce,s,s);
lb.assets.draw(z.c,'gen/r2',z.w*.52,z.h*.48-bounce,s*1.12,s*1.12);
lb.assets.draw(z.c,'gen/r13',z.w*.79,z.h*.58+bounce,s*.85,s*.85);
}
function render(){
drawBackground();
if(state==='start')drawHero();
if(state==='play'||state==='judging')drawAnimal('qc',questions[questionIndex].pic,.98);
if(state==='over'){
if(page===0)drawAnimal('rc',resultIndex,1);
if(page===2){drawAnimal('goodpic',results[resultIndex].good,1);drawAnimal('badpic',results[resultIndex].bad,1);}
}
}
function hud(){
$('sc').textContent=(questionIndex+1)+' / 10';
[...$('stations').children].forEach((el,i)=>{el.className='station'+(i<questionIndex?' past':i===questionIndex?' now':'');});
}
function reset(){
t=0;acc=0;questionIndex=0;lock=0;pending=false;points=Array(16).fill(0);recent=Array(16).fill(-1);answers=[];answerCode=0;reported=false;resultIndex=0;page=0;
tieOrder=Array.from({length:16},()=>lb.random());
$('transition').textContent='';
$('sub').textContent='성격을 가볍게 돌아보는 상상 여행이에요.';
$('resultpic').hidden=true;
$('resultpic').removeAttribute('src');
}
function showQuestion(){
const q=questions[questionIndex];
$('place').textContent=q.place;
$('question').textContent=q.q;
$('qsfx').textContent=q.fx;
$('transition').textContent='';
$('choices').replaceChildren();
q.a.forEach((a,i)=>{
const b=document.createElement('button');
b.type='button';b.className='opt';
const letter=document.createElement('span');letter.className='letter';letter.textContent=['가','나','다','라'][i];
const text=document.createElement('span');text.textContent=a[0];
b.append(letter,text);
b.addEventListener('pointerdown',e=>{
if(state!=='play'||lock>0||e.button>0)return;
choose(i,b);
});
b.addEventListener('click',e=>{if(e.detail===0&&state==='play'&&lock<=0)choose(i,b);});
$('choices').append(b);
});
hud();
}
function start(){
reset();state='play';
$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
lb.audio.unlock();
showQuestion();
}
function choose(index,button){
if(state!=='play'||lock>0)return;
const entry=questions[questionIndex].a[index];
entry[1].forEach(([i,n])=>{points[i]+=n;recent[i]=questionIndex*4+index;});
answers.push(index);answerCode=(answerCode*7+index+1)%100003;
button.classList.add('on');
[...$('choices').children].forEach(el=>el.disabled=true);
lb.audio.sfx(CLICK);lb.haptic('light');
const r=button.getBoundingClientRect();
lb.fx.ripple(r.left+r.width*.8,r.top+r.height*.5,{colors:[PAL[2],PAL[1]]});
lock=.2;pending=true;
}
function die(x,y,why,win){
if(state!=='play')return;
state='judging';lock=.62;pending=false;
$('transition').textContent='전생의 일지를 펼쳐 봐요…';
$('why').textContent=why;
lb.audio.sfx(WIN);lb.audio.sfx(SLIDE);lb.haptic('success');
}
function selectResult(){
let top=-1,candidates=[];
points.forEach((v,i)=>{if(v>top){top=v;candidates=[i];}else if(v===top)candidates.push(i);});
candidates.sort((a,b)=>{
const ea=recent[a],eb=recent[b];
if(ea!==eb)return eb-ea;
const ta=(tieOrder[a]+answerCode*(a+1)*.000137)%1;
const tb=(tieOrder[b]+answerCode*(b+1)*.000137)%1;
return tb-ta;
});
return candidates[0];
}
function result(){
resultIndex=selectResult();
const r=results[resultIndex];
state='over';overAt=clock;
$('hud').hidden=true;$('play').hidden=true;$('over').hidden=false;
document.documentElement.style.setProperty('--c',r.color);
$('final').textContent=r.name;$('detailname').textContent=r.name;
$('shareline').textContent=r.line;
$('description').textContent=r.desc;$('growth').textContent=r.growth;
$('traits').replaceChildren();
r.traits.forEach(text=>{const e=document.createElement('p');e.className='trait';e.textContent=text;$('traits').append(e);});
$('goodname').textContent=results[r.good].name;$('badname').textContent=results[r.bad].name;
$('goodtext').textContent=r.friend;
$('resultpic').alt=r.name+' 동물 캐릭터예요';
$('goodpic').setAttribute('aria-label',results[r.good].name);
$('badpic').setAttribute('aria-label',results[r.bad].name);
showPage(0);
if(!reported){reported=true;lb.done(r.name);}
lb.fx.confetti();
}
function showPage(n){
page=n;
for(let i=0;i<3;i++)$('page'+(i+1)).hidden=i!==page;
$('next').hidden=page===2;
$('next').textContent=page===0?'일지 넘겨요':'동행을 봐요';
$('pager').textContent=['하나 / 셋','둘 / 셋','셋 / 셋'][page];
render();
if(page===0){
$('resultpic').src=$('rc').toDataURL('image/png');
$('resultpic').hidden=false;
}
}
function update(dt){
t+=dt;
if(lock>0){lock=Math.max(0,lock-dt);if(lock<=0){
if(state==='judging'){result();return;}
if(pending){
pending=false;
if(questionIndex===9){die(W/2,H/2,'전생 속 나의 추구미 확인 완료!',true);return;}
questionIndex++;showQuestion();
}
}}
}
function frame(now){
requestAnimationFrame(frame);
const dt=last?Math.min((now-last)/1000,.1):0;last=now;
if(paused)return;
clock+=dt;
if(state==='play'||state==='judging'){
acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP;}
}
render();
}
for(let i=0;i<10;i++){const e=document.createElement('span');e.className='station';$('stations').append(e);}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.7)start();});
$('rank').addEventListener('click',()=>lb.share('나의 전생 추구미는? 저는 '+results[resultIndex].name+'이에요. '+results[resultIndex].line));
$('next').addEventListener('click',()=>{if(state==='over'&&page<2)showPage(page+1);});
lb.onPause(p=>{paused=p;last=0;});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
