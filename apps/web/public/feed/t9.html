<title>나는 어떤 이상한 냥</title>
<style>
:root{--bg:#1f2342;--paper:#fffef5;--ink:#25263c;--act:#ffcf4a;--c:#f2a93b;--title-font:ui-rounded,sans-serif;--body-font:ui-rounded,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--body-font);color:var(--paper);font-weight:500}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
button{font-family:var(--title-font);color:var(--ink);cursor:pointer;touch-action:manipulation;font-weight:900;font-size:clamp(17px,2.8vh,20px);border:3px solid var(--ink);border-radius:12px;background:var(--act);min-height:64px;padding:8px 16px;box-shadow:0 5px 0 var(--ink);letter-spacing:-.02em}
button:active{box-shadow:0 1px 0 var(--ink);background:#ffe587}
button:disabled{cursor:default}
h1,p,h2{margin:0;word-break:keep-all}
h1,#final{font-family:var(--title-font);font-weight:900;letter-spacing:-.03em}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(7px,1.5vh,14px);text-align:center;padding:calc(14px + var(--lb-safe-top,0px)) calc(20px + var(--lb-safe-right,0px)) calc(18px + var(--lb-safe-bottom,0px)) calc(20px + var(--lb-safe-left,0px));overflow:hidden}
#start h1{font-size:clamp(30px,5vh,38px);line-height:1.12;text-shadow:3px 3px var(--ink)}
.tape{color:var(--ink);background:var(--act);padding:5px 15px;font-size:12px;transform:rotate(-2deg);border:2px solid var(--ink)}
.number{font-size:12px;letter-spacing:.1em;font-variant-numeric:tabular-nums;color:#e6e5ec}
#start .hook{font-size:clamp(15px,2.5vh,18px);line-height:1.4;max-width:320px}
.small{font-size:12px;line-height:1.4;color:#dddfea}
#hc{display:block;width:min(100%,310px);height:clamp(80px,29vh,240px);flex:1;min-height:0;max-height:245px;object-fit:contain}
.judges{display:flex;gap:8px;justify-content:center;font-size:12px}
.judges span{padding:5px 10px;background:#3a3f6b;border:2px solid #9294ab;transform:rotate(1deg)}
#go{width:min(100%,310px);flex-shrink:0}
#hud{position:absolute;top:calc(12px + var(--lb-safe-top,0px));left:calc(20px + var(--lb-safe-left,0px));right:calc(20px + var(--lb-safe-right,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#sc{font-size:14px;background:var(--ink);padding:5px 12px;border:2px solid #6a6d8f;border-radius:5px;font-variant-numeric:tabular-nums}
.bulbs{display:flex;justify-content:center;gap:13px;border-top:2px solid #8b8da4;padding-top:5px}
.bulbs i{display:block;width:13px;height:16px;background:#494c64;border:2px solid var(--ink);border-radius:45% 45% 55% 55%}
.bulbs i.on{background:var(--act);box-shadow:0 0 9px #ffcf4a66}
#play{justify-content:flex-end;padding-top:calc(82px + var(--lb-safe-top,0px));gap:12px}
#scene{width:100%;flex:1;min-height:36px;max-height:260px;position:relative}
#scene:after{content:"";position:absolute;left:40%;right:40%;bottom:6px;height:4px;background:var(--act);transform:rotate(-7deg)}

<canvas id="hc" width="640" height="440"></canvas>
<div class="judges"><span>박스 심사위원</span><span>수염 심사위원</span><span>식빵 심사위원</span></div>
<p class="small">냥.<br>어딘가 이상하고 귀여운 고양이!<br>지금 바로 확인해 보자냥</p>
<button id="go" type="button">오디션 시작</button>
</div>
<div id="play" class="scr" hidden>
<div id="scene" aria-hidden="true"></div>
<div id="script"><span id="speaker"></span><p id="question"></p></div>
<div id="choices">
<button class="choice" data-letter="가" type="button"></button>
<button class="choice" data-letter="나" type="button"></button>
<button class="choice" data-letter="다" type="button"></button>
</div>
</div>
<canvas id="stamp" width="132" height="132" aria-hidden="true"></canvas>
<div id="judging" hidden>심사 중이에요…</div>
<div id="over" class="scr" hidden>
<p id="why"></p>
<b id="final"></b>
<p id="tagline"></p>
<div id="traits"></div>
<p id="description"></p>
<p id="match"></p>
<p class="lb-rec" id="record"></p>
<p id="sub"></p>
<div class="actions">
<button id="again" type="button">다시 오디션</button>
<button id="rank" type="button">결과 공유</button>
</div>
</div>
</div>
<script>
lb.ready(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),hc=$('hc'),art=hc.getContext('2d'),STEP=1/120,PAL=['#1f2342','#3a3f6b','#ffcf4a','#7ee0c3','#ff6b6b'];
const results=[
{name:'박스왕 치즈',color:'#f2a93b',line:'작은 상자에 큰 행복을 담아요.',desc:'나만의 자리를 포근하게 만드는 재능이 있어요. 낯선 골목에서도 편안한 구석을 발견해요. 가끔은 상자 밖 친구에게도 앞발을 내밀어 봐요.',traits:['공간 수집가','아늑함 천재','느긋한 고집'],good:2,bad:1},
{name:'새벽 우다다',color:'#b7b7d9',line:'모두 잠든 순간, 내 무대가 열려요.',desc:'마음이 뛰는 순간 망설이지 않는 행동파예요. 엉뚱한 에너지로 주변까지 생기 있게 만들어요. 달린 뒤에는 숨 고를 자리도 챙겨 봐요.',traits:['번개 발걸음','순간 추진력','한밤의 열정'],good:4,bad:0},
{name:'식빵 장인',color:'#8a9bb0',line:'아무것도 안 해도 존재감은 잘 익어요.',desc:'차분한 호흡으로 주변까지 편안하게 해 줘요. 내 속도를 지키며 꼭 필요한 순간을 알아봐요. 마음에 드는 무대에는 한 발만 나가 봐요.',traits:['평온한 중심','느긋한 관찰','완벽한 식빵'],good:0,bad:3},
{name:'수다쟁이 샴',color:'#d9c3a0',line:'야옹 한마디로 골목을 연결해요.',desc:'작은 일에서도 나눌 이야기를 발견해요. 솔직한 표현으로 어색한 사이에 다리를 놓아요. 친구의 야옹이 끝날 때까지도 기다려 봐요.',traits:['이야기 부자','표현의 달인','골목 연결망'],good:5,bad:2},
{name:'뜬금 냥냥펀치',color:'#e8673a',line:'귀여운 한 방으로 판을 바꿔요.',desc:'뻔한 흐름에서 뜻밖의 재미를 꺼내는 냥이에요. 용기 있는 반응 덕에 망설이던 친구도 웃어요. 앞발을 뻗기 전 상대 표정도 살펴봐요.',traits:['기습 재치','용감한 앞발','반전 담당'],good:1,bad:6},
{name:'관종 턱시도',color:'#b3dccc',line:'뒤집힌 배까지 오늘의 대표 장면이에요.',desc:'나만의 매력을 알아보고 즐길 줄 알아요. 시선을 부담보다 놀이로 바꾸는 힘이 있어요. 옆자리 친구에게도 조명을 나눠 줘 봐요.',traits:['무대 체질','당당한 매력','표정 부자'],good:3,bad:6},
{name:'우아한 털뭉치',color:'#e0d8f5',line:'엉뚱한 골목에서도 품격은 지켜요.',desc:'작은 차이에서도 아름다움을 찾는 안목이 있어요. 나다운 기준으로 어수선한 순간을 정돈해요. 완벽하지 않은 털 한 올도 사랑해 봐요.',traits:['섬세한 취향','고요한 자신감','구름 같은 품격'],good:2,bad:4}
];
const questions=[
{who:'골목 진행냥이에요',q:'오디션 대기실에 빈 상자가 놓였어요. 어디에 앉을까요?',a:[
['상자에 몸을 꼭 맞춰 넣어요',[[0,3],[2,1]]],
['조명 아래에서 털을 골라요',[[6,3],[5,1]]],
['옆 냥에게 상자 사연을 물어요',[[3,3],[4,1]]]]},
{who:'무대 감독냥이에요',q:'막이 오르기 직전, 꼬리에 리본이 걸렸어요. 어떻게 할까요?',a:[
['리본째 달려 나가요',[[1,3],[5,1]]],
['앞발로 툭 쳐서 날려요',[[4,3],[1,1]]],
['천천히 풀고 자세를 잡아요',[[6,2],[2,2]]]]},
{who:'보컬 심사냥이에요',q:'마이크 앞에서 한 번만 야옹할 수 있어요. 어떤 야옹일까요?',a:[
['할 말을 길게 꾹 눌러 담아요',[[3,3],[5,1]]],
['작지만 묵직하게 울려요',[[2,3],[0,1]]],
['예상 못 한 순간에 외쳐요',[[4,3],[1,1]]]]},
{who:'안무 선생냥이에요',q:'지붕 위 단체 안무에서 나만의 동작을 골라요.',a:[
['발끝까지 우아하게 늘려요',[[6,3],[2,1]]],
['빛보다 빠르게 한 바퀴 돌아요',[[1,3],[4,1]]],
['배를 보이고 관객을 바라봐요',[[5,3],[3,1]]]]},
{who:'휴식 시간이에요',q:'쓰레기통 객석 뒤에 조용한 자리가 있어요. 무엇을 할까요?',a:[
['몸을 접어 식빵을 구워요',[[2,3],[0,1]]],
['새 친구와 무대 얘기를 해요',[[3,3],[5,1]]],
['쿠션 위에서 수염을 다듬어요',[[6,3],[0,1]]]]},
{who:'소품 담당냥이에요',q:'마지막 무대에 딱 하나 가져갈 수 있어요. 무엇이 끌릴까요?',a:[
['내 몸에 딱 맞는 작은 상자요',[[0,3],[2,1]]],
['내 표정이 잘 보이는 거울요',[[5,3],[6,1]]],
['툭 치면 굴러가는 털실 공이요',[[4,2],[1,2]]]]},
{who:'동료 연습냥이에요',q:'친구가 박자를 놓쳤어요. 나도 무대 위에 있어요.',a:[
['옆에서 야옹으로 박자를 줘요',[[3,3],[6,1]]],
['엉뚱한 동작으로 시선을 모아요',[[4,2],[5,2]]],
['친구 곁에 붙어 속도를 맞춰요',[[2,2],[0,2]]]]},
{who:'마지막 심사냥이에요',q:'달이 뜬 지붕, 관객이 내 이름을 불러요. 마지막 인사는요?',a:[
['지붕 끝까지 달려 크게 뛰어요',[[1,3],[4,1]]],
['상자에서 얼굴만 빼꼼 내밀어요',[[0,3],[6,1]]],
['모든 냥에게 한마디씩 건네요',[[3,2],[5,2]]]]}
];
const choices=Array.from(document.querySelectorAll('.choice')),bulbs=Array.from(document.querySelectorAll('.bulbs i'));
let W=0,H=0,state='start',paused=false,last=0,acc=0,clock=0,questionIndex=0,points=[],answers=[],locked=false,transition=0,endT=0,selected=-1,resultIndex=0,overAt=0,hs='',stampTime=0,portraitMode='group',sceneRect=null;
function resize(){
W=cv.clientWidth;H=cv.clientHeight;
const d=Math.min(devicePixelRatio||1,2);
cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
sceneRect=$('scene').getBoundingClientRect();
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function hud(){
const label='오디션 '+(questionIndex+1)+'/8';
if(label!==hs){$('sc').textContent=hs=label;bulbs.forEach((b,i)=>b.classList.toggle('on',i<questionIndex))}
}
function reset(){
questionIndex=0;points=Array(7).fill(0);answers=[];locked=false;transition=0;endT=0;selected=-1;acc=0;hs='';stampTime=0;
$('stamp').classList.remove('show');$('judging').hidden=true;$('sub').textContent='';
}
function showQuestion(){
const q=questions[questionIndex];
$('speaker').textContent=q.who;$('question').textContent=q.q;
choices.forEach((b,i)=>{b.textContent=q.a[i][0];b.disabled=false;b.classList.remove('selected')});
$('script').classList.remove('slide');$('choices').classList.remove('slide');void $('script').offsetWidth;
$('script').classList.add('slide');$('choices').classList.add('slide');
locked=false;hud();sceneRect=$('scene').getBoundingClientRect();
}
function start(){
reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
portraitMode='group';lb.audio.unlock();showQuestion();
}
function choose(i){
if(state!=='play'||locked)return;
locked=true;selected=i;answers.push(i);
questions[questionIndex].a[i][1].forEach(([r,n])=>points[r]+=n);
choices.forEach((b,j)=>{b.disabled=true;b.classList.toggle('selected',j===i)});
const r=choices[i].getBoundingClientRect(),x=r.right-40,y=r.top+r.height/2;
$('stamp').style.left=(x-33)+'px';$('stamp').style.top=(y-33)+'px';$('stamp').classList.remove('show');void $('stamp').offsetWidth;$('stamp').classList.add('show');
stampTime=.34;transition=.37;
lb.audio.sfx('sfx/ui-audio/rollover2');lb.haptic('light');
}
function pickResult(){
const top=Math.max(...points),ties=[];
points.forEach((v,i)=>{if(v===top)ties.push(i)});
let hash=17;answers.forEach((v,i)=>hash=(hash*31+(v+1)*(i+3))%65521);
resultIndex=ties[hash%ties.length];
}
function die(){
if(state!=='play')return;
pickResult();state='dying';endT=.65;$('judging').hidden=false;
bulbs.forEach(b=>b.classList.add('on'));
lb.audio.sfx('sfx/sci-fi-sounds/force-field-001');
lb.audio.sfx('sfx/interface-sounds/confirmation-002');
lb.haptic('success');
const safe=lb.safe;
lb.fx.sparkle(W/2,Math.max(safe.top+35,H*.26));
}
function result(){
if(state!=='dying')return;
state='over';overAt=clock;portraitMode='result';
$('play').hidden=true;$('hud').hidden=true;$('over').hidden=false;$('judging').hidden=true;
const r=results[resultIndex];
document.documentElement.style.setProperty('--c',r.color);
$('why').textContent='너의 냥 본색이 드러났다냥';
$('final').textContent=r.name;
$('tagline').textContent=r.line;
$('description').textContent=r.desc;
$('traits').replaceChildren(...r.traits.map(t=>{const s=document.createElement('span');s.textContent=t;return s}));
$('match').textContent='잘 맞는 냥은 '+results[r.good].name+'이에요 · 안 맞는 냥은 '+results[r.bad].name+'이에요';
$('record').textContent='골목 오디션 여덟 장면을 모두 마쳤어요';
$('over').insertBefore(hc,$('final'));
lb.done(r.name);
lb.fx.confetti();
}
function update(dt){
if(stampTime>0){stampTime-=dt;if(stampTime<=0)$('stamp').classList.remove('show')}
if(state==='play'&&locked){
transition-=dt;
if(transition<=0){
if(questionIndex===7){die();return}
questionIndex++;showQuestion();
}
}else if(state==='dying'){
endT-=dt;if(endT<=0)result();
}
}
function path(c,pts,fill,close=true,width=3){
c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(close)c.closePath();
if(fill){c.fillStyle=fill;c.fill()}
c.strokeStyle='#25263c';c.lineWidth=width;c.lineJoin='round';c.lineCap='round';c.stroke();
}
function ellipse(c,x,y,rx,ry,fill,stroke=true){
c.beginPath();c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);c.fillStyle=fill;c.fill();
if(stroke){c.strokeStyle='#25263c';c.lineWidth=3;c.stroke()}
}
function drawBackground(){
ctx.fillStyle=PAL[0];ctx.fillRect(0,0,W,H);
ellipse(ctx,W*.84,H*.17,27,28,'#efdda1',false);
ellipse(ctx,W*.86,H*.15,25,26,PAL[0],false);
ctx.fillStyle='#888ca9';
for(let i=0;i<17;i++){const x=(i*73+21)%Math.max(W,1),y=32+(i*47)%Math.max(H*.5,1);ctx.globalAlpha=.4+.2*Math.sin(clock*.7+i);ctx.fillRect(x,y,2,2)}
ctx.globalAlpha=1;
ctx.fillStyle='#2a2f4d';
for(let i=0;i<7;i++){const x=i*W/6;ctx.fillRect(x,H*.57+(i%3)*18,W/6+1,H*.43)}
path(ctx,[[-20,H*.83],[W*.52,H*.7],[W+20,H*.83],[W+20,H+10],[-20,H+10]],'#3a3f5b');
ctx.strokeStyle='#505671';ctx.lineWidth=2;
for(let j=0;j<4;j++){
const y=H*.83+j*25;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
for(let k=0;k<10;k++){const x=k*65+(j%2)*30;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+12,y+25);ctx.stroke()}
}
for(let i=0;i<2;i++){
const x=i?W-30:27,y=H*.83;
path(ctx,[[x-19,y-27],[x+18,y-29],[x+16,y+24],[x-14,y+25]],'#505572');
path(ctx,[[x-23,y-32],[x+23,y-34],[x+22,y-25],[x-22,y-23]],'#747a92');
path(ctx,[[x-8,y-39],[x+7,y-39],[x+8,y-34]],null,false);
for(let j=0;j<3;j++){ctx.strokeStyle='#30344c';ctx.beginPath();ctx.moveTo(x-9+j*9,y-18);ctx.lineTo(x-7+j*8,y+17);ctx.stroke()}
}
const top=H*.11;
ctx.beginPath();ctx.moveTo(-10,top);ctx.quadraticCurveTo(W*.5,top+50,W+10,top);ctx.strokeStyle='#9a9cae';ctx.lineWidth=2;ctx.stroke();
for(let i=0;i<9;i++){
const f=(i+.5)/9,x=f*W,y=top+90*f*(1-f);
ctx.fillStyle=state==='dying'||state==='over'||i<questionIndex?'#ffcf4a':'#74778e';
ctx.fillRect(x-2,y,4,9);ellipse(ctx,x,y+13,5,7,ctx.fillStyle,false);
}
}
function drawStage(){
if(state!=='play'&&state!=='dying')return;
if(!sceneRect||sceneRect.height<35)return;
const x=sceneRect.left+sceneRect.width/2,y=sceneRect.top+sceneRect.height*.67,s=Math.min(sceneRect.height/150,1.2,sceneRect.width/270);
ctx.save();ctx.translate(x,y);ctx.scale(s,s);
ellipse(ctx,0,31,100,12,'#171c32',false);
if(questionIndex%3===0){
path(ctx,[[-54,-72],[45,-76],[49,34],[-51,37]],'#7ee0c3');
path(ctx,[[-43,-63],[35,-65],[38,24],[-40,27]],'#677a94');
path(ctx,[[-32,-50],[18,-54],[-26,14]],null,false);
path(ctx,[[-42,37],[-52,45],[49,45],[40,34]],'#7ee0c3');
}else if(questionIndex%3===1){
path(ctx,[[5,-62],[13,-62],[13,33],[40,38],[-23,38],[5,32]],'#999cb0');
ellipse(ctx,9,-77,15,24,'#ffcf4a');
path(ctx,[[-3,-82],[21,-82]],null,false,2);path(ctx,[[-3,-74],[21,-74]],null,false,2);
path(ctx,[[-65,-7],[-21,-13],[-19,32],[-62,34]],'#d1a45f');
path(ctx,[[-65,-7],[-76,-21],[-31,-25],[-21,-13]],'#efd397');
}else{
path(ctx,[[-59,-12],[48,-16],[52,34],[-55,38]],'#cda368');
path(ctx,[[-59,-12],[-40,-36],[6,-38],[-10,-13]],'#e3bc7e');
path(ctx,[[3,-16],[28,-40],[65,-28],[48,-16]],'#f2cf91');
path(ctx,[[-12,-11],[-10,33]],null,false,2);
}
const lift=2*Math.sin(clock*1.8);
ctx.save();ctx.translate(75,-42+lift);ctx.rotate(.12);
path(ctx,[[-17,-19],[15,-19],[18,15],[-17,17]],'#fffef5');
path(ctx,[[-6,-8],[7,-8],[-7,6],[7,6]],null,false,2);ctx.restore();
ctx.restore();
}
function drawPortrait(){
art.clearRect(0,0,640,440);
if(portraitMode==='result'){
lb.assets.draw(art,'gen/r'+(resultIndex+1),320,220,430,430);
}else{
art.save();art.translate(320,230);
art.rotate(-.12);lb.assets.draw(art,'gen/r1',-162,10,265,300);art.restore();
art.save();art.translate(320,230);art.rotate(.11);lb.assets.draw(art,'gen/r5',162,10,260,300);art.restore();
lb.assets.draw(art,'gen/r3',320,228+Math.sin(clock*1.8)*4,290,320);
}
}
function render(){if(!W||!H)return;drawBackground();drawStage();if(state==='start'||state==='over')drawPortrait()}
function frame(now){
requestAnimationFrame(frame);
const dt=last?Math.min((now-last)/1000,.1):0;last=now;
if(paused)return;
clock+=dt;
if(state==='play'||state==='dying'){acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}}
render();
}
const paw=$('stamp').getContext('2d');
paw.scale(2,2);paw.lineJoin='round';
ellipse(paw,33,42,17,14,'#ffcf4a');
ellipse(paw,14,25,6,9,'#ffcf4a');
ellipse(paw,28,16,6,9,'#ffcf4a');
ellipse(paw,43,17,6,9,'#ffcf4a');
ellipse(paw,54,29,6,9,'#ffcf4a');
choices.forEach((b,i)=>b.addEventListener('pointerdown',()=>choose(i)));
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.7)start()});
$('rank').addEventListener('click',()=>{if(state==='over')lb.share('我是'.replace('我是','我是')==='不'?'': '我是'.slice(0,0)+'나는 '+results[resultIndex].name+'! '+results[resultIndex].line+' 나는 어떤 이상한 냥')});
lb.onPause(p=>{paused=p;last=0});
lb.assets.font('font/bagelfatone').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--body-font',v));
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
