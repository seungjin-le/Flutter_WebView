<head>


<title>디저트 성격 테스트</title>
<style>
:root{--bg:#fdeff4;--paper:#fffafb;--ink:#583c39;--edge:#ebcdd5;--act:#a74566;--c:#a74566;--title-font:ui-rounded,system-ui,sans-serif;--body-font:ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden;font-family:var(--body-font)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
button{font-family:var(--title-font);font-weight:400;cursor:pointer;touch-action:manipulation;color:var(--ink)}
h1,h2,p{margin:0;word-break:keep-all}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(6px,1.6vh,12px);padding:calc(18px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(18px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));overflow:hidden}
h1{font-family:var(--title-font);font-size:clamp(27px,5vh,35px);font-weight:400;letter-spacing:-.025em;-webkit-text-stroke:6px white;paint-order:stroke fill;color:var(--act);line-height:1.2}
#start p{font-size:clamp(15px,2.6vh,18px);line-height:1.6;max-width:310px}
#hc{display:block;width:min(62%,230px);height:clamp(90px,30vh,240px);min-height:0;object-fit:contain;flex:0 1 auto}
.mainbtn{min-height:64px;min-width:160px;max-width:100%;padding:10px 25px;border:4px solid white;border-radius:40px;background:var(--act);color:white;font-size:20px;box-shadow:0 4px 0 #d6b8c6,inset 0 3px 0 #ffffff35}
.mainbtn:active{background:#89334f;box-shadow:0 2px 0 #d6b8c6,inset 0 3px 0 #ffffff35}
#hud{position:absolute;top:var(--lb-safe-top,0px);left:var(--lb-safe-left,0px);right:var(--lb-safe-right,0px);height:58px;padding:9px 16px;display:flex;align-items:center;gap:10px;pointer-events:none;z-index:2}
#sc{border:3px solid white;border-radius:14px;background:#f6dce4;padding:7px 11px;font-size:15px;font-family:var(--title-font);font-weight:400;white-space:normal}
#progress{display:flex;gap:4px;flex:1;justify-content:flex-end}
#progress i{display:block;width:clamp(10px,3.6vw,18px);height:18px;background:#e9d9dd;clip-path:polygon(50% 0,64% 33%,100% 38%,73% 62%,81% 100%,50% 80%,19% 100%,27% 62%,0 38%,36% 33%)}
#progress i.done{background:#c47b92}
#progress i.now{background:#a74566}
#play{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;overflow:hidden;padding:calc(65px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(14px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px))}
#card{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;border:4px solid white;border-radius:25px;background:#fffafbdc;box-shadow:0 4px 0 #ddc9d8;padding:12px 13px 10px}
#card:after{content:"";position:absolute;right:-1px;top:-1px;width:23px;height:23px;background:linear-gradient(45deg,#e9e6ec 0 48%,white 50%);border-radius:0 20px 0 8px;pointer-events:none}
#qlabel{font-size:12px;color:#8b6070;margin-bottom:4px;text-align:center}
#question{font-size:clamp(19px,3.4vh,23px);line-height:1.4;text-align:center;font-weight:500;position:relative;z-index:1}
#qa{display:block;width:100%;flex:1;min-height:0;touch-action:none}
#options{display:grid;grid-template-columns:1fr;gap:9px;flex:0 0 auto;padding:0 3px 4px}
.o{display:flex;align-items:center;gap:12px;text-align:left;position:relative;width:100%;min-height:64px;padding:8px 14px 8px 10px;border:3px solid white;border-radius:21px;background:#fffafb;box-shadow:0 3px 0 #e0c8d1;font-size:clamp(16px,2.7vh,19px);line-height:1.3;overflow:hidden;font-family:var(--body-font)}
.o:before{content:"";position:absolute;top:4px;left:43%;width:24px;height:5px;border-radius:8px;background:#fff;transform:rotate(-30deg)}
.o:nth-child(1){--badge:#a74566;--wash:#f8e0e9}
.o:nth-child(2){--badge:#83631a;--wash:#faf0cf}
.o:nth-child(3){--badge:#29716e;--wash:#def2eb}
.o:nth-child(4){--badge:#78518d;--wash:#eee1f4}
.bdg{display:grid;place-items:center;width:33px;height:33px;flex:0 0 33px;border-radius:50%;color:white;background:var(--badge);font-family:var(--title-font);font-size:16px}
.o:active,.o.chosen{background:var(--wash);box-shadow:0 1px 0 #e0c8d1}
.o:disabled{opacity:1;cursor:default}
#back{align-self:center;min-height:32px;padding:3px 16px;border:0;background:transparent;color:#7d5665;font-size:14px}
#back:disabled{visibility:hidden}
.pop{animation:pop .25s ease-out}
@keyframes pop{45%{transform:translateY(-4px) scale(1.025)}}
#over{gap:clamp(4px,1vh,9px)}
#why{font-size:clamp(14px,2.5vh,17px);color:#805564}
#final{font-family:var(--title-font);font-size:clamp(28px,5.4vh,38px);font-weight:400;color:var(--c);-webkit-text-stroke:6px white;paint-order:stroke fill;line-height:1.18}
#desc{max-width:370px;font-size:clamp(13px,2.25vh,16px);line-height:1.55}
#traits{font-size:clamp(12px,2vh,14px);color:#805564}
#matches{font-size:clamp(12px,2vh,14px);line-height:1.5}
#again,#rank{min-height:64px;font-size:18px;min-width:148px;padding:8px 22px}
#rank{background:#fff8fb;color:var(--act);border-color:#fff;box-shadow:0 3px 0 #dec4d0}
#sub{font-size:12px}
@media(max-height:560px){
#play{gap:8px;padding-top:calc(56px + var(--lb-safe-top,0px))}
#hud{height:50px}

.o{padding:7px;gap:7px;font-size:15px;min-height:64px;border-radius:17px}

{name:'폭신 슈크림',color:'#81641e',key:'gen/r2',traits:'편안한 온기 · 꾸준한 애정 · 든든한 일상',desc:'익숙한 행복을 오래 아끼는 사람이야. 서두르지 않고 다정해서 주변도 마음이 놓임. 가끔은 새로운 맛도 한입 먹어 봐.',line:'곁에 있으면 마음까지 폭신해져.',yes:0,no:3},
{name:'진한 브라우니',color:'#8A5A44',key:'gen/r3',traits:'깊은 몰입 · 솔직한 취향 · 묵직한 신뢰',desc:'좋아하는 건 깊이 파고드는 편이야. 말보다 꾸준한 행동으로 믿음을 쌓아 가는 사람. 마음속 응원도 가끔은 말로 꺼내 봐.',line:'작은 한입에도 진심은 꾹꾹 담아.',yes:4,no:0},
{name:'톡톡 젤리',color:'#46752e',key:'gen/r4',traits:'통통 튀는 호기심 · 빠른 전환 · 유쾌한 발상',desc:'낯선 조합에서도 재미를 찾아내는 사람이야. 가벼운 발상으로 굳은 분위기도 말랑하게 풀어 줌. 신나게 즐긴 뒤엔 잠깐 쉬어 가도 좋아.',line:'어디로 튈지 몰라서 더 즐거워.',yes:5,no:1},
{name:'차분 녹차롤',color:'#54753b',key:'gen/r5',traits:'차분한 관찰 · 고른 균형 · 조용한 집중',desc:'분위기를 천천히 살피면서 나만의 답을 찾아. 복잡한 마음도 차분히 정리하는 힘이 있어. 꼭 완벽한 때가 아니어도 마음을 보여 줘 봐.',line:'취향은 조용한데, 들여다보면 깊어.',yes:2,no:5},
{name:'반짝 빙수',color:'#386e91',key:'gen/r6',traits:'환한 표현 · 넓은 상상 · 설레는 감각',desc:'반짝이는 순간을 찾아 함께 나누는 사람이야. 상상도 표현도 풍성해서 평범한 일상까지 특별해짐. 즐거운 약속 사이에 나만의 시간도 남겨 둬.',line:'평범한 오늘에도 반짝임을 살짝 얹어.',yes:3,no:4}
];
const QUESTIONS=[
{q:'토끼가 진열장을 열었어. 어떤 디저트에 눈이 가?',a:[
['분홍 마카롱 한 쌍',[[0,3],[5,1]]],
['갓 구운 따뜻한 슈크림',[[1,3],[0,1]]],
['꾸덕한 초콜릿 브라우니',[[2,3],[4,1]]],
['상큼하게 찰랑이는 젤리',[[3,3],[5,1]]]]},
{q:'곰이 빈 접시 두 장을 내밀어. 어떤 조합으로 담을까?',a:[
['익숙한 맛과 따뜻한 차',[[1,3],[4,1]]],
['쌉싸래한 맛끼리 진하게',[[2,3],[4,2]]],
['색다른 맛을 하나씩',[[3,3],[5,1]]],
['친구가 좋아할 맛과 내 취향',[[0,3],[1,1]]]]},
{q:'북적이는 카페, 너구리가 자리를 골라 달래. 어디로 갈까?',a:[
['빛이 예쁜 창가 자리',[[5,3],[0,1]]],
['조용히 머물기 좋은 구석 자리',[[4,3],[2,1]]],
['이야기하기 좋은 큰 탁자',[[0,2],[1,3]]],
['오가는 풍경이 보이는 자리',[[3,3],[5,1]]]]},
{q:'개구리가 오늘의 추천판을 들고 고민 중이야. 뭘 주문할까?',a:[
['낯설어도 특별한 조합',[[3,3],[5,2]]],
['향을 천천히 즐기는 녹차롤',[[4,3],[2,1]]],
['늘 마음이 놓이는 슈크림',[[1,3],[0,1]]],
['진한 맛 하나에 푹 빠지기',[[2,3],[4,1]]]]},
{q:'판다가 케이크를 나누려고 해. 내 몫은 뭘로 할까?',a:[
['친구와 같은 크기로 반씩',[[0,3],[4,1]]],
['작아도 가장 진한 한 조각',[[2,3],[1,1]]],
['장식이 반짝이는 한 조각',[[5,3],[3,1]]],
['폭신한 크림이 듬뿍 있는 쪽',[[1,3],[0,1]]]]},
{q:'펭귄이 오븐 앞에서 기다리고 있어. 함께 뭘 할까?',a:[
['느긋하게 잔 정돈하기',[[4,3],[1,2]]],
['새 디저트 이름 상상하기',[[3,3],[5,1]]],
['좋아하는 맛 이야기하기',[[2,2],[0,3]]],
['완성되는 순간 사진 찍기',[[5,3],[3,1]]]]},
{q:'햄스터가 컵케이크를 떨어뜨렸어. 먼저 뭐라고 할까?',a:[
['많이 놀랐지? 괜찮아',[[0,3],[1,2]]],
['같이 치울 곳부터 살펴보자',[[4,3],[2,1]]],
['다른 맛도 맛볼 기회네',[[3,3],[5,1]]],
['따뜻한 차부터 한잔하자',[[1,3],[4,1]]]]},
{q:'여우가 쿠키 장식을 맡겼어. 어떤 쿠키로 만들까?',a:[
['작은 하트로 다정하게 꾸미기',[[0,3],[1,1]]],
['선 하나로 단정하고 깊게 꾸미기',[[2,3],[4,2]]],
['색과 모양을 자유롭게 섞기',[[3,3],[5,1]]],
['반짝이는 별을 가득 올리기',[[5,3],[0,1]]]]},
{q:'코알라가 선물 상자를 건네. 어떤 마음을 담을까?',a:[
['네 곁이 늘 포근하길',[[1,3],[0,2]]],
['너만의 속도를 응원해',[[4,3],[2,2]]],
['좋아하는 마음을 진하게',[[2,3],[0,1]]],
['오늘도 뜻밖의 기쁨이 있길',[[5,3],[3,3]]]]}
];
let W=0,H=0,state='start',paused=false,last=0,acc=0,clock=0,index=0,answers=[],lock=0,pending=-1,overAt=0,resultIndex=0,hs='',bg=null,qaW=0,qaH=0;
const stars=[];
for(let i=0;i<9;i++){const e=document.createElement('i');$('progress').appendChild(e);stars.push(e)}
const choices=[];
['가','나','다','라'].forEach((label,i)=>{
const b=document.createElement('button');b.type='button';b.className='o';
const badge=document.createElement('span');badge.className='bdg';badge.textContent=label;
const text=document.createElement('span');b.append(badge,text);$('options').appendChild(b);
b.addEventListener('click',()=>choose(i));choices.push({b,text});
});
function sticker(c,path,fill){
c.save();c.translate(2,3);c.fillStyle='#81709719';c.fill(path);c.restore();
c.lineJoin='round';c.lineWidth=7;c.strokeStyle='white';c.stroke(path);c.fillStyle=fill;c.fill(path);c.lineWidth=1;c.strokeStyle='#bca7b1';c.stroke(path);
}
function rr(x,y,w,h,r){const p=new Path2D();p.roundRect(x,y,w,h,r);return p}
function cake(c,x,y,s){
c.save();c.translate(x,y);c.scale(s,s);
sticker(c,rr(-27,-16,54,29,9),'#f4cedb');
sticker(c,rr(-28,-23,56,12,7),'#fff4df');
c.fillStyle='#c87992';c.beginPath();c.ellipse(0,-27,7,8,0,0,7);c.fill();
c.fillStyle='#adc9a8';c.beginPath();c.ellipse(3,-35,6,2,-.6,0,7);c.fill();
c.strokeStyle='#ffffff99';c.lineWidth=3;c.beginPath();c.moveTo(-18,-12);c.lineTo(-10,-16);c.moveTo(-14,-5);c.lineTo(-6,-9);c.stroke();
c.restore();
}
function buildBackground(){
bg=document.createElement('canvas');bg.width=Math.max(1,Math.ceil(W));bg.height=Math.max(1,Math.ceil(H));
const c=bg.getContext('2d');c.fillStyle=PAL[0];c.fillRect(0,0,W,H);
c.fillStyle='#e5c2cf66';
for(let y=15;y<H;y+=28)for(let x=16;x<W;x+=28){c.beginPath();c.arc(x,y,1,0,7);c.fill()}
c.save();c.globalAlpha=.48;
const aw=W/8;
for(let i=0;i<8;i++){c.fillStyle=i%2?'#fff8f9':'#edc4d3';c.beginPath();c.roundRect(i*aw,-15,aw+1,43,9);c.fill()}
c.fillStyle='#d7ece5';c.fillRect(0,H-54,W,54);
sticker(c,rr(12,H-130,W*.39,80,12),'#ecf7f2');
c.strokeStyle='#c5dcd4';c.lineWidth=2;c.beginPath();c.moveTo(17,H-91);c.lineTo(W*.39+6,H-91);c.stroke();
cake(c,45,H-69,.55);cake(c,94,H-103,.48);
sticker(c,rr(W-100,H-130,78,79,12),'#e8dfed');
sticker(c,rr(W-90,H-112,58,42,7),'#c8c1d5');
c.fillStyle='#f9eff4';c.fillRect(W-83,H-106,42,4);
c.fillStyle='#c0a6b8';for(let i=0;i<3;i++){c.beginPath();c.arc(W-80+i*19,H-122,3,0,7);c.fill()}
c.fillStyle='#c9b6c5';c.fillRect(W/2-3,H-72,6,20);
sticker(c,rr(W/2-27,H-76,54,7,4),'#fff5ed');cake(c,W/2,H-91,.57);
c.restore();
}
function resize(){
W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;
const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);buildBackground();
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function hud(){
const value='주문 '+(index+1)+' / 9';
if(value!==hs){$('sc').textContent=value;hs=value}
stars.forEach((e,i)=>e.className=i<index?'done':i===index?'now':'');
}
function showQuestion(){
const q=QUESTIONS[index];$('question').textContent=q.q;
choices.forEach((o,i)=>{o.text.textContent=q.a[i][0];o.b.disabled=false;o.b.classList.remove('chosen')});
$('back').disabled=index===0;qa.setAttribute('aria-label',q.q);hud();bump($('card'));
}
function reset(){
index=0;answers=[];lock=0;pending=-1;acc=0;resultIndex=0;hs='';
choices.forEach(o=>o.b.classList.remove('chosen'));
$('sub').textContent='취향으로 가볍게 즐기는 성격 이야기예요';
}
function start(){
reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
lb.audio.unlock();showQuestion();
}
function choose(i){
if(state!=='play'||paused||lock>0)return;
pending=i;lock=.3;
choices.forEach((o,j)=>{o.b.disabled=true;o.b.classList.toggle('chosen',j===i)});
$('back').disabled=true;
bump(choices[i].b);lb.audio.sfx('sfx/ui-audio/switch1');lb.haptic('light');
}
function determine(){
const totals=Array(6).fill(0),lastPreference=Array(6).fill(-1);
answers.forEach((a,qi)=>QUESTIONS[qi].a[a][1].forEach(([type,pts],order)=>{totals[type]+=pts;lastPreference[type]=qi*10+pts*2-order}));
let top=0;for(let i=1;i<6;i++)if(totals[i]>totals[top]||(totals[i]===totals[top]&&lastPreference[i]>lastPreference[top]))top=i;
return top;
}
function die(x,y,why){
if(state!=='play')return;
resultIndex=determine();state='dying';lock=.48;$('why').textContent=why;
lb.audio.sfx('sfx/interface-sounds/maximize-005');
lb.audio.sfx('sfx/interface-sounds/confirmation-004');
lb.fx.burst(x,y,{colors:[PAL[2],PAL[3],'#fff']});lb.fx.sparkle(x,y);lb.haptic('success');
}
function result(){
state='over';overAt=clock;
const r=TYPES[resultIndex];
$('hud').hidden=true;$('play').hidden=true;$('over').hidden=false;
$('over').insertBefore(hc,$('final'));
hc.setAttribute('aria-label',r.name+' 그림');
$('over').style.setProperty('--c',r.color);
$('final').textContent=r.name;
$('desc').textContent=r.desc;
$('traits').textContent=r.traits;
$('matches').textContent='잘 맞아:'+TYPES[r.yes].name+'· 달라:'+TYPES[r.no].name;
lb.done(r.name);
}
function update(dt){
if(state==='play'&&lock>0){
lock=Math.max(0,lock-dt);
if(lock===0&&pending>=0){
answers[index]=pending;pending=-1;
if(index===8){die(W/2,H*.38,'네 디저트 나왔어!');return}
index++;showQuestion();
}
}else if(state==='dying'){
lock=Math.max(0,lock-dt);if(lock===0)result();
}
}
function drawArt(c,key,w,h){
c.clearRect(0,0,w,h);
const side=Math.max(1,Math.min(w,h)*.95);
lb.assets.draw(c,key,w/2,h/2,side,side);
}
function render(){
if(!W||!H)return;
ctx.clearRect(0,0,W,H);if(bg)ctx.drawImage(bg,0,0,W,H);
ctx.fillStyle='#fff9fc';
for(let i=0;i<7;i++){
const x=W*(.08+i*.145),y=H*(.12+.12*(i%4))+Math.sin(clock*.6+i)*5;
const r=i%2?3:4;ctx.beginPath();ctx.moveTo(x,y-r*1.6);ctx.quadraticCurveTo(x+1,y-1,x+r,y);ctx.quadraticCurveTo(x+1,y+1,x,y+r*1.6);ctx.quadraticCurveTo(x-1,y+1,x-r,y);ctx.quadraticCurveTo(x-1,y-1,x,y-r*1.6);ctx.fill();
}
if(state==='start')drawArt(hctx,'gen/r1',480,480);
if(state==='over')drawArt(hctx,TYPES[resultIndex].key,480,480);
if(state==='play'||state==='dying'){
const r=qa.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
if(r.width>0&&r.height>0){
if(qaW!==r.width||qaH!==r.height){qaW=r.width;qaH=r.height;qa.width=Math.max(1,Math.round(qaW*d));qa.height=Math.max(1,Math.round(qaH*d));qctx.setTransform(d,0,0,d,0,0)}
drawArt(qctx,'gen/q'+(index+1),qaW,qaH);
}
}
}
function frame(now){
requestAnimationFrame(frame);
const dt=last?Math.min((now-last)/1000,.1):0;last=now;
if(paused)return;clock+=dt;
acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}
render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt<.6)return;start()});
$('rank').addEventListener('click',()=>{const r=TYPES[resultIndex];lb.share('내 디저트 성격은 '+r.name+'! '+r.line)});
$('back').addEventListener('click',()=>{
if(state!=='play'||paused||lock>0||index===0)return;
index--;answers.length=index;pending=-1;lock=0;showQuestion();
lb.audio.sfx('sfx/ui-audio/switch1');lb.haptic('light');
});
lb.onPause(p=>{paused=p;last=0});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
lb.assets.font('font/cafe24ssurround').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/squareround').then(v=>document.documentElement.style.setProperty('--body-font',v));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
