<title>심야 사건 파일 고양이 탐정단</title>
<style>
    /* 기본 색(원본 «심야도서관: 고양이 탐정 파일» 터미널) — 실행 팔레트가 오면 그 값으로 바뀌어요 */
    :where(:root){--bg:#161B22;--card:#0D1117;--ink:#00FF66;--sub:#00E5FF;--line:#30363D;--accent:#00FF66;--accent-ink:#0B0F14;--soft:#10262B;--soft2:#0B0F14;--heart:#FF0055;--gold:#FFE600}
    :root { --font: 'Courier New', Courier, monospace; --hl: color-mix(in srgb, var(--gold) 70%, var(--ink)); }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: var(--soft2);
        color: var(--ink);
        font-family: var(--font);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        word-break: keep-all;
        overflow-wrap: break-word;
    }

    #crt-container {
        width: 100%;
        max-width: 420px;
        height: 100vh;
        height: 100dvh;
        max-height: 850px;
        background: var(--bg);
        border: 4px solid var(--line);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 12%, transparent);
    }

    /* 주사선 + 비네트(색과 상관없이 얇게) */
    #crt-container::before {
        content: " ";
        position: absolute;
        inset: 0;
        background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.09) 50%);
        background-size: 100% 4px;
        z-index: 100;
        pointer-events: none;
    }
    #crt-container::after {
        content: " ";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 62%, rgba(0, 0, 0, 0.35) 100%);
        z-index: 101;
        pointer-events: none;
    }

    .screen {
        flex: 1;
        min-height: 0;
        padding: 20px 18px;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 10;
    }
    .screen::-webkit-scrollbar { width: 4px; }
    .screen::-webkit-scrollbar-thumb { background: var(--accent); }

    h1 {
        font-size: 1.1rem;
        line-height: 1.35;
        margin-bottom: 6px;
        color: var(--hl);
        text-shadow: 0 0 5px color-mix(in srgb, var(--gold) 45%, transparent);
    }

    .subtitle {
        font-size: 0.85rem;
        line-height: 1.4;
        color: var(--sub);
        margin-bottom: 18px;
    }

    .q-head { font-size: 0.8rem; color: var(--sub); margin-bottom: 8px; }

    .terminal-text {
        font-size: 0.95rem;
        line-height: 1.5;
        white-space: pre-wrap;
        margin-bottom: 20px;
        color: var(--ink);
    }

    .cursor {
        display: inline-block;
        width: 8px;
        height: 15px;
        background: var(--accent);
        vertical-align: middle;
        animation: blink 1s infinite;
    }
    @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
    }

    .btn-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: auto;
        padding-bottom: 8px;
    }

    .terminal-btn {
        background: transparent;
        border: 1px dashed var(--accent);
        color: var(--ink);
        padding: 12px;
        font-family: var(--font);
        font-size: 0.9rem;
        line-height: 1.45;
        text-align: left;
        cursor: pointer;
        transition: all 0.1s;
        word-break: keep-all;
    }
    .terminal-btn .k { color: var(--accent); font-weight: bold; }
    .terminal-btn:hover, .terminal-btn:active {
        background: var(--accent);
        color: var(--accent-ink);
        border-style: solid;
        box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent);
    }
    .terminal-btn:hover .k, .terminal-btn:active .k { color: var(--accent-ink); }
    .terminal-btn.alt { border-color: var(--heart); color: var(--heart); }
    .terminal-btn.alt .k { color: var(--heart); }
    .terminal-btn.cyan { border-color: var(--sub); color: var(--sub); }
    .terminal-btn.cyan .k { color: var(--sub); }
    .terminal-btn.alt:hover, .terminal-btn.cyan:hover { background: var(--card); color: var(--ink); box-shadow: none; }

    .glitch { animation: glitchEffect 0.2s cubic-bezier(.25, .46, .45, .94) both; }
    @keyframes glitchEffect {
        0% { transform: translate(0); }
        20% { transform: translate(-3px, 3px); filter: hue-rotate(90deg); }
        40% { transform: translate(-3px, -3px); }
        60% { transform: translate(3px, 3px); filter: hue-rotate(-90deg); }
        80% { transform: translate(3px, -3px); }
        100% { transform: translate(0); }
    }

    .result-box {
        border: 1px solid var(--sub);
        padding: 12px;
        margin-top: 10px;
        background: var(--soft);
        color: var(--ink);
    }

    .dump {
        font-size: 0.75rem;
        line-height: 1.5;
        color: var(--hl);
        white-space: pre;
        overflow: hidden;
        margin-top: 6px;
    }

    .result-img-wrap {
        width: 120px;
        height: 120px;
        margin: 4px auto 10px auto;
        border: 1px solid var(--accent);
        overflow: hidden;
        background: var(--card);
        flex-shrink: 0;
    }
    .result-img-wrap img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .r-name { color: var(--hl); font-weight: bold; font-size: 1rem; line-height: 1.35; text-align: center; margin-bottom: 4px; }
    .r-tag { color: var(--sub); font-size: 0.85rem; line-height: 1.4; text-align: center; margin-bottom: 8px; }
    .r-quote { font-size: 0.85rem; line-height: 1.45; color: var(--ink); border-left: 3px solid var(--hl); padding: 4px 10px; margin: 4px 0 6px; }
    .r-desc { font-size: 0.85rem; line-height: 1.5; margin-bottom: 8px; }
    .r-label { font-size: 0.8rem; color: var(--accent); }
    .r-tip { font-size: 0.8rem; line-height: 1.45; color: var(--ink); margin-top: 8px; border-top: 1px dashed var(--sub); padding-top: 8px; }

    .match-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        border-top: 1px dashed var(--sub);
        padding-top: 8px;
    }
    .match-img-wrap {
        width: 44px;
        height: 44px;
        border: 1px solid var(--sub);
        overflow: hidden;
        flex-shrink: 0;
        background: var(--card);
    }
    .match-img-wrap img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .match-text { font-size: 0.8rem; line-height: 1.45; color: var(--sub); }
    .match-text b { color: var(--hl); }
    .match-container.mis .match-img-wrap { border-color: var(--heart); }
    .match-container.mis .match-text { color: var(--heart); }

    .progress-bar {
        width: 100%;
        height: 10px;
        border: 1px solid var(--accent);
        margin: 15px 0;
        position: relative;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 1.5s linear;
    }

    .hidden { display: none !important; }

    .traits-list {
        font-size: 0.85rem;
        line-height: 1.45;
        color: var(--hl);
        margin: 6px 0;
        padding-left: 18px;
    }

    .cover-img { display: block; width: 100%; max-height: 180px; object-fit: cover; border: 1px solid var(--sub); margin-bottom: 12px; }
    .intro-gallery {
        display: flex;
        gap: 5px;
        overflow-x: auto;
        margin-bottom: 15px;
        padding-bottom: 5px;
        flex-shrink: 0;
    }
    .intro-gallery img {
        width: 40px;
        height: 40px;
        border: 1px solid var(--sub);
        object-fit: cover;
        flex-shrink: 0;
        background: var(--card);
    }

<body>

<div id="crt-container">
    <div class="screen" id="app"></div>
</div>

<script>
(function () {
    // 소리는 첫 터치 뒤에 만들어요(자동 재생 막힘 피하기)
    let audioCtx = null;
    function playBeep(freq = 440, type = 'sine', duration = 0.05) {
        try {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC || !navigator.userActivation || !navigator.userActivation.hasBeenActive) return;
                audioCtx = new AC();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) { /* 소리는 없어도 돼요 */ }
    }

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad2 = n => String(n).padStart(2, '0');

    let D = null, app = null, currentQIdx = 0, typer = null, lastRes = null;

    function renderInit() {
        clearTimeout(typer);
        const galleryImgs = (D.results || []).map(r => `<img src="${esc(r.img || '')}" alt="">`).join('');
        app.innerHTML = `
            ${D.cover ? `<img class="cover-img" src="${esc(D.cover)}" alt="">` : ''}
            <h1 id="t-title"></h1>
            <div class="subtitle" id="t-sub"></div>
            <div class="intro-gallery">${galleryImgs}</div>
            <div class="terminal-text"><span id="intro-text"></span><span class="cursor"></span></div>
            <div class="btn-group hidden" id="start-btns">
                <button class="terminal-btn" data-start><span class="k">[Y]</span> 탐정단 시작</button>
                <button class="terminal-btn alt" data-halt><span class="k">[N]</span> 그만하기</button>
            </div>
        `;
        document.getElementById('t-title').textContent = D.title || '심야 사건 파일 고양이 탐정단';
        document.getElementById('t-sub').textContent = D.subtitle || '심야의 골목길에서 단서를 수집하고 역할을 배정받는다';

        let i = 0;
        const txt = String(D.intro_line || '');
        const introElem = document.getElementById('intro-text');
        const showBtns = () => document.getElementById('start-btns').classList.remove('hidden');
        if (!txt) { showBtns(); return; }
        (function typeWriter() {
            if (i < txt.length) {
                introElem.textContent += txt.charAt(i);
                if (i % 4 === 0) playBeep(800, 'square', 0.01);
                i++;
                typer = setTimeout(typeWriter, 15);
            } else {
                showBtns();
            }
        })();
    }

    function renderHalt() {
        clearTimeout(typer);
        app.innerHTML = `
            <h1>SYSTEM HALTED</h1>
            <div class="terminal-text">정말 그만함?</div>
            <div class="btn-group">
                <button class="terminal-btn cyan" data-reboot><span class="k">[REBOOT]</span> 다시 하기</button>
            </div>`;
    }

    function renderQuestion(qIdx) {
        currentQIdx = qIdx;
        const qData = D.questions[qIdx];
        app.innerHTML = `
            <h1>MISSION #${pad2(qIdx + 1)} <span style="color:var(--sub);font-size:0.85rem;">/ ${pad2(D.questions.length)}</span></h1>
            ${qData.head ? `<div class="q-head">&gt; ${esc(qData.head)}</div>` : ''}
            <div class="terminal-text">${esc(qData.q)}</div>
            <div class="btn-group">
                ${(qData.options || []).map((opt, idx) => `
                    <button class="terminal-btn" data-opt="${idx}"><span class="k">[${String.fromCharCode(65 + idx)}]</span> ${esc(opt.text)}</button>
                `).join('')}
            </div>
        `;
        app.scrollTop = 0;
    }

    function renderLoading() {
        const hex = () => Math.floor(Math.random() * 65536).toString(16).toUpperCase().padStart(4, '0');
        const lines = Array.from({ length: 5 }, (_, k) => `0x${pad2(k * 16)}A0  ${hex()} ${hex()} ${hex()}`).join('\n');
        app.innerHTML = `
            <h1>SYS_MEMORY_DUMP</h1>
            <div class="terminal-text">파일 분석 중...<span class="cursor"></span></div>
            <div class="progress-bar"><div class="progress-fill" id="p-fill"></div></div>
            <div class="dump">${lines}</div>
        `;
        setTimeout(() => {
            const fill = document.getElementById('p-fill');
            if (fill) fill.style.width = '100%';
            playBeep(300, 'sawtooth', 0.3);
        }, 50);
        setTimeout(renderResult, 1500);
    }

    function matchRow(label, r, cls) {
        if (!r) return '';
        return `<div class="match-container ${cls}">
                    <div class="match-img-wrap"><img src="${esc(r.img || '')}" alt="${esc(r.name)}"></div>
                    <div class="match-text">${label}<br><b>${esc(r.name)}</b></div>
                </div>`;
    }

    function renderResult() {
        const res = lastRes = LB.result();
        const matchRes = res.match ? LB.byId(res.match) : null;
        const misRes = res.mismatch ? LB.byId(res.mismatch) : null;

        app.innerHTML = `
            <div data-result-id="${esc(res.id)}">
            <h1>RESULT: ACCESS GRANTED</h1>
            <div class="result-img-wrap"><img src="${esc(res.img || '')}" alt="${esc(res.name)}"></div>
            <div class="r-name">${esc(res.name)}</div>
            <div class="r-tag">"${esc(res.tagline || '')}"</div>

            <div class="result-box">
                ${res.quote ? `<div class="r-quote">${esc(res.quote)}</div>` : ''}
                <div class="r-desc">${esc(res.desc || '')}</div>
                <div class="r-label">[탐정 특징]</div>
                <ul class="traits-list">
                    ${(res.traits || []).map(t => `<li>${esc(t)}</li>`).join('')}
                </ul>
                ${matchRow('환상 케미:', matchRes, '')}
                ${matchRow('주의 케미:', misRes, 'mis')}
                ${res.tip ? `<div class="r-tip">&gt; TIP: ${esc(res.tip)}</div>` : ''}
            </div>

            <div class="btn-group" style="margin-top: 12px; padding-bottom: 10px;">
                <button class="terminal-btn cyan" data-share><span class="k">[SHARE]</span> 결과 공유하기</button>
                <button class="terminal-btn alt" data-reboot><span class="k">[REBOOT]</span> 다시 하기</button>
            </div>
            </div>
        `;
        app.scrollTop = 0;
    }

    function onClick(e) {
        const target = e.target.closest('button');
        if (!target) return;

        playBeep(600, 'sine', 0.03);
        app.classList.add('glitch');
        setTimeout(() => app.classList.remove('glitch'), 200);

        if (target.hasAttribute('data-start')) {
            LB.reset();
            renderQuestion(0);
        } else if (target.hasAttribute('data-halt')) {
            renderHalt();
        } else if (target.hasAttribute('data-opt')) {
            const optIdx = parseInt(target.getAttribute('data-opt'), 10);
            LB.answer(currentQIdx, optIdx);
            if (currentQIdx + 1 < D.questions.length) renderQuestion(currentQIdx + 1);
            else renderLoading();
        } else if (target.hasAttribute('data-reboot')) {
            LB.reset();
            lastRes = null;
            renderInit();
        } else if (target.hasAttribute('data-share')) {
            if (lastRes) LB.share(lastRes.id);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        D = window.DATA;
        app = document.getElementById('app');
        if (!D) return;
        app.addEventListener('click', onClick);
        renderInit();
    });
})();
</script>
<script>(function () {
  var W = window, L = W.LB;
  if (!L || typeof L.result !== "function") return;
  function mark() {
    var l = W.lb; if (!l || typeof l.scroll !== "function" || !document.body) return;
    var all = document.body.querySelectorAll("*");
    for (var i = 0; i < all.length && i < 2000; i++) {
      var el = all[i]; if (el.__lbScroll || (el.closest && el.closest(".lv-scr"))) continue;
      var cs = W.getComputedStyle(el);
      if (!(cs.overflowY === "auto" || cs.overflowY === "scroll") || el.scrollHeight <= el.clientHeight + 2 || cs.visibility === "hidden") continue;
      var r = el.getBoundingClientRect(), vw = W.innerWidth || 0, vh = W.innerHeight || 0;
      if (r.width > 0 && r.height > 0 && r.right > 1 && r.left < vw - 1 && r.bottom > 1 && r.top < vh - 1) try { l.scroll(el); } catch (e) {}
    }
  }
  var f = L.result;
  L.result = function () { var r = f.apply(this, arguments); [0, 300, 1000, 2500].forEach(function (t) { setTimeout(mark, t); }); return r; };
})();</script></body>
