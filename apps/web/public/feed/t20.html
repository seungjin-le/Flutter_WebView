<title>나의 공부 스타일</title>
<style>
:root{--bg:#fff4d6;--paper:#fffef8;--ink:#3b302a;--act:#276b46;--c:#5b4bb7;--acc:#ffd98a;--title-font:system-ui,sans-serif;--body-font:ui-rounded,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
button{font-family:var(--title-font);color:inherit;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden;font-family:var(--body-font);font-weight:500;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;overflow:hidden;padding:calc(16px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(16px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
h1,h2,p{margin:0;word-break:keep-all}
.ttl{font-family:var(--title-font);font-weight:800;letter-spacing:-.035em;line-height:1.16}
h1{font-size:clamp(30px,5.6vh,42px)}
h1 em{display:inline-block;font-style:normal;padding:1px 9px 3px;border:3px solid var(--ink);border-radius:13px 8px;background:repeating-linear-gradient(-28deg,transparent 0 4px,#fff8 4px 6px),var(--acc)}
.cr{background-image:repeating-linear-gradient(-28deg,transparent 0 4px,#ffffff80 4px 6px)}
.btn{min-height:64px;min-width:144px;border:3px solid var(--ink);border-radius:22px 17px 24px 16px;background:var(--act);color:#fff;font-size:18px;padding:10px 18px;box-shadow:3px 4px 0 var(--ink)}
.btn:active{box-shadow:1px 1px 0 var(--ink);background:#20563a}
#start{padding-top:calc(58px + var(--lb-safe-top,0px));gap:14px}
#start .sub{font-size:clamp(18px,3.1vh,22px);color:#7b3540;line-height:1.25;max-width:310px}
#hc{display:block;width:100%;height:100%;min-height:0;max-width:330px;flex:1;object-fit:contain}
.blob{border:3px solid var(--ink);background:var(--act);color:white;border-radius:35% 28% 30% 32%/34%;padding:12px 18px;line-height:1.25;font-size:19px}
#start .blob{transform:rotate(-2deg);font-size:18px;padding:9px 18px}
#go{flex-shrink:0;width:75%;max-width:300px}
#quiz{gap:14px;padding-top:calc(22px + var(--lb-safe-top,0px));padding-bottom:calc(84px + var(--lb-safe-bottom,0px))}
.q-label{align-self:flex-start;font-size:17px;color:#7b3540;border-bottom:7px solid #ffd98a;line-height:.9;padding:0 4px 4px;transform:rotate(-1deg)}
#question{width:100%;min-height:100px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3.5vh,24px);transform:rotate(-1deg);padding:14px 20px}
#options{display:flex;flex-direction:column;width:100%;gap:12px;flex:1;min-height:0;justify-content:center}
.opt{position:relative;display:flex;align-items:center;text-align:left;width:100%;flex:1;max-height:86px;min-height:52px;padding:8px 12px;gap:12px;border:3px solid var(--ink);border-radius:16px 12px 19px 13px;box-shadow:3px 4px 0 var(--ink);background:var(--paper);font-family:var(--body-font);font-size:clamp(18px,3.1vh,21px);line-height:1.18;transition:background-color .12s}
.opt:nth-child(2n){border-radius:12px 18px 12px 17px}
.opt .letter{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:32px;height:32px;border:2px solid var(--ink);border-radius:47% 53% 49% 51%;font-size:19px}
.opt.on{background:repeating-linear-gradient(-28deg,transparent 0 4px,#fff9 4px 6px),#ffd98a;box-shadow:1px 1px 0 var(--ink)}
.opt.on:after{content:"";position:absolute;inset:4px 5px;border:3px solid #b74935;border-radius:45% 49% 46% 43%;transform:rotate(-3deg);pointer-events:none}
.opt:active{box-shadow:1px 1px 0 var(--ink)}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
.enter{animation:enter .18s ease-out}
@keyframes enter{from{opacity:.2;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
#hud{position:absolute;left:calc(18px + var(--lb-safe-left,0px));right:calc(18px + var(--lb-safe-right,0px));bottom:calc(12px + var(--lb-safe-bottom,0px));height:55px;display:flex;align-items:center;gap:12px;padding:9px 12px;border:3px solid var(--ink);border-radius:12px 16px 13px 10px;background:var(--paper);box-shadow:2px 3px 0 var(--ink);pointer-events:none}
#dots{display:flex;gap:5px;flex:1;justify-content:space-between}
.dot{height:17px;width:17px;border:2px solid var(--ink);border-radius:47% 52% 44% 56%;background:transparent}
.dot.done{background:repeating-linear-gradient(-28deg,transparent 0 3px,#fff8 3px 5px),#e7ae39}
.dot.current{outline:2px solid #276b46;outline-offset:2px}
#sc{font-size:18px;white-space:normal;font-variant-numeric:tabular-nums}
#info{position:absolute;bottom:60px;left:0;right:0;font-size:17px;color:var(--ink)}
#over{gap:8px}
#why{font-size:17px;color:#7b3540}
.result-top{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0;flex:1}
.artbox{flex:1;min-height:55px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.result-img{display:block;width:100%;height:auto;max-width:320px;max-height:100%;object-fit:contain}
.initial{width:min(100%,230px);height:100%;max-height:230px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:4px solid var(--ink);border-radius:43% 48% 42% 49%;background:repeating-linear-gradient(-28deg,transparent 0 5px,#fff8 5px 7px),var(--c);color:#fff;font-family:var(--title-font);font-size:64px}
#final{font-size:clamp(27px,5.1vh,38px);color:var(--ink);text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:7px;text-underline-offset:4px}
#shareline{font-size:clamp(16px,2.6vh,19px);line-height:1.15;margin-top:5px}
.details{display:flex;flex-direction:column;gap:8px;width:100%;flex-shrink:0}
#traits{display:flex;justify-content:center;gap:6px}
.trait{background:var(--act);color:#fff;padding:6px 9px;border:2px solid var(--ink);border-radius:38% 30% 35% 28%;font-size:16px;line-height:1;transform:rotate(-2deg)}
.trait:nth-child(2){transform:rotate(2deg)}
#description{font-size:clamp(15px,2.5vh,18px);line-height:1.24;max-width:430px;margin:auto;word-break:keep-all}
#ratio{font-size:16px;line-height:1.1}
#ratio b{box-shadow:0 -7px 0 #ffd98a inset}
.compat{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.match{display:flex;align-items:center;justify-content:center;gap:5px;border:2px solid var(--ink);border-radius:18px 14px 20px 15px;background:var(--paper);padding:5px;min-height:58px}
.match img{display:block;width:42px;height:auto;max-height:48px;object-fit:contain}
.match .mini-initial{width:35px;height:35px;border:2px solid var(--ink);border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.match p{font-size:14px;line-height:1.15}
.match b{display:block;font-weight:600;font-size:16px}
.lb-rec{font-size:13px;color:#725c46;line-height:1.1}
.actions{display:flex;justify-content:center;gap:10px;width:100%;flex-shrink:0}
.actions button{min-width:0;flex:1;padding:8px 9px}
#rank{background:#ffd98a;color:var(--ink)}
#sub{font-size:13px}
.pop{animation:pop .16s ease-out}
@keyframes pop{50%{transform:scale(1.05)}}
@media(max-height:570px){
.scr{gap:8px;padding-top:calc(10px + var(--lb-safe-top,0px));padding-bottom:calc(10px + var(--lb-safe-bottom,0px))}
#start{padding-top:calc(38px + var(--lb-safe-top,0px));gap:8px}
#quiz{padding-top:calc(12px + var(--lb-safe-top,0px));padding-bottom:calc(77px + var(--lb-safe-bottom,0px));gap:9px}
#question{min-height:74px;padding:10px 12px;font-size:20px}
#options{gap:9px}
.opt{font-size:18px;padding:6px 9px;min-height:48px}
#over{gap:5px}
.details{gap:5px}
#description{font-size:15px;line-height:1.15}
.trait{font-size:14px;padding:4px 7px}
.match{min-height:44px;padding:3px}
.match img{width:32px;max-height:34px}
.match b{font-size:14px}
.match p{font-size:12px}
#ratio{font-size:14px}
#final{font-size:28px}
}
@media(max-height:420px){
#start{padding-top:calc(10px + var(--lb-safe-top,0px));gap:5px}
h1{font-size:27px}
#start .sub{font-size:16px}
#start .blob{font-size:18px;padding:4px 12px}
#quiz{gap:6px;padding-top:calc(8px + var(--lb-safe-top,0px));padding-bottom:calc(65px + var(--lb-safe-bottom,0px))}
.q-label{font-size:13px}
#question{min-height:48px;font-size:18px;padding:7px}
#options{gap:5px}
.opt{min-height:31px;font-size:16px;padding:3px 7px;border-width:2px;box-shadow:2px 2px 0}
.opt .letter{width:23px;height:23px;font-size:15px}
#hud{height:42px;bottom:calc(8px + var(--lb-safe-bottom,0px));padding:5px 9px}
.dot{height:13px;width:13px}
#info{bottom:45px;font-size:14px}
#over{display:grid;grid-template-columns:40% 1fr;grid-template-rows:auto 1fr auto;gap:5px 10px}
#why{grid-column:1/-1;font-size:14px}
.result-top{height:100%;grid-row:2;gap:4px}
#final{font-size:23px;line-height:1.1}
#shareline{font-size:14px}
.details{grid-row:2;align-self:center;gap:5px}
#traits{flex-wrap:wrap;gap:3px}
.trait{font-size:12px;padding:3px 5px}
#description{font-size:13px;line-height:1.13}
#ratio{font-size:12px}
.compat{gap:4px}
.match{flex-direction:column;gap:1px;padding:3px;min-height:0}
.match img{width:24px;max-height:25px}
.match .mini-initial{width:22px;height:22px;font-size:14px}
.match b{font-size:12px}
.match p{font-size:12px}
.lb-rec{font-size:12px}
.actions{grid-column:1/-1}
#sub{display:none}
}

lb.ready(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),hc=$('hc').getContext('2d');
const STEP=1/120,GAME=0,PAL=['#FFF4D6','#FFD98A','#3B3B3B','#3E9B5C','#E2383F'];
const SOUND={tap:'sfx/ui-audio/switch1',spark:'sfx/interface-sounds/minimize-006',win:'sfx/digital-audio/zap-three-tone-up'};
let W=0,H=0,state='start',paused=false,last=0,acc=0,clock=0,t=0,overAt=0,endT=0,index=0,locked=false,wait=0,chosen=-1,resultIndex=0,hs='',hi='',answerHistory=[],points=Array(7).fill(0),drawnDots=-1;
const types=[
{name:'벼락치기 올빼미',color:'#5B4BB7',line:'마감이 다가와야 집중력이 깨어남.',traits:['순간 몰입','야간 집중','핵심 직감'],desc:'시간이 촉박해도 중요한 내용은 빠르게 잡아내는 편. 짧게 해도 집중은 제대로 해. 잠이랑 복습할 시간도 조금 남겨 두면 좋아.',good:2,bad:1,quality:'순간 몰입'},
{name:'계획표 다람쥐',color:'#E07A2E',line:'작은 계획이 모이면 일주일이 든든해져.',traits:['꾸준한 실천','시간 감각','분량 배분'],desc:'분량이 많아도 하루치로 나누면 차근차근 해냄. 계획이 눈에 보여야 마음도 든든해져. 빈칸 하나쯤은 여유 시간으로 남겨 봐.',good:4,bad:0,quality:'계획 실천'},
{name:'몰입 거북이',color:'#3E9B5C',line:'내 속도로 깊이 파고들 때 제일 빛나.',traits:['깊은 이해','오랜 집중','차분한 탐구'],desc:'한 가지를 오래 붙들고 제대로 이해하는 편. 조용한 자리에선 내 리듬도 잘 찾아. 가끔은 고개를 들고 전체 범위도 살펴봐.',good:0,bad:3,quality:'깊은 몰입'},
{name:'수다 앵무새',color:'#E2383F',line:'말로 풀다 보면 머릿속도 또렷해져.',traits:['말로 복습','함께 성장','생생한 기억'],desc:'서로 묻고 설명하다 보면 배운 내용이 생생해져. 공부 모임에 활기를 더하는 편이기도 해. 혼자 확인하는 시간도 짧게 챙겨 봐.',good:5,bad:2,quality:'대화 학습'},
{name:'정리왕 연필',color:'#F2C230',line:'흩어진 개념도 한눈에 보이게 연결함.',traits:['개념 분류','깔끔한 요약','복습 설계'],desc:'복잡한 내용도 나누고 요약하면 길이 보임. 잘 정리한 노트는 복습할 때도 든든해. 정리가 끝나면 문제에도 바로 써먹어 봐.',good:1,bad:6,quality:'개념 정리'},
{name:'질문폭탄 문어',color:'#E86FA6',line:'궁금한 걸 풀수록 이해의 폭도 넓어져.',traits:['질문 수집','이유 탐색','연결 사고'],desc:'작은 의문도 그냥 넘기지 않고 원리를 찾아가는 편. 여러 관점을 연결해서 더 넓게 이해해. 오늘 풀 질문은 어디까지인지 정해 두면 좋아.',good:3,bad:4,quality:'질문 탐구'},
{name:'낙서왕 고양이',color:'#2F8FD0',line:'그림 한 조각이면 개념이 오래 기억나.',traits:['그림 기억','자유로운 연결','재치 있는 비유'],desc:'그림과 비유로 개념을 나만의 기억으로 바꿔. 낯선 내용에서도 재미있는 연결을 잘 찾아냄. 그림 옆에 핵심 문장도 한 줄 적어 봐.',good:5,bad:4,quality:'그림 연결'}
];
const questions=[
{scene:'시험 일주일 전 · 도서관이야',q:'문제집을 펼쳤어. 뭐부터 할까?',a:[

['궁금한 개념에 물음표를 쳐.',[[5,3],[3,1]]],
['단원 사이 관계를 그림으로 그려.',[[6,3],[4,1]]]]},
{scene:'공부할 책상 자리를 골라 봐',q:'오늘은 어디서 공부하고 싶어?',a:[
['방해 없는 도서관 구석.',[[2,3],[1,1]]],
['함께 설명할 친구 옆자리.',[[3,3],[5,1]]],
['밤에도 환한 내 책상.',[[0,3],[6,1]]],
['노트를 넓게 펼칠 자리.',[[4,3],[1,1]]]]},
{scene:'시험 닷새 전 · 어려운 페이지야',q:'낯선 공식에 손이 멈췄어. 어떡할까?',a:[
['왜 그런지 질문을 적어 봐.',[[5,3],[2,1]]],
['풀리는 장면을 만화로 그려.',[[6,3],[0,1]]],
['친구에게 말하면서 풀어 봐.',[[3,3],[5,1]]],
['예제 하나를 끝까지 파 봐.',[[2,3],[4,1]]]]},
{scene:'자취방 책상 · 벌써 저녁이야',q:'오늘 공부가 생각보다 늦어졌어.',a:[
['남은 분량을 달력에 옮겨.',[[1,3],[4,1]]],
['집중이 잘되는 김에 더 해.',[[0,3],[2,1]]],
['함께 푼 내용을 서로 물어봐.',[[3,3],[5,1]]],
['핵심만 색깔별로 묶어 봐.',[[4,3],[6,1]]]]},
{scene:'시험 나흘 전 · 복습 시간이야',q:'책을 덮고 얼마나 기억나는지 보려 해.',a:[
['빈 공책에 흐름도를 그려.',[[6,3],[4,1]]],
['누군가를 가르치듯 말해 봐.',[[3,3],[5,1]]],
['정해 둔 순서대로 점검해.',[[1,3],[2,1]]],
['헷갈린 문제만 빠르게 풀어.',[[0,3],[4,1]]]]},
{scene:'도서관 형광등 아래야',q:'친구가 낯선 풀이를 가져왔어.',a:[
['어떤 원리인지 물어봐.',[[5,3],[2,1]]],
['내 풀이와 나란히 정리해.',[[4,3],[1,1]]],
['서로 풀이를 들려줘.',[[3,3],[0,1]]],
['그림으로 두 풀이를 이어요.',[[6,3],[5,1]]]]},
{scene:'시험 이틀 전 · 몰입 중이야',q:'공부가 잘되는 순간은 언제야?',a:[
['한 문제에 푹 빠져 있을 때.',[[2,3],[5,1]]],
['계획한 칸을 하나 채울 때.',[[1,3],[4,1]]],
['급한 순간에 집중이 잘될 때.',[[0,3],[3,1]]],
['개념이 그림처럼 떠오를 때.',[[6,3],[2,1]]]]},
{scene:'책상 위 공책을 펼쳤어',q:'시험장에 가져갈 한 장을 만들어 봐.',a:[
['분류한 핵심을 색으로 묶어.',[[4,3],[1,1]]],
['자주 묻던 질문을 모아.',[[5,3],[3,1]]],
['떠올리기 쉬운 그림을 넣어.',[[6,3],[0,1]]],
['반복해서 푼 예제를 남겨.',[[2,3],[1,1]]]]},
{scene:'시험 전날 · 마지막 점검이야',q:'잠들기 전에 뭘 해 두고 싶어?',a:[
['내일 볼 순서를 적어 둬.',[[1,3],[4,2]]],
['핵심 문제에 짧게 몰입해.',[[0,3],[2,2]]],
['친구와 남은 의문을 풀어.',[[5,3],[3,2]]],
['노트 그림을 천천히 떠올려.',[[6,3],[2,1]]]]}
];
const dotEls=[];
for(let k=0;k<9;k++){
 const el=document.createElement('span');el.className='dot';$('dots').appendChild(el);dotEls.push(el);
}
lb.assets.font('font/paperlogy-eb').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/gaegu').then(v=>document.documentElement.style.setProperty('--body-font',v));

function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);
 ctx.setTransform(d,0,0,d,0,0);
 render();
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function hud(){
 const a=(index+1)+'/9',b=locked?'마커로 칠하는 중이야…':'';
 if(hs!==a){$('sc').textContent=hs=a}
 if(hi!==b){$('info').textContent=hi=b}
 if(drawnDots!==index){
  dotEls.forEach((el,k)=>{el.className='dot'+(k<index?' done':k===index?' current':'')});
  drawnDots=index;
 }
}
function reset(){
 t=0;acc=0;endT=0;index=0;locked=false;wait=0;chosen=-1;resultIndex=0;
 points=Array(7).fill(0);answerHistory=[];hs=hi='';drawnDots=-1;
 $('sub').textContent='';showQuestion();hud();
}
function start(){
 reset();state='play';
 $('start').hidden=true;$('over').hidden=true;$('quiz').hidden=false;$('hud').hidden=false;
 lb.audio.unlock();
}
function showQuestion(){
 const data=questions[index];
 $('scene').textContent=data.scene;$('question').textContent=data.q;
 const box=$('options');box.replaceChildren();
 data.a.forEach((item,k)=>{
  const button=document.createElement('button');
  button.type='button';button.className='opt enter';
  const marker=document.createElement('span');marker.className='letter';marker.textContent=['가','나','다','라'][k];
  const text=document.createElement('span');text.textContent=item[0];
  button.append(marker,text);
  button.addEventListener('pointerdown',e=>{
   if(e.isPrimary===false)return;
   select(k,button);
  });
  button.addEventListener('click',()=>select(k,button));
  box.appendChild(button);
 });
}
function select(k,button){
 if(state!=='play'||locked)return;
 locked=true;chosen=k;wait=.3;
 const allocation=questions[index].a[k][1];
 allocation.forEach(([kind,value])=>points[kind]+=value);
 answerHistory.push(k);
 [...$('options').children].forEach(el=>{el.disabled=true});
 button.classList.add('on');bump(button);
 lb.audio.sfx(SOUND.tap);lb.haptic('light');
 hud();
}
function pickResult(){
 const top=Math.max(...points),tied=points.map((n,k)=>n===top?k:-1).filter(k=>k>=0);
 if(tied.length===1)return tied[0];
 for(let q=answerHistory.length-1;q>=0;q--){
  const weights=questions[q].a[answerHistory[q]][1];
  const supported=tied.filter(k=>weights.some(v=>v[0]===k));
  if(supported.length){
   supported.sort((a,b)=>weights.find(v=>v[0]===b)[1]-weights.find(v=>v[0]===a)[1]);
   if(supported.length===1||weights.find(v=>v[0]===supported[0])[1]!==weights.find(v=>v[0]===supported[1])[1])return supported[0];
  }
 }
 const answerCode=answerHistory.reduce((sum,k,q)=>sum+(q+1)*(k+1),0);
 return tied[answerCode%tied.length];
}
function die(x,y,why,win){
 if(state!=='play')return;
 resultIndex=pickResult();state='dying';endT=.55;locked=true;
 $('why').textContent=why;
 lb.audio.sfx(SOUND.spark);lb.audio.sfx(SOUND.win);lb.haptic('success');
 lb.fx.burst(x,y,{colors:[types[resultIndex].color,PAL[1],PAL[3]]});
 lb.fx.sparkle(x,y);
}
function putPicture(target,n,mini){
 const type=types[n],url=lb.assets.url('gen/r'+(n+1));
 target.replaceChildren();
 if(url){
  const img=document.createElement('img');
  img.src=url;img.alt=type.name;
  img.style.display='block';img.style.width=mini?'42px':'100%';img.style.height='auto';img.style.objectFit='contain';
  if(!mini)img.className='result-img';
  img.addEventListener('error',()=>fallback(target,n,mini),{once:true});
  target.appendChild(img);
 }else fallback(target,n,mini);
}
function fallback(target,n,mini){
 target.replaceChildren();
 const badge=document.createElement('div');
 badge.className=mini?'mini-initial':'initial';badge.style.setProperty('--c',types[n].color);
 badge.textContent=types[n].name[0];badge.setAttribute('aria-label',types[n].name);
 target.appendChild(badge);
}
function result(){
 state='over';overAt=clock;
 const type=types[resultIndex];
 document.documentElement.style.setProperty('--c',type.color);
 $('quiz').hidden=true;$('hud').hidden=true;$('over').hidden=false;
 $('final').textContent=type.name;$('shareline').textContent=type.line;
 $('description').textContent=type.desc;
 const chips=$('traits');chips.replaceChildren();
 type.traits.forEach(text=>{const span=document.createElement('span');span.className='trait';span.textContent=text;chips.appendChild(span)});
 const total=points.reduce((a,b)=>a+b,0),percent=Math.round(points[resultIndex]/total*100);
 $('ratio').replaceChildren();
 const strong=document.createElement('b');strong.textContent=type.quality+' '+percent+'%';
 $('ratio').append(strong,document.createTextNode('· 내 답변에서 차지하는 비중이야'));
 $('goodname').textContent=types[type.good].name;$('badname').textContent=types[type.bad].name;
 putPicture($('art'),resultIndex,false);putPicture($('goodart'),type.good,true);putPicture($('badart'),type.bad,true);
 lb.done(type.name);
}
function update(dt){
 t+=dt;
 if(locked){
  wait-=dt;
  if(wait<=0){
   if(index===8){die(W*.5,H*.43,'내 공부 스타일은 바로 이거!',true);return}
   index++;locked=false;chosen=-1;showQuestion();hud();
  }
 }
}
function stroke(c,pointsList,color,width){
 c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';
 c.beginPath();pointsList.forEach((p,k)=>k?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();
}
function drawBackground(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle=PAL[0];ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#d8bd872e';ctx.lineWidth=1;
 for(let y=21;y<H;y+=29){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.strokeStyle='#d67c6d40';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(31,0);ctx.lineTo(31,H);ctx.stroke();
 const safe=lb.safe;
 const top=(safe.top||0)+12,left=(safe.left||0)+12,right=W-(safe.right||0)-12;
 const wiggle=matchMedia('(prefers-reduced-motion: reduce)').matches?0:Math.sin(clock*.65)*1.5;
 ctx.save();ctx.translate(right-20,top+12+wiggle);ctx.rotate(.18);
 ctx.fillStyle='#ffd98a';ctx.strokeStyle=PAL[2];ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(-9,-14);ctx.lineTo(8,-14);ctx.lineTo(8,18);ctx.lineTo(-9,18);ctx.closePath();ctx.fill();ctx.stroke();
 stroke(ctx,[[-8,-5],[7,-5]],PAL[2],3);stroke(ctx,[[-5,19],[4,19],[4,24],[-5,24],[-5,19]],PAL[2],2.5);
 for(let yy=-12;yy<17;yy+=5)stroke(ctx,[[-7,yy],[6,yy-3]],'#fff7',2);
 ctx.restore();
 ctx.save();ctx.translate(left+14,top+12);ctx.rotate(-.12);
 stroke(ctx,[[-9,0],[-3,2],[1,-6],[4,2],[11,3],[5,7],[7,14],[0,10],[-7,14],[-5,7],[-9,0]],'#78624a',2.5);
 ctx.restore();
}
function drawHero(c,x,y,h){
 c.save();c.translate(x,y);const s=h/160;c.scale(s,s);
 c.fillStyle='#ffd98a';c.strokeStyle=PAL[2];c.lineWidth=4;c.lineJoin='round';
 c.beginPath();c.moveTo(-94,10);c.lineTo(69,7);c.lineTo(91,35);c.lineTo(-74,40);c.closePath();c.fill();c.stroke();
 stroke(c,[[-80,28],[77,24]],'#a3814f',3);
 lb.assets.draw(c,'gen/r1',-15,-65,155,160);
 c.save();c.translate(79,-13);c.rotate(-.15);
 c.fillStyle='#fffef8';c.fillRect(-31,-41,66,71);c.strokeRect(-31,-41,66,71);
 stroke(c,[[-20,-20],[24,-22]],'#3e9b5c',4);
 stroke(c,[[-20,-7],[17,-9]],'#e2383f',4);
 stroke(c,[[-20,6],[20,4]],'#ffd98a',5);
 c.restore();c.restore();
}
function render(){
 if(!W||!H)return;
 drawBackground();
 if(state==='start'){
  hc.clearRect(0,0,600,440);
  const sway=matchMedia('(prefers-reduced-motion: reduce)').matches?0:Math.sin(clock*.8)*3;
  drawHero(hc,285,325+sway,285);
 }
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(paused)return;
 clock+=dt;
 if(state==='play'){
  acc+=dt;
  while(acc>=STEP&&state==='play'){update(STEP);acc-=STEP}
 }else if(state==='dying'){
  endT-=dt;if(endT<=0)result();
 }
 render();
}
lb.onPause(p=>{paused=p;last=0});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.7)start()});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 const type=types[resultIndex];
 lb.share('내 공부 스타일은'+type.name+'이에요! '+type.line);
});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
