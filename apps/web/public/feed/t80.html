<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>여행지에서 길 잘 찾는 띠 순위</title>
<style>
  /* 기본 색(원본 «골목 탐험 지도 순위») — 실행 팔레트가 오면 그 값으로 바뀌어요 */
  :where(:root){--bg:#F6F3EE;--card:#FFFFFF;--ink:#2E3138;--sub:#5E636B;--line:#D9D2C5;--accent:#FF7A59;--accent-ink:#FFFFFF;--soft:#FFD166;--soft2:#4ECDC4;--heart:#E85D75;--gold:#F2B705}
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
  html, body { overflow-x: hidden; }
  body {
    background-color: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  #app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
  }
  .screen {
    display: none;
    flex-direction: column;
    padding: 24px;
    min-height: 100vh;
    width: 100%;
  }
  .screen.active { display: flex; }

  /* 지도 판 */
  .isometric-map {
    flex: 1;
    background: linear-gradient(135deg, color-mix(in srgb, var(--soft2) 22%, var(--card)) 0%, color-mix(in srgb, var(--soft) 30%, var(--card)) 100%);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    padding: 18px;
    border: 3px solid var(--ink);
    box-shadow: 0 8px 0 var(--ink);
    margin-bottom: 22px;
  }
  .map-chip {
    font-weight: 800; font-size: 13px; background: color-mix(in srgb, var(--card) 90%, transparent);
    padding: 6px 12px; border-radius: 12px; border: 2px solid var(--ink); display: inline-block; align-self: flex-start;
    color: var(--ink); line-height: 1.35; position: relative; z-index: 3;
  }

  .title-area { text-align: center; margin: 6px 0 16px; }
  .title-area h1 { font-size: 24px; font-weight: 900; color: var(--ink); margin-bottom: 10px; line-height: 1.3; }
  .title-area p {
    font-size: 14px; color: var(--sub); line-height: 1.4;
    background: color-mix(in srgb, var(--card) 85%, transparent);
    padding: 8px 16px; border-radius: 20px; display: inline-block; border: 2px solid var(--ink);
  }
  .intro-center { text-align: center; margin: auto 0; }
  .intro-bus { font-size: 48px; margin-bottom: 10px; display: inline-block; animation: drive 2.4s ease-in-out infinite; }
  @keyframes drive { 50% { transform: translateX(8px); } }
  .intro-line { font-size: 14px; font-weight: 700; line-height: 1.45; color: var(--ink); }

  /* 시작 화면 TOP 3 경로 */
  .top3 {
    background: color-mix(in srgb, var(--card) 88%, transparent);
    padding: 10px 8px 12px; border-radius: 14px; border: 2px solid var(--ink);
  }
  .top3-label { font-size: 12px; font-weight: 800; text-align: center; margin-bottom: 8px; color: var(--ink); }
  .top3-row { display: flex; justify-content: space-between; align-items: flex-start; position: relative; gap: 4px; }
  .top3-row::before {
    content: ""; position: absolute; left: 16%; right: 16%; top: 25px;
    border-top: 3px dashed var(--ink); opacity: 0.5;
  }
  .top3-item { flex: 1; min-width: 0; text-align: center; position: relative; }
  .top3-item img, .top3-item .ph {
    width: 50px; height: 50px; object-fit: cover; border-radius: 50%;
    border: 2px solid var(--ink); background: var(--card); display: block; margin: 0 auto;
  }
  .top3-item.first img { border: 3px solid var(--gold); box-shadow: 0 0 0 2px var(--ink); }
  .top3-item span { display: block; font-size: 12px; font-weight: 800; margin-top: 5px; line-height: 1.3; color: var(--ink); }

  .btn {
    background: var(--accent);
    color: var(--accent-ink);
    border: 3px solid var(--ink);
    padding: 16px;
    font-size: 18px;
    font-weight: 800;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
    text-align: center;
    width: 100%;
    line-height: 1.3;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }

  /* 질문 화면: 정류장 N개 경로 */
  .q-title { font-size: 19px; font-weight: 800; line-height: 1.35; color: var(--ink); text-align: center; margin: 4px 0 6px; }
  .q-intro { font-size: 13px; color: var(--sub); text-align: center; line-height: 1.45; margin-bottom: 12px; }
  .q-intro:empty { display: none; }
  .route-map { flex: 0 0 auto; height: 170px; margin-bottom: 18px; justify-content: flex-start; }
  .route-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .route-svg path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-dasharray: 7 6; stroke-linecap: round; opacity: 0.55; }
  .stop {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: var(--card); border: 2px solid var(--ink); transform: translate(-50%, -50%); z-index: 1;
    transition: background 0.2s, transform 0.2s;
  }
  .route-map.dense .stop { width: 7px; height: 7px; border-width: 1.5px; }
  .stop.on { background: var(--accent); transform: translate(-50%, -50%) scale(1.6); }
  .stop-flag { position: absolute; transform: translate(-50%, -100%); font-size: 18px; z-index: 1; line-height: 1; }
  .isometric-bus {
    position: absolute;
    width: 44px; height: 44px;
    background: var(--accent);
    border: 3px solid var(--ink);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 0 var(--ink);
    transform: translate(-50%, -50%);
    transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 2;
  }

  .options-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-bottom: 8px; }
  .option-card {
    background: var(--card);
    color: var(--ink);
    border: 3px solid var(--ink);
    padding: 12px 8px;
    border-radius: 16px;
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    line-height: 1.3;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--ink);
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 52px; min-width: 0;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .option-card:active, .option-card.picked { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
  .option-card.picked { background: var(--accent); color: var(--accent-ink); }
  .options-grid.few .option-card { min-height: 84px; font-size: 19px; font-weight: 800; }
  .options-grid.many { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .options-grid.many .option-card { font-size: 14px; padding: 10px 4px; min-height: 46px; border-width: 2px; border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }

  /* 결과 화면 */
  #screen-result { padding-top: 16px; }
  .scroll-map {
    background: color-mix(in srgb, var(--soft) 8%, var(--card));
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 20px 16px;
    box-shadow: 0 6px 0 var(--ink);
    margin-bottom: 22px;
  }
  .scroll-title { text-align: center; font-weight: 900; font-size: 18px; margin-bottom: 16px; line-height: 1.35; color: var(--ink); }
  .my-rank-card {
    background: var(--soft);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 18px 14px 16px;
    margin-bottom: 22px;
    box-shadow: 0 4px 0 var(--ink);
    text-align: center;
    position: relative;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .ribbon {
    position: absolute; top: -14px; right: -6px; max-width: 70%;
    background: var(--accent); color: var(--accent-ink); border: 2px solid var(--ink);
    padding: 4px 8px; border-radius: 8px; font-weight: 900; font-size: 12px; line-height: 1.3;
  }
  .my-rank-card img {
    width: 96px; height: 96px; object-fit: cover; background: var(--card);
    border: 2px solid var(--ink); border-radius: 50%; margin: 6px auto 8px; display: block;
  }
  .res-rank { font-weight: 900; font-size: 15px; color: var(--ink); margin-bottom: 2px; }
  .res-rank b { color: var(--accent); background: var(--card); border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; margin-left: 2px; }
  .res-name { font-weight: 900; font-size: 21px; line-height: 1.3; margin-top: 6px; }
  .res-tagline { font-size: 14px; font-weight: 700; color: var(--ink); opacity: 0.8; margin: 2px 0 10px; line-height: 1.4; }
  .res-desc { font-size: 14px; line-height: 1.55; margin-bottom: 10px; }
  .traits-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0; }
  .trait-tag {
    background: var(--card); color: var(--ink); border: 2px solid var(--ink);
    padding: 4px 8px; border-radius: 8px; font-size: 13px; font-weight: 700; line-height: 1.3;
  }
  .info-box {
    font-size: 13px; font-weight: 700; margin-top: 8px; line-height: 1.45;
    background: color-mix(in srgb, var(--card) 75%, transparent); padding: 6px 10px; border-radius: 8px; color: var(--ink);
  }
  .info-box.quote { font-style: normal; border-left: 4px solid var(--accent); text-align: left; }
  .info-box.tip { font-weight: 600; text-align: left; }

  /* 순위 경로: 정류장(순위 핀) + 카드 */
  .route-list { position: relative; display: flex; flex-direction: column; gap: 10px; }
  .route-list.many { max-height: 62vh; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
  .rank-stop { display: flex; align-items: center; gap: 10px; position: relative; }
  /* 정류장끼리 잇는 점선(다음 줄 핀까지) */
  .rank-stop:not(:last-child)::before {
    content: ""; position: absolute; left: 17px; top: 50%; height: calc(100% + 10px);
    border-left: 3px dashed var(--ink); opacity: 0.45;
  }
  .rank-badge {
    flex-shrink: 0; font-weight: 900; font-size: 14px;
    background: var(--soft2); color: var(--ink); border: 2px solid var(--ink);
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); position: relative; z-index: 1;
  }
  .rank-badge span { transform: rotate(45deg); }
  .rank-stop.top .rank-badge { background: color-mix(in srgb, var(--gold) 40%, var(--card)); color: var(--ink); border: 3px solid var(--gold); }
  .rank-stop.me .rank-badge { background: var(--accent); color: var(--accent-ink); }
  .rank-item {
    flex: 1; min-width: 0; display: flex; align-items: center;
    background: var(--card); color: var(--ink); border: 2px solid var(--ink);
    padding: 8px 10px; border-radius: 12px; gap: 10px;
  }
  .rank-stop.me .rank-item { border: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .rank-item img { width: 36px; height: 36px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .rank-info { flex: 1; min-width: 0; }
  .rank-info .name { font-weight: 800; font-size: 14px; line-height: 1.3; }
  .rank-info .tagline { font-size: 12px; color: var(--sub); line-height: 1.35; }
  .rank-stop.me .rank-item { position: relative; margin-top: 8px; }
  .me-tag { position: absolute; top: -12px; right: 10px; font-size: 12px; font-weight: 900; color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 2px 6px; }

  .action-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
  .action-buttons .btn { flex: 1; font-size: 16px; }
  .btn.retry { background: var(--soft2); color: var(--ink); }
  .hidden { display: none !important; }
</style>
<style id="feedy-palette">:root:root{--bg:#eef5fb;--card:#ffffff;--ink:#15212e;--sub:#4e5d6c;--line:#dce8f2;--accent:#3d9cf0;--accent-ink:#15212e;--soft:#d6eaff;--soft2:#edf6ff;--heart:#f0473c;--gold:#f5a524}</style></head>
<body>
<div id="app">
  <!-- 시작 화면 -->
  <div id="screen-start" class="screen active">
    <div class="title-area">
      <h1>여행지에서 길 잘 찾는 띠 순위</h1>
      <p>골목길에서도 한 번에 숙소 찾아가는 띠는?</p>
    </div>

    <div class="isometric-map">
      <div class="map-chip">길찾기 레이더</div>
      <div class="intro-center">
        <div class="intro-bus">🚌💨</div>
        <div class="intro-line" id="txt-intro"></div>
      </div>
      <div class="top3" id="top3">
        <div class="top3-label">인간 네비 TOP 3</div>
        <div class="top3-row" id="top3-row"></div>
      </div>
    </div>

    <button class="btn" data-start>내 띠 순위 확인하기</button>
  </div>

  <!-- 유형 고르기 -->
  <div id="screen-q" class="screen">
    <h2 class="q-title" id="q-text"></h2>
    <p class="q-intro" id="q-intro"></p>
    <div class="isometric-map route-map" id="route-map">
      <svg class="route-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path id="route-path" vector-effect="non-scaling-stroke" d=""/></svg>
      <div class="map-chip">골목길 위치</div>
      <div class="isometric-bus" id="bus">🚌</div>
    </div>
    <div class="options-grid" id="options-container"></div>
  </div>

  <!-- 결과 화면 -->
  <div id="screen-result" class="screen" data-result-id="">
    <div class="scroll-map">
      <div class="scroll-title">여행지 길찾기 띠별 랭킹</div>

      <div class="my-rank-card">
        <div class="ribbon">길찾기 스타일</div>
        <img id="res-img" src="" alt="">
        <div class="res-rank">나의 길찾기 순위 <b id="res-rank"></b></div>
        <div class="res-name" id="res-name"></div>
        <div class="res-tagline" id="res-tagline"></div>
        <div class="res-desc" id="res-desc"></div>
        <div class="traits-list" id="res-traits"></div>
        <div class="info-box quote hidden" id="res-quote"></div>
        <div class="info-box tip hidden" id="res-tip"></div>
        <div class="info-box hidden" id="res-match-box">환상의 길동무: <span id="res-match" style="font-weight: 900;"></span></div>
      </div>

      <div class="route-list" id="full-ranking"></div>
    </div>

    <div class="action-buttons">
      <button class="btn retry" id="btn-retry">다른 띠도 찾아보기</button>
      <button class="btn" id="btn-share" data-share>여행 친구에게 공유하기</button>
    </div>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const D = window.DATA;
  if (!D) return;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const $ = id => document.getElementById(id);

  const intro = D.intro_line || '';
  $('txt-intro').innerText = intro;
  $('q-intro').innerText = intro;

  const sorted = [...(D.results || [])].sort((a, b) => (a.rank || 0) - (b.rank || 0));
  const many = sorted.length > 16;

  // 시작 화면 TOP 3
  const top3 = sorted.slice(0, 3);
  if (!top3.length) $('top3').classList.add('hidden');
  $('top3-row').innerHTML = top3.map((r, i) => `
    <div class="top3-item ${i === 0 ? 'first' : ''}">
      ${r.img ? `<img src="${esc(r.img)}" alt="${esc(r.name)}">` : '<div class="ph"></div>'}
      <span>${esc(r.rank)}위 ${esc(r.name)}</span>
    </div>`).join('');

  const screens = document.querySelectorAll('.screen');
  function show(id) {
    screens.forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  // 질문 + 정류장 N개 경로(구불구불한 길 위에 고르게 놓아요)
  const qData = (D.questions && D.questions[0]) || { q: '', options: [] };
  const opts = qData.options || [];
  const N = Math.max(1, opts.length);
  $('q-text').innerText = qData.q || '';
  const pt = t => ({ x: 14 + 76 * t, y: 64 - 20 * Math.sin(t * Math.PI * 3) });
  let d = '';
  for (let i = 0; i <= 90; i++) { const p = pt(i / 90); d += (i ? ' L ' : 'M ') + p.x.toFixed(2) + ' ' + p.y.toFixed(2); }
  $('route-path').setAttribute('d', d);
  const map = $('route-map');
  if (N > 16) map.classList.add('dense');
  const stopPos = i => pt(N === 1 ? 0.5 : i / (N - 1));
  const stops = [];
  for (let i = 0; i < N; i++) {
    const p = stopPos(i), s = document.createElement('div');
    s.className = 'stop'; s.style.left = p.x + '%'; s.style.top = p.y + '%';
    map.appendChild(s); stops.push(s);
  }
  const flag = document.createElement('div');
  const last = stopPos(N - 1);
  flag.className = 'stop-flag'; flag.textContent = '🏁'; flag.style.left = last.x + '%'; flag.style.top = (last.y - 4) + '%';
  map.appendChild(flag);
  const bus = $('bus');
  function parkBus() { const p = pt(0); bus.style.left = p.x + '%'; bus.style.top = p.y + '%'; stops.forEach(s => s.classList.remove('on')); }
  parkBus();

  const grid = $('options-container');
  if (opts.length > 16) grid.classList.add('many');
  else if (opts.length <= 4) grid.classList.add('few');
  grid.innerHTML = opts.map((opt, i) => `<button type="button" class="option-card" data-opt="${i}">${esc(opt.text)}</button>`).join('');

  let current = null, busy = false;
  grid.addEventListener('click', e => {
    const card = e.target.closest('[data-opt]');
    if (!card || busy) return;
    busy = true;
    const idx = parseInt(card.getAttribute('data-opt'), 10);
    card.classList.add('picked');
    LB.answer(0, idx);
    current = LB.result();
    // 버스가 고른 정류장으로 달려가요
    const p = stopPos(idx);
    bus.style.left = p.x + '%'; bus.style.top = p.y + '%';
    if (stops[idx]) stops[idx].classList.add('on');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(() => { showResult(current); busy = false; }, 750);
  });

  document.querySelector('[data-start]').addEventListener('click', () => show('screen-q'));

  function setText(id, text) { const el = $(id); el.innerText = text || ''; el.classList.toggle('hidden', !text); }

  function showResult(res) {
    if (!res) return;
    show('screen-result');
    $('screen-result').setAttribute('data-result-id', res.id);

    const img = $('res-img');
    img.src = res.img || ''; img.alt = res.name || ''; img.classList.toggle('hidden', !res.img);
    $('res-rank').innerText = `${res.rank}위`;
    setText('res-name', res.name);
    setText('res-tagline', res.tagline);
    setText('res-desc', res.desc);
    $('res-traits').innerHTML = (res.traits || []).filter(Boolean).map(t => `<div class="trait-tag">#${esc(t)}</div>`).join('');
    setText('res-quote', res.quote ? `“${res.quote}”` : '');
    setText('res-tip', res.tip ? `💡 ${res.tip}` : '');

    const matchObj = res.match ? LB.byId(res.match) : null;
    $('res-match').innerText = matchObj ? `${matchObj.name}${matchObj.tagline ? ` (${matchObj.tagline})` : ''}` : '';
    $('res-match-box').classList.toggle('hidden', !matchObj);

    const list = $('full-ranking');
    list.classList.toggle('many', many);
    list.innerHTML = sorted.map(r => {
      const me = r.id === res.id;
      return `
      <div class="rank-stop ${me ? 'me' : ''} ${r.rank <= 3 ? 'top' : ''}">
        <div class="rank-badge"><span>${esc(r.rank)}</span></div>
        <div class="rank-item">
          ${r.img ? `<img src="${esc(r.img)}" alt="${esc(r.name)}">` : ''}
          <div class="rank-info">
            <div class="name">${esc(r.name)}</div>
            ${r.tagline ? `<div class="tagline">${esc(r.tagline)}</div>` : ''}
          </div>
          ${me ? `<span class="me-tag">📍 나의 띠</span>` : ''}
        </div>
      </div>`;
    }).join('');
    if (many) requestAnimationFrame(() => {
      const meRow = list.querySelector('.rank-stop.me');
      if (meRow) list.scrollTop = Math.max(0, meRow.offsetTop - list.clientHeight / 2 + meRow.offsetHeight / 2);
    });
  }

  $('btn-retry').addEventListener('click', () => {
    LB.reset();
    current = null;
    grid.querySelectorAll('.picked').forEach(el => el.classList.remove('picked'));
    $('screen-result').setAttribute('data-result-id', '');
    parkBus();
    show('screen-start');
  });

  $('btn-share').addEventListener('click', () => {
    const res = current || LB.result();
    if (res) LB.share(res.id);
  });
});
</script>
</body>
</html>
