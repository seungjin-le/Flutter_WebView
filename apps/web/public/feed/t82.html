<title>빌런 적성 검사</title>
<style>
  /* 기본 색(원본 «마왕성 던전 청소부 적성검사» 픽셀 RPG) — 실행 팔레트가 오면 그 값으로 바뀌어요 */
  :where(:root){--bg:#1A1026;--card:#000000;--ink:#F4F0FF;--sub:#AFA3C8;--line:#332244;--accent:#FF0055;--accent-ink:#F4F0FF;--soft:#2A1A40;--soft2:#0D0714;--heart:#00E5FF;--gold:#FFE600}

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  body {
    background-color: var(--soft2);
    color: var(--ink);
    font-family: 'DungGeunMo', 'NeoDungGeunMo', 'Galmuri11', 'Orbit', 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #game-container {
    width: 100%;
    max-width: 400px;
    height: 100vh;
    height: 100dvh;
    max-height: 700px;
    background-color: var(--bg);
    border: 4px solid var(--ink);
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--accent), inset 0 0 20px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    /* 금색 글자는 글자색 쪽으로 살짝 섞어 밝은 팔레트에서도 읽히게 */
    --gold-text: color-mix(in srgb, var(--gold) 62%, var(--ink));
  }

  /* 주사선 효과 */
  #game-container::after {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.14) 50%);
    background-size: 100% 4px;
    z-index: 99;
    pointer-events: none;
  }

  /* 상태 바 */
  .status-bar {
    background-color: var(--bg);
    border-bottom: 4px solid var(--ink);
    padding: 10px;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  #dungeon-floor { color: var(--gold-text); }
  .status-tag { font-size: 12px; color: var(--sub); text-align: right; }

  .hp-bar-container, .exp-bar-container {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    flex: 1;
    min-width: 0;
  }

  .bar {
    flex: 1;
    min-width: 0;
    max-width: 120px;
    height: 12px;
    border: 2px solid var(--ink);
    background: var(--card);
    position: relative;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    transition: width 0.3s steps(10);
  }

  .hp-fill { background-color: var(--accent); }
  .exp-fill { background-color: var(--heart); }

  /* 화면 전환 번쩍 */
  .transition-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--soft2);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .transition-overlay.flash {
    animation: flashAnim 0.3s steps(3);
  }
  @keyframes flashAnim {
    0% { opacity: 1; background: var(--ink); }
    50% { opacity: 0; }
    100% { opacity: 1; background: var(--soft2); }
  }

  /* 본 화면 */
  .viewport {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 12px;
    position: relative;
    overflow-y: auto;
  }

  /* 시작 화면 */
  .intro-screen {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100%;
    text-align: center;
    gap: 12px;
  }

  .game-title {
    font-size: 20px;
    color: var(--gold-text);
    text-shadow: 2px 2px var(--accent);
    margin: 6px 0 8px;
    line-height: 1.4;
  }

  .game-subtitle {
    font-size: 13px;
    color: var(--heart);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .intro-box {
    border: 2px dashed var(--ink);
    padding: 10px;
    background: var(--soft);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 12px;
    text-align: left;
  }
  .intro-box:empty { display: none; }

  .slime-preview-grid {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .slime-preview-item {
    width: 48px;
    height: 48px;
    border: 2px solid var(--heart);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    image-rendering: pixelated;
  }
  .slime-preview-item img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    image-rendering: pixelated;
  }

  /* 버튼 */
  .retro-btn {
    background-color: var(--accent);
    color: var(--accent-ink);
    border: 3px solid var(--ink);
    box-shadow: inset -3px -3px 0px rgba(0,0,0,0.35), inset 3px 3px 0px rgba(255,255,255,0.35);
    padding: 12px 10px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    text-align: center;
    position: relative;
    flex-shrink: 0;
  }
  .retro-btn:active {
    box-shadow: inset 3px 3px 0px rgba(0,0,0,0.35);
    transform: translateY(2px);
  }
  .retro-btn.alt {
    background-color: var(--card);
    color: var(--ink);
    border-color: var(--heart);
  }

  /* 질문 화면 */
  .quiz-screen {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    justify-content: space-between;
    gap: 12px;
  }

  .dialog-box {
    border: 3px solid var(--ink);
    background: var(--card);
    padding: 12px;
    box-shadow: 4px 4px 0px var(--accent);
    margin-bottom: 4px;
    position: relative;
  }

  .question-head {
    font-size: 12px;
    color: var(--gold-text);
    margin-bottom: 6px;
  }
  .question-head::before { content: "■ "; }

  .question-text {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
  }

  .options-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 6px;
  }

  .option-btn {
    background: var(--bg);
    border: 2px solid var(--heart);
    color: var(--ink);
    padding: 10px 10px 10px 26px;
    font-family: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    position: relative;
    line-height: 1.5;
  }

  .option-btn:hover, .option-btn:focus {
    background: var(--soft);
    border-color: var(--gold);
    outline: none;
  }

  .option-btn::before {
    content: "▶";
    position: absolute;
    left: 8px;
    color: var(--accent);
    animation: blink 1s infinite steps(1);
  }

  @keyframes blink {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }

  /* 결과 화면 */
  .result-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    padding-bottom: 10px;
  }

  .level-up-banner {
    font-size: 18px;
    color: var(--gold-text);
    text-shadow: 2px 2px var(--accent);
    animation: bounce 0.5s infinite alternate;
    line-height: 1.4;
  }

  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-3px); }
  }

  .result-main-area {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    justify-content: center;
  }

  .result-img-box {
    width: 104px;
    height: 104px;
    border: 3px solid var(--gold);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .result-img-box img {
    width: 92px;
    height: 92px;
    object-fit: contain;
    image-rendering: pixelated;
  }

  .result-info {
    text-align: left;
    min-width: 0;
  }

  .result-name {
    font-size: 17px;
    color: var(--ink);
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .result-tagline {
    font-size: 13px;
    color: var(--heart);
    line-height: 1.5;
  }

  .result-quote {
    font-size: 13px;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--ink);
    padding: 8px 10px;
    line-height: 1.5;
    width: 100%;
    text-align: left;
  }
  .result-quote::before { content: "▶ "; color: var(--gold-text); }

  .result-desc {
    font-size: 13px;
    background: var(--soft);
    color: var(--ink);
    border: 1px dashed var(--ink);
    padding: 8px;
    line-height: 1.6;
    text-align: left;
    width: 100%;
  }

  .traits-box {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .trait-tag {
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 12px;
    padding: 3px 6px;
    border: 1px solid var(--ink);
  }

  .match-box {
    font-size: 13px;
    color: var(--ink);
    border-top: 1px solid var(--line);
    padding-top: 8px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    line-height: 1.5;
  }
  .match-box .lbl { color: var(--heart); }
  .match-box.mismatch .lbl { color: var(--sub); }

  .match-img-box {
    width: 40px;
    height: 40px;
    border: 2px solid var(--heart);
    background: var(--card);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .match-box.mismatch .match-img-box { border-color: var(--line); }

  .match-img-box img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    image-rendering: pixelated;
  }

  .result-tip {
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    width: 100%;
    text-align: left;
    border: 2px dashed var(--gold);
    padding: 8px 10px;
  }
  .result-tip .lbl { color: var(--gold-text); margin-right: 4px; }

  .result-actions {
    display: flex;
    gap: 8px;
    width: 100%;
    margin-top: 4px;
  }

  .result-actions button {
    flex: 1;
    font-size: 14px;
    padding: 10px 6px;
  }

  .hidden { display: none !important; }
</style>

<body>

<div id="game-container">
  <div class="status-bar">
    <div class="status-row">
      <span id="dungeon-floor"></span>
      <span class="status-tag">빌런 적성 검사 퀘스트</span>
    </div>
    <div class="status-row">
      <div class="hp-bar-container">
        <span>HP</span>
        <div class="bar"><div class="bar-fill hp-fill" id="hp-bar" style="width: 100%;"></div></div>
      </div>
      <div class="exp-bar-container">
        <span>EXP</span>
        <div class="bar"><div class="bar-fill exp-fill" id="exp-bar" style="width: 0%;"></div></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport">
    <!-- 시작 화면 -->
    <div class="intro-screen" id="screen-intro">
      <div>
        <div class="game-title" id="lbl-title">빌런 적성 검사</div>
        <div class="game-subtitle" id="lbl-subtitle">비밀 연합 입단 심사 퀘스트</div>
        <div class="intro-box" id="lbl-intro"></div>
        <div class="slime-preview-grid" id="preview-grid"></div>
      </div>
      <button class="retro-btn" data-start>입단 심사 시작</button>
    </div>

    <!-- 질문 화면 -->
    <div class="quiz-screen hidden" id="screen-quiz">
      <div class="dialog-box">
        <div class="question-head hidden" id="q-head"></div>
        <div class="question-text" id="q-text"></div>
      </div>
      <div class="options-container" id="options-container"></div>
    </div>

    <!-- 결과 화면 -->
    <div class="result-screen hidden" id="screen-result">
      <div class="level-up-banner">내 빌런 클래스</div>
      <div class="result-main-area">
        <div class="result-img-box">
          <img id="res-img" src="" alt="">
        </div>
        <div class="result-info">
          <div class="result-name" id="res-name"></div>
          <div class="result-tagline" id="res-tagline"></div>
        </div>
      </div>
      <div class="result-quote hidden" id="res-quote"></div>
      <div class="result-desc" id="res-desc"></div>
      <div class="traits-box" id="res-traits"></div>
      <div class="match-box" id="res-match-container">
        <span><span class="lbl">찰떡 궁합 파티원</span> <span id="res-match-name"></span></span>
        <div class="match-img-box"><img id="res-match-img" src="" alt=""></div>
      </div>
      <div class="match-box mismatch hidden" id="res-mismatch-container">
        <span><span class="lbl">상극 디버프 대상</span> <span id="res-mismatch-name"></span></span>
        <div class="match-img-box"><img id="res-mismatch-img" src="" alt=""></div>
      </div>
      <div class="result-tip hidden" id="res-tip"><span class="lbl">생존 공략 팁</span><span id="res-tip-text"></span></div>
      <div class="result-actions">
        <button class="retro-btn" id="btn-restart">다시 심사받기</button>
        <button class="retro-btn alt" id="btn-share" data-share>결과 공유하기</button>
      </div>
    </div>
  </div>

  <div class="transition-overlay" id="transition"></div>
  <span id="t-stage" hidden>던전 단계</span><span id="t-clear" hidden>심사 완료</span>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const DATA = window.DATA;
    const LB = window.LB;
    if (!DATA) return;

    const STAGE = document.getElementById('t-stage').textContent;
    const CLEAR = document.getElementById('t-clear').textContent;

    const viewport = document.getElementById('viewport');
    const screenIntro = document.getElementById('screen-intro');
    const screenQuiz = document.getElementById('screen-quiz');
    const screenResult = document.getElementById('screen-result');

    const previewGrid = document.getElementById('preview-grid');
    const qHead = document.getElementById('q-head');
    const qText = document.getElementById('q-text');
    const optionsContainer = document.getElementById('options-container');
    const dungeonFloor = document.getElementById('dungeon-floor');
    const hpBar = document.getElementById('hp-bar');
    const expBar = document.getElementById('exp-bar');
    const transition = document.getElementById('transition');

    if (DATA.title) document.getElementById('lbl-title').textContent = DATA.title;
    if (DATA.subtitle) document.getElementById('lbl-subtitle').textContent = DATA.subtitle;
    document.getElementById('lbl-intro').textContent = DATA.intro_line || '';

    (DATA.results || []).filter(r => r.img).slice(0, 4).forEach(r => {
      const box = document.createElement('div');
      box.className = 'slime-preview-item';
      const img = document.createElement('img');
      img.src = r.img; img.alt = '';
      box.appendChild(img);
      previewGrid.appendChild(box);
    });

    function setFloor(n) { dungeonFloor.textContent = `${STAGE} B${n}F`; }
    setFloor(1);

    let busy = false;
    function triggerTransition(callback) {
      busy = true;
      transition.classList.add('flash');
      setTimeout(() => {
        if (callback) callback();
        viewport.scrollTop = 0;
        setTimeout(() => {
          transition.classList.remove('flash');
          busy = false;
        }, 200);
      }, 150);
    }

    const totalQCount = DATA.questions.length;
    let currentQIdx = 0;
    let currentRes = null;

    function updateBars(currentQ) {
      setFloor(currentQ + 1);
      expBar.style.width = `${(currentQ / totalQCount) * 100}%`;
    }

    function loadQuestion(idx) {
      currentQIdx = idx;
      updateBars(idx);

      const qData = DATA.questions[idx];
      qHead.textContent = qData.head || '';
      qHead.classList.toggle('hidden', !qData.head);
      qText.textContent = qData.q;

      optionsContainer.innerHTML = '';
      qData.options.forEach((opt, oIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.setAttribute('data-opt', oIdx);
        btn.textContent = opt.text;
        btn.addEventListener('click', () => {
          if (busy) return;
          triggerTransition(() => {
            LB.answer(currentQIdx, oIdx);
            if (currentQIdx + 1 < totalQCount) {
              loadQuestion(currentQIdx + 1);
            } else {
              showResult();
            }
          });
        });
        optionsContainer.appendChild(btn);
      });
    }

    function fillPair(boxId, nameId, imgId, obj) {
      const box = document.getElementById(boxId);
      box.classList.toggle('hidden', !obj);
      if (!obj) return;
      document.getElementById(nameId).textContent = obj.name;
      const img = document.getElementById(imgId);
      img.src = obj.img || '';
      img.alt = obj.name;
      img.parentElement.classList.toggle('hidden', !obj.img);
    }

    function showResult() {
      screenQuiz.classList.add('hidden');
      screenIntro.classList.add('hidden');
      screenResult.classList.remove('hidden');

      expBar.style.width = '100%';
      hpBar.style.width = '100%';
      dungeonFloor.textContent = CLEAR;

      const res = LB.result();
      if (!res) return;
      currentRes = res;

      screenResult.setAttribute('data-result-id', res.id);
      const img = document.getElementById('res-img');
      img.src = res.img || '';
      img.alt = res.name;
      document.getElementById('res-name').textContent = res.name;
      document.getElementById('res-tagline').textContent = res.tagline || '';
      document.getElementById('res-desc').textContent = res.desc || '';

      const quote = document.getElementById('res-quote');
      quote.textContent = res.quote || '';
      quote.classList.toggle('hidden', !res.quote);

      const traitsBox = document.getElementById('res-traits');
      traitsBox.innerHTML = '';
      (res.traits || []).forEach(t => {
        const s = document.createElement('span');
        s.className = 'trait-tag';
        s.textContent = t;
        traitsBox.appendChild(s);
      });

      fillPair('res-match-container', 'res-match-name', 'res-match-img', res.match ? LB.byId(res.match) : null);
      fillPair('res-mismatch-container', 'res-mismatch-name', 'res-mismatch-img', res.mismatch ? LB.byId(res.mismatch) : null);

      document.getElementById('res-tip-text').textContent = res.tip || '';
      document.getElementById('res-tip').classList.toggle('hidden', !res.tip);
    }

    document.querySelector('[data-start]').addEventListener('click', () => {
      if (busy) return;
      triggerTransition(() => {
        screenIntro.classList.add('hidden');
        screenQuiz.classList.remove('hidden');
        LB.reset();
        hpBar.style.width = '100%';
        loadQuestion(0);
      });
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      triggerTransition(() => {
        LB.reset();
        currentRes = null;
        screenResult.classList.add('hidden');
        screenIntro.classList.remove('hidden');
        expBar.style.width = '0%';
        setFloor(1);
      });
    });

    document.getElementById('btn-share').addEventListener('click', () => {
      if (currentRes) LB.share(currentRes.id);
    });
  });
</script>
<script>(function () {
  var W = window, L = W.LB;
  if (!L || typeof L.result !== "function") return;
  function mark() {
    var l = W.lb; if (!l || typeof l.scroll !== "function" || !document.body) return;
    var all = document.body.querySelectorAll("*");
    for (var i = 0; i < all.length && i < 2000; i++) {
      var el = all[i]; if (el.__lbScroll || (el.closest && el.closest(".lv-scr"))) continue;
      var cs = W.getComputedStyle(el);
      if (!(cs.overflowY === "auto" || cs.overflowY === "scroll") || el.scrollHeight <= el.clientHeight + 2 || cs.visibility === "hidden") continue;
      var r = el.getBoundingClientRect(), vw = W.innerWidth || 0, vh = W.innerHeight || 0;
      if (r.width > 0 && r.height > 0 && r.right > 1 && r.left < vw - 1 && r.bottom > 1 && r.top < vh - 1) try { l.scroll(el); } catch (e) {}
    }
  }
  var f = L.result;
  L.result = function () { var r = f.apply(this, arguments); [0, 300, 1000, 2500].forEach(function (t) { setTimeout(mark, t); }); return r; };
})();</script></body>
</html>
