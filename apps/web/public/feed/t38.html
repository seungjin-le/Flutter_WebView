<html lang="ko">
<head>


<title>내 라인 찾기</title>
<style>
:root{--bg:#1B2433;--paper:#2C3A52;--ink:#f5efd9;--edge:#342b25;--act:#C9A44A;--gold:#C9A44A;--on:#1B2433;--c:#C9A44A;--blue:#5FB3D9;--title-font:serif;--body-font:serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font,serif)}
button{font-family:var(--title-font,serif);font-weight:700;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 5%,#C9A44A19,transparent 65%),repeating-linear-gradient(0deg,transparent 0 39px,#5FB3D90a 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#5FB3D90a 39px 40px),var(--bg)}
#app:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 65px #1B2433aa;z-index:0}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
h1,h2,h3,p{margin:0;word-break:keep-all}
h1,h2,h3,#final{font-family:var(--title-font,serif);font-weight:700;letter-spacing:-.02em}
.scr{position:absolute;inset:0;z-index:1}
.safe{padding:calc(12px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(12px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px))}
#start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(8px,2vh,16px);padding-top:calc(60px + var(--lb-safe-top,0px))}
.quest-head{display:flex;align-items:center;gap:10px;width:100%;color:var(--gold);font-size:12px;letter-spacing:.08em}
.quest-head:before,.quest-head:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
.quest-head:after{transform:scaleX(-1)}
.sign{border:2px solid var(--gold);background:var(--paper);box-shadow:0 5px 0 var(--edge),inset 0 0 0 4px var(--bg);padding:12px 22px;position:relative}
.sign:before,.sign:after{content:"";position:absolute;top:7px;width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
.sign:before{left:7px}.sign:after{right:7px}
h1{font-size:clamp(29px,5vh,36px);line-height:1.2}
.start-art{flex:1;min-height:45px;max-height:340px;width:100%;display:flex;justify-content:center;align-items:center;position:relative}
.slot{background:radial-gradient(ellipse at 50% 40%,#5FB3D91b,var(--bg) 72%);border:2px solid var(--gold);position:relative}
.start-slot{width:min(76%,270px);height:100%;border-radius:40% 40% 38% 38% / 18% 18% 55% 55%;overflow:hidden;box-shadow:0 5px 0 var(--edge),inset 0 0 30px #C9A44A13}
.art-image{display:block;width:100%;height:auto;max-width:100%;object-fit:contain}
.start-slot img{height:100%;filter:brightness(0);opacity:.75}
.mystery{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--title-font,serif);font-size:clamp(32px,10vh,72px);color:var(--gold);text-shadow:0 3px var(--edge)}
.glint{position:absolute;pointer-events:none;color:var(--gold);font-family:serif;font-size:22px;right:12px;top:14px;animation:glint 3s ease-in-out infinite}
.glint.second{left:15px;right:auto;top:auto;bottom:25px;font-size:14px;animation-delay:1.1s}
#hook{font-size:clamp(15px,2.5vh,18px);line-height:1.65}
.start-sub{font-size:12px;color:#c7cbd0;line-height:1.5}
.action{min-height:56px;border:2px solid var(--gold);border-radius:6px;padding:10px 24px;background:var(--act);color:var(--on);font-size:18px;box-shadow:0 5px 0 var(--edge)}
.action:active{box-shadow:0 2px 0 var(--edge);background:#e0bf6a}
#go{width:min(100%,280px);flex:none}
#play{display:flex;flex-direction:column;gap:clamp(10px,2.4vh,20px);justify-content:center}
.play-title{font-family:var(--title-font,serif);font-size:clamp(17px,3vh,21px);color:var(--gold);display:flex;gap:9px;align-items:center}
.crest{width:23px;height:28px;display:inline-block;flex:none;background:var(--gold);clip-path:polygon(0 0,100% 0,94% 64%,50% 100%,6% 64%);position:relative}
.crest:after{content:"";position:absolute;inset:4px;background:var(--paper);clip-path:polygon(0 0,100% 0,94% 61%,50% 100%,6% 61%)}
.progress-path{display:flex;justify-content:space-between;position:relative;padding:8px 4px}
.progress-path:before{content:"";position:absolute;top:50%;left:9px;right:9px;border-top:1px dashed #C9A44A88}
.dot{position:relative;z-index:1;display:block;width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--gold);background:var(--bg)}
.dot.past{background:var(--gold)}.dot.current{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 3px #5FB3D922}
.card{position:relative;border:2px solid var(--gold);background:var(--paper);box-shadow:0 5px 0 var(--edge),inset 0 0 0 4px var(--bg);border-radius:7px}
.question-card{padding:clamp(16px,3.2vh,26px) 18px;min-height:125px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.quest-label{color:var(--gold);font-size:12px;letter-spacing:.04em}
#question{font-size:clamp(20px,3.4vh,24px);font-family:var(--title-font,serif);font-weight:700;line-height:1.55;word-break:keep-all}
#choices{display:grid;gap:clamp(8px,1.8vh,13px)}
.opt{display:flex;align-items:center;text-align:left;gap:12px;width:100%;min-height:clamp(51px,8.5vh,65px);padding:7px 12px 7px 7px;border:2px solid var(--gold);border-radius:6px;background:var(--paper);color:var(--ink);font-size:clamp(16px,2.8vh,18px);box-shadow:0 4px 0 var(--edge);line-height:1.45;transition:background .12s,border-color .12s}
.opt .letter{display:grid;place-items:center;flex:none;width:32px;height:32px;background:var(--bg);border:1px solid #C9A44A80;color:var(--gold);font-size:15px;border-radius:3px}
.opt.on,.opt:active{background:var(--gold);color:var(--bg);box-shadow:0 2px 0 var(--edge)}
.opt.on .letter{border-color:var(--bg)}
.opt:disabled{cursor:default}
.opt.enter{animation:appear .18s ease-out both}
#hud{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#d3d6dc;font-size:12px;border-top:1px solid #C9A44A66;padding-top:10px}
#sc{color:var(--gold);font-size:16px;font-variant-numeric:tabular-nums}
#judging{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;background:#1B2433e8}
.reveal-shield{width:130px;height:155px;border:4px solid var(--gold);background:var(--paper);clip-path:polygon(0 0,100% 0,94% 66%,50% 100%,6% 66%);display:grid;place-items:center;animation:unfold .65s ease-out both}
.reveal-shield .crest{width:48px;height:60px}
#judging h2{font-size:24px;color:var(--gold)}
#judging p{font-size:15px}
#over{background:var(--bg)}
#rp{position:absolute;inset:0}
#rp section{margin:14px 14px 20px;padding:20px 17px;border:2px solid var(--gold);border-radius:8px;background:var(--paper);box-shadow:0 5px 0 var(--edge);position:relative}
#rp section:first-child{margin-top:14px;padding:14px 12px 22px;border-color:var(--c)}
.result-label{color:var(--gold);font-size:12px;text-align:center;letter-spacing:.04em}
#why{font-size:13px;text-align:center;margin:10px 0 8px;color:#e2e3dc}
.result-art{height:clamp(225px,49vh,420px);display:flex;align-items:center;justify-content:center;margin:12px 0 16px;border-color:var(--c);border-radius:16px 16px 40% 40% / 16px 16px 12% 12%;overflow:hidden}
.result-art img{width:100%;height:auto;max-height:100%;object-fit:contain}
.initial{display:grid;place-items:center;width:100%;height:100%;min-height:60px;background:var(--c);color:var(--ink);font-family:var(--title-font,serif);font-size:clamp(48px,15vh,100px);border-radius:22%;text-shadow:0 3px var(--edge)}
.start-slot .initial{opacity:.5;filter:brightness(.3)}
#final{display:block;text-align:center;font-size:clamp(32px,5.8vh,40px);line-height:1.4;color:var(--ink);word-break:keep-all}
.role-row{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:9px 0}
.role-tag{font-size:12px;border:1px solid var(--c);padding:4px 8px;background:var(--bg);border-radius:3px}
#share-line{text-align:center;font-size:16px;line-height:1.7;margin-top:12px}
.section-title{font-size:20px;color:var(--gold);margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:17px}
.chip{padding:7px 9px;border:1px solid var(--c);border-radius:4px;background:var(--bg);font-size:14px}
#description{font-size:16px;line-height:1.95}
#description p+p{margin-top:7px}
.lb-rec{margin-top:18px;padding-top:13px;border-top:1px dashed var(--gold);font-size:14px;color:var(--gold)}
.affinity-note{font-size:12px;line-height:1.6;color:#c7cbd0;margin:20px 0 12px}
.stat{margin-top:12px}
.stat-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.stat-head b{font-variant-numeric:tabular-nums;min-width:3em;text-align:right}
.bar{height:10px;border:1px solid var(--c);border-radius:3px;background:linear-gradient(90deg,var(--c) var(--v),var(--bg) var(--v))}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair{min-width:0;border:1px solid var(--gold);background:var(--bg);border-radius:5px;padding:10px 7px;text-align:center}
.pair-label{font-size:12px;color:var(--gold);margin-bottom:8px}
.mini-art{height:110px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mini-art img{height:auto;max-height:100%;width:100%;object-fit:contain}
.mini-art .initial{font-size:38px;max-width:85px;min-height:0}
.pair h3{font-size:16px;line-height:1.6;margin-top:7px}
.pair p{font-size:12px;line-height:1.65;margin-top:7px;color:#d3d6dc}
#rp section:last-child{display:flex;flex-direction:column;gap:13px;padding:20px 17px 25px}
#again,#rank{width:100%;min-height:56px}
#rank{background:var(--paper);color:var(--gold)}
.result-foot{font-size:12px;text-align:center;color:#c7cbd0;line-height:1.7}
#sub{font-size:12px;text-align:center;color:var(--gold)}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes appear{from{opacity:.35;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
@keyframes unfold{from{transform:scaleX(.12) scaleY(.8);opacity:.2}to{transform:scale(1);opacity:1}}
@media(max-height:520px){
#start{padding-top:calc(14px + var(--lb-safe-top,0px));gap:7px}
.sign{padding:7px 20px}.start-art{max-height:180px}
#play{gap:9px}.question-card{min-height:95px;padding:12px 16px}
#choices{gap:8px}.opt{min-height:48px}
#hook{line-height:1.4}.start-sub{font-size:12px}
}
@media(max-height:420px){
#start{gap:5px}.quest-head{font-size:12px}.sign{padding:5px 17px}h1{font-size:26px}
#hook{font-size:13px}.start-sub{display:none}
#go{min-height:48px;padding:7px 20px;font-size:17px}
#play{gap:7px;padding-top:calc(8px + var(--lb-safe-top,0px));padding-bottom:calc(8px + var(--lb-safe-bottom,0px))}
.play-title{font-size:16px}.crest{height:21px;width:18px}
.progress-path{padding:3px 4px}.dot{width:8px;height:8px}
.question-card{min-height:68px;padding:9px 12px;gap:3px}
#question{font-size:18px;line-height:1.4}.quest-label{font-size:12px}
#choices{grid-template-columns:1fr 1fr;gap:7px}
.opt{min-height:50px;font-size:14px;padding:5px;gap:6px}
.opt .letter{width:23px;height:28px;font-size:12px}
#hud{padding-top:5px;font-size:12px}#sc{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="start" class="scr safe">
  <div class="quest-head">협곡 입단 의뢰</div>
  <div class="sign"><h1>내 라인 찾기</h1></div>
  <div class="start-art">
    <div id="start-art" class="slot start-slot">
      <span class="mystery">?</span>
      <span class="glint" aria-hidden="true">✦</span>
      <span class="glint second" aria-hidden="true">✦</span>
    </div>
  </div>
  <p id="hook">협곡의 부름이 왔다,<br>네 자리는 어디인가</p>
  <p class="start-sub">리그 오브 레전드 라인 성향 퀘스트<br>팬 제작 · 실력 판정 아닌 취향 탐색임</p>
  <button id="go" class="action" type="button">모험 시작</button>
</div>
<div id="play" class="scr safe" hidden>
  <div class="play-title"><span class="crest" aria-hidden="true"></span>협곡 입단 심사</div>
  <div id="path" class="progress-path" aria-hidden="true"></div>
  <div class="card question-card">
    <p id="quest-label" class="quest-label"></p>
    <h2 id="question"></h2>
  </div>
  <div id="choices"></div>
  <div id="hud" hidden>
    <span id="info">성향 기록 중</span>
    <b id="sc">1/10</b>
  </div>
</div>
<div id="judging" class="scr safe" hidden>
  <div class="reveal-shield" aria-hidden="true"><span class="crest"></span></div>
  <h2>능력 감정 중…</h2>
  <p>협곡 문장에 성향 각인 중임</p>
</div>
<div id="over" class="scr" hidden>
  <div id="rp">
    <section class="rar">
      <p class="result-label">협곡 입단 심사 · 영웅 카드</p>
      <p id="why">심사 완료, 네 라인이 정해졌다</p>
      <div id="result-art" class="slot result-art"></div>
      <div class="role-row"><span id="role" class="role-tag"></span><span id="animal" class="role-tag"></span></div>
      <b id="final"></b>
      <p id="share-line"></p>
    </section>
    <section>
      <h2 class="section-title">패시브 스킬 확인</h2>
      <div id="chips" class="chips"></div>

 r.chips.forEach(text=>{const s=document.createElement('span');s.className='chip';s.textContent=text;$('chips').appendChild(s)});
 $('description').replaceChildren();
 r.desc.forEach(text=>{const p=document.createElement('p');p.textContent=text;$('description').appendChild(p)});
 $('record').textContent='입단 기록 · '+r.line+' 역할 배정 완료';
 const good=TYPES[r.good],bad=TYPES[r.bad];
 putArt($('good-art'),r.good);putArt($('bad-art'),r.bad);
 $('good-name').textContent=good.name;$('bad-name').textContent=bad.name;
 $('good-note').textContent=r.goodNote;$('bad-note').textContent=r.badNote;
 $('stats').replaceChildren();
 const total=points.reduce((a,b)=>a+b,0);
 points.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v||tie[b.i]-tie[a.i]).slice(0,3).forEach(({v,i})=>{
  const pct=Math.round(v/total*100),row=document.createElement('div'),head=document.createElement('div'),name=document.createElement('span'),num=document.createElement('b'),bar=document.createElement('div');
  row.className='stat';head.className='stat-head';name.textContent=TYPES[i].name;num.textContent=pct+'%';bar.className='bar';bar.style.setProperty('--v',pct+'%');head.append(name,num);row.append(head,bar);$('stats').appendChild(row);
 });
 lb.scroll(document.getElementById("rp"), { result: r.name });
 if(!reduced)lb.fx.confetti();
}
function update(dt){
 if(state==='play'&&pending!==-1){
  wait-=dt;
  if(wait<=0){
   if(index===QUESTIONS.length-1)die();
   else{index++;showQuestion()}
  }
 }else if(state==='dying'){
  endT-=dt;if(endT<=0)result();
 }
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(paused)return;
 clock+=dt;update(dt);render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.35)start()});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 const r=TYPES[resultIndex];
 lb.share('내 라인 찾기 · '+r.name+'\n'+r.share+'\n리그 오브 레전드 라인 성향 퀘스트');
});
lb.onPause(p=>{paused=p;last=0});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
