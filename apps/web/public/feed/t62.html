  {name:"연유퐁당 소금빵", color:"#E9C46A", art:"gen/r5", desc:"부드럽고 달콤 짭조름한 매력의 소유자! 온화한 미소로 모두를 편안하게 함.", chips:["단짠단짠","부드러움","온화함"], best:"쫀득말차 뚱카롱", worst:"바삭콘치즈 나초", share:"헐 내 신상 간식은 연유퐁당 소금빵 나옴! 너는 뭐 나옴?"},

let scores=new Array(8).fill(0);

function resize(){W=cv.clientWidth;H=cv.clientHeight;const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);U=Math.max(1,Math.min(W,H)/10);if(W&&state==='start')render();}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function hud(){const a=`${qi+1}/8`;if(a!==hs)$('sc').textContent=hs=a;}
function reset(){qi=0;shk=0;down=false;hs='';scores.fill(0);hud();}
function start(){
  reset();state='ask';
  $('start').hidden=$('over').hidden=true;$('hud').hidden=false;
  lb.audio.unlock();lb.audio.sfx('click');
  showQuestion();
}

function showQuestion(){
  if(qi>=questions.length){result();return;}
  hud();
  const qObj=questions[qi];
  $('q-text').textContent=qObj.q;
  const optsEl=$('opts');
  optsEl.innerHTML='';
  qObj.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    const keys=['A','B','C','D'];
    btn.innerHTML=`<div class="k">${keys[i]}</div><span>${o.t}</span>`;
    btn.addEventListener('click',()=>{
      if(down)return; down=true;
      bump(btn);
      lb.audio.sfx('click');
      o.s.forEach(idx=>scores[idx]++);
      qi++;
      setTimeout(()=>{down=false; showQuestion();},200);
    });
    optsEl.appendChild(btn);
  });
}

function result(){
  state='over';overAt=clock;$('hud').hidden=true;$('over').hidden=false;
  let maxIdx=0,maxScore=-1;
  scores.forEach((s,i)=>{if(s>maxScore){maxScore=s;maxIdx=i;}});
  const res=resultsData[maxIdx];
  document.documentElement.style.setProperty('--c',res.color);
  
  const rp=$('rp');
  rp.innerHTML=`
    <section>
      <div class="rib">내 영혼의 신상 간식 발견!</div>
      <div class="result-img-box">
        <img data-lb-art="${res.art}" alt="${res.name}">
      </div>
      <h2 style="font-family:var(--title-font,sans-serif);font-size:28px;color:var(--c);margin-bottom:6px" id="final">${res.name}</h2>
      <p style="font-size:14px;color:#64748b">${res.share}</p>
    </section>
    <section>
      <div class="chip-row">
        ${res.chips.map(c=>`<div class="chip">${c}</div>`).join('')}
      </div>
      <p style="font-size:16px;line-height:1.5;color:#334155">${res.desc}</p>
      <div class="match-box" style="margin-top:16px;border-top:1px solid #e2e8f0;padding-top:12px">
        <div><b>잘 맞는:</b> ${res.best}</div>
        <div><b>안 맞는:</b> ${res.worst}</div>
      </div>
    </section>
    <section>
      <div class="action-btns">
        <button id="again" type="button">다시</button>
        <button id="rank" type="button">공유</button>
      </div>
    </section>
  `;
  $('again').addEventListener('click',()=>{if(clock-overAt>.7)start();});
  $('rank').addEventListener('click',()=>lb.share(res.share));
  lb.scroll(rp,{result:res.name});
}

function drawHero(c,x,y,h){
  c.save();c.translate(x,y);
  c.fillStyle='#00B4D8';c.beginPath();c.arc(0,0,h*0.4,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(-h*0.12,-h*0.08,h*0.08,0,Math.PI*2);c.arc(h*0.12,-h*0.08,h*0.08,0,Math.PI*2);c.fill();
  c.fillStyle='#1E293B';c.beginPath();c.arc(-h*0.12,-h*0.08,h*0.03,0,Math.PI*2);c.arc(h*0.12,-h*0.08,h*0.03,0,Math.PI*2);c.fill();
  c.strokeStyle='#1E293B';c.lineWidth=3;c.beginPath();c.arc(0,0,h*0.18,0,Math.PI);c.stroke();
  c.restore();
}
function render(){hc.clearRect(0,0,160,160);drawHero(hc,80,80,100);}
function frame(now){requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(!W){resize();if(!W)return;}if(paused)return;clock+=dt;shk=Math.max(0,shk-dt);render();}
const up=()=>{down=false;};
lb.onPause(p=>{paused=p;last=0;up();});
$('go').addEventListener('click',start);
addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);resize();if(W&&H)render();requestAnimationFrame(frame);
});
</script></body></html>
