<html lang="ko">
<head>


<title>칠가이 테스트</title>
<style>
:root{--desk:#3AA6A0;--paper:#fff;--ink:#172523;--chrome:#d4d0c8;--em:#c00000;--c:#F7D648;--title-font:system-ui,sans-serif;--body-font:ui-monospace,monospace}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--desk);color:var(--ink)}
body{font-family:var(--body-font)}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
h1,h2,p{margin:0;word-break:keep-all}
button{font-family:var(--title-font);font-size:18px;color:var(--ink);cursor:pointer;touch-action:manipulation}
.scr{position:absolute;inset:0;padding:calc(12px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(12px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px));display:flex;flex-direction:column;gap:10px;overflow:hidden}
.btn{border:2px solid var(--ink);border-radius:0;min-height:64px;padding:8px 16px;background:var(--chrome);box-shadow:inset 3px 3px #fff,inset -3px -3px #888}
.btn:active{box-shadow:inset 3px 3px #888;background:#bfc9c4}
button:focus-visible{outline:3px dashed #fff;outline-offset:3px}
.bar{padding:5px 8px;background:#23467f;color:#fff;font-size:18px}
.paper{background:var(--paper);border:2px solid var(--ink);box-shadow:inset 2px 2px #c2d1cd}
.ttl{font-family:var(--title-font);font-weight:400;letter-spacing:-.035em;line-height:1.14}
.ttl em{font-style:normal;color:var(--em)}
#start{padding-top:calc(60px + var(--lb-safe-top,0px));text-align:center;gap:10px}
#start h1{font-size:clamp(30px,5.3vh,40px)}
#start .tagline{font-size:clamp(16px,2.5vh,18px);line-height:1.45}
#start .mini{font-size:clamp(12px,2vh,15px);line-height:1.4}
#startArt{flex:1;min-height:55px;position:relative;background:#fff;border:2px dashed var(--ink);margin:0 8px}
#hc{width:100%;height:100%;display:block}
#go{flex-shrink:0;width:100%}
.pal{display:flex;gap:4px;align-items:center}
.pal i{display:block;flex:1;height:19px;max-width:28px;border:2px solid var(--ink);background:#fff}
.pal i.past{background:var(--c)}
.pal i.now{background:#E5484D;outline:1px dashed #fff;outline-offset:-5px}
#start .pal{justify-content:center}
#start .pal i{flex:0 1 24px}
#hud{position:absolute;top:var(--lb-safe-top,0px);left:var(--lb-safe-left,0px);right:var(--lb-safe-right,0px);padding:10px 16px;display:flex;gap:12px;align-items:center;pointer-events:none;z-index:3}
#sc{font-size:18px;white-space:normal;background:#fff;border:2px solid;padding:4px 7px;font-weight:500}
#hud .pal{flex:1}
#info{font-size:18px}
#play{padding-top:calc(62px + var(--lb-safe-top,0px));gap:10px}
#scene{flex:1;min-height:105px;position:relative;display:flex;flex-direction:column;justify-content:flex-start;gap:10px}
#chatLabel{align-self:flex-start;font-size:18px;background:#fff;padding:4px 9px;border:1px solid}
#question{position:relative;z-index:1;font-size:clamp(20px,3.7vh,24px);line-height:1.4;padding:14px 13px 20px;background:#fff;border:2px solid var(--ink)}
#question:after{content:"";position:absolute;left:25px;bottom:-11px;width:17px;height:17px;background:#fff;border-right:2px solid;border-bottom:2px solid;transform:skewY(32deg)}
#hero{position:absolute;bottom:0;left:0;width:32%;height:46%;max-height:140px;min-height:40px;pointer-events:none}
#note{align-self:flex-end;margin-top:auto;max-width:63%;font-size:18px;padding:5px 8px;background:#F7D648;border:1px solid;transform:rotate(1deg)}
#answers{display:grid;gap:8px;flex-shrink:0}
.opt{min-height:54px;text-align:left;padding:8px 10px;display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:0;font-family:var(--body-font);font-size:clamp(17px,2.8vh,19px);line-height:1.3}
.opt i{font-family:var(--title-font);font-size:17px;flex:0 0 27px;height:28px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--swatch);font-style:normal}
.opt.on{background:var(--c);border-width:3px;padding:7px 9px}
.opt:active{background:var(--c)}
.opt:disabled{color:var(--ink);opacity:1}
#playFoot{display:flex;align-items:center;gap:10px;min-height:64px}
#back{min-width:100px;min-height:64px;font-size:18px}
#back:disabled{opacity:.5;cursor:default}
#smallNote{font-size:16px;line-height:1.4}
#judge{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#e9f5f2;z-index:5}
#judge p{font-size:24px;font-family:var(--title-font)}
.prog{border:2px solid var(--ink);padding:4px;width:75%;height:32px;background:#fff}
.prog b{height:100%;display:block;background:#23467f;width:0}
#over{gap:8px;background:var(--desk)}
#why{font-size:clamp(14px,2.4vh,18px);text-align:center}
#resultCard{display:flex;flex-direction:column;flex:1;min-height:0;padding:9px;gap:6px;background:#fff;border:2px solid var(--ink)}
#portrait{position:relative;flex:1;min-height:55px;margin:3px 4px;border:2px dashed var(--ink);background:#fff}
#rc{display:block;width:100%;height:100%}
#resultTag{position:absolute;top:5px;left:6px;background:var(--c);border:1px solid;padding:2px 5px;font-size:14px;pointer-events:none}
#final{font-family:var(--title-font);font-size:clamp(28px,4.7vh,36px);font-weight:400;line-height:1.1;text-align:center;word-break:keep-all}
#shareline{text-align:center;font-size:clamp(15px,2.6vh,18px);line-height:1.4}
#chips{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid;padding:3px 6px;background:var(--c);font-size:clamp(13px,2.3vh,16px);transform:rotate(-1deg)}
.chip:nth-child(2){transform:rotate(1deg)}
#description{font-size:clamp(14px,2.4vh,17px);line-height:1.45}
#matches{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.match{border:1px solid;background:#fff;padding:4px;font-size:clamp(13px,2.2vh,16px);line-height:1.4;word-break:keep-all}
.match span{display:block;font-size:12px}
.match b{font-weight:500}
#record{text-align:center;font-size:13px}
#resultActions{display:flex;gap:8px;flex-shrink:0}
#resultActions .btn{flex:1;min-width:0;padding:7px;min-height:64px}
#sub{font-size:14px;text-align:center}
.pop{animation:pop .18s}
@keyframes pop{50%{opacity:.55}}
.dd{position:absolute;width:42px;height:32px;right:8px;bottom:9px;shape-rendering:crispEdges;pointer-events:none}
@media(max-height:570px){
.scr{gap:6px;padding-top:calc(7px + var(--lb-safe-top,0px))}
#start{padding-top:calc(30px + var(--lb-safe-top,0px));gap:6px}
#play{padding-top:calc(54px + var(--lb-safe-top,0px));gap:6px}
#scene{min-height:85px}
#chatLabel{font-size:14px;padding:2px 6px}
#question{font-size:19px;line-height:1.3;padding:8px 10px 12px}
#note{font-size:14px}
#answers{gap:5px}
.opt{min-height:48px;padding:6px 9px;font-size:17px}
.opt.on{padding:5px 8px}
#smallNote{font-size:13px}
#resultCard{padding:6px;gap:4px}
#description{font-size:13px;line-height:1.3}
#final{font-size:27px}
#why,#shareline{font-size:14px}
#resultTag{font-size:12px}
.chip{font-size:12px;padding:2px 4px}
.match{font-size:12px}
#record{font-size:12px}
#resultActions .btn{min-height:56px}
}
@media(max-height:400px){
#start{padding-top:calc(8px + var(--lb-safe-top,0px));gap:4px}
#start h1{font-size:25px}
#start .mini,#start .pal{display:none}
#start .tagline{font-size:14px}
#startArt{min-height:25px}
#go{min-height:56px}
#play{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 56px;column-gap:10px}
#scene{min-height:0;grid-column:1;grid-row:1}
#answers{grid-column:2;grid-row:1 / 3;gap:4px}
#question{font-size:17px}
#note,#hero,#chatLabel{display:none}
#playFoot{grid-column:1;grid-row:2;min-height:0}
#back{min-height:52px}
#smallNote{display:none}
#resultCard{display:grid;grid-template-columns:33% 1fr;grid-template-rows:auto auto auto auto auto;gap:3px 8px}
#portrait{grid-column:1;grid-row:1 / 6;min-height:0;margin:3px}
#resultTag{display:none}
#final{font-size:22px}
#shareline{font-size:12px}
#description{font-size:12px;line-height:1.2}
#chips{gap:3px}
.chip{font-size:11px}
#matches{grid-column:2;gap:3px}
.match{font-size:11px}
.match span{font-size:10px}
#record,#why,#sub{display:none}

['물멍 오리','#F7D648',0,13,'둥실 떠서 오늘의 물결을 봐.','순한 낙관','물멍 취향','소소한 기쁨','작은 풍경에서도 기쁨을 찾는 모습이 닮았어. 마음에 든 순간은 짧게 남겨봐.'],
['유튜브 라쿤','#5E6472',15,1,'작은 재미도 잘 찾아내지.','재미 탐색','간식 친구','호기심 가득','일상에서 재미를 찾아내는 호기심이 닮았어. 눈이 피곤해지면 화면 밖도 둘러봐.'],
['이불속 햄스터','#E8C39E',1,14,'이불 한 겹이면 세상이 포근해.','포근한 취향','혼자 충전','안정 소중','스스로 편하게 돌볼 줄 아는 모습이 닮았어. 기운을 채웠다면 바깥 공기도 쐬어봐.'],
['노을보는 기린','#E0A100',7,11,'고개를 들면 좋은 장면이 보여.','풍경 수집','넓은 시야','느긋한 감성','멀리 내다보며 풍경을 즐기는 시선이 닮았어. 오늘 발밑의 작은 일도 살펴보자.'],
['혼밥 판다','#1A1A1A',6,9,'혼자 먹는 한 끼도 꽤 근사해.','독립적인 맛','든든한 일상','혼자도 편안','혼자서도 일상을 알차게 즐기는 모습이 닮았어. 맛있는 순간엔 친구도 떠올려봐.'],
['자유로운 갈매기','#F5F5F5',12,2,'바람이 좋으면 가볍게 떠나.','가벼운 발길','열린 마음','새 풍경 취향','새로운 바람을 반기는 자유로움이 닮았어. 함께 가는 사람의 보폭도 살펴봐.'],
['퇴근길 개구리','#3FBF7F',10,0,'할 만큼 했으니 어깨 힘 좀 빼자.','전환 잘함','작은 해방','오늘 수고함','하루를 마치고 기분을 바꾸는 힘이 닮았어. 쉬는 시간도 미리 조금 챙겨두자.']
];
const resultKeys=['gen/r1','gen/r2','gen/r3','gen/r4','gen/r5','gen/r6','gen/r7','gen/r8','gen/r9','gen/r10','gen/r11','gen/r12','gen/r13','gen/r14','gen/r15','gen/r16'];
const progressCells=[];
for(let i=0;i<9;i++){const el=document.createElement('i');$('progress').appendChild(el);progressCells.push(el);}
const choiceButtons=[];
for(let i=0;i<4;i++){
const b=document.createElement('button');b.type='button';b.className='opt';
const tile=document.createElement('i');tile.textContent=['가','나','다','라'][i];tile.style.setProperty('--swatch',[PAL[4],PAL[3],PAL[0],PAL[1]][i]);
const text=document.createElement('span');b.append(tile,text);$('answers').appendChild(b);choiceButtons.push(b);
b.addEventListener('click',()=>choose(i));
}
lb.assets.font('font/dohyeon').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/galmuri11').then(v=>document.documentElement.style.setProperty('--body-font',v));
function sizeCanvas(canvas){
const w=canvas.clientWidth,h=canvas.clientHeight,d=Math.min(devicePixelRatio||1,2);
if(!w||!h)return;
const nw=Math.round(w*d),nh=Math.round(h*d);
if(canvas.width!==nw||canvas.height!==nh){canvas.width=nw;canvas.height=nh;}
canvas.getContext('2d').setTransform(d,0,0,d,0,0);
canvas.getContext('2d').imageSmoothingEnabled=false;
}
function resize(){
W=cv.clientWidth;H=cv.clientHeight;sizeCanvas(cv);
sizeCanvas($('hc'));sizeCanvas($('hero'));sizeCanvas($('rc'));
ctx.imageSmoothingEnabled=false;
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function hud(){
const text=(qi+1)+'/9';
if(text!==hs){$('sc').textContent=hs=text;progressCells.forEach((el,i)=>el.className=i<qi?'past':i===qi?'now':'');}
}
function reset(){
t=0;score=0;qi=0;answers=[];locked=false;wait=0;judging=0;endT=0;nod=0;walk=0;lastFill=-1;hs='';hi='';
$('sub').textContent='';$('judge').hidden=true;
$('rank').textContent='결과 공유';
document.documentElement.style.setProperty('--c',PAL[3]);hud();showQuestion();
}
function start(){
reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
lb.audio.unlock();lb.audio.sfx(CLICK);lb.audio.music('music/oga-chiptunes/level-2',{loop:true,volume:.22});resize();
}
function showQuestion(){
const q=Q[qi];$('chatLabel').textContent=q[0];$('question').textContent=q[1];$('note').textContent=q[2];
choiceButtons.forEach((b,i)=>{b.lastChild.textContent=q[i+3][0];b.classList.remove('on');b.disabled=false;});
$('back').disabled=qi===0;hud();
}
function choose(i){
if(state!=='play'||locked)return;
locked=true;answers[qi]=i;wait=.23;nod=.48;walk=.65;
choiceButtons.forEach((b,j)=>{b.disabled=true;b.classList.toggle('on',j===i);});
lb.audio.sfx(CLICK);lb.haptic('light');bump($('question'));
const rect=choiceButtons[i].getBoundingClientRect();
lb.fx.ripple(rect.left+27,rect.top+rect.height/2,{colors:[PAL[0],PAL[3]]});
}
function back(){
if(state!=='play'||locked||qi===0)return;
qi--;answers.length=qi;nod=.3;showQuestion();lb.audio.sfx(CLICK);lb.haptic('light');
}
function decide(){
const totals=Array(16).fill(0),lastSupport=Array(16).fill(-1);
answers.forEach((a,n)=>{
const pair=Q[n][a+3][1];
totals[pair[0]]+=3;totals[pair[1]]+=2;
lastSupport[pair[0]]=n*2+1;lastSupport[pair[1]]=n*2;
});
let winner=0;
for(let i=1;i<16;i++){
if(totals[i]>totals[winner]||(totals[i]===totals[winner]&&lastSupport[i]>lastSupport[winner]))winner=i;
}
return winner;
}
function die(x,y,why,win){
if(state!=='play')return;
resultIndex=decide();state='dying';endT=.48;
$('why').textContent=why;$('judge').hidden=true;$('play').hidden=true;$('hud').hidden=true;
lb.audio.stopMusic();lb.audio.sfx(WIN);lb.haptic('success');
lb.fx.burst(x,y,{colors:[PAL[0],PAL[3],PAL[1]]});
}
function result(){
state='over';overAt=clock;
const r=R[resultIndex];$('final').textContent=r[0];$('shareline').textContent=r[4];
$('description').textContent=r[8];$('goodMatch').textContent=R[r[2]][0];$('badMatch').textContent=R[r[3]][0];
$('chips').replaceChildren();
r.slice(5,8).forEach(s=>{const c=document.createElement('span');c.className='chip';c.textContent=s;$('chips').appendChild(c);});
$('record').textContent='아홉 장면 모두 골랐어.';
document.documentElement.style.setProperty('--c',resultIndex===13?'#d8e1dc':resultIndex===6?'#b6d6f0':resultIndex===7?'#d9b89d':r[1]);
$('over').hidden=false;resize();lb.done(r[0]);lb.fx.confetti();
}
function update(dt){
t+=dt;nod=Math.max(0,nod-dt);walk=Math.max(0,walk-dt);
if(judging>0){
judging-=dt;
const p=Math.min(10,Math.floor((.65-judging)/.065));
if(p!==lastFill){lastFill=p;$('fill').style.width=(p*10)+'%';}
if(judging<=0)die(W*.5,H*.45,'너는 이런 칠가이예요…',true);
return;
}
if(locked){
wait-=dt;
if(wait<=0){
if(qi===8){judging=.65;$('judge').hidden=false;$('back').disabled=true;}
else{qi++;locked=false;showQuestion();}
}
}
}
function path(c,points,fill,stroke='#172523',width=3){
c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
if(fill){c.fillStyle=fill;c.fill();}
if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.lineJoin='miter';c.stroke();}
}
function oval(c,x,y,rx,ry,fill,stroke='#172523',width=3){
c.beginPath();c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);
c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke();}
}
function drawHero(c,x,y,h){
if(h<=0)return;
c.save();c.translate(x,y);c.scale(h/120,h/120);
const bob=reduced?0:Math.sin(clock*2.2)*1.1;
c.translate(0,bob);
path(c,[[-24,-43],[-27,-7],[-9,-7],[-5,-31],[4,-31],[8,-6],[26,-7],[22,-44]],'#677991');
path(c,[[-28,-9],[-10,-9],[-7,-2],[-32,-2]],'#4b3b35');
path(c,[[8,-8],[26,-8],[33,-2],[8,-1]],'#4b3b35');
const sway=reduced?0:Math.sin(clock*8)*Math.min(1,walk)*.04;
c.save();c.rotate(sway);
path(c,[[-25,-82],[-38,-67],[-29,-39],[24,-39],[31,-70],[18,-83]],'#83ad8b');
path(c,[[-36,-68],[-23,-57],[-15,-56],[-20,-48],[-30,-53]],'#719b7a');
path(c,[[29,-67],[17,-57],[9,-55],[16,-48],[25,-53]],'#719b7a');
c.strokeStyle='#172523';c.lineWidth=2;c.beginPath();c.moveTo(-16,-54);c.lineTo(-8,-61);c.moveTo(8,-54);c.lineTo(16,-60);c.stroke();
c.save();c.translate(0,-82);c.rotate(reduced?-.04:Math.sin(clock*3)*.025+Math.sin(nod*23)*nod*.17);
path(c,[[-22,-29],[-29,-20],[-26,5],[-11,12],[19,10],[27,0],[41,-5],[40,-17],[20,-19],[15,-34],[-8,-38]],'#a9896d');
oval(c,-17,-28,9,14,'#8b705b');
path(c,[[23,-17],[40,-17],[43,-11],[35,-7],[20,-8]],'#b69b7f',null);
oval(c,40,-14,4,3,'#172523',null);
c.lineWidth=2;c.strokeStyle='#172523';c.beginPath();c.moveTo(3,-20);c.lineTo(11,-19);c.moveTo(17,-20);c.lineTo(23,-19);c.moveTo(16,-2);c.lineTo(24,0);c.lineTo(31,-2);c.stroke();
c.restore();c.restore();c.restore();
}
function drawBg(){
ctx.clearRect(0,0,W,H);ctx.fillStyle=PAL[0];ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#257f7b';ctx.lineWidth=2;
const ground=H*.47;
for(let i=0;i<5;i++){
const x=i*W/4-25,hh=45+(i%3)*18;
path(ctx,[[x,ground],[x,ground-hh],[x+25,ground-hh-24],[x+60,ground-hh+3],[x+60,ground]],'#49aaa4','#287e79',2);
ctx.strokeRect(x+13,ground-30,12,20);
}
ctx.beginPath();ctx.moveTo(0,ground+2);ctx.lineTo(W,ground-2);ctx.moveTo(W*.88,ground);ctx.lineTo(W*.88,ground-132);ctx.lineTo(W*.81,ground-131);ctx.moveTo(W*.85,ground-115);ctx.lineTo(W*.93,ground-116);ctx.stroke();
const drift=reduced?0:Math.sin(clock*.25)*6;
oval(ctx,W*.82+drift,H*.15,26,24,'#6fbfa9',null);
ctx.strokeStyle='#79c4b3';ctx.beginPath();ctx.moveTo(12,H-18);ctx.lineTo(30,H-21);ctx.lineTo(34,H-12);ctx.moveTo(W-40,45);ctx.lineTo(W-24,47);ctx.lineTo(W-27,60);ctx.stroke();
}
function render(){
if(!W||!H)return;drawBg();
if(state==='start'){
const a=$('hc'),w=a.clientWidth,h=a.clientHeight;
hc.clearRect(0,0,w,h);
if(w&&h){lb.assets.draw(hc,'gen/r2',w*.56,h*.5,Math.min(w*.85,h*1.12),h*.92);drawHero(hc,w*.12,h*.96,Math.min(h*.58,100));}
}
if(state==='play'){
const a=$('hero'),w=a.clientWidth,h=a.clientHeight;
heroCtx.clearRect(0,0,w,h);
drawHero(heroCtx,w*.48+(reduced?0:Math.sin(clock*7)*walk*4),h*.98,Math.min(h*.97,w*1.12));
}
if(state==='over'){
const a=$('rc'),w=a.clientWidth,h=a.clientHeight;
rc.clearRect(0,0,w,h);
if(w&&h)lb.assets.draw(rc,resultKeys[resultIndex],w*.5,h*.52,Math.min(w*.96,h*1.27),h*.96);
}
}
function frame(now){
requestAnimationFrame(frame);
const dt=last?Math.min((now-last)/1000,.1):0;last=now;
if(paused)return;clock+=dt;
if(state==='play')update(dt);
else if(state==='dying'){endT-=dt;if(endT<=0)result();}
render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.5)start();});
$('back').addEventListener('click',back);
$('rank').addEventListener('click',()=>{
lb.share('칠가이 테스트에서 나는 '+R[resultIndex][0]+'예요. '+R[resultIndex][4]);
});
lb.onPause(p=>{paused=p;last=0;});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
