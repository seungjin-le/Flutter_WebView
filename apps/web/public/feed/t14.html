<head>


<title>에겐녀 테토녀 테스트</title>
<style>
:root{--bg:#f4f8fc;--paper:#fff;--ink:#233653;--acc:#b82945;--act:#b82945;--bt:#fff;--lt:#ffe1e8;--tone:#cfe3f5;--c:#2b4c9b}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font,ui-rounded,sans-serif)}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(var(--tone) 1px,transparent 1.5px) 0 0/10px 10px,var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:calc(14px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(14px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));overflow:hidden}
h1,h2,p{margin:0;word-break:keep-all}
h1,#final,button,.sfx{font-family:var(--title-font,system-ui,sans-serif);font-weight:800}
h1{font-size:clamp(26px,4.8vh,34px);line-height:1.18;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--acc)}
button{border:3px solid var(--ink);color:var(--ink);cursor:pointer;font-size:18px;touch-action:manipulation}
.btn{min-height:64px;flex-shrink:0;padding:10px 20px;background:var(--act);color:var(--bt);box-shadow:4px 4px 0 var(--ink)}
.btn:active{box-shadow:1px 1px 0 var(--ink);background:var(--ink)}
#go{width:100%;max-width:360px}
#start{padding-top:calc(60px + var(--lb-safe-top,0px))}
#start p{font-size:18px;line-height:1.35}
#start .intro{border:3px solid var(--ink);background:var(--paper);border-radius:24px;padding:9px 14px;width:100%;max-width:400px}
#hc{display:block;flex:1;min-height:30px;width:100%;max-width:420px;object-fit:contain}
#start .kicker{font-size:18px;color:var(--acc)}
#play{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:calc(18px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(16px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));overflow:hidden}
#sceneHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sceneTag{font-size:18px;border:2px solid var(--ink);padding:5px 10px;background:var(--paper);box-shadow:3px 3px 0 var(--tone)}
#context{font-size:18px;opacity:.8}
#situation{flex:1;min-height:44px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#situation:before{content:"";position:absolute;inset:5% 0;background:var(--tone);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);z-index:-1}
.bub{background:var(--paper);border:3px solid var(--ink);border-radius:28px;padding:18px 16px;position:relative;max-width:100%;box-shadow:3px 4px 0 var(--tone)}
.bub:after{content:"";position:absolute;bottom:-10px;left:30px;width:14px;height:14px;background:var(--paper);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
#question{font-size:clamp(20px,3.5vh,24px);line-height:1.45}
#sceneProp{width:100%;height:70px;display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none}
.propCup{width:42px;height:45px;border:3px solid var(--ink);border-radius:3px 3px 12px 12px;background:var(--paper);position:relative;transform:rotate(-7deg)}
.propCup:before{content:"";position:absolute;right:-16px;top:6px;width:16px;height:22px;border:3px solid var(--ink);border-radius:0 12px 12px 0}
.propCup:after{content:"";position:absolute;left:8px;right:8px;top:8px;height:7px;background:var(--tone);border-radius:50%}
.chatProp{display:flex;gap:6px;background:var(--paper);border:3px solid var(--ink);padding:13px;border-radius:15px 15px 15px 2px;transform:rotate(5deg)}
.chatProp i{display:block;width:8px;height:8px;background:var(--ink);border-radius:50%}
#options{display:flex;flex-direction:column;gap:11px;flex-shrink:0}

<div class="bub"><h2 id="question"></h2></div>
</div>
<div id="options"></div>
<div id="hud" hidden><b id="sc">1/9</b><div id="progress" aria-label="진행 상황"></div><span id="info"></span></div>
<div id="transition" hidden>다음 컷을 그리고 있어요…</div>
</div>
<div id="over" class="scr" hidden>
<p id="why"></p>
<b id="final"></b>
<p id="tagline"></p>
<div id="chips"></div>
<p id="description"></p>
<div id="meters">
<div class="meter"><span id="egenLabel"></span><div><i id="egenBar"></i></div></div>
<div class="meter"><span id="tetoLabel"></span><div><i id="tetoBar"></i></div></div>
</div>
<div id="compat"><p id="match"></p><p id="clash"></p></div>
<p class="lb-rec" id="record"></p>
<p id="sub"></p>
<div id="actions"><button id="again" class="btn" type="button">다시 하기</button><button id="rank" class="btn" type="button">결과 공유</button></div>
</div>
</div>
<script>
lb.ready(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),portrait=$('hc'),hc=portrait.getContext('2d');
const PAL=['#f4f8fc','#cfe3f5','#2b4c9b','#f27fa8','#e0392b'];
const soundClick='sfx/ui-audio/rollover2',soundWin='sfx/oga512/sounds-fanfare3';
const resultKeys=['gen/r1','gen/r2','gen/r3','gen/r4','gen/r5','gen/r6','gen/r7','gen/r8'];
const types=[
{name:'야생 테토 대장',color:'#e0392b',tag:'망설이는 친구 옆에서 먼저 움직여요.',desc:'해야겠다고 정하면 바로 몸이 움직여요. 친구들이 망설이는 식당 문을 먼저 열고 자리를 물어봐요.',chips:['먼저 말해요','결정이 빨라요','바로 움직여요'],match:3,clash:1},
{name:'단톡방 총무 테토',color:'#2b4c9b',tag:'친구들 약속은 제 손에서 정리돼요.',desc:'흩어진 이야기를 모아 날짜와 장소를 잡아요. 약속 전날 단톡방에 시간과 지도를 함께 보내요.',chips:['날짜를 잡아요','답을 모아요','지도를 보내요'],match:5,clash:0},
{name:'골목 직진러',color:'#f08a24',tag:'궁금한 골목은 일단 걸어 들어가요.',desc:'새로운 곳을 보면 구경할 생각부터 들어요. 산책하다 눈에 띈 작은 가게 앞에서 친구를 불러요.',chips:['일단 걸어요','새길을 골라요','친구를 불러요'],match:4,clash:6},
{name:'퍼컬 미소녀 에겐',color:'#f27fa8',tag:'마음에 드는 색은 그냥 못 지나쳐요.',desc:'색과 작은 차이를 금방 알아봐요. 친구가 옷을 고르면 얼굴 옆에 대 보고 어울리는 색을 골라요.',chips:['색을 맞춰요','옷을 골라요','사진을 남겨요'],match:0,clash:7},
{name:'감성 카페 에겐',color:'#8cc56b',tag:'창가 자리와 좋은 한 잔이면 충분해요.',desc:'조용히 살펴보다 마음에 드는 것을 찾아요. 카페 창가에 앉으면 컵 옆에 작은 수첩을 펼쳐요.',chips:['창가에 앉아요','수첩을 펴요','천천히 봐요'],match:2,clash:1},
{name:'몽글 리액션 에겐',color:'#5bb7e8',tag:'친구의 좋은 소식에 제 표정도 환해져요.',desc:'친구의 말투와 표정을 금방 알아채요. 좋은 소식이 올라오면 축하 답장부터 길게 보내요.',chips:['표정을 읽어요','축하를 보내요','말을 들어요'],match:1,clash:2},
{name:'새침 고양이 에겐',color:'#8a5cc7',tag:'조용해도 좋아하는 건 또렷하게 골라요.',desc:'여럿의 취향 사이에서도 내 기준을 지켜요. 산책을 마치면 좋아하는 노래를 틀고 익숙한 길로 걸어요.',chips:['취향을 지켜요','혼자도 걸어요','노래를 골라요'],match:7,clash:2},
{name:'반반 하이브리드',color:'#1fa59a',tag:'상황을 보고 앞에도 옆에도 서요.',desc:'친구의 기분과 당장 할 일을 함께 살펴요. 의견이 갈리면 각자 원하는 것을 듣고 중간 장소를 골라요.',chips:['양쪽을 들어요','필요하면 나서요','절충을 해요'],match:6,clash:3}
];
const questions=[
{place:'단골 카페',q:'친구가 카페에서 뭘 마실지 고민해요. 나는요?',a:[
['잘 어울릴 음료를 골라 줘요',[[3,3],[5,1]]],
['끌리는 신상을 같이 맛봐요',[[2,3],[0,1]]],
['원하는 맛부터 차근히 물어요',[[1,2],[7,2]]],
['제 음료부터 조용히 골라요',[[4,2],[6,2]]]
]},
{place:'친구 단톡방',q:'주말 약속 이야기가 한참 돌아요. 나는요?',a:[
['가능한 날짜를 모아 봐요',[[1,3],[7,1]]],
['가 보고 싶던 곳을 보내요',[[0,2],[2,2]]],
['친구들 말에 반응하며 골라요',[[5,3],[3,1]]]
]},
{place:'저녁 골목',q:'산책하다 모르는 골목을 발견했어요. 나는요?',a:[
['어디로 이어지는지 걸어 봐요',[[2,3],[0,1]]],
['빛이 예쁜 입구를 찍어요',[[4,3],[3,1]]],
['익숙하고 조용한 길을 걸어요',[[6,3],[7,1]]]
]},
{place:'친구 단톡방',q:'친구가 속상한 일을 털어놨어요. 나는요?',a:[
['어떤 기분인지 먼저 물어요',[[5,3],[4,1]]],
['당장 할 수 있는 일을 찾아요',[[0,3],[1,1]]],
['듣고 나서 함께 답을 골라요',[[7,3],[6,1]]]
]},
{place:'프로필 고르기',q:'오늘 찍은 사진 중 프로필을 골라요. 나는요?',a:[
['옷과 얼굴빛이 예쁜 사진요',[[3,3],[4,1]]],
['크게 웃으며 움직이는 사진요',[[2,3],[5,1]]],
['표정이 담백한 사진요',[[6,3],[1,1]]],
['지금 제 모습이 잘 담긴 사진요',[[7,3],[0,1]]]
]},
{place:'단골 카페',q:'카페에서 친구와 자리를 골라요. 나는요?',a:[
['햇빛 드는 창가를 살펴봐요',[[4,3],[3,1]]],
['편히 얘기할 구석을 골라요',[[6,2],[5,2]]],
['빈자리부터 보고 이끌어요',[[0,2],[1,2]]]
]},
{place:'동네 나들이',q:'친구와 옷가게에 들렀어요. 나는요?',a:[
['친구에게 맞는 색을 찾아요',[[3,3],[5,1]]],
['편하게 걸을 운동복을 봐요',[[2,3],[0,1]]],
['필요한 옷부터 골라 봐요',[[1,2],[7,2]]],
['눈여겨본 디자인을 입어 봐요',[[6,3],[4,1]]]
]},
{place:'친구 단톡방',q:'단톡방에서 저녁 취향이 갈렸어요. 나는요?',a:[
['모두 먹을 만한 곳을 찾아요',[[7,3],[1,1]]],
['제 취향을 짧게 말해 둬요',[[6,3],[3,1]]],
['친구가 원하는 걸 더 들어요',[[5,3],[4,1]]],
['후보를 골라 직접 물어봐요',[[0,2],[2,2]]]
]},
{place:'집으로 가는 길',q:'예정보다 여유가 생긴 저녁이에요. 나는요?',a:[
['궁금했던 동네를 더 걸어요',[[2,3],[0,1]]],
['사진을 고르며 한 잔 마셔요',[[3,2],[4,2]]],
['친구에게 오늘 얘기를 보내요',[[5,3],[1,1]]],
['기분에 맞춰 조용히 보내요',[[6,2],[7,2]]]
]}
];
let W=0,H=0,state='start',paused=false,last=0,clock=0,acc=0,index=0,lock=0,endT=0,overAt=0,answerHash=0,chosen=[],weights=Array(8).fill(0),egen=0,teto=0,resultIndex=7,hs='',resultShown=false;
let colors={bg:PAL[0],paper:'#fff',ink:'#233653',tone:PAL[1],acc:'#b82945'},reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
lb.assets.font('font/dohyeon').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--body-font',v));
function readColors(){
 const s=getComputedStyle(document.documentElement);
 ['bg','paper','ink','tone','acc'].forEach(k=>{const v=s.getPropertyValue('--'+k).trim();if(v)colors[k]=v});
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.max(1,Math.round(W*d));cv.height=Math.max(1,Math.round(H*d));
 ctx.setTransform(d,0,0,d,0,0);readColors();
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function hud(){
 const a=(index+1)+'/9';if(a!==hs){$('sc').textContent=a;hs=a}
 const cells=$('progress').children;
 for(let n=0;n<cells.length;n++)cells[n].className=n<index?'past':n===index?'current':'';
}
for(let n=0;n<9;n++)$('progress').appendChild(document.createElement('i'));
function showQuestion(){
 const q=questions[index];$('question').textContent=q.q;$('place').textContent=q.place;
 $('context').textContent=q.place==='친구 단톡방'?'친구가 말을 걸어요':'오늘은 이럴 때예요';
 $('options').replaceChildren();
 q.a.forEach((a,n)=>{
  const btn=document.createElement('button');btn.type='button';btn.className='opt';
  const badge=document.createElement('b');badge.textContent=['가','나','다','라'][n];badge.setAttribute('aria-hidden','true');
  const text=document.createElement('span');text.textContent=a[0];btn.append(badge,text);
  btn.addEventListener('pointerdown',()=>choose(n,btn));
  btn.addEventListener('click',()=>choose(n,btn));
  $('options').appendChild(btn);
 });
 $('transition').hidden=true;$('play').classList.remove('flash');hud();
}
function reset(){
 index=0;lock=0;endT=0;acc=0;weights=Array(8).fill(0);egen=0;teto=0;chosen=[];answerHash=0;resultIndex=7;hs='';resultShown=false;
 $('sub').textContent='';$('play').classList.remove('flash');
 $('start').insertBefore(portrait,$('start').querySelector('.intro'));
 showQuestion();
}
function start(){
 reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
 lb.audio.unlock();lb.audio.sfx(soundClick);
}
function choose(n,btn){
 if(state!=='play'||lock>0)return;
 lock=.28;chosen.push(n);answerHash=(answerHash*11+(n+1)*(index+3))%100003;
 for(const [target,value] of questions[index].a[n][1]){
  weights[target]+=value;
  if(target<3)teto+=value;else if(target<7)egen+=value;else{egen+=value/2;teto+=value/2}
 }
 btn.classList.add('on');$('play').classList.add('flash');
 for(const b of $('options').children)b.disabled=true;
 lb.audio.sfx(soundClick);lb.haptic('light');bump($('question'));
}
function decide(){
 if(egen===teto)return 7;
 const pool=egen>teto?[3,4,5,6]:[0,1,2];
 let max=-1,candidates=[];
 for(const n of pool){if(weights[n]>max){max=weights[n];candidates=[n]}else if(weights[n]===max)candidates.push(n)}
 return candidates[answerHash%candidates.length];
}
function die(){
 if(state!=='play')return;
 resultIndex=decide();state='dying';endT=.42;
 $('transition').textContent='에겐력과 테토력을 살펴보고 있어요…';$('transition').hidden=false;
}
function result(){
 if(resultShown)return;resultShown=true;state='over';overAt=clock;
 const r=types[resultIndex],total=egen+teto,e=total?Math.round(egen/total*100):50;
 document.documentElement.style.setProperty('--c',r.color);
 $('why').textContent='이런 일상 캐릭터를 닮았어요!';
 $('final').textContent=r.name;$('tagline').textContent=r.tag;$('description').textContent=r.desc;
 $('chips').replaceChildren();r.chips.forEach(text=>{const s=document.createElement('span');s.textContent=text;$('chips').appendChild(s)});
 $('egenLabel').textContent='에겐력 '+e+'%';$('tetoLabel').textContent='테토력 '+(100-e)+'%';
 $('egenBar').style.width=e+'%';$('tetoBar').style.width=(100-e)+'%';
 $('match').textContent='잘 맞아요 · '+types[r.match].name;
 $('clash').textContent='취향이 달라요 · '+types[r.clash].name;
 $('record').textContent='선택을 모두 살펴봤어요';
 $('over').insertBefore(portrait,$('final'));
 $('start').hidden=true;$('play').hidden=true;$('hud').hidden=true;$('over').hidden=false;
 lb.done(r.name);
 lb.audio.sfx(soundWin);lb.haptic('success');lb.fx.confetti();
}
function update(dt){
 if(state==='play'&&lock>0){
  lock=Math.max(0,lock-dt);
  if(lock===0){index++;if(index>=questions.length)die();else showQuestion()}
 }else if(state==='dying'){
  endT-=dt;if(endT<=0)result();
 }
}
function rounded(c,x,y,w,h,r){
 r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function drawBackground(){
 ctx.clearRect(0,0,W,H);
 if(!W||!H)return;
 ctx.lineWidth=2;ctx.strokeStyle=colors.tone;ctx.fillStyle=colors.paper;
 const drift=reduce?0:Math.sin(clock*.5)*5;
 ctx.save();ctx.translate(0,drift);
 rounded(ctx,W-100,35,74,41,12);ctx.fill();ctx.stroke();
 for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(W-80+k*15,55,3,0,Math.PI*2);ctx.fillStyle=colors.tone;ctx.fill()}
 ctx.strokeStyle=colors.tone;ctx.lineWidth=3;
 rounded(ctx,20,H*.65,38,44,8);ctx.fillStyle=colors.paper;ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.arc(60,H*.65+19,9,-Math.PI/2,Math.PI/2);ctx.stroke();
 ctx.restore();
}
function drawPortrait(){
 const box=portrait.getBoundingClientRect();if(box.width<1||box.height<1)return;
 const d=Math.min(devicePixelRatio||1,2),pw=Math.round(box.width*d),ph=Math.round(box.height*d);
 if(portrait.width!==pw||portrait.height!==ph){portrait.width=pw;portrait.height=ph}
 hc.setTransform(d,0,0,d,0,0);const w=box.width,h=box.height;hc.clearRect(0,0,w,h);
 const edge=8;
 hc.lineWidth=3;hc.lineJoin='round';hc.strokeStyle=colors.ink;
 rounded(hc,edge,4,w-edge*2,Math.max(1,h-12),14);hc.fillStyle=colors.paper;hc.fill();hc.stroke();
 hc.save();hc.beginPath();hc.rect(edge+2,6,w-edge*2-4,Math.max(1,h-16));hc.clip();
 hc.fillStyle=colors.tone;
 for(let x=16;x<w;x+=18)for(let y=12;y<h;y+=18){hc.beginPath();hc.arc(x,y,1.5,0,Math.PI*2);hc.fill()}
 if(state==='over'){
  const cx=w/2,cy=h*.58;
  hc.strokeStyle=colors.tone;hc.lineWidth=2;
  for(let k=0;k<18;k++){
   const a=k*Math.PI/9;
   hc.beginPath();hc.moveTo(cx+Math.cos(a)*h*.45,cy+Math.sin(a)*h*.45);
   hc.lineTo(cx+Math.cos(a)*h*1.5,cy+Math.sin(a)*h*1.5);hc.stroke();
  }
  lb.assets.draw(hc,resultKeys[resultIndex],w/2,h*.51,w*.86,h*.98);
 }else{
  const bounce=reduce?0:Math.sin(clock*1.5)*3;
  lb.assets.draw(hc,'gen/r1',w*.31,h*.51+bounce,w*.61,h*.96);
  lb.assets.draw(hc,'gen/r4',w*.69,h*.51-bounce,w*.61,h*.96);
 }
 hc.restore();
 if(state==='over'){
  const count=Math.max(4,Math.floor(w/23)),lit=reduce?0:Math.floor(clock*4)%2;
  for(let n=0;n<count;n++){
   const x=17+n*(w-34)/(count-1);
   hc.beginPath();hc.arc(x,5,3,0,Math.PI*2);hc.fillStyle=(n+lit)%2?colors.paper:types[resultIndex].color;hc.fill();
  }
 }
}
function render(){drawBackground();if(state==='start'||state==='over')drawPortrait()}
function frame(now){
 requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(paused)return;clock+=dt;acc+=dt;
 while(acc>=1/120){update(1/120);acc-=1/120}
 render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.7)start()});
$('rank').addEventListener('click',()=>{
 const r=types[resultIndex],total=egen+teto,e=total?Math.round(egen/total*100):50;
 lb.share('에겐? 테토? 저는 '+r.name+'예요! 에겐력 '+e+'%, 테토력 '+(100-e)+'%예요. '+r.tag);
});
lb.onPause(p=>{paused=p;last=0;acc=0});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
