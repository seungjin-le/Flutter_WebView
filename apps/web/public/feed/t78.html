  :where(:root){--bg:#F4EEDD;--card:#FFFFFF;--ink:#1C1917;--sub:#57534E;--line:#D6D0C2;--accent:#B91C1C;--accent-ink:#FFFFFF;--soft:#FDFBF7;--soft2:#FBEDE8;--heart:#B91C1C;--gold:#D97706}

  .ranking-item .r-info { min-width: 0; flex: 1; }
  .ranking-item .r-name { font-weight: bold; }
  .ranking-item .r-tag { font-size: 12px; color: var(--sub); font-style: italic; line-height: 1.35; }
  .action-buttons {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }
  .btn-action {
    flex: 1;
    padding: 12px 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid var(--ink);
    background: var(--card);
    color: var(--ink);
    text-align: center;
    font-family: inherit;
  }
  .btn-action.primary {
    background: var(--ink);
    color: var(--bg);
  }
  [hidden] { display: none !important; }
</style>
<style id="feedy-palette">:root:root{--bg:#f4f1fb;--card:#ffffff;--ink:#1f1a2e;--sub:#5c5670;--line:#e6e0f3;--accent:#8b6cf0;--accent-ink:#1d182b;--soft:#e6ddff;--soft2:#f4f0ff;--heart:#f0473c;--gold:#f5a524}</style></head>
<body>
<div class="app-container">
  <header>
    <div class="newspaper-date" id="news-date">VOL. 03 NO. 99 — SPECIAL EDITION</div>
    <h1 id="header-title">월요병이 제일 심한 MBTI</h1>
    <div class="subtitle" id="header-subtitle">일요일 저녁만 되면 한숨이 먼저 나오는 순위</div>
  </header>

  <div class="content">
    <!-- 시작 -->
    <div id="screen-start" class="screen active">
      <div class="intro-box" id="intro-text" hidden></div>

      <div class="preview-ranks">
        <div class="preview-title">월요병 심한 유형 순위</div>
        <div class="preview-list" id="preview-top3"></div>
      </div>

      <button class="btn-start" data-start>내 순위 확인하기</button>
    </div>

    <!-- 내 유형 고르기 -->
    <div id="screen-question" class="screen">
      <div class="question-title" id="q-text"></div>
      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- 결과 -->
    <div id="screen-result" class="screen">
      <div class="result-wrap">
        <div class="stamp">월요병 인증</div>
        <div class="result-card" id="result-card-inner">
          <div class="result-header">
            <div class="result-img-wrap">
              <img id="res-img" src="" alt="">
            </div>
            <div class="result-titles">
              <span class="rank-badge" id="res-rank"></span><span class="rank-total" id="res-total"></span>
              <h2 id="res-name"></h2>
              <div class="tagline" id="res-tagline"></div>
            </div>
          </div>
          <div class="result-quote" id="res-quote" hidden></div>
          <div class="result-desc" id="res-desc"></div>
          <div class="traits-list" id="res-traits"></div>
          <div class="tip-box" id="res-tip" hidden></div>
        </div>
      </div>

      <div class="ranking-section">
        <div class="ranking-title">전체 MBTI 월요병 순위</div>
        <div class="ranking-grid" id="full-ranking"></div>
      </div>

      <div class="action-buttons">
        <button class="btn-action" id="btn-reset">다시 확인하기</button>
        <button class="btn-action primary" id="btn-share" data-share>친구에게 공유하기</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const data = window.DATA;
  if (!data) return;

  document.getElementById("header-title").innerText = data.title || "";
  const sub = document.getElementById("header-subtitle");
  sub.innerText = data.subtitle || "";
  sub.hidden = !data.subtitle;
  const intro = document.getElementById("intro-text");
  intro.innerText = data.intro_line || "";
  intro.hidden = !data.intro_line;

  // 신문 호수 — 오늘 날짜로
  const today = new Date();
  document.getElementById("news-date").innerText = `VOL. ${today.getMonth() + 1} NO. ${today.getDate()} — SPECIAL EDITION`;

  const sortedByRank = [...(data.results || [])].sort((a, b) => a.rank - b.rank);
  const total = sortedByRank.length;

  // 미리보기 1~3위
  const top3Container = document.getElementById("preview-top3");
  sortedByRank.slice(0, 3).forEach(item => {
    const div = document.createElement("div");
    div.className = "preview-item";
    div.innerHTML = `${item.img ? `<img src="${item.img}" alt="">` : ""}<div><b>${item.rank}위</b> <span class="pv-name"></span></div>`;
    div.querySelector(".pv-name").innerText = item.name;
    top3Container.appendChild(div);
  });

  // 질문(내 유형 고르기)
  const qData = (data.questions || [])[0] || { q: "", options: [] };
  document.getElementById("q-text").innerText = qData.q || "";
  const optContainer = document.getElementById("options-container");
  const n = qData.options.length;
  if (n <= 6) optContainer.classList.add("few");
  else if (n > 20) optContainer.classList.add("dense");

  qData.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.dataset.opt = idx;
    btn.innerText = opt.text;
    btn.addEventListener("click", () => {
      window.LB.answer(0, idx);
      showResult();
    });
    optContainer.appendChild(btn);
  });

  document.querySelector("[data-start]").addEventListener("click", () => {
    window.LB.reset();
    switchScreen("screen-question");
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    window.LB.reset();
    switchScreen("screen-start");
  });

  let current = null;
  document.getElementById("btn-share").addEventListener("click", () => {
    if (current) window.LB.share(current.id);
  });

  function switchScreen(screenId) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(screenId).classList.add("active");
    window.scrollTo(0, 0);
  }

  function showResult() {
    const res = window.LB.result();
    if (!res) return;
    current = res;

    const img = document.getElementById("res-img");
    img.src = res.img || "";
    img.alt = res.name || "";
    document.getElementById("res-rank").innerText = `${res.rank}위`;
    document.getElementById("res-total").innerText = total ? `/ ${total}` : "";
    document.getElementById("res-name").innerText = res.name || "";
    document.getElementById("res-tagline").innerText = res.tagline || "";
    document.getElementById("res-desc").innerText = res.desc || "";

    const q = document.getElementById("res-quote");
    q.innerText = res.quote ? `“${res.quote}”` : "";
    q.hidden = !res.quote;

    const traitsContainer = document.getElementById("res-traits");
    traitsContainer.innerHTML = "";
    (res.traits || []).forEach(t => {
      const span = document.createElement("span");
      span.className = "trait-tag";
      span.innerText = `#${t}`;
      traitsContainer.appendChild(span);
    });
    traitsContainer.hidden = !(res.traits || []).length;

    const tip = document.getElementById("res-tip");
    tip.innerHTML = res.tip ? `<b>월요병 극복 팁</b><span></span>` : "";
    if (res.tip) tip.querySelector("span").innerText = res.tip;
    tip.hidden = !res.tip;

    // 전체 순위표
    const fullRanking = document.getElementById("full-ranking");
    fullRanking.innerHTML = "";
    let mine = null;
    sortedByRank.forEach(item => {
      const row = document.createElement("div");
      row.className = "ranking-item" + (item.id === res.id ? " me" : "");
      row.innerHTML = `
        <span class="r-no">${item.id === res.id ? "★" : ""}${item.rank}위</span>
        ${item.img ? `<img src="${item.img}" alt="">` : ""}
        <div class="r-info"><div class="r-name"></div><div class="r-tag"></div></div>
      `;
      row.querySelector(".r-name").innerText = item.name;
      const tg = row.querySelector(".r-tag");
      tg.innerText = item.tagline || "";
      tg.hidden = !item.tagline;
      if (item.id === res.id) mine = row;
      fullRanking.appendChild(row);
    });

    document.getElementById("screen-result").setAttribute("data-result-id", res.id);
    switchScreen("screen-result");
    // 순위표 안에서 내 줄이 보이게
    if (mine) requestAnimationFrame(() => {
      fullRanking.scrollTop = Math.max(0, mine.offsetTop - fullRanking.clientHeight / 2 + mine.offsetHeight / 2);
    });
  }
});
</script>
</body>
</html>
