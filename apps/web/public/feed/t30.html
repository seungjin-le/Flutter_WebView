<head>


<title>나는 무슨 계란?</title>
<style>
:root{--bg:#fdf3d8;--paper:#fffdf6;--ink:#493528;--act:#ad3429;--blob:#ad3429;--acc:#ffc93c;--accd:#235b89;--c:#ffc93c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font,ui-rounded,sans-serif)}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.screen{position:absolute;inset:0;overflow:hidden;padding:calc(12px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(12px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px))}
h1,h2,p{margin:0;word-break:keep-all}
button{color:var(--ink);font-family:var(--title-font,system-ui,sans-serif);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accd);outline-offset:3px}
.ttl{font-family:var(--title-font,system-ui,sans-serif);font-weight:800;letter-spacing:-.035em;line-height:1.1}
.cr,.ttl em,.opt.on{background:repeating-linear-gradient(-28deg,transparent 0 4px,#ffffff65 4px 6px) var(--acc)}
.ttl em{font-style:normal;border:3px solid var(--ink);border-radius:12px 8px;padding:0 5px}
.sub{color:var(--accd);font-size:clamp(16px,2.7vh,20px);line-height:1.1}
.blob{background:var(--blob);color:white;border-radius:32% 20% 27% 17%/25% 28% 24% 30%;padding:10px 17px;font-size:clamp(18px,3vh,21px);line-height:1.15}
.pct{background:var(--paper);border:3px solid var(--ink);border-radius:18px 12px 20px 14px;position:relative}
.btn{border:3px solid var(--ink);background:var(--act);color:#fff;min-height:56px;border-radius:23px 17px 20px 16px;box-shadow:3px 4px 0 var(--ink);font-size:clamp(15px,2.6vh,19px);padding:8px 15px}
.btn:active,.opt:active{box-shadow:0 1px 0 var(--ink);background-color:#f6dc87;color:var(--ink)}
#start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(5px,1.2vh,10px);padding-top:calc(60px + var(--lb-safe-top,0px))}
#start h1{font-size:clamp(30px,5.4vh,43px)}
#start .hero-art{flex:1;min-height:20px;width:100%;position:relative;display:flex;justify-content:center}
.art img{display:block;width:100%;height:auto;object-fit:contain;min-height:0}
.hero-art img{max-height:100%;max-width:330px}
.fallback{display:flex;align-items:center;justify-content:center;background:var(--c);border:4px solid var(--ink);border-radius:44% 53% 39% 48%;height:100%;aspect-ratio:1;font:800 clamp(30px,10vh,80px) var(--title-font,sans-serif);margin:auto}
#start .blob{rotate:-2deg}
#start .wonder{font-size:clamp(14px,2.4vh,18px);max-width:340px;line-height:1.05}
#start .food{font-size:clamp(13px,2.2vh,17px)}
#go{width:min(100%,280px);flex-shrink:0}
#play{display:flex;flex-direction:column;gap:clamp(6px,1.3vh,12px)}
#hud{display:flex;justify-content:space-between;align-items:center;min-height:32px;gap:8px}
#sc{font-size:19px;font-variant-numeric:tabular-nums;min-width:36px}
#dots{display:flex;gap:5px;align-items:center}
.dot{width:clamp(12px,3vw,17px);height:clamp(14px,3.6vw,20px);border:2px solid var(--ink);border-radius:48% 52% 43% 44%;rotate:12deg}
.dot.done{background:repeating-linear-gradient(-28deg,#ffffff00 0 3px,#ffffff90 3px 5px) var(--acc)}
.dot.now{border-width:3px;rotate:-12deg}
#scene{flex:1;min-height:46px;position:relative;display:flex;align-items:center;justify-content:center}
#eggArt{width:min(45%,180px);height:100%;max-height:180px;overflow:visible}
#scene .whisper{position:absolute;right:0;top:8px;font-size:clamp(13px,2.5vh,17px);padding:5px 8px;rotate:3deg;max-width:43%}
#question{font-size:clamp(20px,3.4vh,23px);line-height:1.17;min-height:65px;display:flex;align-items:center;justify-content:center;text-align:center;rotate:-1deg}
#options{display:flex;flex-direction:column;gap:clamp(6px,1.4vh,10px)}
.opt{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:18px 11px 16px 12px;box-shadow:2px 3px 0 var(--ink);padding:8px 12px;font-size:clamp(16px,2.8vh,19px);line-height:1.15}
.opt .letter{display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;width:28px;height:28px;flex-shrink:0;font-family:var(--body-font,sans-serif)}
.opt:disabled{opacity:1;cursor:default}
#bottom{display:flex;align-items:center;justify-content:space-between;min-height:38px}
#back{background:var(--paper);border:2px solid var(--ink);border-radius:13px;min-width:86px;min-height:40px;font-size:14px}
#back:disabled{visibility:hidden}
#status{font-size:16px;color:var(--accd)}
#over{background:var(--bg)}
#rp{height:100%;display:flex;flex-direction:column;gap:clamp(4px,.8vh,7px);text-align:center}
#resultLabel{font-size:clamp(12px,2vh,15px);color:var(--accd)}
#resultArt{flex:1;min-height:28px;display:flex;justify-content:center;position:relative}
#resultArt img{max-height:100%;max-width:360px}
#final{font-size:clamp(29px,5.3vh,40px);position:relative;line-height:1.08}
#final span{background:repeating-linear-gradient(-28deg,transparent 0 4px,#ffffff70 4px 6px) var(--c);padding:0 5px}
#shareLine{font-size:clamp(15px,2.5vh,19px);line-height:1.1}
#chips{display:flex;justify-content:center;gap:6px;flex-wrap:nowrap}
.chip{font-size:clamp(14px,2.2vh,17px);padding:5px 8px;white-space:normal;border-radius:24% 34% 25% 29%;background:var(--blob);color:white}
.chip:nth-child(1){rotate:-2deg}.chip:nth-child(3){rotate:2deg}
#desc{font-size:clamp(14px,2.4vh,18px);line-height:1.15;padding:0 2px}
#resonance{font-size:clamp(12px,2vh,15px);line-height:1.1;color:var(--accd)}
#matches{display:flex;gap:8px}
.match{display:flex;align-items:center;flex:1;min-width:0;gap:5px;padding:3px 6px;text-align:left}
.match .mini{width:44px;height:44px;flex-shrink:0}
.mini img{width:100%;height:100%;object-fit:contain}
.mini .fallback{border-width:2px;font-size:20px;width:40px;height:40px}
.match p{font-size:clamp(12px,2vh,15px);line-height:1.05}
.match b{font-weight:500;color:var(--accd)}
.actions{display:flex;gap:10px;flex-shrink:0}
.actions .btn{flex:1;min-width:0}
#again{background:var(--paper);color:var(--ink)}
.lb-rec{font-size:12px;line-height:1;color:var(--accd)}
.dd{position:absolute;width:32px;height:32px;pointer-events:none}
#start .dd{top:calc(18px + var(--lb-safe-top,0px));left:22px;rotate:-9deg}
#over .dd{right:20px;top:18px;width:22px;height:22px}
.shivering{animation:wobble .28s ease-in-out}
@keyframes wobble{25%{transform:rotate(-7deg)}70%{transform:rotate(6deg)}}
@keyframes arrive{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.opt{animation:arrive .18s ease-out}
@media(max-height:580px){
#start{padding-top:calc(42px + var(--lb-safe-top,0px));gap:5px}
#matches{display:none}
#rp{gap:4px}
#desc{font-size:14px}
#play{gap:6px}
.opt{min-height:48px;padding:5px 10px}
#question{min-height:54px}
#status{font-size:14px}
.actions .btn{min-height:48px}
}
@media(max-height:440px){
#chips,#resonance,.lb-rec{display:none}
#start{padding-top:calc(12px + var(--lb-safe-top,0px));gap:3px}
#start h1{font-size:28px}
#start .wonder,#start .food{font-size:12px}
#start .blob{font-size:18px;padding:5px 10px}
#go{min-height:48px}
#play{gap:4px}
#scene{min-height:24px;max-height:48px}
#scene .whisper{display:none}
#hud{min-height:24px}
#question{font-size:18px;min-height:40px;padding:5px 10px}
#options{gap:4px}
.opt{min-height:36px;padding:4px 8px;font-size:14px}
.opt .letter{height:22px;width:22px;font-size:14px}
#bottom{min-height:26px}
#back{min-height:28px;font-size:12px}
#final{font-size:25px}
#desc{font-size:12px;line-height:1.05}
#shareLine{font-size:14px}
#resultLabel{font-size:12px}
.actions .btn{min-height:38px;font-size:13px;padding:5px}
.screen{padding-top:calc(6px + var(--lb-safe-top,0px));padding-bottom:calc(6px + var(--lb-safe-bottom,0px))}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}

}

 ctx.beginPath();ctx.moveTo(0,H*.8);ctx.quadraticCurveTo(W*.44,H*.65,W,H*.82);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle='#d6e6af';ctx.fill();
 ctx.strokeStyle='#bed393';ctx.lineWidth=2;
 for(let x=-30;x<W+30;x+=24){ctx.beginPath();ctx.moveTo(x,H*.94);ctx.lineTo(x+24,H*.9);ctx.stroke()}
 const s=Math.min(W/390,.95);
 wolf(W*.86,H*.89,s);
 bush(W*.88,H*.92,s);
 for(let i=0;i<4;i++){
  const x=W*(.07+i*.075),y=H*(.95-(i%2)*.035);
  ctx.beginPath();ctx.moveTo(x,y+9);ctx.lineTo(x+1,y-1);ctx.strokeStyle='#6b814b';ctx.lineWidth=2;ctx.stroke();
  for(let a=0;a<5;a++){const ang=a*Math.PI*2/5;ellipse(x+Math.cos(ang)*4,y+Math.sin(ang)*4,3,3,'#fffdf6',null)}
  ellipse(x,y,2.2,2.2,PAL[3],null);
 }
 if(state==='play'||state==='dying'){
  const angle=reduced()?0:(wobble>0?Math.sin(clock*45)*wobble*15:Math.sin(clock*1.5)*.6);
  $('eggBody').setAttribute('transform','rotate('+angle+' 105 125)');
 }
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.05):0;last=now;
 if(paused)return;clock+=dt;update(dt);render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.3)start()});
$('back').addEventListener('click',()=>{
 if(state!=='play'||lock>0||index===0)return;
 index--;answers.length=index;recalc();pending=-1;wobble=.2;
 sound('sfx/oga512/menu-move2');lb.haptic('light');showQuestion();
});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 const r=results[resultIndex];lb.share('나는 '+r.name+'! '+r.line+' · 내 계란 좀 잘 보고 있어 줘');
});
lb.onPause(p=>{paused=p;last=0});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
imageInto('startArt',0);resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
