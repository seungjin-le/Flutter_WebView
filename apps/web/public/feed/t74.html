<title>단톡방 여행 플래너 유형</title>
<style>
  /* 기본 색(원본 «사내 메신저 속 내 부캐») — 실행 팔레트가 오면 그 값으로 바뀌어요 */
  :where(:root){--bg:#F4EFEB;--card:#FFFFFF;--ink:#2C3437;--sub:#7D878A;--line:#E2DDD6;--accent:#5E8B7E;--accent-ink:#FFFFFF;--soft:#E3EBE7;--soft2:#FAE8E2;--heart:#E07A5F;--gold:#D9A21B}
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    word-break: keep-all;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--soft2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: var(--ink);
  }

  #app {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 840px;
    background-color: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  @media (min-width: 421px) {
    #app {
      border-radius: 24px;
      height: 90vh;
    }
  }

  .bg-deco {
    position: absolute;
    font-size: 24px;
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
    animation: floatItem 4s ease-in-out infinite alternate;
  }
  @keyframes floatItem {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-10px) rotate(5deg); }
  }

  .chat-header {
    background-color: var(--card);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--line);
    z-index: 10;
    flex-shrink: 0;
  }
  .channel-info {
    display: flex;
    flex-direction: column;
  }
  .channel-name {
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background-color: var(--accent);
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 2px var(--soft);
  }
  .channel-desc {
    font-size: 11px;
    color: var(--sub);
    margin-top: 2px;
  }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 5;
    padding-bottom: 20px;
  }

  .system-notice {
    background-color: var(--soft);
    color: var(--accent);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .message-row {
    display: flex;
    width: 100%;
    margin-bottom: 4px;
    animation: fadeInMessage 0.3s ease forwards;
  }
  @keyframes fadeInMessage {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message-row.bot { justify-content: flex-start; }
  .message-row.user { justify-content: flex-end; }
  .message-row.user > div { max-width: 80%; display: flex; flex-direction: column; align-items: flex-end; }
  .message-row.user .bubble { max-width: 100%; }

  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    position: relative;
    word-break: keep-all;
  }

  .bot .bubble {
    background-color: var(--card);
    color: var(--ink);
    border-top-left-radius: 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
  }

  .user .bubble {

<body>

<div id="app">
  <div class="bg-deco" style="top:5%; left:10%;">📌</div>
  <div class="bg-deco" style="top:15%; right:8%; animation-delay: 1s;">📎</div>
  <div class="bg-deco" style="bottom:20%; left:5%; animation-delay: 2s;">☕</div>
  <div class="bg-deco" style="bottom:10%; right:10%; animation-delay: 1.5s;">💬</div>

  <div class="chat-header">
    <div class="channel-info">
      <div class="channel-name">
        <span class="status-dot"></span> <span id="header-title">단톡방 여행 플래너 유형</span>
      </div>
      <div class="channel-desc" id="header-sub"># 여행-준비-단톡방</div>
    </div>
  </div>

  <div id="screen-start" class="start-screen">
    <div class="start-title">단톡방 여행 플래너 유형</div>
    <div class="start-subtitle">친구들과 여행 계획 짜는 단톡방 속 나의 여행 준비 행동 유형</div>
    <div class="preview-grid" id="preview-badges"></div>
    <button class="start-btn" data-start>테스트 시작하기</button>
  </div>

  <div id="screen-quiz" class="hidden" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
    <div class="chat-body" id="chat-body">
      <div class="system-notice" id="intro-notice">채팅방 메시지를 확인하고 골라주세요</div>
    </div>
    <div class="options-container" id="options-container"></div>
  </div>

  <div id="screen-loading" class="hidden loading-screen">
    <div class="loading-spinner"></div>
    <div style="font-weight: 700; font-size: 15px; color: var(--ink);">내 단톡방 유형 분석 중...</div>
    <div style="font-size: 12px; color: var(--sub); margin-top: 4px;">카톡 패턴 확인하는 중임!</div>
  </div>

  <div id="screen-result" class="hidden result-screen"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const data = window.DATA;
    if (!data) return;

    document.getElementById('header-title').innerText = data.title;
    document.getElementById('header-sub').innerText = data.subtitle;
    document.getElementById('intro-notice').innerText = (data.intro_line || '');

    const previewBadges = document.getElementById('preview-badges');
    data.results.slice(0, 4).forEach(r => {
      const badge = document.createElement('div');
      badge.className = 'preview-badge';
      badge.innerText = `#${r.name}`;
      previewBadges.appendChild(badge);
    });

    const startBtn = document.querySelector('[data-start]');
    const screenStart = document.getElementById('screen-start');
    const screenQuiz = document.getElementById('screen-quiz');
    const screenLoading = document.getElementById('screen-loading');
    const screenResult = document.getElementById('screen-result');
    const chatBody = document.getElementById('chat-body');
    const optionsContainer = document.getElementById('options-container');

    let currentQIndex = 0;

    // 대화는 늘 맨 아래가 보이게 — 선택지 칸이 생기면 대화 영역이 줄어드니 레이아웃 뒤에 다시 붙여요
    let lastQ = null;   // 지금 질문 말풍선
    function syncPin() {
      const pin = document.getElementById('q-pin');
      if (!pin || !lastQ) return;
      const a = chatBody.getBoundingClientRect(), b = lastQ.getBoundingClientRect();
      pin.hidden = b.top >= a.top - 1 && b.bottom <= a.bottom + 1;   // 말풍선이 다 보이면 숨김
    }
    function pinBottom() {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'auto' });
        syncPin();
      }));
    }
    chatBody.addEventListener('scroll', syncPin, { passive: true });
    window.addEventListener('resize', pinBottom);
    if (window.ResizeObserver) new ResizeObserver(pinBottom).observe(chatBody);

    startBtn.addEventListener('click', () => {
      screenStart.classList.add('hidden');
      screenQuiz.classList.remove('hidden');
      LB.reset();
      renderQuestion();
    });

    function renderQuestion() {
      optionsContainer.innerHTML = '';
      if (currentQIndex >= data.questions.length) {
        screenQuiz.classList.add('hidden');
        screenLoading.classList.remove('hidden');
        setTimeout(() => {
          screenLoading.classList.add('hidden');
          showResultScreen();
        }, 1500);
        return;
      }

      const qData = data.questions[currentQIndex];

      const typingRow = document.createElement('div');
      typingRow.className = 'message-row bot';
      typingRow.id = 'typing-indicator';
      typingRow.innerHTML = `
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      chatBody.appendChild(typingRow);
      pinBottom();

      setTimeout(() => {
        const indicator = document.getElementById('typing-indicator');
        if (indicator) indicator.remove();

        const qRow = document.createElement('div');
        qRow.className = 'message-row bot';
        qRow.innerHTML = `<div class="bubble">${qData.q}</div>`;
        chatBody.appendChild(qRow);
        pinBottom();

        const pin = document.createElement('div');
        pin.className = 'q-pin'; pin.id = 'q-pin'; pin.hidden = true; pin.innerText = qData.q;
        optionsContainer.appendChild(pin);
        lastQ = qRow.querySelector('.bubble');

        qData.options.forEach((opt, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.setAttribute('data-opt', optIdx);
          btn.innerText = opt.text;
          btn.addEventListener('click', () => handleOptionClick(currentQIndex, optIdx, opt.text));
          optionsContainer.appendChild(btn);
        });
        pinBottom();
      }, 800);
    }

    function handleOptionClick(qIdx, optIdx, optText) {
      optionsContainer.innerHTML = '';

      const uRow = document.createElement('div');
      uRow.className = 'message-row user';
      uRow.innerHTML = `
        <div>
          <div class="bubble">${optText}</div>
          <div class="read-receipt">전송됨</div>
        </div>
      `;
      chatBody.appendChild(uRow);
      pinBottom();

      LB.answer(qIdx, optIdx);

      currentQIndex++;
      setTimeout(() => {
        renderQuestion();
      }, 600);
    }

    function showResultScreen() {
      const res = LB.result();
      screenResult.classList.remove('hidden');

      const matchObj = LB.byId(res.match) || data.results[0];
      const misObj = res.mismatch ? LB.byId(res.mismatch) : null;

      screenResult.innerHTML = `
        <div class="id-card" data-result-id="${res.id}">
          <div class="id-card-header">내 단톡방 성격 사원증</div>
          <div class="result-img-wrap">
            <img src="${res.img || ''}" alt="${res.name}">
          </div>
          <div class="result-name">${res.name}</div>
          <div class="result-tagline">${res.tagline}</div>
          ${res.quote ? `<div class="result-quote">“${res.quote}”</div>` : ''}
          <div class="result-desc">${res.desc}</div>
          <div class="traits-box">
            ${(res.traits || []).map(t => `<span class="trait-tag">#${t}</span>`).join('')}
          </div>
          <div class="match-box">
            <span>찰떡궁합 유형</span>
            <div class="match-info">
              <img src="${matchObj.img || ''}" alt="${matchObj.name}" class="match-img">
              <span class="match-name">${matchObj.name}</span>
            </div>
          </div>
          ${misObj ? `<div class="match-box mismatch">
            <span>상극유형</span>
            <div class="match-info">
              <img src="${misObj.img || ''}" alt="${misObj.name}" class="match-img">
              <span class="match-name">${misObj.name}</span>
            </div>
          </div>` : ''}
          ${res.tip ? `<div class="result-tip">💡 ${res.tip}</div>` : ''}
        </div>
        <div class="result-actions">
          <button class="action-btn btn-retry" id="btn-retry">다시 하기</button>
          <button class="action-btn btn-share" id="btn-share" data-share>결과 공유하기</button>
        </div>
      `;

      document.getElementById('btn-retry').addEventListener('click', () => {
        screenResult.classList.add('hidden');
        screenStart.classList.remove('hidden');
        currentQIndex = 0;
        chatBody.innerHTML = `<div class="system-notice" id="intro-notice">${data.intro_line || ''}</div>`;
      });

      document.getElementById('btn-share').addEventListener('click', () => {
        LB.share(res.id);
      });
    }
  });
</script>
<script>(function () {
  var W = window, L = W.LB;
  if (!L || typeof L.result !== "function") return;
  function mark() {
    var l = W.lb; if (!l || typeof l.scroll !== "function" || !document.body) return;
    var all = document.body.querySelectorAll("*");
    for (var i = 0; i < all.length && i < 2000; i++) {
      var el = all[i]; if (el.__lbScroll || (el.closest && el.closest(".lv-scr"))) continue;
      var cs = W.getComputedStyle(el);
      if (!(cs.overflowY === "auto" || cs.overflowY === "scroll") || el.scrollHeight <= el.clientHeight + 2 || cs.visibility === "hidden") continue;
      var r = el.getBoundingClientRect(), vw = W.innerWidth || 0, vh = W.innerHeight || 0;
      if (r.width > 0 && r.height > 0 && r.right > 1 && r.left < vw - 1 && r.bottom > 1 && r.top < vh - 1) try { l.scroll(el); } catch (e) {}
    }
  }
  var f = L.result;
  L.result = function () { var r = f.apply(this, arguments); [0, 300, 1000, 2500].forEach(function (t) { setTimeout(mark, t); }); return r; };
})();</script></body>
</html>
