<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>첫눈 오면 바로 연락하는 별자리 순위</title>
<style>
    /* 기본 색(원본 «새벽 감성에 취약한 별자리 순위» 밤하늘) — 실행 팔레트가 오면 그 값으로 바뀌어요 */
    :where(:root){--bg:#0B1021;--card:#131B36;--ink:#E2E8F0;--sub:#4FD1C5;--line:#2A3B6C;--accent:#F6AD55;--accent-ink:#0B1021;--soft:#0F172A;--soft2:#1A2342;--heart:#ED64A6;--gold:#F6AD55}

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        word-break: keep-all;
        overflow-wrap: break-word;
    }

    html, body { overflow-x: hidden; }

    body {
        background-color: var(--bg);
        color: var(--ink);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    #app {
        width: 100%;
        max-width: 420px;
        height: 100vh;
        min-height: 100vh;
        background: var(--bg);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    /* 밤하늘 별 무늬 */
    #app::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(var(--ink) 1px, transparent 0),
            radial-gradient(color-mix(in srgb, var(--gold) 50%, transparent) 1px, transparent 0);
        background-size: 40px 40px, 60px 60px;
        background-position: 0 0, 20px 20px;
        opacity: 0.15;
        pointer-events: none;
        z-index: 0;
    }

    .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
        transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
        transform: translateY(10px);
        z-index: 1;
        overflow-y: auto;
        overflow-x: hidden;
    }

    .screen.active {
        opacity: 1;
        pointer-events: auto;
        visibility: visible;
        transform: translateY(0);
    }

    /* 금빛 글씨 — 밝은 팔레트에서도 읽히게 글자색 쪽으로 살짝 섞어요 */
    .goldtext { color: color-mix(in srgb, var(--gold) 70%, var(--ink)); }

    h1 {
        font-size: 1.5rem;
        font-weight: 800;
        line-height: 1.3;
        margin-bottom: 8px;
        text-align: center;
        text-shadow: 0 2px 10px color-mix(in srgb, var(--gold) 30%, transparent);
    }

    .subtitle {
        font-size: 0.95rem;
        color: var(--sub);
        text-align: center;
        margin-bottom: 20px;
        font-weight: 600;
    }

    .intro-box {
        background: var(--card);
        color: var(--ink);
        border: 2px dashed var(--line);
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 24px;
        font-size: 0.9rem;
        line-height: 1.5;
        text-align: center;
        box-shadow: 4px 4px 0px rgba(0,0,0,0.25);
    }

    .btn {
        background: var(--accent);
        color: var(--accent-ink);
        border: none;
        padding: 16px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 4px 4px 0px var(--heart);
        transition: transform 0.1s, box-shadow 0.1s;
        text-align: center;
        width: 100%;
        margin-top: auto;
        margin-bottom: 20px;
        flex-shrink: 0;
    }

    .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px var(--heart);
    }

    .btn.ghost {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
    }

    /* 별자리 선 */
    #constellation-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    /* 내 유형 고르기 */
    .q-title {
        font-size: 1.2rem;
        margin-bottom: 16px;
    }

    .options-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 20px;
    }

    .options-grid.dense {
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 7px;
    }

    .opt-card {
        background: var(--card);
        border: 2px solid var(--line);
        padding: 14px 10px;
        border-radius: 10px;
        color: var(--ink);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
        transition: all 0.2s;
        min-width: 0;
        overflow-wrap: anywhere;
    }

    .options-grid.dense .opt-card {
        padding: 10px 2px;
        font-size: 12px;
        border-radius: 8px;
        border-width: 1px;
        letter-spacing: -0.3px;
        box-shadow: 2px 2px 0px rgba(0,0,0,0.25);
    }

    .opt-card:active, .opt-card:hover {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px rgba(0,0,0,0.3);
        border-color: var(--gold);
    }

    /* 결과 */
    .result-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-bottom: 40px;
    }

    .my-result-card {
        background: var(--card);
        color: var(--ink);
        border: 2px solid var(--gold);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        box-shadow: 6px 6px 0px color-mix(in srgb, var(--gold) 25%, transparent);
        position: relative;
    }

    .my-result-card .res-img {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 2px solid var(--gold);
        object-fit: cover;
        margin-bottom: 12px;
        background: var(--soft);
        display: block;
        margin-left: auto;
        margin-right: auto;
    }

    .rank-badge {
        display: inline-block;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 4px 12px;
        border-radius: 20px;
        font-weight: 800;
        font-size: 0.85rem;
        margin-bottom: 12px;
    }

    .my-result-card h2 { font-size: 1.4rem; line-height: 1.3; }

    .tagline {
        font-size: 1.05rem;
        font-weight: bold;
        color: var(--heart);
        margin-bottom: 8px;
    }

    .quote {
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .desc {
        font-size: 0.88rem;
        line-height: 1.6;
        color: var(--ink);
        margin-bottom: 14px;
        opacity: 0.92;
    }

    .traits {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        margin-bottom: 14px;
    }

    .trait-tag {
        background: color-mix(in srgb, var(--sub) 15%, transparent);
        color: var(--sub);
        border: 1px solid var(--sub);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
    }

    .tip-box {
        font-size: 0.85rem;
        line-height: 1.5;
        background: var(--soft2);
        color: var(--ink);
        padding: 8px 10px;
        border-radius: 8px;
    }

    /* 전체 순위표 */
    .rank-table-section {
        background: var(--soft);
        border-radius: 16px;
        padding: 16px;
        border: 2px solid var(--line);
        box-shadow: inset 0 0 20px rgba(0,0,0,0.25);
    }

    .rank-table-title {
        font-size: 1rem;
        font-weight: bold;
        margin-bottom: 12px;
        text-align: center;
    }

    .rank-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .rank-item {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 10px 12px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }

    .rank-item.me {
        border: 2px solid var(--gold);
    }

    .rank-list.dense { gap: 6px; }
    .rank-list.dense .rank-item { padding: 6px 10px; gap: 10px; }
    .rank-list.dense .rank-item img { width: 30px; height: 30px; }

    .rank-num {
        font-weight: 800;
        font-size: 0.9rem;
        min-width: 24px;
        text-align: center;
        flex-shrink: 0;
    }

    .rank-item img {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--line);
        flex-shrink: 0;
        background: var(--soft);
    }

    .rank-info { flex: 1; min-width: 0; }

    .rank-name { font-size: 0.85rem; font-weight: bold; }

    .rank-tagline {
        font-size: 0.75rem;
        color: var(--sub);
    }

    .action-btns {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    .action-btns .btn {
        margin: 0;
        flex: 1;
        padding: 12px;
        font-size: 0.9rem;
    }

    .preview-top3 {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 16px;
    }

    .preview-badge {
        background: var(--card);
        border: 1px solid var(--line);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    [hidden] { display: none !important; }
</style>
<style id="feedy-palette">:root:root{--bg:#eef5fb;--card:#ffffff;--ink:#15212e;--sub:#4e5d6c;--line:#dce8f2;--accent:#3d9cf0;--accent-ink:#15212e;--soft:#d6eaff;--soft2:#edf6ff;--heart:#f0473c;--gold:#f5a524}</style></head>
<body>
<div id="app">
    <canvas id="constellation-canvas"></canvas>

    <!-- 시작 -->
    <div id="screen-start" class="screen active">
        <h1 id="home-title" class="goldtext">첫눈 오면 바로 연락하는 별자리 순위</h1>
        <div class="subtitle" id="home-subtitle">창밖에 눈 날리자마자 폰 집어 드는 사람은?</div>
        <div class="intro-box" id="home-intro" hidden></div>

        <div class="preview-top3" id="home-preview"></div>

        <button class="btn" data-start>내 별자리 순위 확인하기</button>
    </div>

    <!-- 내 유형 고르기 -->
    <div id="screen-q" class="screen">
        <h1 id="q-title" class="goldtext q-title"></h1>
        <div class="options-grid" id="q-options"></div>
    </div>

    <!-- 결과 -->
    <div id="screen-result" class="screen">
        <div class="result-container" id="result-content" data-result-id="">
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const data = window.DATA;
    if (!data) return;

    const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    document.getElementById("home-title").innerText = data.title || "";
    const sub = document.getElementById("home-subtitle");
    sub.innerText = data.subtitle || "";
    sub.hidden = !data.subtitle;
    const intro = document.getElementById("home-intro");
    intro.innerText = data.intro_line || "";
    intro.hidden = !data.intro_line;

    const allResults = [...(data.results || [])].sort((a, b) => a.rank - b.rank);
    const total = allResults.length;

    // 1~3위 미리보기
    const previewContainer = document.getElementById("home-preview");
    allResults.slice(0, 3).forEach(r => {
        const div = document.createElement("div");
        div.className = "preview-badge goldtext";
        div.innerHTML = `<span>#${r.rank}</span><span>${esc(r.name)}</span>`;
        previewContainer.appendChild(div);
    });

    // 별자리 선 — 화면 넓이에 맞춰 비율로 찍어요
    const canvas = document.getElementById("constellation-canvas");
    const ctx = canvas.getContext("2d");
    const points = [
        {x: 0.20, y: 0.66}, {x: 0.42, y: 0.72}, {x: 0.70, y: 0.68},
        {x: 0.82, y: 0.80}, {x: 0.56, y: 0.86}, {x: 0.28, y: 0.82}
    ];
    let currentStep = 1;

    function cssVar(name, fallback) {
        const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return v || fallback;
    }

    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawConstellation(currentStep);
    }

    function drawConstellation(step) {
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        if (!W || !H) return;
        const gold = cssVar("--gold", "orange"), star = cssVar("--ink", "white");
        ctx.globalAlpha = 0.55;
        ctx.strokeStyle = gold;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = gold;
        ctx.beginPath();
        for (let i = 0; i <= step && i < points.length; i++) {
            const x = points[i].x * W, y = points[i].y * H;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 0.8;
        for (let i = 0; i <= step && i < points.length; i++) {
            ctx.fillStyle = star;
            ctx.beginPath();
            ctx.arc(points[i].x * W, points[i].y * H, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function show(id) {
        document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
        const el = document.getElementById(id);
        el.classList.add("active");
        el.scrollTop = 0;
    }

    document.querySelector("[data-start]").addEventListener("click", () => {
        window.LB.reset();
        currentStep = 2;
        drawConstellation(currentStep);
        show("screen-q");
        renderQuestion(0);
    });

    function renderQuestion(qIndex) {
        const qObj = (data.questions || [])[qIndex] || { q: "", options: [] };
        document.getElementById("q-title").innerText = qObj.q || "";
        const optGrid = document.getElementById("q-options");
        optGrid.innerHTML = "";
        optGrid.classList.toggle("dense", qObj.options.length > 20);

        qObj.options.forEach((opt, optIdx) => {
            const btn = document.createElement("button");
            btn.className = "opt-card";
            btn.innerText = opt.text;
            btn.setAttribute("data-opt", optIdx);
            btn.addEventListener("click", () => {
                currentStep = points.length - 1;
                drawConstellation(currentStep);
                window.LB.answer(qIndex, optIdx);
                const res = window.LB.result();
                if (res) showResult(res);
            });
            optGrid.appendChild(btn);
        });
    }

    function showResult(res) {
        show("screen-result");

        const container = document.getElementById("result-content");
        container.setAttribute("data-result-id", res.id);

        const rankListHtml = allResults.map(item => `
                <div class="rank-item${item.id === res.id ? " me" : ""}">
                    <div class="rank-num goldtext">${item.id === res.id ? "★" : ""}${item.rank}</div>
                    ${item.img ? `<img src="${esc(item.img)}" alt="">` : ""}
                    <div class="rank-info">
                        <div class="rank-name">${esc(item.name)}</div>
                        ${item.tagline ? `<div class="rank-tagline">${esc(item.tagline)}</div>` : ""}
                    </div>
                </div>`).join("");

        container.innerHTML = `
            <div class="my-result-card">
                <div class="rank-badge">전체 ${res.rank}위 / ${total}</div>
                ${res.img ? `<img class="res-img" src="${esc(res.img)}" alt="${esc(res.name)}">` : ""}
                <h2>${esc(res.name)}</h2>
                ${res.tagline ? `<div class="tagline">${esc(res.tagline)}</div>` : ""}
                ${res.quote ? `<div class="quote goldtext">“${esc(res.quote)}”</div>` : ""}
                <div class="desc">${esc(res.desc)}</div>
                ${(res.traits || []).length ? `<div class="traits">${res.traits.map(t => `<span class="trait-tag">#${esc(t)}</span>`).join("")}</div>` : ""}
                ${res.tip ? `<div class="tip-box">💡 이렇게 해 보세요 <strong>${esc(res.tip)}</strong></div>` : ""}
            </div>

            <div class="rank-table-section">
                <div class="rank-table-title goldtext">✨ 첫눈 올 때 연락 속도 전체 순위 (1~${total}위) ✨</div>
                <div class="rank-list${total > 20 ? " dense" : ""}">
                    ${rankListHtml}
                </div>
            </div>

            <div class="action-btns">
                <button class="btn ghost" id="btn-retry">다시 확인하기</button>
                <button class="btn" id="btn-share" data-share>친구에게 첫눈 알리기</button>
            </div>
        `;

        document.getElementById("btn-retry").addEventListener("click", () => {
            window.LB.reset();
            currentStep = 1;
            drawConstellation(currentStep);
            show("screen-start");
        });

        document.getElementById("btn-share").addEventListener("click", () => {
            window.LB.share(res.id);
        });
    }
});
</script>
</body>
</html>
