 options.appendChild(b);optionButtons.push(b);
}
for(let i=0;i<QUESTIONS.length;i++){
 const star=document.createElement('span');star.className='star';star.setAttribute('aria-hidden','true');$('progress').appendChild(star);stars.push(star);
}
lb.assets.font('font/cafe24ssurround').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/squareround').then(v=>document.documentElement.style.setProperty('--body-font',v));
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function rounded(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function sticker(c,x,y,w,h,r,fill){
 c.fillStyle='rgba(118,88,145,.12)';rounded(c,x+3,y+5,w,h,r);c.fill();
 c.fillStyle=fill;rounded(c,x,y,w,h,r);c.fill();
 c.strokeStyle='#fffafb';c.lineWidth=4;c.stroke();
}
function buildBackground(){
 backdrop=document.createElement('canvas');backdrop.width=Math.ceil(W);backdrop.height=Math.ceil(H);
 const c=backdrop.getContext('2d');
 c.globalAlpha=.62;
 const canopyH=Math.min(34,H*.07),stripeW=Math.max(22,W/12);
 c.fillStyle=PAL[1];c.fillRect(0,0,W,canopyH);
 for(let x=0,i=0;x<W;x+=stripeW,i++){
  c.fillStyle=i%2?'#f9dbe4':'#e1eee7';c.beginPath();c.roundRect(x,-12,stripeW,canopyH+19,[0,0,11,11]);c.fill();
 }
 c.globalAlpha=.45;
 const y=H*.72;
 sticker(c,9,y,W-18,H*.24,18,'#e8f6f1');
 c.strokeStyle='#c4dace';c.lineWidth=2;
 c.beginPath();c.moveTo(22,y+H*.115);c.lineTo(W-22,y+H*.115);c.stroke();
 for(let i=0;i<3;i++){
  const x=W*(.19+i*.31),py=y+H*.1;
  c.fillStyle='#c7dacf';rounded(c,x-24,py,48,5,3);c.fill();
  c.fillRect(x-3,py+3,6,13);
  rounded(c,x-15,py+15,30,4,2);c.fill();
 }
 c.globalAlpha=.5;
 for(const x of [15,W-38]){
  sticker(c,x,H*.54,25,26,6,'#f1c6bc');
  c.strokeStyle='#a9c7b3';c.lineWidth=3;
  c.beginPath();c.moveTo(x+13,H*.54);c.lineTo(x+13,H*.54-27);c.stroke();
  c.fillStyle='#bad7c2';
  c.beginPath();c.ellipse(x+7,H*.54-20,6,11,-.65,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+19,H*.54-31,6,10,.6,0,Math.PI*2);c.fill();
 }
 c.globalAlpha=1;
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
 buildBackground();render();
}
function hud(){
 const s=(questionIndex+1)+'/'+QUESTIONS.length;
 if(s!==hs){$('sc').textContent=s;$('number').textContent=s;hs=s}
 stars.forEach((el,i)=>el.className='star'+(i<questionIndex?' filled':i===questionIndex?' current':''));
}
function reset(){
 totals=Array(7).fill(0);answers=[];questionIndex=0;locked=false;wait=0;endT=0;
 chosenResult=0;reported=false;transition='next';hs='';resultPaint=false;particleClock=0;
 optionButtons.forEach(b=>{b.disabled=false;b.classList.remove('chosen')});
}
function showQuestion(){
 const q=QUESTIONS[questionIndex];
 $('question').textContent=q.q;
 optionButtons.forEach((b,i)=>{
  b.lastElementChild.textContent=q.a[i][0];b.disabled=false;b.classList.remove('chosen');
 });
 locked=false;hud();paintQuestion();
}
function start(){
 reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;$('hud').hidden=false;
 lb.audio.unlock();lb.audio.sfx('sfx/interface-sounds/click-003');
 showQuestion();
}
function choose(i){
 if(state!=='play'||locked||paused)return;
 locked=true;answers.push(i);
 const weights=QUESTIONS[questionIndex].a[i][1];
 weights.forEach(([r,p])=>totals[r]+=p);
 optionButtons.forEach(b=>b.disabled=true);
 const b=optionButtons[i];b.classList.add('chosen');
 lb.audio.sfx('sfx/interface-sounds/click-003');lb.haptic('light');
 const box=b.getBoundingClientRect();
 lb.fx.ripple(box.left+box.width*.17,box.top+box.height*.5,{colors:[PAL[2],'#ffffff']});
 wait=.28;transition=questionIndex===QUESTIONS.length-1?'result':'next';
}
function findResult(){
 const max=Math.max(...totals);
 let tied=totals.map((n,i)=>n===max?i:-1).filter(i=>i>=0);
 if(tied.length===1)return tied[0];
 for(let qi=answers.length-1;qi>=0;qi--){
  const ws=QUESTIONS[qi].a[answers[qi]][1];
  const scored=tied.map(r=>[r,(ws.find(w=>w[0]===r)||[r,0])[1]]);
  const m=Math.max(...scored.map(v=>v[1]));
  if(m>0){tied=scored.filter(v=>v[1]===m).map(v=>v[0]);if(tied.length===1)return tied[0]}
 }
 const n=answers.reduce((a,b)=>a+b+1,0);
 return tied[n%tied.length];
}
function die(x,y,why,win){
 if(state!=='play')return;
 state='dying';locked=true;endT=.35;chosenResult=findResult();
 lb.audio.sfx('sfx/oga512/sound-bling');lb.haptic('success');
 lb.fx.sparkle(x,y);
 lb.fx.burst(x,y,{colors:[PAL[2],PAL[3],'#ffffff']});
}
function result(){
 if(reported)return;
 state='over';reported=true;
 const r=RESULTS[chosenResult];
 $('play').hidden=true;$('hud').hidden=true;$('over').hidden=false;
 $('over').style.setProperty('--c',r.color);
 $('resultHero').appendChild(hc);
 $('final').textContent=r.name;
 $('shareline').textContent=r.line;
 $('description').textContent=r.desc;
 $('chips').replaceChildren();
 r.chips.forEach(t=>{const s=document.createElement('span');s.className='chip';s.textContent=t;$('chips').appendChild(s)});
 $('matchName').textContent=RESULTS[r.match].name;$('otherName').textContent=RESULTS[r.other].name;
 $('record').textContent='가장 많이 닮은 맛을 찾아냈어요.';
 $('resultBody').scrollTop=0;
 lb.done(r.name);
 lb.fx.confetti();resultPaint=true;
 paintSmall($('matchArt'),r.match);paintSmall($('otherArt'),r.other);
 paintHero();
}
function paintSmall(canvas,index){
 const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);
 lb.assets.draw(c,'gen/r'+(index+1),120,80,150,150);
}
function paintQuestion(){
 qctx.clearRect(0,0,640,400);
 lb.assets.draw(qctx,'gen/q'+(questionIndex+1),320,208,365,365);
}
function paintHero(){
 hctx.clearRect(0,0,640,640);
 if(state==='over'){
  const bob=Math.sin(clock*1.6)*3;
  lb.assets.draw(hctx,'gen/r'+(chosenResult+1),320,319+bob,565,565);
 }else{
  lb.assets.draw(hctx,'gen/r2',137,378+Math.sin(clock*1.5+1)*5,260,260);
  lb.assets.draw(hctx,'gen/r3',510,375+Math.sin(clock*1.5+2)*5,255,255);
  lb.assets.draw(hctx,'gen/r1',321,310+Math.sin(clock*1.5)*6,390,390);
 }
}
function drawSpark(x,y,s,a){
 ctx.globalAlpha=a;ctx.fillStyle='#ffffff';
 ctx.beginPath();ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x+2,y-2,x+s,y);
 ctx.quadraticCurveTo(x+2,y+2,x,y+s);ctx.quadraticCurveTo(x-2,y+2,x-s,y);
 ctx.quadraticCurveTo(x-2,y-2,x,y-s);ctx.fill();ctx.globalAlpha=1;
}
function update(dt){
 if(state==='play'&&locked){
  wait-=dt;
  if(wait<=0){
   if(transition==='result')die(W*.5,H*.4,'내 취향을 찾았어요',true);
   else{questionIndex++;showQuestion()}
  }
 }else if(state==='dying'){
  endT-=dt;if(endT<=0)result();
 }
}
function render(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 if(backdrop)ctx.drawImage(backdrop,0,0);
 if(state!=='over'){
  for(let i=0;i<5;i++){
   const x=W*(.075+i*.213),y=H*(.2+.13*Math.sin(i*2.7));
   drawSpark(x,y,4+Math.sin(clock*1.3+i)*1.5,.45+.25*Math.sin(clock+i));
  }
 }
 if(state==='start'||state==='over')paintHero();
 if(state==='play'||state==='dying')paintQuestion();
 if(resultPaint&&state==='over'){
  const r=RESULTS[chosenResult];
  paintSmall($('matchArt'),r.match);paintSmall($('otherArt'),r.other);
 }
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.08):0;last=now;
 if(paused)return;
 clock+=dt;update(dt);render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',start);
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 const r=RESULTS[chosenResult];lb.share('내 디저트 성격은 '+r.name+'예요. '+r.line);
});
lb.onPause(p=>{paused=p;last=0});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
</body>
</html>
