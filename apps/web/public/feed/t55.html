<title>새해 왕국 계획서</title>
<style>
:root{
 --bg:#e8f0e6;--dot:#c9dfd2;--card:#faf3df;--paper:#faf3df;
 --ink:#38352e;--tt:#535f49;--act:#f08030;--kb:#eed4ac;
 --c:#f08030;--sh:#65594230;
 --title-font:ui-rounded,system-ui,sans-serif;
 --body-font:ui-rounded,system-ui,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--tt);outline-offset:3px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scr{
 position:absolute;inset:0;overflow:hidden;
 padding:calc(12px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px))
 calc(12px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px));
 display:flex;flex-direction:column;align-items:center;gap:10px
}
h1,h2,p{margin:0;word-break:keep-all}
.ttl{
 font-family:var(--title-font);font-weight:800;letter-spacing:-.035em;
 color:var(--tt);text-shadow:0 2px var(--card),0 4px var(--sh);
 line-height:1.15
}
.eyebrow{font-size:clamp(12px,1.8vh,14px);letter-spacing:.1em;color:var(--tt)}
.card,.chip,.opt,.action{
 background:var(--paper);border-radius:23px 28px 22px 26px;
 box-shadow:inset 0 2px var(--card),inset 0 -5px var(--sh),0 7px 12px -7px var(--sh)
}
.parchment{
 position:relative;background:var(--paper);
 border-radius:16px 20px 19px 14px;
 box-shadow:inset 0 -5px var(--sh),0 9px 16px -9px var(--sh)
}
.parchment:before,.parchment:after{
 content:"";position:absolute;left:-5px;right:-5px;height:14px;z-index:1;
 border-radius:48% 28% 34% 38% / 50%;
 background:var(--paper);
 box-shadow:inset 0 -4px var(--sh),0 3px 3px -2px var(--sh);
 pointer-events:none
}
.parchment:before{top:-5px}
.parchment:after{bottom:-5px;transform:rotate(180deg)}
.seal{
 width:42px;height:40px;flex:none;position:relative;display:grid;place-items:center;
 background:var(--act);border-radius:43% 50% 45% 48%;
 box-shadow:inset 0 -5px var(--sh),0 4px 5px -3px var(--sh);
 font-size:17px;color:var(--ink)
}
.seal:after{
 content:"";position:absolute;inset:7px;border:2px solid var(--sh);
 border-radius:45% 49% 44% 48%;transform:rotate(-12deg)
}
.action{
 min-height:64px;min-width:0;padding:9px 18px;
 font-family:var(--title-font);font-size:clamp(16px,2.7vh,19px);font-weight:800
}
.action:active{box-shadow:inset 0 5px var(--sh)}
#go,#rank{background:var(--act)}
#go{width:min(100%,300px);flex:none}
#start{padding-top:calc(60px + var(--lb-safe-top,0px));text-align:center;gap:12px}
#start h1{font-size:clamp(27px,5vh,38px)}
#start .hook{font-size:clamp(15px,2.4vh,18px);line-height:1.45;max-width:340px}
.note{font-size:clamp(12px,1.85vh,14px);line-height:1.4;color:var(--tt)}
.art{
 position:relative;isolation:isolate;flex:1;min-height:0;width:100%;
 display:flex;align-items:center;justify-content:center;overflow:hidden
}
.art:after{
 content:"";position:absolute;bottom:5%;left:14%;right:14%;height:15%;
 background:var(--c);opacity:.4;border-radius:48% 42% 47% 45%;
 box-shadow:inset 0 -7px var(--sh);z-index:-1
}
.art img{position:relative;display:block;width:100%;height:100%;object-fit:contain;z-index:1}
.fallback{
 display:none;width:68%;height:85%;max-width:260px;align-items:center;justify-content:center;
 background:var(--c);color:var(--ink);font-family:var(--title-font);font-size:clamp(36px,9vh,76px);
 border-radius:43% 49% 42% 47%;box-shadow:inset -10px -12px var(--sh)
}
img[data-lb-art-missing]{display:none!important}
img[data-lb-art-missing]+.fallback{display:flex}
#start .art{max-width:370px}
#hud{
 position:absolute;top:calc(16px + var(--lb-safe-top,0px));
 right:calc(16px + var(--lb-safe-right,0px));z-index:3;pointer-events:none;
 display:flex;align-items:center;gap:9px
}
#sc{font-size:15px;font-variant-numeric:tabular-nums;color:var(--tt)}
#quest{gap:14px;padding-top:calc(18px + var(--lb-safe-top,0px))}
.quest-title{align-self:flex-start;font-family:var(--title-font);font-weight:800;font-size:clamp(17px,3vh,21px)}
#quest .quest-title{padding-right:62px}
.questbody{display:flex;width:100%;flex:1;min-height:0;gap:10px;align-items:stretch}
#beads{width:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;flex:none}
.bead{
 width:12px;height:13px;border-radius:45% 49% 43% 48%;background:var(--dot);
 box-shadow:inset -2px -3px var(--sh);transition:background .16s,scale .16s
}
.bead.past{background:var(--act)}
.bead.current{background:var(--kb);scale:1.2;outline:2px solid var(--act);outline-offset:2px}
#questpaper{

 display:flex;flex-direction:column;justify-content:center;gap:15px
}
#qtag{font-size:clamp(12px,1.9vh,14px);color:var(--tt)}
#question{font-size:clamp(20px,3.5vh,24px);font-weight:500;line-height:1.5}
.map{
 height:54px;position:relative;overflow:hidden;opacity:.65;flex:none;
 background:repeating-linear-gradient(0deg,transparent 0 15px,var(--sh) 16px 17px);
 border-radius:10px 17px 8px 15px
}
.map:before{
 content:"";position:absolute;left:10%;right:10%;top:23px;height:15px;
 border-top:3px dashed var(--tt);border-radius:50%;transform:rotate(-8deg)
}
.map:after{
 content:"";position:absolute;right:12%;top:12px;width:16px;height:19px;

#choices{width:100%;display:flex;flex-direction:column;gap:12px;flex:none;padding-left:26px}
.opt{

 padding:12px 15px;font-size:clamp(17px,2.8vh,19px);line-height:1.35;

.opt .seal{width:40px;height:40px}
.opt:active,.opt.on{background:var(--kb);transform:scaleY(.95)}
.opt:disabled{cursor:default}
#binding{

 display:flex;align-items:center;justify-content:center;
 background:var(--bg)
}

#over{gap:0}
#rp{

 width:100%;height:100%;min-height:0;gap:7px;padding:13px 13px 10px
}
#over .eyebrow{flex:none;z-index:2}
#resultart{min-height:58px}
#final{

 line-height:1.12;max-width:100%
}
#final .mbti{font-family:var(--body-font);display:block;font-size:.57em;letter-spacing:.15em;color:var(--ink);text-shadow:none;margin-bottom:4px}
#shareline{

#chips{display:flex;gap:5px;justify-content:center;flex:none;width:100%}
#chips .chip{padding:5px 7px;font-size:clamp(12px,1.9vh,14px)}
#description{

}
#matches{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none;width:100%}
.match{
 display:flex;align-items:center;gap:5px;padding:5px 6px;min-width:0;border-radius:17px 21px 16px 20px
}
.miniart{width:43px;height:48px;flex:none;display:flex;align-items:center;justify-content:center}
.miniart img{width:100%;height:100%;object-fit:contain}
.miniart .fallback{width:100%;height:100%;font-size:22px;border-radius:42%}
.match p{font-size:clamp(12px,1.85vh,14px);line-height:1.25}
.match small{display:block;font-size:12px;color:var(--tt);margin-bottom:2px}
.match b{font-weight:500}
.actions{display:flex;gap:9px;width:100%;flex:none}
.actions button{flex:1;padding:8px 5px}
.lb-rec{font-size:12px;color:var(--tt);text-align:center;flex:none}
#why{font-size:12px;color:var(--tt)}
#sub{display:none}
@keyframes rise{from{opacity:0;translate:0 7px}to{opacity:1;translate:0 0}}
@media(max-height:620px){

 #rp{gap:5px;padding:9px 10px 7px}
 #final{font-size:clamp(25px,4.8vh,31px)}
 #description{font-size:13px;line-height:1.35;padding:6px 9px}
 .miniart{width:34px;height:36px}
 #chips .chip{padding:4px 6px;font-size:12px}

}

 #questpaper{padding:12px;gap:6px}
 #plan{min-height:25px;font-size:12px}
 #plan span:not(:last-child){display:none}
 #question{font-size:20px;line-height:1.3}
 #start{padding-top:calc(20px + var(--lb-safe-top,0px))}
 #start .note{display:none}
}
@media(max-height:405px){

 #final{font-size:23px}
 #final .mbti{display:inline;margin-right:7px;font-size:.65em}
 #shareline{font-size:12px;padding:3px 7px}
 #resultart{min-height:28px}
 #over .eyebrow{display:none}
 #quest{gap:6px;padding-top:calc(7px + var(--lb-safe-top,0px))}
 #questpaper{padding:9px 12px;gap:5px}
 #qtag,#plan{display:none}
 .quest-title{font-size:16px}
 #question{font-size:18px}
 #choices{gap:6px}
 .opt{min-height:64px;font-size:16px;padding:7px 10px}

<body>
<div id="app">
 <canvas id="cv" aria-hidden="true"></canvas>

 <div id="start" class="scr">
  <p class="eyebrow">동물 왕국 원정 길드</p>
  <h1 class="ttl">새해 왕국 계획서</h1>
  <p class="hook">새해의 종이 울렸어요.<br>올해는 어떤 원정을 떠나실래요?</p>
  <div class="art" style="--c:var(--act)">
   <img data-lb-art="gen/r11" alt="별빛 방랑시인 여우">
   <div class="fallback" aria-hidden="true">여</div>
  </div>
  <p class="note">새해 계획에 담긴 MBTI 성향을<br>재미로 살펴보는 의뢰예요.</p>
  <button id="go" class="action" type="button">원정 시작</button>
 </div>

 <div id="hud" hidden><b id="sc">1/10</b></div>
 <section id="quest" class="scr" hidden>
  <p class="quest-title">새해 원정 의뢰서</p>
  <div class="questbody">
   <div id="beads" aria-hidden="true"></div>
   <div id="questpaper" class="parchment">
    <p id="qtag"></p>
    <div class="map" aria-hidden="true"></div>
    <h2 id="question"></h2>
    <div id="plan"></div>
   </div>
  </div>
  <div id="choices"></div>
 </section>

 <div id="binding" hidden>
  <p><span class="seal" aria-hidden="true">봉</span>계획서의 봉인을 열고 있어요.</p>
 </div>

 <div id="over" class="scr" hidden>
  <div id="rp" class="parchment">
   <p id="why" class="eyebrow">올해의 원정 성향이 정해졌어요!</p>
   <div id="resultart" class="art">
    <img id="resultimg" data-lb-art="gen/r1" alt="연대기 기록관 비버">
    <div id="resultfallback" class="fallback" aria-hidden="true">연</div>
   </div>
   <b id="final" class="ttl"></b>
   <p id="shareline" class="chip"></p>
   <div id="chips"></div>
   <p id="description" class="card"></p>
   <div id="matches">
    <div class="match card">
     <div class="miniart">
      <img id="goodimg" data-lb-art="gen/r10" alt="축제 불꽃술사">
      <div id="goodfallback" class="fallback" aria-hidden="true">축</div>
     </div>
     <p><small>잘 맞는 동료예요</small><b id="goodname"></b></p>
    </div>
    <div class="match card">
     <div class="miniart">
      <img id="badimg" data-lb-art="gen/r11" alt="별빛 방랑시인">
      <div id="badfallback" class="fallback" aria-hidden="true">별</div>
     </div>
     <p><small>호흡이 다른 동료예요</small><b id="badname"></b></p>
    </div>
   </div>
   <p class="lb-rec">원정 계획서가 완성됐어요.</p>
   <p id="sub"></p>
   <div class="actions">
    <button id="again" class="action" type="button">다시 하기</button>
    <button id="rank" class="action" type="button">결과 공유</button>
   </div>
  </div>
 </div>
</div>

<script>

  a:[['여러 동료가 모인 탁자요','E','여러 동료와 이야기를 나눠요'],
     ['편한 동료와 구석 자리요','I','편한 동료와 조용히 쉬어요']]},
 {tag:'눈 속에서 오래된 지도를 찾았어요',q:'지도에 낯선 표식이 있어요. 무엇이 궁금하세요?',axis:1,w:2,
  a:[['표식이 가리키는 실제 길이요','S','표식과 실제 길을 대조해요'],
     ['표식에 숨은 이야기예요','N','표식에 담긴 뜻을 찾아봐요']]},
 {tag:'동료의 원정이 미뤄졌어요',q:'계획이 틀어져 속상한 동료에게 뭐라고 하실래요?',axis:2,w:3,
  a:[['가능한 대안을 함께 찾아요','T','어려움이 생기면 대안을 찾아요'],
     ['많이 속상했겠다고 말해요','F','속상한 동료의 마음을 살펴요']]},
 {tag:'별빛 숲으로 가는 길이에요',q:'출발 직전 새 의뢰가 왔어요. 어떻게 하실래요?',axis:3,w:3,
  a:[['정한 일정과 먼저 맞춰 봐요','J','새 의뢰와 일정을 맞춰 봐요'],
     ['흥미로우면 경로를 바꿔요','P','새 의뢰에 맞춰 경로를 바꿔요']]},
 {tag:'견습 모험가들이 모였어요',q:'새 원정 이야기가 떠올랐어요. 어떻게 다듬으세요?',axis:0,w:3,
  a:[['동료들과 말하며 다듬어요','E','동료와 말하며 생각을 다듬어요'],
     ['수첩에 적으며 다듬어요','I','수첩에 적으며 생각을 다듬어요']]},
 {tag:'계획서의 마지막 빈칸이에요',q:'올해를 떠올리게 할 문장을 골라 주세요.',axis:1,w:3,
  a:[['한 걸음씩 경험을 쌓아요','S','한 걸음씩 경험을 쌓아요'],
     ['아직 없는 길을 그려 봐요','N','아직 없는 길을 그려 봐요']]}
];
let W=0,H=0,state='start',paused=false,last=0,clock=0;
let index=0,axisScores=[],axisLast=[],answers=[],locked=false,wait=0;
let selectedResult=null,reported=false,overAt=0,bg=null,bgW=0,bgH=0;
let hs='',reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const beads=[];
for(let i=0;i<questions.length;i++){
 const n=document.createElement('i');n.className='bead';$('beads').appendChild(n);beads.push(n);
}
lb.assets.font('font/hahmlet').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--body-font',v));

function clay(c,x,y,rx,ry,col,seed=0){
 c.save();c.translate(x,y);
 c.beginPath();
 const pts=[];
 for(let i=0;i<52;i++){
  const a=i*Math.PI*2/52;
  const k=1+.025*Math.sin(a*5+seed)+.014*Math.cos(a*9+seed);
  pts.push([Math.cos(a)*rx*k,Math.sin(a)*ry*k]);
 }
 c.moveTo((pts[51][0]+pts[0][0])/2,(pts[51][1]+pts[0][1])/2);
 for(let i=0;i<52;i++){
  const p=pts[i],n=pts[(i+1)%52];
  c.quadraticCurveTo(p[0],p[1],(p[0]+n[0])/2,(p[1]+n[1])/2);
 }
 c.closePath();
 const g=c.createLinearGradient(-rx,-ry,rx,ry);
 g.addColorStop(0,col);g.addColorStop(1,col);
 c.fillStyle=g;c.fill();
 c.save();c.clip();
 c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--sh');
 c.beginPath();c.ellipse(rx*.52,ry*.68,Math.max(1,rx*.9),Math.max(1,ry*.25),-.2,0,Math.PI*2);c.fill();
 c.lineWidth=.8;
 for(let j=0;j<3;j++){
  c.beginPath();c.ellipse(-rx*.25,-ry*.1,Math.max(1,rx*(.14+j*.07)),Math.max(1,ry*(.12+j*.055)),-.5,.3,3);
  c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--sh');c.stroke();
 }
 c.restore();c.restore();
}
function bake(){
 if(!W||!H)return;
 bg=document.createElement('canvas');bg.width=Math.ceil(W);bg.height=Math.ceil(H);
 bgW=W;bgH=H;
 const b=bg.getContext('2d'),style=getComputedStyle(document.documentElement);
 const colors=PAL.map(k=>style.getPropertyValue(k).trim());
 const paper=style.getPropertyValue('--paper').trim();
 b.fillStyle=colors[0];b.fillRect(0,0,W,H);
 for(let y=24;y<H;y+=79)for(let x=18;x<W;x+=91){
  b.globalAlpha=.33;clay(b,x+(Math.floor(y/79)%2)*24,y,5,3,colors[1],x+y);
 }
 b.globalAlpha=.65;
 const base=H*.82,cx=W*.5,sz=Math.min(W/400,H/430);
 b.save();b.translate(cx,base);b.scale(sz,sz);
 for(const [x,y,w,h] of [[-128,-15,35,90],[-64,-12,32,67],[67,-8,32,71],[130,-20,34,95]]){
  clay(b,x,y,w,h,colors[1],x);
  clay(b,x,y-h+8,w+9,15,paper,x);
  b.fillStyle=colors[4];b.globalAlpha=.16;
  for(let n=0;n<3;n++){b.beginPath();b.ellipse(x,y-h+34+n*28,5,9,0,0,Math.PI*2);b.fill();}
  b.globalAlpha=.65;
  b.fillStyle=colors[1];b.beginPath();b.moveTo(x-w-8,y-h+4);b.lineTo(x,y-h-43);b.lineTo(x+w+8,y-h+4);b.closePath();b.fill();
  clay(b,x,y-h+1,w+7,7,paper,x+4);
 }
 clay(b,0,20,91,49,colors[1],2);
 clay(b,0,45,18,31,colors[0],3);
 for(const x of [-92,96]){
  clay(b,x,51,4,49,colors[4],x);
  clay(b,x,8,13,19,colors[3],x);
  clay(b,x,5,8,12,colors[2],x);
  clay(b,x,-12,16,5,colors[4],x);
 }
 for(const x of [-128,130]){
  clay(b,x,-156,2.5,22,colors[4],x);
  b.fillStyle=colors[2];b.beginPath();b.moveTo(x,-177);b.quadraticCurveTo(x+18,-179,x+28,-163);b.lineTo(x,-160);b.closePath();b.fill();
 }
 clay(b,0,83,235,22,paper,4);
 b.restore();b.globalAlpha=1;
}
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);
 ctx.setTransform(d,0,0,d,0,0);
 bake();render();
}
function hud(){
 const value=(index+1)+'/'+questions.length;
 if(value!==hs){$('sc').textContent=value;hs=value;}
 beads.forEach((n,i)=>n.className='bead'+(i<index?' past':i===index?' current':''));
}
function reset(){
 index=0;axisScores=[{E:0,I:0},{S:0,N:0},{T:0,F:0},{J:0,P:0}];
 axisLast=['I','N','F','P'];answers=[];locked=false;wait=0;
 selectedResult=null;reported=false;hs='';
 $('binding').hidden=true;$('over').hidden=true;
}
function showQuestion(){
 locked=false;
 const q=questions[index];
 $('qtag').textContent=q.tag;
 $('question').textContent=q.q;
 $('plan').replaceChildren();
 if(!answers.length){
  const n=document.createElement('span');n.textContent='올해의 원정 계획을 한 줄씩 적어 봐요.';$('plan').appendChild(n);
 }else{
  answers.slice(-2).forEach(text=>{
   const n=document.createElement('span');n.textContent='· '+text;$('plan').appendChild(n);
  });
 }
 $('choices').replaceChildren();
 q.a.forEach((a,i)=>{
  const button=document.createElement('button');
  button.type='button';button.className='opt';
  const badge=document.createElement('span');badge.className='seal';badge.textContent=['가','나'][i];badge.setAttribute('aria-hidden','true');
  const label=document.createElement('span');label.textContent=a[0];
  button.append(badge,label);
  button.addEventListener('pointerdown',e=>{
   if(e.button!==0||state!=='play'||locked)return;
   choose(i,button,e.clientX,e.clientY);
  });
  button.addEventListener('click',e=>{
   if(e.detail===0&&state==='play'&&!locked){
    const r=button.getBoundingClientRect();choose(i,button,r.left+r.width/2,r.top+r.height/2);
   }
  });
  $('choices').appendChild(button);
 });
 hud();
}
function start(){
 reset();state='play';
 $('start').hidden=true;$('quest').hidden=false;$('hud').hidden=false;
 lb.audio.unlock();lb.audio.sfx(sound.click);showQuestion();
}
function choose(i,button,x,y){
 if(locked)return;
 locked=true;
 const q=questions[index],a=q.a[i];
 axisScores[q.axis][a[1]]+=q.w;axisLast[q.axis]=a[1];answers.push(a[2]);
 button.classList.add('on');
 for(const n of $('choices').children)n.disabled=true;
 lb.audio.sfx(sound.click);lb.haptic('light');
 lb.fx.ripple(x,y,{colors:[getComputedStyle(document.documentElement).getPropertyValue('--act').trim()]});
 wait=.18;
}
function getType(){
 return [['E','I'],['S','N'],['T','F'],['J','P']].map((pair,a)=>{
  const s=axisScores[a];
  return s[pair[0]]===s[pair[1]]?axisLast[a]:s[pair[0]]>s[pair[1]]?pair[0]:pair[1];
 }).join('');
}
function die(x,y,why,win){
 if(state!=='play')return;
 state='dying';wait=.65;locked=true;
 selectedResult=byType[getType()];
 $('quest').hidden=true;$('hud').hidden=true;$('binding').hidden=false;
 lb.audio.sfx(sound.magic);lb.haptic('success');lb.fx.sparkle(x,y);
}
function setArt(id,fallback,entry){
 const image=$(id),r=entry.r;
 image.setAttribute('data-lb-art','gen/r'+(entry.i+1));
 image.alt=r[0]+' · '+r[1]+' '+r[2];
 image.removeAttribute('data-lb-art-missing');
 $(fallback).textContent=r[1][0];
 image.parentElement.style.setProperty('--c',r[3]);
}
function result(){
 if(reported)return;
 reported=true;state='over';overAt=clock;
 const r=selectedResult.r;
 $('binding').hidden=true;$('over').hidden=false;
 $('rp').style.setProperty('--c',r[3]);
 setArt('resultimg','resultfallback',selectedResult);
 $('final').replaceChildren();
 const type=document.createElement('span');type.className='mbti';type.textContent=r[0];
 const name=document.createElement('span');name.textContent=r[1];
 $('final').append(type,name);
 $('shareline').textContent='제 새해 원정 직업은 '+r[1]+'래요.';
 $('description').textContent=r[6];
 $('chips').replaceChildren();
 r[7].forEach(text=>{
  const chip=document.createElement('span');chip.className='chip';chip.textContent=text;$('chips').appendChild(chip);
 });
 const g=byType[r[4]],b=byType[r[5]];
 setArt('goodimg','goodfallback',g);setArt('badimg','badfallback',b);
 $('goodname').textContent=g.r[0]+' · '+g.r[1];
 $('badname').textContent=b.r[0]+' · '+b.r[1];
 lb.done(r[0]+' · '+r[1]);
 lb.fx.confetti();
}
function update(dt){
 if(state==='play'&&locked){
  wait-=dt;
  if(wait<=0){
   if(index===questions.length-1)die(W/2,H*.4,'올해의 원정 성향이 정해졌어요!',true);
   else{index++;showQuestion();}
  }
 }else if(state==='dying'){
  wait-=dt;if(wait<=0)result();
 }
}
function render(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 if(bg)ctx.drawImage(bg,0,0,bgW,bgH);
 if(reduced)return;
 const s=lb.safe;
 ctx.save();ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--paper');
 ctx.globalAlpha=.5;
 for(let i=0;i<12;i++){
  const x=(i*67+31+Math.sin(clock*.27+i)*10)%W;
  const span=Math.max(1,H-(s.top||0)-(s.bottom||0));
  const y=(i*59+clock*(4+i%3))%span+(s.top||0);
  ctx.beginPath();ctx.ellipse(x,y,1.5+(i%2),2,0,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.05):0;last=now;
 if(paused||!W||!H)return;
 clock+=dt;update(dt);render();
}
lb.onPause(p=>{paused=p;last=0;});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{
 if(state==='over'&&clock-overAt>.3)start();
});
$('rank').addEventListener('click',()=>{
 if(state!=='over'||!selectedResult)return;
 const r=selectedResult.r;
 lb.share('제 새해 원정 직업은 '+r[0]+' · '+r[1]+'래요! 어떤 동물 모험가인지 만나 보세요.');
});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
