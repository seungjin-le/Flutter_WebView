<title>나의 위로 인형</title>
<style>
:root{
 --bg:#efe1d1;--wv:#e3cfba;--paper:#fffaf3;--ink:#43291b;
 --st:#b88a63;--act:#8a4f2c;--kb:#f4dcc3;--c:#dfc4ab;
 --title-font:ui-rounded,system-ui,sans-serif;--body-font:ui-rounded,system-ui,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;color:var(--ink);background:var(--bg)}
body{font-family:var(--body-font);font-size:18px}
button{font-family:var(--title-font);font-weight:400;font-size:18px;color:inherit;cursor:pointer;border:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--act);outline-offset:2px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:repeating-conic-gradient(#d8bfaa35 0 25%,transparent 0 50%) 0 0/6px 6px,var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:absolute;inset:0;overflow:hidden;padding:calc(12px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(12px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px))}
h1,h2,p{margin:0;word-break:keep-all}
.ttl{font-family:var(--title-font);font-weight:400;letter-spacing:-.035em;-webkit-text-stroke:8px var(--paper);paint-order:stroke fill;text-shadow:0 4px var(--st);line-height:1.15}
.card,.opt,.chip,.action{
 background:var(--paper);outline:2px dashed var(--st);outline-offset:-6px;
 border-radius:25px;box-shadow:0 5px 9px -5px #43291b40
}
.chip{display:inline-block;padding:8px 15px;font-size:18px;line-height:1.2}
.action{min-height:64px;min-width:150px;padding:12px 22px}
.action:active{background:#edd7c0}
#go{background:var(--act);color:#fffaf3;outline-color:#c49c79}
#go:active{background:#724020}
#start{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:calc(60px + var(--lb-safe-top,0px))}
#start h1{font-size:clamp(30px,5.2vh,38px);flex:none}
#start .intro{max-width:340px;line-height:1.35}
.art-space{flex:1;min-height:0;position:relative;width:100%;display:flex;align-items:center;justify-content:center}
#hc{height:100%;width:100%;max-width:380px;display:block}
.start-foot{font-size:18px;line-height:1.2}
.patch-heart{position:absolute;width:28px;height:28px;background:#cf8e7b;transform:rotate(-45deg);border-radius:6px;opacity:.8;pointer-events:none}
.patch-heart:before,.patch-heart:after{content:"";position:absolute;width:28px;height:28px;background:inherit;border-radius:50%}
.patch-heart:before{top:-14px;left:0}.patch-heart:after{left:14px;top:0}
#start .patch-heart{right:22px;top:30px;transform:rotate(-34deg) scale(.6)}
#play{display:flex;flex-direction:column;gap:10px}
#hud{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 2px;min-height:28px;flex:none}
#sc{font-weight:500;font-size:18px}
#info{font-size:18px}
.question-body{display:flex;flex:1;min-height:0;gap:11px}
#stitches{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:20px;flex:none}
.sb{display:block;width:16px;height:16px;flex:none;border-radius:50%;background:radial-gradient(#896448 1.2px,transparent 1.7px) 0 0/50% 50%,#ead4bd;box-shadow:inset 0 0 0 2px #b89170,0 2px 2px #43291b1a;transition:background-color .2s}
.sb.on{background-color:#99623e;box-shadow:inset 0 0 0 2px #754326}
.sb.now{outline:2px dashed var(--act);outline-offset:3px}
.question-stack{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.preview{flex:1;min-height:70px;max-height:220px;position:relative}
#toy{display:block;width:100%;height:100%}
.label{font-size:18px;line-height:1.2}
#qcard{padding:17px 18px;position:relative;flex:none}
#qcard:after{content:"";position:absolute;bottom:-7px;left:28px;width:18px;height:18px;background:var(--paper);transform:rotate(45deg);border-radius:4px}
#qtitle{position:relative;z-index:1;font-size:clamp(22px,3.5vh,24px);font-weight:500;line-height:1.28}
#choices{display:grid;gap:9px;flex:none;padding-bottom:3px}
.opt{display:flex;align-items:center;text-align:left;gap:10px;width:100%;min-height:54px;padding:10px 14px;font-family:var(--body-font);font-size:20px;line-height:1.15;animation:appear .2s ease-out both}
.opt:nth-child(2){animation-delay:.035s}.opt:nth-child(3){animation-delay:.07s}.opt:nth-child(4){animation-delay:.105s}
.opt:active,.opt.on{outline:3px solid var(--act);background:#f4dcc3;box-shadow:0 2px 4px #43291b20}
.opt:disabled{opacity:1;cursor:default}
.k{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:50%;background:var(--kb);box-shadow:inset 0 -2px 4px #a8774f24;font-size:18px}
#sewing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#efe1d1e8;z-index:5}
.sewing-note{padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}
.cotton{display:flex;gap:10px}
.cotton i{width:22px;height:22px;border-radius:50%;background:#fffaf3;box-shadow:0 3px 6px #8e70572b;animation:stuff .7s ease-in-out infinite alternate}
.cotton i:nth-child(2){animation-delay:.15s}.cotton i:nth-child(3){animation-delay:.3s}
#over{padding:0}
#rp{position:absolute;inset:0;touch-action:none}
.result-page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:calc(20px + var(--lb-safe-top,0px)) calc(18px + var(--lb-safe-right,0px)) calc(60px + var(--lb-safe-bottom,0px)) calc(18px + var(--lb-safe-left,0px));overflow:hidden}
.result-page> *{flex:none}
.result-page .art-space{flex:1;min-height:70px}
.result-page .eyebrow{font-size:18px}
.hoop{position:relative;width:100%;height:100%;max-width:390px;display:flex;align-items:center;justify-content:center}
.hoop:before{content:"";position:absolute;width:min(84%,36vh);height:auto;aspect-ratio:1;border:10px solid #c9955f;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px #ead2b3,0 5px 12px #43291b20}
.hoop:after{content:"";position:absolute;top:3%;left:calc(50% - 13px);width:26px;height:14px;background:#b88a63;border:3px solid #dfb17e;border-radius:5px}
#result-art{position:relative;width:100%;height:100%;display:block;z-index:1}
#final{font-size:clamp(34px,5.7vh,42px)}
#why{font-size:18px;line-height:1.2}
#shareline{max-width:100%;font-size:20px;line-height:1.25}
.page-title{font-family:var(--title-font);font-size:clamp(26px,4.4vh,34px);font-weight:400;margin-top:12px}
.traits{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.traits .chip{background:#f5e7a9;border-radius:9px;transform:rotate(-2deg);padding:14px 12px}
.traits .chip:nth-child(2){background:#e9d6c6;transform:rotate(2deg)}
.traits .chip:nth-child(3){background:#dde6cf;transform:rotate(-1deg)}
#description{padding:22px;display:flex;flex-direction:column;justify-content:center;gap:18px;flex:1;min-height:0;width:100%;max-width:440px}
#description p{font-size:clamp(20px,3.4vh,24px);line-height:1.42}
.lb-rec{font-size:18px;line-height:1.25}
.matches{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px}
.match{padding:14px 8px;display:flex;flex-direction:column;align-items:center;min-height:0;gap:6px}
.match canvas{display:block;width:100%;flex:1;min-height:50px}
.match strong{font-family:var(--title-font);font-weight:400;font-size:20px;line-height:1.2}
.match p{font-size:18px;line-height:1.2}
.result-actions{display:flex;justify-content:center;gap:10px;width:100%;max-width:420px}
.result-actions button{flex:1;min-width:0;padding:10px;font-size:18px}
#again{background:var(--act);color:#fffaf3;outline-color:#bd9779}
#sub{min-height:20px;font-size:18px}
#pager{position:absolute;left:0;right:0;bottom:calc(14px + var(--lb-safe-bottom,0px));display:flex;justify-content:center;align-items:center;gap:12px;height:28px;pointer-events:none}

}

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="start" class="screen">
 <span class="patch-heart" aria-hidden="true"></span>
 <h1 class="ttl">나의 위로 인형</h1>
 <p class="intro chip">오늘 하루도 애썼어.<br>나를 안아 줄 인형은 누구일까?</p>
 <div class="art-space"><canvas id="hc" aria-label="포근한 곰 인형"></canvas></div>
 <p class="start-foot">아홉 장면에 마음을 살짝 내려놔 봐.</p>
 <button id="go" class="action" type="button">테스트 시작</button>
</div>
<div id="play" class="screen" hidden>
 <div id="hud"><span id="sc">마음 한 땀 1/9</span><span id="info">오늘 마음은 어느 쪽이야?</span></div>
 <div class="question-body">
  <div id="stitches" aria-label="질문 진행"></div>
  <div class="question-stack">
   <div class="preview"><canvas id="toy" aria-label="조금씩 모습을 드러내는 인형"></canvas></div>
   <div id="qcard" class="card"><h2 id="qtitle"></h2></div>
   <div id="choices"></div>
  </div>
 </div>
 <div id="sewing" hidden><div class="sewing-note card"><div class="cotton" aria-hidden="true"><i></i><i></i><i></i></div><p>솜 채우는 중…</p></div></div>
</div>
<div id="over" class="screen" hidden>
 <div id="rp">
  <section class="result-page" data-page="0">
   <p class="eyebrow">나의 위로 인형</p>
   <p id="why">나를 안아 줄 인형을 찾았어.</p>
   <div class="art-space"><div class="hoop"><canvas id="result-art" aria-label="결과 인형"></canvas></div></div>
   <h2 id="final" class="ttl"></h2>
   <p id="shareline" class="chip"></p>
  </section>
  <section class="result-page" data-page="1" hidden>
   <p class="eyebrow">한 땀씩 살펴보는 내 마음이에요</p>
   <h2 class="page-title">이런 포근함을 품고 있어</h2>
   <div id="traits" class="traits"></div>
   <div id="description" class="card"></div>
   <p id="record" class="lb-rec"></p>
  </section>
  <section class="result-page" data-page="2" hidden>
   <h2 class="page-title">곁에 두면 좋을 인형들</h2>
   <div class="matches">
    <div class="match card"><p>잘 맞는 인형</p><canvas id="friend-art"></canvas><strong id="friend-name"></strong><p id="friend-note"></p></div>
    <div class="match card"><p>결이 다른 인형</p><canvas id="other-art"></canvas><strong id="other-name"></strong><p id="other-note"></p></div>
   </div>
   <p class="lb-rec">다른 포근함도 천천히 알아가 봐.</p>
   <div class="result-actions">
    <button id="again" class="action" type="button">다시 하기</button>
    <button id="rank" class="action" type="button">결과 공유</button>
   </div>
   <p id="sub">내 마음의 인형을 함께 나눠요.</p>
  </section>
 </div>
 <div id="pager" aria-label="결과 세 장"><i class="on"></i><i></i><i></i></div>
</div>
</div>

 ['차분히 정리하고 싶은 걱정',[[4,3],[5,1]]],
 ['내일을 향한 작은 기대',[[3,3],[6,2]]]]},
 {q:'스탠드 아래 포스트잇을 붙이려 해. 어떤 말을 적을까?',a:[
 ['잠시 쉬어도 나는 소중해',[[1,3],[0,2]]],
 ['작은 한 걸음도 충분해',[[5,3],[4,2]]],
 ['나만의 반짝임을 잊지 말자',[[6,3],[3,2]]]]},
 {q:'이제 불을 끌 시간이야. 인형은 어디에 두고 싶어?',a:[
 ['품에 꼭 안고 자고 싶어',[[0,3],[1,2]]],
 ['베개 곁에 두고 얘기하고 싶어',[[2,3],[3,1]]],
 ['등 뒤를 든든히 받쳐 주면 좋겠어',[[4,3],[5,2]]],
 ['눈뜨면 바로 보이는 곳에 두고 싶어',[[6,3],[3,2]]]]}
];
let W=0,H=0,state='start',paused=false,last=0,clock=0,acc=0;
let question=0,answers=[],points=Array(7).fill(0),recent=Array(7).fill(-1);
let locked=false,wait=0,resultIndex=0,reported=false,page=0,overAt=0,tieSeed=0;
let pointer=null,swipeX=0,swipeY=0;
const STEP=1/120,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const artIds=['hc','toy','result-art','friend-art','other-art'];
const art={};
for(const id of artIds){const el=$(id);art[id]={el,c:el.getContext('2d'),w:0,h:0};}
const dots=[];
for(let i=0;i<9;i++){const b=document.createElement('i');b.className='sb';$('stitches').appendChild(b);dots.push(b);}
lb.assets.font('font/squareround-eb').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/gaegu').then(v=>document.documentElement.style.setProperty('--body-font',v));
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
 resizeArt();
}
function resizeArt(){
 const d=Math.min(devicePixelRatio||1,2);
 for(const id of artIds){
  const a=art[id],w=a.el.clientWidth,h=a.el.clientHeight;
  if(w<=0||h<=0)continue;
  if(w!==a.w||h!==a.h||a.d!==d){
   a.w=w;a.h=h;a.d=d;a.el.width=Math.round(w*d);a.el.height=Math.round(h*d);a.c.setTransform(d,0,0,d,0,0);
  }
 }
}
function hud(){
 $('sc').textContent='마음 한 땀 '+(question+1)+'/9';
 for(let i=0;i<9;i++)dots[i].className='sb'+(i<question?' on':'')+(i===question?' now':'');
}
function reset(){
 question=0;answers=[];points=Array(7).fill(0);recent=Array(7).fill(-1);
 locked=false;wait=0;reported=false;resultIndex=0;page=0;acc=0;tieSeed=Math.floor(lb.random()*2147483646);
 pointer=null;$('sewing').hidden=true;$('sub').textContent='내 마음의 인형을 함께 나눠요.';
}
function showQuestion(){
 hud();$('qtitle').textContent=QUESTIONS[question].q;
 const box=$('choices');box.replaceChildren();
 QUESTIONS[question].a.forEach((a,i)=>{
  const b=document.createElement('button');b.type='button';b.className='opt';
  const k=document.createElement('span');k.className='k';k.textContent=['가','나','다','라'][i];k.setAttribute('aria-hidden','true');
  const s=document.createElement('span');s.textContent=a[0];b.append(k,s);
  b.addEventListener('pointerdown',e=>{if(e.isPrimary!==false)choose(i,b,e.clientX,e.clientY);});
  b.addEventListener('click',e=>{if(e.detail===0){const r=b.getBoundingClientRect();choose(i,b,r.left+r.width/2,r.top+r.height/2);}});
  box.appendChild(b);
 });
 resizeArt();
}
function start(){
 reset();state='play';$('start').hidden=true;$('over').hidden=true;$('play').hidden=false;
 lb.audio.unlock();lb.audio.music('music/oga-chiptunes/level-3',{loop:true,volume:.2});
 showQuestion();
}
function choose(i,b,x,y){
 if(state!=='play'||locked)return;
 locked=true;b.classList.add('on');
 for(const el of $('choices').children)el.disabled=true;
 const choice=QUESTIONS[question].a[i];answers.push(i);
 tieSeed=(Math.imul(tieSeed^((question+1)*37+i*101),1664525)+1013904223)>>>0;
 for(const pair of choice[1]){points[pair[0]]+=pair[1];recent[pair[0]]=question;}
 lb.audio.sfx(SFX.tap);lb.haptic('light');
 lb.fx.burst(x,y,{colors:['#fffaf3','#f2d6c4','#e2c8b1']});
 wait=.22;
}
function leader(){
 let best=-1,candidates=[];
 for(let i=0;i<7;i++){
  if(points[i]>best){best=points[i];candidates=[i];}
  else if(points[i]===best)candidates.push(i);
 }
 let latest=-1;
 for(const i of candidates)latest=Math.max(latest,recent[i]);
 candidates=candidates.filter(i=>recent[i]===latest);
 return candidates[tieSeed%candidates.length];
}
function die(){
 if(state!=='play')return;
 resultIndex=leader();state='dying';wait=.78;$('sewing').hidden=false;
 lb.audio.stopMusic();
 lb.audio.sfx(SFX.sparkle);lb.audio.sfx(SFX.success);lb.haptic('success');
 const s=lb.safe;lb.fx.sparkle((s.left+W-s.right)/2,Math.max(s.top+50,H*.34));
}
function fillResult(){
 const r=TYPES[resultIndex],f=TYPES[r.friend],o=TYPES[r.other];
 $('app').style.setProperty('--c',r.pale);
 $('final').textContent=r.name;$('shareline').textContent=r.line;
 $('traits').replaceChildren();
 r.traits.forEach(t=>{const el=document.createElement('span');el.className='chip';el.textContent=t;$('traits').appendChild(el);});
 $('description').replaceChildren();
 r.desc.forEach(t=>{const p=document.createElement('p');p.textContent=t;$('description').appendChild(p);});
 $('record').textContent='아홉 땀의 마음으로 만난 '+r.name+'예요.';
 $('friend-name').textContent=f.name;$('other-name').textContent=o.name;
 $('friend-note').textContent=r.fn;$('other-note').textContent=r.on;
 $('result-art').setAttribute('aria-label',r.name);
 $('friend-art').setAttribute('aria-label',f.name);
 $('other-art').setAttribute('aria-label',o.name);
}
function setPage(n){
 page=(n+3)%3;
 document.querySelectorAll('.result-page').forEach((s,i)=>s.hidden=i!==page);
 [...$('pager').children].forEach((el,i)=>el.className=i===page?'on':'');
 resizeArt();
}
function result(){
 state='over';overAt=clock;locked=false;$('play').hidden=true;$('over').hidden=false;
 fillResult();setPage(0);
 if(!reported){reported=true;lb.done(TYPES[resultIndex].name);}
 lb.fx.confetti();
}
function update(dt){
 if(state==='play'&&locked){
  wait-=dt;
  if(wait<=0){
   if(question===8)die();
   else{question++;locked=false;showQuestion();}
  }
 }else if(state==='dying'){
  wait-=dt;if(wait<=0)result();
 }
}
function ellipse(c,x,y,rx,ry,color){
 c.fillStyle=color;c.beginPath();c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);c.fill();
}
function seam(c,x,y,rx,ry,color){
 c.save();c.strokeStyle=color;c.lineWidth=1.2;c.setLineDash([2.1,3.8]);c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.stroke();c.restore();
}
function drawHero(c,x,y,h,index,reveal){
 if(!Number.isFinite(h)||h<=0)return;
 const type=TYPES[index],base=reveal?type.color:'#b5a08e';
 c.save();c.translate(x,y);c.scale(h/150,h/150);
 ellipse(c,0,2,48,7,'#704d3820');
 const bob=reduce?0:Math.sin(clock*1.8)*2;c.translate(0,bob);
 if(index===4){
  ellipse(c,-2,-46,67,35,base);ellipse(c,-8,-37,53,20,reveal?'#eee7da':'#cbb9a8');
  c.save();c.translate(57,-47);c.rotate(-.35);ellipse(c,9,-8,23,10,base);c.rotate(.7);ellipse(c,10,8,23,10,base);c.restore();
  ellipse(c,-2,-22,15,8,base);seam(c,-2,-46,62,30,'#2f456b70');
  ellipse(c,-23,-51,2,2,'#554336');
  c.strokeStyle='#695b4e';c.lineWidth=1.5;c.beginPath();c.arc(-31,-45,5,.1,2.2);c.stroke();
  for(let j=0;j<3;j++){c.save();c.translate(-17,-78);c.rotate((j-1)*.5);ellipse(c,0,-8,4,13,reveal?'#c1dbe4':'#cbb9a8');c.restore();}
 }else if(index===5){
  ellipse(c,-30,-17,16,10,base);ellipse(c,29,-17,16,10,base);
  ellipse(c,0,-44,49,40,reveal?'#567746':'#9c8d7f');
  ellipse(c,0,-49,38,31,reveal?'#8dad72':'#b5a08e');
  seam(c,0,-49,34,27,'#52694080');
  c.strokeStyle=reveal?'#6a8755':'#9c8d7f';c.lineWidth=2;c.setLineDash([4,3]);c.beginPath();
  c.moveTo(-27,-66);c.lineTo(0,-45);c.lineTo(27,-66);c.moveTo(0,-45);c.lineTo(0,-21);c.stroke();c.setLineDash([]);
  ellipse(c,0,-8,25,20,base);ellipse(c,-8,-10,2,2,'#493e31');ellipse(c,8,-10,2,2,'#493e31');
 }else{
  if(index===6){
   c.save();c.translate(28,-35);c.rotate(-.65);
   ellipse(c,10,-15,27,43,base);ellipse(c,10,-41,22,18,reveal?'#f5e8d6':'#d1c0af');c.restore();
  }
  if(index===3){
   c.save();c.translate(-16,-111);c.rotate(-.13);ellipse(c,0,-17,11,38,base);ellipse(c,0,-18,5,27,reveal?'#f2c7cf':'#c6b19d');c.restore();
   c.save();c.translate(17,-111);c.rotate(.27);ellipse(c,0,-17,11,38,base);ellipse(c,0,-18,5,27,reveal?'#f2c7cf':'#c6b19d');c.restore();
  }else if(index===6){
   for(const s of [-1,1]){
    c.fillStyle=base;c.beginPath();c.moveTo(s*12,-93);c.lineTo(s*30,-132);c.lineTo(s*42,-91);c.closePath();c.fill();
    c.fillStyle=reveal?'#f4cfb3':'#d1c0af';c.beginPath();c.moveTo(s*20,-96);c.lineTo(s*29,-120);c.lineTo(s*34,-96);c.fill();
   }
  }else if(index===0||index===1){
   ellipse(c,-28,-104,17,18,base);ellipse(c,28,-104,17,18,base);
   ellipse(c,-28,-104,9,10,reveal?'#d4b18c':'#ccb9a6');ellipse(c,28,-104,9,10,reveal?'#d4b18c':'#ccb9a6');
  }
  ellipse(c,-22,-9,17,12,base);ellipse(c,22,-9,17,12,base);
  ellipse(c,0,-41,index===3?28:39,42,base);
  ellipse(c,0,-38,index===3?18:27,30,reveal?(index===2?'#f9dc79':index===6?'#f4e5cf':index===1?'#fcf7ee':'#dbb6a0'):'#c8b5a3');
  c.save();c.translate(-34,-47);c.rotate(.3);ellipse(c,0,0,12,24,base);c.restore();
  c.save();c.translate(34,-47);c.rotate(-.3);ellipse(c,0,0,12,24,base);c.restore();
  ellipse(c,0,-91,38,33,base);
  if(index===1){
   for(let i=0;i<7;i++){const a=i/7*Math.PI*2;ellipse(c,Math.cos(a)*29,-94+Math.sin(a)*24,13,12,base);}
   ellipse(c,0,-89,25,22,reveal?'#e6ddce':'#cbb7a3');
   c.fillStyle=reveal?'#8faac4':'#b9aa9b';c.beginPath();c.moveTo(0,-120);c.lineTo(23,-144);c.lineTo(35,-112);c.fill();
   ellipse(c,23,-143,6,6,reveal?'#fffaf3':'#d8c8b7');
  }
  if(index===6){ellipse(c,-15,-83,20,13,reveal?'#f7ead8':'#d1c0af');ellipse(c,15,-83,20,13,reveal?'#f7ead8':'#d1c0af');}
  if(reveal){
   if(index===1){c.strokeStyle='#5b5046';c.lineWidth=2;c.beginPath();c.arc(-12,-92,5,.2,2.8);c.moveTo(17,-92);c.arc(12,-92,5,.2,2.8);c.stroke();}
   else{ellipse(c,-12,-95,2.5,3,'#4d3c30');ellipse(c,12,-95,2.5,3,'#4d3c30');}
   ellipse(c,-22,-84,6,3,'#dc99856b');ellipse(c,22,-84,6,3,'#dc99856b');
   if(index===2){
    ellipse(c,0,-82,23,8,'#d68a3d');seam(c,0,-82,20,5,'#ab632f');
    c.fillStyle='#6f9a5b';c.beginPath();c.moveTo(-23,-62);c.lineTo(24,-62);c.lineTo(13,-50);c.lineTo(-18,-52);c.fill();
    c.fillRect(13,-57,10,18);
   }else{
    ellipse(c,0,-85,4,3,'#66503f');
    c.strokeStyle='#6d5140';c.lineWidth=1.3;c.beginPath();c.moveTo(0,-82);c.lineTo(0,-78);c.moveTo(-5,-78);c.quadraticCurveTo(0,-74,5,-78);c.stroke();
   }
  }else{
   c.strokeStyle='#8f7967';c.lineWidth=1.4;c.setLineDash([2,3]);c.beginPath();c.moveTo(-15,-91);c.lineTo(15,-91);c.stroke();c.setLineDash([]);
  }
  seam(c,0,-43,index===3?23:33,34,'#6b514740');
  if(index===0){
   c.fillStyle=reveal?'#d58f80':'#cbb09c';c.beginPath();c.moveTo(0,-37);c.bezierCurveTo(-20,-49,-16,-65,-4,-57);c.quadraticCurveTo(0,-53,4,-57);c.bezierCurveTo(16,-65,20,-49,0,-37);c.fill();
   c.strokeStyle='#fff4df';c.lineWidth=1;c.setLineDash([2,3]);c.stroke();c.setLineDash([]);
  }
  if(index===3){
   c.save();c.translate(17,-34);c.rotate(-.3);c.fillStyle=reveal?'#d78c4a':'#c5a88e';c.beginPath();c.moveTo(-8,-12);c.lineTo(8,-12);c.lineTo(0,15);c.fill();
   c.strokeStyle='#759354';c.lineWidth=3;c.beginPath();c.moveTo(0,-11);c.lineTo(-5,-21);c.moveTo(0,-11);c.lineTo(5,-23);c.stroke();c.restore();
  }
  if(index===6){
   c.fillStyle=reveal?'#f5ce77':'#cbb09c';c.beginPath();
   for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?4:9;c.lineTo(Math.cos(a)*r,-43+Math.sin(a)*r);}
   c.closePath();c.fill();
  }
 }
 c.restore();
}
function drawAsset(id,index){
 const a=art[id];if(!a.w||!a.h)return;
 const c=a.c;c.clearRect(0,0,a.w,a.h);
 const breathe=reduce?0:Math.sin(clock*1.6)*Math.min(2,a.h*.008);
 const size=Math.max(1,Math.min(a.w*.94,a.h*.98));
 lb.assets.draw(c,KEYS[index],a.w/2,a.h/2+breathe,size,size);
}
function drawBackground(){
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=.2;
 const wx=W*.76,wy=H*.06,ww=W*.21,wh=Math.min(140,H*.23);
 ctx.fillStyle=PAL[0];ctx.beginPath();ctx.roundRect(wx,wy,ww,wh,13);ctx.fill();
 ctx.strokeStyle='#dacdbd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(wx+ww*.5,wy+5);ctx.lineTo(wx+ww*.5,wy+wh-5);ctx.moveTo(wx+5,wy+wh*.5);ctx.lineTo(wx+ww-5,wy+wh*.5);ctx.stroke();
 ctx.save();ctx.beginPath();ctx.rect(wx+4,wy+4,ww-8,wh-8);ctx.clip();ctx.strokeStyle='#e4d7ce';ctx.lineWidth=1;
 for(let i=0;i<13;i++){
  const x=wx+5+((i*23)%Math.max(1,ww-10));
  const y=wy+((i*19+(reduce?0:clock*18))%Math.max(1,wh));
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-2,y+8);ctx.stroke();
 }ctx.restore();
 ctx.fillStyle='#c9955f';ctx.fillRect(W*.05,H*.2,3,H*.12);
 ctx.fillStyle='#c9aa80';ctx.beginPath();ctx.moveTo(W*.025,H*.2);ctx.lineTo(W*.015,H*.13);ctx.lineTo(W*.095,H*.13);ctx.lineTo(W*.085,H*.2);ctx.fill();
 ctx.restore();
 ctx.save();ctx.strokeStyle='#b79a8140';ctx.lineWidth=2;ctx.setLineDash([3,6]);
 for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(-20,H*(.76+j*.09));ctx.bezierCurveTo(W*.25,H*(.69+j*.09),W*.7,H*(.87+j*.08),W+20,H*(.79+j*.09));ctx.stroke();}
 ctx.restore();
}
function render(){
 if(!W||!H)return;
 resizeArt();drawBackground();
 if(state==='start')drawAsset('hc',0);
 if(state==='play'||state==='dying'){
  const a=art.toy;if(a.w&&a.h){
   a.c.clearRect(0,0,a.w,a.h);
   const i=question?leader():0;
   drawHero(a.c,a.w/2,a.h*.93,Math.min(a.h*.85,a.w*.68),i,question>=3);
   if(question<8){
    a.c.save();a.c.fillStyle='#fffaf3';
    for(let k=0;k<3;k++){let x=a.w*.2+k*a.w*.3,y=a.h*.8+Math.sin(clock*1.3+k)*3;ellipse(a.c,x,y,5,4,'#fffaf3b0');}
    a.c.restore();
   }
  }
 }
 if(state==='over'){
  if(page===0)drawAsset('result-art',resultIndex);
  if(page===2){drawAsset('friend-art',TYPES[resultIndex].friend);drawAsset('other-art',TYPES[resultIndex].other);}
 }
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(paused)return;
 clock+=dt;acc+=dt;
 while(acc>=STEP){update(STEP);acc-=STEP;}
 render();
}
function up(){pointer=null;}
lb.onPause(p=>{paused=p;last=0;up();});
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(state==='over'&&clock-overAt>.7)start();});
$('rank').addEventListener('click',()=>{
 if(state!=='over')return;
 const r=TYPES[resultIndex];lb.share('나의 위로 인형은 '+r.name+'! '+r.line);
});
$('rp').addEventListener('pointerdown',e=>{
 if(state!=='over'||e.target.closest('button'))return;
 pointer=e.pointerId;swipeX=e.clientX;swipeY=e.clientY;
 try{$('rp').setPointerCapture(e.pointerId);}catch(_){}
});
$('rp').addEventListener('pointerup',e=>{
 if(pointer!==e.pointerId)return;
 const dx=e.clientX-swipeX,dy=e.clientY-swipeY;pointer=null;
 if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))setPage(page+(dx<0?1:-1));
 else if(Math.abs(dx)<10&&Math.abs(dy)<10)setPage(page+1);
});
$('rp').addEventListener('pointercancel',up);
addEventListener('resize',resize);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
