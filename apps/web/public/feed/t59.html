<title>데뷔 포지션 테스트</title>
<style>
:root{
 --bg:#1c1a3a;--paper:#28243e;--ink:#f4f1fb;--acc:#ff5fa2;
 --act:#ff5fa2;--bt:#1c1a3a;--lt:#49334e;--tone:#f4f1fb1f;--c:#e8335a;
 --title-font:ui-rounded,sans-serif;--body-font:ui-rounded,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font)}
button{font-family:var(--title-font);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(var(--tone) 1px,transparent 1.5px) 0 0/10px 10px,var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,14px);padding:calc(14px + var(--lb-safe-top,0px)) calc(16px + var(--lb-safe-right,0px)) calc(16px + var(--lb-safe-bottom,0px)) calc(16px + var(--lb-safe-left,0px))}
h1,h2,p{margin:0;word-break:keep-all}
h1,.ttl,#final{font-family:var(--title-font);font-weight:400;letter-spacing:-.03em}
h1{font-size:clamp(27px,4.7vh,36px);line-height:1.16;text-align:center}
h1 em{font-style:normal;color:var(--acc)}
p{font-size:clamp(15px,2.4vh,17px);line-height:1.45}
.photo{border:3px solid transparent;border-radius:25px;background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(125deg,var(--ink),var(--acc),var(--ink),var(--c),var(--ink)) border-box;box-shadow:5px 6px 0 var(--bt);position:relative;overflow:hidden}
.photo:after{content:"";position:absolute;inset:6px;border:1px solid var(--tone);border-radius:17px;pointer-events:none}
.label{font-size:12px;letter-spacing:.12em;line-height:1.3}
.badge{border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--title-font);background:var(--paper);height:54px;width:54px;font-size:12px;line-height:1.2;flex:none}
.btn{min-height:56px;min-width:136px;border:3px solid var(--ink);border-radius:30px;padding:9px 22px;background:var(--act);color:var(--bt);box-shadow:3px 4px 0 var(--ink);font-size:clamp(17px,2.6vh,20px);flex:none}
.btn:active{box-shadow:1px 1px 0 var(--ink);background:var(--ink)}
#start{padding-top:calc(60px + var(--lb-safe-top,0px));gap:10px}
#start .intro{text-align:center;font-size:clamp(15px,2.4vh,18px)}
#startArt{width:85%;flex:1;min-height:55px;display:flex;align-items:center;justify-content:center}
#startArt .badge{position:absolute;left:12px;top:12px;z-index:2;transform:rotate(-9deg)}
.art{position:relative;display:flex;justify-content:center;align-items:center;min-height:0;overflow:hidden}
.art img{display:block;width:100%;height:100%;min-height:0;object-fit:contain;position:relative;z-index:1}
#startArt img{padding:8px 5px 0}
.art:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 16%,var(--tone),transparent 68%)}
.fallback{display:none;width:80%;height:80%;max-height:100%;border-radius:25%;background:var(--c);color:var(--ink);align-items:center;justify-content:center;font-family:var(--title-font);font-size:clamp(40px,12vh,100px);border:3px solid var(--ink)}
img[data-lb-art-missing]{display:none!important}
img[data-lb-art-missing]+.fallback{display:flex}
#quiz{gap:12px}
#hud{width:85%;display:flex;flex-direction:column;gap:9px;flex:none}
.hudtop{display:flex;align-items:center;justify-content:space-between}
#sc{font-family:var(--title-font);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.hudtop .label{opacity:.8}
#progress{display:flex;gap:5px}
#progress i{height:7px;flex:1;border:1px solid var(--ink);border-radius:2px}
#progress i.past{background:var(--ink)}
#progress i.current{background:var(--acc);border-color:var(--acc)}
#questionCard{width:85%;flex:1;min-height:90px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px}
#questionCard .label{opacity:.8}
#qtext{font-family:var(--body-font);font-weight:400;font-size:clamp(20px,3.5vh,24px);line-height:1.4;position:relative}
#history{display:flex;flex-wrap:wrap;gap:5px;min-height:18px}
#history span{font-size:12px;line-height:1.3;border:1px solid var(--tone);border-radius:6px;padding:4px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#answers{width:85%;display:flex;flex-direction:column;gap:9px;flex:none;padding-bottom:4px}
.opt{min-height:52px;width:100%;display:flex;align-items:center;text-align:left;gap:9px;padding:7px 12px 7px 8px;border-radius:28px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:2px 3px 0 var(--bt);font-family:var(--body-font);font-size:clamp(17px,2.65vh,19px);line-height:1.2}
.opt b{display:flex;align-items:center;justify-content:center;width:29px;height:29px;border-radius:50%;font-weight:400;flex:none;background:var(--ink);color:var(--paper);font-size:16px}
.opt:active,.opt.on{background:var(--lt);border-color:var(--acc);box-shadow:0 0 0 2px var(--tone)}
.opt.on b{background:var(--acc);color:var(--bt)}
.opt.enter{animation:arrival .18s ease-out both}
@keyframes arrival{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
#over{padding:0;display:block}
#rp{width:100%;height:100%;min-height:0}
#rp section{height:100%;min-height:0;overflow:hidden}
.page{height:100%;min-height:0;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,14px);width:100%;max-width:460px;margin:auto}
.resultPhoto{flex:1;min-height:70px;display:flex;flex-direction:column;padding:12px 12px 15px;gap:6px}
.resultPhoto .art{flex:1;min-height:50px}
.resultPhoto .art:before{background:repeating-conic-gradient(from 5deg at 50% 65%,var(--tone) 0 2deg,transparent 2deg 14deg);opacity:.55}
.resultPhoto .label{text-align:center}
#final{font-size:clamp(32px,5.8vh,40px);line-height:1.12;text-align:center;flex:none}
#shareline{text-align:center;font-size:clamp(15px,2.4vh,18px);border-top:1px solid var(--tone);padding-top:8px}
#why{text-align:center;font-size:12px;line-height:1.2}
.pageTitle{font-family:var(--title-font);font-size:clamp(23px,4vh,30px);font-weight:400;text-align:center}
.review{flex:1;min-height:0;padding:clamp(14px,3vh,24px);display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,3vh,25px)}
.review .quote{font-family:var(--title-font);font-size:clamp(25px,5vh,38px);color:var(--acc);line-height:1.2}
#description{display:flex;flex-direction:column;gap:12px}
#description p{font-size:clamp(16px,2.8vh,20px);line-height:1.5}
#chips{display:flex;gap:7px;flex-wrap:wrap}
#chips span{border:2px solid var(--ink);padding:7px 9px;border-radius:8px;font-size:clamp(14px,2.4vh,17px)}
.lb-rec{font-size:clamp(13px,2.2vh,16px);padding:10px 12px;border-top:2px solid var(--tone);line-height:1.4}
#matches{flex:1;min-height:70px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match{padding:10px;min-height:0;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.match .art{flex:1;width:100%;min-height:30px}
.match .label{letter-spacing:0;font-size:13px}
.match strong{font-family:var(--title-font);font-weight:400;font-size:clamp(18px,3vh,23px)}
#matchnote{font-size:clamp(14px,2.4vh,17px);line-height:1.4;text-align:center}
.actions{display:flex;gap:10px;flex:none}
.actions .btn{flex:1;min-width:0;padding:8px 10px}
#rank{background:var(--ink);color:var(--bt)}
#sub{font-size:12px;opacity:.8;text-align:center}
@media(max-height:540px){
 #start{padding-top:calc(16px + var(--lb-safe-top,0px));gap:7px}
 #quiz{gap:8px}
 #questionCard{padding:12px;gap:6px}
 #answers{gap:7px;display:grid;grid-template-columns:1fr 1fr}
 .opt{font-size:16px;min-height:52px;padding:6px;gap:6px}
 .opt b{width:24px;height:24px;font-size:14px}
 #hud{gap:5px}
 #history span{font-size:12px;padding:2px 4px}
 .review{gap:12px;padding:14px}
 #description{gap:7px}
 #description p{font-size:16px;line-height:1.35}
 .page{gap:7px}
 .resultPhoto{padding:8px;gap:4px}
 #shareline{padding-top:4px;font-size:14px}
}
@media(max-height:350px){

<body>
<div id="app">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="start" class="screen">
 <h1>데뷔 <em>포지션</em> 테스트</h1>
 <p class="intro">데뷔 무대 전날, 너의 자리는 어디?</p>
 <div id="startArt" class="photo art" style="--c:#e8335a">
  <div class="badge">데뷔<br>전날</div>
  <img data-lb-art="gen/r1" alt="메인보컬">
  <span class="fallback" aria-hidden="true">메</span>
 </div>
 <button id="go" type="button" class="btn">테스트 시작</button>
</div>
<div id="quiz" class="screen" hidden>
 <div id="hud">
  <div class="hudtop"><b id="sc">1/9</b><span class="label">데뷔 포토카드</span></div>
  <div id="progress" aria-hidden="true"></div>
 </div>
 <div id="questionCard" class="photo">
  <span class="label" id="place">연습실</span>
  <h2 id="qtext"></h2>
  <div id="history" aria-label="포토카드에 모인 선택"></div>
 </div>
 <div id="answers"></div>
</div>
<div id="over" class="screen" hidden>
 <div id="rp">
  <section>
   <div class="page">
    <p id="why">너의 데뷔 포지션이 정해졌어</p>
    <div class="photo resultPhoto">
     <span class="label">나의 데뷔 포토카드</span>
     <div class="art">
      <img id="resultArt" data-lb-art="gen/r1" alt="메인보컬">
      <span class="fallback" id="resultFallback" aria-hidden="true">메</span>
     </div>
     <span class="label">무대 위 내 자리</span>
     <h2 id="final"></h2>
     <p id="shareline"></p>
    </div>
   </div>
  </section>
  <section>
   <div class="page">
    <h2 class="pageTitle">연습실에서 벌써 티 났음!</h2>
    <div class="photo review">
     <span class="label">트레이너의 심사평</span>
     <p class="quote" id="quote"></p>
     <div id="chips"></div>
     <div id="description"></div>
     <p class="lb-rec" id="record"></p>
    </div>
   </div>
  </section>
  <section>
   <div class="page">
    <h2 class="pageTitle">같이 무대 서면 어떰?</h2>
    <div id="matches">
     <div class="photo match">
      <span class="label">호흡 착 붙는 멤버</span>
      <div class="art"><img id="goodArt" data-lb-art="gen/r7" alt="리드댄서"><span class="fallback" id="goodFallback" aria-hidden="true">리</span></div>
      <strong id="goodName"></strong>
     </div>
     <div class="photo match">
      <span class="label">박자 맞춰 갈 멤버</span>
      <div class="art"><img id="badArt" data-lb-art="gen/r6" alt="분위기메이커"><span class="fallback" id="badFallback" aria-hidden="true">분</span></div>
      <strong id="badName"></strong>
     </div>
    </div>
    <p id="matchnote"></p>
    <div class="actions">
     <button id="again" class="btn" type="button">다시 하기</button>
     <button id="rank" class="btn" type="button">결과 공유</button>
    </div>
    <p id="sub">서로 다른 취향도 무대에선 맞춰 가는 중임</p>
   </div>
  </section>
 </div>
</div>
</div>
<script>
lb.ready(()=>{

let W=0,H=0,last=0,clock=0,paused=false,state='start',index=0,lock=0;
let totals=[],answers=[],pending=false,chosen=0,overAt=0,signature=0,lights=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
lb.assets.font('font/cafe24ssurround').then(v=>document.documentElement.style.setProperty('--title-font',v));
lb.assets.font('font/jua').then(v=>document.documentElement.style.setProperty('--body-font',v));
for(let i=0;i<questions.length;i++)$('progress').appendChild(document.createElement('i'));
function resize(){
 W=cv.clientWidth;H=cv.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);
 ctx.setTransform(d,0,0,d,0,0);
 lights=[];
 if(!W||!H)return;
 const cs=getComputedStyle(document.documentElement);
 const color=cs.getPropertyValue('--tone').trim();
 for(let i=0;i<3;i++){
  const g=ctx.createRadialGradient(0,0,0,0,0,Math.max(W,H)*.8);
  g.addColorStop(0,color);g.addColorStop(1,'transparent');lights.push(g);
 }
}
function render(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 for(let i=0;i<lights.length;i++){
  const wave=reduce?0:Math.sin(clock*.23+i*2);
  ctx.save();ctx.translate(W*(.15+i*.35)+wave*W*.09,-H*.1);
  ctx.scale(.6,1.5);ctx.fillStyle=lights[i];ctx.fillRect(-W*2,-H,W*4,H*3);ctx.restore();
 }
}
function hud(){
 $('sc').textContent=(index+1)+'/'+questions.length;
 [...$('progress').children].forEach((el,i)=>el.className=i<index?'past':i===index?'current':'');
}
function reset(){
 index=0;lock=0;totals=Array(8).fill(0);answers=[];pending=false;signature=0;chosen=0;
 $('history').replaceChildren();$('answers').replaceChildren();
}
function showQuestion(){
 const q=questions[index];
 hud();$('place').textContent=q.place;$('qtext').textContent=q.q;
 $('answers').replaceChildren();
 q.a.forEach((a,i)=>{
  const b=document.createElement('button');
  b.type='button';b.className='opt enter';
  const badge=document.createElement('b');badge.textContent=['가','나','다','라'][i];badge.setAttribute('aria-hidden','true');
  const text=document.createElement('span');text.textContent=a[0];
  b.append(badge,text);b.addEventListener('pointerdown',e=>{
   if(e.button!==0)return;pick(i,b,e.clientX,e.clientY);
  });
  b.addEventListener('click',e=>{if(e.detail===0)pick(i,b,W/2,H*.7)});
  $('answers').appendChild(b);
 });
 $('history').replaceChildren();
 answers.slice(-3).forEach(a=>{
  const s=document.createElement('span');s.textContent=a.label;$('history').appendChild(s);
 });
}
function start(){
 reset();state='play';
 $('start').hidden=true;$('over').hidden=true;$('quiz').hidden=false;
 lb.audio.unlock();lb.audio.sfx('sfx/ui-audio/rollover1');
 lb.audio.music('music/oga-chiptunes/level-2',{loop:true,volume:.24});
 showQuestion();
}
function pick(n,button,x,y){
 if(state!=='play'||lock>0||pending)return;
 const a=questions[index].a[n];
 lock=.24;pending=true;button.classList.add('on');
 a[1].forEach(([r,p])=>totals[r]+=p);
 signature=(signature*37+(index+3)*(n+5))>>>0;
 answers.push({label:a[2],weights:a[1]});
 lb.audio.sfx('sfx/ui-audio/rollover1');lb.haptic('light');
 lb.fx.sparkle(x,y);
 if(index===questions.length-1)die();
}
function determine(){
 let candidates=totals.map((v,i)=>({v,i})).filter(a=>a.v===Math.max(...totals)).map(a=>a.i);
 for(let j=answers.length-1;j>=0&&candidates.length>1;j--){
  const weight=r=>{const v=answers[j].weights.find(a=>a[0]===r);return v?v[1]:0};
  const max=Math.max(...candidates.map(weight));
  if(max)candidates=candidates.filter(r=>weight(r)===max);
 }
 return candidates[signature%candidates.length];
}
function die(){
 if(state!=='play')return;
 chosen=determine();state='result';pending=false;lock=0;
 lb.audio.stopMusic();lb.audio.sfx('sfx/digital-audio/zap-three-tone-up');
 lb.haptic('success');
 result();
 lb.fx.sparkle(W*.3,H*.23);lb.fx.sparkle(W*.73,H*.39);lb.fx.confetti();
}
function art(id,fallback,r){
 const img=$(id);
 img.setAttribute('data-lb-art','gen/r'+(r+1));
 img.alt=results[r].name;img.removeAttribute('data-lb-art-missing');
 $(fallback).textContent=results[r].name[0];
 img.closest('.photo').style.setProperty('--c',results[r].color);
}
function result(){
 const r=results[chosen];overAt=clock;
 document.documentElement.style.setProperty('--c',r.color);
 $('quiz').hidden=true;$('over').hidden=false;
 $('final').textContent=r.name;$('shareline').textContent=r.line;
 $('quote').textContent=r.quote;$('chips').replaceChildren();
 r.chips.forEach(c=>{const s=document.createElement('span');s.textContent=c;$('chips').appendChild(s)});
 $('description').replaceChildren();
 r.desc.forEach(t=>{const p=document.createElement('p');p.textContent=t;$('description').appendChild(p)});
 $('record').textContent='내 연습 기록 · '+answers[0].label;
 $('goodName').textContent=results[r.good].name;$('badName').textContent=results[r.bad].name;
 $('matchnote').textContent=r.note;
 art('resultArt','resultFallback',chosen);
 art('goodArt','goodFallback',r.good);
 art('badArt','badFallback',r.bad);
 lb.pages(document.getElementById("rp"), { result: r.name });
}
function update(dt){
 if(state!=='play')return;
 if(lock>0)lock=Math.max(0,lock-dt);
 if(pending&&lock<=0){pending=false;index++;showQuestion()}
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=last?Math.min((now-last)/1000,.08):0;last=now;
 if(paused)return;
 clock+=dt;update(dt);render();
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',()=>{if(clock-overAt>.7)start()});
$('rank').addEventListener('click',()=>lb.share('내 데뷔 포지션은 '+results[chosen].name+'임! 너는 뭐 나옴?'));
lb.onPause(p=>{paused=p;last=0});
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('app'));
resize();requestAnimationFrame(frame);
});
lb.assets.preload();
</script>
