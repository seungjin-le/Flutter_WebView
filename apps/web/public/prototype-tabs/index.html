<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Feedy 프로토타입 v0.4</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-src 'none'; connect-src 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<!-- 임시 LuckyBusTap 탭. 정식 화면 적용 시 이 디렉터리를 삭제해. -->
<style>
:root{
  --accent: oklch(57% 0.22 358);
  --accent-soft: oklch(95% 0.03 358);
  --ink:#16141c; --ink2:#55525e; --ink3:#8d8a96;
  --line:#e9e6ee; --bg:#fbf8f6; --panel:#ffffff;
  --dark:#07060d; --clover:#2e9d5b; --sprout:#7cc576; --gold:#e0a21b;
  --sab:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;background:#ece8ee;color:var(--ink);display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit}
body { display: block; background: var(--bg); }
.phone { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
.screen { position: absolute; inset: 0; overflow: hidden auto; }
.hidden { display: none !important; }
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lvb{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:2px 6px 2px 4px;border-radius:999px;color:#fff;line-height:1.2}
.lvb i{width:12px;height:12px;border-radius:3px;display:inline-block;transform:rotate(45deg);background:currentColor;opacity:.9}
.lv1{background:#9a96a6}.lv2{background:#3b82c4}.lv3{background:#7b4fd6}.lv4{background:#e0592a}.lv5{background:linear-gradient(90deg,#d4a017,#f2c94c);color:#3a2a00}
.adtag{position:absolute;top:56px;left:18px;font-size:11px;font-weight:700;background:#fff;color:#000;padding:3px 7px;border-radius:5px;z-index:4}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:40px auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* play overlay */
.overlay{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.ovtop{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.ovtop .ttl{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:4px;background:var(--line);border-radius:4px;margin:0 16px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.qbody{flex:1;padding:28px 20px;overflow:auto}
.qbody h2{font-size:22px;line-height:1.35;margin-bottom:22px}
.opts{display:grid;gap:10px}
.opts.grid4{grid-template-columns:repeat(4,1fr)}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:left;font-weight:600;font-size:15px;transition:.15s}
.opts.grid4 .opt{text-align:center;padding:14px 4px;font-size:14px}
.opt:active,.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.result{padding:8px 20px 30px;text-align:center}
.result .big{font-size:96px;margin:10px 0}
.result .kicker{font-size:13px;color:var(--ink3);font-weight:600}
.result h2{font-size:26px;margin:4px 0 10px}
.result p.desc{color:var(--ink2);line-height:1.6;font-size:15px;margin-bottom:14px}
.result .same{display:inline-flex;gap:6px;background:var(--accent-soft);color:var(--accent);font-weight:800;padding:8px 14px;border-radius:999px;font-size:14px;margin-bottom:18px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border-radius:14px;font-weight:700;font-size:15px;background:#fff;border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.fine{font-size:12px;color:var(--ink3);line-height:1.5;margin-top:14px}
.dist{text-align:left;margin-top:8px}
.dist .r{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}
.dist .bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.dist .bar i{display:block;height:100%;background:var(--accent)}

/* light pages */
.page{padding:18px 18px 30px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ph h1{font-size:22px;font-weight:800;flex:1}
.brand{display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px;letter-spacing:-.3px}
.brand .logo{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.sec h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec h3 .more{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:600}
.muted{color:var(--ink3);font-size:13px}
.small{font-size:12px}
.warn{font-size:12px;color:#b5651d;background:#fff5e8;border-radius:8px;padding:7px 10px;margin-top:10px}

/* wallet */
.wallet{display:flex;align-items:center;gap:14px}
.wallet .cl{font-size:34px;font-weight:900;display:flex;align-items:center;gap:6px}
.sprbar{flex:1}
.sprbar .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.sprbar .track{height:10px;background:#eef3ec;border-radius:6px;overflow:hidden}
.sprbar .track i{display:block;height:100%;background:var(--sprout);border-radius:6px;transition:width .4s}
.raffle{background:linear-gradient(135deg,#fff 0%,#fff3f8 100%)}
/* raffle v2: 큰 경품 카드 + 카드 안 큰 응모 버튼, 여러 개면 가로 넘김 */
.rfhead{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.rfhead h2{font-size:18px;font-weight:900}
.rfhead .cnt{font-size:12px;font-weight:700;color:var(--ink3)}
.rfhead .more{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:600}
.rfrail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 4px;scroll-padding:0 18px}
.rfrail::-webkit-scrollbar{display:none}
.rfc{flex:0 0 100%;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.rfrail.multi .rfc{flex-basis:calc(100% - 34px)}
.rfc .vis{position:relative;height:200px;display:flex;align-items:center;justify-content:center;font-size:84px;padding-bottom:40px}
.rfc .vn{position:absolute;left:0;right:0;bottom:0;padding:30px 16px 13px;background:linear-gradient(to top,rgba(10,8,18,.62),rgba(10,8,18,.25) 55%,transparent);color:#fff;font-size:18px;font-weight:800;line-height:1.3;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.rfc .vis .logo{width:96px;height:96px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.rfc .dd{position:absolute;top:12px;left:12px;font-size:12px;font-weight:800;background:#fff;color:var(--accent);padding:4px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.rfc .dd.soon{background:var(--accent);color:#fff}
.rfc .win{position:absolute;top:12px;right:12px;font-size:12px;font-weight:800;background:rgba(22,20,28,.75);color:#fff;padding:4px 9px;border-radius:999px}
.rfc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.rfc .nm{font-size:17px;font-weight:800;line-height:1.35}
.rfc .info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0 0 12px;background:#f7f5f8;border-radius:12px;padding:10px 12px}
.rfc .info span{color:var(--ink3)}
.rfc .info b{font-weight:700;text-align:right}
.rfc .mine{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ink2);margin:auto 0 10px}
.rfc .mine b{font-size:18px;font-weight:900;color:var(--ink)}
.rfc .mine i{font-style:normal;margin-left:auto;font-size:12px;color:var(--ink3)}
.rfgo{width:100%;height:56px;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 18px oklch(57% 0.22 358 / .28)}
.rfgo:active{transform:scale(.98)}
.rfgo:disabled{background:#e2dee6;color:var(--ink3);box-shadow:none;cursor:not-allowed}
.rfgo small{font-size:13px;font-weight:700;opacity:.85}
.rfdots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.rfdots i{width:6px;height:6px;border-radius:3px;background:#d8d4dd;transition:.2s}
.rfdots i.on{width:16px;background:var(--ink)}
.raffle .prize{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.raffle .prize .gift{width:56px;height:56px;border-radius:14px;background:#f6e6d6;display:flex;align-items:center;justify-content:center;font-size:30px}
.raffle .dday{font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px;margin-left:auto}
.adrow{display:flex;align-items:center;gap:12px}
.adrow .ic{width:42px;height:42px;border-radius:12px;background:#eef3ec;display:flex;align-items:center;justify-content:center;font-size:20px}
.mission .rep{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:#eef0f6;color:#5a6b8c;margin-right:5px;vertical-align:1px}
.mission .rep.per{background:#fdf0e6;color:#c2621b}
.mission{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mission:first-of-type{border-top:0}
.mission .ic{width:38px;height:38px;border-radius:50%;background:#f3f1f5;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.mission .body{flex:1;min-width:0}
.mission .nm{font-size:14px;font-weight:700;margin-bottom:5px}
.mission .pt{height:5px;background:var(--line);border-radius:4px;overflow:hidden}
.mission .pt i{display:block;height:100%;background:var(--accent)}
.mission .rw{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;font-weight:800}
.tagxp{color:#7b4fd6}.tagsp{color:var(--clover)}
.mhint{font-size:12px;color:var(--ink2);background:#f7f5f8;border-radius:10px;padding:8px 10px;margin:2px 0 4px}
.mhint b{font-weight:800;color:var(--ink)}
.mdot{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;margin-left:3px;padding:0 4px}
.mmore{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:12px 0 2px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.mmore .chev{display:inline-block;font-size:16px;line-height:1;transform:translateY(-3px);transition:transform .2s}
.mmore .chev.up{transform:translateY(3px) rotate(180deg)}
.claim{font-size:12px;font-weight:800;background:var(--accent);color:#fff;border-radius:999px;padding:5px 10px}
.claimed{font-size:12px;font-weight:700;color:var(--ink3)}
.segs{display:flex;gap:6px;margin-bottom:10px}
.seg{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#f1eef3;color:var(--ink2)}
.seg.on{background:var(--ink);color:#fff}

/* me */
.prof{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.prof .ava{width:72px;height:72px;border-radius:50%;background:#f1e9ee;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;position:relative;border:3px solid var(--line)}
.prof .ava .lvb{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%)}
.prof .nm{font-size:20px;font-weight:800}
.lvck{margin-top:6px;background:#f6f3f8;border-radius:12px;padding:8px 10px}
.lvck .h{font-size:12px;font-weight:800;margin-bottom:4px}.lvck .h span{font-weight:600;color:var(--ink3);margin-left:4px}
.lvck .row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:2px 0}
.lvck .row i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);font-style:normal;font-size:9px;display:flex;align-items:center;justify-content:center;color:#fff}
.lvck .row.ok i{background:var(--clover);border-color:var(--clover)}.lvck .row.ok{color:var(--ink3)}
.lvck .row b{margin-left:auto;font-weight:700}
.xpbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 3px}
.xpbar i{display:block;height:100%;background:#7b4fd6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.stats button{padding:12px 0;text-align:center;border-left:1px solid var(--line)}
.stats button:first-child{border-left:0}
.stats b{display:block;font-size:18px;font-weight:800}
.stats span{font-size:12px;color:var(--ink3)}
.tabs2 button small{font-size:12px;font-weight:700;margin-left:3px}
.sumline{font-size:13px;color:var(--ink2);margin-bottom:10px}
.sumline b{font-weight:800;color:var(--ink)}
.clday{font-size:12px;font-weight:700;color:var(--ink3);margin:16px 0 4px}
.clrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.clrow .ic{width:36px;height:36px;border-radius:50%;background:#f3f1f5;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink3);flex:0 0 auto}
.clrow .tx{flex:1;min-width:0}
.clrow .tx b{display:block;font-size:14px;font-weight:700}
.clrow .tx span{font-size:12px;color:var(--ink3)}
.clrow .amt{font-size:15px;font-weight:800;color:var(--ink2)}
.clrow .amt.plus{color:var(--clover)}
.tabs2{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs2 button{flex:1;padding:11px 0;font-weight:700;color:var(--ink3);font-size:14px}
.tabs2 button.on{color:var(--ink);border-bottom:2px solid var(--ink)}
.mylist .it{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.thumb{width:58px;height:58px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto}
.mylist .tt{font-weight:700;font-size:14px;margin-bottom:3px}
.mylist .sm{font-size:12px;color:var(--ink3);line-height:1.5}
.mylist .nx{font-size:12px;color:var(--clover);font-weight:700;margin-top:3px}
.editb{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:6px 8px;white-space:nowrap}
.editb[disabled]{opacity:.45}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex button{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left}
.dex .pic{height:84px;display:flex;align-items:center;justify-content:center;font-size:40px}
.dex .cap{padding:7px 8px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex .cap small{display:block;font-weight:500;color:var(--ink3);font-size:11px}

/* explore */
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.search input{border:0;outline:0;flex:1;background:none;font-size:15px}
.chips{display:flex;gap:6px;margin-bottom:14px;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips::-webkit-scrollbar,.prow::-webkit-scrollbar{display:none}
.chips .seg{flex:0 0 auto}
.search.big{margin-bottom:12px}
.search .x{color:var(--ink3);font-size:13px;font-weight:700}
.exhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.exhead .search{flex:1;margin:0}
.exsec{margin:6px 0 18px}
.exsec h3{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.exsec h3 small{font-size:12px;color:var(--ink3);font-weight:600}
.exsec h3 .more{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:600}
/* portrait test card */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.pcard{text-align:left;display:block;width:100%}
.pcard .pv{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pcard .pv .em{font-size:64px;margin-bottom:34px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.15))}
.pcard .pv .ov{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 10px;background:linear-gradient(to top,rgba(10,8,18,.78),rgba(10,8,18,.35) 60%,transparent);color:#fff}
.pcard .pv .ov b{font-size:14px;font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pv .rk{position:absolute;top:8px;left:8px;min-width:24px;height:24px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 6px}
.pcard .pv .pk{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;background:#fff;color:var(--accent);padding:3px 7px;border-radius:999px}
.pcard .pm{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden}
.pcard .pm b{color:var(--ink2);font-weight:700}
.pcard .pm .nm{overflow:hidden;text-overflow:ellipsis}
.pcard .ct{font-size:11px;font-weight:700;color:var(--ink2);margin-top:2px}
/* creators */
.prow{display:flex;gap:14px;overflow-x:auto;padding-bottom:2px}
.pitem{flex:0 0 auto;width:68px;text-align:center}
.pitem .av,.urow .av{width:60px;height:60px;border-radius:50%;background:#f1e9ee;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;margin:0 auto 6px;border:2px solid var(--line)}
.pitem .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .sub{font-size:11px;color:var(--ink3)}
.urow{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.urow .av{width:48px;height:48px;font-size:18px;margin:0;flex:0 0 auto}
.urow .tx{flex:1;min-width:0}
.urow .tx b{display:flex;align-items:center;gap:6px;font-size:15px}
.urow .tx .lvb{color:#fff;font-size:11px}
.urow .tx span{font-size:12px;color:var(--ink3)}
.fbtn{font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;background:var(--accent);color:#fff;flex:0 0 auto}
.fbtn.on{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw button{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;display:flex;gap:6px;align-items:center}
.kw button i{font-style:normal;color:var(--ink3)}
.rank{list-style:none}
.rank li{display:flex;gap:12px;padding:9px 0;font-size:14px;font-weight:600}
.rank li b{width:16px;color:var(--accent)}
.exempty{text-align:center;padding:36px 10px}
.exempty .btn{margin:14px auto 0;display:inline-flex;padding:12px 16px}
.gcard{border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);text-align:left}
.gcard .pic{height:120px;display:flex;align-items:center;justify-content:center;font-size:52px}
.gcard .cap{padding:9px 10px}
.gcard .cap b{display:block;font-size:13px;margin-bottom:3px;line-height:1.3}
.gcard .cap span{font-size:11px;color:var(--ink3)}

/* notifications */
.noti{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.noti .ic{width:40px;height:40px;border-radius:50%;background:#f3f1f5;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}

function tAgo(t){
  if(!t.at) return agoTxt(t.ago);
  const m=(Date.now()-t.at)/6e4, d=new Date(t.at);
  if(m<1) return '방금'; if(m<60) return `${Math.floor(m)}분 전`; if(m<1440) return `${Math.floor(m/60)}시간 전`;
  if(m<1440*8) return `${Math.floor(m/1440)}일 전`;
  return d.getFullYear()===new Date().getFullYear()?`${d.getMonth()+1}월 ${d.getDate()}일`:`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
}

function doDelCmt(id){
  const {c,parent}=findCmt(id), list=cmts(CM.tid), t=T(CM.tid);
  if(parent) parent.replies=parent.replies.filter(x=>x!==c);
  else if(c.replies&&c.replies.length) c.deleted=true;   // 대댓글이 있으면 자리만 남김
  else list.splice(list.indexOf(c),1);
  t.comments=Math.max(0,t.comments-1); renderComments(); toast('댓글을 삭제했어요');
}
function postComment(){
  const v=$('cin').value.trim(); if(!v) return;
  if(hasBanned(v)){toast('등록할 수 없는 표현이 있어요');return}
  if(/https?:\/\/|www\./i.test(v)){toast('외부 링크는 쓸 수 없어요');return}
  if(Object.values(authors).some(a=>hiddenFor(a.id)&&v.includes('@'+a.name))){toast('언급할 수 없는 유저가 있어요');return}
  const t=T(CM.tid);
  if(CM.edit){
    const {c}=findCmt(CM.edit);
    if(Date.now()-c.ts>300000){toast('작성 후 5분이 지나 수정할 수 없어요');return}
    c.text=v; c.edited=true; CM.edit=null; renderComments(); toast('댓글을 수정했어요'); return;
  }
  const wait=45-Math.floor((Date.now()-(S.lastCmt||0))/1000);
  if(wait>0){toast(`댓글은 45초 간격으로 쓸 수 있어요 (${wait}초 남음)`);return}
  S.lastCmt=Date.now();
  const c={id:'c'+Date.now(),uid:'me',text:v,likes:0,ago:'방금',ts:Date.now(),replies:[]};
  if(CM.reply) findCmt(CM.reply).c.replies.push(c); else cmts(CM.tid).push(c);
  t.comments++; CM.reply=null;

/* ---------- 혜택: 미션 (정책 7.1) ---------- */
const todayOn = m => !m.days||m.days.includes(new Date().getDay());
const nowH = () => {const d=new Date(); return d.getHours()+d.getMinutes()/60};
// 상태: ok 성공 · ing 진행 중 · open 참여 가능 · wait 시간대 전(비활성) · cool 쿨타임 · fail 실패 · got 수령
function mState(m){
  if(m.total&&(m.totalDone||0)>=m.total) return 'got';
  if(m.claimed>=(m.perDay||1)) return 'got';
  if(m.cdUntil&&m.cdUntil>Date.now()) return 'cool';
  if(m.cur>=m.goal) return 'ok';
  if(m.win){const h=nowH(); if(h<m.win[0]) return 'wait'; if(h>=m.win[1]) return 'fail'}
  return m.cur>0?'ing':'open';
}
// 정렬: 성공 → 진행 중 → 참여 가능 → (시간대 전) → 쿨타임 → 실패 → 수령
const MRANK={ok:0,ing:1,open:2,wait:3,cool:4,fail:5,got:6};
// 오늘 더 받을 수 있는 클로버 = 오늘 노출 미션마다 보상 × 오늘 남은 참여 횟수 (시간대가 지난 미션 제외)
function todayLeft(){
  return S.missions.filter(todayOn).reduce((s,m)=>{
    const st=mState(m); if(st==='fail'||st==='got') return s;
    let n=(m.perDay||1)-m.claimed; if(m.total) n=Math.min(n,m.total-(m.totalDone||0));
    return s+m.sp*Math.max(0,n);
  },0);
}
// 활동 하나가 여러 미션의 진행도에 함께 들어감. 필요 횟수는 서로 다른 대상으로 채움(하루 기준, 회차를 넘어도 다시 세지 않음). 공유는 대상을 구분하지 않음
function missionTick(act,key){
  if(S.guest) return;
  let hit=false;
  S.missions.forEach(m=>{
    if(m.act!==act||!todayOn(m)) return;
    if(!['ing','open'].includes(mState(m))) return;
    if(key!=null){ if(m.seen.has(key)) return; m.seen.add(key) }
    m.cur++; if(m.cur>=m.goal) hit=true;
  });
  if(hit) setTimeout(()=>toast('🍀 미션 성공! 혜택 탭에서 클로버를 받아 가세요'),600);
  
}
// 미션 행 (B-01): 아이콘 · 미션명 · 진행 막대(진행 중) · 상태 문구 · 버튼
const MGO={post:'만들기'};
function missionRow(m){
  const st=mState(m), shown=Math.min(m.cur,m.goal), isAd=m.act==='ad';
  const meta=[];
  if(m.rep==='기간') meta.push(m.period);
  if(m.win) meta.push(`${m.win[0]}:00~${m.win[1]}:00`);
  if((m.perDay||1)>1) meta.push(isAd?`하루 ${m.perDay}회`:`${Math.min(m.claimed+1,m.perDay)}/${m.perDay}회차`);
  if(m.total) meta.push(`전체 ${m.totalDone||0}/${m.total}회`);
  const prog=m.unit==='sec'?`${mmss(shown)} / ${mmss(m.goal)}`:`${shown} / ${m.goal}`;
  const cd=m.cdUntil?mmss(Math.max(0,Math.ceil((m.cdUntil-Date.now())/1000))):'';
  const sub={
    ok:[...meta,'성공'],
    ing:isAd?[...meta,'진행 중']:[prog,...meta,'진행 중'],
    open:[...meta,'참여 가능'],
    wait:[`${m.win?m.win[0]:''}시부터 참여할 수 있어요`],
    cool:[`<span data-cd="${m.cdUntil}">${cd}</span> 뒤에 다시 할 수 있어요`],
    fail:[...meta,'실패'],
    got:[...meta,'받음'],
  }[st].join(' · ');
  const bar=st==='ing'&&!isAd?`<span class="bar"><i style="width:${shown/m.goal*100}%"></i></span>`:'';
  const btn={
    ok:`<button class="act get" onclick="claim('${m.id}')">받기 +${m.sp}</button>`,
    ing:`<button class="act ${isAd?'ad':'go'}" onclick="mGo('${m.id}')">${isAd?'광고 보기':'이어하기'}</button>`,
    open:`<button class="act ${isAd?'ad':'go'}" onclick="mGo('${m.id}')">${isAd?'광고 보기':(MGO[m.act]||'바로가기')}</button>`,
    wait:`<span class="act off">${m.win?m.win[0]:''}시 시작</span>`,
    cool:`<span class="act off" data-cd="${m.cdUntil}">${cd}</span>`,
    fail:'<span class="act off">실패</span>',
    got:'<span class="act off">받음</span>',
  }[st];
  return `<div class="ms ${st} ${['wait','fail','got'].includes(st)?'faded':''}"><span class="ic">${m.ic}</span>
    <span class="bd"><span class="nm">${m.nm}</span>${bar}<span class="sb">${sub}</span></span>${btn}</div>`;
}
// 버튼 액션(랜딩): 활동에 따라 정해진 화면으로 이동
function mGo(id){
  const m=S.missions.find(x=>x.id===id);
  ({play:()=>go('home'),comment:()=>go('home'),like:()=>go('home'),share:()=>go('home'),browse:()=>go('home'),
    post:()=>startCreate(),follow:()=>go('explore'),ad:()=>watchAd(m),link:()=>openLink(m),
    visit:()=>{if(m.target==='dex'){S.meTab='dex';go('me')}else go(m.target)}})[m.act]();
}
// 보상을 받으면 진행도 0. 하루 2회 이상이면 받은 시점부터 쿨타임
function claim(id){
  const m=S.missions.find(x=>x.id===id); if(mState(m)!=='ok') return;
  m.claimed++; m.cur=0; if(m.total) m.totalDone=(m.totalDone||0)+1;

}

function prizeVis(r){return r.logo?`<span class="plogo" style="background:${r.logoBg}">${r.logo}</span>`:`<span class="pem">${r.emoji}</span>`}
function raffleCard(r){

    <span class="ft"><span class="t"><span>총 ${fmt(r.total)}회 · <b>내 응모 ${r.entries}회</b></span><span>응모 후 취소할 수 없어요</span></span><span class="go">응모 · 🍀 ${r.cost}</span></span>
  </button>`;

// 로또형(가칭): 경품 등급은 내부 관리용, 유저에게는 지금 경품 이름만 (정책 7.3.2.4)
function lottoTier(L){let k=0; L.tiers.forEach((t,i)=>{if(L.acc>=t.at) k=i}); return k}
function lottoFill(L){
  const t=L.tiers, k=lottoTier(L);
  if(k>=t.length-1) return 100;
  return (k+(L.acc-t[k].at)/(t[k+1].at-t[k].at))/(t.length-1)*100;
}
function lottoCard(){
  const L=S.lotto, k=lottoTier(L);
  return `<button class="pzc" onclick="openLotto()">
    <span class="v" style="background:#ece9fb"><span class="pem">🎟️</span><span class="bdg">로또형 (가칭) · ${dd(L.dday)}</span><b>로또형 · ${L.kind} ${L.tiers[k].n}</b><span class="gbar"><i style="width:${lottoFill(L)}%"></i></span></span>
    <span class="ft"><span class="t"><span>누적 참여 ${fmt(L.acc)}회 · <b>내 응모 ${L.entries}회</b></span><span>참여할수록 경품이 좋아져요</span></span><span class="go">응모 · 🍀 ${L.cost}</span></span>
  </button>`;
}
function prizeSection(){
  const todo=S.wins.some(w=>w.result==='win'&&!w.filled);

}

// capLeft: 이번 회차에 더 응모할 수 있는 횟수 (null = 제한 없음)
function entryBar(cost,capLeft,onEnter){
  if(capLeft!=null&&capLeft<=0) return `<div class="ebar"><div class="short"><b>이번 회차 응모를 다 했어요</b><span>결과 발표를 기다려 주세요</span></div></div>`;
  if(S.clover<cost) return `<div class="ebar"><div class="row"><div class="short" style="flex:1"><b>클로버가 ${cost-S.clover}개 부족해요</b><span>보유 ${S.clover}개 · 1회 응모에 ${cost}개</span></div><button class="btn accent" onclick="goMissions()">클로버 모으기</button></div></div>`;
  const max=Math.min(Math.floor(S.clover/cost),capLeft==null?Infinity:capLeft);
  const n=Math.min(Math.max(1,S.entN||1),max); S.entN=n;
  return `<div class="ebar">
    <div class="row"><div><div class="lb">응모 횟수</div><div class="lft">남는 클로버 ${S.clover}개 → ${S.clover-n*cost}개</div></div>
      <div class="step"><button aria-label="한 번 줄이기" ${n<=1?'disabled':''} onclick="setEnt(${n-1})">−</button><b aria-live="polite">${n}</b><button aria-label="한 번 늘리기" ${n>=max?'disabled':''} onclick="setEnt(${n+1})">+</button><button class="mx" ${n>=max?'disabled':''} onclick="setEnt(${max})">최대</button></div></div>
    <button class="btn accent block" onclick="${onEnter}">${n}회 응모하기 · 🍀 ${n*cost}</button></div>`;
}

// 응모 1회마다 번호 1줄(6개) 자동 발급
function enterLotto(){
  const L=S.lotto, n=S.entN||1;

  S.entN=1; toast(`${n}회 응모했어요 · 내 응모 ${L.entries}회`); rerenderEntry();
}

      let h=2166136261; for(const c of id){h^=c.charCodeAt(0);h=Math.imul(h,16777619)} h^=h>>>13; h=Math.imul(h,0x5bd1e995)>>>0; h^=h>>>15; h>>>=0;
      const nm=`${FADJ[h%12]} ${FANI[(h>>>4)%12]}${(h>>>8)%90+10}`;
      authors[id]={id,name:nm,lv:(h>>>3)%11,followers:(h>>>5)%400,following:(h>>>7)%120,initial:nm[0],fake:true};
    }
    ids.push(id);
  }
  return ids;
}
function peopleIds(uid,kind){
  if(kind==='following'&&uid==='me') return followingIds('me');
  const total=kind==='followers'?followerCount(uid):followingCount(uid);
  const real=realIds(uid).slice(0,Math.min(kind==='followers'?4:3,total));
  return [...real,...fakeIds(uid,kind,Math.max(0,total-real.length))];
}

  sheet(`<h3>이의 제기</h3><p class="muted" style="margin-bottom:10px">제재가 잘못됐다고 생각하는 이유를 적어 주세요. 제재 1건당 1번 신청할 수 있고, 영업일 7일 안에 답해 드려요.</p>
    <textarea style="width:100%;height:110px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit" placeholder="예: 비하하려는 뜻이 아니었어요"></textarea>
    <button class="btn accent block" style="margin-top:10px" onclick="S.appeals.unshift({what:'생성·댓글 제한 7일',when:'오늘',st:'접수'});closePop();toast('이의 제기를 접수했어요. 고객센터에서 확인할 수 있어요');if(S.tab==='more')renderMore()">신청하기</button>`);
}
function confirmLogout(){
  modal(`<h3>로그아웃할까요?</h3><div class="btnrow"><button class="btn" onclick="closePop()">취소</button><button class="btn primary" onclick="toGuest();showLogin()">로그아웃</button></div>`);
}
/* 탈퇴 (정책 8.1): 클로버·레벨·응모 중 경품·미입력 당첨은 사라지고, 콘텐츠·댓글은 '탈퇴한 유저'로 남음 */
function withdrawModal(){
  const live=S.raffles.reduce((a,r)=>a+r.entries,0)+S.lotto.entries, unclaimed=S.wins.filter(w=>w.result==='win'&&!w.filled).length;
  modal(`<h3>정말 탈퇴할까요?</h3>
    <div class="loss">🍀 클로버 ${S.clover}개<br>⭐ Lv.${S.lv} 레벨과 진행 상황<br>🎁 응모 중인 경품 응모 ${live}회<br>📦 정보를 입력하지 않은 당첨 ${unclaimed}건</div>
    <p style="text-align:left">위 내용은 <b>모두 사라지고 복구할 수 없어요.</b><br>내가 만든 콘텐츠와 댓글은 지워지지 않고 '탈퇴한 유저'로 남아요.</p>
    <button class="ck" onclick="this.classList.toggle('on');$('wgo').disabled=!this.classList.contains('on')"><i>✓</i>위 내용을 확인했어요</button>
    <div class="btnrow" style="margin-top:12px"><button class="btn" onclick="closePop()">취소</button><button class="btn primary" id="wgo" disabled onclick="toGuest();showLogin();toast('탈퇴했어요')">탈퇴</button></div>`);
}

/* ---------- 로그인 · 가입 (정책 1.1) ---------- */
// 비회원: 유형 도감은 기기에 임시 저장하고, 가입하면 계정으로 옮김
function toGuest(){
  S.guest=true; S.dex=[]; S.guestNudged=false;
  S.tab=null; currentTab=null; routeEntry=null; entryViews.clear();
  document.querySelectorAll('.screen').forEach(el=>el.classList.add('hidden'));
  sendToHost({type:'prototype-guest',guest:true});
}
const LG={c:{}};
const CONSENTS=[['age','[필수] 만 14세 이상이에요',1],['tos','[필수] 이용약관 동의',1],['priv','[필수] 개인정보 수집·이용 동의',1],['mkt','[선택] 광고성(혜택·이벤트) 알림 수신 동의',0],['night','[선택] 야간 알림 수신 동의 (21시~다음 날 8시)',0]];
function showLogin(){
  clearGuestGate();
  closePop();
  layer.innerHTML=`<div class="login"><div class="hero"><div class="logo">F</div><h2 style="font-size:24px;font-weight:900">Feedy</h2><p class="muted">AI로 만드는 심리테스트</p></div>
    ${['카카오로 시작하기','네이버로 시작하기','구글로 시작하기','Apple로 시작하기'].map(l=>`<button class="sbtn" onclick="LG.c={};LG.via='${l.split('로')[0].replace('Apple','애플')}';showConsent()">${l}</button>`).join('')}
    <button class="muted" style="margin-top:6px" onclick="if(!S.guest)toGuest();closeLayer();go('home')">로그인 없이 둘러보기</button></div>`;
}
function showConsent(){
  const c=LG.c, req=CONSENTS.filter(x=>x[2]).every(x=>c[x[0]]), all=CONSENTS.every(x=>c[x[0]]);
  layer.innerHTML=`<div class="login"><h2 style="font-size:22px;font-weight:900;margin:20px 0 6px">약관에 동의해 주세요</h2><p class="muted" style="margin-bottom:16px">만 14세 이상만 가입할 수 있어요. 알림 수신은 설정에서 언제든 바꿀 수 있어요</p>
    <button class="ck all ${all?'on':''}" onclick="consentAll()"><i>✓</i>모두 동의할게요</button>
    ${CONSENTS.map(([k,l])=>`<button class="ck ${c[k]?'on':''} ${k==='night'&&!c.mkt?'dis':''}" onclick="consentToggle('${k}')"><i>✓</i>${l}${k==='age'?'':'<em>보기</em>'}</button>`).join('')}
    <div style="flex:1"></div>
    <button class="btn accent block" ${req?'':'disabled'} onclick="finishSignup()">시작하기</button></div>`;
}
function consentToggle(k){LG.c[k]=!LG.c[k]; if(k==='mkt'&&!LG.c.mkt) LG.c.night=false; showConsent()}
function consentAll(){const all=CONSENTS.every(x=>LG.c[x[0]]); CONSENTS.forEach(x=>LG.c[x[0]]=!all); showConsent()}
function finishSignup(){
  const moved=new Set(S.dex.map(d=>d.tid+':'+d.r)).size, wasGuest=S.guest;
  S.guest=false; S.set.mkt=!!LG.c.mkt; S.set.night=!!LG.c.night; if(LG.via&&!S.logins.includes(LG.via)) S.logins=[LG.via];
  sendToHost({type:'prototype-guest',guest:false});
  S.resultN=0;                       // 가입 후 첫 결과에는 전면 광고를 띄우지 않음
  closeLayer(); go('home');
  toast(wasGuest&&moved?`비회원일 때 모은 유형 ${moved}개를 계정으로 옮겼어요`:S.set.mkt?`${today()} 광고성 알림 수신에 동의했어요`:'환영해요! 콘텐츠를 둘러보세요');
}

function recordActivity(message){
  if (message.act==='browse') {
    if (S.guest || !Number.isFinite(message.seconds)) return;
    const m=S.missions.find(m=>m.id==='brw');
    if (!['open','ing'].includes(mState(m))) return;
    const next=Math.min(m.goal,Math.floor(message.seconds));
    if (next<=m.cur) return;
    m.cur=next;
  } else {
    const t=tests.find(item=>item.id===message.id);
    if (!t) return;
    if (message.act==='result') {
      const r=t.results.findIndex(result=>result.id===message.resultId);
      if (r<0) return;
      S.dex=[{tid:t.id,r,at:'방금'}, ...S.dex.filter(item=>item.tid!==t.id)];
      if (!S.guest) {
        if (S.played[t.id]===undefined) prog('played');
        S.played[t.id]=r;
        t.done++;
        missionTick('play',t.id);
      }
      if (active && S.tab==='me') keepScr('me',renderMe);
    } else if (!S.guest && (message.act==='like' || message.act==='share')) {
      missionTick(message.act, message.act==='like' ? t.id : undefined);
    } else return;
  }
  if (active && S.tab==='benefit') keepBen();
}
// Store view state by browser history entry. Balance, submissions and account settings stay live.
let routeEntry=null;
const entryViews=new Map();
const viewFields=['moreView','meTab','missionOpen','tip','cloverFilter','entN','rfId','pfUid','pfTab','backTab'];
function sameView(a,b){
  return a?.tab===b.tab && a.detail===b.detail && a.raffleId===b.raffleId;
}
function saveView(){
  const region=$(S.tab);
  if(!routeEntry || !region) return;
  entryViews.set(routeEntry.key,{
    ...routeEntry, screen:S.tab, top:region.scrollTop,
    fields:Object.fromEntries(viewFields.map(key=>[key,S[key]])),
    search:{mode:ex.mode,q:ex.q,last:ex.last,tab:ex.tab,sort:ex.sort,picks:ex.picks},
    people:{...PL},
  });
}
function applyTabRoute(data) {
  const {tab}=data, detail=data.detail??null, key=data.entryKey??tab;
  if (typeof key!=='string') return;
  if (detail!==null && !(detail==='settings' && tab==='profile') &&
      !(['raffle','history'].includes(detail) && tab==='benefits')) return;
  const entry={key,tab,detail,raffleId:detail==='raffle'?data.raffleId:undefined};
  if (routeEntry?.key===key && sameView(routeEntry,entry)) return;
  if (detail==='raffle' && !S.raffles.some(r=>r.id===entry.raffleId)){
    sendToHost({type:'prototype-invalid-raffle',raffleId:entry.raffleId});
    return;
  }
  saveView();
  const cached=entryViews.get(key);
  const previous=sameView(cached,entry)?cached:null;
  routeEntry=entry; currentTab=tab;
  if(previous) {
    Object.assign(S,previous.fields);
    Object.assign(ex,previous.search);
    Object.assign(PL,previous.people);
  } else if(detail==='raffle'){
    S.rfId=entry.raffleId;
    S.entN=1;
  } else if(detail==='history') S.cloverFilter='전체';
  else if(detail==='settings') S.moreView='settings';
  const screen=previous?.screen ?? ({raffle:'raffle',history:'clover',settings:'more'}[detail] || screenForTab[tab]);
  showScreen(screen,{restore:previous!==null});
  const region=$(screen), top=previous?.top ?? 0;
  region.scrollTop=top;
  // The outer menu can resize this scroll area when returning from a full detail screen.
  if (region.scrollTop!==top) requestAnimationFrame(()=>{
    if(routeEntry===entry && S.tab===screen) region.scrollTop=top;
  });
  if(jumpToMissions) {
    jumpToMissions=false;
    if(screen==='benefit') goMissions();
  }
}
document.addEventListener('visibilitychange',syncClock);
window.addEventListener('message',event=>{
  if (window===parent || event.source!==parent || event.origin!==hostOrigin) return;
  if (event.data?.type==='prototype-activity') return recordActivity(event.data);
  if (event.data?.type!=='prototype-tab') return;
  const tab=event.data.tab;
  if (tab==='inactive') {
    active=false;
    if (!document.hidden && guestReturn) closeLayer();
    reportedFull=undefined;
    if (layer.querySelector('.adplayer')) closeLayer();
    syncClock();
    return;
  }
  if (typeof tab!=='string' || !Object.hasOwn(screenForTab,tab)) return;
  active=true;
  if (S.guest && tab!=='explore') {
    if (!guestReturn && !layer.querySelector('.login')) guard(event.data.returnTab==='explore' ? 'explore' : 'home');
    reportLayout();
    syncClock();
    return;
  }
  if (guestReturn) closeLayer();
  applyTabRoute(event.data);
  reportLayout();
  syncClock();
});
sendToHost({type:'prototype-ready'});
sendToHost({type:'prototype-guest',guest:S.guest});
</script>
